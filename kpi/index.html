<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>RRB · Daily KPI &amp; Innovation Tracker</title>
<link rel="icon" href="../favicon.svg"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#F7F5EF;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#1F2433}
  textarea,input,select,button{font-family:inherit}
  textarea{resize:vertical}
  a{color:inherit}
  @media print{
    .noprint{display:none!important}
    body{background:#fff}
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// The branch reads this on three things: a phone at a desk, a tablet in a
// meeting, and a laptop for the reports. Same app, three shapes — the phone
// layout stretched across a monitor wastes the room the reports need.
function useViewport(){
  const read=()=>{
    const w=typeof window!=="undefined"?window.innerWidth:560;
    return {w,phone:w<680,tablet:w>=680&&w<1024,desktop:w>=1024,wide:w>=680};
  };
  const [v,setV]=useState(read);
  useEffect(()=>{
    let f=null;
    const on=()=>{ if(f) cancelAnimationFrame(f); f=requestAnimationFrame(()=>setV(read())); };
    window.addEventListener("resize",on);
    window.addEventListener("orientationchange",on);
    return()=>{ window.removeEventListener("resize",on);
                window.removeEventListener("orientationchange",on);
                if(f) cancelAnimationFrame(f); };
  },[]);
  return v;
}

// Grid that fills the width it is given rather than a fixed column count.
const autoGrid=(min,gap)=>({display:"grid",gap:gap||12,
  gridTemplateColumns:"repeat(auto-fit,minmax("+min+"px,1fr))"});

// ===========================================================================
//   Paste the Apps Script /exec URL here after deploying apps-script/KPI.gs.
//   Deploy > New deployment > Web app > Execute as Me > Access: Anyone.
// ===========================================================================
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxehQUxHeTntM3K7x1GFIJ5bX66QVurol0rSQvIBTRBQpFT3LwvClCAOm6jiTW5tflDdg/exec";
// ===========================================================================

const NAVY="#16264F",NAVY_DEEP="#0D1838",GOLD="#C7A34A",GOLD_SOFT="#E7D9AE",
  PAPER="#F7F5EF",CARD="#FFFFFF",INK="#1F2433",MUTED="#6A7180",
  GREEN="#2C7A57",AMBER="#B0791C",RED="#AE3A33",LINE="#E5E1D6";

// ---------------------------------------------------------------------------
//  Who does what. The Access tab in the workbook decides who may sign in;
//  this map carries the things the tab does not hold — grade, which function
//  list to show, and the shift a person works.
// ---------------------------------------------------------------------------
const PROFILES = {
  sasha:     {grade:"Sales Support Assistant · G3",      role:"ssa", tenure:"experienced"},
  azariah:   {grade:"Sales Support Assistant · G3",      role:"ssa", tenure:"probation"},
  ashley:    {grade:"Sales Support Assistant · G3",      role:"ssa", tenure:"training"},
  kamla:     {grade:"Branch Manager's Assistant · G4",   role:"bma", tenure:"experienced"},
  elizabeth: {grade:"Branch Manager's Assistant · G4",   role:"bma", tenure:"training"},
  ricky:     {grade:"Branch Manager",                    role:"bm",  tenure:"experienced"},
  kerwyn:    {grade:"Assistant Branch Manager",          role:"abm", tenure:"experienced"},
  akaash:    {grade:"Unit Manager",                      role:"um",  tenure:"experienced"},
  gary:      {grade:"Unit Manager",                      role:"um",  tenure:"experienced"},
};
const DEFAULT_PROFILE = {grade:"Branch Team", role:"ssa", tenure:"experienced"};

// The Access tab is the authority on who somebody is. PROFILES only supplies
// what the sheet does not carry, and covers anyone not yet described there.
let ROSTER_ROLES = {};
const profileFor=(staffId)=>{
  const base=PROFILES[staffId]||DEFAULT_PROFILE;
  const fromSheet=ROSTER_ROLES[staffId];
  return fromSheet?{...base,role:fromSheet.role||base.role,
                    grade:fromSheet.grade||base.grade}:base;
};

// The KPI list is served by the script: the ten Salesforce Task_Type__c values
// first — those carry live numbers — then the job-document responsibilities
// Salesforce does not track, which are logged in words only.
let KPI_CHOICES={ssa:[],bma:[],bm:[],abm:[],um:[]};
const fnFor=(role)=>(KPI_CHOICES[role]||KPI_CHOICES.ssa||[]);

const STANDARDS=["Completed applications to Head Office within 2 days of receipt.","Policy documents processed with 100% accuracy.","Documents to the relevant party within 1 day of receipt.","A rolled due date is not an actioned task — log the genuine blocker + owner.","\"Waiting on someone\" needs a named person and the date last chased.","Value Added is logged every day — even if the honest entry is \"None today\"."];

// The four blocks, in order. Their times and what each is for come from the
// branch schedule the Apps Script serves — the same DILO the BMA has been
// emailing out every morning. One copy, held where the reports read it.
const BLOCK_ORDER=[{id:"kpi1",col:"KPI1",label:"KPI 1"},{id:"kpi2",col:"KPI2",label:"KPI 2"},
  {id:"pm1",col:"PM1",label:"Afternoon 1"},{id:"pm2",col:"PM2",label:"Afternoon 2"}];
const BLOCKS=BLOCK_ORDER;
let SCHEDULE={};
const schedFor=(staffId)=>SCHEDULE[staffId]||null;
const blockSched=(staffId,col)=>{const s=schedFor(staffId);return (s&&s.blocks&&s.blocks[col])||{};};
// Each block carries its own time and focus for this person.
const blocksFor=(staffId)=>BLOCK_ORDER.map(b=>{
  const sc=blockSched(staffId,b.col);
  return {...b,time:sc.time||"",focus:sc.focus||"",kpi:sc.kpi||""};
});
// Blocks 1–3 are behind you at the 3pm cut; the last one is still running.
const CHECKPOINT_BLOCKS=3;

// ---------------------------------------------------------------------------
//  Dates
// ---------------------------------------------------------------------------
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const prettyDate=(iso)=>!iso?"":new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const shortDate=(iso)=>!iso?"":new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const dowShort=(iso)=>!iso?"":new Date(iso+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"});
const shiftDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const weekStartOf=(iso)=>{const d=new Date(iso+"T00:00:00");const dow=d.getDay();return shiftDays(iso,-(dow===0?6:dow-1));};
const weekDaysOf=(mon)=>[0,1,2,3,4].map(i=>shiftDays(mon,i));

const num=(v)=>(v===""||v==null||isNaN(Number(v))?null:Number(v));
const txt=(v)=>String(v==null?"":v).trim();
const isRealVA=(v)=>{const s=txt(v).toLowerCase();return !!s&&s!=="none today"&&s!=="none"&&s!=="n/a"&&s!=="na"&&s!=="-";};

const blankBlock=()=>({kpi:"",actioned:"",resolved:"",openOwned:"",blocker:"",blockerOwner:"",tr_trainee:"",tr_topic:"",tr_objectives:"",tr_achieved:"",tr_test:"",tr_result:"",tr_followup:""});
const blankEntry=(staffId,date)=>({staffId,date,submitted:false,blocks:BLOCKS.reduce((a,b)=>{a[b.id]=blankBlock();return a;},{}),metrics:{closed:"",overdue:"",aged60:""},valueAdded:"",innovation:"",systemFlags:"",notes:""});

const configured=()=>APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf("PASTE_")!==0;

// ---------------------------------------------------------------------------
//  Talking to the sheet
//  Everything goes through POST so the reply can actually be read. The old
//  version posted with no-cors, which returns an opaque response — the Submit
//  button could never tell whether the save landed, so it always claimed it had.
// ---------------------------------------------------------------------------
async function api(action, payload){
  if(!configured()) return {ok:false,error:"No Apps Script URL set in this file."};
  try{
    const res=await fetch(APPS_SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,...payload})
    });
    if(!res.ok) return {ok:false,error:"Server returned "+res.status+"."};
    const text=await res.text();
    try{ return JSON.parse(text); }
    catch{ return {ok:false,error:"Unreadable reply from the sheet. Re-deploy the Apps Script with access set to Anyone."}; }
  }catch(e){
    return {ok:false,error:"Could not reach the sheet. Check your connection."};
  }
}

const TOKEN_KEY="rrb_kpi_token";
const readStoredToken=()=>{try{return localStorage.getItem(TOKEN_KEY)||"";}catch{return"";}};
const storeToken=(t)=>{try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY);}catch{}};

// A sheet row becomes an entry the form understands.
function rowToEntry(row){
  const g=(k)=>row[k]!=null?String(row[k]):"";
  const blk=(p)=>{
    const raw=g(p+"_Blocker");let blocker=raw,owner="";
    if(raw.indexOf(" · ")>-1){const parts=raw.split(" · ");blocker=parts[0];owner=parts.slice(1).join(" · ");}
    return {...blankBlock(),kpi:g(p),actioned:g(p+"_Actioned"),resolved:g(p+"_Resolved"),openOwned:g(p+"_Open"),blocker,blockerOwner:owner};
  };
  let date=g("Date"); if(date&&date.indexOf("T")>-1)date=date.slice(0,10);
  const at={}; BLOCK_ORDER.forEach(b=>{at[b.id]=g(b.col+"_At");});
  return {staffId:g("StaffId"),date,name:g("Name"),grade:g("Grade"),blockAt:at,
    submitted:g("Status")==="Submitted",
    blocks:{kpi1:blk("KPI1"),kpi2:blk("KPI2"),pm1:blk("PM1"),pm2:blk("PM2")},
    metrics:{closed:g("Closed"),overdue:g("Overdue"),aged60:g("Aged60")},
    valueAdded:g("ValueAdded"),innovation:g("Innovation"),systemFlags:g("SystemFlags"),
    notes:g("Notes"),updatedAt:g("UpdatedAt")};
}
// A block whose KPI is still blank gets the one the schedule says it is for,
// so opening a block is a confirmation rather than a blank page. Anything the
// person has already chosen — or already reported — is left exactly as it is.
function withSchedule(entry,staffId){
  if(!entry) return entry;
  const blocks={...entry.blocks};
  BLOCK_ORDER.forEach(b=>{
    const cur=blocks[b.id]||blankBlock();
    if(txt(cur.kpi)) return;
    const want=blockSched(staffId,b.col).kpi;
    if(want) blocks[b.id]={...cur,kpi:want,prefilled:true};
  });
  return {...entry,blocks};
}

// A day's training lives in its own register. Put it back on the form when the
// day is re-opened — submitting again rewrites those rows from what is on
// screen, so anything not loaded back would be erased.
const BLOCK_COL={kpi1:"KPI1",kpi2:"KPI2",pm1:"PM1",pm2:"PM2"};
function withTraining(entry,training){
  if(!entry||!training||!training.length) return entry;
  const mine=training.filter(t=>t.StaffId===entry.staffId&&String(t.TrainingDate||"").slice(0,10)===entry.date);
  if(!mine.length) return entry;
  const blocks={...entry.blocks};
  mine.forEach(t=>{
    const bid=Object.keys(BLOCK_COL).find(k=>BLOCK_COL[k]===String(t.Block||"").trim());
    if(!bid||!blocks[bid]) return;
    blocks[bid]={...blocks[bid],
      tr_trainee:String(t.Trainee||""),tr_topic:String(t.Topic||""),
      tr_objectives:String(t.Objectives||""),tr_achieved:String(t.Achieved||""),
      tr_test:String(t.Test||""),tr_result:String(t.Result||""),
      tr_followup:String(t.Followup||"")};
  });
  return {...entry,blocks};
}
const blockWorked=(e,bid)=>{
  if(txt(e?.blockAt?.[bid])) return true;             // it was submitted
  const d=e?.blocks?.[bid]; if(!d) return false;
  if(txt(d.actioned)||txt(d.resolved)||txt(d.openOwned)) return true;
  return txt(d.kpi)&&!d.prefilled;                    // a KPI they chose, not one we did
};
const blocksDone=(e)=>BLOCK_ORDER.reduce((n,b)=>n+(blockWorked(e,b.id)?1:0),0);
const blockTime=(e,bid)=>{
  const raw=txt(e?.blockAt?.[bid]); if(!raw) return "";
  const d=new Date(raw); if(isNaN(d.getTime())) return "";
  return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
};
const blockersOf=(e)=>BLOCKS.map(b=>({b,d:e.blocks?.[b.id]})).filter(x=>x.d&&(txt(x.d.blocker)||txt(x.d.blockerOwner)))
  .map(x=>({block:x.b.label,kpi:x.d.kpi||"",text:[txt(x.d.blocker),txt(x.d.blockerOwner)].filter(Boolean).join(" · ")}));
const trainingCount=(e)=>BLOCKS.reduce((n,b)=>n+((e.blocks?.[b.id]?.kpi)==="Training delivered"?1:0),0);

function ShieldLogo({size=34}){return(
  <svg width={size} height={size} viewBox="0 0 48 52" fill="none">
    <path d="M24 2 L44 9 V25 C44 38 35 46 24 50 C13 46 4 38 4 25 V9 Z" fill={NAVY} stroke={GOLD} strokeWidth="2.5" strokeLinejoin="round"/>
    <path d="M24 7 L39 12 V25 C39 35 32 41 24 44.5 C16 41 9 35 9 25 V12 Z" fill="none" stroke={GOLD} strokeWidth="1" opacity="0.55"/>
    <path d="M15 25 L21.5 32 L34 18" fill="none" stroke={GOLD} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>);}

// ===========================================================================
//  App
// ===========================================================================
function App(){
  const vp=useViewport();
  const [booting,setBooting]=useState(true);
  const [token,setToken]=useState(readStoredToken());
  const [me,setMe]=useState(null);          // {staffId,name,email,manager}
  const [roster,setRoster]=useState([]);
  const [view,setView]=useState("home");
  const [active,setActive]=useState(null);  // staffId being viewed/edited
  const [date,setDate]=useState(todayISO());
  const [entry,setEntry]=useState(null);
  const [rows,setRows]=useState([]);
  const [training,setTraining]=useState([]);
  const [metrics,setMetrics]=useState(null);
  const [needsReason,setNeedsReason]=useState({});
  const [billing,setBilling]=useState({});
  const [waiting,setWaiting]=useState(null);
  const [loading,setLoading]=useState(false);
  const [blockState,setBlockState]=useState({});   // per block: idle|saving|ok|bad
  const [dayState,setDayState]=useState({tone:"idle",text:""});
  const [openBlock,setOpenBlock]=useState(null);
  const [reviewDate,setReviewDate]=useState(todayISO());
  const [weekOf,setWeekOf]=useState(weekStartOf(todayISO()));
  const [trendStaff,setTrendStaff]=useState(null);

  const signOut=useCallback(()=>{
    storeToken(""); setToken(""); setMe(null); setRows([]); setEntry(null); setView("home");
  },[]);

  // Somebody who can only see themselves has no list to choose from, so making
  // them click their own name to reach their own blocks is a step that asks a
  // question with one answer. Land them on their day; the branch view is still
  // a tap away for the chasing and trends screens.
  useEffect(()=>{
    if(me&&!me.manager&&view==="home"&&!active){
      setActive(me.staffId); setDate(todayISO()); setView("entry");
    }
  },[me,view,active]);

  // Resume a session if the token is still good.
  useEffect(()=>{
    let off=false;
    (async()=>{
      if(!token){ setBooting(false); return; }
      const r=await api("me",{token});
      if(off) return;
      if(r.ok){ setMe(r.profile); setRoster(r.roster||[]); rememberRoles(r.roster); if(r.schedule) SCHEDULE=r.schedule; if(r.kpis) KPI_CHOICES=r.kpis; }
      else { storeToken(""); setToken(""); }
      setBooting(false);
    })();
    return()=>{off=true;};
  },[token]);

  // Pull the rows this person is allowed to see.
  const loadRows=useCallback(async()=>{
    if(!token) return;
    setLoading(true);
    const r=await api("rows",{token});
    if(r.ok){ setRows(r.rows||[]); setTraining(r.training||[]); if(r.roster){ setRoster(r.roster); rememberRoles(r.roster); }
      if(r.schedule) SCHEDULE=r.schedule; if(r.kpis) KPI_CHOICES=r.kpis;
      if(r.metrics) setMetrics(r.metrics);
      if(r.needsReason) setNeedsReason(r.needsReason);
      if(r.billing) setBilling(r.billing); }
    else if(r.authRequired){ signOut(); }
    setLoading(false);
  },[token,signOut]);

  useEffect(()=>{ if(me) loadRows(); },[me,loadRows]);

  // Pulled when the view is opened rather than with every page — it is a
  // different question from "what did you do today".
  useEffect(()=>{
    if(view!=="waiting"||!token) return;
    let off=false;
    (async()=>{ const r=await api("waiting",{token});
      if(!off&&r.ok) setWaiting(r.waiting); })();
    return()=>{off=true;};
  },[view,token]);

  // Load one day into the form.
  useEffect(()=>{
    if(view!=="entry"||!active) return;
    const found=rows.map(rowToEntry).find(e=>e.staffId===active&&e.date===date);
    setEntry(withSchedule(withTraining(found||blankEntry(active,date),training),active));
  },[view,active,date,rows,training]);

  const patchBlock=(bid,f,v)=>setEntry(e=>({...e,blocks:{...e.blocks,[bid]:{...e.blocks[bid],[f]:v}}}));
  const patchMetric=(f,v)=>setEntry(e=>({...e,metrics:{...e.metrics,[f]:v}}));

  // A block goes in on its own, the moment it ends. The reply says what
  // actually happened — and the staff member gets their own copy by email.
  async function submitBlock(b){
    if(!entry||blockState[b.id]?.tone==="saving") return;
    const prof=profileFor(active);
    const person=roster.find(p=>p.staffId===active);
    setBlockState(s=>({...s,[b.id]:{tone:"saving",text:"Sending…"}}));
    const res=await api("saveBlock",{
      token, staffId:active, date:entry.date, block:b.col,
      name:person?person.name:(me?me.name:""), grade:prof.grade,
      data:entry.blocks[b.id]||blankBlock(),
      valueAdded:entry.valueAdded, innovation:entry.innovation,
      systemFlags:entry.systemFlags, notes:entry.notes, metrics:entry.metrics
    });
    if(res.ok){
      setBlockState(s=>({...s,[b.id]:{tone:"ok",
        text:"Sent "+(res.at||"")+" · "+res.blocksDone+"/4 in · copy emailed to you"}}));
      loadRows();
      setTimeout(()=>setBlockState(s=>({...s,[b.id]:{tone:"idle",text:""}})),6000);
    }else if(res.authRequired){ signOut(); }
    else{ setBlockState(s=>({...s,[b.id]:{tone:"bad",text:res.error||"Did not send."}})); }
  }

  // The day's own fields. Saved on their own so they never overwrite a block.
  async function saveDay(){
    if(!entry||dayState.tone==="saving") return;
    const prof=profileFor(active);
    const person=roster.find(p=>p.staffId===active);
    setDayState({tone:"saving",text:"Saving…"});
    const res=await api("saveDay",{
      token, staffId:active, date:entry.date,
      name:person?person.name:(me?me.name:""), grade:prof.grade,
      metrics:entry.metrics, valueAdded:entry.valueAdded,
      innovation:entry.innovation, systemFlags:entry.systemFlags, notes:entry.notes
    });
    if(res.ok){
      setDayState({tone:"ok",text:"Saved ✓"});
      loadRows();
      setTimeout(()=>setDayState({tone:"idle",text:""}),2600);
    }else if(res.authRequired){ signOut(); }
    else{ setDayState({tone:"bad",text:res.error||"Did not save."}); }
  }

  if(booting) return <Splash text="Checking your session…"/>;
  if(!me) return <Login onIn={(tok,profile,ros)=>{storeToken(tok);setToken(tok);setMe(profile);setRoster(ros||[]);}}/>;

  // Everyone on the Access tab logs a day, the Branch Manager included. Being
  // able to see the branch and having a day of your own are different things —
  // filtering managers out of this list is what left the person who asked for
  // the checkpoint with no way to open his own blocks.
  const staffList=roster;
  const visible=me.manager?staffList:staffList.filter(p=>p.staffId===me.staffId);
  const entries=rows.map(rowToEntry);

  // ---- home ---------------------------------------------------------------
  if(view==="home") return(
    <Shell>
      <div style={mast}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            <ShieldLogo size={38}/>
            <div>
              <div style={{color:GOLD_SOFT,fontSize:11,fontWeight:700,letterSpacing:1.6,textTransform:"uppercase"}}>Guardian Life</div>
              <div style={{color:"#fff",fontSize:15,fontWeight:800,letterSpacing:-0.2}}>Ricky Rampersad's Branch</div>
            </div>
          </div>
          <button onClick={signOut} style={signOutBtn}>Sign out</button>
        </div>
        <h1 style={{color:"#fff",fontSize:22,fontWeight:800,margin:"16px 0 2px",letterSpacing:-0.4}}>Daily KPI &amp; Innovation</h1>
        <p style={{color:GOLD_SOFT,fontSize:13,margin:0}}>{prettyDate(todayISO())}</p>
        <p style={{color:"#fff",fontSize:12.5,margin:"6px 0 0",opacity:0.75}}>
          Signed in as {me.name}{me.manager?" · Branch Manager":""}
        </p>
      </div>

      <div style={{padding:"0 18px 44px"}}>
        {!configured()&&<div style={warn}>⚠ <b>No sheet connected.</b> Paste your Apps Script /exec URL into <b>APPS_SCRIPT_URL</b> near the top of this file.</div>}

        {me.manager?(
          <React.Fragment>
            <p style={{color:MUTED,fontSize:13.5,margin:"16px 0 4px",lineHeight:1.55}}>
              Your branch, as it stands. The <b style={{color:INK}}>3pm checkpoint</b> tells you who to chase while there is still a working hour left. The <b style={{color:INK}}>weekly summary</b> shows where the week actually went.
            </p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:16}}>
              <button onClick={()=>{setReviewDate(todayISO());setView("checkpoint");}} style={{...bigBtn,background:GOLD,color:NAVY_DEEP}}>
                <span style={{fontSize:19}}>◷</span><span>3pm Checkpoint</span>
              </button>
              <button onClick={()=>{setWeekOf(weekStartOf(todayISO()));setView("weekly");}} style={{...bigBtn,background:NAVY,color:"#fff"}}>
                <span style={{fontSize:19}}>▤</span><span>Weekly summary</span>
              </button>
            </div>
            <button onClick={()=>{setWaiting(null);setView("waiting");}} style={{...primaryWide,marginTop:10}}>
              Who we are waiting on →</button>
            <button onClick={()=>{setReviewDate(todayISO());setView("review");}} style={primaryWide}>Full day review →</button>
            <SectionLabel>The team</SectionLabel>
          </React.Fragment>
        ):(
          <React.Fragment>
            <p style={{color:MUTED,fontSize:13.5,margin:"16px 0 4px",lineHeight:1.55}}>
              Log your day against your KPI blocks — what was <b style={{color:INK}}>actioned and resolved</b>, what you carry forward, and your <b style={{color:INK}}>value added</b>. Ideas belong here too.
            </p>
            <button onClick={()=>{setWaiting(null);setView("waiting");}} style={{...primaryWide,marginTop:14}}>
              What you are chasing →</button>
            <SectionLabel>Your day</SectionLabel>
          </React.Fragment>
        )}

        {visible.length===0&&<Empty text="Nobody on the roster yet — add staff to the Access tab of the workbook."/>}
        <div style={vp.wide?autoGrid(300,10):null}>
        {visible.map(p=>{
          const today=entries.find(e=>e.staffId===p.staffId&&e.date===todayISO());
          return <PersonRow key={p.staffId} p={p} today={today}
            onOpen={()=>{setActive(p.staffId);setDate(todayISO());setBlockState({});
              setDayState({tone:"idle",text:""});setOpenBlock(null);setView("entry");}}
            onTrend={()=>{setTrendStaff(p.staffId);setView("trend");}}/>;
        })}
        </div>

        <div style={standardsBox}>
          <div style={{fontSize:11,fontWeight:800,letterSpacing:1,textTransform:"uppercase",color:GOLD,marginBottom:8}}>The standard</div>
          {STANDARDS.map((s,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:GOLD,fontWeight:800,flexShrink:0}}>✓</span><span style={{fontSize:12.5,color:"#E9E6DD",lineHeight:1.45}}>{s}</span></div>)}
        </div>
        <p style={{color:MUTED,fontSize:11.5,textAlign:"center",marginTop:18}}>9–13 Endeavour 1st Street, Chaguanas</p>
      </div>
    </Shell>);

  // ---- entry: one block at a time -----------------------------------------
  if(view==="entry"&&active){
    const prof=profileFor(active);
    const person=roster.find(p=>p.staffId===active);
    const sched=schedFor(active);
    const opts=fnFor(prof.role);
    const mine=me.manager||me.staffId===active;
    if(!mine) return <Denied onBack={()=>setView("home")}/>;
    const blocks=blocksFor(active);
    const done=entry?blocksDone(entry):0;

    return(
    <Shell wide={vp.desktop?1160:vp.tablet?760:560}>
      <SubHeader title={person?person.name:active} sub={prof.grade} tenure={prof.tenure} onBack={()=>setView("home")}/>
      <div style={{padding:"0 18px 40px"}}>
        <div style={dateBar}>
          <label style={{fontSize:12,color:MUTED,fontWeight:700}}>Reporting day</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={dateInput}/>
        </div>

        {sched&&<div style={dayStrip}>
          <div>
            <div style={{fontSize:11,fontWeight:800,letterSpacing:1,textTransform:"uppercase",color:GOLD}}>Your day</div>
            <div style={{fontSize:12.5,color:"#E9E6DD",marginTop:2}}>{sched.hours} · lunch {sched.lunch}</div>
          </div>
          <div style={{display:"flex",gap:4}}>
            {blocks.map(b=>{
              const t=entry?blockTime(entry,b.id):"";
              const filled=entry&&blockWorked(entry,b.id);
              return <div key={b.id} title={b.label} style={{width:26,height:26,borderRadius:7,
                background:(t||filled)?GREEN:"rgba(255,255,255,0.16)",color:"#fff",fontSize:11,
                fontWeight:800,display:"grid",placeItems:"center"}}>{(t||filled)?"✓":"–"}</div>;})}
          </div>
        </div>}

        {loading&&!entry?<p style={{color:MUTED,padding:24,textAlign:"center"}}>Loading…</p>:!entry?null:(<React.Fragment>
          <p style={{fontSize:12.5,color:MUTED,margin:"14px 0 2px",lineHeight:1.5}}>
            Submit each block as it ends — not at four o'clock from memory. Your KPI is already set
            from the schedule; change it if the block went elsewhere.
          </p>

          <div style={vp.desktop?{display:"grid",gridTemplateColumns:"minmax(0,1.35fr) minmax(0,1fr)",gap:20,alignItems:"start"}:null}>
          <div>
          {blocks.map(b=>{
            const bl=entry.blocks[b.id]||blankBlock();
            const at=blockTime(entry,b.id);
            const filled=blockWorked(entry,b.id);
            const st=blockState[b.id]||{tone:"idle",text:""};
            const open=openBlock===b.id;
            return(
            <div key={b.id} style={{...card,padding:0,overflow:"hidden",
              borderLeft:"4px solid "+((at||filled)?GREEN:LINE)}}>
              <button onClick={()=>setOpenBlock(open?null:b.id)} style={blockHead}>
                <div style={{textAlign:"left"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:14,fontWeight:800,color:NAVY}}>{b.label}</span>
                    {b.time&&<span style={{fontSize:11,color:MUTED,fontWeight:600}}>{b.time}</span>}
                  </div>
                  {b.focus&&<div style={{fontSize:11.5,color:MUTED,marginTop:2}}>{b.focus}</div>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  {at?<span style={pillOutline(GREEN)}>Sent {at}</span>
                     :filled?<span style={pillOutline(AMBER)}>Unsent</span>
                     :<span style={{fontSize:11,color:MUTED,fontWeight:700}}>Open</span>}
                  <span style={{color:GOLD,fontSize:16,fontWeight:700}}>{open?"⌄":"›"}</span>
                </div>
              </button>

              {open&&<div style={{padding:"0 14px 14px"}}>
                <Field label="KPI worked">
                  <select value={bl.kpi} onChange={e=>patchBlock(b.id,"kpi",e.target.value)} style={selectBox}>
                    <option value="">Select…</option>
                    <optgroup label="Salesforce task types — these carry live numbers">
                      {opts.filter(k=>k.salesforce).map(k=><option key={k.value} value={k.value}>{k.label}</option>)}
                    </optgroup>
                    <optgroup label="Logged in words only">
                      {opts.filter(k=>!k.salesforce).map(k=><option key={k.value} value={k.value}>{k.label}</option>)}
                    </optgroup>
                  </select>
                </Field>
                <Field label="Actioned"><textarea rows={2} value={bl.actioned} onChange={e=>patchBlock(b.id,"actioned",e.target.value)} placeholder="In your own words — names, counts, cases" style={ta}/></Field>
                <Field label="Resolved / closed"><textarea rows={2} value={bl.resolved} onChange={e=>patchBlock(b.id,"resolved",e.target.value)} placeholder="What is genuinely complete" style={ta}/></Field>
                <Field label="Still open & owned by you"><textarea rows={2} value={bl.openOwned} onChange={e=>patchBlock(b.id,"openOwned",e.target.value)} placeholder="Carried forward" style={ta}/></Field>
                <div style={grid2}>
                  <Field label="Blocker (if waiting)"><input value={bl.blocker} onChange={e=>patchBlock(b.id,"blocker",e.target.value)} placeholder="Genuine blocker" style={inp}/></Field>
                  <Field label="Waiting on (named) + last chased"><input value={bl.blockerOwner} onChange={e=>patchBlock(b.id,"blockerOwner",e.target.value)} placeholder="Name + date" style={inp}/></Field>
                </div>

                {bl.kpi==="Renewa/PDl/Bill"&&<BillingCheck data={billing[active]} api={api} token={token} onSaved={loadRows}/>}

                {bl.kpi==="Training delivered"&&(<div style={trainBox}>
                  <div style={{fontSize:11,fontWeight:800,letterSpacing:0.8,textTransform:"uppercase",color:GOLD,marginBottom:8}}>Training record</div>
                  <Field label="Who you trained"><input value={bl.tr_trainee} onChange={e=>patchBlock(b.id,"tr_trainee",e.target.value)} placeholder="Trainee name(s)" style={inp}/></Field>
                  <Field label="Topic / what was covered"><textarea rows={2} value={bl.tr_topic} onChange={e=>patchBlock(b.id,"tr_topic",e.target.value)} placeholder="e.g. Premium-due processing, end to end" style={ta}/></Field>
                  <Field label="Objectives set vs met"><textarea rows={2} value={bl.tr_objectives} onChange={e=>patchBlock(b.id,"tr_objectives",e.target.value)} placeholder="What they should be able to do — and whether they can now" style={ta}/></Field>
                  <Field label="What was achieved"><textarea rows={2} value={bl.tr_achieved} onChange={e=>patchBlock(b.id,"tr_achieved",e.target.value)} placeholder="Concrete outcome of the session" style={ta}/></Field>
                  <div style={grid2}>
                    <Field label="Test / check done?"><select value={bl.tr_test} onChange={e=>patchBlock(b.id,"tr_test",e.target.value)} style={selectBox}><option value="">Select…</option><option value="Yes - passed">Yes — passed</option><option value="Yes - needs more">Yes — needs more practice</option><option value="No - not yet">No — not yet</option></select></Field>
                    <Field label="Result / score"><input value={bl.tr_result} onChange={e=>patchBlock(b.id,"tr_result",e.target.value)} placeholder="e.g. 5/6, or notes" style={inp}/></Field>
                  </div>
                  <Field label="Follow-up / next step"><input value={bl.tr_followup} onChange={e=>patchBlock(b.id,"tr_followup",e.target.value)} placeholder="What happens next / when to re-check" style={inp}/></Field>
                </div>)}

                <div style={{display:"flex",alignItems:"center",gap:10,marginTop:4}}>
                  <div style={{flex:1,fontSize:12.5,fontWeight:700,lineHeight:1.35,
                    color:st.tone==="bad"?RED:st.tone==="ok"?GREEN:MUTED}}>
                    {st.text||(at?"Sent at "+at+" — submitting again updates it.":"")}
                  </div>
                  <button onClick={()=>submitBlock(b)} disabled={st.tone==="saving"}
                    style={{...submitBtn,padding:"11px 18px",opacity:st.tone==="saving"?0.65:1}}>
                    {st.tone==="saving"?"Sending…":at?"Update block":"Submit block"}
                  </button>
                </div>
              </div>}
            </div>);})}

          </div>
          <div style={vp.desktop?{position:"sticky",top:16}:null}>
          <SectionLabel>The day</SectionLabel>
          <p style={{fontSize:11.5,color:MUTED,margin:"0 0 10px",lineHeight:1.45}}>
            These belong to the day rather than any one block. Save them once, whenever you have them.
          </p>

          <TaskPosition live={metrics} staffId={active} entry={entry} patchMetric={patchMetric}/>
          <NeedsReason items={needsReason[active]} api={api} token={token} onSaved={loadRows}/>

          <div style={{...card,borderLeft:"4px solid "+GOLD}}>
            <div style={cardHead}><span style={cardTitle}>Value Added today</span><span style={{fontSize:10.5,color:AMBER,fontWeight:700}}>log every day</span></div>
            <p style={{fontSize:11.5,color:MUTED,margin:"0 0 8px",lineHeight:1.4}}>Something the branch would not have unless you brought it. If nothing, write "None today".</p>
            <textarea rows={2} value={entry.valueAdded} onChange={e=>setEntry(x=>({...x,valueAdded:e.target.value}))} placeholder='e.g. "Caught a misrouted contract" — or "None today"' style={ta}/>
          </div>

          <div style={{...card,borderLeft:"4px solid "+NAVY}}>
            <div style={cardHead}><span style={cardTitle}>Innovation / idea</span></div>
            <p style={{fontSize:11.5,color:MUTED,margin:"0 0 8px",lineHeight:1.4}}>A tool, tracker, checklist, macro or process fix you spotted. The problem + your fix.</p>
            <textarea rows={2} value={entry.innovation} onChange={e=>setEntry(x=>({...x,innovation:e.target.value}))} placeholder="The friction you saw, and your fix" style={ta}/>
          </div>

          <div style={card}>
            <div style={cardHead}><span style={cardTitle}>System flags & notes</span></div>
            <Field label="System issue to flag"><input value={entry.systemFlags} onChange={e=>setEntry(x=>({...x,systemFlags:e.target.value}))} placeholder="What broke + who you flagged it to" style={inp}/></Field>
            <Field label="Note for the Branch Manager"><textarea rows={2} value={entry.notes} onChange={e=>setEntry(x=>({...x,notes:e.target.value}))} placeholder="Optional" style={ta}/></Field>
          </div>

          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:2}}>
            <div style={{flex:1,fontSize:12.5,fontWeight:700,
              color:dayState.tone==="bad"?RED:dayState.tone==="ok"?GREEN:MUTED}}>
              {dayState.text||done+" of 4 blocks in"}
            </div>
            <button onClick={saveDay} disabled={dayState.tone==="saving"}
              style={{...dayBtn,padding:"11px 18px",opacity:dayState.tone==="saving"?0.65:1}}>
              {dayState.tone==="saving"?"Saving…":"Save the day"}
            </button>
          </div>
          </div></div>
        </React.Fragment>)}
      </div>
    </Shell>);}

  // ---- 3pm checkpoint -----------------------------------------------------
  if(view==="checkpoint"){
    if(!me.manager) return <Denied onBack={()=>setView("home")}/>;
    const day=reviewDate;
    const byId={}; entries.filter(e=>e.date===day).forEach(e=>{byId[e.staffId]=e;});
    const lines=staffList.map(p=>{
      const e=byId[p.staffId];
      const done=e?blocksDone(e):0;
      return {p,e,done,onTrack:done>=CHECKPOINT_BLOCKS,
        status:!e?"No entry":(e.submitted?"Submitted":"Draft"),
        blockers:e?blockersOf(e):[]};
    });
    const silent=lines.filter(l=>!l.e);
    const behind=lines.filter(l=>l.e&&!l.onTrack);
    const tot=lines.reduce((a,l)=>({
      closed:a.closed+(l.e?num(l.e.metrics.closed)||0:0),
      overdue:a.overdue+(l.e?num(l.e.metrics.overdue)||0:0),
      aged60:a.aged60+(l.e?num(l.e.metrics.aged60)||0:0)}),{closed:0,overdue:0,aged60:0});
    const reported=lines.filter(l=>l.e).length;

    return(<Shell wide={vp.desktop?1120:vp.tablet?820:560}>
      <div style={{...mast,paddingBottom:16}}>
        <button onClick={()=>setView("home")} style={backLink}>← Branch</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
          <ShieldLogo size={30}/>
          <div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:800,margin:0}}>3pm Checkpoint</h1>
            <p style={{color:GOLD_SOFT,fontSize:12,margin:"2px 0 0"}}>{prettyDate(day)}</p>
          </div>
        </div>
        <div className="noprint" style={{display:"flex",gap:8,marginTop:12}}>
          <input type="date" value={day} onChange={e=>setReviewDate(e.target.value)} style={{...dateInput,flex:1}}/>
          <button onClick={loadRows} style={goldBtn}>Refresh</button>
          <button onClick={()=>window.print()} style={ghostBtn}>Print</button>
        </div>
      </div>

      <div style={{padding:"0 18px 56px"}}>
        <p style={{fontSize:12,color:MUTED,margin:"14px 0 0",lineHeight:1.5}}>
          Blocks 1–3 are behind them by 3pm; the last block runs to 4. Anyone under {CHECKPOINT_BLOCKS} blocks is flagged while there is still time to act on it.
        </p>
        <div style={statRow}>
          <Stat label="Logged" value={reported+"/"+staffList.length} tone={reported===staffList.length?"green":"amber"}/>
          <Stat label="Closed" value={tot.closed} tone="green"/>
          <Stat label="Overdue" value={tot.overdue} tone={tot.overdue>0?"amber":"green"}/>
          <Stat label="60+ days" value={tot.aged60} tone={tot.aged60>0?"red":"green"}/>
        </div>

        {loading&&<p style={{color:MUTED,textAlign:"center",padding:14}}>Loading…</p>}

        {(silent.length>0||behind.length>0)?(
          <div style={chaseBox}>
            <div style={{fontSize:11,fontWeight:800,letterSpacing:1,textTransform:"uppercase",color:RED,marginBottom:7}}>Chase before close of business</div>
            {silent.length>0&&<div style={{fontSize:13,lineHeight:1.5,marginBottom:4}}><b>Nothing logged yet:</b> {silent.map(l=>l.p.name).join(", ")}</div>}
            {behind.length>0&&<div style={{fontSize:13,lineHeight:1.5}}><b>Behind on blocks:</b> {behind.map(l=>l.p.name+" ("+l.done+"/4)").join(", ")}</div>}
          </div>
        ):(
          <div style={clearBox}>Everyone has logged and is on track at the 3pm cut.</div>
        )}

        <SectionLabel>Where each person stands</SectionLabel>
        <div style={vp.wide?autoGrid(330,12):null}>
        {lines.map(({p,e,done,onTrack,status,blockers})=>{
          const tone=!e?RED:(onTrack?GREEN:AMBER);
          return(<div key={p.staffId} style={{...card,padding:0,overflow:"hidden"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",background:"#FBFAF5",borderBottom:"1px solid "+LINE}}>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:INK}}>{p.name}</div>
                <div style={{fontSize:11,color:MUTED}}>{profileFor(p.staffId).grade}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,color:MUTED,fontWeight:700}}>{done}/4</span>
                <span style={pillOutline(tone)}>{status}</span>
              </div>
            </div>
            <BlockPips done={done}/>
            {e?(<div style={{padding:"9px 14px"}}>
              <div style={{fontSize:12,color:MUTED,marginBottom:4}}>
                Closed {num(e.metrics.closed)??"—"} · Overdue {num(e.metrics.overdue)??"—"} · 60+ {num(e.metrics.aged60)??"—"}
              </div>
              {blocksFor(p.staffId).map(b=>{const d=e.blocks?.[b.id];
                if(!d||(!txt(d.kpi)&&!txt(d.actioned))) return null;
                return <div key={b.id} style={{marginTop:6}}>
                  <div style={{fontSize:11,fontWeight:700,color:NAVY}}>{b.label} · {d.kpi||"—"}</div>
                  {txt(d.resolved)&&<Line k="Resolved" v={d.resolved} tone={GREEN}/>}
                  {txt(d.actioned)&&<Line k="Actioned" v={d.actioned}/>}
                  {txt(d.openOwned)&&<Line k="Open" v={d.openOwned} tone={AMBER}/>}
                </div>;})}
              {blockers.map((b,i)=><Line key={i} k="Blocked" v={b.text} tone={RED}/>)}
              {txt(e.systemFlags)&&<Line k="Flag" v={e.systemFlags} tone={RED}/>}
              {txt(e.notes)&&<Line k="Note" v={e.notes} tone={MUTED}/>}
              {isRealVA(e.valueAdded)&&<Line k="Value added" v={e.valueAdded} tone={GOLD}/>}
            </div>):(
              <div style={{padding:"11px 14px",fontSize:13,color:MUTED}}>No entry for this day.</div>
            )}
          </div>);
        })}
        </div>
      </div>
    </Shell>);}

  // ---- weekly summary & trends -------------------------------------------
  if(view==="weekly"){
    if(!me.manager) return <Denied onBack={()=>setView("home")}/>;
    const days=weekDaysOf(weekOf);
    const prevDays=weekDaysOf(shiftDays(weekOf,-7));
    const inWeek=(ds)=>entries.filter(e=>ds.indexOf(e.date)>-1);
    const thisRows=inWeek(days), prevRows=inWeek(prevDays);

    const totals=(rs)=>rs.reduce((t,e)=>({
      days:t.days+1,
      closed:t.closed+(num(e.metrics.closed)||0),
      overdue:t.overdue+(num(e.metrics.overdue)||0),
      aged60:t.aged60+(num(e.metrics.aged60)||0),
      va:t.va+(isRealVA(e.valueAdded)?1:0),
      ideas:t.ideas+(isRealVA(e.innovation)?1:0),
      training:t.training+trainingCount(e),
      blockers:t.blockers+blockersOf(e).length,
      flags:t.flags+(txt(e.systemFlags)?1:0)
    }),{days:0,closed:0,overdue:0,aged60:0,va:0,ideas:0,training:0,blockers:0,flags:0});

    const T=totals(thisRows), P=totals(prevRows);
    const expected=staffList.length*days.length;
    const coverage=expected?Math.round((T.days/expected)*100):0;

    // Closed and overdue across the week, branch-wide
    const closedByDay=days.map(d=>inWeek([d]).reduce((n,e)=>n+(num(e.metrics.closed)||0),0));
    const overdueByDay=days.map(d=>inWeek([d]).reduce((n,e)=>n+(num(e.metrics.overdue)||0),0));

    const mix={}; thisRows.forEach(e=>BLOCKS.forEach(b=>{const k=txt(e.blocks?.[b.id]?.kpi); if(k) mix[k]=(mix[k]||0)+1;}));
    const mixList=Object.keys(mix).map(k=>({kpi:k,count:mix[k]})).sort((a,b)=>b.count-a.count);
    const maxMix=mixList.length?mixList[0].count:1;

    const harvest=(field)=>thisRows.filter(e=>isRealVA(e[field]))
      .sort((a,b)=>a.date<b.date?-1:1)
      .map(e=>({name:e.name||e.staffId,date:e.date,text:txt(e[field])}));
    const flagList=thisRows.filter(e=>txt(e.systemFlags)).map(e=>({name:e.name||e.staffId,date:e.date,text:txt(e.systemFlags)}));
    const blockerList=[]; thisRows.forEach(e=>blockersOf(e).forEach(b=>blockerList.push({name:e.name||e.staffId,date:e.date,kpi:b.kpi,text:b.text})));

    // The register only holds sessions logged since it was added, so anything
    // older is rebuilt from the block it was recorded in.
    const trainingThisWeek=[];
    thisRows.forEach(e=>BLOCKS.forEach(b=>{
      const d=e.blocks?.[b.id];
      if(!d||d.kpi!=="Training delivered") return;
      const reg=training.find(t=>t.StaffId===e.staffId
        &&String(t.TrainingDate||"").slice(0,10)===e.date
        &&String(t.Block||"").trim()===BLOCK_COL[b.id]);
      trainingThisWeek.push({
        date:e.date, trainer:e.name||e.staffId,
        trainee:reg?String(reg.Trainee||""):txt(d.tr_trainee),
        detail:[reg?String(reg.Topic||""):txt(d.tr_topic), txt(d.actioned), txt(d.resolved)]
          .filter(Boolean).join(" · ")});
    }));
    trainingThisWeek.sort((a,b)=>a.date<b.date?-1:1);

    const isThisWeek=weekOf===weekStartOf(todayISO());

    return(<Shell wide={vp.desktop?1120:vp.tablet?820:560}>
      <div style={{...mast,paddingBottom:16}}>
        <button onClick={()=>setView("home")} style={backLink}>← Branch</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
          <ShieldLogo size={30}/>
          <div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:800,margin:0}}>Weekly summary</h1>
            <p style={{color:GOLD_SOFT,fontSize:12,margin:"2px 0 0"}}>{shortDate(days[0])} – {shortDate(days[4])}{isThisWeek?" · this week":""}</p>
          </div>
        </div>
        <div className="noprint" style={{display:"flex",gap:8,marginTop:12,alignItems:"center"}}>
          <button onClick={()=>setWeekOf(shiftDays(weekOf,-7))} style={navBtn}>‹ Prev</button>
          <button onClick={()=>setWeekOf(weekStartOf(todayISO()))} style={{...navBtn,flex:1}}>This week</button>
          <button onClick={()=>setWeekOf(shiftDays(weekOf,7))} style={navBtn}>Next ›</button>
          <button onClick={()=>window.print()} style={ghostBtn}>Print</button>
        </div>
      </div>

      <div style={{padding:"0 18px 56px"}}>
        {loading&&<p style={{color:MUTED,textAlign:"center",padding:14}}>Loading…</p>}
        <div style={statRow}>
          <Stat label="Reports in" value={T.days+"/"+expected} tone={coverage>=90?"green":coverage>=70?"amber":"red"}/>
          <Stat label="Closed" value={T.closed} tone="green"/>
          <Stat label="Value adds" value={T.va} tone="gold"/>
          <Stat label="Ideas" value={T.ideas} tone="navy"/>
        </div>

        <SectionLabel>Movement on last week</SectionLabel>
        {P.days===0&&<p style={{fontSize:12.5,color:MUTED,margin:"0 0 8px",lineHeight:1.45}}>
          Nothing was logged the week before, so there is nothing to compare against.</p>}
        <div style={{...card,padding:0,overflow:"hidden"}}>
          {[["Tasks closed",T.closed,P.closed,"up"],
            ["Overdue at week end",T.overdue,P.overdue,"down"],
            ["Aged 60+ days",T.aged60,P.aged60,"down"],
            ["Value added logged",T.va,P.va,"up"],
            ["Ideas logged",T.ideas,P.ideas,"up"],
            ["Training delivered",T.training,P.training,"up"],
            ["Blockers raised",T.blockers,P.blockers,"flat"]
          ].map(([label,now,was,good],i)=><MoveRow key={label} label={label} now={now} was={was} good={good} first={i===0} comparable={P.days>0}/>)}
        </div>

        <SectionLabel>Closed vs overdue, across the week</SectionLabel>
        <MiniChart labels={days.map(dowShort)} seriesA={closedByDay} seriesB={overdueByDay}
          colorA={GREEN} colorB={AMBER} legendA="Closed" legendB="Overdue"/>

        <SectionLabel>The week, person by person</SectionLabel>
        <div style={vp.wide?autoGrid(330,12):null}>
        {staffList.map(p=>{
          const mine=thisRows.filter(e=>e.staffId===p.staffId);
          const mt=totals(mine);
          const pt=totals(prevRows.filter(e=>e.staffId===p.staffId));
          return(<div key={p.staffId} style={{...card,padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
              <button onClick={()=>{setTrendStaff(p.staffId);setView("trend");}}
                style={{background:"none",border:"none",padding:0,fontSize:14,fontWeight:700,color:INK,cursor:"pointer",textAlign:"left"}}>
                {p.name} <span style={{color:GOLD,fontSize:12}}>›</span>
              </button>
              <span style={{fontSize:11.5,color:MUTED}}>
                {mt.days}/5 days · {mt.closed} closed{mt.training?" · "+mt.training+" training":""}
              </span>
            </div>
            <div style={{display:"flex",gap:5,marginTop:10}}>
              {days.map(d=>{
                const e=mine.find(x=>x.date===d);
                const done=e?blocksDone(e):0;
                const bg=!e?"#E4E0D6":(done>=CHECKPOINT_BLOCKS?GREEN:AMBER);
                return <div key={d} style={{flex:1,textAlign:"center"}}>
                  <div title={prettyDate(d)} style={{background:bg,borderRadius:6,height:28,lineHeight:"28px",
                    color:e?"#fff":MUTED,fontSize:11.5,fontWeight:800}}>{e?done+"/4":"–"}</div>
                  <div style={{fontSize:9.5,color:MUTED,marginTop:3}}>{dowShort(d)}</div>
                </div>;})}
            </div>
            {mt.days>0&&<div style={{fontSize:11.5,color:MUTED,marginTop:9,lineHeight:1.45}}>
              {mt.va} value add{mt.va===1?"":"s"} · {mt.ideas} idea{mt.ideas===1?"":"s"} · {mt.blockers} blocker{mt.blockers===1?"":"s"}
              {pt.days>0&&<span> · last week {pt.days}/5 days, {pt.closed} closed</span>}
            </div>}
          </div>);})}
        </div>

        <SectionLabel>Where the time went</SectionLabel>
        {mixList.length===0?<Empty text="No KPI blocks logged this week."/>:
          <div style={{...card,padding:"14px"}}>
            {mixList.slice(0,10).map(m=>(<div key={m.kpi} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                <span>{m.kpi}</span><span style={{color:MUTED,fontWeight:700}}>{m.count}</span>
              </div>
              <div style={{background:"#EDE9DE",borderRadius:4,height:7}}>
                <div style={{background:NAVY,width:Math.max(4,Math.round(m.count/maxMix*100))+"%",height:7,borderRadius:4}}/>
              </div>
            </div>))}
          </div>}

        <SectionLabel>Value added</SectionLabel>
        {harvest("valueAdded").length===0?<Empty text="Nothing logged as value added this week."/>:
          harvest("valueAdded").map((v,i)=><Surfaced key={i} name={v.name+" · "+shortDate(v.date)} text={v.text} accent={GOLD}/>)}

        <SectionLabel>Innovations &amp; ideas</SectionLabel>
        {harvest("innovation").length===0?<Empty text="No ideas logged this week."/>:
          harvest("innovation").map((v,i)=><Surfaced key={i} name={v.name+" · "+shortDate(v.date)} text={v.text} accent={NAVY}/>)}

        <SectionLabel>Training delivered</SectionLabel>
        {trainingThisWeek.length===0?<Empty text="No training logged this week."/>:
          trainingThisWeek.map((t,i)=><Surfaced key={i}
            name={t.trainer+(t.trainee?" → "+t.trainee:"")+" · "+shortDate(t.date)}
            text={t.detail||"—"} accent={GREEN}/>)}

        <SectionLabel>Blockers raised</SectionLabel>
        {blockerList.length===0?<Empty text="No blockers raised this week."/>:
          blockerList.map((b,i)=><Surfaced key={i} name={b.name+" · "+shortDate(b.date)+(b.kpi?" · "+b.kpi:"")} text={b.text} accent={RED}/>)}

        <SectionLabel>System flags</SectionLabel>
        {flagList.length===0?<Empty text="No system issues flagged this week."/>:
          flagList.map((f,i)=><Surfaced key={i} name={f.name+" · "+shortDate(f.date)} text={f.text} accent={RED}/>)}
      </div>
    </Shell>);}

  // ---- who we are waiting on ----------------------------------------------
  if(view==="waiting"){
    const w=waiting;
    const ready=w&&w.ok;
    return(<Shell wide={vp.desktop?1120:vp.tablet?820:560}>
      <div style={{...mast,paddingBottom:16}}>
        <button onClick={()=>setView("home")} style={backLink}>← Branch</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
          <ShieldLogo size={30}/>
          <div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:800,margin:0}}>
              {me.manager?"Who we are waiting on":"What you are chasing"}</h1>
            <p style={{color:GOLD_SOFT,fontSize:12,margin:"2px 0 0"}}>
              Open tasks sitting at "waiting on someone else"</p>
          </div>
        </div>
      </div>

      <div style={{padding:"0 18px 56px"}}>
        {!w&&<p style={{color:MUTED,textAlign:"center",padding:24}}>Reading Salesforce…</p>}
        {w&&!w.ok&&<div style={{...warn,marginTop:16}}>
          {w.reason==="notConfigured"
            ? "Salesforce is not connected, so there is nothing to read yet."
            : "Could not reach Salesforce: "+(w.error||"unknown")}</div>}

        {ready&&<React.Fragment>
          <div style={statRow}>
            <Stat label="Tasks waiting" value={w.total} tone={w.total>0?"amber":"green"}/>
            <Stat label="Days carried" value={w.totalDays.toLocaleString()} tone="red"/>
            <Stat label="People" value={w.named.length} tone="navy"/>
          </div>

          <p style={{fontSize:12.5,color:MUTED,margin:"14px 0 0",lineHeight:1.5}}>
            Grouped by who the task is waiting on — the agent named on it, or the contact.
            <b style={{color:INK}}> Days quiet</b> is how long since anyone touched it: a task
            waiting three weeks and chased yesterday is fine; one nobody has touched in a month
            is not, and the age alone cannot tell them apart.
          </p>

          <SectionLabel>Longest first</SectionLabel>
          <div style={vp.wide?autoGrid(340,12):null}>
          {w.named.map(g=>(
            <div key={g.name} style={{...card,padding:0,overflow:"hidden"}}>
              <div style={{padding:"11px 14px",background:"#FBFAF5",borderBottom:"1px solid "+LINE}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
                  <span style={{fontSize:14.5,fontWeight:700,color:INK}}>{g.name}</span>
                  <span style={{fontSize:11.5,color:MUTED,whiteSpace:"nowrap"}}>
                    {g.count} task{g.count===1?"":"s"}</span>
                </div>
                <div style={{fontSize:11.5,color:MUTED,marginTop:3}}>
                  <b style={{color:g.days>1000?RED:AMBER}}>{g.days.toLocaleString()} days</b> carried
                  {" · oldest "}{g.oldest}d
                  {g.noReason>0&&<span style={{color:AMBER}}> · {g.noReason} with no reason</span>}
                  {g.stale>0&&<span style={{color:RED}}> · {g.stale} unchased over a month</span>}
                </div>
              </div>
              {g.tasks.slice(0,5).map(t=>(
                <div key={t.id} style={{padding:"9px 14px",borderTop:"1px solid "+LINE}}>
                  <div style={{fontSize:12.5,color:INK,lineHeight:1.4}}>{t.subject}</div>
                  <div style={{fontSize:11,color:MUTED,marginTop:2}}>
                    {t.type} · {me.manager?nameOf(roster,t.owner)+" · ":""}
                    <b style={{color:t.age>180?RED:t.age>60?AMBER:MUTED}}>{t.age}d old</b>
                    {t.quiet!=null&&<span style={{color:t.quiet>30?RED:MUTED}}> · quiet {t.quiet}d</span>}
                    {!t.hasReason&&<span style={{color:AMBER}}> · no reason</span>}
                  </div>
                </div>))}
              {g.tasks.length>5&&<div style={{padding:"8px 14px",borderTop:"1px solid "+LINE,
                fontSize:11.5,color:MUTED}}>and {g.tasks.length-5} more.</div>}
            </div>))}
          </div>

          {w.unnamed&&w.unnamed.count>0&&<React.Fragment>
            <SectionLabel>Waiting on nobody in particular</SectionLabel>
            <div style={{...card,borderLeft:"4px solid "+RED}}>
              <div style={{fontSize:13.5,color:INK,lineHeight:1.5}}>
                <b>{w.unnamed.count} task{w.unnamed.count===1?"":"s"}</b> carrying{" "}
                <b>{w.unnamed.days.toLocaleString()} days</b> have no agent and no contact recorded.
              </div>
              <p style={{fontSize:12,color:MUTED,margin:"7px 0 0",lineHeight:1.45}}>
                A task cannot be chased if the person to chase was never written down. These are
                the ones to name or close.
              </p>
            </div>
          </React.Fragment>}
        </React.Fragment>}
      </div>
    </Shell>);}

  // ---- full day review ----------------------------------------------------
  if(view==="review"){
    if(!me.manager) return <Denied onBack={()=>setView("home")}/>;
    const dayRows=entries.filter(e=>e.date===reviewDate);
    const byId={}; dayRows.forEach(e=>{byId[e.staffId]=e;});
    let tC=0,tO=0,tA=0,tS=0;
    staffList.forEach(p=>{const e=byId[p.staffId];if(!e)return;
      if(e.submitted)tS++;tC+=num(e.metrics.closed)||0;tO+=num(e.metrics.overdue)||0;tA+=num(e.metrics.aged60)||0;});
    const vAdds=staffList.map(p=>({p,e:byId[p.staffId]})).filter(x=>x.e&&isRealVA(x.e.valueAdded));
    const innovs=staffList.map(p=>({p,e:byId[p.staffId]})).filter(x=>x.e&&isRealVA(x.e.innovation));

    return(<Shell wide={vp.desktop?1120:vp.tablet?820:560}>
      <div style={{...mast,paddingBottom:16}}>
        <button onClick={()=>setView("home")} style={backLink}>← Branch</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
          <ShieldLogo size={30}/>
          <h1 style={{color:"#fff",fontSize:20,fontWeight:800,margin:0}}>Day review</h1>
        </div>
        <p style={{color:GOLD_SOFT,fontSize:13,margin:"4px 0 0"}}>{prettyDate(reviewDate)}</p>
        <div className="noprint" style={{display:"flex",gap:8,marginTop:12}}>
          <input type="date" value={reviewDate} onChange={e=>setReviewDate(e.target.value)} style={{...dateInput,flex:1}}/>
          <button onClick={loadRows} style={goldBtn}>Refresh</button>
          <button onClick={()=>window.print()} style={ghostBtn}>Print</button>
        </div>
      </div>
      <div style={{padding:"0 18px 56px"}}>
        <div style={statRow}>
          <Stat label="Submitted" value={tS+"/"+staffList.length} tone={tS===staffList.length?"green":"amber"}/>
          <Stat label="Closed" value={tC} tone="green"/>
          <Stat label="Overdue" value={tO} tone={tO>0?"amber":"green"}/>
          <Stat label="60+ days" value={tA} tone={tA>0?"red":"green"}/>
        </div>
        {loading&&<p style={{color:MUTED,textAlign:"center",padding:18}}>Loading…</p>}
        <SectionLabel>The team</SectionLabel>
        {staffList.map(p=><ReviewCard key={p.staffId} p={p} e={byId[p.staffId]}
          onTrend={()=>{setTrendStaff(p.staffId);setView("trend");}}/>)}
        <SectionLabel>Value added today</SectionLabel>
        {vAdds.length===0?<Empty text="No value-added entries for this day yet."/>:
          vAdds.map((x,i)=><Surfaced key={i} name={x.p.name} text={x.e.valueAdded} accent={GOLD}/>)}
        <SectionLabel>Innovations &amp; ideas</SectionLabel>
        {innovs.length===0?<Empty text="No ideas logged for this day yet."/>:
          innovs.map((x,i)=><Surfaced key={i} name={x.p.name} text={x.e.innovation} accent={NAVY}/>)}
      </div>
    </Shell>);}

  // ---- one person's history ----------------------------------------------
  if(view==="trend"&&trendStaff){
    if(!me.manager&&me.staffId!==trendStaff) return <Denied onBack={()=>setView("home")}/>;
    const person=roster.find(p=>p.staffId===trendStaff);
    const prof=profileFor(trendStaff);
    const data=entries.filter(e=>e.staffId===trendStaff).sort((a,b)=>a.date.localeCompare(b.date));
    const closedS=data.map(e=>num(e.metrics.closed)||0);
    const overdueS=data.map(e=>num(e.metrics.overdue)||0);
    const labels=data.map(e=>shortDate(e.date));
    const vaCount=data.filter(e=>isRealVA(e.valueAdded)).length;
    const innovCount=data.filter(e=>isRealVA(e.innovation)).length;
    const trainTotal=data.reduce((n,e)=>n+trainingCount(e),0);

    return(<Shell>
      <SubHeader title={person?person.name:trendStaff} sub={prof.grade+" · history & trends"} tenure={prof.tenure} onBack={()=>setView("home")}/>
      <div style={{padding:"0 18px 56px"}}>
        {loading?<p style={{color:MUTED,textAlign:"center",padding:24}}>Loading history…</p>:
         data.length===0?<Empty text="No entries recorded yet for this person."/>:(<React.Fragment>
          <div style={statRow}>
            <Stat label="Days logged" value={data.length} tone="navy"/>
            <Stat label="Value adds" value={vaCount} tone="green"/>
            <Stat label="Ideas" value={innovCount} tone="amber"/>
            <Stat label="Training" value={trainTotal} tone="gold"/>
          </div>
          <SectionLabel>Closed vs overdue</SectionLabel>
          <MiniChart labels={labels} seriesA={closedS} seriesB={overdueS} colorA={GREEN} colorB={AMBER} legendA="Closed" legendB="Overdue"/>
          <SectionLabel>Daily log</SectionLabel>
          {[...data].reverse().map(e=>(
            <div key={e.date} style={{...card,padding:0,overflow:"hidden"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",background:"#FBFAF5",borderBottom:"1px solid "+LINE}}>
                <span style={{fontSize:13,fontWeight:800,color:NAVY}}>{prettyDate(e.date)}</span>
                <span style={{fontSize:11,color:MUTED}}>{num(e.metrics.closed)??"—"} closed · {num(e.metrics.overdue)??"—"} overdue</span>
              </div>
              <div style={{padding:"10px 14px"}}>
                {blocksFor(trendStaff).map(b=>{const d=e.blocks?.[b.id];
                  if(!d||(!txt(d.kpi)&&!txt(d.actioned)))return null;
                  return <div key={b.id} style={{marginBottom:6}}>
                    <span style={{fontSize:11,fontWeight:700,color:NAVY}}>{b.label} · {d.kpi||"—"}</span>
                    {txt(d.actioned)&&<div style={{fontSize:12.5,color:INK,lineHeight:1.45}}>{d.actioned}</div>}
                  </div>;})}
                {txt(e.valueAdded)&&<Line k="Value added" v={e.valueAdded} tone={isRealVA(e.valueAdded)?GOLD:MUTED}/>}
                {txt(e.innovation)&&<Line k="Idea" v={e.innovation} tone={NAVY}/>}
                {txt(e.systemFlags)&&<Line k="Flag" v={e.systemFlags} tone={RED}/>}
              </div>
            </div>))}
        </React.Fragment>)}
      </div>
    </Shell>);}

  return null;
}

//  Sign in
// ===========================================================================
function Login({onIn}){
  const [who,setWho]=useState("");
  const [pw,setPw]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  async function go(ev){
    if(ev) ev.preventDefault();
    if(busy) return;
    setBusy(true); setErr("");
    const r=await api("login",{who:who.trim(),password:pw});
    setBusy(false);
    if(r.ok){ if(r.schedule) SCHEDULE=r.schedule; if(r.kpis) KPI_CHOICES=r.kpis;
      rememberRoles(r.roster); onIn(r.token,r.profile,r.roster); }
    else setErr(r.error||"Could not sign you in.");
  }

  return(<div style={{minHeight:"100vh",background:"linear-gradient(158deg, "+NAVY+" 0%, "+NAVY_DEEP+" 100%)",display:"grid",placeItems:"center",padding:20}}>
    <form onSubmit={go} style={{width:"100%",maxWidth:380}}>
      <div style={{textAlign:"center",marginBottom:24}}>
        <ShieldLogo size={54}/>
        <div style={{color:GOLD_SOFT,fontSize:11,fontWeight:700,letterSpacing:1.8,textTransform:"uppercase",marginTop:10}}>Guardian Life</div>
        <div style={{color:"#fff",fontSize:19,fontWeight:800,marginTop:3}}>Ricky Rampersad's Branch</div>
        <div style={{color:GOLD_SOFT,fontSize:13,marginTop:6}}>Daily KPI &amp; Innovation Tracker</div>
      </div>
      <div style={{background:CARD,borderRadius:14,padding:"20px 18px"}}>
        <Field label="Email or agent number">
          <input value={who} onChange={e=>setWho(e.target.value)} autoComplete="username"
            placeholder="you@myguardiangroup.com" style={inp}/>
        </Field>
        <Field label="Password">
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} autoComplete="current-password"
            placeholder="••••" style={inp}/>
        </Field>
        {err&&<div style={{background:"#FBE9E7",border:"1px solid "+RED,borderRadius:9,padding:"9px 11px",fontSize:12.5,color:"#7A2A24",marginBottom:10,lineHeight:1.4}}>{err}</div>}
        <button type="submit" disabled={busy}
          style={{...submitBtn,width:"100%",flex:"none",opacity:busy?0.65:1}}>
          {busy?"Signing in…":"Sign in"}
        </button>
        <p style={{fontSize:11.5,color:MUTED,textAlign:"center",margin:"12px 0 0",lineHeight:1.45}}>
          Your log-in is on the Access tab of the branch workbook. Forgotten it — ask the Branch Manager.
        </p>
      </div>
      <p style={{color:GOLD_SOFT,fontSize:11,textAlign:"center",marginTop:16,opacity:0.75}}>9–13 Endeavour 1st Street, Chaguanas</p>
    </form>
  </div>);
}

//  Pieces
// ===========================================================================
function Shell({children,wide}){
  return <div style={{minHeight:"100vh",background:PAPER}}>
    <div style={{maxWidth:wide||560,margin:"0 auto",minHeight:"100vh",position:"relative"}}>
      {children}</div></div>;
}

const Splash=({text})=><div style={{minHeight:"100vh",background:PAPER,display:"grid",placeItems:"center"}}>
  <div style={{textAlign:"center"}}><ShieldLogo size={44}/><p style={{color:MUTED,fontSize:13,marginTop:12}}>{text}</p></div></div>;

const Denied=({onBack})=><Shell><div style={{padding:"60px 24px",textAlign:"center"}}>
  <ShieldLogo size={40}/>
  <p style={{fontSize:14,color:INK,marginTop:14,fontWeight:700}}>That view is for the Branch Manager.</p>
  <button onClick={onBack} style={{...primaryWide,maxWidth:220,margin:"18px auto 0"}}>Back</button></div></Shell>;

function SubHeader({title,sub,tenure,onBack}){
  const tag=tenure==="probation"?"Probation":tenure==="training"?"In training":null;
  return<div style={{...mast,paddingBottom:16}}>
    <button onClick={onBack} style={backLink}>← Branch</button>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginTop:8}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <ShieldLogo size={30}/>
        <div>
          <h1 style={{color:"#fff",fontSize:19,fontWeight:800,margin:0}}>{title}</h1>
          <p style={{color:GOLD_SOFT,fontSize:12,margin:"2px 0 0"}}>{sub}</p>
        </div>
      </div>
      {tag&&<span style={pill(GOLD,NAVY_DEEP)}>{tag}</span>}
    </div>
  </div>;
}

function PersonRow({p,today,onOpen,onTrend}){
  const prof=profileFor(p.staffId);
  const tag=prof.tenure==="probation"?"Probation":prof.tenure==="training"?"Training":null;
  const done=today?blocksDone(today):0;
  const tone=!today?LINE:(done>=CHECKPOINT_BLOCKS?GREEN:AMBER);
  return<div style={personRow}>
    <button onClick={onOpen} style={{display:"flex",alignItems:"center",gap:12,background:"none",border:"none",flex:1,textAlign:"left",cursor:"pointer",padding:0}}>
      <div style={{...avatar,boxShadow:"0 0 0 2px "+tone}}>{p.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</div>
      <div>
        <div style={{fontSize:15,fontWeight:700,color:INK}}>{p.name}</div>
        <div style={{fontSize:12,color:MUTED}}>{prof.grade}</div>
        <div style={{fontSize:11,color:today?(done>=CHECKPOINT_BLOCKS?GREEN:AMBER):MUTED,fontWeight:700,marginTop:2}}>
          {today?done+"/4 blocks today":"Nothing logged today"}
        </div>
      </div>
    </button>
    {tag&&<span style={pillOutline(AMBER)}>{tag}</span>}
    <button onClick={onTrend} style={trendChip}>Trends</button>
    <button onClick={onOpen} style={{background:"none",border:"none",color:GOLD,fontSize:20,fontWeight:700,cursor:"pointer"}}>›</button>
  </div>;
}

function ReviewCard({p,e,onTrend}){
  const prof=profileFor(p.staffId);
  const closed=e?(num(e.metrics.closed)??"—"):"—",overdue=e?(num(e.metrics.overdue)??"—"):"—",aged=e?(num(e.metrics.aged60)??"—"):"—";
  const status=!e?"No entry":e.submitted?"Submitted":"Draft";
  const tone=!e?RED:e.submitted?GREEN:AMBER;
  const blocks=e?blocksFor(p.staffId).map(b=>({b,d:e.blocks?.[b.id]})).filter(x=>x.d&&(txt(x.d.kpi)||txt(x.d.actioned)||txt(x.d.resolved))):[];
  return<div style={{...card,padding:0,overflow:"hidden"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",background:"#FBFAF5",borderBottom:"1px solid "+LINE}}>
      <div><div style={{fontSize:14,fontWeight:700,color:INK}}>{p.name}</div><div style={{fontSize:11,color:MUTED}}>{prof.grade}</div></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={onTrend} style={trendChip}>Trends</button>
        <span style={pillOutline(tone)}>{status}</span>
      </div>
    </div>
    <div style={grid3row}>
      <MiniStat label="Closed" value={closed}/>
      <MiniStat label="Overdue" value={overdue} tone={overdue!=="—"&&overdue>0?AMBER:INK}/>
      <MiniStat label="60+ days" value={aged} tone={aged!=="—"&&aged>0?RED:INK} last/>
    </div>
    {blocks.map(({b,d})=><div key={b.id} style={{padding:"9px 14px",borderTop:"1px solid "+LINE}}>
      <div style={{fontSize:11,fontWeight:700,color:NAVY,marginBottom:2}}>{b.label} · {d.kpi||"—"}</div>
      {txt(d.resolved)&&<Line k="Resolved" v={d.resolved} tone={GREEN}/>}
      {txt(d.actioned)&&<Line k="Actioned" v={d.actioned}/>}
      {d.kpi==="Training delivered"&&(txt(d.tr_trainee)||txt(d.tr_topic))&&
        <Line k="Trained" v={(d.tr_trainee||"?")+" — "+(d.tr_topic||"")} tone={GOLD}/>}
      {txt(d.openOwned)&&<Line k="Open" v={d.openOwned} tone={AMBER}/>}
      {(txt(d.blocker)||txt(d.blockerOwner))&&<Line k="Blocked" v={[txt(d.blocker)||"—",txt(d.blockerOwner)].filter(Boolean).join(" · ")} tone={RED}/>}
    </div>)}
    {e&&txt(e.valueAdded)&&<div style={{padding:"9px 14px",borderTop:"1px solid "+LINE,background:"#FCFBF7"}}>
      <Line k="Value added" v={e.valueAdded} tone={isRealVA(e.valueAdded)?GOLD:MUTED}/></div>}
    {e&&txt(e.systemFlags)&&<div style={{padding:"9px 14px",borderTop:"1px solid "+LINE}}><Line k="Flag" v={e.systemFlags} tone={RED}/></div>}
    {e&&txt(e.notes)&&<div style={{padding:"9px 14px",borderTop:"1px solid "+LINE}}><Line k="Note" v={e.notes} tone={MUTED}/></div>}
  </div>;
}

// The task position, read from Salesforce rather than typed. Where Salesforce
// cannot be reached the boxes come back, because a tracker that stops working
// when a connection drops is worse than one that asks.
function TaskPosition({live,staffId,entry,patchMetric}){
  const m=live&&live.ok&&live.staff?live.staff[staffId]:null;
  if(m){
    return <div style={card}>
      <div style={cardHead}>
        <span style={cardTitle}>Task position</span>
        <span style={{fontSize:10.5,color:GREEN,fontWeight:700}}>live from Salesforce</span>
      </div>
      <div style={grid3row}>
        <MiniStat label="Closed today" value={m.closed} tone={GREEN}/>
        <MiniStat label="Open now" value={m.open}/>
        <MiniStat label="Overdue" value={m.overdue} tone={m.overdue>0?AMBER:INK} last/>
      </div>
      <div style={{display:"flex",gap:14,padding:"9px 2px 0",fontSize:11.5,color:MUTED}}>
        <span><b style={{color:m.aged60>0?RED:INK}}>{m.aged60}</b> at 60+ days</span>
        {m.noDate>0&&<span><b style={{color:AMBER}}>{m.noDate}</b> with no due date</span>}
      </div>
      {m.noDate>0&&<p style={{fontSize:11.5,color:AMBER,margin:"8px 0 0",lineHeight:1.45}}>
        A task with no due date can never be overdue, so it never shows up in any report.
        Give those a date, or close them.
      </p>}
      <p style={{fontSize:11,color:MUTED,margin:"8px 0 0",lineHeight:1.4}}>
        Nothing to type — these come straight from your Salesforce tasks.
      </p>
    </div>;
  }
  const why=live&&live.reason==="notConfigured"
    ? "Salesforce is not connected yet, so these are typed for now."
    : "Salesforce could not be reached, so type them for now.";
  return <div style={card}>
    <div style={cardHead}><span style={cardTitle}>Task position · Salesforce</span>
      <span style={{fontSize:10.5,color:AMBER,fontWeight:700}}>typed</span></div>
    <p style={{fontSize:11.5,color:MUTED,margin:"0 0 8px",lineHeight:1.4}}>{why}</p>
    <div style={grid3}>
      <Field label="Closed today"><input inputMode="numeric" value={entry.metrics.closed} onChange={e=>patchMetric("closed",e.target.value)} placeholder="0" style={inp}/></Field>
      <Field label="Overdue now"><input inputMode="numeric" value={entry.metrics.overdue} onChange={e=>patchMetric("overdue",e.target.value)} placeholder="0" style={inp}/></Field>
      <Field label="Of those, 60+ days"><input inputMode="numeric" value={entry.metrics.aged60} onChange={e=>patchMetric("aged60",e.target.value)} placeholder="0" style={inp}/></Field>
    </div>
  </div>;
}

// A task you can fix from here. The reason and the due date are the two things
// that make an overdue task legible, and both were a trip to Salesforce. Now
// they are a line and a button, and the row confirms what it did.
function TaskRow({t,onSaved,api,token,showDate}){
  const [reason,setReason]=useState("");
  const [due,setDue]=useState("");
  const [st,setSt]=useState({tone:"idle",text:""});
  const [done,setDone]=useState(null);

  async function save(field,value){
    if(st.tone==="saving") return;
    setSt({tone:"saving",text:"Saving…"});
    const r=await api("updateTask",{token,taskId:t.id,field,value});
    if(r.ok){
      setSt({tone:"ok",text:r.label+" saved to Salesforce ✓"});
      setDone(d=>({...(d||{}),[field]:value}));
      if(onSaved) onSaved();
    }else setSt({tone:"bad",text:r.error||"Did not save."});
  }

  const age=t.age||0;
  return <div style={{padding:"10px 0",borderTop:"1px solid "+LINE}}>
    <div style={{display:"flex",gap:8,alignItems:"baseline"}}>
      {t.repeat&&<span style={{fontSize:9.5,fontWeight:800,color:RED,border:"1px solid "+RED,
        borderRadius:3,padding:"0 4px",flexShrink:0}}>REPEAT</span>}
      <span style={{fontSize:12.5,color:INK,lineHeight:1.4}}>{t.subject}</span>
    </div>
    <div style={{fontSize:11,color:MUTED,marginTop:2}}>
      {t.type||t.status} · due {shortDate(done?.due||t.due)} ·{" "}
      <b style={{color:age>60?RED:age>30?AMBER:MUTED}}>{age} days old</b>
    </div>

    {done?.reason
      ? <div style={{fontSize:12,color:GREEN,marginTop:6,lineHeight:1.45}}>
          <b>Reason:</b> {done.reason}</div>
      : <div style={{display:"flex",gap:6,marginTop:7}}>
          <input value={reason} onChange={e=>setReason(e.target.value)}
            placeholder="What it is waiting on, and who owns the next step"
            style={{...inp,fontSize:12.5,padding:"7px 9px"}}/>
          <button onClick={()=>save("reason",reason)} disabled={st.tone==="saving"||reason.trim().length<4}
            style={{...goldBtn,padding:"7px 12px",fontSize:12,
              opacity:(st.tone==="saving"||reason.trim().length<4)?0.5:1}}>Save</button>
        </div>}

    {showDate&&!done?.due&&<div style={{display:"flex",gap:6,marginTop:6,alignItems:"center"}}>
      <span style={{fontSize:11,color:MUTED,fontWeight:600}}>New due date</span>
      <input type="date" value={due} onChange={e=>setDue(e.target.value)}
        style={{...inp,fontSize:12.5,padding:"6px 8px",width:"auto",flex:"0 1 auto"}}/>
      <button onClick={()=>save("due",due)} disabled={st.tone==="saving"||!due}
        style={{...goldBtn,padding:"7px 12px",fontSize:12,opacity:(st.tone==="saving"||!due)?0.5:1}}>Set</button>
    </div>}

    {st.text&&<div style={{fontSize:11.5,fontWeight:700,marginTop:6,
      color:st.tone==="bad"?RED:st.tone==="ok"?GREEN:MUTED}}>{st.text}</div>}
  </div>;
}

// Overdue tasks carrying nothing in the reason field. The branch built that
// field for this; it is filled on about one overdue task in twenty. An overdue
// task with a reason is work in progress. One without is a task nobody has
// looked at — so those are the ones named here.
function NeedsReason({items,api,token,onSaved}){
  if(!items||!items.length) return null;
  const show=items.slice(0,6);
  return <div style={{...card,borderLeft:"4px solid "+RED}}>
    <div style={cardHead}>
      <span style={cardTitle}>Overdue with no reason given</span>
      <span style={{fontSize:10.5,color:RED,fontWeight:700}}>{items.length}</span>
    </div>
    <p style={{fontSize:11.5,color:MUTED,margin:"0 0 10px",lineHeight:1.45}}>
      The due date has passed and the Task Update Reason is empty. Put a line in
      Salesforce saying what it is waiting on and who owns the next step — a
      rolled date is not an actioned task.
    </p>
    {show.map(t=><TaskRow key={t.id} t={t} api={api} token={token} showDate={!t.due} onSaved={onSaved}/>)}
    {items.length>show.length&&<div style={{fontSize:11.5,color:MUTED,marginTop:8}}>
      and {items.length-show.length} more.</div>}
  </div>;
}

// Billing is the branch's most repetitive work, and its easiest to send twice.
// The same account carrying more than one open billing task is the signal that
// the last one was never reconciled — so those come first, by name.
function BillingCheck({data,api,token,onSaved}){
  if(!data||!data.items||!data.items.length) return null;
  const reps=data.repeats||[];
  const show=data.items.slice(0,8);
  return <div style={{background:"#F4F7FB",border:"1px solid "+NAVY,borderRadius:10,
    padding:"12px 13px",marginTop:6,marginBottom:4}}>
    <div style={{fontSize:11,fontWeight:800,letterSpacing:0.8,textTransform:"uppercase",
      color:NAVY,marginBottom:6}}>Reference check · before you send</div>
    <p style={{fontSize:11.5,color:MUTED,margin:"0 0 10px",lineHeight:1.45}}>
      What is already open against these accounts. Check the last one landed
      before sending the next.
    </p>

    {reps.length>0&&<div style={{background:"#FBE9E7",border:"1px solid "+RED,
      borderRadius:8,padding:"9px 11px",marginBottom:10}}>
      <div style={{fontSize:10.5,fontWeight:800,letterSpacing:0.6,textTransform:"uppercase",
        color:RED,marginBottom:4}}>Sent more than once, still open</div>
      {reps.slice(0,4).map(r=>(
        <div key={r.account} style={{fontSize:12.5,color:INK,lineHeight:1.5}}>
          <b>{r.account}</b> — {r.open} open billing tasks
        </div>))}
      <div style={{fontSize:11,color:"#7A2A24",marginTop:5,lineHeight:1.4}}>
        One account, several periods. That is one unreconciled job, not several new ones.
      </div>
    </div>}

    {show.map(t=>t.hasReason
      ? <div key={t.id} style={{padding:"8px 0",borderTop:"1px solid "+LINE}}>
          <div style={{fontSize:12.5,color:INK,lineHeight:1.4}}>{t.subject}</div>
          <div style={{fontSize:11,color:MUTED,marginTop:2}}>
            {t.status} · due {shortDate(t.due)} ·{" "}
            <b style={{color:t.age>60?RED:t.age>30?AMBER:MUTED}}>{t.age} days old</b>
            <span style={{color:GREEN}}> · reason recorded</span></div>
        </div>
      : <TaskRow key={t.id} t={t} api={api} token={token} showDate={!t.due} onSaved={onSaved}/>)}
    {data.items.length>show.length&&<div style={{fontSize:11.5,color:MUTED,marginTop:8}}>
      and {data.items.length-show.length} more open.</div>}
  </div>;
}

const BlockPips=({done})=><div style={{display:"flex",gap:4,padding:"8px 14px",borderBottom:"1px solid "+LINE}}>
  {[0,1,2,3].map(i=><div key={i} style={{flex:1,height:5,borderRadius:3,
