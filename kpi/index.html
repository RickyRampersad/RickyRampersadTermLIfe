function MoveRow({label,now,was,good,first,comparable}){
  const d=(now||0)-(was||0);
  const better=good==="down"?d<0:d>0;
  const tone=d===0?MUTED:(good==="flat"?INK:(better?GREEN:RED));
  const arrow=d>0?"▲":d<0?"▼":"—";
  return<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderTop:first?"none":"1px solid "+LINE}}>
    <span style={{fontSize:13}}>{label}</span>
    <span style={{display:"flex",alignItems:"baseline",gap:7}}>
      <b style={{fontSize:15,fontWeight:800}}>{now}</b>
      {comparable&&<span style={{fontSize:10.5,color:tone,fontWeight:700}}>{arrow}{d===0?"":" "+Math.abs(d)}</span>}
    </span>
  </div>;
}

function MiniChart({labels,seriesA,seriesB,colorA,colorB,legendA,legendB}){
  const max=Math.max(...seriesA,...seriesB,1),W=320,H=120,pad=8,n=labels.length;
  const x=i=>n<=1?W/2:pad+(i*(W-pad*2))/(n-1);
  const y=v=>H-pad-(v/max)*(H-pad*2);
  const path=s=>s.map((v,i)=>(i===0?"M":"L")+" "+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  return<div style={{...card,padding:14}}>
    <div style={{display:"flex",gap:16,marginBottom:8}}><Legend color={colorA} label={legendA}/><Legend color={colorB} label={legendB}/></div>
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto"}}>
      <line x1={pad} y1={H-pad} x2={W-pad} y2={H-pad} stroke={LINE} strokeWidth="1"/>
      <path d={path(seriesA)} fill="none" stroke={colorA} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      <path d={path(seriesB)} fill="none" stroke={colorB} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {seriesA.map((v,i)=><circle key={"a"+i} cx={x(i)} cy={y(v)} r="3" fill={colorA}/>)}
      {seriesB.map((v,i)=><circle key={"b"+i} cx={x(i)} cy={y(v)} r="3" fill={colorB}/>)}
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:4}}>
      {labels.map((l,i)=><span key={i} style={{fontSize:9.5,color:MUTED,flex:1,textAlign:"center"}}>{l}</span>)}
    </div>
  </div>;
}

const rememberRoles=(roster)=>{const m={};(roster||[]).forEach(p=>{

const Legend=({color,label})=><span style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:MUTED,fontWeight:600}}><span style={{width:10,height:10,borderRadius:3,background:color}}/>{label}</span>;
function SectionLabel({children}){return<div style={{display:"flex",alignItems:"center",gap:10,margin:"22px 0 10px"}}><span style={{fontSize:11,fontWeight:800,letterSpacing:1.1,textTransform:"uppercase",color:NAVY}}>{children}</span><span style={{flex:1,height:1,background:GOLD,opacity:0.45}}/></div>;}
const Field=({label,children})=><div style={{marginBottom:10}}><label style={{display:"block",fontSize:11,fontWeight:600,color:MUTED,marginBottom:4}}>{label}</label>{children}</div>;
function Stat({label,value,tone}){const c=tone==="green"?GREEN:tone==="amber"?AMBER:tone==="red"?RED:tone==="gold"?GOLD:NAVY;
  return<div style={{flex:1,background:CARD,border:"1px solid "+LINE,borderRadius:10,padding:"12px 4px",textAlign:"center"}}>
    <div style={{fontSize:19,fontWeight:800,color:c,lineHeight:1}}>{value}</div>
    <div style={{fontSize:9.5,color:MUTED,marginTop:4,fontWeight:600}}>{label}</div></div>;}
const MiniStat=({label,value,tone=INK,last})=><div style={{padding:"10px 6px",textAlign:"center",borderRight:last?"none":"1px solid "+LINE}}><div style={{fontSize:17,fontWeight:800,color:tone}}>{value}</div><div style={{fontSize:10,color:MUTED,fontWeight:600}}>{label}</div></div>;
const Line=({k,v,tone=INK})=><div style={{fontSize:12.5,lineHeight:1.45,marginTop:2}}><span style={{fontWeight:700,color:tone,fontSize:10.5,textTransform:"uppercase",letterSpacing:0.3}}>{k}: </span><span style={{color:INK}}>{v}</span></div>;
const Empty=({text})=><p style={{color:MUTED,fontSize:13,padding:"2px 2px"}}>{text}</p>;
const Surfaced=({name,text,accent})=><div style={{...card,padding:13,borderLeft:"4px solid "+accent}}><div style={{fontSize:12,fontWeight:700,color:NAVY,marginBottom:3}}>{name}</div><div style={{fontSize:13.5,color:INK,lineHeight:1.5}}>{text}</div></div>;
