// The branch reads this on three things: a phone at a desk, a tablet in a
// meeting, and a laptop for the reports. Same app, three shapes — the phone
// layout stretched across a monitor wastes the room the reports need.
function useViewport() {
  const read = () => {
    const w = typeof window !== "undefined" ? window.innerWidth : 560;
    return {
      w,
      phone: w < 680,
      tablet: w >= 680 && w < 1024,
      desktop: w >= 1024,
      wide: w >= 680
    };
  };
  const [v, setV] = useState(read);
  useEffect(() => {
    let f = null;
    const on = () => {
      if (f) cancelAnimationFrame(f);
      f = requestAnimationFrame(() => setV(read()));
    };
    window.addEventListener("resize", on);
    window.addEventListener("orientationchange", on);
    return () => {
      window.removeEventListener("resize", on);
      window.removeEventListener("orientationchange", on);
      if (f) cancelAnimationFrame(f);
    };
  }, []);
  return v;
}

// ---------------------------------------------------------------------------
//  Talking to the sheet
//  Everything goes through POST so the reply can actually be read. The old
//  version posted with no-cors, which returns an opaque response — the Submit
//  button could never tell whether the save landed, so it always claimed it had.
// ---------------------------------------------------------------------------
// Apps Script is not fast and a branch is not always on good signal. A single
// dropped request used to read as "could not reach the sheet", which sends
// somebody who has just typed out a whole block back to a login screen — the
// most expensive possible failure. So: try again once, quietly, before saying
// anything went wrong.
async function apiOnce(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, ...payload })
  });
  // Apps Script answers a POST with a 302 to a one-shot result URL. When the
  // script is busy that result is not always there yet, and the browser sees a
  // 404 — which is not "no such endpoint", it is "not ready". Treating it as
  // final is what put "Server returned 404." in front of somebody who had just
  // typed out a whole block. 404, 429 and 5xx all get another go.
  if (!res.ok) {
    const again = res.status === 404 || res.status === 429 || res.status >= 500;
    return {
      ok: false,
      error: again
        ? "The sheet is busy. Trying again…"
        : "Server returned " + res.status + ".",
      _retry: again
    };
  }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch {
    return { ok: false,
      error: "Unreadable reply from the sheet. Re-deploy the Apps Script with access set to Anyone." };
  }
}

// onAttempt is told which try is starting, so a screen can show that
// something is still happening. Sasha pressed Sign in five times on 3
// September because one static label sat there for half a minute and there
// was no way to tell the difference between working and frozen.
async function api(action, payload, onAttempt) {
  if (!configured()) return { ok: false, error: "No Apps Script URL set in this file." };
  let last = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, attempt * 1500));
    if (onAttempt) { try { onAttempt(attempt + 1); } catch (e) {} }
    try {
      const out = await apiOnce(action, payload);
      if (out && out.ok) return out;
      if (out && !out._retry) return out;      // a real answer, just not a happy one
      last = out;
    } catch (e) {
      // A thrown fetch is not the same as a refusal — the request never
      // completed. On a phone over LTE that is usually the connection
      // dropping a slow request. Say both, and blame neither: the last time
      // this message mentioned a connection, somebody restarted their phone
      // over a fault in this script.
      last = { ok: false,
        error: "The sheet did not answer. It is slow today, so a weak signal can drop the request — press Sign in once more, and tell the Branch Manager if it keeps happening." };
    }
  }
  // Every attempt is spent. "Trying again..." was true a moment ago and is not
  // any more, so do not leave it on the screen as if something were still
  // happening.
  if (last && last._retry) {
    last = { ok: false,
      error: "The sheet did not answer after three tries. It is busy, not broken — wait a moment and press Submit again." };
  }
  return last;
}

// ---------------------------------------------------------------------------
//  The draft, kept on the phone
//
//  Two people lost an afternoon's typing on 2 September: the sheet did not
//  answer, and what they had written existed nowhere but in the page. A block
//  can take five minutes to write and a second to lose.
//
//  So every keystroke is now kept on the device, per person per day. It is
//  read back when the day is opened, and it only ever fills a box the sheet
//  returned empty — a saved block always wins over a draft of itself. A block
//  that comes back confirmed is dropped from the draft.
//
//  This is deliberately the dumbest possible mechanism. It has to work when
//  the network does not.
// ---------------------------------------------------------------------------
const draftKey = (staffId, date) => "rrb_kpi_draft_" + staffId + "_" + date;

const readDraft = (staffId, date) => {
  try {
    const raw = localStorage.getItem(draftKey(staffId, date));
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
};

const writeDraft = (staffId, date, entry) => {
  if (!staffId || !date || !entry) return;
  try {
    localStorage.setItem(draftKey(staffId, date), JSON.stringify({
      blocks: entry.blocks || {},
      valueAdded: entry.valueAdded || "",
      innovation: entry.innovation || "",
      systemFlags: entry.systemFlags || "",
      notes: entry.notes || "",
      metrics: entry.metrics || {},
      savedAt: Date.now()
    }));
  } catch {}
};

// One block landed. Forget our copy of it, keep the rest.
const clearDraftBlock = (staffId, date, bid) => {
  try {
    const d = readDraft(staffId, date);
    if (!d || !d.blocks) return;
    delete d.blocks[bid];
    localStorage.setItem(draftKey(staffId, date), JSON.stringify(d));
  } catch {}
};

// Old drafts are not worth keeping — a fortnight is well past the point where
// anybody is still going back to finish a block.
const pruneDrafts = () => {
  try {
    const cutoff = Date.now() - 14 * 864e5;
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k || k.indexOf("rrb_kpi_draft_") !== 0) continue;
      let d = null;
      try { d = JSON.parse(localStorage.getItem(k)); } catch {}
      if (!d || !d.savedAt || d.savedAt < cutoff) localStorage.removeItem(k);
    }
  } catch {}
};

// The sheet is the record; the draft only speaks where the sheet is silent.
function overlayDraft(entry, draft) {
  if (!draft) return entry;
