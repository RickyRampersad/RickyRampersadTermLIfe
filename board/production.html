<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Wall | Ricky Rampersad Branch</title>
<meta name="description" content="Rotating production wall for the branch — picked-up production, increases and held-back API, from Salesforce.">
<meta name="theme-color" content="#061c31">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same design system as /wall/ — this is its sibling board. */
  :root{
    --ink:#eaf4ff; --dim:#9dbdd8; --faint:#6d8ba6;
    --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
    --blue:#37b1ec; --blue2:#0b7fd4; --teal:#0fb5a5;
    --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --gold:#f5b93b;
    --grad:linear-gradient(120deg,#37b1ec,#0b7fd4);
    --grad-gold:linear-gradient(120deg,#f5b93b,#e08b1e);
    --grad-red:linear-gradient(120deg,#fb7185,#dc3d58);
    --r:18px; --ease:cubic-bezier(.16,1,.3,1);
    --font-d:'Plus Jakarta Sans',Inter,system-ui,sans-serif;
    --font-b:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font-b);color:var(--ink);background:#061c31;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(1200px 700px at 12% -8%,rgba(55,177,236,.22),transparent 60%),
      radial-gradient(900px 600px at 92% 4%,rgba(11,127,212,.20),transparent 62%),
      radial-gradient(800px 700px at 60% 108%,rgba(15,181,165,.13),transparent 60%),
      linear-gradient(165deg,#061c31 0%,#08243f 55%,#061a2d 100%)}

  header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:16px;
    padding:16px 26px}
  /* THE BRANCH MARK — a gold shield with a check, not a monogram. These three
     board screens were the last places still drawing an invented "RR" tile on
     a blue gradient. The intelligence walls and the films all carry the real
     mark; a branch whose screens disagree about its own logo is the one thing
     everybody in the room notices. */
  header .mark{width:44px;height:44px;flex:none;border-radius:13px;overflow:hidden;
    background:#07131f;display:grid;place-items:center}
  header .mark img{width:44px;height:44px;display:block}
  header h1{margin:0;font-family:var(--font-d);font-size:18px;font-weight:800;letter-spacing:-.3px}
  header .sub{font-size:12px;color:var(--dim);margin-top:2px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:12.5px;font-weight:650;
    padding:8px 15px;border-radius:22px;cursor:pointer;transition:.25s var(--ease)}
  .btn:hover{border-color:rgba(255,255,255,.3)}
  .btn.on{background:var(--grad-gold);color:#3a2404;border-color:transparent}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
  .live.on i{background:var(--good);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(52,211,153,0)}}
  #clock{font-family:var(--font-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--dim)}

  .dots{position:fixed;bottom:22px;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:9px}
  .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:.3s var(--ease)}
  .dots i.on{background:var(--gold);transform:scale(1.25)}
  #bar{position:fixed;bottom:0;left:0;z-index:20;height:3px;background:var(--grad-gold);width:0%}
  #bar.run{transition:width linear}

  .slide{position:fixed;inset:0;padding:96px 70px 74px;display:flex;flex-direction:column;justify-content:center;
    opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease),visibility .7s}
  .slide.on{opacity:1;visibility:visible;transform:none}
  .slide .kick{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
  .slide .kick.red{color:var(--bad)}
  .slide h2{margin:0 0 6px;font-family:var(--font-d);font-size:46px;font-weight:800;letter-spacing:-1.2px;line-height:1.06}
  .slide .lede{font-size:17px;color:var(--dim);max-width:960px;line-height:1.55;margin:0 0 30px}
  .slide .body{flex:0 0 auto;min-height:0}

  .periods{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .period{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:34px 36px;backdrop-filter:blur(10px)}
  .period .k{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:650}
  .period .v{font-family:var(--font-d);font-size:62px;font-weight:800;letter-spacing:-2.2px;margin-top:12px;
    font-variant-numeric:tabular-nums;line-height:1;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .period.gold .v{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text}
  .period.red .v{background:var(--grad-red);-webkit-background-clip:text;background-clip:text}
  .period .n{font-size:16.5px;color:var(--ink);margin-top:14px;font-weight:650}
  .period .mix{font-size:12.5px;color:var(--faint);margin-top:6px}
  .period .d{font-size:14px;color:var(--dim);margin-top:8px;line-height:1.5}
  .period .d.up{color:var(--good)}.period .d.down{color:var(--bad)}

  .cols{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:stretch}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;backdrop-filter:blur(10px)}
  .panel h3{margin:0 0 16px;font-family:var(--font-d);font-size:15px;font-weight:750;letter-spacing:.02em}

  .bars{display:flex;align-items:flex-end;gap:16px;height:320px}
  .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:9px;height:100%}
  .bar .amt{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
  .bar .stack{width:100%;max-width:74px;display:flex;flex-direction:column;justify-content:flex-end;
    border-radius:10px 10px 4px 4px;overflow:hidden;transform-origin:bottom;transition:transform .9s var(--ease)}
  .bar .stack .new{background:var(--grad)}
  .bar .stack .inc{background:var(--grad-gold)}
  .bar.now .stack .new{background:var(--grad-gold)}
  .bar.now .stack .inc{background:var(--grad)}
  .slide:not(.on) .bar .stack{transform:scaleY(0)}
  .bar .lab{font-size:13px;color:var(--faint);font-weight:600;white-space:nowrap}
  .bar .n{font-size:11.5px;color:var(--faint)}
  .bar.now .lab{color:var(--ink)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  .rows{display:flex;flex-direction:column;gap:13px}
  .row{display:flex;align-items:center;gap:14px;font-size:16px}
  .row .rk{width:34px;flex:none;font-family:var(--font-d);font-weight:800;font-size:15px;color:var(--faint);text-align:center}
  .row:nth-child(1) .rk,.row:nth-child(2) .rk,.row:nth-child(3) .rk{color:var(--gold)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .row .track{flex:1.4;height:12px;background:rgba(255,255,255,.08);border-radius:7px;overflow:hidden}
  .row .track i{display:block;height:100%;background:var(--grad);border-radius:7px;transition:width .9s var(--ease)}
  .row .track i.red{background:var(--grad-red)}
  .slide:not(.on) .row .track i{width:0!important}
  .row .val{width:130px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .row .sub{font-size:12.5px;color:var(--faint);width:96px;text-align:right}

  table{width:100%;border-collapse:collapse;font-size:15.5px}
  th{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:650;
    text-align:left;padding:0 14px 12px}
  td{padding:12px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  td:last-child,th:last-child{text-align:right}
  td b{font-weight:700}
  .chip{display:inline-block;font-size:12px;font-weight:650;padding:4px 12px;border-radius:20px;
    border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--dim);white-space:nowrap}
  .chip.good{color:var(--good);border-color:rgba(52,211,153,.35)}
  .chip.warn{color:var(--warn);border-color:rgba(251,191,36,.35)}
  .chip.bad{color:var(--bad);border-color:rgba(251,113,133,.35)}

  .hb{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}
  .hb .big{font-family:var(--font-d);font-size:88px;font-weight:800;letter-spacing:-3px;line-height:1;
    background:var(--grad-red);-webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums}
  .hb .cap{font-size:16px;color:var(--dim);line-height:1.6}
  .hb .cap b{color:var(--ink)}

  footer{position:fixed;bottom:20px;left:26px;z-index:20;font-size:11.5px;color:var(--faint)}
  .hint{position:fixed;bottom:20px;right:26px;z-index:20;font-size:11.5px;color:var(--faint)}

  @media (max-width:1100px){
    .slide{padding:88px 34px 70px}
    .slide h2{font-size:32px}
    .periods,.cols{grid-template-columns:1fr}
    .period .v{font-size:42px}
    .hb .big{font-size:54px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    .slide:not(.on) .bar .stack{transform:none}.slide:not(.on) .row .track i{width:auto!important}}
</style>
</head>
<body>

<header>
  <div class="mark"><img src="../logo-mark.png" alt=""></div>
  <div>
    <h1>Production Wall</h1>
    <div class="sub">Ricky Rampersad Branch · picked up for production · Salesforce</div>
  </div>
  <div class="right">
    <button class="btn" id="soundBtn" title="Voice and music">🔇 Sound</button>
    <button class="btn" id="pauseBtn" title="Pause the rotation">⏸ Pause</button>
    <span class="live" id="live"><i></i><span id="liveTxt">Snapshot</span></span>
    <span id="clock"></span>
  </div>
</header>

<div id="slides"></div>
<div class="dots" id="dots"></div>
<div id="bar"></div>
<footer id="src"></footer>
<div class="hint">←&nbsp;→ change &nbsp;·&nbsp; space pause &nbsp;·&nbsp; F full screen</div>

<script>
/* ── DATA ────────────────────────────────────────────────────────────────────
   Production = CLIENT_PORTFOLIO__c on Production_Picked_up_Date__c summing
   Total_API__c, PLUS Policy_Increases__c on Increase_Production_Picked_Up_Date__c
   summing Increase_API__c — new business and increases, merged.

   Held-back = apps received this year (App_Received_Date__c) with no
   production picked-up date: submitted business waiting on requirements.

   What ships here is a snapshot queried on the date in the footer. For live
   numbers deploy apps-script/WallBoard.gs (WALL-SETUP.md) and paste the /exec
   URL below. Snapshot advisors are first name + initial because this repo is
   public; the live feed (never committed) carries full names. Client fields
   are never queried for this board.                                        */
var WALL_DATA_URL = "";   // ← Apps Script /exec URL, or leave "" for snapshot

var PROD_DATA = {
  generatedAt: "2026-08-26T12:55:00Z",
  week:  { n:3, api:25557, incN:0, inc:0, prevN:15, prevApi:101521, prevInc:0 },
  month: { label:"August", n:46, api:833799, incN:0, inc:0,
           lastYearN:71, lastYearApi:636762, lastYearIncN:14, lastYearInc:39133 },
  ytd:   { year:2026, n:706, api:5800544, incN:78, inc:497811,
           lastYearN:909, lastYearApi:8362421, lastYearIncN:131, lastYearInc:1021505 },
  monthly: [
    {m:"Jan", n:118, api:921362, incN:11, inc:132330},
    {m:"Feb", n:96,  api:717399, incN:10, inc:34092},
    {m:"Mar", n:81,  api:694176, incN:15, inc:47430},
    {m:"Apr", n:98,  api:685817, incN:19, inc:139841},
    {m:"May", n:112, api:769186, incN:14, inc:87190},
    {m:"Jun", n:62,  api:449384, incN:5,  inc:52435},
    {m:"Jul", n:93,  api:729421, incN:4,  inc:4493},
    {m:"Aug", n:46,  api:833799, incN:0,  inc:0}
  ],
  weekly: [
    {w:"Wk 27", n:16, api:81768},
    {w:"Wk 28", n:10, api:75747},
    {w:"Wk 29", n:16, api:112959},
    {w:"Wk 30", n:14, api:194144},
    {w:"Wk 31", n:33, api:250400},
    {w:"Wk 32", n:6,  api:405382},
    {w:"Wk 33", n:25, api:326591},
    {w:"Last wk", n:15, api:101521},
    {w:"This wk", n:3, api:25557}
  ],
  heldBack: {
    n:176, api:10022580, avgDays:207,
    bands: [
      {k:"Under 2 weeks", n:28,  api:1070133},
      {k:"2 – 4 weeks",   n:7,   api:80265},
      {k:"1 – 2 months",  n:16,  api:121667},
      {k:"Over 2 months", n:125, api:8750515}
    ],
    byAgent: [
      {a:"Akaash K.", n:6,  api:4305200},
      {a:"Ricky R.",  n:40, api:3334300},
      {a:"Fawwaz M.", n:4,  api:333480},
      {a:"Varun S.",  n:17, api:317573},
      {a:"Gary S.",   n:7,  api:238182},
      {a:"Anthony S.",n:8,  api:209208}
    ],
    top: [
      {a:"Akaash K.", api:2000000, days:198},
      {a:"Akaash K.", api:1279028, days:74},
      {a:"Akaash K.", api:840306,  days:204},
      {a:"Ricky R.",  api:359694,  days:7},
      {a:"Ricky R.",  api:228600,  days:118},
      {a:"Ricky R.",  api:196560,  days:118}
    ]
  },
  /* Total API basis — new business + increases, matching the Monday report */
  leaders: [
    {a:"Varun S.",     n:27, api:637563},
    {a:"Gary S.",      n:50, api:462011},
    {a:"Anthony S.",   n:64, api:454380},
    {a:"Aidan E.",     n:66, api:380307},
    {a:"Fawwaz M.",    n:28, api:352783},
    {a:"Randolph G.",  n:23, api:347321},
    {a:"Ricky R.",     n:22, api:309970},
    /* An agent who has left the branch stood here at 58 / TT$254,893. The name
       comes off; the branch's year does not change, because the branch wrote
       that business — see the note under the year figure. */
    {a:"Premchand D.", n:20, api:234947},
    {a:"John B.",      n:55, api:214990}
  ],
  latest: [
    {a:"Daniel B.",  d:"2026-08-25", api:15402},
    {a:"Rajiv S.",   d:"2026-08-25", api:5543},
    {a:"Rajiv S.",   d:"2026-08-25", api:4613},
    {a:"Gary S.",    d:"2026-08-21", api:13060},
    {a:"Gary S.",    d:"2026-08-21", api:12145},
    {a:"Premchand D.",d:"2026-08-21", api:11623},
    {a:"Varun S.",   d:"2026-08-21", api:5960},
    {a:"Naila S.",   d:"2026-08-21", api:3456}
  ]
};

/* ── helpers ── */
function $(s,el){return (el||document).querySelector(s)}
function money(n){return "TT$" + Math.round(n).toLocaleString("en-US")}
function moneyShort(n){
  if(n>=1e6) return "TT$" + (n/1e6).toFixed(n>=1e7?1:2) + "m";
  if(n>=1e3) return "TT$" + Math.round(n/1e3) + "k";
  return "TT$" + Math.round(n);
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dstr(iso){
  var d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function deltaLine(now,then,label){
  var p = then ? (now-then)/then*100 : 0;
  return '<div class="d '+(p>=0?"up":"down")+'">'+(p>=0?"▲ +":"▼ ")+Math.abs(p).toFixed(1)+"% "+label+'</div>';
}
function mixLine(api,inc){
  return inc>0 ? '<div class="mix">'+moneyShort(api)+' new business + '+moneyShort(inc)+' increases</div>'
               : '<div class="mix">all new business</div>';
}

/* ── slides ── */
function sPulse(D){
  var w=D.week, m=D.month, y=D.ytd;
  var wAll=w.api+w.inc, mAll=m.api+m.inc, yAll=y.api+y.inc;
  return '<div class="kick">Picked up for production · new business + increases</div>'
    +'<h2>Production — week · month · year</h2>'
    +'<p class="lede">Every policy counted here has a production picked-up date; increases are counted on their own picked-up date and merged in.</p>'
    +'<div class="body"><div class="periods">'
    +'<div class="period gold"><div class="k">This week</div><div class="v">'+moneyShort(wAll)+'</div>'
    +'<div class="n">'+(w.n+w.incN)+' '+((w.n+w.incN)===1?"pickup":"pickups")+'</div>'+mixLine(w.api,w.inc)
    +deltaLine(wAll,w.prevApi+w.prevInc,"vs last week ("+moneyShort(w.prevApi+w.prevInc)+")")+'</div>'
    +'<div class="period"><div class="k">'+esc(m.label)+' so far</div><div class="v">'+moneyShort(mAll)+'</div>'
    +'<div class="n">'+(m.n+m.incN)+' pickups</div>'+mixLine(m.api,m.inc)
    +deltaLine(mAll,m.lastYearApi+m.lastYearInc,"vs "+esc(m.label)+" last year")+'</div>'
    +'<div class="period"><div class="k">Year to date · '+y.year+'</div><div class="v">'+moneyShort(yAll)+'</div>'
    +'<div class="n">'+(y.n+y.incN)+' pickups</div>'+mixLine(y.api,y.inc)
    +deltaLine(yAll,y.lastYearApi+y.lastYearInc,"vs this point in "+(y.year-1))+'</div>'
    +'</div></div>';
}
function sHeldBack(D){
  var H=D.heldBack;
  var max = Math.max.apply(null,H.bands.map(function(b){return b.api}));
  var rows = H.bands.map(function(b){
    return '<div class="row"><span class="nm">'+esc(b.k)+'</span>'
      +'<span class="track"><i class="red" style="width:'+Math.max(2,b.api/max*100)+'%"></i></span>'
      +'<span class="val">'+moneyShort(b.api)+'</span><span class="sub">'+b.n+' apps</span></div>';
  }).join("");
  var over60 = H.bands[H.bands.length-1];
  return '<div class="kick red">Deep dive · held-back API</div>'
    +'<h2>'+moneyShort(H.api)+' is written — and waiting</h2>'
    +'<p class="lede">Apps received this year, still not picked up for production because requirements are outstanding. This money is already sold; it counts the day the file closes.</p>'
    +'<div class="body"><div class="cols">'
    +'<div class="panel"><h3>How long it has been waiting</h3><div class="rows">'+rows+'</div></div>'
    +'<div class="panel"><div class="hb">'
    +'<div class="big">'+H.n+'</div>'
    +'<div class="cap"><b>apps held back</b>, waiting an average of <b>'+H.avgDays+' days</b>.<br>'
    +moneyShort(over60.api)+' of it — '+over60.n+' apps — has waited <b>over two months</b>. '
    +'Every requirement chased is API released.</div>'
    +'</div></div>'
    +'</div></div>';
}
function sHeldWho(D){
  var H=D.heldBack;
  var max = Math.max.apply(null,H.byAgent.map(function(x){return x.api}));
  var rows = H.byAgent.map(function(x){
    return '<div class="row"><span class="nm">'+esc(x.a)+'</span>'
      +'<span class="track"><i class="red" style="width:'+Math.max(2,x.api/max*100)+'%"></i></span>'
      +'<span class="val">'+moneyShort(x.api)+'</span><span class="sub">'+x.n+' apps</span></div>';
  }).join("");
  var top = H.top.map(function(x){
    var cls = x.days>60?"bad":(x.days>30?"warn":"good");
    return '<tr><td><b>'+esc(x.a)+'</b></td><td>'+money(x.api)+'</td>'
      +'<td><span class="chip '+cls+'">'+x.days+' days</span></td></tr>';
  }).join("");
  return '<div class="kick red">Deep dive · held-back API</div>'
    +'<h2>Where the held-back money sits</h2>'
    +'<p class="lede">By advisor, and the biggest single files. Each one is a requirement away from landing on the leaderboard.</p>'
    +'<div class="body"><div class="cols">'
    +'<div class="panel"><h3>Held-back API by advisor</h3><div class="rows">'+rows+'</div></div>'
    +'<div class="panel"><h3>Biggest files waiting</h3><table><thead><tr><th>Advisor</th><th>API waiting</th><th>Waiting</th></tr></thead><tbody>'+top+'</tbody></table></div>'
    +'</div></div>';
}
function sWeeks(D){
  var max = Math.max.apply(null, D.weekly.map(function(x){return x.api}));
  var bars = D.weekly.map(function(x,i){
    var now = i===D.weekly.length-1;
    return '<div class="bar'+(now?" now":"")+'"><div class="amt">'+moneyShort(x.api)+'</div>'
      +'<div class="stack" style="height:'+Math.max(5,x.api/max*100)+'%"><div class="new" style="flex:1"></div></div>'
      +'<div class="lab">'+esc(x.w)+'</div><div class="n">'+x.n+'</div></div>';
  }).join("");
  return '<div class="kick">The last nine weeks</div>'
    +'<h2>Week by week</h2>'
    +'<p class="lede">New-business API picked up each week, with the policy count underneath. The gold bar is the week we are standing in — still open.</p>'
    +'<div class="body"><div class="panel"><div class="bars">'+bars+'</div></div></div>';
}
function sMonths(D){
  var max = Math.max.apply(null, D.monthly.map(function(x){return x.api+x.inc}));
  var bars = D.monthly.map(function(x,i){
    var now = i===D.monthly.length-1, all=x.api+x.inc;
    var hNew = x.api/max*100, hInc = x.inc/max*100;
    return '<div class="bar'+(now?" now":"")+'"><div class="amt">'+moneyShort(all)+'</div>'
      +'<div class="stack" style="height:'+Math.max(5,hNew+hInc)+'%">'
      +'<div class="inc" style="flex:'+(x.inc||0.001)+'"></div><div class="new" style="flex:'+(x.api||0.001)+'"></div></div>'
      +'<div class="lab">'+x.m+'</div><div class="n">'+(x.n+x.incN)+' pickups</div></div>';
  }).join("");
  return '<div class="kick">Production · '+D.ytd.year+'</div>'
    +'<h2>API picked up, month by month</h2>'
    +'<p class="lede">New business with increases stacked on top — both counted on their picked-up date. The gold-based bar is the running month.</p>'
    +'<div class="body"><div class="panel"><div class="bars">'+bars+'</div>'
    +'<div class="legend"><span><i style="background:linear-gradient(120deg,#37b1ec,#0b7fd4)"></i>New business</span>'
    +'<span><i style="background:linear-gradient(120deg,#f5b93b,#e08b1e)"></i>Increases</span></div></div></div>';
}
function sLeaders(D){
  var max = Math.max.apply(null, D.leaders.map(function(x){return x.api}));
  var rows = D.leaders.map(function(x,i){
    return '<div class="row"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(x.a)+'</span>'
      +'<span class="track"><i style="width:'+(x.api/max*100)+'%"></i></span>'
      +'<span class="val">'+moneyShort(x.api)+'</span><span class="sub">'+x.n+' pickups</span></div>';
  }).join("");
  return '<div class="kick">Leaderboard · year to date</div>'
    +'<h2>Who is carrying the year</h2>'
    +'<p class="lede">Total API — new business plus increases — per advisor in '+D.ytd.year+'. '
    +'Gold ranks are the top three. <b>The branch year above includes business written by '
    +'agents who have since left</b>, so the rows here do not sum to it.</p>'
    +'<div class="body"><div class="panel"><div class="rows">'+rows+'</div></div></div>';
}
function sLatest(D){
  var rows = D.latest.slice(0,10).map(function(x){
    return '<tr><td><b>'+esc(x.a)+'</b></td><td>'+dstr(x.d)+'</td>'
      +'<td><span class="chip good">picked up</span></td><td>'+money(x.api)+'</td></tr>';
  }).join("");
  return '<div class="kick">Fresh off the desk</div>'
    +'<h2>Latest pickups</h2>'
    +'<p class="lede">The most recent policies picked up for production this month — the board the whole branch watches.</p>'
    +'<div class="body"><div class="panel"><table><thead><tr>'
    +'<th>Advisor</th><th>Date</th><th>Status</th><th>API</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div></div>';
}

/* ── deck ── */
var BUILDERS=[sPulse,sHeldBack,sHeldWho,sWeeks,sMonths,sLeaders,sLatest];
var DWELL=14000, cur=0, timer=null, paused=false;

function render(D){
  var host=$("#slides"); host.innerHTML="";
  BUILDERS.forEach(function(b){
    var el=document.createElement("section");
    el.className="slide"; el.innerHTML=b(D);
    host.appendChild(el);
  });
  var dots=$("#dots"); dots.innerHTML="";
  BUILDERS.forEach(function(_,i){
    var d=document.createElement("i");
    d.onclick=function(){go(i)};
    dots.appendChild(d);
  });
  var t=new Date(D.generatedAt);
  $("#src").textContent="Data: Salesforce · client portfolio + policy increases · pulled "
    +t.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "
    +t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  go(Math.min(cur,BUILDERS.length-1));
}

function go(i){
  cur=(i+BUILDERS.length)%BUILDERS.length;
  document.querySelectorAll(".slide").forEach(function(s,j){s.classList.toggle("on",j===cur)});
  document.querySelectorAll(".dots i").forEach(function(d,j){d.classList.toggle("on",j===cur)});
  speak(cur);
  arm();
}
function arm(){
  clearTimeout(timer);
  var bar=$("#bar");
  bar.classList.remove("run"); bar.style.width="0%";
  if(paused) return;
  void bar.offsetWidth;
  bar.classList.add("run");
  bar.style.transitionDuration=DWELL+"ms"; bar.style.width="100%";
  timer=setTimeout(function(){go(cur+1)},DWELL);
}
function setPaused(p){
  paused=p;
  var b=$("#pauseBtn");
  b.classList.toggle("on",paused);
  b.textContent=paused?"▶ Play":"⏸ Pause";
  arm();
}
$("#pauseBtn").onclick=function(){setPaused(!paused)};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight") go(cur+1);
  else if(e.key==="ArrowLeft") go(cur-1);
  else if(e.key===" "){e.preventDefault();setPaused(!paused);}
  else if(e.key==="f"||e.key==="F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});

function tick(){
  $("#clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
setInterval(tick,10000); tick();

var voiceEls=[], currentVoice=null;

var CHORDS=[   // D – A – Bm – G, low voicings (Hz)
  [73.42,110.00,146.83,220.00,293.66,369.99],   // D:  D2 A2 D3 A3 D4 F#4
  [55.00,110.00,164.81,220.00,277.18,329.63],   // A:  A1 A2 E3 A3 C#4 E4
  [61.74,123.47,146.83,185.00,246.94,293.66],   // Bm: B1 B2 D3 F#3 B3 D4
  [49.00,98.00,146.83,196.00,246.94,293.66]     // G:  G1 G2 D3 G3 B3 D4
];
var CHORD_LEN=8.0;

function playChord(freqs,when){
  var atk=2.2, rel=3.4, hold=CHORD_LEN;
  freqs.forEach(function(f,i){
    var oct = i<2;
    var types = oct ? ["sine"] : ["sawtooth","sawtooth","triangle"];
    types.forEach(function(type,k){
      var o=AC.createOscillator(), g=AC.createGain(), lp=AC.createBiquadFilter();
      o.type=type;
      o.frequency.value = type==="triangle" ? f*2 : f;
      if(type==="sawtooth") o.detune.value = k===0?-6:6;
      lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=0.4;
      var peak = (type==="sine"?0.050:type==="triangle"?0.014:0.020)/Math.max(1,i*0.6);
      g.gain.setValueAtTime(0.0001,when);
      g.gain.linearRampToValueAtTime(peak,when+atk);
      g.gain.setValueAtTime(peak,when+hold-rel);
      g.gain.exponentialRampToValueAtTime(0.0001,when+hold+0.5);
      o.connect(lp); lp.connect(g); g.connect(musicGain);
      o.start(when); o.stop(when+hold+0.8);
    });
  });
}
function scheduleMusic(){
  if(!soundOn) return;
  var t=AC.currentTime+0.05;
  playChord(CHORDS[chordIdx%CHORDS.length],t);
  chordIdx++;
  chordTimer=setTimeout(scheduleMusic,(CHORD_LEN-0.15)*1000);
}
function duck(down){
  if(!musicGain) return;
  var t=AC.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setTargetAtTime(down?0.45:1.0,t,0.4);
}
function speak(i){
  if(!soundOn) return;
  if(currentVoice){currentVoice.pause();currentVoice.currentTime=0;}
  var el=voiceEls[i];
  if(!el || !el.src || el.src.indexOf("data:")!==0) return;
  currentVoice=el;
  duck(true);
  el.onended=function(){duck(false)};
  el.volume=0.9;
  el.play().catch(function(){});
}
function startSound(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
    musicGain=AC.createGain(); musicGain.gain.value=1.0; musicGain.connect(master);
    VOICE_LINES.forEach(function(src,i){
      var a=new Audio(); if(src.indexOf("data:")===0) a.src=src;
      voiceEls[i]=a;
    });
  }
  AC.resume();
  soundOn=true; chordIdx=0;
  scheduleMusic();
  speak(cur);
  var b=$("#soundBtn"); b.classList.add("on"); b.textContent="🔊 Sound";
}
function stopSound(){
  soundOn=false;
  clearTimeout(chordTimer);
  if(currentVoice){currentVoice.pause();currentVoice.currentTime=0;}
  if(AC) AC.suspend();
  var b=$("#soundBtn"); b.classList.remove("on"); b.textContent="🔇 Sound";
}
$("#soundBtn").onclick=function(){ soundOn ? stopSound() : startSound(); };

/* live feed — the shared WallBoard.gs payload carries this board's numbers
   under .production; the snapshot stays on screen if the fetch fails */
function refresh(){
  if(!WALL_DATA_URL) return;
  fetch(WALL_DATA_URL,{redirect:"follow"}).then(function(r){return r.json()})
    .then(function(j){
      var p = j && j.production;
      if(p && p.ytd && p.monthly){
        PROD_DATA=p; render(p);
        $("#live").classList.add("on"); $("#liveTxt").textContent="Live";
      }
    }).catch(function(){ /* keep the snapshot on screen */ });
}
render(PROD_DATA);
refresh();
setInterval(refresh, 15*60*1000);
