<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Build with us</title>
<style>
/* ── The eighth cut ──────────────────────────────────────────────────────
   Photography is the subject. The type sits in the lower third and never
   fills the screen. One slow camera move per shot, cut on the bar.
   Every frame is a pure function of t: nothing lives in a CSS timeline,
   because the renderer seeks rather than plays. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1f33; --ink:#0a1a2b; --teal:#0e93b0; --deep:#00728d;
  --u:1px;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Inter,'DejaVu Sans',sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#07131f}

/* the shots: a 2160 square shown at 1920 so nothing is upscaled, and
   840px of horizontal room to drift inside the 1080 window */
.sh{position:absolute;inset:0;opacity:0;will-change:opacity}
.sh img{position:absolute;top:50%;left:0;width:calc(1920*var(--u));height:calc(1920*var(--u));
  margin-top:calc(-960*var(--u));transform-origin:50% 50%;will-change:transform;
  object-fit:cover;display:block}

#scrim{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:4;pointer-events:none;
  background:linear-gradient(to top,rgba(7,19,31,.97) 2%,rgba(7,19,31,.90) 18%,rgba(7,19,31,.66) 40%,rgba(7,19,31,.26) 68%,rgba(7,19,31,0) 100%)}
#vig{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 86% at 50% 44%,rgba(0,0,0,0) 44%,rgba(0,0,0,.42) 100%)}

/* the words */
#caps{position:absolute;left:0;right:0;bottom:calc(206*var(--u));z-index:5;
  padding:0 calc(76*var(--u))}
.cap{position:absolute;left:calc(76*var(--u));right:calc(76*var(--u));bottom:0;opacity:0}
.cap .w{display:inline-block;opacity:0;will-change:transform,opacity;
  font:800 calc(64*var(--u))/1.08 Inter,sans-serif;letter-spacing:-.03em;color:#fff;
  text-shadow:0 calc(3*var(--u)) calc(26*var(--u)) rgba(0,0,0,.55);margin-right:.26em}
.cap .w.t{color:#6fe3f5}
.rule{position:absolute;left:calc(76*var(--u));bottom:calc(-34*var(--u));height:calc(4*var(--u));
  width:0;background:linear-gradient(90deg,var(--teal),#6fe3f5);border-radius:2px}

/* the end card */
#end{position:absolute;inset:0;z-index:7;opacity:0;display:grid;place-items:center;
  background:linear-gradient(162deg,#14314f 0%,#0d1f33 58%,#07131f 100%);
  padding:calc(96*var(--u))}
#end .in{display:grid;justify-items:center;gap:calc(36*var(--u));text-align:center;width:100%}
#end .mk{width:calc(156*var(--u));height:calc(156*var(--u))}
#end h2{font:800 calc(112*var(--u))/.98 Inter,sans-serif;letter-spacing:-.045em;color:#fff}
#end h2 em{font-style:normal;color:#6fe3f5}
#end .u{font:700 calc(46*var(--u))/1.26 Inter,sans-serif;color:#cfe4ef;letter-spacing:-.01em}
#end .qr{width:calc(392*var(--u));height:calc(392*var(--u));background:#fff;
  padding:calc(22*var(--u));border-radius:calc(22*var(--u));display:block}
#end .s{font:600 calc(32*var(--u))/1.3 Inter,sans-serif;color:#8fb3c6}
#end .in>*{opacity:0;will-change:transform,opacity}

#grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.05;
  background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);
  background-size:3px 3px;mix-blend-mode:overlay}
</style>
</head>
<body>
<div id="stage">
  <div class="sh"><img src="../shots/sq/s2.jpg" alt=""></div>
  <div class="sh"><img src="../shots/sq/s1.jpg" alt=""></div>
  <div class="sh"><img src="../shots/sq/s4.jpg" alt=""></div>
  <div class="sh"><img src="../shots/sq/s5.jpg" alt=""></div>
  <div class="sh"><img src="../shots/sq/s3.jpg" alt=""></div>
  <div class="sh"><img src="../shots/sq/s6.jpg" alt=""></div>
  <div id="vig"></div>
  <div id="scrim"></div>
  <div id="caps"></div>
  <div id="end"><div class="in">
    <img class="mk" src="mark.svg" alt="">
    <h2>Build <em>with us.</em></h2>
    <img class="qr" src="qr.png" alt="">
    <div class="u">rickyrampersadbranch.com<br>/buildwithus</div>
    <div class="s">One administrator&rsquo;s seat. Chaguanas.</div>
  </div></div>
  <div id="grain"></div>
</div>
<script src="film.js"></script>
</body>
</html>
