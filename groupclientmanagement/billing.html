<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Billings Management | Ricky Rampersad Branch</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="gcm.css?v=2026-10-27b">
<style>
/* The Billings door (25 October 2026): one group, one month, eight steps. "make much more simple and interactive, a site
   that will pop and not confuse the weekly query and task update". The weekly letters stay on index.html; nothing of them
   is here. The look is gcm.css; what follows is the door's own. */
.dhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin:6px 0 12px}
.dhead h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.015em}
.dhead .sub{margin:0;font-size:14px;color:var(--muted)}
.dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.prog .track{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden;max-width:420px}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--primary),#2A78D6);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dsteps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;list-style:none;margin:0 0 16px;padding:0;counter-reset:s}
.dsteps li{min-width:0}
.dstep{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 10px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;font:inherit;color:var(--ink)}
.dstep:hover{border-color:var(--primaryLine);transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(16,24,40,.25)}
.dstep .n{width:26px;height:26px;border-radius:50%;background:var(--sunken);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.dstep .l{font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink2)}
.dstep .b{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--sunken);color:var(--muted);min-width:20px;text-align:center}
.dstep.done{border-color:#BFE3CB;background:#F3FAF5}.dstep.done .n{background:var(--good);color:#fff}
.dstep.todo .b{background:var(--badBg);color:var(--badText)}.dstep.check .b{background:var(--warnBg);color:var(--warn)}.dstep.done .b{background:var(--goodBg);color:var(--good)}
.dstep[aria-current="step"]{border-color:var(--primary);background:var(--primarySoft);box-shadow:0 0 0 3px var(--primaryLine)}
.dstep[aria-current="step"] .n{background:var(--primary);color:#fff}
@media (prefers-reduced-motion:no-preference){.dstep[aria-current="step"] .n{animation:dpulse 2.4s ease-in-out infinite}}
@keyframes dpulse{0%,100%{box-shadow:0 0 0 0 rgba(29,91,196,.35)}50%{box-shadow:0 0 0 7px rgba(29,91,196,0)}}
@media (max-width:900px){.dsteps{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.dsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.dstep .l{font-size:12px}}
.dpanel{animation:din .35s ease-out both}
@keyframes din{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dpanel{animation:none}}
.dpanel>h3.ptitle{margin:4px 0 2px;font-size:20px;letter-spacing:-.01em}
.dpanel>p.plead{margin:0 0 14px;color:var(--muted);font-size:14.5px;max-width:72ch}
.dnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
.dtile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.dtile b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}.dtile span{color:var(--muted);font-size:12.5px}
.dtile.act b{color:var(--primary)}.dtile.alert b{color:var(--badText)}.dtile.warn b{color:var(--warn)}.dtile.good b{color:var(--good)}
/* the questions */
.qcard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.qcard.q-fix{border-left-color:var(--bad)}.qcard.q-check{border-left-color:var(--warnMark)}.qcard.q-ai{border-left-color:var(--primary)}.qcard.answered{background:var(--sunken);opacity:.9}
.qcard .qtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.qcard h4{margin:6px 0 4px;font-size:17px;font-weight:600;line-height:1.35}
.qcard .why{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.qcard .opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.qopt{border:1.5px solid var(--primaryLine);background:#fff;color:var(--primary);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;transition:background-color .15s,transform .1s}
.qopt:hover{background:var(--primarySoft)}.qopt:active{transform:scale(.97)}.qopt.quiet{border-color:var(--line2);color:var(--ink2)}
.qcard .qnote{margin-top:6px}.qcard .qnote summary{font-size:13px;color:var(--primary);cursor:pointer;font-weight:600}
.qcard .ans{margin-top:8px;font-size:13.5px;color:var(--good);font-weight:600}
.qcard details.names{font-size:13px;margin:4px 0}.qcard details.names ul{margin:4px 0 0;padding-left:18px;column-width:220px}
/* last month's tasks */
.ucard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;padding:14px 16px;margin:0 0 10px;box-shadow:var(--shadow)}
.ucard.v-cleared{border-left-color:var(--good)}.ucard.v-worse{border-left-color:var(--bad)}.ucard.v-open{border-left-color:var(--warnMark)}.ucard.posted{opacity:.85}
.ucard h4{margin:0 0 4px;font-size:16px}
.ucard .ev{margin:6px 0;padding-left:18px;font-size:13.5px}.ucard .ev li{margin:2px 0}
.ucard textarea.field{min-height:72px;margin:6px 0}
.ucard .last{font-size:13px;color:var(--muted);margin:4px 0}
/* the people */
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow)}
.pcard h4{margin:0;font-size:16px}.pcard .pm{font-size:13px;color:var(--muted);margin:2px 0 6px}
.pflag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding:8px 0 4px;font-size:14px}
.pflag .ft{flex:1 1 320px}.pflag .fa{display:flex;gap:6px;flex-wrap:wrap}
.pflag.act .ft::before{content:"Act";font-size:11px;font-weight:700;color:var(--primary);background:var(--primarySoft);border-radius:99px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.pflag.check .ft::before{content:"Check";font-size:11px;font-weight:700;color:var(--warn);background:var(--warnBg);border-radius:99px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.pflag.data .ft::before{content:"Data";font-size:11px;font-weight:700;color:var(--muted);background:var(--sunken);border-radius:99px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.pflag .sent{font-size:12.5px;color:var(--good);font-weight:600}
/* the statement */
.sframe{width:100%;height:720px;border:1px solid var(--line);border-radius:12px;background:#fff}
.sowed td.num.bad{color:var(--badText);font-weight:600}
.dnote{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;font-size:14px}
.dnote.dmail{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--bar)}
.dnote.dmail>div{flex:1 1 18rem;min-width:0}
/* the group list */
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.gcard{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px);box-shadow:0 12px 24px -14px rgba(16,24,40,.3)}
.gcard.g-todo{border-left-color:var(--bad)}.gcard.g-check{border-left-color:var(--warnMark)}.gcard.g-done{border-left-color:var(--good)}.gcard.g-none{border-left-color:var(--line2)}
.gcard h4{margin:0 0 4px;font-size:16px}.gcard .who{font-size:13px;color:var(--muted)}
.gcard .go{margin-top:8px;font-weight:600;color:var(--primary);font-size:13.5px}
</style>
<script src="/rroperations/sso.js"></script>
</head>
<body>
<header class="mast"><div class="wrap mrow">
  <div class="mark"><img src="gcm-mark.png" alt=""></div>
  <div><div class="bname">Ricky Rampersad Branch</div><div class="bsub">Billings Management</div></div>
  <div class="mright" id="who"></div>
</div><div class="wrap mhello" id="mhello"></div></header>

<main class="wrap" id="app">
  <form class="gate" id="gate" autocomplete="off">
    <h1>Staff sign in</h1>
    <p>Your agent number and password from the Agent Skill Bank. The same sign-in as the group client page: signed in there, you are signed in here.</p>
    <label for="gWho">Agent number</label>
    <input class="field" id="gWho" autocapitalize="characters" spellcheck="false" placeholder="A00427">
    <label for="gCode">Password, or the branch code</label>
    <input class="field" id="gCode" type="password" required>
    <div class="err" id="gErr" role="alert"></div>
    <button class="btn" type="submit" id="gGo" style="width:100%;margin-top:6px">Sign in</button>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgT"><div class="dh"><h3 id="dlgT">Send</h3><button type="button" id="dlgX">Close</button></div><div class="db" id="dlgB"></div></dialog>
