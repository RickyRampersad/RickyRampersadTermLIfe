<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Group Management Wall | Ricky Rampersad Branch</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#07131f;--navy2:#0f2236;--gold:#efc24b;--gold2:#c9942c;--teal:#00CFEA;--ink:#eef2f6;--muted:#9fb0c2;--line:#22384f;--bar:#4f9fd8;--good:#0ca30c;--warn:#fab219;--bad:#e05a5a;--font:"Libre Franklin","Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--font);overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line)}
.mark{width:46px;height:46px;border-radius:13px;overflow:hidden;background:#07131f;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;display:block}
.top h1{margin:0;font-size:22px}.top .sub{color:var(--gold);font-size:14px}
.top .right{margin-left:auto;text-align:right;color:var(--muted);font-size:14px}
.slide{position:absolute;inset:86px 0 46px 0;padding:22px 34px;opacity:0;transition:opacity .6s;overflow:hidden}
.slide.on{opacity:1}
.slide h2{font-size:clamp(26px,3vw,40px);margin:0 0 6px}
.slide .lede{color:var(--muted);font-size:clamp(15px,1.5vw,20px);margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:16px;height:calc(100% - 120px)}
.tile{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:20px 26px;display:flex;flex-direction:column;justify-content:center}
.tile b{display:block;font-size:clamp(34px,4.6vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:clamp(14px,1.3vw,18px)}
.tile.alert b{color:var(--bad)}.tile.gold b{color:var(--gold)}
.rows{display:flex;flex-direction:column;gap:12px}
.r{display:grid;grid-template-columns:minmax(160px,22%) 1fr auto;gap:16px;align-items:center;font-size:clamp(15px,1.6vw,22px)}
.r .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:20px;background:#13263a;border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:0 6px 6px 0}.fill.gold{background:var(--gold2)}
.r .v{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8em;font-weight:700;padding:3px 10px;border-radius:99px;background:#13263a;margin:2px 4px 2px 0}
.chip i{width:10px;height:10px;border-radius:50%}.chip.good i{background:var(--good)}.chip.warn i{background:var(--warn)}.chip.bad i{background:var(--bad)}
.list{columns:2;column-gap:32px;font-size:clamp(15px,1.5vw,21px)}
.list div{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--line)}
.list .g{font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;margin-left:auto}.dots i{width:9px;height:9px;border-radius:50%;background:#2a4058}.dots i.on{background:var(--gold)}
.gate{max-width:380px;margin:12vh auto;background:var(--navy2);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:0 0 12px 12px;padding:26px}
.gate input{width:100%;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:#0b1b2b;color:var(--ink);font:inherit;font-size:18px;letter-spacing:.1em}
.gate button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--gold);color:var(--navy);font:inherit;font-weight:800;cursor:pointer}
.err{color:var(--bad);min-height:22px;margin-top:8px}
.muted{color:var(--muted)}
@media (max-width:800px){body{overflow:auto}.tiles{height:auto;grid-auto-rows:auto}.slide{position:static;opacity:1;padding:18px 16px;border-bottom:1px solid var(--line)}.tiles{grid-template-columns:repeat(2,1fr)}.list{columns:1}.foot{position:static}.r{grid-template-columns:1fr;gap:4px}.r .v{text-align:left}}
</style>
</head>
<body>
<div class="top">
  <div class="mark"><img src="../logo-mark.png" alt=""></div>
  <div><h1>Group management wall</h1><div class="sub">How our groups are being serviced</div></div>
  <div class="right" id="stamp"></div>
</div>
<div id="stage">
  <form class="gate" id="gate" autocomplete="off">
    <h2 style="margin:0 0 8px">Branch code</h2>
    <p class="muted" style="margin:0 0 14px">The same code that opens the branch’s other walls.</p>
    <input id="code" type="password" required aria-label="Branch code">
    <div class="err" id="err" role="alert"></div>
    <button type="submit">Open the wall</button>
  </form>
</div>
<div class="foot"><span id="msg">Every number here comes from Salesforce and from the groups’ own answers.</span><div class="dots" id="dots"></div></div>

<script>
const SVC = 'https://script.google.com/macros/s/AKfycbxdW5mVcK6DZbq4qnCj1l1cJvjsTYWZ9UMH91H6yC_NrElNYpGd1vRyJH1W_1mcu61woQ/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = n => n == null ? '–' : n + '%';
const DAYS = ['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const HOLD_MS = 16000, POLL_MS = 300000, KEEP = 'rrb-gcm-wall';
let CODE = '', D = null, cur = 0, timer = null;
try { CODE = localStorage.getItem('rrb-transition-code') || ''; } catch (e) {}   // the branch code the other walls keep

$('gate').addEventListener('submit', e => { e.preventDefault(); CODE = $('code').value.trim(); load(true); });
async function load(first) {
  let d;
  try { const txt = await (await fetch(SVC + '?action=gcm.wall&code=' + encodeURIComponent(CODE) + '&z=' + Date.now())).text(); d = JSON.parse(txt); }
  catch (e) { d = { ok: false, offline: true, error: 'The wall could not reach the sheet. Trying again.' }; }
  if (!d.ok) {
    if (d.refused) { try { localStorage.removeItem(KEEP); } catch (e) {} if ($('err')) $('err').textContent = d.error; else location.reload(); return; }
    if (first && $('err')) $('err').textContent = d.error;
    $('msg').textContent = d.error; setTimeout(() => load(false), 15000); return;
  }
  try { localStorage.setItem('rrb-transition-code', CODE); localStorage.setItem(KEEP, JSON.stringify({ at: Date.now(), d: d })); } catch (e) {}
  D = d; draw();
  clearTimeout(load._t); load._t = setTimeout(() => load(false), POLL_MS);
}
function bars(rows, max, gold) {
  return '<div class="rows">' + rows.map(r => '<div class="r"><div class="nm">' + esc(r.name) + '</div><div class="track"><div class="fill' + (gold ? ' gold' : '') + '" style="width:' + (r.value == null ? 0 : Math.max(2, Math.round(100 * r.value / max))) + '%"></div></div><div class="v">' + r.label + '</div></div>').join('') + '</div>';
}
function draw() {
  const a = D.analytics, t = a.totals, staff = a.staff.filter(s => s.groups);
  $('stamp').innerHTML = 'Salesforce as at ' + esc(D.refreshed || '–') + '<br>' + (D.dow === D.sendDay ? '<b style="color:var(--gold)">Today is send day</b>' : 'Letters go out on ' + DAYS[D.sendDay]);
  const slides = [];
  slides.push('<h2>Our groups at a glance</h2><p class="lede">' + t.groups + ' groups, as at today.</p><div class="tiles">' +
    '<div class="tile' + (t.dueWeek ? ' alert' : '') + '"><b>' + t.sentWeek + ' / ' + (t.sentWeek + t.dueWeek) + '</b><span>letters sent this week</span></div>' +
    '<div class="tile"><b>' + t.open + '</b><span>items open</span></div><div class="tile' + (t.late ? ' alert' : '') + '"><b>' + t.late + '</b><span>past target</span></div>' +
    '<div class="tile"><b>' + t.done + '</b><span>completed this year</span></div><div class="tile"><b>' + pct(t.onTimePct) + '</b><span>done by the due date</span></div>' +
    '<div class="tile gold"><b>' + (t.rating == null ? '–' : t.rating + '★') + '</b><span>average rating from groups · ' + t.ratings + ' given</span></div></div>');
  slides.push('<h2>This week’s letters</h2><p class="lede">Every group hears from us once a week. Answers this week: ' + t.responsesWeek + '.</p><div class="list">' +
    D.groups.slice().sort((x, y) => ({ due: 0, upcoming: 1, sent: 2 }[x.week] - { due: 0, upcoming: 1, sent: 2 }[y.week])).map(g => '<div><span class="g">' + esc(g.name) + '</span> <span class="muted">· ' + esc(g.assigned || 'not assigned') + '</span><br>' +
      (g.week === 'sent' ? '<span class="chip good"><i></i>Sent</span>' : g.week === 'due' ? '<span class="chip bad"><i></i>Due</span>' : '<span class="chip"><i style="background:#6b7f93"></i>' + DAYS[D.sendDay] + '</span>') +
      (g.late ? '<span class="chip bad"><i></i>' + g.late + ' past target</span>' : '') + (g.waiting ? '<span class="chip warn"><i></i>' + g.waiting + ' waiting on them</span>' : '') + '</div>').join('') + '</div>');
  if (staff.length) {
    slides.push('<h2>Service by staff</h2><p class="lede">The share of each person’s group tasks done by the due date this year, with how many and how fast.</p>' +
      bars(staff.map(s => ({ name: s.name, value: s.onTimePct, label: pct(s.onTimePct) + ' · ' + s.done + ' done · ' + (s.avgDays == null ? '–' : s.avgDays + 'd') })), 100));
    const rated = staff.filter(s => s.rating != null);
    slides.push('<h2>Ratings by staff</h2><p class="lede">What the groups each person looks after rated us, out of five.</p>' + (rated.length
      ? bars(rated.map(s => ({ name: s.name, value: s.rating, label: s.rating + '★ · ' + s.ratings + ' rating' + (s.ratings === 1 ? '' : 's') + (s.accuracy == null ? '' : ' · ' + s.accuracy + '% correct') })), 5, true)
      : '<p class="lede">No ratings yet: they arrive with the first letters.</p>'));
  }
  slides.push('<h2>To act on</h2><p class="lede">Letters not yet sent, items past target, low ratings and anything missing from the register.</p>' + (a.act.length
    ? '<div class="list">' + a.act.slice(0, 16).map(x => '<div><span class="chip ' + (x.kind === 'setup' ? 'warn' : 'bad') + '"><i></i>' + esc(x.what) + '</span><br><span class="g">' + esc(x.group) + '</span> <span class="muted">· ' + esc(x.who || 'not assigned') + '</span></div>').join('') + '</div>'
    : '<p class="lede">Nothing outstanding. Well done.</p>'));
  $('stage').innerHTML = slides.map((s, i) => '<section class="slide' + (i === cur % slides.length ? ' on' : '') + '">' + s + '</section>').join('');
  $('dots').innerHTML = slides.map((s, i) => '<i class="' + (i === cur % slides.length ? 'on' : '') + '"></i>').join('');
  $('msg').textContent = 'Every number here comes from Salesforce and from the groups’ own answers.';
  clearInterval(timer);
  timer = setInterval(() => {
    const ss = document.querySelectorAll('.slide'), dd = document.querySelectorAll('#dots i');
    if (!ss.length) return;
    ss[cur % ss.length].classList.remove('on'); dd[cur % ss.length].classList.remove('on');
    cur = (cur + 1) % ss.length;
    ss[cur].classList.add('on'); dd[cur].classList.add('on');
  }, HOLD_MS);
}
/* a wall switched on again opens on its last good answer, then swaps in the fresh one */
try { const k = JSON.parse(localStorage.getItem(KEEP) || 'null'); if (k && Date.now() - k.at < 12 * 3600e3) { D = k.d; draw(); $('msg').textContent = 'Updating from the sheet…'; } } catch (e) {}
if (CODE) load(false);
</script>
<!-- rrb-views -->
<script>
(function(){var u='RRB_VIEWS_URL';if(u.indexOf('http')!==0)return;try{
(new Image()).src=u+'?p='+encodeURIComponent(location.pathname)+'&r='+encodeURIComponent((document.referrer||'').slice(0,200))+'&z='+Date.now();
}catch(e){}})();
</script>
</body>
</html>
