<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Group Client Management | Ricky Rampersad Branch</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="gcm.css?v=2026-10-27b">
<script src="/rroperations/sso.js"></script>
</head>
<body>
<header class="mast"><div class="wrap mrow">
  <div class="mark"><img src="gcm-mark.png" alt=""></div>
  <div><div class="bname">Ricky Rampersad Branch</div><div class="bsub">Group Client Management</div></div>
  <div class="mright" id="who"></div>
</div><div class="wrap mhello" id="mhello"></div></header>

<main class="wrap" id="app">
  <form class="gate" id="gate" autocomplete="off">
    <h1>Staff sign in</h1>
    <p>Your agent number and password from the Agent Skill Bank. Everyone sees every account; you send for the groups you look after.</p>
    <label for="gWho">Agent number</label>
    <input class="field" id="gWho" autocapitalize="characters" spellcheck="false" placeholder="A00427">
    <label for="gCode">Password, or the branch code</label>
    <input class="field" id="gCode" type="password" required>
    <div class="err" id="gErr" role="alert"></div>
    <button class="btn" type="submit" id="gGo" style="width:100%;margin-top:6px">Sign in</button>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgT"><div class="dh"><h3 id="dlgT">Send</h3><button type="button" id="dlgX">Close</button></div><div class="db" id="dlgB"></div></dialog>

<script>
/* The Service Questionnaire deployment: the same /exec URL the assignment board uses. GroupClients.gs answers every gcm.* action. */
const SVC = 'https://script.google.com/macros/s/AKfycbxdW5mVcK6DZbq4qnCj1l1cJvjsTYWZ9UMH91H6yC_NrElNYpGd1vRyJH1W_1mcu61woQ/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* A preview is the e-mail as it goes, in a frame where nothing runs, so a sign-in opened inside it can never work
   (27 October 2026: "Group log on not working", the group's page opened inside the letter preview). Its links open in a
   tab of their own, and a link to the group's page says it came from a preview, so a staff member trying the sign-in is
   never counted as the group opening its page. */
const PV_SANDBOX = 'allow-popups allow-popups-to-escape-sandbox';
function pvDoc(html) {
  html = String(html || '').replace(/([?&;]from=)(letter|welcome|reminder)\b/g, '$1preview');
  const b = '<base target="_blank">';
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m => m + b);
  const d = /^\s*<!doctype[^>]*>/i.exec(html);
  return d ? d[0] + b + html.slice(d[0].length) : b + html;
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[1] : ''; };
const pct = n => n == null ? '–' : n + '%';
let AUTH = { code: '', who: '' }, BOARD = null, VIEW = 'board', GROUP = null, TAB = '';
let FILT = { owner: '', status: 'all' };
try { const f = JSON.parse(localStorage.getItem('rrb-gcm-filter') || 'null'); if (f) FILT = Object.assign(FILT, f); } catch (e) {}
function saveFilt() { try { localStorage.setItem('rrb-gcm-filter', JSON.stringify(FILT)); } catch (e) {} }
const ROLE = { branch: 'Branch manager', deputy: 'Assistant branch manager', staff: 'Staff' };
try { AUTH.code = localStorage.getItem('rrb-gcm-code') || ''; AUTH.who = localStorage.getItem('rrb-gcm-who') || ''; } catch (e) {}

function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', bad ? 8000 : 4000); }
async function api(params) {
  const q = Object.entries(Object.assign({}, params, { code: AUTH.code, who: AUTH.who })).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  try { const txt = await (await fetch(SVC + '?' + q + '&z=' + Date.now())).text(); try { return JSON.parse(txt); } catch (e) { return { ok: false, notLive: true, error: 'The branch backend is not answering for group client management yet: GroupClients.gs needs pasting and a New version publishing.' }; } }
  catch (e) { return { ok: false, error: 'Could not reach the branch backend. Check the connection and try again.' }; }
}
async function post(body) {
  try { const txt = await (await fetch(SVC, { method: 'POST', body: JSON.stringify(Object.assign({}, body, { code: AUTH.code, who: AUTH.who })) })).text(); try { return JSON.parse(txt); } catch (e) { return { ok: false, error: 'The backend answered with a page instead of data.' }; } }
  catch (e) { return { ok: false, error: 'Could not reach the branch backend.' }; }
}

/* ---- Billings Management lives on its own page (billing.html, 25 October 2026): the Billing buttons open it there. The
   three chip helpers the board and the Team dashboard read come from gblBoard_'s block on the board answer. ---- */
function openBilling(key, month) { location.href = 'billing.html?g=' + encodeURIComponent(key) + (month ? '&m=' + encodeURIComponent(month) : ''); }
const BL_MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const blMon = m => { const x = /^(\d{4})-(\d{2})/.exec(m || ''); return x ? BL_MON[+x[2] - 1] + ' ' + x[1] : ''; };
function blBoardChip(g) {
  const b = BOARD && BOARD.billing ? BOARD.billing[g.key] : null;
  if (!BOARD || !BOARD.billing) return '';
  if (!b || !b.lines) return '<div><span class="chip warn"><i></i>Billing: nothing uploaded for ' + esc(blMon(b ? b.month : BOARD.today.slice(0, 7))) + '</span></div>';
  return '<div><span class="chip' + (b.fixes || b.held ? ' bad' : blDone(g) ? ' good' : '') + '"><i></i>Billing ' + esc(blMon(b.month).slice(0, 3)) + ': ' + b.lines + ' line' + (b.lines === 1 ? '' : 's') + (b.fixes ? ' · ' + b.fixes + ' to fix' : '') + (b.checks ? ' · ' + b.checks + ' to confirm' : '') + ' · ' + b.reconciled + ' reconciled' + (b.approved ? ' · ' + b.approved + ' approved' : '') + (b.held ? ' · ' + b.held + ' held' : '') + ' · ' + b.sent + ' sent</span></div>';
}
function blDone(g) { const b = BOARD && BOARD.billing ? BOARD.billing[g.key] : null; return !!(b && b.lines && !b.held && (b.sent + (b.approved || 0)) >= b.lines); }
function blTodo(g) { const b = BOARD && BOARD.billing ? BOARD.billing[g.key] : null; return !!(BOARD && BOARD.billing) && (!b || !b.lines || b.fixes > 0 || b.held > 0 || (b.sent + (b.approved || 0)) < b.lines); }

/* ---- the gate ---- */
$('gate').addEventListener('submit', e => { e.preventDefault(); AUTH = { code: $('gCode').value.trim(), who: $('gWho').value.trim() }; open_(); });
async function open_() {
  const err = $('gErr'), go = $('gGo');
  if (err) { err.textContent = ''; go.disabled = true; go.textContent = 'Opening… the sheet is answering'; }
  const d = await api({ action: 'gcm.board' });
  if (!d.ok) {
    if (!$('gate')) { location.reload(); return; }
    err.textContent = d.error || 'Not opened.'; go.disabled = false; go.textContent = 'Sign in'; return;
  }
  try { localStorage.setItem('rrb-gcm-code', AUTH.code); localStorage.setItem('rrb-gcm-who', AUTH.who); } catch (e) {}
  BOARD = d; render();
}
function signOut() { try { localStorage.removeItem('rrb-gcm-code'); localStorage.removeItem('rrb-gcm-who'); } catch (e) {} location.reload(); }

function head() {
  $('who').innerHTML = esc(BOARD.me) + ' · ' + (BOARD.title || ROLE[BOARD.role] || 'Staff') +
    (BOARD.refreshed ? ' · Salesforce as at ' + esc(BOARD.refreshed) : '') +
    ' <button class="btn ghost" id="rf" type="button">Refresh from Salesforce</button> <a class="btn ghost" href="training.html">Training</a> <button class="btn ghost" type="button" onclick="signOut()">Sign out</button>';
  $('rf').onclick = refresh;
}
async function refresh() {
  const b = $('rf'); b.disabled = true; b.textContent = 'Refreshing… about a minute';
  const r = await api({ action: 'gcm.refresh' });
  if (!r.ok) { toast(r.error || 'Not refreshed', true); b.disabled = false; b.textContent = 'Refresh from Salesforce'; return; }
  toast(r.said || 'Refreshed');
  const d = await api({ action: 'gcm.board' }); if (d.ok) BOARD = d;
  if (VIEW === 'group' && GROUP) openGroup(GROUP.group.key); else render();
}

/* ---- the board ---- */
function weekChip(s) {
  if (s.week === 'queued') return '<span class="chip good"><i></i>Approved · goes ' + esc(s.approved.for) + '</span>';
  if (s.week === 'sent') return '<span class="chip good"><i></i>Sent ' + esc(s.sentThisWeek) + '</span>';
  return '<span class="chip bad"><i></i>Approve for ' + esc(s.nextSendLabel || 'Monday') + '</span>';
}
function groupCard(g) {
  const s = g.stats;
  return '<button class="card' + (g.account ? ' r-' + rowState(g) : '') + '" type="button" data-g="' + esc(g.key) + '"><h4>' + esc(g.name) + '</h4>' +
    '<div class="chips">' + weekChip(s) + (s.waiting ? '<span class="chip warn"><i></i>' + s.waiting + ' waiting on them</span>' : '') +
    (s.late ? '<span class="chip bad"><i></i>' + s.late + ' past target</span>' : '') + (s.needReason ? '<span class="chip bad"><i></i>' + s.needReason + ' need' + (s.needReason === 1 ? 's' : '') + ' a reason for the group</span>' : '') +
    (!s.ready ? '<span class="chip warn"><i></i>' + esc(s.why) + '</span>' : '') + '</div>' +
    (BOARD.role !== 'staff' && (!g.assigned || !g.ownerActive) ? '<div class="chips"><span class="chip bad"><i></i>' + (g.assigned ? 'Owner ' + esc(g.assigned) + ' is inactive in Salesforce' : 'No owner in Salesforce') + '</span></div>' : '') +
    '<div class="small muted">' + (g.own ? '<b>Yours</b>' : 'Looked after by <b>' + esc(g.assigned || 'nobody') + '</b>') + (g.canAct === false ? ' · read only' : '') + ' · List bill ' + esc(g.bills.join(', ') || 'none') + '</div>' +
    (g.account ? '<div class="small muted" style="overflow-wrap:anywhere">Letters to ' + esc(g.account.contact || g.account.to.join(', ') || 'nobody yet') + ' · ' +
      (g.account.welcome ? 'welcomed ' + esc(shortAt(g.account.welcome.at).replace(/,.*$/, '')) : 'not welcomed yet') + '</div>' : '') +
    '<div class="kv"><div><b>' + s.open + '</b>open</div><div><b>' + (s.oldest || 0) + 'd</b>oldest</div><div><b>' + pct(s.onTimePct) + '</b>on time</div><div><b>' + (s.rating == null ? '–' : s.rating + '★') + '</b>rating</div></div></button>';
}
function render() {
  VIEW = 'board'; GROUP = null; head();
  const d = BOARD, app = $('app');
  let h = '';
  if (!d.salesforce) h += '<div class="note bad">Salesforce is not linked to the backend yet, so no tasks can be read. Copy SF_KEY, SF_SECRET and SF_LOGIN_URL from the KPI Tracker into the project’s Script properties, then run gcmRefresh.</div>';
  if (!d.refreshed && d.salesforce) h += '<div class="note">The Group Tasks tab has not been filled yet: press “Refresh from Salesforce”.</div>';
  if (d.nextSend) h += '<div class="note info"><div><b>The letters go out by themselves on ' + esc(d.nextSend) + '.</b> Before then, open each group marked “Approve for Monday”, check every item against Salesforce and the latest billing, preview the letter and approve it. A new item after you approve holds the letter until you look again.</div></div>';
  if (d.billingDay) h += '<div class="note info"><div><b>The group bills go out by themselves on ' + esc(d.billingDay.label) + (d.billingDay.isDay ? ' (today)' : d.billingDay.daysTo ? ' (in ' + d.billingDay.daysTo + ' day' + (d.billingDay.daysTo === 1 ? '' : 's') + ')' : '') + '.</b> That is the 26th, or the next working day when the 26th is a weekend or a public holiday. Before then, open each account’s Billing review: upload the month’s bill on each line, check it against Salesforce, mark it reconciled and approve it with the PDF attached. At ' + (d.billingDay.reportHour || 13) + ':00 on ' + esc(d.billingDay.reportLabel ? d.billingDay.reportLabel.replace(/, \d+:\d+$/, '') : 'the 25th') + ' the branch manager has the report of who has worked each group. A bill approved after the ' + d.billingDay.hour + ':00 run goes at ' + d.billingDay.hour + ':00 the next working day, or with Send now, and the branch manager is told at 10:30.' + (d.billingLive ? '' : ' The bills are in test mode (gblGoLive switches them on).') + (d.billingDay.drive ? '' : ' <b>The Drive folder is not linked</b> (GCM_FORMS_FOLDER), so a bill cannot be approved with its PDF yet.') + '</div></div>';
  if (d.canRehearse) h += '<div class="note"><b>Test the run first.</b> “Rehearse now” writes every approved letter exactly as the ' + esc(d.nextSend || 'Monday') + ' run would, and sends it only to the person who approved it and the branch, marked TEST, with one summary of what would go and what would wait. Nothing reaches a group, and nothing is marked as sent. <button class="btn ghost sm" type="button" id="rh">Rehearse now</button></div>';
  if (!TAB) TAB = d.role === 'staff' ? 'groups' : 'dash';
  if (!FILT.owner) FILT.owner = d.role === 'staff' && d.groups.some(g => g.own) ? 'mine' : 'all';
  h += '<div class="tabs" role="tablist"><button class="tab" role="tab" data-t="groups" aria-selected="' + (TAB === 'groups') + '">Groups</button><button class="tab" role="tab" data-t="dash" aria-selected="' + (TAB === 'dash') + '">Team dashboard · every account</button></div>';
  h += TAB === 'dash' && d.analytics ? accountsHtml(d) + dash(d.analytics) : groupsHtml(d);
  app.innerHTML = h;
  $('mhello').innerHTML = hello(d);
  bindAccounts(app);
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => openGroup(b.dataset.g));
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TAB = b.dataset.t; render(); });
  app.querySelectorAll('[data-fo]').forEach(b => b.onclick = () => { FILT.owner = b.dataset.fo; saveFilt(); TAB = 'groups'; render(); });
  if ($('grOwner')) $('grOwner').onchange = () => { FILT.owner = $('grOwner').value; saveFilt(); render(); };
  app.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { FILT.status = b.dataset.fs; if (b.dataset.fo2) FILT.owner = b.dataset.fo2; saveFilt(); TAB = 'groups'; render(); });
  app.querySelectorAll('[data-gn]').forEach(b => b.onclick = () => { const g = BOARD.groups.find(x => x.name === b.dataset.gn); if (g) openGroup(g.key); });
  if ($('rh')) $('rh').onclick = rehearse;
  window.scrollTo(0, 0);
}
async function rehearse() {
  const b = $('rh'); b.disabled = true; b.textContent = 'Rehearsing… (about a minute)';
  const r = await post({ action: 'gcm.rehearse' });
  b.disabled = false; b.textContent = 'Rehearse now';
  toast(r.ok ? r.said : (r.error || 'The rehearsal did not run'), !r.ok);
}
const STATUS = [['all', 'All'], ['due', 'To approve'], ['queued', 'Approved'], ['sent', 'Sent this week'], ['late', 'Past target'], ['reason', 'Needs a reason'], ['waiting', 'Waiting on the group'], ['notready', 'Not ready']];
function statusOf(g, k) {
  const s = g.stats;
  return k === 'all' || (k === 'due' && s.week === 'due') || (k === 'queued' && s.week === 'queued') || (k === 'sent' && s.week === 'sent') ||
    (k === 'late' && s.late > 0) || (k === 'reason' && s.needReason > 0) || (k === 'waiting' && s.waiting > 0) || (k === 'notready' && !s.ready);
}
function ownerOf(g, k) { return k === 'all' || (k === 'mine' && g.own) || g.assigned === k; }
function groupsHtml(d) {
  const owners = [...new Set(d.groups.map(g => g.assigned).filter(Boolean))].sort();
  if (FILT.owner !== 'all' && FILT.owner !== 'mine' && owners.indexOf(FILT.owner) < 0) FILT.owner = 'all';
  const byOwner = d.groups.filter(g => ownerOf(g, FILT.owner)), shown = byOwner.filter(g => statusOf(g, FILT.status));
  const due = shown.filter(g => g.stats.week === 'due').length;
  const today = shown.flatMap(g => g.doneToday.map(x => Object.assign({ group: g.name }, x)));
  const opt = (v, label, on) => '<option value="' + esc(v) + '"' + (on ? ' selected' : '') + '>' + esc(label) + '</option>';
  const MARK = { due: 'var(--bad)', queued: 'var(--good)', sent: 'var(--good)', late: 'var(--bad)', reason: 'var(--bad)', waiting: 'var(--warnMark)', notready: 'var(--warnMark)' };
  let h = '<div class="toolbar"><div class="r1"><label class="sel">Looked after by <select id="grOwner">' +
    (d.groups.some(g => g.own) ? opt('mine', 'Mine (' + d.groups.filter(g => g.own).length + ')', FILT.owner === 'mine') : '') + opt('all', 'Everyone (' + d.groups.length + ')', FILT.owner === 'all') +
    owners.map(o => opt(o, o + ' (' + d.groups.filter(g => g.assigned === o).length + ')', FILT.owner === o)).join('') + '</select></label>' +
    '<div class="count">Showing <b>' + shown.length + '</b> of ' + byOwner.length + '</div></div>' +
    '<div class="seg" role="group" aria-label="Where they stand">' + STATUS.map(([k, l]) => '<button class="fbtn" type="button" data-fs="' + k + '" aria-pressed="' + (FILT.status === k) + '">' +
      (MARK[k] ? '<i style="background:' + MARK[k] + '"></i>' : '') + esc(l) + '<span class="n">' + byOwner.filter(g => statusOf(g, k)).length + '</span></button>').join('') + '</div></div>';
  h += '<h2>' + (FILT.owner === 'mine' ? 'Your groups' : FILT.owner === 'all' ? 'Every group' : esc(FILT.owner) + '’s groups') + ' <span class="muted small">' + shown.length + ' · ' + due + ' to approve for ' + esc(d.nextSend || 'Monday') + '</span></h2>';
  h += shown.length ? '<div class="cards">' + shown.map(groupCard).join('') + '</div>' : '<p class="muted">No group matches these filters.</p>';
  h += '<h2>What we’ve done today <span class="muted small">' + today.length + '</span></h2>' + (today.length
    ? '<ul class="feed">' + today.map(x => '<li><b>' + esc(x.group) + '</b>: ' + esc(x.title) + ' <span class="muted small">· ' + esc(x.type) + (x.by ? ' · ' + esc(x.by) : '') + '</span></li>').join('') + '</ul>'
    : '<p class="muted">Nothing completed on these groups in Salesforce yet today.</p>');
  return h;
}

/* ---- every account, and sending from the page (14 October 2026: "the team dashboard so staff can view all the
   accounts and owners and they can also have the ability to resend or send") ---- */
let ACC = { owner: 'all', show: 'all', q: '', sort: 'urgent' };
try { const a = JSON.parse(localStorage.getItem('rrb-gcm-acc') || 'null'); if (a) ACC = Object.assign(ACC, a, { q: '' }); } catch (e) {}
function saveAcc() { try { localStorage.setItem('rrb-gcm-acc', JSON.stringify({ owner: ACC.owner, show: ACC.show, sort: ACC.sort })); } catch (e) {} }
const shortAt = x => String(x || '').replace(/ \d{4}(,|$)/, '$1');
const dayOf = x => shortAt(x).replace(/,.*$/, '');   // "13 Oct": the label says the day, the line under it the time
const initials = n => String(n || '?').split(/[\s-]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
const starsOf = n => n ? '<span class="stars2" aria-label="' + n + ' of 5 stars">' + '★'.repeat(n) + '<i>' + '★'.repeat(5 - n) + '</i></span>' : '';
/* where the last letter's rating stands (15 October 2026): rated, items answered without the stars, the page opened
   without an answer, or no answer yet; with who opened it and any reminder. Every state is a word, never colour alone. */
const DEV = { phone: 'on a phone', computer: 'on a computer' };
function rateHtml(a) {
  const r = a && a.rate;
  if (!r) return a && a.answer ? '<div>' + esc(dayOf(a.answer.at)) + '</div>' + starsOf(a.answer.rating) + '<div class="sub">' + esc(a.answer.name) + '</div>' : '<span class="muted small">No letter yet</span>';
  const v = r.lastView, seen = v ? '<div class="sub">opened ' + esc(shortAt(v.at)) + (v.name ? ' · ' + esc(v.name) : '') + (DEV[v.device] ? ' · ' + DEV[v.device] : '') + (r.views > 1 ? ' · ' + r.views + ' visits' : '') + '</div>'
    : a.views ? '<div class="sub">last opened ' + esc(shortAt(a.views.at)) + ', before this letter</div>' : '';
  const rem = r.reminder ? '<div class="sub">' + (r.reminder.n > 1 ? 'reminded ' + r.reminder.n + ' times, last ' : 'reminded ') + esc(shortAt(r.reminder.at)) + '</div>' : '';
  if (r.kind === 'rated') return '<span class="chip good" style="white-space:nowrap"><i></i>Rated ' + esc(dayOf(r.rated.at)) + '</span> ' + starsOf(r.rated.rating) + '<div class="sub">' + esc(r.rated.name) + '</div>' + seen + rem;
  if (r.kind === 'answered') return '<span class="chip warn" style="white-space:nowrap"><i></i>No stars yet</span><div class="sub">items answered ' + esc(shortAt(r.answered.at)) + ' · ' + esc(r.answered.name) + '</div>' + seen + rem;
  if (r.kind === 'viewed') return '<span class="chip info" style="white-space:nowrap"><i></i>Opened, no answer</span>' + seen + rem;
  return '<span class="chip" style="white-space:nowrap"><i style="background:#9aa5b1"></i>No answer yet</span><div class="sub">to the letter of ' + esc(dayOf(r.letter.at)) + '</div>' + seen + rem;
}
const canRemind = (g, a, s) => g.canAct && a.rate && a.rate.kind !== 'rated' && s.ready && !a.mailWhy;
const remindBtn = (key, a) => '<button class="btn ghost" type="button" data-act="remind" data-k="' + esc(key) + '">' + (a.rate.reminder ? 'Remind again' : 'Remind to rate') + '</button>';
function hello(d) {
  const words = String(d.me || '').trim().split(/\s+/), person = words.length >= 2 && words.length <= 4 && !/team|desk|support|branch|manager|office/i.test(d.me);
  const name = person ? words[0].charAt(0).toUpperCase() + words[0].slice(1).toLowerCase() : d.me;
  const hr = new Date().getHours(), part = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const mine = d.groups.filter(g => d.role === 'staff' ? g.own : true);
  const due = mine.filter(g => g.stats.week === 'due' && g.stats.ready).length, wel = mine.filter(g => g.canAct && g.account && !g.account.welcome && !g.account.welcomeWhy).length;
  const ans = mine.filter(g => g.stats.lastResponse).length;

    (s.approved ? '<div class="note" style="background:var(--goodBg);border-color:#BFE3CB"><b>Approved by ' + esc(s.approved.by) + '</b> on ' + esc(s.approved.at) + '. It goes ' + esc(s.approved.for) + ', written again from Salesforce at that moment. A new item before then holds it for you to look at.' + (d.canAct === false ? '' : ' <button class="btn ghost sm" type="button" id="unap">Cancel the approval</button>') + '</div>' : '') +
    (s.needReason ? '<div class="note bad">The letter can go once every item open more than ' + d.reasonDays + ' days has a note for the group, written in the last ' + d.reasonDays + ' days: ' + s.needReason + ' still need' + (s.needReason === 1 ? 's' : '') + ' one. Each is marked below' + (d.ai ? ', with “Draft with AI” to start you off' : '') + '.</div>' : '') + (s.week === 'sent' ? '<p class="small">Sent this week (' + esc(s.sentThisWeek) + '). Approving now sets up next Monday’s letter.</p>' : '') +
    (d.canAct === false ? '<input type="hidden" id="intro" value="' + esc(d.approvedIntro || '') + '">' : '<label for="intro">Your own opening line (optional)</label><textarea class="field" id="intro" maxlength="1200" placeholder="Anything you want to say first, in your own words.">' + esc(d.approvedIntro || '') + '</textarea>') +
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" type="button" id="pv">Preview the letter</button></div><div id="pvBox"></div></div>' +
    '<h3 style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">Open items <span class="muted small">' + d.items.length + ' · tick what the group sees; share the Chatter comments they should read</span>' + (d.items.length ? '<button class="btn ghost sm" type="button" id="histAll" style="margin-left:auto">Show all history</button>' : '') + '</h3><div class="items">' + d.items.map(itemHtml).join('') + (d.items.length ? '' : '<p class="muted">Nothing open.</p>') + '</div>' +
    '<h3>Completed in the last seven days</h3>' + (d.doneWeek.length ? '<ul class="feed">' + d.doneWeek.map(x => '<li>' + esc(x.title) + ' <span class="muted small">· ' + esc(x.type) + ' · ' + esc(x.by) + ' · ' + esc(dmy(x.done)) + (x.shown ? '' : ' · not shown to the group') + '</span></li>').join('') + '</ul>' : '<p class="muted">Nothing completed this week.</p>') +
    yearHtml(d) +
    '<h3>What went to the group</h3>' + (d.sends.length ? '<ul class="feed">' + d.sends.map(x => '<li><span class="chip' + (/^failed/i.test(x.status) ? ' bad' : x.kind === 'welcome' ? ' good' : '') + '">' + ({ welcome: 'Welcome', again: 'Sent again', letter: 'Weekly letter', reminder: 'Star reminder' }[x.kind] || 'Letter') + '</span> ' +
      esc(x.at) + ' · ' + esc(x.staff) + (x.kind === 'letter' ? ' · ' + x.items + ' items' : '') + (x.to ? ' · to ' + esc(x.to) : '') + (/^failed/i.test(x.status) ? ' · <b style="color:var(--badText)">' + esc(x.status) + '</b>' : '') + '</li>').join('') + '</ul>' : '<p class="muted">Nothing yet.</p>') +
    (Array.isArray(d.views) ? '<h3>Who opened their page</h3>' + (d.views.length ? '<ul class="feed">' + d.views.map(v => '<li>' + esc(v.at) + (v.name ? ' · <b>' + esc(v.name) + '</b>' : ' · <span class="muted">name not known until they answer from that device</span>') +
      (DEV[v.device] ? ' · ' + DEV[v.device] : '') + (v.from ? ' · from the ' + esc(v.from) : '') + '</li>').join('') + '</ul>' : '<p class="muted">No sign-in on record yet.</p>') : '') +
    '<h3>What the group told us</h3>' + (d.responses.length ? '<ul class="feed">' + d.responses.map(r => '<li>' + esc(r.at) + ' · <b>' + esc(r.name) + '</b>' + (r.rating ? ' · ' + r.rating + '★' : '') + (r.verdict ? ' · ' + esc({ change: 'Needs a change', notours: 'Not ours', correct: 'Correct' }[r.verdict]) + ': ' + esc(r.title) : '') + (r.note ? ' “' + esc(r.note) + '”' : '') + (r.comment ? ' “' + esc(r.comment) + '”' : '') + '</li>').join('') + '</ul>' : '<p class="muted">No answers yet.</p>');
  $('app').innerHTML = h;
  $('bk').onclick = render;
  if ($('bkBill')) $('bkBill').onclick = () => openBilling(g.key);
  bindPend();
  $('app').querySelectorAll('[data-act]').forEach(b => b.onclick = () => openAct(b.dataset.act, b.dataset.k));
  $('pv').onclick = preview;
  if ($('unap')) $('unap').onclick = async () => { const r = await post({ action: 'gcm.unapprove', group: GROUP.group.key }); if (!r.ok) return toast(r.error || 'Not cancelled', true); toast('Approval cancelled. Nothing goes on Monday until you approve again.'); openGroup(GROUP.group.key); };
  const ha = $('histAll');
  if (ha) ha.onclick = () => { const all = [...$('app').querySelectorAll('details.hist')], open = all.some(x => !x.open); all.forEach(x => { x.open = open; }); ha.textContent = open ? 'Hide all history' : 'Show all history'; };
  $('app').querySelectorAll('[data-show]').forEach(c => c.onchange = () => share({ kind: 'show', task: c.dataset.show, value: c.checked ? 'Y' : 'N' }, c));
  $('app').querySelectorAll('[data-post]').forEach(c => c.onchange = () => share({ kind: 'post', task: c.dataset.task, post: c.dataset.post, value: c.checked ? 'Y' : 'N' }, c));
  $('app').querySelectorAll('[data-note]').forEach(b => b.onclick = () => { const t = $('n-' + b.dataset.note); if (!t.value.trim()) return toast('Write the note first.', true); share({ kind: 'note', task: b.dataset.note, text: t.value }, b, true); });
  $('app').querySelectorAll('[data-cmt]').forEach(b => b.onclick = () => { const t = $('n-' + b.dataset.cmt); if (!t.value.trim()) return toast('Write the comment first.', true); share({ kind: 'comment', task: b.dataset.cmt, text: t.value }, b, true); });
  $('app').querySelectorAll('[data-draft]').forEach(b => b.onclick = async () => {
    const t = $('n-' + b.dataset.draft); b.disabled = true; b.textContent = 'Drafting…';
    const r = await api({ action: 'gcm.draft', group: GROUP.group.key, task: b.dataset.draft });
    b.disabled = false; b.textContent = 'Draft with AI';
    if (!r.ok) return toast(r.error || 'No draft', true);
    t.value = r.text; t.focus();
    toast('Draft ready. Read it, change anything that is not right, then press Post. Nothing is shared until you do.');
  });
  window.scrollTo(0, 0);
}
/* the top of a group: its welcome, its last letter, and the buttons to send them */
function accountBar(d) {
  const a = d.account, s = d.stats;
  if (!a) return '';
  let h = '<div class="drawer" style="padding:12px 16px;margin:12px 0;box-shadow:var(--shadow)"><div style="display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center">' +
    '<div><span class="small muted">Welcome</span><br>' + (a.welcome ? '<span class="chip good"><i></i>Sent ' + esc(shortAt(a.welcome.at)) + ' · ' + esc(a.welcome.by) + '</span>' : a.welcomeWhy ? '<span class="chip warn"><i></i>Not yet: ' + esc(a.welcomeWhy) + '</span>' : '<span class="chip"><i style="background:#9aa5b1"></i>Not sent yet</span>') + '</div>' +
    '<div><span class="small muted">Last letter</span><br>' + (a.last ? '<span class="chip"><i style="background:var(--bar)"></i>' + esc(shortAt(a.last.at)) + ' · ' + esc(a.last.by) + '</span>' : '<span class="chip"><i style="background:#9aa5b1"></i>None yet</span>') + '</div>' +
    '<div><span class="small muted">Opened · rated</span><br>' + rateHtml(a) + '</div>';
  if (d.canAct !== false) {
    h += '<div class="acts" style="margin-left:auto">';
    if (!a.welcomeWhy) h += '<button class="btn ' + (a.welcome ? 'ghost' : '') + '" type="button" data-act="welcome" data-k="' + esc(d.group.key) + '">' + (a.welcome ? 'Resend the welcome' : 'Send the welcome') + '</button>';
    if (s.ready && !a.mailWhy) h += '<button class="btn ghost" type="button" data-act="letter" data-k="' + esc(d.group.key) + '">Send this week’s letter</button>';
    if (a.last && a.last.again && !a.mailWhy) h += '<button class="btn ghost" type="button" data-act="again" data-k="' + esc(d.group.key) + '">Resend the last letter</button>';
    if (canRemind({ canAct: true }, a, s)) h += remindBtn(d.group.key, a);
    h += '</div>';
  }
  return h + '</div></div>';
}
function itemHtml(it) {
  const cls = it.late ? ' late' : /waiting/i.test(it.status) ? ' wait' : '';
  return '<div class="item' + cls + '"><h4>' + esc(it.title) + '</h4>' +
    '<div class="meta"><b>' + esc(it.type) + '</b> · on it: <b>' + esc(it.owner || '–') + '</b>' + (it.who ? ' · for ' + esc(it.who) : '') + (it.ref ? ' · ' + esc(it.ref) : '') +
    ' · opened ' + esc(dmy(it.opened)) + ' (<b>' + (it.age == null ? '?' : it.age) + ' days</b>) · due ' + (it.due ? esc(dmy(it.due)) + (it.late ? ' <b style="color:var(--badText)">past target</b>' : '') : 'not set') + ' · ' + esc(it.status) + '</div>' +
    (it.subject && it.subject !== it.title ? '<div class="subj">Salesforce subject: ' + esc(it.subject) + '</div>' : '') +
    (it.story ? '<div class="story"><b>Why it is still open' + (it.priv ? '' : ' (as the group reads it)') + ':</b> ' + esc(it.story.why) + '</div>' +
      (it.story.flags.length || it.story.needReason ? '<div class="chips">' + (it.story.needReason ? '<span class="chip bad"><i></i>Needs a reason for the group before the letter goes</span>' : '') +
        it.story.flags.map(f => '<span class="chip warn"><i></i>' + esc(f) + '</span>').join('') + '</div>' : '') +
      '<details class="hist"><summary>History and e-mails <span class="n">' + it.story.history.length + '</span></summary><ul>' +
        (it.story.history.length ? it.story.history.map(e => '<li' + (e.internal ? ' class="int"' : '') + '><span class="d">' + (e.d ? esc(dmy(e.d)) : '–') + '</span><span>' + esc(e.text) + (e.internal ? '<span class="staff">staff only</span>' : '') + '</span></li>').join('') : '<li><span class="d">–</span><span>Nothing recorded in Salesforce yet.</span></li>') + '</ul></details>' : '') +
    '<div class="chips">' + (it.level === 'member' ? '<span class="chip"><i style="background:#9aa5b1"></i>Employee item: shown only if ticked</span>' : '') +
    (it.priv ? '<span class="chip bad"><i></i>Health or claim: stays with staff</span>' : '<label class="toggle"><input type="checkbox" data-show="' + esc(it.id) + '"' + (it.shown ? ' checked' : '') + (GROUP.canAct === false ? ' disabled' : '') + '> The group sees this item</label>') +
    (it.answer ? '<span class="chip ' + (it.answer.verdict === 'correct' ? 'good' : 'warn') + '"><i></i>Group said: ' + esc({ change: 'Needs a change', notours: 'Not ours', correct: 'Correct' }[it.answer.verdict] || 'a note') + (it.answer.note ? ' “' + esc(it.answer.note) + '”' : '') + '</span>' : '') + '</div>' +
    '<div class="posts">' + (it.posts.length ? it.posts.map(p => '<div class="post' + (p.team ? ' team' : p.shared ? ' shared' : '') + '">' +
      (p.team || it.priv ? '' : '<label class="toggle" style="float:right"><input type="checkbox" data-task="' + esc(it.id) + '" data-post="' + esc(p.id) + '"' + (p.shared ? ' checked' : '') + (GROUP.canAct === false ? ' disabled' : '') + '> Share</label>') +
      '<span class="who">' + esc(p.by) + '</span> <span class="muted">' + esc(p.when) + '</span>' + (p.team ? '<span class="tag">Team comment · never shown to the group</span>' : '') + '\n' + esc(p.text) +
      (p.replies || []).map(r => '\n  ↳ ' + esc(r.by) + ': ' + esc(r.text)).join('') + '</div>').join('') : '<div class="small muted">No Chatter on this task.</div>') +
      '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:flex-start"><textarea class="field" id="n-' + esc(it.id) + '" rows="2" maxlength="2000" placeholder="' + (GROUP.canAct === false || it.priv ? 'A comment for the team: posted to the task’s Chatter, never shown to the group' : it.story && it.story.needReason ? 'Why is this still open? Post it for the group, or comment for the team only' : 'Post a note for the group, or a comment for the team only') + '" style="flex:1;min-width:200px;min-height:44px;padding:8px 10px"></textarea>' +
      (GROUP.canAct !== false && !it.priv && GROUP.ai ? '<button class="btn ghost" type="button" data-draft="' + esc(it.id) + '">Draft with AI</button>' : '') +
      (GROUP.canAct !== false && !it.priv ? '<button class="btn ghost" type="button" data-note="' + esc(it.id) + '">Post for the group</button>' : '') +
      '<button class="btn ghost" type="button" data-cmt="' + esc(it.id) + '">Comment for the team</button></div></div></div>';
}
function yearHtml(d) {
  const y = d.year;
  if (!y) return '<h3>Service record this year <span class="muted small">what the group sees</span></h3>' + recordHtml(d.record);
  let h = '<h2>The year with this group</h2>' +
    '<div class="tiles"><div class="tile"><b>' + y.done + '</b><span>completed for the company</span></div><div class="tile"><b>' + y.member + '</b><span>for employees’ own policies</span></div>' +
    '<div class="tile"><b>' + pct(y.onTimePct) + '</b><span>on time</span></div><div class="tile"><b>' + (y.avgDays == null ? '–' : y.avgDays + 'd') + '</b><span>average days</span></div>' +
    (y.priv ? '<div class="tile"><b>' + y.priv + '</b><span>health and claims (staff only)</span></div>' : '') + '</div>' +
    monthsHtml(y.months, m => m.done + m.member, 'completed') +
    monthsTable(y.months, [['For the company', m => m.done], ['For employees’ own policies', m => m.member], ['Health and claims (staff only)', m => m.priv], ['New items opened', m => m.opened]]) +
    (y.trend.length ? '<p class="trend">' + esc(y.trend.join(' ')) + '</p>' : '') +
    '<h3>By service <span class="muted small">what the group sees on its page</span></h3>' + recordHtml(d.record);
  if (y.types && y.types.length) h += '<h3>By Salesforce task type <span class="muted small">completed for the company this year</span></h3><div class="chips">' +
    y.types.map(t => '<span class="chip">' + esc(t.type) + ' · ' + t.done + '</span>').join('') + '</div>';
  h += '<h3>Opportunities and trends <span class="muted small">for the team, never shown to the group</span></h3>' + oppsHtml(y.opps || [], false);
  return h;
}
function recordHtml(rows) {
  if (!rows.length) return '<p class="muted">Nothing on record yet this year.</p>';
  return '<div class="scroll"><table class="t"><thead><tr><th>Service</th><th class="num">Completed</th><th class="num">On time</th><th class="num">Avg days</th><th class="num">Open</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + esc(r.type) + '</td><td class="num">' + r.done + '</td><td class="num">' + pct(r.onTimePct) + '</td><td class="num">' + (r.avgDays == null ? '–' : r.avgDays) + '</td><td class="num">' + r.open + '</td></tr>').join('') + '</tbody></table></div>';
}
async function share(body, el, reload) {
  el.disabled = true;
  const r = await post(Object.assign({ action: 'gcm.share', group: GROUP.group.key }, body));
  el.disabled = false;
  if (!r.ok) { toast(r.error || 'Not saved', true); if (el.type === 'checkbox') el.checked = !el.checked; return; }
  toast(body.kind === 'note' ? 'Posted to the task’s Chatter, and shown to the group.' : body.kind === 'comment' ? 'Comment posted to the task’s Chatter for the team. The group never sees it.' : 'Saved.');
  if (reload) openGroup(GROUP.group.key);
}
/* who the letter goes to, and where that came from: the account's Contact Person in Salesforce, or the register */
function toLine(o) {
  return '<b>' + (o.contact ? esc(o.contact) + ' &lt;' + esc(o.to.join(', ')) + '&gt;' : esc(o.to.join(', '))) + '</b>' +
    ' <span class="muted">(' + (o.toFrom === 'salesforce' ? (o.contact ? 'the account’s Contact Person in Salesforce' : 'the account’s e-mail in Salesforce') : 'from the Group Register') + ')</span>' +
    (o.cc && o.cc.length ? ', copy ' + esc(o.cc.join(', ')) : '');
}
async function preview() {
  const box = $('pvBox'); box.innerHTML = '<p class="muted">Writing the letter from this group’s numbers…</p>';
  const r = await api({ action: 'gcm.preview', group: GROUP.group.key, intro: $('intro').value });
  if (!r.ok) { box.innerHTML = '<div class="note bad">' + esc(r.error) + '</div>'; return; }
  box.innerHTML = '<p class="small" style="margin:12px 0 6px">To ' + (r.to.length ? toLine(r) : '<b>nobody</b>') + ' · hidden copy to ' + esc(r.copy.join(', ')) + ' · subject <b>' + esc(r.letter.subject) + '</b></p>' +
    '<iframe class="preview" title="Letter preview" sandbox="' + PV_SANDBOX + '"></iframe>' +
    (r.canAct === false ? '<div class="note">This is the letter as it would go. Approving it is for ' + esc(GROUP.group.assigned ? GROUP.group.assigned.split(' ')[0] + ', ' : '') + 'the assistant branch manager or the branch manager.</div>' :
     r.ready ? '<label class="toggle" style="margin:12px 0"><input type="checkbox" id="ck"> I have checked every item against Salesforce and the latest billing</label><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn gold" type="button" id="ap" disabled>Approve for ' + esc(r.nextSend) + '</button>' +
      (r.canSendNow ? (r.mail ? '<button class="btn ghost" type="button" id="sd" disabled>Send now instead</button>' : '') + '<button class="btn ghost" type="button" id="ol" disabled>Open in Outlook instead</button>' : '') + '</div>' +
      '<p class="small muted" style="margin-top:8px">At ' + esc(r.nextSend) + ' the letter is written again from Salesforce and sent from support@. If a new item appears after you approve, it waits and you are told by e-mail. Send now goes at once and closes the approval.</p>'
      : '<div class="note bad">Cannot approve yet: ' + esc(r.why) + '.</div>');
  box.querySelector('iframe').srcdoc = pvDoc(r.letter.html);
  const ck = $('ck'); if (!ck) return;
  ck.onchange = () => ['ap', 'sd', 'ol'].map($).filter(Boolean).forEach(b => { b.disabled = !ck.checked; });
  $('ap').onclick = approve;
  if ($('sd')) $('sd').onclick = () => send(false);
  if ($('ol')) $('ol').onclick = () => send(true);
}
async function approve() {
  const btns = ['ap', 'sd', 'ol'].map($).filter(Boolean); btns.forEach(b => b.disabled = true);
  const r = await post({ action: 'gcm.approve', group: GROUP.group.key, intro: $('intro').value, checked: $('ck').checked });
  if (!r.ok) { toast(r.error || 'Not approved', true); btns.forEach(b => b.disabled = false); return; }
  toast('Approved. It goes ' + r.for + '.' + (r.welcome ? ' Their welcome e-mail, with the film, goes within the hour, signed by you.' : ''));
  setTimeout(() => openGroup(GROUP.group.key), 1000);
}
async function send(outlook) {
  const btns = ['ap', 'sd', 'ol'].map($).filter(Boolean); btns.forEach(b => b.disabled = true);
  const r = await post({ action: 'gcm.send', group: GROUP.group.key, intro: $('intro').value, checked: $('ck').checked, outlook: outlook });
  if (!r.ok) { toast(r.error || 'Not sent', true); btns.forEach(b => b.disabled = false); return; }
  if (r.outlook) {
    const o = r.outlook, q = ['subject=' + encodeURIComponent(o.subject), 'body=' + encodeURIComponent(o.body)];
    if (o.cc.length) q.push('cc=' + encodeURIComponent(o.cc.join(',')));
    if (o.bcc.length) q.push('bcc=' + encodeURIComponent(o.bcc.join(',')));
    location.href = 'mailto:' + o.to.join(',') + '?' + q.join('&');
    toast('Opened in Outlook and logged. Press Send there.');
  } else toast('Sent from support@ and logged, ' + r.at + '.');
  setTimeout(() => openGroup(GROUP.group.key), 1200);
}

if (AUTH.code) { $('gWho').value = AUTH.who; $('gCode').value = AUTH.code; open_(); }
</script>
