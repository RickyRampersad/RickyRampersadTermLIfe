  /* My workday (23 October 2026): one fast page for everyone. The page is static and opens at once with the last
     copy this phone saw; the day itself comes from the tracker as JSON (wd=) and is drawn with motion. The colours
     are the branch's day pages: cream, navy, green for on pace, amber for behind, red for what needs you. */
  :root{
    --bg:#F7F5EF; --card:#FFFFFF; --ink:#1F2433; --navy:#141C4A; --muted:#6A7180; --line:#E7E2D6; --track:#ECE7DA;
    --good:#2C7A57; --good2:#3E9C72; --warn:#C26A04; --bad:#C8402F; --gold:#E3B23C; --soft:#F3F0E7;
    --shadow:0 1px 2px rgba(20,28,74,.05),0 8px 24px rgba(20,28,74,.06);
    --r:16px; --ease:cubic-bezier(.16,1,.3,1);
    --fd:'Plus Jakarta Sans', 'Plus Jakarta Sans Fallback', 'Plus Jakarta Sans Fallback R',Inter, 'Inter Fallback', 'Inter Fallback R',system-ui,sans-serif; --fb:Inter, 'Inter Fallback', 'Inter Fallback R',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0F1326; --card:#171C35; --ink:#E9ECF6; --navy:#E9ECF6; --muted:#9AA2BC; --line:#2A3152; --track:#262D4C;
    --good:#3FB27F; --good2:#5CC796; --warn:#E39A3B; --bad:#EE6B5B; --gold:#E8BE55; --soft:#1D2340;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); } }
  :root[data-theme="dark"]{
    --bg:#0F1326; --card:#171C35; --ink:#E9ECF6; --navy:#E9ECF6; --muted:#9AA2BC; --line:#2A3152; --track:#262D4C;
    --good:#3FB27F; --good2:#5CC796; --warn:#E39A3B; --bad:#EE6B5B; --gold:#E8BE55; --soft:#1D2340;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow-x:hidden}
  a{color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .eyebrow{font:800 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  header.top{padding:18px 0 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  #toapp{color:inherit;font-weight:800;text-decoration:none;margin-right:8px} #toapp:hover{text-decoration:underline}
  h1{font:800 clamp(22px,6vw,28px)/1.15 var(--fd);margin:6px 0 2px;color:var(--navy);letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px}
  .clock{font:700 13px/1 var(--fd);color:var(--muted);white-space:nowrap;text-align:right}
  .clock b{display:block;font-size:22px;color:var(--navy);margin-bottom:4px;font-variant-numeric:tabular-nums}

  /* The progress bar, across the top and kept there. */
  .prog{position:sticky;top:0;z-index:5;margin:10px -16px 14px;padding:12px 16px 12px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);
        backdrop-filter:saturate(1.3) blur(8px);-webkit-backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid transparent;transition:border-color .3s}
  .prog.stuck{border-bottom-color:var(--line)}
  .prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pct{font:800 clamp(30px,9vw,40px)/1 var(--fd);color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pct small{font-size:.45em;color:var(--muted);font-weight:700;margin-left:2px}
  .of{font:700 13.5px/1.3 var(--fb);color:var(--muted);text-align:right}
  .of b{color:var(--ink)}
  .bar{position:relative;height:16px;border-radius:10px;background:var(--track);margin:10px 0 6px;overflow:visible}
  .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:10px;background:linear-gradient(90deg,var(--good),var(--good2));transition:width 1.4s var(--ease),background .4s}
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:sheen 2.6s linear infinite}
  .fill2{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:0 10px 10px 0;background:var(--good);opacity:.38;transition:left 1.4s var(--ease),width 1.4s var(--ease)}
  .sys{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
  .sys b{color:var(--ink)}
  .wt{padding:12px 0;border-top:1px solid var(--line);max-height:900px} .wt:first-of-type{border-top:0}
  .wt .who{font:800 14.5px/1.3 var(--fd);color:var(--navy);overflow-wrap:anywhere} .wt .who span{font:600 13px/1.3 var(--fb);color:var(--muted)}
  .wt .said{color:var(--muted);font-size:13.5px;margin:3px 0 0;font-style:italic;overflow-wrap:anywhere}
  .wt .rd{font-size:13px;background:var(--soft);border-radius:10px;padding:7px 10px;margin:8px 0 6px;overflow-wrap:anywhere}
  .wt .rd b{color:var(--navy)}
  .wt textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.45 var(--fb);color:var(--ink);background:var(--card);resize:vertical}
  .wt textarea:focus{outline:none;border-color:var(--good)}
  .wt .act{display:flex;gap:8px;align-items:center;margin-top:8px}
  .wt .act select{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font:600 14px var(--fb);background:var(--card);color:var(--ink)}
  .wt .act .go{margin:0;width:auto;flex:none;padding:0 22px}
  .wt.gone{transition:opacity .4s,max-height .5s,padding .5s;opacity:0;max-height:0!important;overflow:hidden;padding:0}
  .prog.behind .fill{background:linear-gradient(90deg,var(--warn),#D98A2B)}
  .prog.far .fill{background:linear-gradient(90deg,var(--bad),#DB6A55)}
  .now{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--navy);left:0;transition:left 1.4s var(--ease);opacity:.85}
  .mk{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--navy);opacity:.85;vertical-align:-1px;margin-right:5px}
  .pace{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .pace b{color:var(--ink)}
  @keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
  .chip{font:700 12px/1 var(--fb);padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .chip b{color:var(--ink);margin-right:3px}
  .chip.bad b{color:var(--bad)} .chip.good b{color:var(--good)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow);
        opacity:0;transform:translateY(10px);animation:rise .6s var(--ease) forwards}
  .card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}.card:nth-of-type(4){animation-delay:.18s}.card:nth-of-type(5){animation-delay:.24s}
  @keyframes rise{to{opacity:1;transform:none}}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .ch h2{font:800 16px/1.2 var(--fd);margin:0;color:var(--navy)}
  .ch .n{font:700 12px/1 var(--fb);color:var(--muted)}

  .ci{display:flex;align-items:center;gap:14px}
  .dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--good);font:800 20px/1 var(--fd)}
  .dot.late{color:var(--warn)} .dot.out{color:var(--bad)}
  .ci .t{font:800 18px/1.2 var(--fd);color:var(--navy)} .ci .s{color:var(--muted);font-size:13.5px}
  button,.btn{appearance:none;border:0;cursor:pointer;font:800 15px/1 var(--fd);border-radius:12px;padding:15px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
  .go{width:100%;background:var(--navy);color:var(--bg);margin-top:12px;transition:transform .15s,opacity .2s}
  :root[data-theme="dark"] .go{background:var(--gold);color:#141C4A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .go{background:var(--gold);color:#141C4A} }
  .go:active{transform:scale(.98)} .go[disabled]{opacity:.6}
  .ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);opacity:0;transform:translateX(-6px);animation:slide .45s var(--ease) forwards}
  ul.list li:first-child{border-top:0}
  @keyframes slide{to{opacity:1;transform:none}}
  .ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:800 13px/1 var(--fd);background:var(--soft);color:var(--good);margin-top:1px}
  #closeday{display:flex;margin-top:14px}
  /* The agents' My day (27 Oct 2026): the two pages their e-mails carry, from the branch app. */
  .ag{position:relative;overflow:hidden}
  .ag .step{display:flex;gap:14px;align-items:center}
  .ag .num{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 18px/1 var(--fd);color:#141C4A;background:linear-gradient(135deg,#F6C76A,#E3B23C)}
  .ag.pm .num{background:linear-gradient(135deg,#9AD9BE,#3E9C72);color:#fff}
  .ag .t{font:800 18px/1.2 var(--fd);color:var(--navy)} .ag .s{color:var(--muted);font-size:13.5px;margin-top:2px}
  .ag .ok{display:inline-block;font:800 11px/1 var(--fb);letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--good);margin-left:6px;vertical-align:2px}
  .ag .go{display:flex}
  .ag::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(227,178,60,.22),transparent 70%);animation:glow 4s ease-in-out infinite alternate}
  .ag.pm::after{background:radial-gradient(circle,rgba(62,156,114,.2),transparent 70%)}
  @keyframes glow{to{transform:translate(-18px,14px) scale(1.15)}}
  .tip{font-size:13px;color:var(--muted);line-height:1.5}
  /* The register (27 Oct 2026): the last five working days, desk by desk. */
  .att{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
  .att th{font:700 11px/1.2 var(--fb);color:var(--muted);text-align:center;padding:2px 0}
  .att th:first-child{width:62px;text-align:left}
  .att td{font:600 11.5px/1.25 var(--fb);text-align:center;border-radius:8px;padding:7px 2px;background:var(--soft);color:var(--muted);overflow-wrap:anywhere;vertical-align:middle}
  .att td.nm{background:none;text-align:left;font:800 13px/1.2 var(--fd);color:var(--navy);padding-left:0}
  .att td.in{background:rgba(62,156,114,.13);color:var(--good)} .att td.late{background:rgba(194,106,4,.13);color:var(--warn)}
  .att td.absent{background:rgba(200,64,47,.12);color:var(--bad)} .att td.none,.att td.notin{background:transparent;border:1.5px dashed rgba(194,106,4,.55);color:var(--warn)}
  .att td small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
  .att td b.t{display:block;white-space:nowrap;font-weight:700}
  .att td small.out{margin-top:3px;padding-top:3px;border-top:1px solid rgba(127,127,127,.25);color:var(--ink);opacity:.8}
  .att td small.out.early{color:var(--warn);opacity:1} .att td small.out.none{color:var(--muted)}
  .att td[data-mark]{cursor:pointer} .att td[data-mark]:hover{filter:brightness(.96)}
  .markbox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
  .markbox .q{font:800 14px/1.3 var(--fd);color:var(--navy);margin-bottom:8px}
  .markbox .row{display:flex;flex-wrap:wrap;gap:8px}
  .markbox .row button{flex:1 1 auto;padding:11px 12px;font-size:14px;background:var(--card);color:var(--navy);border:1.5px solid var(--line)}
  .markbox input{width:100%;box-sizing:border-box;margin-top:8px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font:500 15px var(--fb);background:var(--card);color:var(--ink)}
  .attkey{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .tip b{color:var(--ink)}
  .closed{margin-top:12px;font-size:14px;color:var(--muted)} .closed b{color:var(--good)} .closed a{color:inherit;font-weight:700}
  .ic.no{color:var(--bad)} .ic.late{color:var(--bad)} .ic.due{color:var(--warn)} .ic.k{color:var(--navy)} .ic.todo{color:var(--muted)}
  .li .s.done{text-decoration:line-through;color:var(--muted)} .li .s.done a{color:inherit}
  .li{flex:1;min-width:0}
  .li .s{overflow-wrap:anywhere}
  .li small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .tag{display:inline-block;font:800 10.5px/1 var(--fb);letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:1px}
  .tag.bad{color:var(--bad)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}

  .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:132px;padding-top:18px}
  .bcol{display:flex;flex-direction:column;align-items:center;height:100%;gap:6px;min-width:0}
  .bt{flex:1;width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-height:0}
  .bv{flex:none;font:800 13px/1 var(--fd);color:var(--navy);font-variant-numeric:tabular-nums}
  .bb{flex:none;width:100%;max-height:calc(100% - 18px);border-radius:9px 9px 4px 4px;background:var(--track);height:0;transition:height 1.1s var(--ease)}
  .bcol.today .bb{background:linear-gradient(180deg,var(--good2),var(--good))}
  .bl{font:700 11.5px/1 var(--fb);color:var(--muted)}
  .bcol.today .bl{color:var(--navy)}

  .team .row{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .team .row:first-child{border-top:0}
  .team .nm{font:800 14px/1.2 var(--fd);color:var(--navy)} .team .nm small{display:block;font:500 11.5px/1.3 var(--fb);color:var(--muted)}
  .mini{position:relative;height:10px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:var(--good);transition:width 1.2s var(--ease)}
  .mini i.behind{background:var(--warn)} .mini i.far{background:var(--bad)}
  .mini u{position:absolute;top:0;bottom:0;width:2px;background:var(--navy);opacity:.55;text-decoration:none}
  .team .v{font:700 12.5px/1.2 var(--fb);color:var(--muted);text-align:right;white-space:nowrap} .team .v b{color:var(--ink)}

  .foot{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
  .foot .go{margin:0}
  .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:6px}
  .meta a{font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13.5px}
  .notice.bad{border-left-color:var(--bad)}
  .skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--track),var(--soft),var(--track));background-size:200% 100%;animation:sheen 1.4s linear infinite;margin:8px 0}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--navy);color:var(--bg);padding:11px 16px;border-radius:12px;font:700 14px/1.3 var(--fb);transition:.35s var(--ease);z-index:9;max-width:calc(100% - 32px);text-align:center}
  .toast.on{transform:translate(-50%,0);opacity:1}
  /* The one screen (29 Oct 2026): the task cards, what came up, the close-out and the update bar, here. */
  .upline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
  .upline a{font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:2px;color:var(--ink)}
  .upd{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--soft);border:1.5px solid var(--gold);font:700 13px/1.35 var(--fb);color:var(--ink);animation:rise .4s var(--ease)}
  .upd[hidden]{display:none}
  .upd span{flex:1;min-width:0} .upd button{flex:none;min-height:38px;padding:9px 14px;font-size:13.5px;background:var(--gold);color:#141C4A}
  ul.list li.tk{flex-wrap:wrap}
  li.tk .li .s{cursor:pointer} li.tk .li .s::after{content:" \25BE";color:var(--muted);font-size:.85em}
  li.tk.open .li .s::after{content:" \25B4"}
  .tc{flex:0 0 100%;margin:8px 0 2px 34px;padding:12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);animation:rise .35s var(--ease)}
  .tc[hidden]{display:none}
  @media (max-width:420px){ .tc{margin-left:0} }
  .tc .lab{font:700 12px/1.4 var(--fb);color:var(--muted);margin-bottom:6px} .tc .lab .bdg{display:inline-block;font:800 10.5px/1 var(--fb);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--card);color:var(--ink);margin-right:6px}
  .tc .lab .bdg.r{color:var(--bad)}
  .tc .todo{font-size:14px;line-height:1.45;color:var(--ink)} .tc .todo b{color:var(--navy)}
  .tc .nx{font:700 13.5px/1.4 var(--fb);color:var(--bad);margin-top:4px}
  .tc .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .tc .notes{margin:8px 0 2px;font-size:12.5px;color:var(--muted)} .tc .notes div{margin-top:3px;overflow-wrap:anywhere} .tc .notes b{color:var(--ink)}
  .tpl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
  .tpl button{min-height:0;flex:1 1 auto;padding:8px 10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 12.5px/1.35 var(--fb);text-align:left}
  .tpl button i{font-style:normal;font:800 10px/1 var(--fb);letter-spacing:.06em;text-transform:uppercase;margin-right:6px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:1px}
  .tpl button i.c{color:var(--good)} .tpl button i.m{color:var(--warn)}
  .tc textarea,.cl textarea,.sc textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.45 var(--fb);color:var(--ink);background:var(--card);resize:vertical}
  .tc textarea:focus,.cl textarea:focus,.sc textarea:focus{outline:none;border-color:var(--good)}
  .tc .cai{width:100%;margin:6px 0;background:transparent;color:var(--gold);border:1.5px dashed var(--gold);font-size:14px;min-height:44px}
  .tc .dt{display:block;font-size:12.5px;color:var(--muted);margin:4px 0 8px}
  .tc input[type=date],.cl input[type=date],.cl input[type=text],.cl select,.sc select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:600 15px var(--fb);background:var(--card);color:var(--ink);min-height:44px}
  .cbt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .cbt button{min-height:46px;padding:10px 4px;font-size:14px}
  .cbt .c{background:var(--good);color:#fff} .cbt .m{background:var(--warn);color:#fff} .cbt .n{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .cbt button[disabled],.tc .cai[disabled]{opacity:.5}
  .cst{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:16px} .cst.ok{color:var(--good);font-weight:800} .cst.bad{color:var(--bad);font-weight:700}
  .tc .sf{display:inline-block;margin-top:8px;font:700 12.5px var(--fb);color:var(--muted)}
  .sc .row{display:flex;gap:8px;margin-top:8px} .sc .row select{flex:1;margin:0} .sc .row .go{margin:0;width:auto;flex:none;padding:0 18px}
  .sc .res div{font-size:13px;margin-top:4px} .sc .res .bad{color:var(--bad)}
  .cl .grp{margin-top:14px} .cl .grp h3{font:800 14px/1.3 var(--fd);color:var(--navy);margin:0 0 6px}
  .cl .it{padding:10px 0;border-top:1px solid var(--line)} .cl .it:first-of-type{border-top:0}
  .cl .it .s{font:600 14px/1.4 var(--fb);overflow-wrap:anywhere}
  .cl .seg{display:flex;gap:6px;margin-top:6px} .cl .seg label{flex:1;display:flex}
  .cl .seg input{position:absolute;opacity:0;pointer-events:none}
  .cl .seg span{flex:1;text-align:center;padding:11px 6px;border-radius:10px;border:1.5px solid var(--line);font:800 13.5px/1.2 var(--fd);cursor:pointer;color:var(--muted)}
  .cl .seg input:checked+span{border-color:var(--good);color:var(--good);background:var(--card)}
  .cl .seg input[value^="Not"]:checked+span{border-color:var(--bad);color:var(--bad)}
  .cl .done div{font-size:13.5px;color:var(--good);margin-top:2px}
  .cl .out{display:flex;gap:10px;align-items:center;font:800 14px var(--fd);margin-top:14px} .cl .out input{width:22px;height:22px}
  .more[hidden]{display:none}
  .showmore{width:100%;margin-top:6px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .card,ul.list li{opacity:1;transform:none} }
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><a id="toapp" href="/rroperations/" hidden>&larr; Branch app</a> Ricky Rampersad Branch · My workday</div>
      <h1 id="hello">Your day</h1>
      <div class="sub" id="when">&nbsp;</div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="hours">&nbsp;</span></div>
  </header>

  <section class="prog" id="prog" aria-label="Your progress today">
    <div class="row">
      <div class="pct" id="pct">0<small>%</small></div>
      <div class="of" id="of">Opening your day…</div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <div class="fill" id="fill"></div>
      <div class="fill2" id="fill2"></div>
      <div class="now" id="nowm" title="Where the working day is now"></div>
    </div>
    <div class="pace" id="pace">&nbsp;</div>
    <div class="upline"><span id="upat">&nbsp;</span><a id="uprefresh" role="button" tabindex="0">Refresh</a></div>
    <div class="upd" id="upd" hidden><span id="updt"></span><button type="button" id="updgo">Refresh</button></div>
  </section>

  <div id="notice"></div>
  <div class="chips" id="chips"></div>
  <div class="sys" id="sys"></div>
  <main id="main">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>
  </main>
  <div class="meta"><span id="asat">&nbsp;</span><a id="refresh" role="button" tabindex="0">Refresh</a></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  // The tracker's web app: the same one the walls read. ?api= points it elsewhere for a test.
  var TRACKER = "https://script.google.com/macros/s/AKfycbzb9gzh3TldhLCQA7MCz3vdyWLAWTHpR9X7M3uvPNtqJbnnYRMcDSkm0D1C8SgENvn44g/exec";
  var Q = new URLSearchParams(location.search);
  if (Q.get("api") && /^https:\/\/script\.google\.com\/|^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(Q.get("api"))) TRACKER = Q.get("api");
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // Who you are, one of two ways. The e-mail's link carries your name and key (p, k); opened from the home screen without
  // them, the last link on this phone is used. Or the branch app's sign-in (26 Oct 2026, "My day" in the app, ?app=1):
  // the app keeps it under rrb-ops-session on this site and the tracker asks the app who it is. From the app, the app's
  // sign-in wins; otherwise a link does, and the app's sign-in is the fallback when this phone has no link.
  var P = Q.get("p") || "", K = Q.get("k") || "", OPS = "", fromApp = Q.get("app") === "1", ses = null;
  try { ses = JSON.parse(localStorage.getItem("rrb-ops-session") || "null"); } catch (e) {}
  var appTok = ses && ses.token ? String(ses.token) : "";
  if (P && K) store.set("wd_link", { p: P, k: K });
  else if (fromApp && appTok) OPS = appTok;
  else { var last = store.get("wd_link"); if (last) { P = last.p; K = last.k; } else if (appTok) OPS = appTok; }
  var WHO = OPS ? "app_" + String(ses.agentNo || ses.name || "") : P;
  function auth(body) { if (OPS) { body.set("wd", "app"); body.set("ops", OPS); } else { body.set("wd", P); body.set("k", K); } return body; }
  if (OPS || fromApp) { var ta = document.getElementById("toapp"); if (ta) ta.hidden = false; }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var M = null, busy = false, pending = null;

  function tick() {
    var d = new Date();
    try { $("clock").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Port_of_Spain" }); }
    catch (e) { $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  }
  tick(); setInterval(tick, 15000);
  var prog = $("prog");
  window.addEventListener("scroll", function () { prog.classList.toggle("stuck", window.scrollY > 8); }, { passive: true });

  function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("on"); }, 3200); }
  function notice(html, bad) { $("notice").innerHTML = html ? '<div class="notice' + (bad ? " bad" : "") + '">' + html + "</div>" : ""; }
  function countUp(el, to) {
    var from = Number(el.getAttribute("data-v") || 0), t0 = performance.now(), dur = 1100;
    el.setAttribute("data-v", to);
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { el.innerHTML = to + "<small>%</small>"; return; }
    (function step(t) { var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.innerHTML = Math.round(from + (to - from) * e) + "<small>%</small>"; if (k < 1) requestAnimationFrame(step); })(t0);
  }
  function greet(first) { var h = Number(new Date().toLocaleString("en-US", { hour: "numeric", hour12: false, timeZone: "America/Port_of_Spain" })); return (h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + ", " + first; }

  function drawLead(m) {
    var g = m.progress || {}, t = Math.max(1, Number(g.target || 0)), pct = Math.max(0, Number(g.pct || 0)), day = Math.max(0, Math.min(100, Number(g.dayPct || 0)));
    var youW = Math.min(100, 100 * Number(g.you || 0) / t), teamW = Math.min(100 - youW, 100 * Number(g.team || 0) / t), gap = day - pct;
    prog.className = "prog" + (!g.target ? "" : gap > 25 ? " far behind" : gap > 0 ? " behind" : "") + (window.scrollY > 8 ? " stuck" : "");
    countUp($("pct"), pct);
    $("bar").setAttribute("aria-valuenow", String(Math.min(100, pct)));
    requestAnimationFrame(function () { $("fill").style.width = youW + "%"; $("fill2").style.left = youW + "%"; $("fill2").style.width = teamW + "%"; $("nowm").style.left = day + "%"; });
    $("of").innerHTML = g.target ? "<b>" + g.cleared + "</b> of <b>" + g.target + "</b> cleared today" : "Nothing waited on you today";
    var bits = ['<span><i class="mk" aria-hidden="true"></i><b>' + day + "%</b> of your day gone</span>",
      "<span>By you <b>" + (g.you || 0) + "</b> · by the team <b>" + (g.team || 0) + "</b></span>"];
    if (g.waiting) bits.push('<span><b style="color:var(--bad)">' + g.waiting + "</b> still waiting on you</span>");
    $("pace").innerHTML = bits.join("");
    var chips = [];
    chips.push('<span class="chip' + (g.asks ? " bad" : "") + '"><b>' + (g.asks || 0) + "</b>staff waiting on your word</span>");
    chips.push('<span class="chip"><b>' + (g.inbox || 0) + "</b>inbox to act on</span>");
    chips.push('<span class="chip"><b>' + (g.mineDue || 0) + "</b>of your tasks for today</span>");
    chips.push('<span class="chip good"><b>' + (g.yourNotes || 0) + "</b>notes by you</span>");
    $("chips").innerHTML = chips.join("");
    var sys = g.sys || {}, ks = Object.keys(sys).sort(function (a, b) { return sys[b] - sys[a]; });
    $("sys").innerHTML = ks.length ? "Done for you by the system today: " + ks.map(function (k) { return "<b>" + sys[k] + "</b> " + esc(k); }).join(" · ") : "";
  }
  function drawProgress(m) {
    if (m.progress && m.progress.lead) return drawLead(m);
    $("fill2").style.width = "0"; $("sys").innerHTML = "";
    var g = m.progress || {}, pct = Math.max(0, Number(g.pct || 0)), day = Math.max(0, Math.min(100, Number(g.dayPct || 0)));
    var gap = day - pct, cls = !g.target ? "" : gap > 25 ? "far behind" : gap > 0 ? "behind" : "";
    prog.className = "prog" + (cls ? " " + cls : "") + (window.scrollY > 8 ? " stuck" : "");
    countUp($("pct"), pct);
    $("bar").setAttribute("aria-valuenow", String(Math.min(100, pct)));
    requestAnimationFrame(function () { $("fill").style.width = Math.min(100, pct) + "%"; $("nowm").style.left = day + "%"; });
    $("of").innerHTML = g.sf ? "<b>" + g.closed + "</b> of <b>" + g.target + "</b> closed today" : "Salesforce did not answer";
    var bits = [];
    bits.push('<span><i class="mk" aria-hidden="true"></i><b>' + day + "%</b> of your day gone</span>");
    if (g.sf && g.target) bits.push("<span>" + (gap > 0 ? "On pace for <b>" + g.proj + "</b>: " + (g.target - g.closed) + " to go" : g.closed >= g.target ? "<b>Today's number reached.</b> Keep going" : "Ahead of the day: on pace for <b>" + g.proj + "</b>") + "</span>");
    if (g.lastAt) bits.push("<span>Last entry <b>" + esc(g.lastAt) + "</b></span>");
    $("pace").innerHTML = bits.join("");
    var chips = [];
    if (g.sf) {
      chips.push('<span class="chip good"><b>' + g.noted + "</b>closed with your note</span>");
      if (g.unnoted) chips.push('<span class="chip bad"><b>' + g.unnoted + "</b>closed with no note</span>");
      chips.push('<span class="chip' + (g.overdue ? " bad" : "") + '"><b>' + g.overdue + "</b>overdue</span>");
      chips.push('<span class="chip"><b>' + g.dueToday + "</b>due today</span>");
      if (g.plan) chips.push('<span class="chip"><b>' + g.planDone + " of " + g.plan + "</b>of this morning's plan</span>");
    }
    $("chips").innerHTML = chips.join("");
  }

  function checkinCard(m) {
    var c = m.checkin || {}, absent = c.status === "absent";
    if (absent) return '<div class="card"><div class="ci"><div class="dot out">!</div><div><div class="t">Marked absent today</div><div class="s">' + esc(c.why || "No check-in by the time your day starts.") +
      "</div></div></div>" + '<button class="go" id="ci">Check in now</button><div class="s" style="color:var(--muted);font-size:12.5px;margin-top:8px">Checking in before noon brings back the work nobody has touched.</div></div>';
    if (!c.at) return '<div class="card"><div class="ci"><div class="dot">' + "&#9654;" + '</div><div><div class="t">Start your day</div><div class="s">Your day starts at ' + esc(m.start) + ". Checking in is the register.</div></div></div>" +
      '<button class="go" id="ci">Check in and start my day</button></div>';
    var late = Number(c.late || 0), cl = m.close;
    // Close my day (27 Oct 2026): the close-out, from here, with or without the e-mail.
    // Close my day (27 Oct 2026), here on this screen since 29 Oct: the button goes to the close-out at the foot of the page.
    var close = c.out ? '<div class="closed"><b>Day closed</b> · signed out ' + esc(c.out) + ".</div>"
      : m.closeInline ? '<button type="button" class="btn go" id="closeday" data-closego>Close my day</button><div class="s" style="color:var(--muted);font-size:12.5px;margin-top:8px">At the end of your day' + (cl && cl.end ? " (" + esc(cl.end) + ")" : "") + ": it is at the bottom of this page.</div>"
      : cl ? '<a class="btn go" id="closeday" href="' + esc(cl.url) + '">Close my day</a><div class="s" style="color:var(--muted);font-size:12.5px;margin-top:8px">At the end of your day' + (cl.end ? " (" + esc(cl.end) + ")" : "") + ': a reason and a new date for anything not done, the checks, and sign out.</div>'
      : '<button type="button" class="btn go" id="closeday" data-signout>Check out</button><div class="s" style="color:var(--muted);font-size:12.5px;margin-top:8px">When you leave: the register\'s sign-out.</div>';
    return '<div class="card"><div class="ci"><div class="dot' + (late ? " late" : "") + '">&#10003;</div><div><div class="t">In at ' + esc(c.at) + (late ? " · " + late + " min late" : " · on time") + "</div>" +
      '<div class="s">Your day started at ' + esc(m.start) + (c.out ? " · signed out " + esc(c.out) : "") + "</div></div></div>" + close + "</div>";
  }
  // A first name from "Sasha Lalla-Jagassar" or "kamla.dookran@myguardiangroup.com".
  // A task type in words, from the tracker's own labels when it sent them (29 Oct 2026: "Renewa/PDl/Bill" read as code).
  function tyName(t) { var l = M && M.types ? M.types.filter(function (x) { return x.k === t; })[0] : null; return l && l.l ? l.l : t; }
  function firstOf(by) { var b = String(by || "").trim(); if (!b) return "Someone"; if (b.indexOf("@") > -1) b = b.split("@")[0].split(/[._-]/)[0]; b = b.split(/\s+/)[0]; return b.charAt(0).toUpperCase() + b.slice(1); }
  function waitingCard(m) {
    var w = m.waiting; if (!w) return "";
    if (!w.length) return '<div class="card"><div class="ch"><h2>Waiting on you</h2></div><div class="empty">Nobody is waiting on your word. Well done.</div></div>';
    var desks = m.desks || [];
    return '<div class="card" id="waiting"><div class="ch"><h2>Waiting on you</h2><span class="n">' + w.length + "</span></div>" + w.map(function (x, wi) {
      var sel = x.k === "inbox" && desks.length ? '<select aria-label="Post to" data-to>' + desks.map(function (d) { return '<option value="' + esc(d.sid) + '"' + (d.sid === (x.to || "ricky") ? " selected" : "") + ">" + esc(d.first) + "</option>"; }).join("") + "</select>" : "";
      return '<div class="wt' + (wi >= 10 ? ' more' : '') + '"' + (wi >= 10 ? ' hidden' : '') + ' data-k="' + esc(x.k) + '" data-id="' + esc(x.id) + '"><div class="who">' + esc(firstOf(x.by)) + " <span>· " + esc(x.s) + "</span></div>" +
        (x.said ? '<div class="said">"' + esc(x.said) + '"</div>' : "") +
        (x.read || x.next || x.done ? '<div class="rd">' + (x.done ? "<b>Done so far:</b> " + esc(x.done) + "<br>" : "") + (x.read ? "<b>Claude:</b> " + esc(x.read) : "") + (x.next ? (x.read ? "<br>" : "") + "<b>Next:</b> " + esc(x.next) : "") + "</div>" : "") +
        '<textarea aria-label="Your answer" placeholder="' + (x.draft ? "" : "Claude has not written this one yet. Type your answer.") + '">' + esc(x.draft || "") + "</textarea>" +
        '<div class="act">' + sel + '<button class="go" data-post>Post</button></div></div>';
    }).join("") + (w.length > 10 ? '<button type="button" class="showmore" data-more>Show ' + (w.length - 10) + " more</button>" : "") + "</div>";
  }
  function achievedCard(m) {
    var a = m.achieved || [], lab = { close: "Closed", note: "Note", email: "E-mail", task: "Task", inbox: "Inbox", draft: "Note", move: "Moved" };
    var items = a.map(function (x, i) {
      var ic = x.k === "close" ? (x.noted ? '<span class="ic">&#10003;</span>' : '<span class="ic no">!</span>') : '<span class="ic k">' + esc((lab[x.k] || "Done").charAt(0)) + "</span>";
      return '<li style="animation-delay:' + Math.min(i, 12) * 0.04 + 's">' + ic + '<div class="li"><div class="s">' + esc(x.s) + (x.k === "close" && !x.noted ? '<span class="tag bad">add your note</span>' : "") + "</div>" +
        "<small>" + esc(lab[x.k] || "Done") + (x.at ? " · " + esc(x.at) : "") + (x.g ? " · " + esc(x.g) : "") + "</small></div></li>";
    }).join("");
    return '<div class="card"><div class="ch"><h2>What you have achieved today</h2><span class="n">' + a.length + "</span></div>" +
      (a.length ? '<ul class="list">' + items + "</ul>" : '<div class="empty">Nothing closed yet today. Your first close shows here, with your note.</div>') + "</div>";
  }
  /* The day's list (27 Oct 2026): set by the system when you check in; each ticks itself when closed in Salesforce. */
  function listCard(m) {
    var l = m.list; if (!l) return "";
    var done = l.filter(function (x) { return x.done; }).length;
    if (!l.length) return '<div class="card"><div class="ch"><h2>Your list today</h2></div><div class="empty">' + (m.listSet ? "Your list is clear." : "Nothing to set yet: nothing is overdue or due today.") + "</div></div>";
    return '<div class="card" id="list"><div class="ch"><h2>Your list today</h2><span class="n">' + (m.listSet ? done + " of " + l.length + " done" : "set when you check in") + '</span></div><ul class="list">' + l.map(function (x, i) {
      var card = m.types && !x.done && x.id, s = card ? esc(x.s) : x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.s) + "</a>" : esc(x.s);
      return '<li class="' + (card ? "tk" : "") + '"' + (card ? ' data-id="' + esc(x.id) + '" data-url="' + esc(x.url || "") + '"' : "") + ' style="animation-delay:' + i * 0.03 + 's"><span class="ic ' + (x.done ? "" : "todo") + '">' + (x.done ? "&#10003;" : "&#9675;") + '</span><div class="li"><div class="s' + (x.done ? " done" : "") + '"' + (card ? ' data-open role="button" tabindex="0"' : "") + ">" + s + "</div><small>" +
        (x.done ? "Closed today" : card ? "Tap it: what to do, a note, and Close, Move or Note from here" : "Open it in Salesforce, do it, note it in the client's words, close it") + (x.ty && x.ty !== "Untyped" ? " · " + esc(tyName(x.ty)) : "") + "</small></div>" + (card ? '<div class="tc" hidden></div>' : "") + "</li>";
    }).join("") + "</ul></div>";
  }
  function nextCard(m) {
    var on = {}, hasList = !!(m.list && m.list.length); (m.list || []).forEach(function (x) { if (x.id) on[x.id] = 1; });
    var n = (m.next || []).filter(function (x) { return !(x.id && on[x.id]); });
    if (hasList && !n.length) return "";
    if (hasList) return '<div class="card"><div class="ch"><h2>Also overdue or due</h2><span class="n">oldest first</span></div><ul class="list">' + n.map(taskLi(m)).join("") + "</ul></div>";
    if (!n.length) return '<div class="card"><div class="ch"><h2>' + (m.waiting ? "Your own tasks today" : "Next up") + '</h2></div><div class="empty">Nothing overdue or due today. Well done.</div></div>';

      '<button type="button" class="cai" data-cact="draft">&#10024; Draft with Claude</button>' +
      '<label class="dt">Or it cannot be done today: the new date<input type="date" data-to min="' + esc(c.min || "") + '"></label>' +
      '<div class="cbt"><button type="button" class="c" data-cact="close">Close now</button><button type="button" class="m" data-cact="move">Move now</button><button type="button" class="n" data-cact="note">Post note</button></div>' +
      '<div class="cst">Close now, Move now or Post note: it is done at once, with your note on Chatter.</div>' + (url ? '<a class="sf" href="' + esc(url) + '" target="_blank" rel="noopener">Open in Salesforce &#8599;</a>' : "");
  }
  function openCard(li) {
    var tc = li.querySelector(".tc"); if (!tc) return;
    if (!tc.hidden) { if (!tc.querySelector("textarea") || !tc.querySelector("textarea").value) { tc.hidden = true; li.classList.remove("open"); } else tc.querySelector("textarea").focus(); return; }
    tc.hidden = false; li.classList.add("open");
    if (tc.getAttribute("data-loaded")) return;
    tc.innerHTML = '<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div>';
    api({ act: "card", sub: "open", id: li.getAttribute("data-id") }).then(function (c) {
      if (!c || !c.ok) { tc.innerHTML = '<div class="cst bad">' + esc((c && c.error) || "That did not open.") + "</div>"; return; }
      tc.setAttribute("data-loaded", "1"); tc.innerHTML = cardHtml(c, li.getAttribute("data-url"));
    }).catch(function () { tc.innerHTML = '<div class="cst bad">That did not reach the tracker. Tap the task again.</div>'; });
  }
  function blankSel(ta) { var i = ta.value.indexOf("["); ta.focus(); if (i > -1) { var j = ta.value.indexOf("]", i); try { ta.setSelectionRange(i, j > i ? j + 1 : i); } catch (e) {} } }
  function cardAct(btn) {
    var tc = btn.closest(".tc"), li = btn.closest("li.tk"), ta = tc.querySelector("[data-note]"), to = tc.querySelector("[data-to]"), st = tc.querySelector(".cst"), act = btn.getAttribute("data-cact");
    var bs = tc.querySelectorAll(".cbt button,.cai"), on = function (v) { for (var i = 0; i < bs.length; i++) bs[i].disabled = !v; };
    if (act !== "draft" && !(ta.value || "").trim()) { st.className = "cst bad"; st.textContent = act === "close" ? "Say what was done first, in the note." : act === "move" ? "Say why the date moves, in the note." : "Write the note first."; ta.focus(); return; }
    if (act === "move" && !to.value) { st.className = "cst bad"; st.textContent = "Choose the new date first."; try { to.focus(); if (to.showPicker) to.showPicker(); } catch (e) {} return; }
    on(false); st.className = "cst"; st.textContent = act === "draft" ? "Claude is writing the note…" : "Saving…";
    api({ act: "card", sub: act, id: li.getAttribute("data-id"), note: ta.value, to: to.value }).then(function (r) {
      on(true); r = r || {};
      if (!r.ok) { st.className = "cst bad"; st.textContent = r.error || "That did not save."; return; }
      if (act === "draft") { ta.value = r.note || ta.value; st.className = "cst" + (r.warn ? " bad" : ""); st.textContent = r.warn || "Claude's note is in the box: check it, fill any [blanks], then Close now, Move now or Post note."; if (/\[/.test(ta.value)) blankSel(ta); return; }
      ta.value = ""; ta.defaultValue = ""; if (to) to.value = ""; st.className = "cst ok"; st.textContent = "\u2713 " + (r.msg || "Saved");
      if (r.act === "close" || r.act === "move") {
        var ic = li.querySelector(".ic"); if (ic) { ic.className = "ic"; ic.innerHTML = "&#10003;"; }
        var sx = li.querySelector(".li .s"); if (sx && r.act === "close") sx.classList.add("done");
        var sm = li.querySelector(".li small"); if (sm) sm.textContent = r.msg || "";
        setTimeout(function () { tc.hidden = true; li.classList.remove("open"); load(true); }, 1400);
        toast(r.msg || "Saved.");
      }
    }).catch(function () { on(true); st.className = "cst bad"; st.textContent = "That did not reach the tracker. Try again."; });
  }
  function scrub(btn) {
    var ta = $("scrubt"), res = $("scrubres"), lines = (ta.value || "").trim();
    if (!lines) { ta.focus(); toast("Write what came up first: one a line."); return; }
    btn.disabled = true; btn.textContent = "Adding…";
    api({ act: "scrub", lines: lines, type: $("scrubty").value }).then(function (r) {
      btn.disabled = false; btn.textContent = "Add";
      if (!r || !r.ok) { toast((r && r.error) || "That did not add. Try again."); return; }
      ta.value = ""; res.innerHTML = r.out.map(function (o) { return '<div class="' + (o.ok ? "" : "bad") + '">' + (o.ok ? "&#10003; " : "&#9888; ") + esc(o.s) + " · <b>" + esc(o.res) + "</b></div>"; }).join("");
      toast(r.out.filter(function (o) { return o.ok; }).length + " added to your day."); setTimeout(function () { load(true); }, 1200);
    }).catch(function () { btn.disabled = false; btn.textContent = "Add"; toast("That did not reach the tracker. Try again."); });
  }
  function closeFormHtml(f) {
    var radios = function (name, vals, sel, attr) { return '<div class="seg">' + vals.map(function (v) { return '<label><input type="radio" name="' + esc(name) + '" value="' + esc(v[0]) + '"' + (sel === v[0] ? " checked" : "") + (attr || "") + "><span>" + esc(v[1]) + "</span></label>"; }).join("") + "</div>"; };
    var h = '<div id="closeform"><div class="grp done"><h3>What you set out to do' + (f.done.length + f.open.length ? " · " + f.done.length + " of " + (f.done.length + f.open.length) + " done" : "") + "</h3>" +
      (f.done.length ? f.done.map(function (x) { return "<div>&#10003; " + esc(x) + "</div>"; }).join("") : '<div class="tip">Nothing closed from it yet.</div>') + "</div>";
    if (f.open.length) h += '<div class="grp"><h3>Not done: a reason and a new date</h3><div class="tip">The new date goes on the task in Salesforce, the reason on its Chatter.</div>' + f.open.map(function (t) {
      return '<div class="it"><div class="s">' + esc(t.s) + '</div><input type="text" data-r="' + esc(t.id) + '" value="' + esc(t.r) + '" placeholder="Not done because..."><label class="tip">New date<input type="date" data-d="' + esc(t.id) + '" min="' + esc(f.min) + '" value="' + esc(t.d) + '"></label></div>'; }).join("") + "</div>";
    if (f.checks.length) h += '<div class="grp"><h3>The checks</h3>' + f.checks.map(function (c) {
      var not = !c.done && c.r;
      return '<div class="it"><div class="s">' + esc(c.s) + "</div>" + radios("c_" + c.id, [["Done", "Done"], ["Not done", "Not done"]], c.done ? "Done" : not ? "Not done" : "", ' data-chk="' + esc(c.id) + '"') +
        '<input type="text" data-cr="' + esc(c.id) + '" value="' + esc(c.r) + '" placeholder="What is left, and why"' + (not ? "" : " hidden") + "></div>"; }).join("") + "</div>";
    var mb = f.mailbag;
    if (mb) h += '<div class="grp"><h3>The mailbag' + (mb.router ? " · you route it this week" : " · " + esc(mb.routerName) + " routes it this week") + "</h3>" +
      '<div class="tip">' + (mb.router ? esc(mb.n) + " collected today" + (mb.backlog ? " · <b>" + esc(mb.backlog) + " not yet sent</b>" : "") : "You collected <b>" + esc(mb.n) + "</b> document" + (mb.n === 1 ? "" : "s") + " today.") + "</div>" +
      radios("mb", mb.router ? [["Sent", "The " + mb.leaves + " bag went"], ["Not sent", "It did not go"]] : [["Handed over", "All handed to " + mb.routerName], ["Not handed over", "Some still with me"]], "", " data-mb") +
      '<select data-mbr hidden><option value="">Why?</option>' + (mb.reasons || []).map(function (r) { return '<option value="' + esc(r) + '">' + esc(r) + "</option>"; }).join("") + "</select>" +
      '<input type="text" data-mbn placeholder="' + (mb.router ? "Note: tracking number, courier, or what is still to go" : "Note") + '"></div>';
    if (f.inno) h += '<div class="grp"><h3>Innovation hour · what moved?</h3><textarea data-inno placeholder="What you built, tested or found, and the next step">' + esc(f.innoSaid) + "</textarea></div>";
    h += '<div class="grp"><h3>Comment for Mr Rampersad</h3><textarea data-comment placeholder="Anything he should know before tomorrow"></textarea></div>' +
      '<label class="out"><input type="checkbox" data-out checked> Sign me out now: this is the register</label>' +
      '<button type="button" class="go" data-closesend>Close my day and sign out</button><div class="cst" id="closest"></div></div>';
    return h;
  }
  function closeOpen() {
    var card = $("closecard"), body = $("closebody"); if (!card) return;
    card.scrollIntoView({ behavior: "smooth", block: "start" });
    if (!body || $("closeform")) return;
    body.innerHTML = '<div class="skel" style="width:50%"></div><div class="skel"></div><div class="skel" style="width:70%"></div>';
    api({ act: "closeform" }).then(function (r) {
      if (!r || !r.ok) { body.innerHTML = '<div class="cst bad">' + esc((r && r.error) || "The close-out did not open.") + '</div><button type="button" class="go" data-closego>Try again</button>'; return; }
      body.innerHTML = closeFormHtml(r.form);
    }).catch(function () { body.innerHTML = '<div class="cst bad">That did not reach the tracker.</div><button type="button" class="go" data-closego>Try again</button>'; });
  }
  function closeSend(btn) {
    var f = $("closeform"), st = $("closest"), q = { act: "close" }, missing = 0;
    Array.prototype.forEach.call(f.querySelectorAll("[data-r]"), function (i) { var id = i.getAttribute("data-r"), d = f.querySelector('[data-d="' + id + '"]'); q["r_" + id] = i.value.trim(); q["d_" + id] = d ? d.value : ""; if (!q["r_" + id] || !q["d_" + id]) missing++; });
    var names = {}; Array.prototype.forEach.call(f.querySelectorAll("[data-chk]"), function (i) { names[i.name] = i.getAttribute("data-chk"); });
    Object.keys(names).forEach(function (n) { var c = f.querySelector('input[name="' + n + '"]:checked'), id = names[n], cr = f.querySelector('[data-cr="' + id + '"]');
      if (!c) { missing++; return; } q[n] = c.value; q["cr_" + id] = cr ? cr.value.trim() : ""; if (c.value === "Not done" && !q["cr_" + id]) missing++; });
    var mb = f.querySelector('input[name="mb"]:checked');
    if (f.querySelector('input[name="mb"]')) { if (!mb) missing++; else { q.mb = mb.value; q.mbr = (f.querySelector("[data-mbr]") || {}).value || ""; q.mbn = (f.querySelector("[data-mbn]") || {}).value || ""; if (/Not/.test(mb.value) && !q.mbr) missing++; } }
    var inno = f.querySelector("[data-inno]"); if (inno) { q.inno = inno.value.trim(); if (!q.inno) missing++; }
    q.comment = (f.querySelector("[data-comment]") || {}).value || ""; if ((f.querySelector("[data-out]") || {}).checked) q.out = "1";
    if (missing) { st.className = "cst bad"; st.textContent = missing + " answer" + (missing === 1 ? " is" : "s are") + " missing: every task not done needs a reason and a new date, and every check an answer."; return; }
    btn.disabled = true; btn.textContent = "Closing your day…"; st.className = "cst"; st.textContent = "";
    api(q).then(function (m) {
      if (!m || !m.ok) { btn.disabled = false; btn.textContent = "Close my day and sign out"; st.className = "cst bad"; st.textContent = (m && m.error) || "That did not save. Try again."; return; }
      store.set("wd_day_" + WHO, { day: m.day, m: m }); draw(m, false); window.scrollTo({ top: 0, behavior: "smooth" });
      toast("Your day is closed." + (m.closed && m.closed.out ? " Signed out at " + m.closed.out + "." : ""));
    }).catch(function () { btn.disabled = false; btn.textContent = "Close my day and sign out"; st.className = "cst bad"; st.textContent = "That did not reach the tracker. Try again."; });
  }
  function signOut(btn) {
    btn.disabled = true; btn.textContent = "Checking out…";
    api({ act: "signout" }).then(function (m) {
      if (!m || !m.ok) { btn.disabled = false; btn.textContent = "Check out"; toast((m && m.error) || "That did not sign you out."); return; }
      store.set("wd_day_" + WHO, { day: m.day, m: m }); draw(m, false); toast("Checked out" + (m.signedOut ? " at " + m.signedOut : "") + ". Thank you.");
    }).catch(function () { btn.disabled = false; btn.textContent = "Check out"; toast("That did not reach the tracker. Try again."); });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : null; if (!t) return;
    var b;
    if ((b = t.closest("[data-more]"))) { Array.prototype.forEach.call(document.querySelectorAll("#waiting .more"), function (x) { x.hidden = false; }); b.remove(); return; }
    if ((b = t.closest("[data-open]"))) { openCard(b.closest("li.tk")); return; }
    if ((b = t.closest("[data-tpl]"))) { var tc = b.closest(".tc"), ta = tc.querySelector("[data-note]"), to = tc.querySelector("[data-to]"); ta.value = b.getAttribute("data-n");
      if (b.getAttribute("data-a") === "move" && to) { try { to.focus(); if (to.showPicker) to.showPicker(); } catch (x) {} } blankSel(ta); return; }
    if ((b = t.closest("[data-cact]"))) { cardAct(b); return; }
    if ((b = t.closest("[data-scrub]"))) { scrub(b); return; }
    if ((b = t.closest("[data-closego]"))) { closeOpen(); return; }
    if ((b = t.closest("[data-closesend]"))) { closeSend(b); return; }
    if ((b = t.closest("[data-signout]"))) { signOut(b); return; }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && e.target.hasAttribute && e.target.hasAttribute("data-open")) { e.preventDefault(); openCard(e.target.closest("li.tk")); } });
  document.addEventListener("change", function (e) {
    var t = e.target; if (!t || !t.closest) return;
    if (t.hasAttribute("data-chk")) { var cr = t.closest(".it").querySelector("[data-cr]"); if (cr) cr.hidden = t.value !== "Not done"; }
    if (t.hasAttribute("data-mb")) { var s2 = t.closest(".grp").querySelector("[data-mbr]"); if (s2) s2.hidden = !/Not/.test(t.value); }
  });
})();
</script>
</body>
</html>
