<style>

  /* My workday (23 October 2026): one fast page for everyone. The page is static and opens at once with the last
     copy this phone saw; the day itself comes from the tracker as JSON (wd=) and is drawn with motion. The colours
     are the branch's day pages: cream, navy, green for on pace, amber for behind, red for what needs you. */
  :root{
    --bg:#F7F5EF; --card:#FFFFFF; --ink:#1F2433; --navy:#141C4A; --muted:#6A7180; --line:#E7E2D6; --track:#ECE7DA;
    --good:#2C7A57; --good2:#3E9C72; --warn:#C26A04; --bad:#C8402F; --gold:#E3B23C; --soft:#F3F0E7;
    --shadow:0 1px 2px rgba(20,28,74,.05),0 8px 24px rgba(20,28,74,.06);
    --r:16px; --ease:cubic-bezier(.16,1,.3,1);
    --fd:'Plus Jakarta Sans', 'Plus Jakarta Sans Fallback', 'Plus Jakarta Sans Fallback R',Inter, 'Inter Fallback', 'Inter Fallback R',system-ui,sans-serif; --fb:Inter, 'Inter Fallback', 'Inter Fallback R',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0F1326; --card:#171C35; --ink:#E9ECF6; --navy:#E9ECF6; --muted:#9AA2BC; --line:#2A3152; --track:#262D4C;
    --good:#3FB27F; --good2:#5CC796; --warn:#E39A3B; --bad:#EE6B5B; --gold:#E8BE55; --soft:#1D2340;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); } }
  :root[data-theme="dark"]{
    --bg:#0F1326; --card:#171C35; --ink:#E9ECF6; --navy:#E9ECF6; --muted:#9AA2BC; --line:#2A3152; --track:#262D4C;
    --good:#3FB27F; --good2:#5CC796; --warn:#E39A3B; --bad:#EE6B5B; --gold:#E8BE55; --soft:#1D2340;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow-x:hidden}
  a{color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .eyebrow{font:800 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  header.top{padding:18px 0 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  h1{font:800 clamp(22px,6vw,28px)/1.15 var(--fd);margin:6px 0 2px;color:var(--navy);letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px}
  .clock{font:700 13px/1 var(--fd);color:var(--muted);white-space:nowrap;text-align:right}
  .clock b{display:block;font-size:22px;color:var(--navy);margin-bottom:4px;font-variant-numeric:tabular-nums}

  /* The progress bar, across the top and kept there. */
  .prog{position:sticky;top:0;z-index:5;margin:10px -16px 14px;padding:12px 16px 12px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);
        backdrop-filter:saturate(1.3) blur(8px);-webkit-backdrop-filter:saturate(1.3) blur(8px);border-bottom:1px solid transparent;transition:border-color .3s}
  .prog.stuck{border-bottom-color:var(--line)}
  .prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pct{font:800 clamp(30px,9vw,40px)/1 var(--fd);color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .pct small{font-size:.45em;color:var(--muted);font-weight:700;margin-left:2px}
  .of{font:700 13.5px/1.3 var(--fb);color:var(--muted);text-align:right}
  .of b{color:var(--ink)}
  .bar{position:relative;height:16px;border-radius:10px;background:var(--track);margin:10px 0 6px;overflow:visible}
  .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:10px;background:linear-gradient(90deg,var(--good),var(--good2));transition:width 1.4s var(--ease),background .4s}
  .fill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:sheen 2.6s linear infinite}
  .fill2{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:0 10px 10px 0;background:var(--good);opacity:.38;transition:left 1.4s var(--ease),width 1.4s var(--ease)}
  .sys{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
  .sys b{color:var(--ink)}
  .wt{padding:12px 0;border-top:1px solid var(--line);max-height:900px} .wt:first-of-type{border-top:0}
  .wt .who{font:800 14.5px/1.3 var(--fd);color:var(--navy);overflow-wrap:anywhere} .wt .who span{font:600 13px/1.3 var(--fb);color:var(--muted)}
  .wt .said{color:var(--muted);font-size:13.5px;margin:3px 0 0;font-style:italic;overflow-wrap:anywhere}
  .wt .rd{font-size:13px;background:var(--soft);border-radius:10px;padding:7px 10px;margin:8px 0 6px;overflow-wrap:anywhere}
  .wt .rd b{color:var(--navy)}
  .wt textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:15px/1.45 var(--fb);color:var(--ink);background:var(--card);resize:vertical}
  .wt textarea:focus{outline:none;border-color:var(--good)}
  .wt .act{display:flex;gap:8px;align-items:center;margin-top:8px}
  .wt .act select{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font:600 14px var(--fb);background:var(--card);color:var(--ink)}
  .wt .act .go{margin:0;width:auto;flex:none;padding:0 22px}
  .wt.gone{transition:opacity .4s,max-height .5s,padding .5s;opacity:0;max-height:0!important;overflow:hidden;padding:0}
  .prog.behind .fill{background:linear-gradient(90deg,var(--warn),#D98A2B)}
  .prog.far .fill{background:linear-gradient(90deg,var(--bad),#DB6A55)}
  .now{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--navy);left:0;transition:left 1.4s var(--ease);opacity:.85}
  .mk{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--navy);opacity:.85;vertical-align:-1px;margin-right:5px}
  .pace{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .pace b{color:var(--ink)}
  @keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
  .chip{font:700 12px/1 var(--fb);padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .chip b{color:var(--ink);margin-right:3px}
  .chip.bad b{color:var(--bad)} .chip.good b{color:var(--good)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow);
        opacity:0;transform:translateY(10px);animation:rise .6s var(--ease) forwards}
  .card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}.card:nth-of-type(4){animation-delay:.18s}.card:nth-of-type(5){animation-delay:.24s}
  @keyframes rise{to{opacity:1;transform:none}}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .ch h2{font:800 16px/1.2 var(--fd);margin:0;color:var(--navy)}
  .ch .n{font:700 12px/1 var(--fb);color:var(--muted)}

  .ci{display:flex;align-items:center;gap:14px}
  .dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--good);font:800 20px/1 var(--fd)}
  .dot.late{color:var(--warn)} .dot.out{color:var(--bad)}
  .ci .t{font:800 18px/1.2 var(--fd);color:var(--navy)} .ci .s{color:var(--muted);font-size:13.5px}
  button,.btn{appearance:none;border:0;cursor:pointer;font:800 15px/1 var(--fd);border-radius:12px;padding:15px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
  .go{width:100%;background:var(--navy);color:var(--bg);margin-top:12px;transition:transform .15s,opacity .2s}
  :root[data-theme="dark"] .go{background:var(--gold);color:#141C4A}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .go{background:var(--gold);color:#141C4A} }
  .go:active{transform:scale(.98)} .go[disabled]{opacity:.6}
  .ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}

  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);opacity:0;transform:translateX(-6px);animation:slide .45s var(--ease) forwards}
  ul.list li:first-child{border-top:0}
  @keyframes slide{to{opacity:1;transform:none}}
  .ic{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:800 13px/1 var(--fd);background:var(--soft);color:var(--good);margin-top:1px}
  .ic.no{color:var(--bad)} .ic.late{color:var(--bad)} .ic.due{color:var(--warn)} .ic.k{color:var(--navy)}
  .li{flex:1;min-width:0}
  .li .s{overflow-wrap:anywhere}
  .li small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .tag{display:inline-block;font:800 10.5px/1 var(--fb);letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:1px}
  .tag.bad{color:var(--bad)}
  .empty{color:var(--muted);font-size:14px;padding:4px 0}

  .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:132px;padding-top:18px}
  .bcol{display:flex;flex-direction:column;align-items:center;height:100%;gap:6px;min-width:0}
  .bt{flex:1;width:100%;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-height:0}
  .bv{flex:none;font:800 13px/1 var(--fd);color:var(--navy);font-variant-numeric:tabular-nums}
  .bb{flex:none;width:100%;max-height:calc(100% - 18px);border-radius:9px 9px 4px 4px;background:var(--track);height:0;transition:height 1.1s var(--ease)}
  .bcol.today .bb{background:linear-gradient(180deg,var(--good2),var(--good))}
  .bl{font:700 11.5px/1 var(--fb);color:var(--muted)}
  .bcol.today .bl{color:var(--navy)}

  .team .row{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .team .row:first-child{border-top:0}
  .team .nm{font:800 14px/1.2 var(--fd);color:var(--navy)} .team .nm small{display:block;font:500 11.5px/1.3 var(--fb);color:var(--muted)}
  .mini{position:relative;height:10px;border-radius:6px;background:var(--track);overflow:hidden}
  .mini i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:var(--good);transition:width 1.2s var(--ease)}
  .mini i.behind{background:var(--warn)} .mini i.far{background:var(--bad)}
  .mini u{position:absolute;top:0;bottom:0;width:2px;background:var(--navy);opacity:.55;text-decoration:none}
  .team .v{font:700 12.5px/1.2 var(--fb);color:var(--muted);text-align:right;white-space:nowrap} .team .v b{color:var(--ink)}

  .foot{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
  .foot .go{margin:0}
  .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-top:6px}
  .meta a{font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:13.5px}
  .notice.bad{border-left-color:var(--bad)}
  .skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--track),var(--soft),var(--track));background-size:200% 100%;animation:sheen 1.4s linear infinite;margin:8px 0}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--navy);color:var(--bg);padding:11px 16px;border-radius:12px;font:700 14px/1.3 var(--fb);transition:.35s var(--ease);z-index:9;max-width:calc(100% - 32px);text-align:center}
  .toast.on{transform:translate(-50%,0);opacity:1}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .card,ul.list li{opacity:1;transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Ricky Rampersad Branch · My workday</div>
      <h1 id="hello">Your day</h1>
      <div class="sub" id="when">&nbsp;</div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span id="hours">&nbsp;</span></div>
  </header>

  <section class="prog" id="prog" aria-label="Your progress today">
    <div class="row">
      <div class="pct" id="pct">0<small>%</small></div>
      <div class="of" id="of">Opening your day…</div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <div class="fill" id="fill"></div>
      <div class="fill2" id="fill2"></div>
      <div class="now" id="nowm" title="Where the working day is now"></div>
    </div>
    <div class="pace" id="pace">&nbsp;</div>
  </section>

  <div id="notice"></div>
  <div class="chips" id="chips"></div>
  <div class="sys" id="sys"></div>
  <main id="main">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>
  </main>
  <div class="meta"><span id="asat">&nbsp;</span><a id="refresh" role="button" tabindex="0">Refresh</a></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  // The tracker's web app: the same one the walls read. ?api= points it elsewhere for a test.
  var TRACKER = "https://script.google.com/macros/s/AKfycbzb9gzh3TldhLCQA7MCz3vdyWLAWTHpR9X7M3uvPNtqJbnnYRMcDSkm0D1C8SgENvn44g/exec";
  var Q = new URLSearchParams(location.search);
  if (Q.get("api") && /^https:\/\/script\.google\.com\/|^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(Q.get("api"))) TRACKER = Q.get("api");
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // The link carries who you are and your key. Opened from the home screen without them, the last link on this phone is used.
  var P = Q.get("p") || "", K = Q.get("k") || "";
  if (P && K) store.set("wd_link", { p: P, k: K }); else { var last = store.get("wd_link"); if (last) { P = last.p; K = last.k; } }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var M = null, busy = false;

  function tick() {
    var d = new Date();
    try { $("clock").textContent = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/Port_of_Spain" }); }
    catch (e) { $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  }
  tick(); setInterval(tick, 15000);
  var prog = $("prog");
  window.addEventListener("scroll", function () { prog.classList.toggle("stuck", window.scrollY > 8); }, { passive: true });

  function toast(t) { var e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("on"); }, 3200); }
  function notice(html, bad) { $("notice").innerHTML = html ? '<div class="notice' + (bad ? " bad" : "") + '">' + html + "</div>" : ""; }
  function countUp(el, to) {
    var from = Number(el.getAttribute("data-v") || 0), t0 = performance.now(), dur = 1100;
    el.setAttribute("data-v", to);
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { el.innerHTML = to + "<small>%</small>"; return; }
    (function step(t) { var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.innerHTML = Math.round(from + (to - from) * e) + "<small>%</small>"; if (k < 1) requestAnimationFrame(step); })(t0);
  }
  function greet(first) { var h = Number(new Date().toLocaleString("en-US", { hour: "numeric", hour12: false, timeZone: "America/Port_of_Spain" })); return (h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + ", " + first; }

  function drawLead(m) {
    var g = m.progress || {}, t = Math.max(1, Number(g.target || 0)), pct = Math.max(0, Number(g.pct || 0)), day = Math.max(0, Math.min(100, Number(g.dayPct || 0)));
    var youW = Math.min(100, 100 * Number(g.you || 0) / t), teamW = Math.min(100 - youW, 100 * Number(g.team || 0) / t), gap = day - pct;
    prog.className = "prog" + (!g.target ? "" : gap > 25 ? " far behind" : gap > 0 ? " behind" : "") + (window.scrollY > 8 ? " stuck" : "");
    countUp($("pct"), pct);
    $("bar").setAttribute("aria-valuenow", String(Math.min(100, pct)));
    requestAnimationFrame(function () { $("fill").style.width = youW + "%"; $("fill2").style.left = youW + "%"; $("fill2").style.width = teamW + "%"; $("nowm").style.left = day + "%"; });
    $("of").innerHTML = g.target ? "<b>" + g.cleared + "</b> of <b>" + g.target + "</b> cleared today" : "Nothing waited on you today";
    var bits = ['<span><i class="mk" aria-hidden="true"></i><b>' + day + "%</b> of your day gone</span>",
      "<span>By you <b>" + (g.you || 0) + "</b> · by the team <b>" + (g.team || 0) + "</b></span>"];
    if (g.waiting) bits.push('<span><b style="color:var(--bad)">' + g.waiting + "</b> still waiting on you</span>");
    $("pace").innerHTML = bits.join("");
    var chips = [];
    chips.push('<span class="chip' + (g.asks ? " bad" : "") + '"><b>' + (g.asks || 0) + "</b>staff waiting on your word</span>");
    chips.push('<span class="chip"><b>' + (g.inbox || 0) + "</b>inbox to act on</span>");
    chips.push('<span class="chip"><b>' + (g.mineDue || 0) + "</b>of your tasks for today</span>");
    chips.push('<span class="chip good"><b>' + (g.yourNotes || 0) + "</b>notes by you</span>");
    $("chips").innerHTML = chips.join("");
    var sys = g.sys || {}, ks = Object.keys(sys).sort(function (a, b) { return sys[b] - sys[a]; });
    $("sys").innerHTML = ks.length ? "Done for you by the system today: " + ks.map(function (k) { return "<b>" + sys[k] + "</b> " + esc(k); }).join(" · ") : "";
  }
  function drawProgress(m) {
    if (m.progress && m.progress.lead) return drawLead(m);
    $("fill2").style.width = "0"; $("sys").innerHTML = "";
    var g = m.progress || {}, pct = Math.max(0, Number(g.pct || 0)), day = Math.max(0, Math.min(100, Number(g.dayPct || 0)));
    var gap = day - pct, cls = !g.target ? "" : gap > 25 ? "far behind" : gap > 0 ? "behind" : "";
    prog.className = "prog" + (cls ? " " + cls : "") + (window.scrollY > 8 ? " stuck" : "");
    countUp($("pct"), pct);
    $("bar").setAttribute("aria-valuenow", String(Math.min(100, pct)));
    requestAnimationFrame(function () { $("fill").style.width = Math.min(100, pct) + "%"; $("nowm").style.left = day + "%"; });
    $("of").innerHTML = g.sf ? "<b>" + g.closed + "</b> of <b>" + g.target + "</b> closed today" : "Salesforce did not answer";
    var bits = [];
    bits.push('<span><i class="mk" aria-hidden="true"></i><b>' + day + "%</b> of your day gone</span>");
    if (g.sf && g.target) bits.push("<span>" + (gap > 0 ? "On pace for <b>" + g.proj + "</b>: " + (g.target - g.closed) + " to go" : g.closed >= g.target ? "<b>Today's number reached.</b> Keep going" : "Ahead of the day: on pace for <b>" + g.proj + "</b>") + "</span>");
    if (g.lastAt) bits.push("<span>Last entry <b>" + esc(g.lastAt) + "</b></span>");
    $("pace").innerHTML = bits.join("");
    var chips = [];
    if (g.sf) {
      chips.push('<span class="chip good"><b>' + g.noted + "</b>closed with your note</span>");
      if (g.unnoted) chips.push('<span class="chip bad"><b>' + g.unnoted + "</b>closed with no note</span>");
      chips.push('<span class="chip' + (g.overdue ? " bad" : "") + '"><b>' + g.overdue + "</b>overdue</span>");
      chips.push('<span class="chip"><b>' + g.dueToday + "</b>due today</span>");
      if (g.plan) chips.push('<span class="chip"><b>' + g.planDone + " of " + g.plan + "</b>of this morning's plan</span>");
    }
    $("chips").innerHTML = chips.join("");
  }

  function checkinCard(m) {
    var c = m.checkin || {}, absent = c.status === "absent";
    if (absent) return '<div class="card"><div class="ci"><div class="dot out">!</div><div><div class="t">Marked absent today</div><div class="s">' + esc(c.why || "No check-in by the time your day starts.") +
      "</div></div></div>" + '<button class="go" id="ci">Check in now</button><div class="s" style="color:var(--muted);font-size:12.5px;margin-top:8px">Checking in before noon brings back the work nobody has touched.</div></div>';
    if (!c.at) return '<div class="card"><div class="ci"><div class="dot">' + "&#9654;" + '</div><div><div class="t">Start your day</div><div class="s">Your day starts at ' + esc(m.start) + ". Checking in is the register.</div></div></div>" +
      '<button class="go" id="ci">Check in and start my day</button></div>';
    var late = Number(c.late || 0);
    return '<div class="card"><div class="ci"><div class="dot' + (late ? " late" : "") + '">&#10003;</div><div><div class="t">In at ' + esc(c.at) + (late ? " · " + late + " min late" : " · on time") + "</div>" +
      '<div class="s">Your day started at ' + esc(m.start) + (c.out ? " · signed out " + esc(c.out) : "") + "</div></div></div></div>";
  }
  // A first name from "Sasha Lalla-Jagassar" or "kamla.dookran@myguardiangroup.com".
  function firstOf(by) { var b = String(by || "").trim(); if (!b) return "Someone"; if (b.indexOf("@") > -1) b = b.split("@")[0].split(/[._-]/)[0]; b = b.split(/\s+/)[0]; return b.charAt(0).toUpperCase() + b.slice(1); }
  function waitingCard(m) {
    var w = m.waiting; if (!w) return "";
    if (!w.length) return '<div class="card"><div class="ch"><h2>Waiting on you</h2></div><div class="empty">Nobody is waiting on your word. Well done.</div></div>';
    var desks = m.desks || [];
    return '<div class="card" id="waiting"><div class="ch"><h2>Waiting on you</h2><span class="n">' + w.length + "</span></div>" + w.map(function (x) {
      var sel = x.k === "inbox" && desks.length ? '<select aria-label="Post to" data-to>' + desks.map(function (d) { return '<option value="' + esc(d.sid) + '"' + (d.sid === (x.to || "ricky") ? " selected" : "") + ">" + esc(d.first) + "</option>"; }).join("") + "</select>" : "";
      return '<div class="wt" data-k="' + esc(x.k) + '" data-id="' + esc(x.id) + '"><div class="who">' + esc(firstOf(x.by)) + " <span>· " + esc(x.s) + "</span></div>" +
        (x.said ? '<div class="said">"' + esc(x.said) + '"</div>' : "") +
        (x.read || x.next || x.done ? '<div class="rd">' + (x.done ? "<b>Done so far:</b> " + esc(x.done) + "<br>" : "") + (x.read ? "<b>Claude:</b> " + esc(x.read) : "") + (x.next ? (x.read ? "<br>" : "") + "<b>Next:</b> " + esc(x.next) : "") + "</div>" : "") +
        '<textarea aria-label="Your answer" placeholder="' + (x.draft ? "" : "Claude has not written this one yet. Type your answer.") + '">' + esc(x.draft || "") + "</textarea>" +
        '<div class="act">' + sel + '<button class="go" data-post>Post</button></div></div>';
    }).join("") + "</div>";
  }
  function achievedCard(m) {
    var a = m.achieved || [], lab = { close: "Closed", note: "Note", email: "E-mail", task: "Task", inbox: "Inbox", draft: "Note", move: "Moved" };
    var items = a.map(function (x, i) {
      var ic = x.k === "close" ? (x.noted ? '<span class="ic">&#10003;</span>' : '<span class="ic no">!</span>') : '<span class="ic k">' + esc((lab[x.k] || "Done").charAt(0)) + "</span>";
      return '<li style="animation-delay:' + Math.min(i, 12) * 0.04 + 's">' + ic + '<div class="li"><div class="s">' + esc(x.s) + (x.k === "close" && !x.noted ? '<span class="tag bad">add your note</span>' : "") + "</div>" +
        "<small>" + esc(lab[x.k] || "Done") + (x.at ? " · " + esc(x.at) : "") + (x.g ? " · " + esc(x.g) : "") + "</small></div></li>";
    }).join("");
    return '<div class="card"><div class="ch"><h2>What you have achieved today</h2><span class="n">' + a.length + "</span></div>" +
      (a.length ? '<ul class="list">' + items + "</ul>" : '<div class="empty">Nothing closed yet today. Your first close shows here, with your note.</div>') + "</div>";
  }
  function nextCard(m) {
    var n = m.next || [];
    if (!n.length) return '<div class="card"><div class="ch"><h2>' + (m.waiting ? "Your own tasks today" : "Next up") + '</h2></div><div class="empty">Nothing overdue or due today. Well done.</div></div>';
    return '<div class="card"><div class="ch"><h2>' + (m.waiting ? "Your own tasks today" : "Next up") + '</h2><span class="n">oldest first</span></div><ul class="list">' + n.map(function (x, i) {
      var s = x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.s) + "</a>" : esc(x.s);
      return '<li style="animation-delay:' + i * 0.04 + 's"><span class="ic ' + (x.late ? "late" : "due") + '">' + (x.late ? "!" : "&#8226;") + '</span><div class="li"><div class="s">' + s + "</div><small>" +
        (x.late ? "Overdue since " + esc(x.due) : "Due today") + (x.ty && x.ty !== "Untyped" ? " · " + esc(x.ty) : "") + "</small></div></li>";
    }).join("") + "</ul></div>";
  }
  function barsCard(m) {
    var b = m.bars || []; if (!b.length) return "";
    var max = Math.max(1, Math.max.apply(null, b.map(function (x) { return Number(x.n || 0); })));
    return '<div class="card"><div class="ch"><h2>Your last five days</h2><span class="n">' + esc(m.barsLabel || "closed each day") + '</span></div><div class="bars">' + b.map(function (x, i) {
      var today = i === b.length - 1;
      return '<div class="bcol' + (today ? " today" : "") + '"><div class="bt"><div class="bv">' + (x.n == null ? "–" : x.n) + '</div><div class="bb" data-h="' + Math.round(100 * Number(x.n || 0) / max) + '"></div></div><div class="bl">' + (today ? "Today" : esc(x.l)) + "</div></div>";
    }).join("") + "</div></div>";
  }
  function teamCard(m) {
    var t = m.team || []; if (!t.length) return "";
    return '<div class="card team"><div class="ch"><h2>The team today</h2><span class="n">closed against the day</span></div>' + t.map(function (x) {
      var pct = Math.max(0, Number(x.pct || 0)), gap = Number(x.dayPct || 0) - pct, cls = x.target ? (gap > 25 ? "far" : gap > 0 ? "behind" : "") : "";
      return '<div class="row"><div class="nm">' + esc(x.name) + "<small>" + (x.absent ? "absent" : x.at ? "in " + esc(x.at) + (x.late ? ", late" : "") : "not in yet") + "</small></div>" +
        '<div class="mini"><i class="' + cls + '" data-w="' + Math.min(100, pct) + '"></i><u style="left:' + Math.min(100, Number(x.dayPct || 0)) + '%"></u></div>' +
        '<div class="v">' + (x.closed == null ? "–" : "<b>" + x.closed + "</b>/" + x.target) + "</div></div>";
    }).join("") + "</div>";
  }
  function footCard(m) {
    return '<div class="foot"><a class="btn go" href="' + esc(m.full) + '">' + esc(m.fullLabel || "Open my day page") + " &rarr;</a>" +
      '<div style="color:var(--muted);font-size:12.5px;text-align:center">Your drafts, your inbox with Claude\'s notes, and every task card are on your day page.</div></div>';
  }

  function draw(m, cached) {
    M = m;
    $("hello").textContent = greet(m.first || "");
    $("when").textContent = (m.date || "") + (m.hours ? " · " + m.hours : "");
    $("hours").textContent = m.lunch && m.lunch !== "Flexible" ? "lunch " + m.lunch : "";
    drawProgress(m);
    $("main").innerHTML = checkinCard(m) + waitingCard(m) + achievedCard(m) + nextCard(m) + barsCard(m) + teamCard(m) + footCard(m);
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(document.querySelectorAll(".bb"), function (e) { var t = e.parentNode.clientHeight - 18; e.style.height = Math.max(4, Math.round(t * Number(e.getAttribute("data-h") || 0) / 100)) + "px"; });
      Array.prototype.forEach.call(document.querySelectorAll(".mini i"), function (e) { e.style.width = e.getAttribute("data-w") + "%"; });
    });
    var ci = $("ci"); if (ci) ci.addEventListener("click", checkIn);
    $("asat").textContent = (cached ? "As at " : "Updated ") + (m.at || "") + (cached ? " · updating…" : "");
  }

  function fail(msg) {
    if (M) { notice(esc(msg) + ' <a href="#" id="again">Try again</a>', true); $("asat").textContent = "As at " + (M.at || ""); }
    else { notice(esc(msg) + ' <a href="#" id="again">Try again</a>', true); $("of").textContent = "Not opened"; $("main").innerHTML = ""; }
    var a = $("again"); if (a) a.addEventListener("click", function (e) { e.preventDefault(); load(); });
  }
  function load() {
    if (!P || !K) { notice("Open this page from the <b>My workday</b> link in your morning e-mail. After that it opens from your home screen.", false); $("of").textContent = ""; $("main").innerHTML = ""; return; }
    if (busy) return; busy = true;
    var ctl = window.AbortController ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    fetch(TRACKER + "?wd=" + encodeURIComponent(P) + "&k=" + encodeURIComponent(K) + "&t=" + Date.now(), { redirect: "follow", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (m) { clearTimeout(timer); busy = false; if (!m || !m.ok) { fail((m && m.error) || "The tracker did not answer."); return; } notice(""); store.set("wd_day_" + P, { day: m.day, m: m }); draw(m, false); })
      .catch(function () { clearTimeout(timer); busy = false; fail("The tracker did not answer this time."); });
  }
  function post(btn) {
    var row = btn.closest(".wt"), ta = row.querySelector("textarea"), sel = row.querySelector("select[data-to]"), text = (ta.value || "").trim();
    if (!text) { ta.focus(); toast("Write your answer first."); return; }
    btn.disabled = true; var was = btn.textContent; btn.textContent = "Posting…";
    var body = new URLSearchParams(); body.set("wd", P); body.set("k", K); body.set("act", "post"); body.set("kind", row.getAttribute("data-k")); body.set("id", row.getAttribute("data-id")); body.set("text", text);
    if (sel) body.set("to", sel.value);
    fetch(TRACKER, { method: "POST", body: body, redirect: "follow" })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.ok) { btn.disabled = false; btn.textContent = was; toast((r && r.error) || "That did not post. Try again."); return; }
        row.style.maxHeight = row.offsetHeight + "px"; requestAnimationFrame(function () { row.classList.add("gone"); });
        toast("Done: " + (r.res || "posted") + ".");
        setTimeout(load, 900);
      })
      .catch(function () { btn.disabled = false; btn.textContent = was; toast("That did not reach the tracker. Try again."); });
  }
  document.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest("[data-post]"); if (b) { e.preventDefault(); post(b); } });
  function checkIn(e) {
    var b = e.currentTarget; b.disabled = true; b.textContent = "Checking in…";
    var body = new URLSearchParams(); body.set("wd", P); body.set("k", K); body.set("act", "checkin");
    fetch(TRACKER, { method: "POST", body: body, redirect: "follow" })
      .then(function (r) { return r.json(); })
      .then(function (m) {
        if (!m || !m.ok) { b.disabled = false; b.textContent = "Check in and start my day"; toast((m && m.error) || "That did not record. Try again."); return; }
        store.set("wd_day_" + P, { day: m.day, m: m }); draw(m, false);
        toast(m.checkedIn && m.checkedIn.first === false ? "You were already in at " + m.checkedIn.at : "Checked in at " + (m.checkedIn ? m.checkedIn.at : m.at) + ". Have a good day.");
      })
      .catch(function () { b.disabled = false; b.textContent = "Check in and start my day"; toast("That did not reach the tracker. Try again."); });
  }

  // At once: the last copy this phone saw today, then the live day.
  var keep = P ? store.get("wd_day_" + P) : null, today = new Date().toLocaleDateString("en-CA", { timeZone: "America/Port_of_Spain" });
  if (keep && keep.m && keep.day === today) draw(keep.m, true);
  load();
  $("refresh").addEventListener("click", load);
  $("refresh").addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });
  setInterval(function () { if (document.visibilityState === "visible") load(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && M && Date.now() - (load.t || 0) > 60000) { load.t = Date.now(); load(); } });
})();
</script>
</body>
</html>
