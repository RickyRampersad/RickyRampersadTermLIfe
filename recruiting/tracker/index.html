<script>
/* ============================================================
   BRANCH HOSTING SHIM — Recruit Tracker v5.6 (build B5)
   Added when the tracker moved onto rickyrampersadbranch.com.

   The tracker was built for an environment that provides
   window.storage. A plain web host does not, and the app's own
   fallback is an in-memory Map — every candidate file would be
   lost on refresh. This backs window.storage with IndexedDB
   (falling back to localStorage), so files persist per browser.

   Nothing is uploaded. Candidate data never leaves this device.
   Use Export in the tracker to move a file to another machine.
   ============================================================ */
(function () {
  'use strict';
  if (window.storage && typeof window.storage.set === 'function') return;

  var DB = 'rrb-recruit-tracker', STORE = 'kv', VER = 1;
  var dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('no idb')); return; }
      var req = indexedDB.open(DB, VER);
      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb open failed')); };
    });
    return dbp;
  }

  function tx(mode, fn) {
    return open().then(function (d) {
      return new Promise(function (resolve, reject) {
        var t = d.transaction(STORE, mode);
        var req = fn(t.objectStore(STORE));
        t.oncomplete = function () { resolve(req && req.result); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error || new Error('aborted')); };
      });
    });
  }

  /* localStorage fallback — smaller ceiling, but better than losing work */
  var LS = {
    get: function (k) { try { var v = localStorage.getItem('rrb-rt:' + k); return v === null ? null : { value: v }; } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('rrb-rt:' + k, v); return true; } catch (e) { console.error('Storage full — export a backup and clear old candidates.', e); return false; } },
    del: function (k) { try { localStorage.removeItem('rrb-rt:' + k); return true; } catch (e) { return false; } }
  };

  window.storage = {
    get: function (key) {
      return tx('readonly', function (s) { return s.get(key); })
        .then(function (v) { return (v === undefined || v === null) ? null : { value: v }; })
        .catch(function () { return LS.get(key); });
    },
    set: function (key, value) {
      return tx('readwrite', function (s) { return s.put(value, key); })
        .then(function () { return true; })
        .catch(function () { return LS.set(key, value); });
    },
    'delete': function (key) {
      return tx('readwrite', function (s) { return s['delete'](key); })
        .then(function () { return true; })
        .catch(function () { return LS.del(key); });
    }
  };

  /* The AI drill-down calls the Anthropic API directly with no key — that only
     works inside the environment this app was authored in. On the branch site
     the browser blocks it, so give the manager a sentence they can act on
     instead of a raw network error. */
  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('api.anthropic.com') > -1) {
      return Promise.resolve(new Response(
        'The AI drill-down is not available on the branch website — it needs the environment the tracker was built in. ' +
        'Everything else in the tracker works normally: read the POP 7.0 report yourself and use the score-driven ' +
        'question bank on this screen, which is the same content the drill-down summarises.',
        { status: 503, statusText: 'AI unavailable on branch hosting' }
      ));
    }
    return realFetch(input, init);
  };
})();

ing cadence (weekly minimum)","Set first review date"]},{id:"s1_2",title:'Read & discuss "A Sales Representative\'s Week"',duration:"45 min",items:["Candidate has read Part 1 of Candidate Module","Discussed daily activity rhythm","Discussed working evenings and weekends","Discussed self-management requirements","Discussed income variability in early months"]},{id:"s1_3",title:'Activity: "Is This Career for You?" Check Yourself',duration:"30 min",items:["Candidate completed self-assessment","Reviewed answers together","Discussed any red flags or hesitations","Documented candidate's honest reaction"]},{id:"s1_4",title:"7 Activities / 9 Skills review",duration:"30 min",items:["Walked through the 7 core activities","Walked through the 9 required skills","Asked candidate to rate own confidence per skill","Identified top 2 skill gaps"]}]},{id:"m2",title:"Identifying Markets",accent:"#7c3aed",pages:"Manager's Guide pp. 14–18",objective:"Candidate learns that markets are people, not abstract segments. They begin building their natural market list and start Project 100.",managerPrep:["Have Candidate Module Part 2 ready","Have a blank Project 100 form available","Bring examples of your own Project 100 from when you started"],sessions:[{id:"s2_1",title:'Read "Markets Are People"',duration:"30 min",items:["Candidate read Part 2 of Candidate Module","Discussed the concept of natural market","Discussed centers of influence","Discussed why people buy from people they know"]},{id:"s2_2",title:"Market Identification activity",duration:"60 min",items:["Candidate listed 15 source categories","Identified at least 50 potential names","Categorised each name by relationship type","Reviewed list together for completeness"]},{id:"s2_3",title:"Begin Project 100",duration:"60 min",items:["Candidate started Project 100 form","At least 50 names entered","Each name has age band, occupation, marital status","Each name has approachability assessment","Discussed how Project 100 feeds Source Market Surveys"]},{id:"s2_4",title:"Discussion Conference: questions/observations",duration:"30 min",items:["Candidate raised questions on prospecting","Addressed any objections from candidate's family","Confirmed comfort with using personal network","Set Project 100 completion date"]}]},{id:"m3",title:"Meeting Your Marketplace",accent:"#0891b2",pages:"Manager's Guide pp. 19–24",objective:"Candidate moves from theory to action. They contact prospects from their list and run Source Market Surveys — the first real test of their willingness to do the work.",managerPrep:["Have Candidate Module Part 3 ready","Have Source Market Survey form digital link ready","Have Meeting Your Marketplace Interview Guide ready","Schedule role-play time"],sessions:[{id:"s3_1",title:'Read "The Business and the Customer"',duration:"30 min",items:["Candidate read Part 3 of Candidate Module","Discussed customer perspective","Discussed why people resist insurance conversations","Discussed how to neutralise resistance"]},{id:"s3_2",title:"Telephone approach role-play",duration:"60 min",items:["Manager demonstrated phone approach","Candidate practiced 5+ times","Recorded one practice for review","Identified specific phrasing improvements"]},{id:"s3_3",title:"Source Market Surveys — execute",duration:"Self-paced over 1–2 weeks",items:["Candidate completed 10+ surveys","Surveys averaged 50+ score (quality threshold)","No more than 2 surveys with score < 20","All surveys submitted via Jotform","RM reviewed each survey for completeness"]},{id:"s3_4",title:"Discussion Conference: what we learned",duration:"45 min",items:["Reviewed survey patterns together","Identified strongest segments","Identified candidate's natural style","Captured the 5 best prospects for follow-up"]}]},{id:"m4",title:"Making a Sales Presentation",accent:"#059669",pages:"Manager's Guide pp. 25–33",objective:"Candidate observes and then performs basic sales presentations. This is the critical reality test — does the candidate freeze, perform, or thrive?",managerPrep:["Have Candidate Module Part 4 ready","Schedule 2+ joint field calls","Have a junior product to use for demo (life coverage)","Have feedback rubric ready"],sessions:[{id:"s4_1",title:'Read "What Do I Say? What Do I Do?"',duration:"45 min",items:["Candidate read Part 4 of Candidate Module","Discussed the basic sales talk","Discussed handling common objections","Discussed closing language"]},{id:"s4_2",title:"Sales talk practice (role-play)",duration:"90 min",items:["Candidate practiced opening 5+ times","Candidate practiced needs analysis 5+ times","Candidate practiced closing 5+ times","Manager scored each practice","Captured specific coaching points"]},{id:"s4_3",title:"Joint field calls (observation)",duration:"2–3 hours total",items:["Joint call #1 completed (candidate observed)","Joint call #2 completed (candidate observed)","Joint call #3 completed (candidate participated)","Debrief held after each call","Candidate captured their own observations"]},{id:"s4_4",title:"Discussion Conference: career decision",duration:"60 min",items:["Candidate reflected on field call experience","Discussed energy level after each call","Discussed reaction to rejection","Discussed reaction to closed sale","Confirmed candidate's career intent"]}]},{id:"m5",title:"Making a Career Decision",accent:"#d97706",pages:"Manager's Guide p. 34",objective:"Candidate makes a deliberate, informed decision: pursue this career or step away. The Income Potential Analysis is the financial reality check.",managerPrep:["Have Income Potential Analysis spreadsheet ready","Have candidate's Personal & Financial Statement","Block 90 minutes for this conversation — do not rush"],sessions:[{id:"s5_1",title:"Income Potential Analysis review",duration:"60 min",items:["Candidate completed Income Potential Analysis","Reviewed Year 1 / Year 2 / Year 3 projections","Discussed income runway needed (6 months minimum)","Discussed family financial obligations","Confirmed runway is in place or has plan"]},{id:"s5_2",title:"Career decision conversation",duration:"60 min",items:["Candidate stated decision (proceed / decline / hold)","Decision documented in writing","If proceed — set Selection File timeline","If decline — captured reason for branch records","If hold — set re-engagement date"]}]},{id:"m6",title:"Discovery Marketing Plan",accent:"#dc2626",pages:"Manager's Guide p. 35",objective:"Candidate produces their Discovery Marketing Plan — the document the BM uses to evaluate readiness for selection.",managerPrep:["Have Discovery Marketing Plan template ready","Have Discovery Summary Evaluation form ready","Schedule BM presentation slot"],sessions:[{id:"s6_1",title:"Build Discovery Marketing Plan",duration:"90 min",items:["Source markets ranked by quality","Project 100 finalised","First 30-day prospecting plan written","First 30-day income target set","Joint field call schedule for first 60 days"]},{id:"s6_2",title:"Discovery Summary Evaluation (Form 11)",duration:"45 min",items:["RM completed all 10 evaluation items","Scores discussed with candidate","Strengths and gaps documented","Coaching plan for first 90 days drafted","Form signed and dated"]},{id:"s6_3",title:"BM review meeting",duration:"45 min",items:["BM reviewed Marketing Plan","BM reviewed Discovery Summary Evaluation","BM met candidate (if not done already)","BM decision: proceed to Selection File / Hold / Decline","Decision documented"]}]}],MG_TEACHING_NOTES={s1_1:{managerScript:"Open by reframing what Discovery is. Most candidates think it's training — it isn't. Discovery is a structured \"test drive\" of the sales career so they can decide whether it suits them, and so you can decide whether they suit it. Tell them: \"Over the next 4–6 weeks you will observe, read, practice, and produce. Some of what you do you will enjoy. Some you won't. Both reactions are useful information.\" Set the cadence: weekly minimum, more often during prospecting and presentation modules. Confirm GGLDC access today — if it isn't working, fix it before they leave the room. Set the first three meeting dates on their calendar before this session ends.",recruitContent:'You\'re embarking on a short program of Discovery that will make your decision about becoming a sales representative for insurance and other financial products much easier. Research reveals that when candidates have a good understanding of what the sales representative career entails, they have a much better chance of making the right career decision — and if they choose to become sales representatives, they have a much greater likelihood of success. Discovery allows you to "test drive" the career through readings and activities. You will learn about, observe, and actually perform both enjoyable and not-so-enjoyable aspects of the role. By the time you complete Discovery you will know whether this is the right career for you. Good luck.',coachingPrompts:["What concerns do you have walking in today?","Who in your life have you discussed this opportunity with?","What do you currently believe a sales representative's week looks like?"],watchFor:"Candidate hesitates on time commitment. If they cannot block 10–15 hrs/week for Discovery, they cannot do the job. End the conversation respectfully and rebook only if life circumstances change."},s1_2:{managerScript:"Have them read Part 1 of the Candidate Module before the session and bring questions. Walk through the seven activities and nine skills. Show your own diary or week-at-a-glance — the real one, with the messy parts. Talk honestly about working evenings, working weekends, and the income gap before commissions stabilize (typically 4–6 months). The goal of this session is not to sell them on the job — it is to make sure they have an accurate picture before they invest more time. If they look surprised by anything you say, that's the signal to slow down and explore.",recruitContent:"A sales representative's week is not what most people imagine. The job has seven core activities: prospecting (finding people to talk to), approaching (making contact), fact-finding (understanding need), planning (designing solutions), presenting (showing the recommendation), closing (asking for the decision), and servicing (keeping clients). It demands nine skills: communication, empathy, organization, resilience, numeracy, technology fluency, listening, persuasion, and self-management. The week mixes scheduled appointments with unscheduled prospecting, paperwork, training, and client servicing. Income is commission-based — your effort directly drives your pay, but pay is variable, especially in months one through six.",coachingPrompts:["What part of this week sounds hardest for you?","What part sounds most appealing?","How would your family react to evening and weekend work for the first 12 months?"],watchFor:"Candidate fixates on the appealing parts and skips over the hard parts. If they do not engage with the hard parts honestly in this session, they will not engage with them on the road."},s1_3:{managerScript:'This is the "Is This Career for You?" Check Yourself activity. Have the candidate complete it alone, then review answers together. Pay attention to body language as they answer — a candidate who hesitates on "Are you comfortable approaching strangers?" is telling you something the page doesn\'t capture. If they tick "agree" on every statement, probe — that\'s either disengagement or telling-you-what-you-want-to-hear. Either is a red flag.',recruitContent:"This activity is for you, not for me. Answer honestly — there are no right answers. Each question maps to a real demand of the job. If you find yourself uncomfortable with several items, that is information worth taking seriously. The questions cover comfort with rejection, persistence under pressure, willingness to ask for the close, comfort with discussing money openly, willingness to learn product detail, and tolerance for variable income. Trust your gut on these. Your honest answers protect both of us from a wrong-fit decision.",coachingPrompts:["Which question made you pause longest?","Which answer surprised you?","Is there anything you wrote here you would not say to your spouse?"],watchFor:'Mismatched answers (e.g. "comfortable with rejection" + "Why now: financial pressure") indicate the candidate is performing rather than reflecting. Push them to be honest.'},s1_4:{managerScript:'Walk through the 7 Activities and 9 Skills explicitly. Ask the candidate to rate themselves 1–5 on each skill. Capture the bottom two — these are their development priorities for Discovery and beyond. Be specific. "Communication" is too vague; their gap is probably "asking the close" or "active listening" or "explaining product to non-technical buyer." Identify the two specific gaps and write them down. These will form the spine of the Discovery Marketing Plan in Module 6.',recruitContent:"The 7 Activities every sales representative must do every week: prospect, approach, fact-find, plan, present, close, service. The 9 Skills required: communication (verbal + written), empathy (reading the room), organization (managing many cases), resilience (handling no), numeracy (math without a calculator), technology (CRM, illustration tools), listening (true listening, not waiting to talk), persuasion (moving someone past hesitation), and self-management (no boss tells you when to start). Rate yourself on each. Be honest. Your weakest two are where Discovery focuses next.",coachingPrompts:["Which skill are you strongest in and how do you know?","Which two skills are weakest?","What would have to happen this month for those two to improve?"],watchFor:"Candidate rates themselves 4–5 on every skill. Either rare genuine strength (verify with examples) or inflated self-image (probe for grounded evidence)."},s2_1:{managerScript:'Open by saying "Markets are people" — and then prove it. Tell them: forget industry segments and demographics for a moment. Your first market is the people who would take your phone call. Walk through how relationships of trust become first sales, and how first sales become referrals. The next concept is Centers of Influence (COIs) — people who influence others to buy. A pharmacist, a clergy leader, a respected school principal can each refer dozens. Ask the candidate who they know who fits this profile. Capture the names.',recruitContent:"Markets Are People. The most common reason new sales representatives fail is not lack of skill — it is lack of people to talk to. Your natural market is the network you already have: family, friends, former colleagues, neighbors, sports teammates, fellow alumni, members of your religious community, your hairdresser, your mechanic. These people already know and trust you, which is the single hardest thing to build from scratch. Centers of Influence (COIs) are individuals whose opinions move others — pharmacists, principals, accountants, religious leaders, doctors. One COI relationship can produce 20+ referrals over a year. Your job in this module is to inventory who you know and identify your top three COIs.",coachingPrompts:["List five people you would feel comfortable calling tomorrow.","List five people you know who influence others.","Who in your network have you NEVER thought of as a prospect?"],watchFor:'Candidate insists they "do not know enough people." Almost always wrong. Push back gently — list family, neighbors, university friends, former colleagues. Most candidates have 200+ names available; they just have not thought about them as prospects.'},s2_2:{managerScript:"Hand them the Project 100 form. Their job is 50 names today, 100 by next week. Sit with them for the first 15 names — show them how to mine their phone, their LinkedIn, their address book, their wedding guest list. Each name needs: relationship type, age band (rough), occupation, marital status, approachability rating. The rating is a 1–5 gut check. Don't worry about whether the person needs insurance — almost everyone does. Worry about whether the candidate would feel comfortable starting the conversation.",recruitContent:"Project 100 is your launchpad. Start with everyone you know and work outward in concentric circles: immediate family, extended family, close friends, casual friends, former classmates, current colleagues, former colleagues, neighbors, service providers (hairdresser, mechanic, doctor), members of any club or organization, parents of your children's friends. For each name capture: name, phone, relationship to you, rough age, occupation if you know it, marital status if you know it. Then rate 1–5 how comfortable you would be calling them tomorrow about your new career. The list of 100 is your inventory of opportunity. You will not call all 100 — but you cannot identify which 30 to call without seeing all 100.",coachingPrompts:["Who are you avoiding adding to this list, and why?","Who is on this list whose situation you genuinely do not know (e.g. don't know if married, working, etc)?","Who is the highest-net-worth person on this list?"],watchFor:"Candidate adds only family. Push for professional contacts, COIs, neighbors. If 80%+ are immediate family, the candidate has not built an independent network and will run out of prospects in 60 days."},s2_3:{managerScript:"Today you finalize Project 100 and explain how it feeds the next module. Tell them: Project 100 is your inventory; Source Market Surveys are how you turn inventory into appointments. Surveys tell us which segments are responding. Each survey gives a 1–100 quality score; the candidate's first 10 surveys must average above 50, with no more than 2 below 20. Any candidate whose first 10 surveys average below 30 will struggle in field — that is the signal we use to course-correct.",recruitContent:"From Project 100 you will choose your first 30 prospects to approach. The Source Market Survey is the structured way you do that — a script you follow that captures their basic situation while practicing your conversational flow. Each survey scores 0–100 based on completeness and quality of information gathered. Your first 10 surveys must average above 50. This is not arbitrary: candidates who cannot produce 50+ scoring surveys are not yet ready to handle live presentations. The good news: most candidates double their score from survey 1 to survey 5. Practice matters more than natural talent here.",coachingPrompts:["Of your top 30 names, which 5 would you call first and why?","Which name are you dreading? What does that tell you?"],watchFor:"Candidate has Project 100 ranked but cannot articulate WHY a particular name is at the top. Ranking without reasoning means they will not learn from results."},s2_4:{managerScript:'This is the family conversation session. Many promising candidates derail here because their spouse, partner, or parent did not understand what they were getting into. Ask: "Have you discussed this with your spouse? What did they say?" Listen for unease. If the family is not on board with the income variability, the evening calls, the persistence required, the candidate will not last 6 months. If concerns surface, schedule a second meeting that includes the spouse. This is not optional in an insurance career — it is mandatory due diligence.',recruitContent:"Your family is going to feel this career change before they see the rewards. The first six months will involve: studying for the licensing exam, building Project 100, making prospecting calls (often in the evening), attending training, and earning variable commissions. If the people who depend on you do not understand and support what you are doing, the friction will accumulate and you will quit before the income stabilizes. Have the conversation. Be specific about hours, about money, about what you need from them. If they have concerns, your manager will meet with them too.",coachingPrompts:["When did you last talk to your spouse/partner about this career?","What is their biggest concern?","Are they prepared for 4-6 months of variable income?"],watchFor:'Vague answers about family support. "They\'re fine with it" without specifics often means the conversation has not really happened. Push for detail.'},s3_1:{managerScript:"This module shifts from theory to action. Read \"The Business and the Customer\" together with the candidate. The core idea: customers don't buy insurance; they buy what insurance does for them. Walk through the four classic customer concerns: protecting income if they die, protecting income if they get sick, replacing income at retirement, and growing wealth. Every product they will sell maps to one of these four. Today's job is to make sure the candidate can articulate each concern in the customer's language, not in product jargon.",recruitContent:'The Business and the Customer. Customers do not buy insurance products. They buy peace of mind, income protection, and the ability to provide for the people they love when they cannot. The four core customer concerns: (1) "What if I die before I finish providing for my family?" — life insurance. (2) "What if I get sick and cannot work?" — critical illness, disability income. (3) "What if I outlive my savings?" — retirement income, annuities. (4) "How do I grow wealth steadily?" — investment-linked products. Your job is not to sell features. Your job is to listen for which concern is alive in the customer\'s life and offer the solution that addresses it. The product is the answer to a worry the customer already has.',coachingPrompts:["Pick one of the four concerns. Explain it in plain language as if to your aunt.","Which of the four concerns is alive in your own life right now?","Why does explaining product features rarely close a sale?"],watchFor:'Candidate uses product jargon ("term to 65", "WPB rider") in conversation. Brand new candidates do this to feel competent — but it loses customers. Coach them out of it.'},s3_2:{managerScript:"Demonstrate the phone approach yourself first. Use a real prospect from your own pipeline (or simulate one). Show how to: open warmly, state purpose simply, ask permission to ask, close on a meeting time. Then have the candidate practice 5 times. Record one practice on your phone and play it back together. Most candidates' first three attempts are awful — that is normal. By attempt 5 they should be measurably tighter. Capture the exact phrasing improvements that worked.",recruitContent:'The Phone Approach. The phone call is the first test of whether you can move someone from "passive contact" to "scheduled appointment." It is a 90-second conversation: greeting (10s), purpose (20s), permission to ask (10s), benefit statement (15s), appointment ask (15s), confirmation (20s). Practice this until it sounds natural, not scripted. The most common failure modes: rushing through the purpose, apologizing for calling, asking yes/no questions ("Can I meet with you?" — answer is usually no) instead of choice questions ("Would Tuesday at 3 or Thursday at 5 work better?"). The choice question converts at 3–4x the rate of the yes/no question.',coachingPrompts:["What did you hear when you played back the recording?","Which sentence in your approach felt most natural? Most awkward?","How will you adjust on your next call?"],watchFor:"Candidate refuses to record themselves. Almost always means they know they are not yet good and are afraid to confront it. Insist gently — the recording is the fastest learning tool available."},s3_3:{managerScript:"The candidate now executes Source Market Surveys at pace. Goal: 10+ surveys in 1–2 weeks, average score 50+. Review every survey within 24 hours. Surveys with score <20 are a coaching opportunity — go through what was missing and have them re-do it. Patterns matter more than individual scores: if their surveys cluster in one segment (e.g. all family, all young professionals), they are not yet diversifying their pipeline.",recruitContent:"Survey execution week. Run the structured Source Market Survey on at least 10 prospects. Submit each via Jotform. Your manager will review and score. The score is not a grade — it is feedback on how complete and useful the conversation was. A 70+ score means you gathered enough to design a recommendation. A score below 30 means the prospect is not yet a real prospect; you need more information. Track which segments respond well to you and which do not — this is your actual market emerging from the data.",coachingPrompts:["Which survey was your best? What made it work?","Which segment is responding best to your style?","Where in the script are prospects pushing back?"],watchFor:"14+ days pass with fewer than 5 surveys submitted. This is the single highest-correlation predictor of failure in Year 1. Intervene immediately."},s3_4:{managerScript:"Aggregate the survey results with the candidate. Look for patterns: which segments scored highest, which questions consistently got the best responses, which prospects asked for follow-up. From this discussion, identify the 5 strongest follow-up prospects — these become the candidates for the first sales presentations in Module 4. The candidate should leave this session with appointments booked, not just a list.",recruitContent:'What did the surveys teach you? Look at your scores together. Look for which segments engaged most. Look for the prospects who asked questions about products, who expressed concerns, who asked you to "come back when you know more" — those last ones are real prospects in waiting. Identify the 5 you will book for a sales presentation. Book the appointments before you leave this session — momentum dies quickly between Discovery and first presentation.',coachingPrompts:["Of your 10 surveys, which 5 are most likely to buy in the next 60 days?","Of those 5, which appointment have you not yet booked? Why?"],watchFor:"Candidate has good surveys but no booked follow-ups. They are afraid of the next conversation. This is the same fear that kills careers in months 4–6."},s4_1:{managerScript:'Read Part 4 of the Candidate Module — "What Do I Say? What Do I Do?" — together. The basic Sales Talk has four stages: warm opener, needs analysis (questions, lots of them), recommendation (only after needs are clear), close (asking for the decision). Walk the candidate through each stage. Then the harder topic: handling objections. Most objections are not objections; they are concerns that the customer hasn\'t seen addressed. Teach the candidate to repeat the concern back ("What I am hearing is you\'re worried about..."), validate it, and then offer the specific addressing. Objections are signals of engagement, not rejection.',recruitContent:"What Do I Say? What Do I Do? The Sales Talk has four parts: (1) Warm opener — re-establish rapport, state purpose, ask permission to proceed. (2) Needs analysis — ask questions until you genuinely understand the customer's situation. Most new representatives skip this and lose the sale. (3) Recommendation — only after needs are clear, offer the solution, in plain language, anchored to a benefit they already told you they care about. (4) Close — ask for the decision. The most common close: \"Based on what you've told me, this looks like a good fit. Are you ready to start the protection?\" Objections are not rejections — they are signals the customer is engaged but unsure. Address them by listening, summarizing, then answering specifically.",coachingPrompts:["Which of the four stages will be hardest for you?","What objection scares you most? Let's practice it."],watchFor:"Candidate wants to skip needs analysis and go straight to product. Most common rookie mistake. Drill this until it changes."},s4_2:{managerScript:"Role-play time. You play the customer; the candidate plays themselves. Run the full Sales Talk three times: once with an easy customer, once with a customer who has objections, once with a customer who tries to redirect the conversation. After each run, score on: opener (1–5), needs questions asked (count), recommendation clarity (1–5), close attempted (yes/no). Most candidates need 5+ repetitions before the rhythm clicks. Be patient. Be specific in feedback.",recruitContent:"Today you practice the full Sales Talk with your manager three times. Treat it as serious as live. Your manager will play the customer in three modes: receptive, skeptical, and distracted. After each run you'll get feedback on opener, questioning, recommendation clarity, and whether you actually attempted to close. Most new representatives forget to ask for the decision — they walk out hoping the customer will call back. They almost never do. The close is uncomfortable; do it anyway.",coachingPrompts:["Which of the three runs felt most natural?","Where did you freeze? What were you afraid of?"],watchFor:"Candidate refuses to attempt the close in role-play. Same candidate will refuse to close in field. Coach this hard."},s4_3:{managerScript:"Take the candidate on three live joint calls. First call: candidate observes only. Second: candidate observes and contributes one section (typically the warm opener). Third: candidate runs the bulk of the conversation with you supporting. Debrief immediately after each call — within 15 minutes, while it is fresh. Capture what worked, what didn't, what they would change. The third call is the leading indicator of Year 1 success: candidates who can run 70%+ of a real conversation by their third joint call almost always make it.",recruitContent:"Joint Field Calls. You will accompany your manager on three real customer meetings. Call 1: you watch and listen. Pay attention to how questions are asked, how silence is used, how objections are met. Call 2: you contribute one section — usually the opener — under your manager's supervision. Call 3: you run the bulk of the conversation with your manager backing you up. Debrief immediately after each call while memory is fresh. These three calls compress months of learning into a week.",coachingPrompts:["What surprised you about the first call?","What did you do differently in your section vs how you practiced?","Was the customer's reaction what you expected?"],watchFor:"Candidate freezes in call 3 and you have to take over fully. Not necessarily disqualifying — but extend Discovery by two weeks and run two more practice rounds before Module 5."},s4_4:{managerScript:'This is the gut-check session. After three joint calls, the candidate has real evidence about whether this work suits them. Ask the hard questions directly: "How did you feel after each call? Energized or drained? Did rejection sting more than the close excited you?" Their answers here matter more than their POP score, more than their resume. If they walk out of three field calls with a fundamentally negative emotional response, the career will not work for them — and it is kinder to surface that now than to have them learn it after 18 months of struggle.',recruitContent:"Three live calls give you data your inner voice cannot ignore. Reflect on: (1) Energy — did the calls leave you energized or exhausted? Both reactions are normal in the first week, but a pattern of exhaustion across all three is significant. (2) Rejection — when the customer pushed back, what did you feel? Curiosity is good. Defensiveness or hurt are signals to discuss. (3) Closing — when a sale closed, what did you feel? Pride and energy are good. Discomfort or guilt are signals worth understanding. Be honest about your reactions — they are the strongest signal you have about whether this work is right for you.",coachingPrompts:["After all three calls, are you more or less interested than when we started?","What part of the work would you want more of?","What part would you want less of?"],watchFor:"Candidate is enthusiastic in conversation but has not booked any follow-up appointments themselves. Talk does not equal commitment. Look at the calendar."},s5_1:{managerScript:'Run the Income Potential Analysis spreadsheet with the candidate sitting beside you. Use realistic, conservative numbers — Year 1 commissions in the $40–60k range for a strong producer, $20–30k for an average one. Walk through their household budget honestly. The question is not "can you live on Year 1 income" — it is "do you have a runway of 6+ months to cover the gap while production builds?" Many otherwise-capable candidates fail because they underestimate the runway needed. This session prevents that failure.',recruitContent:'The Income Potential Analysis is your financial reality check. Together with your manager you will project Year 1, Year 2, and Year 3 commission income based on realistic assumptions for your branch and unit. Then you\'ll layer in your actual household expenses. The math will tell you whether you can sustain a 4-6 month runway while production stabilizes. If you cannot, the answer is not "give up" — it is "build the runway first, start the career second." Many of our most successful representatives delayed their start by three months to build savings; almost all of those who skipped that step quit within the first year.',coachingPrompts:["What is your monthly minimum spend including all obligations?","How many months can you operate at zero commission income?","What changes in your household if you start in 60 days vs 6 months?"],watchFor:'Candidate dismisses the analysis as "I will just work harder." Effort doesn\'t change runway math. Runway math is non-negotiable.'},s5_2:{managerScript:'The decision conversation. Block 60 minutes — this cannot be rushed. Ask the candidate explicitly: "After everything you have seen and done in Discovery, do you want to proceed?" Three answers: yes, no, "I need more time." Each is legitimate. If yes, set the Selection File timeline. If no, capture the reason — this is data we use to improve recruiting. If "more time," set a re-engagement date and stop the process for now. The worst outcome is a half-yes that becomes a six-month struggle followed by a quit.',recruitContent:"This is your career decision moment. After observing, reading, practicing, and producing in Discovery, you now have enough information to decide deliberately. The three honest answers: (1) Yes — I want to proceed and build a sales career here. (2) No — this is not the right fit for me. (3) I need more time — I want to consider further before committing. All three are respected. The worst answer is a polite yes that becomes resentment six months in. Be honest with yourself first, then with your manager.",coachingPrompts:["On a scale of 1–10, how convinced are you?","What would have to be true for you to be a 9 or 10?","What would have to be true for you to walk away?"],watchFor:"Hesitant yes. The body language tells the truth even when the words don't. If the yes is hesitant, push for the real answer."},s6_1:{managerScript:"The Discovery Marketing Plan is the candidate's first real business plan. It contains: ranked source markets, finalized Project 100, first 30-day prospecting plan, first 30-day income target, joint field call schedule for first 60 days. Sit with the candidate and build it together. They drive the typing; you challenge the assumptions. By the end of the session, the plan should be specific enough that anyone reading it could execute it on day one.",recruitContent:"Your Discovery Marketing Plan is your first business plan as a sales representative. It is not a wish list — it is a specific operating plan for your first 30 days post-license. It contains: (1) Your top 3 source markets ranked by quality and accessibility. (2) Your final Project 100 list. (3) Your week-by-week prospecting plan for the first 30 days — how many calls, how many appointments, how many presentations. (4) Your income target — be honest about what is achievable in month 1, month 2, month 3. (5) Your joint call schedule with your manager for the first 60 days — book the dates now while you have momentum.",coachingPrompts:["Walk me through week 1 day-by-day.","What happens if your first 10 calls don't book?","Which week is most likely to derail you?"],watchFor:"Plan is generic and could apply to any candidate. Push for specifics — names, dates, dollar targets. A vague plan is a plan that won't happen."},s6_2:{managerScript:"The Discovery Summary Evaluation (Form 11) is your formal record of how the candidate performed across Discovery. Score all 10 items 1–7. Be honest, not generous. Inflated scores here lead to under-coached representatives in Induction. Discuss each score with the candidate so they understand where they stand. Document the top 2 strengths and top 2 development areas. These feed directly into the first 90-day coaching plan in Induction.",recruitContent:"The Discovery Summary Evaluation is the formal record of your performance across Discovery. Your manager scores 10 areas on a 1–7 scale. The scores are not grades — they are baselines. Your strengths show where to lead from. Your development areas show where coaching focuses in your first 90 days. Sit with your manager as they walk through the scores. Ask why each was given. Disagree if you genuinely disagree — but understand that the scores represent observed behavior across all of Discovery, not just one moment.",coachingPrompts:["Which score surprised you?","Which strength can you build on immediately?","Which development area scares you most?"],watchFor:"Defensiveness when scores are reviewed. Candidates who cannot accept honest feedback during Discovery will not accept it during Induction either, where stakes are higher."},s6_3:{managerScript:'BM review meeting. The Branch Manager reads the Marketing Plan and the Discovery Summary Evaluation, meets the candidate (if not already), and renders a decision: proceed to Selection File, hold for additional Discovery work, or decline. Document the decision in writing immediately. If "proceed," the BM also confirms which RM will continue as the candidate\'s manager into Induction.',recruitContent:"Your final Discovery meeting. The Branch Manager reviews your Marketing Plan and Discovery Summary Evaluation. The BM may ask you direct questions about your plans, your concerns, your readiness. The BM's decision is one of three: (1) Proceed — you move into the Selection File and toward contract. (2) Hold — there is one more piece of work to do before proceeding. (3) Decline — the fit is not right at this time. All three outcomes are legitimate. If you proceed, congratulations — your real career begins next.",coachingPrompts:["What questions do you have for the BM?","What concerns would you raise in this meeting?"],watchFor:"BM and RM disagree on readiness. Have that conversation BEFORE the candidate meeting, not after."}};function moduleProgress(e,t){const a=t.sessions.reduce((e,t)=>e+t.items.length,0);let n=0,r=0;for(const a of t.sessions){const t=e?.sessions?.[a.id];if(!t)continue;const s=(t.completedItems||[]).length;n+=s,s===a.items.length&&a.items.length>0&&r++}return{totalItems:a,doneItems:n,pct:a>0?Math.round(n/a*100):0,sessionsComplete:r,totalSessions:t.sessions.length}}const DSE_ITEMS=[["i1","Understanding the sales representative's job"],["i2","Acceptance of the job requirements"],["i3","Completion of Project 100"],["i4","Identification of potential markets"],["i5","Skill in learning telephone approach"],["i6","Ability to set up appointments"],["i7","Skill in asking and securing referred leads"],["i8","Skill in learning sales talk"],["i9","Emotional reaction to sales call"],["i10","Understanding activity level required"]];function DiscoverySummaryEvalCard({data:e,upd:t}){const a=DSE_ITEMS.reduce((t,[a])=>t+(Number(e?.ratings?.[a])||0),0),n=DSE_ITEMS.filter(([t])=>e?.ratings?.[t]).length>0?a/10:0;return React.createElement(Section,{title:"Discovery Summary Evaluation",subtitle:"Form #11 · 10 items × 1-7 scale"},React.createElement(Grid,{cols:2},React.createElement(TextInput,{label:"Trainer's name",value:e?.trainerName,onChange:e=>t(["trainerName"],e)}),React.createElement
