ority over UMs, not unilateral authority on POP administration. The BM-recruit meeting precedes every POP request without exception."},{id:"ABM2",text:"A UM brings you a recruit with Form A score 48. What approval route applies?",options:["BM Direct — you can sign off as ABM","Selection Panel — Form A under 50 mandates Panel review","Automatic rejection","VP Sales decision only"],correctIndex:1,explanation:"Form A under 50 triggers a Selection Panel under GSAP V4.2. The Panel is the gate the branch installs precisely for marginal-scoring recruits."},{id:"ABM3",text:"A recruit's POP shows Achievement Potential = -22 (decline-risk band). The Recruiting Manager strongly recommends proceeding anyway. What is your correct response?",options:["Defer to the RM's judgment — they know the recruit best","If the BM agrees to override, the override must be documented in writing with the override reason, signed by the BM, and accompanied by a specific coaching plan","Proceed quietly — POP scores can be unreliable","Decline automatically without further discussion"],correctIndex:1,explanation:"Overrides of POP signal are allowed but never quiet. The override, the reason, and the coaching plan must be a permanent part of the recruit's file so the branch can audit the decision later."},{id:"ABM4",text:"A UM under your line has had three recruits resign during probation in the past 18 months. What is your appropriate first step?",options:["Replace the UM","Pull the lifecycle data on those three recruits, identify selection patterns (POP scores, file quality, market survey quality), and bring findings to the BM with a specific coaching recommendation","Wait for a fourth failure to establish a clear pattern before acting","Take over the UM's recruiting personally"],correctIndex:1,explanation:"Patterns are persuasive when they are documented. Three failures is a pattern — the ABM's job is to surface it factually, with data, before recommending action."},{id:"ABM5",text:"An agent under your line is on probation extension. Production is at 30% of the revised quota with 30 days remaining. What is the right action?",options:["Wait until the 30 days are up — there is still time","Hold a coaching review with the UM and the agent, document specific final-30-day actions and standards, and prepare termination paperwork in parallel so the branch is not scrambling at day 30","Grant a second extension preemptively","Defer entirely to the UM"],correctIndex:1,explanation:"Extension exists to give a fair chance, not to delay an inevitable termination. Preparing in parallel is professional, not premature."},{id:"ABM6",text:"What is the correct description of your reporting and decision-making authority as ABM?",options:["You can sign off independently on Form A 60+ candidates","You provide supervisory oversight of UMs and contribute to selection decisions, but you do not have unilateral authority on POP requests, hires, or terminations — those rest with the Branch Manager","You match the BM's authority on routine recruiting matters","You report to the VP Sales directly, bypassing the BM"],correctIndex:1,explanation:"The ABM supervises and supports. Final decisions on POP, hiring, and termination route through the Branch Manager. This is not a slight on the ABM role; it is how the chain of authority is structured."},{id:"ABM7",text:"A recruit's induction is going badly. Their UM has not submitted weekly coaching logs for three weeks. What is the priority order of your actions?",options:["Discipline the UM","Get the missing coaching logs immediately, assess the recruit's actual situation in person, and secure a written commitment from the UM to weekly logs going forward — then inform the BM","Wait for the UM's monthly review","Reassign the recruit to a different UM"],correctIndex:1,explanation:"The recruit's situation is the priority. Discipline of the UM is a downstream conversation; getting eyes on the recruit and locking in the coaching cadence comes first."},{id:"ABM8",text:"Under GSAP V4.2, which conditions trigger an AUTOMATIC Selection Panel regardless of total Form A score?",options:["Only when Form A score is under 50","Minimum education standard not achieved; candidate under 25 or over 55; POP 7 Probability of Success under 21%; or questions arising on the Inspection Report","Only when the BM requests it","Only when the VP Sales requests it"],correctIndex:1,explanation:"These four triggers are mechanical and override the Form A band. Knowing the triggers means the Panel is convened when it should be, not just when it is convenient."},{id:"ABM9",text:'A new recruit\'s digital market surveys show 25 submissions, average score 6 out of 100, with 14 zeros. The UM tells you "they hit the volume." What is the appropriate read?',options:["Volume meets the standard — proceed","This is a quality flag, not a volume win. Even with auto-timestamped digital submissions, the score pattern (average 6 with 14 zeros) says the recruit is going through the motions without actually engaging the prospects. Halt and address with the UM and the recruit before further branch investment","Acceptable for a brand-new recruit; quality will improve with time","Disqualify the recruit immediately"],correctIndex:1,explanation:"The Daniel Bhagwandas pattern — 25 surveys, average 6, 14 zeros — is the textbook example of activity theatre. Digital submission proves the form was filled in, but score patterns reveal whether real conversations are happening. Volume without quality is a red flag, not a green light."},{id:"ABM10",text:"A Recruiting Manager asks you to authorise POP 7.0 administration because the Branch Manager is on leave for a week. What do you do?",options:["Authorise — you are acting in the BM's capacity during his absence","Wait until the BM returns. POP cannot proceed without the BM-recruit meeting, and that meeting is the BM's personally. The week's delay is acceptable","Authorise on the condition that the BM is briefed by email after the fact","Have the RM administer POP and leave the authority question for the BM to handle on return"],correctIndex:1,explanation:"There is no acting-BM workaround for POP authorisation. The cost of a week's delay is trivial compared to the cost of administering POP to a recruit the BM never met."}],UM:[{id:"UM1",text:"After conducting a First Interview with a strong recruit, what is your next step?",options:["Administer POP 7.0 the same day to keep momentum","Submit the First Interview profile to the Branch Manager and arrange a BM-recruit meeting before any POP request is raised","Begin building the selection file in parallel","Schedule a second interview with yourself before involving the BM"],correctIndex:1,explanation:"The BM-recruit meeting precedes every POP, regardless of how strong the First Interview was. The strong FI is the case for the meeting, not a way to skip it."},{id:"UM2",text:"A recruit tells you they prefer to submit their market surveys as scanned forms because their internet is slow. What is your response?",options:["Accept scanned forms as a reasonable workaround","Explain that this branch operates a digital-only market survey process — the recruit fills out the digital form themselves and the auto-timestamp is the audit trail. Offer practical help to solve the access issue: branch wifi, sponsored mobile data, an in-branch session — but the standard does not change","Submit the surveys on their behalf","Accept some scanned and some digital, mixed"],correctIndex:1,explanation:"The branch process is digital-only. The right answer is to solve the recruit's access problem, not to lower the standard. A recruit who cannot get past basic digital submission today will struggle with the digital demands of the agent role tomorrow."},{id:"UM3",text:"During Discovery Module 2, a recruit's Project 100 list has 30 names but only 5 with proper annotation (relationship, needs, approach plan). What do you do?",options:["Accept it — 30 names is a reasonable start","Hold a coaching session focused on annotation discipline. Project 100 is the source of every future fact-find — names without annotation are not prospects, they are a phone book","Submit it to the BM as is and let him decide","Mark the recruit as struggling and reduce expectations"],correctIndex:1,explanation:"Project 100 quality predicts induction quality. Coaching the annotation discipline now prevents the activity-theatre pattern later."},{id:"UM4",text:"A recruit in induction is at 40% of API quota and 50% of apps quota at the 4-month mark. The BM asks for your assessment. What is the professional answer?",options:['"On track — they are producing"','"Below pace. Specific coaching focus needed on close rate. Weekly fact-find review required for the next 30 days. I will report on trajectory at the 5-month review."','"Probably will not make probation — let us start termination paperwork"','"Let us grant an extension preemptively to relieve pressure"'],correctIndex:1,explanation:"Behind pace is behind pace. The professional response is to identify the specific gap, commit to a specific intervention, and set a review checkpoint."},{id:"UM5",text:"Who is responsible for arranging the BM-recruit meeting after a First Interview?",options:["The recruit, on their own initiative","The Recruiting/Unit Manager who conducted the First Interview","The Branch Manager's Assistant (BMA)","The BM's office, after reviewing the FI profile"],correctIndex:1,explanation:"The UM owns the handoff. Submitting the FI profile and arranging the BM meeting is part of the same workflow."},{id:"UM6",text:"When must the Sales Activity Tool be submitted to the Sales Manager during induction?",options:["Monthly, as part of the regular performance cycle","Weekly, every Monday — covering the prior week's sessions, observations, and action items, turned over in person","Only when issues arise that need escalation","Quarterly with the performance review"],correctIndex:1,explanation:"Monday submission of the Sales Activity Tool is not paperwork — it is the evidence that coaching is actually happening. Missing submissions is the leading indicator of induction problems."},{id:"UM7",text:"A recruit's Form A score is 62. What approval route applies?",options:["Selection Panel mandatory","BM Direct — the Branch Manager can sign off on his recommendation, with the complete file sent to the Office of the VP Sales","VP Sales decision required","Automatic approval — no BM review needed"],correctIndex:1,explanation:"Form A 60-80 routes BM Direct on the BM's recommendation, complete file sent to VP Sales. There is no automatic approval at any tier."},{id:"UM8",text:"You suspect a recruit listed names on market surveys without actually conducting them. The numerical scores are very low and many are zero. What is your move?",options:["Submit as is and let the BM's file review flag it","Have a direct conversation with the recruit about what you are seeing, audit a sample of the surveys by calling listed names yourself, and report your findings to the BM with the evidence before continuing","Disqualify the recruit on suspicion","Coach quietly without escalating"],correctIndex:1,explanation:"Suspicion needs evidence. The UM's job is to gather the evidence — conversation, audit, documentation — and then escalate with facts."},{id:"UM9",text:"An agent under your line completes the initial 7-month probation with 60% of API quota and asks for a probation extension. What is required?",options:["Grant the extension automatically — they were close","Submit a written extension request to the Branch Manager with specific extended quotas, a coaching plan, and the case for why the agent can close the gap. The BM decides","Decline — they did not meet quota","Defer to the agent's own preference"],correctIndex:1,explanation:"Extensions are the BM's decision, not the UM's grant. The UM's job is to make the case in writing."},{id:"UM10",text:'During Discovery Module 5, a recruit asks "when do I start making money?" What is the correct answer?',options:['"Once you are contracted — typically 2 to 3 months in"','"Once you are contracted, licensed, and producing settled apps. Sustainable income realistically begins month 4 to 6, not month 1. We structure expectations around that timeline — and that is why we ask about your financial runway before the contract is offered"','"Immediately — you will start earning from your first sale"','"The branch will support you financially during probation"'],correctIndex:1,explanation:'Setting honest expectations is the difference between a recruit who stays through the lean months and a recruit who resigns at month 3 saying "I did not know."'}],BMA:[{id:"BMA1",text:"A Recruiting Manager submits a recruit's First Interview profile to you. What is your first action?",options:["File the profile pending POP 7.0 results","Confirm with the RM that the BM-recruit meeting is scheduled, and surface the file to the BM so he can prepare. POP 7.0 does not proceed before the BM meeting","Forward the profile directly to POP administration","Begin building the selection file structure"],correctIndex:1,explanation:"The BMA is a process custodian. Holding the line on the BM-meeting-before-POP sequence is one of the most important guards in the workflow."},{id:"BMA2",text:"A recruit emails their academic certificates from a personal Gmail address directly to you. What is the protocol?",options:["Accept them — documents are documents","Acknowledge receipt, confirm receipt and authenticity through official channels, and note that future sensitive documents should route through the recruit portal or branch email — not personal Gmail","Decline and ask them to resend via postal mail","Forward immediately to Sales Admin without comment"],correctIndex:1,explanation:"Accept the document so the recruit is not penalised, but establish the protocol for next time, and verify what you have received."},{id:"BMA3",text:"Which documents must be present in a selection file before it goes to the Selection Committee — for an Inexperienced Agent?",options:["Whatever the Recruiting Manager has provided at the time","The full 17-item index per the Jun 2021 Revised INDEX: BM letter (with optional Recruiting Officer supporting letter as 1b), Memo circulating recruit's name, Form A, Selection/Rejection Training Process Form, Letter of Application and Resume, Academic Qualifications, BYOD confirmation, Initial Selection Interview and Financial Statements with 3 references, POP V7.0, Discovery Summary Evaluation, Inspection Report, Two (2) Confidential Reports, Two (2) Interviewing Reports, Spouse/Partner/Parent Interview, Summary Project 100, Income Potential Analysis, and Other Information (passport photos, POA, Police Cert, CBTT licence, Bank Statement, NIS#/BIR#, Recruit ID)","Just the POP V7.0 and Form A — the rest can be added later","Resume and one recommendation letter"],correctIndex:1,explanation:'A file is "ready for Selection Committee" only when it is complete per the official 17-item Revised Jun 2021 INDEX for Inexperienced Agents. Partial files trigger back-and-forth and create the conditions for marginal recruits to slip through on incomplete evidence.'},{id:"BMA4",text:"A Unit Manager asks you to log a coaching record retroactively for a week they missed. What do you do?",options:["Log it with the date the UM provides","Decline to backdate. Offer to log the record with today's date and a note that it covers the missed week. Coaching records are dated when submitted, not when the coaching was claimed to have occurred","Log it with the UM's signature alongside today's date","Refer the request to the Branch Manager"],correctIndex:1,explanation:"Backdated records compromise the entire log's credibility. Honest gap-noting protects the branch and creates the right pressure on real-time submission."},{id:"BMA5",text:"The Branch Manager is unavailable for a week. A UM presents a recruit for POP 7.0 administration. Who can authorise the POP?",options:["The ABM, acting in the BM's absence","No one. POP 7.0 cannot proceed without the BM having personally met the recruit. The POP request waits until the BM returns. The recruit is informed of the timing professionally","The senior Unit Manager","The BMA on the BM's behalf"],correctIndex:1,explanation:"There is no acting-BM for POP authorisation. The standing order is exact: BM meets the recruit, BM authorises POP, no delegation."},{id:"BMA6",text:"How should sensitive correspondence between the Branch Manager and an Asst. Branch Manager be handled?",options:["Direct email between BM and ABM only","Routed through the BMA as active correspondent with the BM's review and approval, with executive cc as appropriate (e.g. VP Sales) for visibility on matters of consequence","Through Slack or instant chat for speed","Verbal only — to avoid creating records"],correctIndex:1,explanation:"The BMA-as-correspondent model depersonalises conflict, creates a clean documentation trail, and ensures sensitive matters reach executive visibility through the proper channel."},{id:"BMA7",text:"A POP 7.0 result comes back with Final Rating 1. What is the correct file disposition?",options:["Forward to the Selection Committee as a routine submission","Hard block — do not advance to the Selection Committee. Per the VP Sales 2021 memo only Final Ratings of 3+ are accepted; Rating 2 requires VP Sales written approval; Rating 1 is below that threshold and is blocked","Hold pending a re-test in 30 days","Proceed if the RM signs an override"],correctIndex:1,explanation:"POP Final Rating 1 is a hard block. The BMA's role is to enforce the block at the file level."},{id:"BMA8",text:"The recruit portal shows a new candidate's market surveys at 5 submissions over 6 weeks. The GSAP Discovery program expects 10 surveys per module (40 total by Module 6). What is worth surfacing to the BM?",options:["Nothing — they are submitting","Pace concern. The recruit is materially behind the expected cadence (10 per Discovery module). Recommend the BM raise the pace with the responsible UM and the recruit","The surveys themselves need a quality review only","Recommend the recruit be cut"],correctIndex:1,explanation:"The BMA reads the data the BM does not have time to read in detail. Surfacing the pace concern — without recommending termination — is exactly the right altitude."},{id:"BMA9",text:"Who carries the cost of POP 7.0 administration, and what is the branch's responsibility?",options:["The recruit pays for their own POP","POP 7.0 is a Guardian Group company expense — the branch is not billed directly — but the branch is responsible for managing the company's investment by ensuring every POP is authorised by the Branch Manager only after he has personally screened the recruit","The branch pays out of its operating budget","The Unit Manager pays out of commissions"],correctIndex:1,explanation:"POP is not free even though the branch is not billed directly. The company carries the cost. The branch's job is to manage that cost by not administering POP to recruits the BM has not assessed — because the failed contracts of the last 18 months are the evidence that rushing the POP step is what produces failed hires."},{id:"BMA10",text:"A recruit's file shows self-reported age 60. What is mandatory under GSAP V4.2?",options:["Apply the standard Form A scoring and proceed normally","Candidates over 55 (or under 25) trigger mandatory Selection Panel review regardless of the other Form A scores. The BMA flags this to the BM and ensures the Panel is convened before any approval decision","Decline automatically on age grounds","Proceed if the total Form A score is high enough"],correctIndex:1,explanation:"Age over 55 (or under 25) is one of the four automatic Selection Panel triggers under GSAP V4.2, independent of the Form A total score."}]};ROLE_QUESTIONS.BM=ROLE_QUESTIONS.ABM;var SUBMIT_EMAIL="support@rickyrampersadbranch.com",ROLES=[{code:
