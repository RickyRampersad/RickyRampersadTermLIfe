SION};try{var a=JSON.parse(t);return a.version!==COURSE_VERSION?{completed:[],version:COURSE_VERSION}:a}catch(e){return{completed:[],version:COURSE_VERSION}}}function saveModuleProgress(e,t){safeSet(MODULE_PROGRESS_KEY(e),JSON.stringify({completed:t,version:COURSE_VERSION,lastUpdated:(new Date).toISOString()}))}function loadAllAttempts(){var e=safeGet(ALL_ATTEMPTS_KEY);if(!e)return[];try{return JSON.parse(e)}catch(e){return[]}}function saveAllAttempts(e){safeSet(ALL_ATTEMPTS_KEY,JSON.stringify(e))}function encodeResultCode(e){try{return btoa(unescape(encodeURIComponent(JSON.stringify(e))))}catch(e){return""}}function decodeResultCode(e){try{return JSON.parse(decodeURIComponent(escape(atob(e.trim()))))}catch(e){return null}}var MODULES=[{id:"M1",number:1,title:"The Manager's Guide — Why GSAP V4.2 exists",estMinutes:12,sections:[{heading:"What this course is",body:"This course consolidates the GSAP V4.2 standards (the Guardian Group Selection and Approval Process, Rev. December 2021) into a single read-through for every manager and BMA at the Chaguanas branch. It does not replace the source documents — the Selection Procedure Guide, the Discovery Manager's Guide, the POP 7.0 Interpretation Manual, the Induction Program guide, the Form A scoring sheet, and the file index documents remain the authoritative references. What this course does is walk you through what each of those documents requires of you in your specific role, in the order things actually happen in a recruit's lifecycle, and against the backdrop of the failure patterns this branch has seen recently."},{heading:"Who this is for",body:"GSAP V4.2 names four manager roles inside the branch: Branch Manager, Assistant Branch Manager, Unit Manager, and Trainee Manager. Together with the Branch Manager's Assistant — who is the operational custodian of the selection file — these five roles run the entire recruiting and selection cycle. Every one of them must understand the standards. Not just the BM."},{heading:"The Branch Manager's planning responsibility",body:"GSAP V4.2 opens with manpower planning. At the end of each production year, the Branch Manager builds a plan for the next year that takes into account branch targets, unit-level productivity, current team performance, and historical attrition. From that plan flows the number of recruits the branch needs to bring in and the profile those recruits should match. Recruiting is not opportunistic — it is the execution of a plan. If a Recruiting Manager brings forward a candidate who does not fit the branch's stated profile, that is a conversation to have before any further selection steps."},{heading:"The seven steps of the GSAP V4.2 lifecycle",body:"Every recruit moves through the same sequence. Each step has its own documentation, its own decision point, and its own exit. A candidate can be deselected — or deselect themselves — at any stage. After contract, the agent enters probation.",lifecycle:[{name:"Discovery",who:["RM","Candidate"],description:"The 6-module job-sampling program. Candidate enrolled to GGLDC; reads the Discovery Manual; completes Project 100; submits market surveys.",duration:"Up to 7 weeks"},{name:"Selection Interviews",who:["BM","RM"],description:"Includes the BM-recruit meeting (after First Interview, before any POP) and POP 7.0 administration once authorised by the BM.",duration:"Days 1–7 after Discovery start"},{name:"File Completion",who:["RM","BMA"],description:"Full 17-item index assembled. RM completes the bulk of the forms; BMA verifies completeness before any submission.",duration:"End of Week 7"},{name:"Approval",who:[{role:"BM",action:"60-80"},{role:"VP",action:"50-59"},{role:"Panel",action:"<50 or trigger"}],description:"Form A total drives routing: BM Direct (60–80), VP Sales Decision (50–59), or Selection Panel (under 50, or any of the 4 auto-triggers).",duration:"Variable — Panel schedule dependent"},{name:"Boot Camp",who:["SalesAdmin"],description:"Guardian Group company training program — 25 sessions covering ethics, products, sales tools, application processing, and compliance.",duration:"Company-set schedule"},{name:"Induction",who:["RM","BM"],description:"Branch-led 6-module program. Must be complete by Week 5 post-Boot-Camp close. Includes weekly Sales Activity Tool, Induction Application + New Agent Development Plan submitted to VP Sales.",duration:"Up to 5 weeks"},{name:"Contract",who:["BM","Candidate"],description:"Issued once Induction is complete, AML/OFT certs are in place, State Licensing Exam is in motion, and pre-contract production target ($105k API branch standard) has been met. Day 1 of the 7-month probation clock.",duration:"After Induction"}]},{heading:"The branch standing order: BM meets every recruit before POP 7",body:"Effective immediately, the Branch Manager personally meets every recruit after the First Interview and before any POP 7.0 administration. POP 7.0 is not a branch expense — it is a Guardian Group company expense. But the branch is responsible for managing the company's investment in our recruiting pipeline. We have seen what happens when the branch rushes a POP without the Branch Manager personally screening the recruit: the results speak for themselves in the failed contracts of the last 18 months. The standing order exists so that every POP we authorise is one the BM has already pre-screened. There is no acting-BM substitute for this meeting. If the BM is on leave, the POP request waits. A week of waiting is not a cost; a POP administered to the wrong recruit is."},{heading:"POP 7.0 — the rule on Final Ratings",body:"Per the VP Sales memo of 15 February 2021 (still in effect), only POP 7 Final Ratings of 3 and above will be accepted to proceed. A Final Rating of 2 requires VP Sales approval in writing before the branch may proceed. A Final Rating of 1 is a hard block — these candidates do not advance regardless of any other signal in the file. The Final Rating is calculated from the source scores: PS≥45 starts at 5, PS 30-44 starts at 4, PS<30 starts at 3. Then -1 if EP<30; -1 if AP<-15 or IP<-25; -1 if SD<25 or LM<25 or CR<25. Minimum rating is 1. Knowing this math means a Unit Manager can predict the Final Rating from the scale scores alone."},{heading:"What this branch's recent history says",body:"Across the candidates this branch has put through GSAP V4.2 in 2024-2025, the pattern is consistent: when the POP signal said caution and the branch overrode the signal without building specific coaching structure around the caution, the recruit failed. When the file was incomplete or rushed to Selection Committee, the file was sent back. When market surveys were submitted at high volume but low quality, the recruit who produced those surveys was almost never the producer the branch needed. The standards exist because the data says they predict success. Following the standards is not bureaucracy. Following the standards is the cheapest insurance the branch can buy against the cost of a probation-resigned hire."},{heading:"The cost of getting it wrong — what one bad hire really costs the branch",body:"The branch invests substantial time and attention in every recruit who reaches contract. When a recruit resigns during probation or fails to make the Month 12 milestone, that investment walks out the door. The figures below are the operational cost — they do not count Guardian Group's POP 7 cost, which is real but borne at company level.",callouts:[{big:"50-100",unit:"Hours",label:"Manager time invested per probation-resigned recruit",subtext:"Across Discovery sessions, file build, POP review, induction modules, weekly coaching, joint field calls.",color:"amber"},{big:"7",unit:"Weeks",label:"Lost calendar runway during Discovery",subtext:"Time the branch could have spent on a candidate who would have made it.",color:"stone"},{big:"$0",unit:"API returned",label:"When a recruit resigns mid-probation",subtext:"Branch-level outcome: no settled production, no commission contribution.",color:"red"},{big:"0",unit:"Files past",label:"Tolerance for shortcuts going forward",subtext:"Every step in the standing orders exists because data says it predicts outcomes.",color:"green"}]}]},{id:"M2",number:2,title:"Discovery — The 6-session program, deep dive",estMinutes:18,sections:[{heading:"What Discovery is",body:"Discovery is a six-module job-sampling program. The Recruiting Manager runs it. Sessions can be in person, virtual, or blended. By the end, the RM must be able to say whether the candidate can, is willing, and is able to do the job. Discovery is a two-way evaluation: at any module, the manager may deselect; equally, the candidate may step away. Both outcomes are acceptable. The wrong outcome is a candidate who completes Discovery half-engaged and signs a contract anyway."},{heading:"The Discovery program in 60 seconds",callouts:[{big:"6",unit:"Modules",label:"Sessions with the RM",subtext:"Job-sampling — candidate experiences the role before contract",color:"stone"},{big:"7",unit:"Weeks",label:"GGLDC access window",subtext:"Limited-access from candidate's personal email; re-enrol if extended",color:"blue"},{big:"40",unit:"Surveys",label:"GSAP V4.2 minimum",subtext:"10 per module from Module 2 onward — digital only, recruit fills themselves",color:"green"},{big:"10",unit:"Dimensions",label:"Discovery Summary Evaluation",subtext:"Form 11 — rated 1-7 each; average feeds Form A scoring",color:"amber"}]},{heading:"Cumulative Market Survey tracker — what each module should produce",body:"This branch operates a digital-only market survey workflow. The recruit fills out the digital form themselves; submissions are auto-timestamped. By the end of Discovery the candidate should hit at least 40 cumulative surveys (the GSAP V4.2 standard). The bars below show the expected pace by module.",surveyTracker:[{label:"End of Module 1",cumulative:10},{label:"End of Module 2",cumulative:20},{label:"End of Module 3",cumulative:30},{label:"End of Module 4",cumulative:40},{label:"End of Module 5",cumulative:50},{label:"End of Module 6",cumulative:60}],closing:"Volume is the floor, not the ceiling. A candidate at 60 surveys with average score 6 and 14 zeros has not produced; a candidate at 40 surveys with average score 72 has. Quality vs volume is treated as a separate signal below."},{heading:"GGLDC and the Discovery Manual — the candidate's content",body:"The candidate is enrolled to GGLDC on a 7-week limited-access window from their personal email. They are required to complete the New Candidate Discovery course — 3 modules, 17 lessons, 1 quiz. The Sales Manager or BMA enrols them. If Discovery extends past 7 weeks, GGLDC access must be re-issued. In parallel, the candidate works through the Discovery Manual Parts 1–4 and completes the Check Yourself questions at the end of each part. The Discovery Manual is the candidate's content; the Manager's Guide is yours.",bullets:["GGLDC New Candidate Discovery: 3 modules, 17 lessons, 1 quiz, on candidate's personal email.","Discovery Manual Parts 1, 2, 3, 4 — with Check Yourself questions due as assignments.","Product lessons in GGLDC (Module 3): Life Evolution, Xpress Life, Flexiterm, EconoLife, Praesidia, IPI, SPIA, Family Income Benefit, Reliance, Life Secure, Lifestyle.","Sales tools training (GGLDC Module 2): Sales Pal Web, Sales Pal Mobile, MPOS, OAS Integration."]},{heading:"The 6 Discovery Modules — what happens in each",body:"Each module has four parts: the manager's prep before the session, the session content delivered, the assignments handed to the candidate for next time, and the forms completed in or by that module.",discoveryModules:[{num:"1",name:"A Sales Representative's Week",week:"Week 1",milestone:"10 surveys cumulative; Project 100 v1 due",prep:["Review candidate's resume and First Interview profile.","Confirm BM-recruit meeting has happened and POP 7.0 is authorised.","Have Project 100 booklet and Market Survey digital form link ready."],session:["Introductions; explain Discovery and selection/deselection.","Career presentation; deliver PAIDCAR breakdown of Sales Rep's job.","Sales Process overview; ethics, confidentiality, compliance.","Enrol candidate to GGLDC; live demonstration of Project 100 and a market survey.","Define industry acronyms: API, FYC, productivity."],assignments:["GGLDC Module 1 Lessons 1 and 2 (Prospecting, Contacts).","Research history of life insurance.","Complete Project 100 (first version).","Conduct 10 Market Surveys via digital form.","Read Discovery Manual Part 1 and answer Check Yourself questions."],forms:["Form 5","Form 6","Form 7"]},{num:"2",name:"Identifying Markets",week:"Week 2",milestone:"20 surveys cumulative; Marketing Plan & Project 100 v2",prep:["Score the candidate's Project 100 v1 and prepare specific feedback.","Audit the 10 surveys for quality (avg score, zeros, consistency)."],session:["Feedback on Module 1 assignments; test GGLDC understanding.","Professional image and personal brand; Economic Hazards of life.","Importance of Income script (must be learned verbatim).","Marketing Plan; Ben Duffy and Credibility Speech.","Call scripts for appointments and Referred Lead Prospecting.","Handling Telephone Hesitations demonstrated.","Money management; career path; MDRT and Convention."],assignments:["GGLDC Module 1 Lesson 3 (Importance of Income) + Module 3 Lessons 1, 2, 6.","Marketing Plan with candidate's own desired income.","Project 100 (second version).","10 more Market Surveys.","Draft Credibility Speech; prepare call scripts.","Read Discovery Manual Part 2."],forms:[]},{num:"3",name:"Meeting Your Marketplace",week:"Week 3",milestone:"30 surveys; first home visit; first Confidential Report",prep:["Schedule Inspection Report home visit.","Plan first Confidential Report interview with Reference 1.","Schedule Spouse/Partner/Parent interview.","Arrange branch/agency meeting attendance."],session:["Feedback on Market Surveys, industry research, GGLDC.","Critique Credibility Speech and call scripts.","Review Project 100 v2 — assess annotation discipline.","Importance of Income (candidate now demonstrates).","Insurance concepts; Total Needs Approach.","Questioning and listening skills.","Introduce Fact Find and Feeling form."],assignments:["10 more Market Surveys.","Read Discovery Manual Part 3.","Practice Importance of Income for first presentation.","Practice Credibility Speech and call scripts.","Attend a branch or agency meeting."],forms:["Form 11","Form 12 (1st)","Form 13 (1st)","Form 14"]},{num:"4",name:"Making a Sales Presentation",week:"Week 4",milestone:"40 surveys (GSAP standard); field call observation",prep:["Identify a Sales Rep willing to be observed on a real prospecting call.","Brief the Sales Rep on what the candidate is observing for.","Update Discovery Manager's Evaluation for this point."],session:["Feedback on Market Surveys and Discovery Manual Part 3.","Subjective vs objective data gathering; role of questioning.","Fact Find and Feeling fundamentals.","Analysing subjective and objective data.","Feedback on branch/agency meeting attendance."],assignments:["10 more Market Surveys.","Practice Importance of Income for second presentation.","Read Discovery Manual Part 4.","Observe a Sales Rep on a prospecting call."],forms:[]},{num:"5",name:"Closing, Persistency, Policy Delivery",week:"Week 5",milestone:"50 surveys; second Confidential Report; Financial Statements",prep:["Plan second Confidential Report interview with Reference 2.","Set up Sales Pal and MPOS demo environment.","Initial Selection Application + Financial Statements ready to issue."],session:["Feedback on Market Surveys and Discovery Manual Part 4.","Handling Objections and Closing — feedback.","Observe candidate demonstrate Importance of Income; coach.","Policy Delivery; persistency; after-sale service.","Cross-sales opportunities.","New agent contract requirements walkthrough.","Sales Pal and MPOS demonstrated in class."],assignments:["Practice Importance of Income for final presentation.","10 more Market Surveys.","Complete Initial Selection Application + Financial Statements (3 references)."],forms:["Form 12 (2nd)","Form 13 (2nd)","Form 8"]},{num:"6",name:"Marketing Plan & Selection Decision",week:"Week 6-7",milestone:"60+ surveys; Discovery closes; file assembly",prep:["Discovery Summary Evaluation ready to complete.","POP 7 Interview Questions completed with candidate (if not done earlier).","Investigation Report requested.","Police Certificate of Character requested."],session:["Sales Pal and MPOS understanding tested.","Final demonstration of Importance of Income by candidate.","Continuous Professional Development walkthrough.","Discovery Summary Evaluation completed with candidate's full Discovery performance scored across 10 dimensions."],assignments:["Discovery closes — candidate has final discussion with BM.","File assembly begins under BMA's coordination."],forms:["Form 10","Form 15","Form 16"]}]},{heading:"The Discovery Summary Evaluation — Form 11, the 10 dimensions",body:"Form 11 in the file index. Ten dimensions, each rated 1 (Unsatisfactory) to 7 (Excellent). The RM rates each dimension based on observed performance across the six modules. The total divided by 10 gives the average — and that average feeds the Form A scoring.",evaluation:[{num:"1",name:"Understanding the Sales Rep's job",what:"Can the candidate explain PAIDCAR and the role's daily reality?"},{num:"2",name:"Acceptance of job requirements",what:"Did they sign up for what the job actually is, with eyes open?"},{num:"3",name:"Completion of Project 100",what:"Substantive list with annotation, ranking, and next-action notes."},{num:"4",name:"Identification of potential markets",what:"Can they articulate which markets they will work and why?"},{num:"5",name:"Skill in learning telephone approach",what:"Call scripts, hesitation handling, voice control."},{num:"6",name:"Ability to set up appointments",what:"Did they actually book real first meetings from surveys/calls?"},{num:"7",name:"Skill in asking for / securing referred leads",what:"Ben Duffy approach; quality of referred lead capture."},{num:"8",name:"Skill in learning sales talk",what:"Importance of Income script delivery, fact-find handling."},{num:"9",name:"Emotional reaction to sales call",what:"How they handled the field observation in Module 4."},{num:"10",name:"Understanding the activity level required",what:"Have they internalised the calendar pace — daily, weekly?"}],closing:"Form 11 → Form A: average less than 4pts = 0; 5pts = 5; 6pts = 6; 7pts = 8. Round to nearest band, document the score on Form A."},{heading:"Quality vs Volume — the three market survey patterns",body:"The numbers tell three different stories. Volume alone is the floor. The shape of the data — average score, distribution of zeros — tells you what the candidate's first 90 days as an agent will look like.",patterns:[{name:"The Genuine Producer",volume:40,avg:72,zeros:0,color:"green",lesson:"Hits the standard with quality. Surveys show real conversations, varied scores, no zeros. This candidate's first 30 days as an agent will look like the surveys: real activity, real fact-finds, real first applications."},{name:"The Slow-but-Real Candidate",volume:22,avg:78,zeros:1,color:"amber",lesson:"Quality is excellent but pace is behind. Coach for pace before deciding. May be a quiet candidate building one-at-a-time — could be a fine agent with structure, could be a sign of low activity tolerance. Module 5 demonstrates the difference."},{name:"Activity Theatre — the Daniel pattern",volume:25,avg:6,zeros:14,color:"red",lesson:"High volume of submissions but the score distribution exposes it: 14 zeros means 14 surveys were filled in without real engagement. The candidate is feeding the form, not the prospect. Halt; address with the candidate; do not advance until the pattern changes."}]},{heading:"Three signals that predict Selection success",body:"These three signals — across all the Discovery activity — are the most reliable predictors of post-contract success. Watch for them.",callouts:[{big:"1",unit:"Discipline",label:"Completion of assignments between modules",subtext:"A candidate who shows up for Module 3 without Project 100 done is telling you what their first 90 days as an agent will look like.",color:"blue"},{big:"2",unit:"Quality",label:"Survey shape, not survey count",subtext:"40 surveys at avg 72 are real prospecting; 80 surveys at avg 6 with 14 zeros are activity theatre. The first agent will produce; the second will not.",color:"green"},{big:"3",unit:"Reaction",label:"Response to Module 4 field observation",subtext:"Cleanest single signal in Discovery. A candidate who walks out of an observation MORE engaged than they walked in is a candidate worth selecting.",color:"amber"}]}]},{id:"M3",number:3,title:"The Selection File — Form A, the 17 items, and the Selection Panel",estMinutes:15,sections:[{heading:"What the Selection File is for",body:"After Discovery, every candidate proceeding has a Selection File assembled in their name. The file is the document the approval authority — BM, VP Sales, or Selection Panel — actually reads. It tells the story of the candidate from the outside: qualifications, references, POP V7.0 result, Discovery performance, financial picture, background. A file that is incomplete or sloppy is not 'closer to ready' — it is sent back. Build it once, build it right, and the approval happens on the merits.",closing:"The index that follows is the OFFICIAL ordering per the Revised June 2021 INDEX for Inexperienced Agents. Use this exact sequence — 17 numbered items, with 1 having sub-letters a/b, and 17 having a list of compliance sub-items."},{heading:"The 17-item index — who completes each, when, and where it lives",cards:[{num:"1",title:"Form 1 — BM Letter / Recommendation",subtitle:"Branch Manager's recommendation, with optional supporting letter from Recruiting Officer",roles:[{role:"BMA",action:"drafts"},{role:"BM",action:"signs"}],when:"At file submission",note:"Required for every file going to VP Sales or Panel.",subs:[{letter:"a",title:"Branch Manager's Letters/Recommendation",note:"Required for every file"},{letter:"b",title:"Supporting Letter from Recruiting Officer",note:"Optional — highlights exceptional traits or addresses concerns"}]},{num:"2",title:"Form 2 — Memo Circulating Recruit's Name",subtitle:"Standard template; distributed to Sales Admin, VP Sales office, ABM",roles:[{role:"BMA",action:"drafts & sends"}],when:"Within 24-48 hours of First Interview"},{num:"3",title:"Form 3 — Agent Selection Criteria Form A",subtitle:"Revised Feb 2023 official scoring sheet — 8 dimensions, total dictates file routing",roles:[{role:"RM",action:"scores & signs"},{role:"ABM",action:"audits arithmetic"},{role:"BM",action:"signs"},{role:"BMA",action:"files"}],when:"Discovery close (Week 7)",note:"Total determines routing per Feb 2023 official: 60-80 BM Direct (file to Head of Sales); 50-59 Head of Sales decision (possible interview); under 50 mandatory interview with Head of Sales and/or Senior Manager Sales."},{num:"4",title:"Form 4 — Selection/Rejection Training Process Form",subtitle:"Operational tracker — every checkbox addressed (Job Description, Sales Contract, Persistency, Rated Sheets, Sales Pipeline, Time Management, Record Keeping, Code of Ethics, Commissions)",roles:[{role:"RM",action:"completes"}],when:"Discovery close"},{num:"5",title:"Form 5 — Letter of Application & Resume",subtitle:"From candidate, inclusive of personal email address",roles:[{role:"Candidate",action:"provides"},{role:"BMA",action:"files"}],when:"Discovery Module 1",note:"Single line item in the index — letter and resume together."},{num:"6",title:"Form 6 — Copies of Academic Qualifications",subtitle:"Mandatory — must correspond with #5 (resume)",roles:[{role:"Candidate",action:"provides"},{role:"BMA",action:"verifies"}],when:"Discovery Module 1",note:"If multiple qualifications listed on resume, all must be evidenced."},{num:"7",title:"Form 7 — Bring Your Own Device (BYOD)",subtitle:"Laptop OR Tablet — declared and recorded on the index",roles:[{role:"Candidate",action:"declares"},{role:"BMA",action:"records"}],when:"Discovery Module 1"},{num:"8",title:"Form 8 — Initial Selection Interview and Financial Statements",subtitle:"Inclusive of 3 References in the Finance Statements",roles:[{role:"Candidate",action:"completes"},{role:"RM",action:"reviews"}],when:"Discovery Modules 4-5"},{num:"9",title:"Form 9 — Predictor of Potential, POP V7.0",subtitle:"Inclusive of Manager's answered questions completed WITH candidate",roles:[{role:"BM",action:"authorises"},{role:"RM",action:"administers with candidate"}],when:"After BM-recruit meeting; before file build closes",note:"POP V7.0 is a Guardian Group company expense; BM authorises every administration personally."},{num:"10",title:"Form 10 — Discovery Summary Evaluation / Recommendation",subtitle:"10 dimensions × 1-7 scale, average computed",roles:[{role:"RM",action:"completes"}],when:"Discovery close",note:"Average feeds Form A — under 4 pts = 0; 5 pts = 5; 6 pts = 6; 7 pts = 8."},{num:"11",title:"Form 11 — Inspection Report",subtitle:"Home visit assessment — living conditions, environment",roles:[{role:"RM",action:"conducts & writes"}],when:"Discovery Module 3",note:"Questions arising on this report trigger automatic Selection Panel (see auto-triggers)."},{num:"12",title:"Form 12 — Two (2) Confidential Reports",subtitle:"RM interviews two separate references; 8 rating questions (E/G/F)",roles:[{role:"RM",action:"completes both"}],when:"1st in Module 3; 2nd in Module 5",note:"Covers desire for growth, reliability, teamwork, adaptability, decision-making, self-discipline, responsibility, community contribution. Same form completed twice — once per reference."},{num:"13",title:"Form 13 — Two (2) Interviewing Reports",subtitle:"Operational facts of each reference interview — completed by Recruiting Manager",roles:[{role:"RM",action:"completes both"}],when:"1st in Module 3; 2nd in Module 5",note:"At least one reference should be from previous employment — preferably a Manager or Supervisor. Same form completed twice — once per reference."},{num:"14",title:"Form 14 — Spouse / Partner / Parent Interview Form",subtitle:"Captures the consent and understanding of the candidate's primary support person",roles:[{role:"RM",action:"conducts"}],when:"Discovery Module 3"},{num:"15",title:"Form 15 — Summary Project 100",subtitle:"Copy of the last page of the Project 100 booklet",roles:[{role:"Candidate",action:"completes"},{role:"RM",action:"reviews & signs"}],when:"Discovery Module 6"},{num:"16",title:"Form 16 — Income Potential Analysis",subtitle:"Translates desired income into required first-year activity",roles:[{role:"Candidate",action:"completes with RM"}],when:"Discovery Module 6",note:"Used in Form A scoring (less than $7k = 0pts up to $15k+ = 12pts)."},{num:"17",title:"Form 17 — Other Information (Compliance Documents)",subtitle:"Seven sub-items required for the completion of files",roles:[{role:"Candidate",action:"provides"},{role:"BMA",action:"tracks & files"}],when:"Discovery & post-approval",subs:[{letter:"•",title:"Two (2) Passport photographs",note:"In business attire"},{letter:"•",title:"Proof of Address",note:"Compliance Requirement; authorisation letter if not in candidate's name"},{letter:"•",title:"Police Certificate of Good Character"},{letter:"•",title:"Copy of CBTT Provisional Salesman Licence"},{letter:"•",title:"Bank Statement"},{letter:"•",title:"NIS # and BIR #"},{letter:"•",title:"Recruit Identification: ID # / DP # / Other"}]}]},{heading:"Form A — how each dimension scores (Revised Feb 2023)",body:"This is the official Form A scoring sheet for Prospects with NO Insurance Sales Experience (Inexperienced Agents), Revised February 2023. Form A scores eight dimensions, totals them, and the total dictates the action band below. Note from the official sheet: minus one (-1) point per year of unemployment after the candidate's last job (e.g., 5 years employed but 2 years unemployed since → subtract 2 from the score given for 5 years).",scoring:[{name:"AGE",bands:[{standard:"Less than 25 years",points:0},{standard:"25 – 44 years",points:10},{standard:"45 – 54 years",points:5},{standard:"55 – 59 years",points:3},{standard:"Over 60 years",points:0}],note:"Under 25 or over 55 — auto Selection Panel trigger"},{name:"EDUCATION",bands:[{standard:"Less than 5 O'Levels",points:0},{standard:"Less than 5 O'Levels + short cert. course",points:3},{standard:"5 O'Levels (incl. Math OR English)",points:3},{standard:"5 O'Levels (incl. Math AND English)",points:5},{standard:"A'Levels / Diploma (accredited body)",points:6},{standard:"BSc / BA (Degrees)",points:8},{standard:"MBA / EMBA or related",points:10}],note:"Below minimum standard — auto Selection Panel trigger"},{name:"DISCOVERY SUMMARY EVALUATION",bands:[{standard:"Less than 4 points",points:0},{standard:"5 points",points:5},{standard:"6 points",points:6},{standard:"7 points",points:8}],note:"From Form 11 — 10 dimensions averaged"},{name:"EMPLOYMENT — Consecutive (general work experience)",bands:[{standard:"Less than 1 year",points:0},{standard:"1 year",points:1},{standard:"2 years",points:2},{standard:"3 years",points:3},{standard:"4 years",points:4},{standard:"5 years",points:5},{standard:"6 – 9 years",points:9},{standard:"10 years +",points:10}],note:"Subtract 1 pt per year of unemployment after last job"},{name:"MARITAL STATUS",bands:[{standard:"Single",points:0},{standard:"Common Law < 5 yrs, no children",points:3},{standard:"Common Law < 5 yrs with children",points:5},{standard:"Single Parent",points:5},{standard:"Common Law 5+ yrs, no children",points:7},{standard:"Married, no children",points:7},{standard:"Common Law 5+ yrs with children",points:10},{standard:"Married with children",points:10}]},{name:"CAR OWNERSHIP",bands:[{standard:"Yes — vehicle in candidate's name",points:10},{standard:"No — or vehicle in third party's name",points:0}],note:"If vehicle is in third party's name, authorisation letter required (filed under Form 17 — Other Information)"},{name:"POP 7 — Probability of Success",bands:[{standard:"41 – 60 % (Average) — proceed",points:6},{standard:"61 – 80 % (Above Average) — proceed",points:8},{standard:"81 – 100 % (Excellent) — proceed",points:10}],note:"POP 7 below 21% — auto Selection Panel trigger"},{name:"INCOME POTENTIAL",bands:[{standard:"Less than $7,000",points:0},{standard:"$7,000 – $8,999",points:2},{standard:"$9,000 – $11,999",points:5},{standard:"$12,000 – $14,999",points:10},{standard:"$15,000 and over",points:12}],note:"Monthly figure — from Form 16 (Income Potential Analysis)"}]},{heading:"The three action bands — verbatim from the Revised Feb 2023 sheet",body:"Add the eight dimensions. The total places the candidate in one of three bands below. The wording is taken directly from the Feb 2023 official Form A:",bands:[{range:"60 – 80",color:"green",label:"Branch Manager Recommendation — file to Head of Sales",action:"Agent hired on recommendation of Branch Manager, subject to ethical and financial considerations. Complete file sent to the Office of the Head of Sales.",role:"BM"},{range:"50 – 59",color:"amber",label:"Head of Sales Decision",action:"Complete file sent to the Office of the Head of Sales for decision. Person may be required to attend an interview with the Head of Sales and/or Senior Manager, Sales at the discretion of the Head of Sales.",role:"VP"},{range:"< 50",color:"red",label:"Head of Sales Interview Mandatory",action:"Complete file sent to the Office of the Head of Sales. Person will be required to attend an interview with the Head of Sales and/or Senior Manager, Sales. The decision of the Head of Sales is final.",role:"Panel"}],closing:"Note: The Feb 2023 Form A removed the printed 'Issues Triggering Automatic Selection Panel' section that appeared on Feb 2021 versions. The four conditions below remain branch operational flags — the RM and BMA must surface them in Form 1a (the BM Recommendation Letter) regardless of total score."},{heading:"Four operational flags — surface these in the BM Recommendation regardless of band",body:"These were 'auto-Selection Panel' triggers under the older Feb 2021 Form A. Under the Feb 2023 official, every file routes to the Head of Sales — but these four signals still represent material risk and must be highlighted explicitly in Form 1a (BM Recommendation Letter) so the Head of Sales sees them, irrespective of where the Form A total lands.",triggers:[{num:"1",title:"Minimum education standard not achieved",description:"Candidate scored 0 points on the EDUCATION dimension (less than 5 O'Levels)."},{num:"2",title:"Candidate is less than 25 OR over 55 years old",description:"AGE dimension scored 0 or 3 only — under-25 or over-55."},{num:"3",title:"POP V7.0 score is less than 21%",description:"POP 7 Probability of Success below the threshold for any Form A scoring band."},{num:"4",title:"Questions arising on the Inspection Report",description:"Anything unresolved or unfavourable from Form 11 — the home visit assessment."}]},{heading:"Who decides — Head of Sales / Senior Manager Sales",body:"Under the Revised Feb 2023 Form A, the routing simplified: every Form A file goes to the Office of the Head of Sales. Under-50 files mandatorily include an interview with the Head of Sales and/or Senior Manager Sales. The Head of Sales decision is final. The historical Selection Panel composition (VP Sales, Senior Manager L&D, HC member, Senior Sales Consultant) may still be convened at the Head of Sales' discretion — confirm with the Head of Sales office at the time of each file submission.",panel:[{role:"VP",title:"Head of Sales",note:"Primary decision authority for every Form A file. Decision is final on files under 50."},{role:"VP",title:"Senior Manager, Sales",note:"Joins the interview for under-50 files; may also be invoked on 50-59 files at Head of Sales discretion."},{role:"HC",title:"Human Capital (if Panel convened)",note:"Historical Selection Panel composition — may still be invoked at Head of Sales discretion."},{role:"VP",title:"Senior Sales Consultant (if Panel convened)",note:"Historical Selection Panel member — at Head of Sales discretion only."}]},{heading:"Confidential Reports (Form 12, two copies) and Interviewing Reports (Form 13, two copies) — what they cover",body:"Two copies of each form are required, each completed for a different reference. The Recruiting Manager — not the candidate — completes them based on direct interviews with the candidate's references. At least one of the four reports should be from the candidate's previous employment, preferably a Manager or Supervisor.",groups:[{label:"Confidential Report — what's captured",bullets:["How the reference knows the candidate.","How long they have known them, and in what environment.","Why they would or would not recommend the candidate for a sales career.","Eight rating questions on a scale of E (Excellent), G (Good), F (Fair) — covering: desire for growth, reliability/honesty, teamwork, adaptability, decision-making, self-discipline for long hours, sense of responsibility, and community contribution."]},{label:"Interviewing Report — what's captured",bullets:["Who the reference is (name, occupation).","Relationship to the candidate.","How the interview was conducted (face-to-face, virtual).","Summary with explicit positives and explicit negatives."]}]},{heading:"Why this stage is where files most often fail",body:"Three failure patterns at the file stage:",bullets:["Missing documents. The BMA checks the index against the actual file and flags anything missing before the file goes anywhere. A file with 14 of 17 items is not 'almost ready' — it is not ready.","Form A miscalculation. Usually happens when the unemployment subtraction is missed, or when Discovery Summary is recorded without an actual computed average. The ABM cross-checks arithmetic before submission.","Missing the Panel triggers. A candidate scoring 62 with a POP probability of 19% is still going to Panel because of trigger 3 — but the file routes BM-Direct unless someone caught it. The BMA catches these."]}]},{id:"M4",number:4,title:"Induction and Probation — From contract to permanent",estMinutes:12,sections:[{heading:"The shape of the first year",body:"After approval, the new Sales Representative is enrolled in Anti-Money Laundering training on GGLDC immediately. They receive their Agent number from Sales Administration, a GLOC email address, and complete OFT certification (the branch submits a copy of the OFT cert to TD). Boot Camp follows — a 25-session company training program covering ethics, products, sales tools, application processing, and compliance. Induction runs in parallel or immediately after Boot Camp. The branch contract is issued once Induction is complete, the State Licensing Exam through the T&T Insurance Institute is in motion, and the pre-contract production target has been met. Then the recruit enters probation."},{heading:"Induction — the objective",body:"The objective of Induction is to prepare the new Sales Representative for field efficiency. The model is PESOS: Prepare, Explain, Show, Observe, Supervise. The Recruiting Manager runs Induction. Induction can begin once the candidate has their Provisional Long-Term State License. It must be complete by the fifth week following the close of Boot Camp. There is a 6-module Induction guide that the branch follows. To 'complete' Induction the new SR must: apply for certification through the Branch Manager to the VP Sales, be certified to conduct OFT, complete all Induction assignments, and submit a Marketing Plan to the VP Sales for review of personal goals and objectives for the balance of the calendar year."},{heading:"The New Agent Development Plan",body:"Part B of the Induction Application. This is the candidate's first-year business plan. It states why they are in business (mission statement), what they expect to accomplish in Year 1 (budget, income objective, other objectives), and how they plan to achieve it (market penetration plan, first-five-weeks activity plan, master timetable). The plan converts the candidate's desired income into required activity: First-Year Commission required, Paid Volume required, Written Volume required, Premiums required, Applications required, Closing Interviews required (Sales-to-CI ratio of 1:5), Opening interviews required, and New Qualified Prospects required to replace those eliminated. The Sales Manager completes the Performance Management Plan section: how Planning, Monitoring, Reviewing, Improving Performance, and Measurement will be handled, with proposed meeting frequencies."},{heading:"Probation period and pre-contract production target",body:"The GSAP V4.2 baseline standard is a six-month probation period with a pre-contract production target of TT$126,000 Annualized Premium Income, against the company's annual minimum standard of $300,000 settled API. This branch operates on a seven-month probation period with a $105,000 API target during probation. The seven-month standard is what you measure against and what the Recruit Tracker reflects. Where there is variance between the GSAP baseline and the branch standard, the branch standard applies operationally — but the file documentation should be clean to either standard."},{heading:"Weekly Sales Activity discipline",body:"Every Monday during Induction and through probation, the new SR submits the Sales Activity Tool to the Sales Manager — turned over in person, not emailed and forgotten. Sales Planning logged each week covers: telephone calls, Centers of Influence, new prospects, appointments secured, confirmed first meetings (Fact Find and Feeling interviews), closing interviews and sales, administration, training, branch and unit meetings, joint field work. The Sales Manager reviews against the New Agent Development Plan targets. Performance Management reviews are weekly — one per week is the minimum cadence."},{heading:"The 12-month milestone — Clause 3d of the contract",body:"If $250,000 API and $100,000 commissions have not been achieved by month 12 of the contract, the contract terminates. This is mechanical, not discretionary. The branch tracks this milestone from the day the contract is signed. An agent who is at month 8 with $90,000 API is not going to make the milestone without a specific, dated, intervention plan. The job of the BM and Unit Manager is to recognise the gap by month 6, build the plan, and either close the gap or prepare the agent for the termination conversation honestly. The cruelty in this work is not the termination — it is keeping someone on probation for another six months pretending the milestone is still in reach when the math no longer supports it."},{heading:"Termination triggers — Clauses 3a, 3b, 3d, 3e",body:"Four contract clauses govern termination. Each has a different trigger and a different point in time when it applies. Knowing them mechanically — not interpretively — is what allows the branch to act on time.",triggers:[{num:"3a",title:"Quotas unlikely to be met",description:"The Company forms the opinion that the probation quotas are unlikely to be met. Termination at any time during probation."},{num:"3b",title:"End-of-probation failure",description:"Failure to meet the 7-month probation quota with no extension granted. Termination at the end of the probation period."},{num:"3d",title:"Month 12 milestone failure",description:"$250,000 API and $100,000 commissions not achieved by the 12-month contract anniversary. Contract terminates — mechanical, not discretionary."},{num:"3e",title:"Summary termination",description:"Fraud, one or more months without attendance, loss of registration, or regulatory non-compliance. Immediate termination."}],closing:"The branch may also grant a probation extension at the agent's request when warranted. The criteria are clear: documented coaching plan, specific extended quotas, and the case for closure in writing from the UM."},{heading:"Production milestones — what the branch measures, when",body:"Three production gates structure the first year. Knowing them numerically — not interpretively — is what allows the branch to intervene on time rather than after the fact.",callouts:[{big:"$105k",unit:"Pre-contract API",label:"Branch standard before contract is issued",subtext:"Must be produced during probation period before contract activation. GSAP V4.2 baseline is $126k / 6 months; this branch operates 7 months / $105k.",color:"blue"},{big:"7",unit:"Months",label:"Branch probation window",subtext:"Clock starts Day 1 of contract. Below quota at Month 7 → extension OR termination.",color:"amber"},{big:"$250k",unit:"API at Month 12",label:"Clause 3d milestone — mechanical, not discretionary",subtext:"Plus $100k commissions. If both not achieved by contract anniversary, the contract terminates.",color:"red"},{big:"Monday",unit:"Every week",label:"Sales Activity Tool — turned over in person",subtext:"Missing 3 consecutive Monday submissions is the leading indicator of induction problems. ABM-level escalation trigger.",color:"green"}]},{heading:"What makes Induction succeed or fail",body:"Three patterns from the recent cohort. First — and the biggest — is the weekly cadence. Agents whose Unit Manager genuinely held the Monday review every week, in person, with the Sales Activity Tool, made probation. Agents who had three or four 'we'll catch up next week' weeks in a row never closed the gap. The cadence matters more than any single coaching session. Second is the joint field work. Agents who went on three or more joint calls with their UM in the first 60 days of probation outperformed agents who went on one or zero. Third is the Project 100 quality going into Induction. An agent who walks into Induction with a real Project 100 — annotated, ranked, with concrete next-action notes on the top 25 — has a calendar to work for week 1. An agent who walks in with a phone book of names does not."}]},{id:"M5",number:5,title:"Worked example — The Felicia Rampersad file",estMinutes:17,sections:[{heading:"Why this file",body:"Felicia Rampersad was contracted by this branch on 1 August 2025 under Gary Sookdeo's unit. As of June 2026 she is on probation extension — she did not meet the initial 7-month probation quota and was granted an extension at her request. Her file was not a failure of GSAP V4.2 procedure: the procedures were followed, the documentation was complete, the Selection Panel was convened where required and approved her. The lesson is more useful than that. The file gave the branch a specific structural caution, the branch knew about it at the time, and the branch did not build the right structure around the caution. Walking through Felicia's file shows what a complete file looks like — and what acting on the signals in a complete file should look like."},{heading:"Background — the headline facts",callouts:[{big:"25",unit:"Years old",label:"DOB 28 July 1999",subtext:"Just clears the under-25 auto-Panel trigger.",color:"stone"},{big:"BSc",unit:"Mgmt Studies",label:"Major: Accounting · Minor: HR Management",subtext:"Score: 8 pts on Form A Education line.",color:"blue"},{big:"2",unit:"Years employment",label:"General work experience post-degree",subtext:"Score: 2 pts on Form A Employment line.",color:"stone"},{big:"$11,160",unit:"Income potential",label:"Monthly figure on Form 17",subtext:"Sits in the $9k-$11,999 band → 5 pts on Form A.",color:"amber"}],closing:"RM: Gary Sookdeo · BM: Ricky Rampersad · File submitted to ESP: 28 March 2025 · POP 7 administered: 12 January 2025 · Contract signed: 1 August 2025."},{heading:"Felicia's POP 7 scorecard — what the assessment said",body:"POP 7 returned a Final Rating of 3 (Proceed with Caution). That rating is the math output — the underlying scale scores tell the story of why. Of seven scales, six landed in the green; one — Independence Potential — landed deep in the red Very Dependent zone at -32. That single scale drove the -1 penalty that brought the Final Rating from 4 to 3.",popScorecard:{candidate:"Felicia Rampersad",scores:{PS:42,EP:39,AP:4,IP:-32,SD:49,LM:64,CR:76,PO:26,AO:12},finalRating:{steps:[{label:"PS=42 → 30-44 band → Base rating",value:4},{label:"EP=39 ≥ 30 — no penalty",value:0},{label:"AP=+4 ≥ -15, but IP=-32 < -25 → -1 penalty",value:-1},{label:"SD=49, LM=64, CR=76 all ≥ 25 — no penalty",value:0}],rating:3,label:"Proceed with Caution"}},closing:"The Probability of Success on Form A was recorded at 50% — placing her in the 41-60% Average band, scoring 6 points on the POP7 line of Form A."},{heading:"What IP = -32 actually means operationally",body:"Independence Potential measures the candidate's natural relationship to external structure. The 'Very Dependent' band is reached at -25 and below. Felicia at -32 is well into that band — the POP 7 interpretation reads: 'will benefit from a team environment, supervision, structured pipeline.' Operationally, this is what the branch had to wrap around her:",bullets:["Daily check-ins in the first 30 days (not weekly — daily).","Weekly fact-find review on a fixed day, in person.","Joint field calls scheduled 30 days out in advance.","30/60/90-day check-ins with the BM herself, not relayed through the UM.","A Unit Manager who is actually accessible — not a UM who is half-present."],closing:"An IP=-32 candidate is not lazy. They are wired to work within structure that someone else holds. When no one holds the structure, they freeze. The branch can build that structure intentionally — and when it does, IP=-32 candidates succeed in this career."},{heading:"Felicia's Form A — the scoring sheet visualised",body:"Form A scored across the eight dimensions: total 38 points. That places her in the 'less than 50' band — mandatory interview with the Head of Sales and/or Senior Manager Sales per the Feb 2023 official. The interview approved her file.",formA:{candidate:"Felicia Rampersad",lines:[{dimension:"AGE",value:"25 years (25-44 band)",points:10,max:10},{dimension:"EDUCATION",value:"BSc Management Studies (Major Accounting / Minor HR)",points:8,max:10},{dimension:"DISCOVERY SUMMARY EVALUATION",value:"Very Good — rated 6 / 7",points:7,max:8},{dimension:"EMPLOYMENT",value:"2 years general work experience",points:2,max:10},{dimension:"MARITAL STATUS",value:"Single",points:0,max:10},{dimension:"CAR OWNERSHIP",value:"No — father's vehicle with authorisation letter",points:0,max:10},{dimension:"POP 7 PROBABILITY",value:"50% (41-60% Average band)",points:6,max:10},{dimension:"INCOME POTENTIAL",value:"$11,160 monthly ($9k-$11,999 band)",points:5,max:12}],total:{score:38,band:"Less than 50",action:"Selection Panel mandatory — complete file to VP Sales; Panel convened; decision final.",color:"red"}}},{heading:"Discovery and Selection — what was actually done (file is complete)",body:"By any procedural measure, Felicia's file was textbook complete. Every element of the 17-item index was present and properly executed.",bullets:["GGLDC New Candidate Discovery course completed across all lessons by 28 March 2025: Prospecting, Contacts, Importance of Income, Fact Find, Handling Objections, Closing, Sales Pal Web/Mobile, MPOS, plus all 13+ product modules.","Ten orientation classes attended.","Eighty market surveys submitted via the branch's digital workflow — substantial volume.","Form 4 (Selection/Rejection Training Process Form): all 9 checklist items YES (Job Description, Sales Contract, Persistency, Rated Sheets, Sales Pipeline, Time Management, Record Keeping, Code of Ethics, Commissions).","Form 12 — Two (2) Confidential Reports and Form 13 — Two (2) Interviewing Reports — both complete with two references.","Form 11 — Inspection Report — completed.","Form 14 — Spouse/Partner/Parent Interview — completed.","Form 8 — Initial Selection Interview and Financial Statements — completed with declared figures (≈$20k, $35k, $55k references)."],closing:"RM's comment on Form 4: 'Felicia is very disciplined and hard-working. With the proper guidance, she will definitely prosper in this industry.' That comment turned out to be exactly right about Felicia — and exactly wrong about what the branch did with the guidance part."},{heading:"The file's prediction vs what happened",processFlow:[{label:"Head of Sales Interview",detail:"Convened (Form A 38 < 50). Interview with Head of Sales / Senior Manager Sales approved her file.",color:"amber"},{label:"Contract Day 1",detail:"1 August 2025. 7-month probation clock starts. $105k API target.",color:"stone"},{label:"Month 7",detail:"Quota missed. Extension granted at her request.",color:"amber"},{label:"Today (June 2026)",detail:"Seven months into extension. Production below revised quota.",color:"red"}],closing:"The file's POP 7 said 'will benefit from team environment, supervision, structured pipeline.' If that structure had been built — explicitly, in writing, with named owners — Felicia might be off probation now. The procedure followed itself; what didn't follow was the action on what the procedure surfaced."},{heading:"The lesson — the question the file actually asks",body:"If you have a candidate with a structural caution on their POP — IP, EP, AP, SD/LM/CR — the question for the branch is not 'do we proceed?' The Panel and the BM answer that. The harder question, the one that determines whether the candidate makes it, is the one below.",bigCallout:{big:"What",unit:"structure",label:"Are we building, in writing, with named owners, BEFORE this candidate enters probation?",subtext:"POP doesn't disqualify candidates. POP tells you what each candidate needs. Felicia's file is the proof that the standards are only useful if the branch acts on what they say.",color:"stone"}}]}],MODULE_6_BY_ROLE={BMA:{title:"Your role as BMA — Forms, dates, and the standards we now hold",sections:[{heading:"Your role in one sentence",body:"You are the process custodian of the GSAP V4.2 pipeline at this branch. Every form, every checkpoint, every handoff between Discovery, Selection, Induction, and Probation routes through your verification before it advances. The branch is strengthening this gate, and your role is now more operationally visible than before. The BM and ABM make decisions; you ensure those decisions are made on complete, current, properly-formed files."},{heading:"The recruit lifecycle — what happens when, and where you act",groups:[{label:"Day 0 — First Interview conducted by RM",bullets:["RM submits the FI Profile to you the same day.","You log the recruit in the Recruit Tracker.","You confirm with the RM that the BM-recruit meeting is scheduled within 72 hours.","POP 7.0 must NOT be initiated until that meeting has occurred and the BM has authorised it in writing. You hold this gate."]},{label:"Day 1–3 — BM-recruit meeting",bullets:["If the BM authorises, you book POP administration with the candidate within 7 days.","You enrol the candidate in GGLDC on the 7-week limited-access window using their personal email address.","You draft Form 2 (Memo Circulating Recruit's Name) and route to Sales Admin, the VP Sales office, and the ABM."]},{label:"Week 1–7 — Discovery period (RM runs the 6 modules)",lead:"You verify forms flow into the file as they should be delivered, by module:",bullets:["End of Module 1 — Form 5 (Letter of Application and Resume), Form 6 (Academic Qualifications), Form 7 (BYOD).","End of Module 3 — Form 11 (Inspection Report), Form 12 (1st Confidential Report — first of two), Form 14 (Spouse/Partner/Parent Interview).","End of Module 5 — Form 12 (2nd Confidential Report — both copies now in file), Form 13 (both Interviewing Reports completed), Form 8 (Initial Selection Interview and Financial Statements with 3 references).","End of Module 6 — Form 10 (Discovery Summary Evaluation), Form 15 (Summary Project 100), Form 16 (Income Potential Analysis), all sub-items of Form 17 (personal documents)."]},{label:"End of Week 7 — Discovery closes, file assembled",bullets:["You verify completeness against the 17-item index (next section).","You cross-check Form 3 (Form A) arithmetic — particularly the unemployment subtraction.","You confirm whether any of the four automatic Selection Panel triggers apply (education, age, POP V7.0 probability under 21%, Inspection Report).","You draft Form 1a (Branch Manager's Recommendation Letter) for the BM's review and signature."]},{label:"File submission — routing by Form A band",bullets:["60–80 (BM Direct): file to VP Sales after BM signs Form 1a.","50–59 (VP Decision): file to VP Sales for decision.","Under 50 OR any auto-trigger (Selection Panel): you confirm the next Panel date and ship."]},{label:"Approval communicated",bullets:["Sales Admin notifies the branch.","You file the approval letter.","You request the Agent number.","You request the GLOC email address.","You confirm OFT certification — the branch submits the OFT cert to TD."]},{label:"Boot Camp + Induction",bullets:["RM runs the 6-module Induction Program.","You coordinate DocuSign signatures for Induction certification.","You track weekly Sales Activity Tool submissions.","Deadline — Induction Application and New Agent Development Plan submitted to VP Sales by Week 5 post-Boot-Camp-close."]},{label:"Contract issued",bullets:["Induction certification confirmed by VP Sales.","Pre-contract production target met ($105k API, branch standard).","Contract signed before a witness; returned to Sales Admin.","Day 1 of the 7-month probation clock begins."]},{label:"Probation (7 months, branch standard)",bullets:["Weekly Sales Activity Tool submissions every Monday.","Monthly UM-and-ABM review with the BM.","30-, 60-, and 90-day check-ins on flagged probationers."]},{label:"Month 7 — probation gate",bullets:["Quota met: continue toward the Month 12 milestone.","Below quota: ABM-led extension request to the BM, OR termination paperwork."]},{label:"Month 12 — Clause 3d milestone",bullets:["Target: $250,000 API and $100,000 commissions.","If not met, the contract terminates."]}]},{heading:"Forms you originate or co-author",groups:[{label:"Form 1a — Branch Manager's Recommendation Letter",bullets:["You draft, the BM reviews and signs.","Required for every file going to VP Sales or to the Selection Panel.","Should reference the recruit's strengths against this branch's agent profile.","Should address any flags raised in POP 7 or Form A.","Should explicitly recommend (or decline to recommend) advancing."]},{label:"Form 1b — Supporting Letter from Recruiting Officer (optional)",bullets:["Used when the RM wants to highlight exceptional traits.","Or used to pre-emptively address concerns the file will surface."]},{label:"Form 2 — Memo Circulating Recruit's Name",bullets:["Standard template: recruit's full name, role (Inexperienced Agent / Experienced Agent), RM's name, BM's name, date of First Interview, branch code.","Distributed to Sales Admin, VP Sales office, and the ABM.","Filed in the recruit's folder."]},{label:"GGLDC enrolment (procedural, not a numbered form)",bullets:["7-week access on the candidate's personal email address.","Confirm with the candidate that the GGLDC welcome email arrived and they can log in.","If Discovery extends beyond 7 weeks, you re-enrol."]}]},{heading:"The 17-item file checklist — your pre-submission audit",body:"Use the exact order below per the Revised Jun 2021 official INDEX for Inexperienced Agents. Do not ship the file missing any item without a written waiver from the BM.",bullets:["(1a) Branch Manager's Letters/Recommendation — Form 1a.","(1b) Supporting Letter from Recruiting Officer — Form 1b (optional, highlighting exceptional traits or addressing concerns).","(2) Memo circulating Recruit's name — Form 2.","(3) Agent Selection Criteria Form A — Form 3 (scored, signed by Recruiting Officer and Branch Manager).","(4) Selection/Rejection Training Process Form — Form 4.","(5) Letter of Application and Resume from candidate, inclusive of personal email address — Form 5.","(6) Copies of Academic Qualifications — Form 6 (Mandatory; must correspond with #5).","(7) Bring Your Own Device (BYOD): Laptop or Tablet — Form 7.","(8) Initial Selection Interview and Financial Statements with 3 References — Form 8.","(9) Predictor of Potential — POP V7.0, inclusive of Manager's answered questions completed with candidate — Form 9.","(10) Discovery Summary Evaluation / Recommendation Form — Form 10.","(11) Inspection Report — Form 11.","(12) Two (2) Confidential Reports, completed by the Recruiting Manager — Form 12 (same form completed twice, once per reference).","(13) Two (2) Interviewing Reports, completed by the Recruiting Manager — Form 13 (same form completed twice, once per reference).","(14) Spouse/Partner/Parent Interview Form — Form 14.","(15) Summary Project 100 (copy of last page in Project 100 booklet) — Form 15.","(16) Income Potential Analysis — Form 16.","(17) Other Information — Form 17, comprising: Two (2) Passport photographs in business attire, Proof of Address (Compliance Requirement, with authorisation letter if not in candidate's name), Police Certificate of Good Character, copy of CBTT Provisional Salesman licence, Bank Statement, NIS # and BIR #, Recruit Identification (ID# / DP# / Other)."]},{heading:"Correspondence protocol — sensitive matters",body:"Sensitive correspondence between the BM and the ABM, or between the BM and a UM on a disciplinary matter, routes through you as active correspondent. The pattern:",bullets:["Routine and operational: BM-to-staff directly, no routing through you.","Sensitive and documentable: BM drafts, you send it under your own signature with the BM cc'd, recipient replies to you. This depersonalises conflict and creates a clean documentation trail.","Consequential — repeated insubordination, hiring escalation, branch standards correction: route through you with Gregg Mannette (VP Sales) cc'd for executive visibility.","Hold the discretion on when Gregg is cc'd. Routine matters do not get Gregg copied; copying him on routine items dilutes the signal."]},{heading:"Re-take and certification triggers",body:"You alert Ricky to a Standards Test re-take whenever any of the following occur:",bullets:["A recruit under any line resigns during probation.","A recruit fails to reach contract for any reason.","Ricky requests a re-take based on observed practice.","A recruit is terminated under Clauses 3a, 3b, 3d, or 3e."]},{heading:"The first 30 days — what changes for you now",body:"Three operational tightenings effective immediately:",bullets:["File completeness audit before any submission. Use the 17-item checklist as a literal checklist, not a memorised list. No file ships incomplete.","BM-recruit-meeting confirmation. Every FI Profile that lands on your desk gets confirmed-or-scheduled within 24 hours. POP 7.0 administration is not booked until the BM meeting has happened.","Correspondence trail discipline. Sensitive matters flow through you with proper cc lines. You are the documentation infrastructure."]}]},UM:{title:"Your role as Unit Manager — Forms, dates, and accountability",sections:[{heading:"Your role in one sentence",body:"You are the recruit's primary advocate during Discovery and Selection, and the file is principally your work product. You conduct the First Interview, you run the six Discovery sessions, you complete the bulk of the forms in the file, and you make the recommendation that anchors the BM's approval decision. Once a recruit is contracted, you are their direct supervisor through Induction and probation."},{heading:"Forms you are principally responsible for",bullets:["Form 3 — Agent Selection Criteria Form A. You score and sign; the BMA cross-checks the arithmetic.","Form 4 — Selection/Rejection Training Process Form. The operational tracker, every check-item addressed.","Form 10 — Discovery Summary Evaluation. Ten dimensions rated 1–7, average computed and recorded.","Form 11 — Inspection Report. Completed after a home visit.","Form 12 — Two (2) Confidential Reports. Same form completed twice, once per reference, face-to-face or virtually.","Form 13 — Two (2) Interviewing Reports. Operational facts of each reference interview — same form completed twice.","Form 14 — Spouse / Partner / Parent Interview Form.","Form 15 — Summary Project 100. The last page of the candidate's Project 100 booklet.","Form 16 — Income Potential Analysis.","Reference checks themselves — 3 to 4 references, at least one of whom must be from the recruit's previous employment (preferably a Manager or Supervisor)."]},{heading:"Discovery timeline — what's due in each module",groups:[{label:"By end of Module 1 — A Sales Representative's Week",bullets:["First Project 100 completed.","10 market surveys submitted via the branch's digital workflow (recruit fills out the digital form themselves, auto-timestamped).","Discovery Manual Part 1 read; Check Yourself questions answered.","GGLDC Module 1 Lessons 1 and 2 (Prospecting and Contacts) completed."]},{label:"By end of Module 2 — Identifying Markets",bullets:["Second Project 100 completed.","10 more market surveys (20 cumulative).","Marketing Plan with the candidate's own desired income.","Credibility Speech drafted; call scripts prepared.","Discovery Manual Part 2 read."]},{label:"By end of Module 3 — Meeting Marketplace",bullets:["10 more market surveys (30 cumulative).","Discovery Manual Part 3 read; branch/agency meeting attended.","You complete Form 11 (Inspection Report) and Form 12 (1st Confidential Report — one of two)."]},{label:"By end of Module 4 — Making a Sales Presentation",bullets:["10 more market surveys (40 cumulative — meeting the GSAP V4.2 expected total).","Discovery Manual Part 4 read; sales call observation conducted.","Discovery Manager's Evaluation updated."]},{label:"By end of Module 5 — Closing, Persistency, Policy Delivery",bullets:["10 more market surveys (50 cumulative — exceeding the standard).","Importance of Income demonstrated by the candidate for final feedback.","Sales Pal and MPOS introduced.","You complete Form 12 (2nd Confidential Report — both copies now in file) and Form 13 (both Interviewing Reports).","Form 8 (Initial Selection Application + Financial Statements with 3 references) collected."]},{label:"By end of Module 6 — Marketing Plan / Selection",bullets:["Final demonstration of Importance of Income.","Form 11 (Discovery Summary Evaluation) completed and averaged.","Investigation Report requested; Police Certificate of Character requested.","POP 7 Interview Questions completed with the candidate."]}]},{heading:"Selection File build — what's due when Discovery closes",body:"At the moment Discovery closes (end of Week 7), the following must be in the file or on the BMA's desk:",bullets:["Form 3 (Form A) — scored, signed by you, sent to BMA for cross-check.","Form 4 (Selection/Rejection Training Process Form) — all check-items addressed.","Form 10 (Discovery Summary Evaluation) — average rating computed.","Form 11 (Inspection Report) — already in file from Module 3.","Form 12 — Two (2) Confidential Reports — both copies complete from Modules 3 and 5.","Form 13 — Two (2) Interviewing Reports — both copies complete.","Form 14 (Spouse Interview) — in file from Module 3.","Form 15 (Summary Project 100).","Form 16 (Income Potential Analysis).","Your recommendation to the BMA on routing: BM Direct (60-80), VP Decision (50-59), or Selection Panel (under 50, or any of the four auto-triggers). You flag the routing; the BM decides."]},{heading:"Induction timeline — what you do each week",groups:[{label:"Week 1 — Module 1 of the 6-module Induction Program",bullets:["Career path overview.","Ethics, compliance, confidentiality.","KASH success formula.","Expectations conversation re-confirmed.","Sales Pal and OAS Integration training begins; agent inputs Project 100 names."]},{label:"Week 2 — Module 2",bullets:["Prospecting role-play.","Telephone objections.","Referred lead and centre-of-influence scripts.","Products training begins (Life Evolution, Flexiterm, IPI, SPIA, Xpress Life, Praesidia, EconoLife, Reliance, Family Income Benefit)."]},{label:"Week 3 — Module 3",bullets:["Fact Find and Feeling Meeting.","Decision Meeting; presentation skills.","Prepare for joint field work; first prospecting calls made by the agent."]},{label:"Weeks 4–5 — Modules 4 through 6",bullets:["Continued products training.","Application procedures, underwriting rules, policy delivery, receipt book procedures, declaration forms."]},{label:"Every Monday throughout Induction",bullets:["Weekly Sales Activity Tool turned over to you in person.","Review covers: telephone calls, centres of influence, new prospects, appointments secured, confirmed first meetings (Fact Find and Feeling interviews), closing interviews and sales, administration, training, branch meetings, joint field work."]},{label:"By end of Week 5 post-Boot-Camp-close",bullets:["Induction Application for Certification submitted by the BM to VP Sales.","New Agent Development Plan (Appendix 3) submitted — you author the bulk of the Performance Management Plan section."]}]},{heading:"Probation timeline — milestones, extensions, terminations",groups:[{label:"Day 1 of contract",bullets:["7-month probation clock starts.","Branch standard pre-contract production target: $105,000 API.","Monday Sales Activity Tool review begins, in person, every Monday without exception."]},{label:"Days 1–60 — early structure",bullets:["Joint field calls scheduled out 30 days at a time.","Three joint calls minimum in the first 60 days for any agent with a structural POP caution (IP under -25, EP under 30, AP under -15, or PS under 30)."]},{label:"30-, 60-, 90-day check-ins",bullets:["30-day check-in: you and the ABM.","60-day check-in: you, ABM, and BM.","90-day deep review: is the agent on pace? If not, what specific intervention plan is in place?"]},{label:"Months 4–5 — pace assessment",bullets:["Pace shared with the BM.","Below 50% of pro-rata API at month 5 — termination paperwork should begin in parallel with continued coaching."]},{label:"Month 7 — probation gate",bullets:["Quota met: continue toward Month 12 milestone.","Below quota: written extension request from you to the BM with specific extended quotas, coaching plan, and the case for closure. The BM decides."]},{label:"Month 12 — Clause 3d milestone",bullets:["Target: $250,000 API and $100,000 commissions.","If not met, contract terminates."]},{label:"Other termination triggers",bullets:["Clause 3a — Company forms the opinion that quotas are unlikely to be met. Terminable at any time.","Clause 3b — failure to meet 7-month probation quotas with no extension granted. At end of probation.","Clause 3e — summary termination for fraud, one or more months without attendance, loss of registration, or regulatory non-compliance. Immediate."]}]}]},ABM:{title:"Your role as Asst. Branch Manager — Supervisory checkpoints and authority",sections:[{heading:"Your role in one sentence",body:"You supervise the Unit Managers and surface patterns to the Branch Manager. You do not have unilateral authority on POP requests, hires, or terminations — those rest with the BM — but you do have a unique vantage point across multiple UM lines, and you use it to catch issues before they become file failures or probation failures."},{heading:"What you review — and at what cadence",groups:[{label:"Weekly",bullets:["UM coaching logs for every agent in your supervised units.","Weekly Sales Activity Tool submissions for every probationer.","Flag — any UM who misses three consecutive Mondays without explanation."]},{label:"Monthly",bullets:["UM performance review per UM (pipeline, files in build, agents in probation).","Form A submissions before they go to the BM — cross-check arithmetic and auto-trigger conditions.","POP override documentation — if a UM is recommending proceed past a POP caution, you sign the override documentation alongside the BM, with the explicit coaching plan."]},{label:"Quarterly",bullets:["Pattern analysis across UM lines.","If a UM has had multiple probation-resigned recruits, surface to the BM with lifecycle data and a coaching recommendation."]}]},{heading:"Checkpoints you own",bullets:["Form A pre-submission audit — every Form 3 passes through your hands before it reaches the BMA for filing. Cross-check the eight scoring lines, verify the unemployment subtraction, flag any of the four auto-triggers.","POP override documentation — for any recruit with a structural caution (AP under -15, IP under -25, EP under 30, SD/LM/CR under 25) whose UM recommends proceeding, the override is documented in writing with the reason, the BM signs, you sign as supervisory witness, the coaching plan is attached.","Probation extension recommendations — when a UM submits a written extension request to the BM, you review first. You either endorse the request or send it back to the UM with specific changes. Final extension authority rests with the BM."]},{heading:"When you escalate to the BM",body:"Five specific triggers, no discretion:",bullets:["A UM has missed three consecutive Monday submissions of coaching logs / Sales Activity Tool review for any agent on probation.","A Form A you have reviewed has been miscalculated by more than 5 points, OR an auto-trigger has been missed.","A POP override request has come without an accompanying coaching plan.","A probationer is at or below 30% of pro-rata API at month 4 and there is no documented intervention plan.","A pattern of failed recruits has emerged on a UM line (two or more probation-resigned hires in 12 months, or three or more never-contracted recruits in 18 months)."]},{heading:"Your authority and its limits",groups:[{label:"You can",bullets:["Hold UMs to standards on weekly coaching cadence.","Approve the form and completeness of POP override documentation.","Endorse or revise probation extension recommendations before they go to the BM.","Cross-check Form A before submission.","Surface patterns to the BM with data."]},{label:"You cannot",bullets:["Authorise POP 7.0 administration (BM only, after personally meeting the recruit).","Unilaterally approve a hire (BM Direct for 60-80, BM + VP Sales for 50-59, Panel for under 50).","Unilaterally terminate an agent (BM decision under Clauses 3a, 3b, 3d, 3e).","Reverse a BM decision."]}]}]},BM:{title:"Your role as Branch Manager — Decisions, signatures, and standing orders",sections:[{heading:"Your role in one sentence",body:"You authorise, you decide, you certify. Your signature is the final gate on every selection, every POP, every hire, every termination on this branch. The standards exist because you have set them; the enforcement happens because you uphold them in every individual decision."},{heading:"Decision points you personally own",bullets:["BM-recruit meeting after every First Interview, before any POP 7.0 administration request.","POP 7.0 administration authorisation — you authorise, no delegation, no acting-BM substitute.","File approval routing — BM Direct (60-80 on Form A), VP Sales decision (50-59), Selection Panel (under 50 or any auto-trigger).","Form 1a (Branch Manager's Recommendation Letter) — drafted by the BMA, signed by you, for every file leaving the branch.","Probation extension — final decision, after ABM review and UM written request.","Termination — final decision under Clauses 3a, 3b, 3d, or 3e.","Induction Application Certification — your signature applying for certification to the VP Sales for each new agent."]},{heading:"Forms you sign",bullets:["Form 1a — Branch Manager's Recommendation Letter, every file.","Form 3 — Agent Selection Criteria Form A, attesting to the scoring and the routing decision.","Induction Application for Certification — submitted to VP Sales at close of Induction with the New Agent Development Plan.","Override documentation when proceeding past a POP caution.","Probation extension authorisations.","Termination paperwork under any of the contract clauses."]},{heading:"Meetings you hold",bullets:["BM-recruit meeting after First Interview — every recruit, no exceptions.","Monthly review with the ABM — recruiting pipeline, agents in probation, standards posture.","30-, 60-, 90-day check-ins on flagged probationers (any agent with a structural POP caution, or any agent below pro-rata pace by 50% or more at any monthly review).","Quarterly review with the unit managers individually."]},{heading:"The standing orders you enforce",bullets:["BM meets every recruit after First Interview before any POP 7.0.","POP 7 is a Guardian Group company expense — the branch is responsible for managing it; you authorise every administration personally.","POP Final Rating 1 is a hard block; Rating 2 requires VP Sales written approval; only Ratings 3+ proceed without further escalation.","Market surveys are digital-only at this branch — the recruit fills out the digital form themselves; scanned forms do not count.","The 17-item file index is complete-or-not-shipped — no partial files to VP Sales or the Selection Panel.","Re-take of the Standards Test by any manager or BMA whose recruit fails (probation-resigned, never-contracted, or terminated)."]}]}};function getModulesForRole(e){var t=MODULE_6_BY_ROLE[e]||MODULE_6_BY_ROLE.UM;return[...MODULES,_objectSpread({id:"M6",number:6,estMinutes:14},t)]}var MANDATORY_QUESTIONS=[{id:"M1",text:"After conducting a First Interview with a recruit, before any POP 7.0 can be administered, what must happen?",options:["The Recruiting Manager administers POP 7.0 directly within 48 hours","The Branch Manager (Ricky Rampersad) must personally meet with the recruit after the First Interview, before any POP 7.0 request is raised","The Selection Committee reviews the file and authorises POP","POP 7.0 proceeds automatically when the First Interview score is in the strong band"],correctIndex:1,explanation:"Effective immediately: the Branch Manager meets every recruit after the First Interview, before any POP 7.0. POP 7 costs money and we will not spend it on recruits the BM has not personally assessed."},{id:"M2",text:"Who has authority to authorise a POP 7.0 administration request?",options:["Any Unit Manager who has conducted a First Interview","The Branch Manager only — after he has personally met the recruit","The Asst. Branch Manager in the BM's absence","The recruit themselves once they consent to the assessment"],correctIndex:1,explanation:"POP 7 administration is a Guardian Group company expense — not a branch expense — but the branch is responsible for managing it. Only the Branch Manager authorises POP, and only after he has met the recruit himself. We have seen what happens when this step is rushed; the standing order exists to manage the company's investment in our pipeline."},{id:"M3",text:"A recruit submits 25 market surveys to you as scanned PDFs of handwritten forms. Under this branch's internal market survey process, do these count toward the requirement?",options:["Yes — any submitted format counts","No — this branch operates a digital-only market survey process in which the recruit fills out the digital form themselves and the submission carries an auto-timestamp. Scanned or handwritten forms do not count","Scanned surveys count if the recruit also emails them as backup","It does not matter as long as the count meets the minimum"],correctIndex:1,explanation:"This branch operates a digital-only market survey workflow as an internal process. The recruit completes each survey by filling out the digital form themselves; the auto-timestamp is the audit trail. Scanned forms cannot establish when the survey was conducted, whether the recruit actually spoke to the listed prospect, or whether the entries were back-filled. The digital-only requirement is how the branch protects the standard against activity theatre."},{id:"M4",text:"A recruit's POP 7.0 returns with a Final Rating of 1 (catastrophic — extreme caution). What is the correct disposition?",options:["Proceed if the Recruiting Manager strongly recommends them","Proceed with a documented coaching plan","Hard block — the recruit does not advance. Per the VP Sales memo of 15 Feb 2021, only Final Ratings of 3 and above are accepted. Even a Rating 2 requires VP Sales written approval; Rating 1 is below that threshold","Resubmit POP 7.0 in 30 days for a second attempt"],correctIndex:2,explanation:'POP Final Rating 2 already requires VP Sales approval per the standing memo. Rating 1 is below that threshold and is a hard block. The branch has invested in too many "let us see how it goes" decisions on rating-1 candidates.'},{id:"M5",text:"Roughly how many branch hours are typically invested by the time a recruit who resigns during probation has left the company?",options:["Less than 20 hours — a minor cost","Approximately 50 to 100 hours across Discovery, file build, POP review, induction, and weekly coaching — a significant branch investment lost","Over 500 hours — but the company recovers most of it through commissions","There is no real cost — recruits self-fund through commissions"],correctIndex:1,explanation:"A probation-resigned recruit costs the branch roughly 50–100 hours of manager time before they walk away with $0 returned. Stack that across the recent failed recruits and the case for stricter selection becomes self-evident."}],ROLE_QUESTIONS={ABM:[{id:"ABM1",text:"A Unit Manager under your supervision wants to administer POP 7.0 to a recruit they have just interviewed. What is the correct workflow?",options:["Authorise the POP request directly — you are the ABM","Forward the recruit's First Interview profile to the Branch Manager and arrange the BM-recruit meeting before any POP step","Have the UM proceed and inform the BM after the fact","Authorise the POP if you yourself have also met the recruit"],correctIndex:1,explanation:"The ABM has supervisory auth
