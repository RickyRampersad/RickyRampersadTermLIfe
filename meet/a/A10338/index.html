<script>
  (function () {
    var q = new URLSearchParams(location.search);
    // The three that attribute this person to an advisor who has left: the
    // advisor code, their name, and the outreach token — /meet/ reads a token
    // as "sent" and logs the arrival against whoever sent it. Without one the
    // arrival is "direct", nobody targeted, and the branch picks the person
    // up. Everything else is kept, the prospect's own name (c) included, so
    // they are not asked anything twice.
    q.delete('a'); q.delete('n'); q.delete('t');
    var s = q.toString();
    location.replace('/meet/' + (s ? '?' + s : ''));
  })();
</script>
