<!DOCTYPE html>
<!-- THE DAY, HOUR BY HOUR (28 October 2026, with the tracker's 2026-10-28d). This stop was "The System's Day".
     Ricky, 1:15pm, after checking it against Salesforce's own list: "how can this board be fixed, it shows task closed off as
     the day goes by for what task type and agent and what was touched but not closed and aging? ... bring in me as i automated
     and show the tasks by me as servicing as its birthdays, the timeblocks are important ... this need motion, scaled to ensure
     understanding and whats done and measured". From intel.day's `hours` (wallDayHours_) and `system` (check-ins):
       top     the time blocks, 7am to 5pm: what was closed in each hour by task type (up), what was worked on and not closed
               (down), the Branch Manager's automated e-mails on their own lane, and a line where the clock is
       rows    each desk across the same hours, then the Branch Manager (automated): closed, worked on, e-mails, the task
               types closed, and how old the work they touched is
       foot    the agents whose work was closed today
     Counts, task types and first names only: no client, no subject. Each desk against its own day, in the register's order,
     never ranked. Every 5 minutes. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Day, Hour by Hour</title>
<meta name="description" content="What each desk closed and worked on, hour by hour, by task type, and how old that work is. Counts only.">
<meta name="theme-color" content="#0E1116">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all';this.onload=null">
<style>
  :root{
    --bg:#0E1116; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --ink:#F4F1EA; --dim:#B4B0A8; --faint:#837E77;
    --gold:#E3B85A; --amber:#EF9A4B; --teal:#4FC1B0; --green:#78D198; --coral:#EF8A6B; --red:#E8625A; --violet:#AB94E8;
    --fd:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif; --fb:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--fb);display:flex;flex-direction:column;position:relative}
  .glow{position:fixed;border-radius:50%;filter:blur(7rem);opacity:.30;pointer-events:none;z-index:0}
  .g1{width:44rem;height:44rem;left:-14rem;top:-18rem;background:#E3B85A;animation:drift 24s ease-in-out infinite alternate}
  .g2{width:40rem;height:40rem;right:-12rem;bottom:-20rem;background:#4FC1B0;opacity:.18;animation:drift 30s ease-in-out infinite alternate-reverse}
  .g3{width:28rem;height:28rem;left:40%;top:30%;background:#EF8A6B;opacity:.12;animation:drift 36s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(8rem,4rem) scale(1.12)}}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:1.1rem;padding:1.5rem 2.2rem .5rem}
  header .plate{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:.55rem .95rem;border-radius:.8rem;
    background:linear-gradient(135deg,#F3CE6E,#D99B2E);color:#1B1A22;box-shadow:0 .5rem 1.4rem rgba(217,155,46,.35)}
  header .plate b{font:900 1.05rem var(--fd);letter-spacing:.12em;line-height:1.1}
  header .plate span{font:700 .85rem var(--fd);letter-spacing:.22em;text-transform:uppercase;opacity:.8}
  header h1{font:800 2rem/1.05 var(--fd);letter-spacing:-.02em}
  header .sub{font-size:1rem;color:var(--dim);margin-top:.2rem}
  header .sub b{color:var(--ink)}
  .right{margin-left:auto;display:flex;align-items:center;gap:1.1rem}
  .btn{font:800 1rem var(--fd);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;cursor:pointer}
  .btn.on{background:var(--gold);color:#16171B}
  .live{display:flex;align-items:center;gap:.5rem;font:700 .95rem var(--fd);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .live i{width:.75rem;height:.75rem;border-radius:50%;background:var(--faint)}
  .live.on i{background:var(--green);animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(120,209,152,.7)}70%{box-shadow:0 0 0 .8rem rgba(120,209,152,0)}100%{box-shadow:0 0 0 0 rgba(120,209,152,0)}}
  .clock{font:800 1.9rem var(--fd);font-variant-numeric:tabular-nums}

  main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:30rem minmax(0,1fr);gap:1.3rem;padding:.9rem 2.2rem 1rem;min-height:0}
  .col{display:flex;flex-direction:column;gap:.9rem;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;padding:1.1rem 1.35rem;min-height:0;position:relative;overflow:hidden;
        opacity:0;transform:translateY(1.4rem);animation:rise .9s var(--ease) forwards;animation-delay:var(--d,0s)}
  @keyframes rise{to{opacity:1;transform:none}}
  .kick{font:800 .9rem var(--fd);letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
  .cap{font-size:.95rem;color:var(--dim);margin-top:.3rem;line-height:1.4}
  .cap b{color:var(--ink)}
  .ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--line);background:rgba(0,0,0,.25);height:3rem;display:flex;align-items:center}
  .ticker .in{display:flex;gap:4rem;white-space:nowrap;animation:tick 70s linear infinite;padding-left:100%}
  .ticker span{font:700 1.1rem var(--fd);color:var(--dim)} .ticker span b{color:var(--gold)}
  @keyframes tick{to{transform:translateX(-100%)}}

  :root{ --rose:#E58FB0; --wk:rgba(244,241,234,.30); }
  header .plate{background:linear-gradient(135deg,#9FE3D6,#4FC1B0);box-shadow:0 .5rem 1.4rem rgba(79,193,176,.32)}
  main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:.8rem;padding:.8rem 2.2rem .7rem;min-height:0}
  /* one grid for the chart and the desks, so every hour sits in the same column all the way down */
  .g{display:grid;grid-template-columns:20rem repeat(var(--nh,10),minmax(0,1fr)) 37rem;column-gap:.45rem;align-items:stretch}
  .top{flex:none} .card.top{padding:.9rem 1.2rem}
  .kpi{padding:1rem 1.2rem}
  .kpi .big{font:800 4.6rem/1 var(--fd);letter-spacing:-.04em;color:var(--green);font-variant-numeric:tabular-nums;margin-top:.2rem}
  .kpi .of{font:600 .98rem/1.45 var(--fb);color:var(--dim);margin-top:.3rem}
  .kpi .of b{color:var(--ink)}
  .kpi .gone{margin-top:.7rem;height:.5rem;border-radius:1rem;background:rgba(255,255,255,.08);overflow:hidden}
  .kpi .gone i{display:block;height:100%;width:0;background:var(--gold);transition:width 1.6s var(--ease)}
  .kpi .gk{font:600 .85rem var(--fb);color:var(--faint);margin-top:.35rem}
  /* the chart: closes up, worked-on down, one column an hour */
  .chart{position:relative;display:grid;grid-template-columns:repeat(var(--nh,10),minmax(0,1fr));column-gap:.45rem;padding:2.1rem 0 1.6rem}
  .hc{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0}
  .hc .up{height:8.6rem;display:flex;flex-direction:column-reverse;justify-content:flex-start;align-items:stretch;padding:0 .35rem;position:relative}
  .hc .up i{display:block;height:0;border-radius:.35rem .35rem 0 0;transition:height 1.4s var(--ease);margin-top:1px}
  .hc .up b{position:absolute;left:0;right:0;text-align:center;font:800 1.15rem var(--fd);font-variant-numeric:tabular-nums;transition:bottom 1.4s var(--ease)}
  .hc .ax{height:2px;background:rgba(255,255,255,.18)}
  .hc .dn{height:5.2rem;padding:0 .35rem;position:relative}
  .hc .dn i{display:block;height:0;background:var(--wk);border-radius:0 0 .35rem .35rem;transition:height 1.4s var(--ease)}
  .hc .dn b{position:absolute;left:0;right:0;text-align:center;font:700 .9rem var(--fb);color:var(--dim);transition:top 1.4s var(--ease)}
  .hc .lab{position:absolute;bottom:-1.55rem;left:0;right:0;text-align:center;font:700 .88rem var(--fb);color:var(--faint)}
  .hc.now .lab{color:var(--gold)}
  .hc.fut{opacity:.35}
  .hc .auto{position:absolute;top:-2.05rem;left:50%;transform:translateX(-50%);font:800 .9rem var(--fd);color:#1B1A22;background:var(--rose);border-radius:1rem;padding:.18rem .6rem;white-space:nowrap;box-shadow:0 0 0 .3rem rgba(229,143,176,.16)}
  .nowline{position:absolute;top:1.3rem;bottom:1.4rem;width:.18rem;border-radius:.2rem;background:var(--gold);box-shadow:0 0 1rem rgba(227,184,90,.7);left:0;transition:left 1.8s var(--ease);pointer-events:none}
  .nowline::after{content:"now";position:absolute;top:-1.25rem;left:50%;transform:translateX(-50%);font:800 .82rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .axk{position:absolute;left:-.2rem;font:800 .82rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);writing-mode:vertical-rl;transform:rotate(180deg)}
  /* the top turns between two pages, as slide 3 does: the hours, then each desk's ring (28 Oct 2026, 1:25pm) */
  .tp{grid-column:2 / -1;position:relative;min-width:0}
  .tpage{transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .tpage.out{opacity:0;transform:translateY(.8rem);pointer-events:none}
  .p0{display:grid;grid-template-columns:repeat(var(--nh,10),minmax(0,1fr)) 37rem;column-gap:.45rem}
  .p0 .chart{grid-column:1 / span var(--nh,10)}
  .p1{position:absolute;inset:0;display:flex;gap:.8rem;align-items:stretch;padding:.4rem 0 .2rem}
  .rc{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:1.1rem;padding:.7rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.35rem}
  .rc .nm{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
  .rc .nm b{font:800 1.15rem var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .nm span{font:700 .82rem var(--fb);color:var(--faint);white-space:nowrap}
  .rc .nm span.ok{color:var(--green)} .rc .nm span.late{color:var(--amber)} .rc .nm span.out{color:var(--coral)}
  .ring{position:relative;width:8.4rem;height:8.4rem;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .arc{transition:stroke-dashoffset 1.8s var(--ease)}
  .ring .tick{transform-origin:50px 50px;transition:transform 1.8s var(--ease)}
  .ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .c b{display:block;font:800 2.5rem/1 var(--fd);font-variant-numeric:tabular-nums}
  .ring .c small{display:block;font:700 .82rem var(--fb);color:var(--dim);margin-top:.15rem}
  .rc .fact{align-self:stretch}
  .rc .fact .l{display:flex;justify-content:space-between;font:700 .85rem var(--fb);color:var(--dim)}
  .rc .fact .l b{color:var(--ink)}
  .rc .fact .bar{height:.5rem;border-radius:1rem;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.2rem}
  .rc .fact .bar i{display:block;height:100%;width:0;border-radius:1rem;transition:width 1.6s var(--ease)}
  .rc .od{align-self:stretch;display:flex;justify-content:space-between;font:600 .82rem var(--fb);color:var(--faint)}
  .rc .od b{color:var(--ink)} .rc .od .hot b{color:var(--coral)}
  .rc.me .nm b{color:var(--rose)}
  /* the agents served: a bubble an agent, sized by the work done for them, its ring the share closed (3:43pm) */
  .p2{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;align-items:flex-end;gap:.6rem 1rem;padding:.3rem 0;overflow:hidden}
  .bub{display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.4);animation:pop .9s var(--ease) forwards;animation-delay:var(--d,0s)}
  @keyframes pop{to{opacity:1;transform:none}}
  .bub .o{position:relative;width:var(--s);height:var(--s);animation:float 5.5s ease-in-out infinite;animation-delay:var(--f,0s)}
  @keyframes float{50%{transform:translateY(-.45rem)}}
  .bub .o svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .bub .o .arc{transition:stroke-dashoffset 1.8s var(--ease)}
  .bub .o .in{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(255,255,255,.03));display:grid;place-items:center;text-align:center}
  .bub .o .in b{display:block;font:800 calc(var(--s) * .3)/1 var(--fd);font-variant-numeric:tabular-nums}
  .bub .o .in small{display:block;font:700 .82rem/1 var(--fb);color:var(--dim);margin-top:.1rem}
  .bub{width:var(--slot,8rem)}
  .bub .nm{font:800 1rem var(--fd);margin-top:.25rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bub .by{font:600 .82rem var(--fb);color:var(--faint);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bub.orph .nm{color:var(--coral)}
  .tdots{display:flex;align-items:center;gap:.4rem;margin-top:.8rem;font:700 .85rem var(--fb);color:var(--faint)}
  .tdots i{width:.6rem;height:.6rem;border-radius:50%;background:rgba(255,255,255,.18);transition:background .4s}
  .tdots i.on{background:var(--gold)}
  .legend{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.38rem}
  .legend .row{display:flex;align-items:center;gap:.55rem;font:600 .95rem var(--fb);color:var(--dim)}
  .legend .row i{width:.8rem;height:.8rem;border-radius:.22rem;flex:none}
  .legend .row b{margin-left:auto;font:800 1.15rem var(--fd);color:var(--ink);font-variant-numeric:tabular-nums}
  .legend .row.z{opacity:.4}
  .legend .sep{border-top:1px solid var(--line);margin:.25rem 0}

  /* the desks */
  .rows{flex:1;min-height:0;display:flex;flex-direction:column}
  .rh{font:800 .82rem var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 0 .35rem}
  .rh > div:last-child{display:grid;grid-template-columns:7rem 6.6rem 5.4rem minmax(0,1fr);gap:.6rem;text-align:right}
  .dk{flex:1;min-height:3.6rem;max-height:5.6rem;padding:.3rem 0;border-top:1px solid rgba(255,255,255,.07);opacity:0;transform:translateX(-1rem);animation:slide .7s var(--ease) forwards;animation-delay:var(--d,0s)}
  @keyframes slide{to{opacity:1;transform:none}}
  .dk .nm{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-left:.2rem}
  .dk .nm b{font:800 1.3rem var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dk .nm span{font:600 .85rem var(--fb);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
  .dk .nm span.ok{color:var(--green)} .dk .nm span.late{color:var(--amber)} .dk .nm span.out{color:var(--coral)}
  .cell{position:relative;border-radius:.6rem;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
  .cell .w{position:absolute;inset:0;background:var(--wk);opacity:0;transition:opacity 1.2s var(--ease)}
  .cell b{position:relative;font:800 1.35rem var(--fd);color:var(--green);font-variant-numeric:tabular-nums}
  .cell em{position:absolute;right:.35rem;bottom:.2rem;font:700 .82rem var(--fb);font-style:normal;color:var(--ink);opacity:.75}
  .cell.fut{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 .35rem,transparent .35rem .7rem)}
  .cell.now{box-shadow:inset 0 0 0 2px rgba(227,184,90,.75);animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:inset 0 0 0 2px rgba(227,184,90,.25)}}
  .cell.auto b{color:var(--rose)}
  .dk .st{display:grid;grid-template-columns:7rem 6.6rem 5.4rem minmax(0,1fr);gap:.6rem;align-items:center}
  .dk .st .cl{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
  .dk .st .cl .tb{display:flex;height:.4rem;width:5.2rem;border-radius:1rem;overflow:hidden;background:rgba(255,255,255,.07)}
  .dk .st .cl .tb i{display:block;height:100%;width:0;transition:width 1.4s var(--ease)}
  .dk .st .v small{display:block;font:700 .82rem var(--fb);color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-top:.05rem}
  .dk .st .v{text-align:right;font:800 1.45rem var(--fd);font-variant-numeric:tabular-nums}
  .dk .st .v.z{color:rgba(255,255,255,.22);font-weight:600}
  .v.green{color:var(--green)} .v.ink{color:var(--ink)} .v.rose{color:var(--rose)}
  .mini{display:flex;flex-direction:column;gap:.25rem;min-width:0}
  .mini .bar{display:flex;height:.55rem;border-radius:1rem;overflow:hidden;background:rgba(255,255,255,.07)}
  .mini .bar i{display:block;height:100%;width:0;transition:width 1.4s var(--ease)}
  .mini small{font:600 .82rem var(--fb);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .dk.me .nm b{color:var(--rose)}
  .foot{display:flex;align-items:center;gap:.6rem;flex-wrap:nowrap;overflow:hidden;padding:.55rem .2rem 0;border-top:1px solid var(--line);margin-top:.2rem}
  .foot .k{font:800 .85rem var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap;flex:none}
  .ag{font:700 .95rem var(--fb);color:var(--dim);background:rgba(255,255,255,.06);border-radius:.55rem;padding:.2rem .6rem;white-space:nowrap;flex:none;opacity:0;animation:rise .6s var(--ease) forwards;animation-delay:var(--d,0s)}
  .ag b{color:var(--ink);margin-left:.3rem} .ag.orph{color:var(--coral);background:rgba(239,138,107,.12)}
  .ages{display:flex;gap:.9rem;font:600 .85rem var(--fb);color:var(--faint);margin-left:auto;white-space:nowrap;flex:none}
  .ages i{display:inline-block;width:.65rem;height:.65rem;border-radius:.2rem;margin-right:.3rem;vertical-align:.02rem}
  .empty{font:600 1.05rem/1.5 var(--fb);color:var(--dim);padding:1rem}

  @media (max-width:900px){
    html{font-size:11px} html,body{height:auto;overflow:auto}
    header{flex-wrap:wrap;padding:1.2rem 1.4rem .6rem} .right{margin-left:0;width:100%;justify-content:space-between}
    main{padding:1rem 1.4rem} .glow{display:none}
    .g{grid-template-columns:repeat(var(--nh,10),minmax(0,1fr));row-gap:.4rem}
    .kpi,.legend,.rh > div:first-child,.rh > div:last-child,.tp{grid-column:1 / -1}
    .p0{grid-template-columns:repeat(var(--nh,10),minmax(0,1fr))} .p0 .chart,.p0 .legend{grid-column:1 / -1}
    .p1{position:static;flex-wrap:wrap;margin-top:1rem} .rc{flex:1 1 45%} .tdots{display:none}
    .rh > div:last-child{display:none}
    .dk{max-height:none}
    .dk .nm,.dk .st{grid-column:1 / -1}
    .hc .lab{font-size:.85rem}
    .foot{flex-wrap:wrap} .ages{margin-left:0}
    .cell em,.hc .auto,.axk,.hc .dn b{display:none} .cell{min-height:2.6rem} .cell b{font-size:1.15rem}
    .hc .up{height:7rem;padding:0 .15rem} .hc .dn{height:3.4rem;padding:0 .15rem} .hc .up b{font-size:1rem}
    .dk .st{grid-template-columns:repeat(3,auto) minmax(0,1fr);justify-content:space-between}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} .card,.dk,.ag{opacity:1;transform:none} }
</style>
</head>
<body>
<i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
<header>
  <div class="plate"><b>THE DAY</b><span>wall</span></div>
  <div><h1>The Day, Hour by Hour</h1><div class="sub" id="sub">From Salesforce &middot; counts, task types and first names only, no client</div></div>
  <div class="right"><button class="btn" id="sound" onclick="toggleSound()">▶ Narrate</button><div class="live" id="live"><i></i><span id="liveTxt">connecting</span></div><div class="clock" id="clock">--:--</div></div>
</header>
<main>
  <section class="card top g" id="top" style="--d:0s">
    <div class="kpi"><div class="kick">Closed today &middot; the desks</div><div class="big" id="kN">0</div>
      <div class="of" id="kOf">Reading Salesforce&hellip;</div><div class="gone"><i id="kGone"></i></div><div class="gk" id="kGk"></div>
      <div class="tdots" id="tdots"><i class="on"></i><i></i><i></i><span id="tdk">hour by hour</span></div></div>
    <div class="tp" id="tp">
      <div class="tpage p0" id="p0"><div class="chart" id="chart"></div><div class="legend" id="legend"></div></div>
      <div class="tpage p1 out" id="p1"></div>
      <div class="tpage p2 out" id="p2"></div>
    </div>
  </section>
  <section class="card rows" style="--d:.1s;padding:.9rem 1.2rem .7rem">
    <div class="g rh"><div>Desk &middot; checked in</div><div id="hh" style="grid-column:2 / span var(--nh,10);display:grid;grid-template-columns:repeat(var(--nh,10),minmax(0,1fr));column-gap:.45rem;text-align:center"></div>
      <div><span>Closed</span><span>Worked on</span><span>E-mails</span><span>How old the work is</span></div></div>

<script>

   Every screen on the wall narrates, in the one voice, so the wall sounds like
   one branch. A wall is not a film: it is on all day in a room where people
   are working, so sound is opt-in, finite, and stops dead when the voice does.
   Press Narrate and you get about forty seconds; then silence until somebody
   asks again. The lines are in audio/lines.py; the audio below is folded in
   by audio/embed-audio.py, because a linked MP3 is silent inside the wall's
   iframe. The player (all.html) is told when a screen is speaking so it holds
   that screen, and it can ask this screen to speak — the rail's Narrate. */

var audio=null, aIdx=0, playing=false, bactx=null;
/* The bed: the branch theme, played rather than loaded — D, F#m, Bm, G, D on
   soft pads, five chords at 8.7s, landing home on D. */
var BED = [
  [146.83,220.00,293.66], [185.00,277.18,369.99],
  [123.47,185.00,246.94], [196.00,293.66,392.00],
  [146.83,220.00,293.66]
];
function startBed(secs){
  try{
    bactx = new (window.AudioContext||window.webkitAudioContext)();
    var bus=bactx.createGain(); bus.gain.value=0;
    var lp=bactx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=0.4;
    bus.connect(lp); lp.connect(bactx.destination);
    var t0=bactx.currentTime+0.05, CH=8.7;
    BED.forEach(function(chord,ci){
      var on=t0+ci*CH, off=on+CH+2.8;
      chord.forEach(function(f,vi){
        [["sawtooth",-6,0.055],["sawtooth",7,0.055],["triangle",0,0.030]].forEach(function(v){
          var o=bactx.createOscillator(), g=bactx.createGain();
          o.type=v[0]; o.frequency.value = v[0]==="triangle" ? f*2 : f; o.detune.value=v[1];
          g.gain.setValueAtTime(0.0001,on);
          g.gain.exponentialRampToValueAtTime(v[2]/(vi+1.4), on+2.4);
          g.gain.setValueAtTime(v[2]/(vi+1.4), off-2.4);
          g.gain.exponentialRampToValueAtTime(0.0001, off);
          o.connect(g); g.connect(bus); o.start(on); o.stop(off+0.1);
        });
      });
      var sub=bactx.createOscillator(), sg=bactx.createGain();
      sub.type="sine"; sub.frequency.value=chord[0]/2;
      sg.gain.setValueAtTime(0.0001,on);
      sg.gain.exponentialRampToValueAtTime(0.075,on+2.6);
      sg.gain.setValueAtTime(0.075,off-2.4);
      sg.gain.exponentialRampToValueAtTime(0.0001,off);
      sub.connect(sg); sg.connect(bus); sub.start(on); sub.stop(off+0.1);
    });
    var g=bus.gain, T=bactx.currentTime, end=Math.max(secs,12);
    g.setValueAtTime(0,T);
    g.linearRampToValueAtTime(0.26, T+2.2);
    g.linearRampToValueAtTime(0.15, T+4.4);
    g.linearRampToValueAtTime(0.15, T+end-4.0);
    g.linearRampToValueAtTime(0.30, T+end-2.4);
    g.linearRampToValueAtTime(0.0,  T+end);
  }catch(e){ bactx=null; }
}
function stopBed(){ try{ bactx && bactx.close(); }catch(e){} bactx=null; }

/* The player above this frame is told when the voice starts and stops. */
function tellWall(on){
  try{ if(parent!==window) parent.postMessage({rrb:"narration", on:!!on}, "*"); }catch(e){}
}
function toggleSound(){
  if(!NARRATION.length) return;
  if(playing) return endNarration();
  playing=true; aIdx=0;
  $("#sound").classList.add("on"); $("#sound").textContent="■ Stop";
  var secs=NARRATION.reduce(function(a,n){ return a+(n.s||3.4)+0.7; }, 1.0);
  startBed(secs);
  tellWall(true);
  next();
}
function endNarration(){
  playing=false;
  clearGuard();
  if(audio){ try{ audio.pause(); }catch(e){} audio.onended=audio.onerror=null; }
  stopBed();
  $("#sound").classList.remove("on"); $("#sound").textContent="▶ Narrate";
  tellWall(false);
}
/* A line that dies must not take the wall down with it. The player above
   holds this screen while the voice runs, and it learns the voice has
   stopped only from `endNarration`. So a line that errors, or that stalls
   with the element firing neither `ended` nor `error`, has to be given up
   on here — on 10 September one that did left the wall on one screen all
   morning. The guard is the line's own measured length plus a wide margin,
   so a slow load is waited for and a dead one is not. */
var guard=null;
function clearGuard(){ if(guard){ clearTimeout(guard); guard=null; } }
function next(){
  if(!playing||aIdx>=NARRATION.length) return endNarration();
  clearGuard();
  var line=NARRATION[aIdx], mine=audio=new Audio(line.a), moved=false;
  function on(){ if(moved||audio!==mine) return; moved=true; clearGuard(); aIdx++; setTimeout(next,700); }
  function off(){ if(moved||audio!==mine) return; moved=true; endNarration(); }
  audio.onended=on;                                            // a beat after each line
  audio.onerror=off;
  guard=setTimeout(on,((line.s||3.4)+8)*1000);
  audio.play().catch(off);
}
/* The rail's Narrate asks this screen to speak; turning away asks it to hush. */
window.addEventListener("message", function(e){
  var d=e.data||{};
  if(d.rrb==="narrate") toggleSound();
  else if(d.rrb==="hush" && playing) endNarration();
});
(function(){
  var b=$("#sound"); if(!b) return;
  b.disabled = !NARRATION.length;
  b.title = NARRATION.length ? "" : "Narration not built yet — run audio/build-voice.py";
})();
