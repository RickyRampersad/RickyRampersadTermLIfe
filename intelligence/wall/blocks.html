<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whose Hands</title>
<meta name="description" content="Every contract received in 2026 — what is still in our cabinet, what an agent is holding, and what the client has signed for.">
<meta name="theme-color" content="#061c31">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- THE FONT MUST NOT BLOCK THE PICTURE. A plain stylesheet link in the head is
     render-blocking: until it answers, the screen is blank. Measured at 12.5s on
     a link that was merely slow, and a wall screen on branch wifi is exactly
     where that happens. Loading it as print media and promoting it on load makes
     it non-blocking — the system fallback in every font stack shows instantly
     and the webfont swaps in when it arrives. noscript keeps it working with
     scripting off. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
  :root{
    --ink:#eaf4ff; --dim:#9dbdd8; --faint:#6d8ba6;
    --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
    --blue:#37b1ec; --blue2:#0b7fd4; --gold:#efc24b; --gold2:#c9942c;
    --grey:#5b7590; --good:#34d399;
    --grad:linear-gradient(120deg,#37b1ec,#0b7fd4);
    --grad-gold:linear-gradient(120deg,#efc24b,#c9942c);
    --r:16px; --ease:cubic-bezier(.16,1,.3,1);
    --font-d:'Plus Jakarta Sans',Inter,system-ui,sans-serif;
    --font-b:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;min-height:100vh}
  body{margin:0;font-family:var(--font-b);color:var(--ink);background:#061c31;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(1200px 700px at 10% -8%,rgba(239,194,75,.16),transparent 60%),
      radial-gradient(900px 600px at 94% 2%,rgba(11,127,212,.18),transparent 62%),
      linear-gradient(165deg,#061c31 0%,#08243f 55%,#061a2d 100%)}

  header{display:flex;align-items:center;gap:14px;padding:14px 26px 10px}
  header .mark{width:40px;height:40px;flex:none;border-radius:12px;overflow:hidden;
    background:#07131f;display:grid;place-items:center}
  header .mark img{width:40px;height:40px;display:block}
  header h1{margin:0;font-family:var(--font-d);font-size:17px;font-weight:800;letter-spacing:-.3px}
  header .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .live.on i{background:var(--good);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  #clock{font-family:var(--font-d);font-weight:700;font-size:15px;
    font-variant-numeric:tabular-nums;color:var(--dim)}

  #chip{display:none;align-items:center;gap:9px;background:rgba(239,194,75,.16);
    border:1px solid rgba(239,194,75,.42);border-radius:999px;padding:6px 8px 6px 15px;
    font:600 13px var(--font-b);color:var(--ink);cursor:pointer}
  #chip.on{display:inline-flex}
  #chip span{width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:12px;line-height:1}


  /* Full height, four columns: on a television the four blocks of the day
     should be four columns of the screen, not four cards along the top. */
  main{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px;padding:6px 26px 26px;
    height:calc(100vh - 74px)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 18px 16px;display:flex;flex-direction:column;min-height:0}
  .when{font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--gold)}
  .focus{font-size:12px;color:var(--dim);margin:3px 0 12px;line-height:1.4;min-height:34px}
  .ring{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .ring .v{font-family:var(--font-d);font-weight:800;font-size:52px;line-height:.9;letter-spacing:-2px}
  .ring .of{font-size:14px;color:var(--faint)}
  .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.11);overflow:hidden;margin:10px 0 12px}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--grad-gold)}
  .bar.full i{background:linear-gradient(120deg,#34d399,#0f9d76)}
  .who{display:flex;flex-direction:column;gap:5px;overflow:hidden;flex:1;justify-content:center}
  .who div{font-size:15px}
  .who div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
  .who i{width:8px;height:8px;border-radius:50%;flex:none;background:rgba(255,255,255,.2)}
  .who i.done{background:var(--good)} .who i.due{background:var(--gold)}
  .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .foot{font-size:11px;color:var(--faint);margin-top:10px;padding-top:9px;
    border-top:1px solid var(--line);line-height:1.45}

  /* Four columns become four stacked cards; the whole thing scrolls. */
  @media (max-width:760px){
    body{overflow:auto}
    header{flex-wrap:wrap;padding:12px 12px 8px;gap:10px}
    header h1{font-size:15px}
    header .sub{font-size:10.5px}
    header .right{margin-left:0;width:100%}
    main{grid-template-columns:1fr;height:auto;padding:6px 12px 26px;gap:12px}
    .card{padding:14px 15px}
    .when{font-size:19px}
    .focus{min-height:0;margin-bottom:9px}
    .ring .v{font-size:40px}
    .who{justify-content:flex-start}
    .who div{font-size:13.5px}
  }
</style>
</head>
<body>

<header>
  <div class="mark"><img src="../../logo-mark.png" alt=""></div>
  <div>
    <h1>The Day In Blocks</h1>
    <div class="sub">How the day was spent &middot; the four blocks &middot; Ricky Rampersad Branch, Chaguanas</div>
  </div>
  <div class="right">
    <button class="btn" id="sound" onclick="toggleSound()">▶ Narrate</button>
    <span class="live" id="live"><i></i><span id="liveTxt">no feed</span></span>
    <span id="clock"></span>
  </div>
</header>

<main id="bWrap"></main>

<script>

var DAY_URL = "https://script.google.com/macros/s/AKfycbxehQUxHeTntM3K7x1GFIJ5bX66QVurol0rSQvIBTRBQpFT3LwvClCAOm6jiTW5tflDdg/exec";
var D = { configured:false, error:"No feed yet." };
function $(s){return document.querySelector(s)}
function n(v){ return v==null ? "\u2014" : Number(v).toLocaleString("en-US"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function first(x){ return String(x||"").split(" ")[0]; }
function tick(){ $("#clock").textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) }
setInterval(tick,10000); tick();
/* ONE MISSED READ USED TO COST HALF AN HOUR. Seven screens post to the same
   Apps Script within seconds of each other when the wall boots and again on
   every refresh, and Google drops one of those now and then — a reset, a
   queue, a cold container. The page fetched once, fell into its catch, and sat
   on "no feed" until the next thirty-minute tick, which is exactly what the
   branch kept seeing on "some walls" while the others were fine.

   Three tries, four seconds apart, before anything is called broken. A feed
   that answers on the second attempt is a feed that answers. */
function feed(url, body, tries){
  tries = tries === undefined ? 3 : tries;
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
                    body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(err){
      if(tries<=1) throw err;
      return new Promise(function(go){ setTimeout(go,4000); })
        .then(function(){ return feed(url,body,tries-1); });
    });
}

function load(){
  feed(DAY_URL,{action:"intel.day"})
    .then(function(j){
      if(!j||!j.ok||!j.data) throw new Error("bad feed");
      D=j.data; paint();
      $("#live").classList.add("on"); $("#liveTxt").textContent="live";
    })
    .catch(function(){ $("#live").classList.remove("on"); $("#liveTxt").textContent="no feed"; paint(); });
}
/* The day moves while the wall is up, so this one refreshes every five
   minutes rather than every thirty like the book screens. It is cheap: the
   tracker caches the Salesforce read for twelve. */
load(); setInterval(load,5*60*1000);

function paint(){
  var blocks=D.blocks||[], desks=D.desks||[];
  if(!blocks.length){
    $("#bWrap").innerHTML='<section class="card"><div class="when">Waiting on the tracker</div>'
      + '<p class="focus">'+esc(D.error||"No feed yet.")+'</p></section>';
    return;
  }
  $("#bWrap").innerHTML = blocks.map(function(b,i){
    var pct = b.of ? Math.round(b.done/b.of*100) : 0;
    var rows = desks.filter(function(d){ return (d.blocks||[])[i]; }).map(function(d){
      var st=(d.blocks||[])[i];
      return '<div><i class="'+st+'"></i><span class="nm">'+esc(first(d.name))+'</span></div>';
    }).join("");
    return '<section class="card">'
      + '<div class="when">'+esc(b.time||b.id)+'</div>'
      + '<p class="focus">'+esc(b.label||"")+'</p>'
      + '<div class="ring"><span class="v">'+b.done+'</span><span class="of">of '+b.of+' filed</span></div>'
      + '<div class="bar'+(b.of&&b.done>=b.of?" full":"")+'"><i style="width:'+pct+'%"></i></div>'
      + '<div class="who">'+rows+'</div>'
      + '<div class="foot">'+(b.of ? (b.done>=b.of ? "Every desk on this block has filed it."
          : (b.of-b.done)+" still to file") : "Nobody is scheduled on this block.")+'</div>'
      + '</section>';
  }).join("");
}
</script>

var audio=null, aIdx=0, playing=false, bactx=null;
/* The bed: the branch theme, played rather than loaded — D, F#m, Bm, G, D on
   soft pads, five chords at 8.7s, landing home on D. */
var BED = [
  [146.83,220.00,293.66], [185.00,277.18,369.99],
  [123.47,185.00,246.94], [196.00,293.66,392.00],
  [146.83,220.00,293.66]
];
function startBed(secs){
  try{
    bactx = new (window.AudioContext||window.webkitAudioContext)();
    var bus=bactx.createGain(); bus.gain.value=0;
    var lp=bactx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.Q.value=0.4;
    bus.connect(lp); lp.connect(bactx.destination);
    var t0=bactx.currentTime+0.05, CH=8.7;
    BED.forEach(function(chord,ci){
      var on=t0+ci*CH, off=on+CH+2.8;
      chord.forEach(function(f,vi){
        [["sawtooth",-6,0.055],["sawtooth",7,0.055],["triangle",0,0.030]].forEach(function(v){
          var o=bactx.createOscillator(), g=bactx.createGain();
          o.type=v[0]; o.frequency.value = v[0]==="triangle" ? f*2 : f; o.detune.value=v[1];
          g.gain.setValueAtTime(0.0001,on);
          g.gain.exponentialRampToValueAtTime(v[2]/(vi+1.4), on+2.4);
          g.gain.setValueAtTime(v[2]/(vi+1.4), off-2.4);
          g.gain.exponentialRampToValueAtTime(0.0001, off);
          o.connect(g); g.connect(bus); o.start(on); o.stop(off+0.1);
        });
      });
      var sub=bactx.createOscillator(), sg=bactx.createGain();
      sub.type="sine"; sub.frequency.value=chord[0]/2;
      sg.gain.setValueAtTime(0.0001,on);
      sg.gain.exponentialRampToValueAtTime(0.075,on+2.6);
      sg.gain.setValueAtTime(0.075,off-2.4);
      sg.gain.exponentialRampToValueAtTime(0.0001,off);
      sub.connect(sg); sg.connect(bus); sub.start(on); sub.stop(off+0.1);
    });
    var g=bus.gain, T=bactx.currentTime, end=Math.max(secs,12);
    g.setValueAtTime(0,T);
    g.linearRampToValueAtTime(0.26, T+2.2);
    g.linearRampToValueAtTime(0.15, T+4.4);
    g.linearRampToValueAtTime(0.15, T+end-4.0);
    g.linearRampToValueAtTime(0.30, T+end-2.4);
    g.linearRampToValueAtTime(0.0,  T+end);
  }catch(e){ bactx=null; }
}
function stopBed(){ try{ bactx && bactx.close(); }catch(e){} bactx=null; }

/* The player above this frame is told when the voice starts and stops. */
function tellWall(on){
  try{ if(parent!==window) parent.postMessage({rrb:"narration", on:!!on}, "*"); }catch(e){}
}
function toggleSound(){
  if(!NARRATION.length) return;
  if(playing) return endNarration();
  playing=true; aIdx=0;
  $("#sound").classList.add("on"); $("#sound").textContent="■ Stop";
  var secs=NARRATION.reduce(function(a,n){ return a+(n.s||3.4)+0.7; }, 1.0);
  startBed(secs);
  tellWall(true);
  next();
}
function endNarration(){
  playing=false;
  clearGuard();
  if(audio){ try{ audio.pause(); }catch(e){} audio.onended=audio.onerror=null; }
  stopBed();
  $("#sound").classList.remove("on"); $("#sound").textContent="▶ Narrate";
  tellWall(false);
}
/* A line that dies must not take the wall down with it. The player above
   holds this screen while the voice runs, and it learns the voice has
   stopped only from `endNarration`. So a line that errors, or that stalls
   with the element firing neither `ended` nor `error`, has to be given up
   on here — on 10 September one that did left the wall on one screen all
   morning. The guard is the line's own measured length plus a wide margin,
   so a slow load is waited for and a dead one is not. */
var guard=null;
function clearGuard(){ if(guard){ clearTimeout(guard); guard=null; } }
function next(){
  if(!playing||aIdx>=NARRATION.length) return endNarration();
  clearGuard();
  var line=NARRATION[aIdx], mine=audio=new Audio(line.a), moved=false;
  function on(){ if(moved||audio!==mine) return; moved=true; clearGuard(); aIdx++; setTimeout(next,700); }
  function off(){ if(moved||audio!==mine) return; moved=true; endNarration(); }
  audio.onended=on;                                            // a beat after each line
  audio.onerror=off;
  guard=setTimeout(on,((line.s||3.4)+8)*1000);
  audio.play().catch(off);
}
/* The rail's Narrate asks this screen to speak; turning away asks it to hush. */
window.addEventListener("message", function(e){
  var d=e.data||{};
  if(d.rrb==="narrate") toggleSound();
  else if(d.rrb==="hush" && playing) endNarration();
});
(function(){
  var b=$("#sound"); if(!b) return;
  b.disabled = !NARRATION.length;
  b.title = NARRATION.length ? "" : "Narration not built yet — run audio/build-voice.py";
})();
