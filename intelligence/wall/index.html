<!DOCTYPE html>
<!-- PREMIUM DUES · THE LETTERS (rebuilt 5 November 2026, again 6 November; stop 13 of the Intelligence wall, tab "Premium dues · the letters").
     Ricky, 4 November: "can they run within the slides and change, so you have the policies under 1 year, then 2 year, then
     3 year, then 4 year, then 5 years, then over 5 years, and the ability to pause ... and then the 45 days, the 60, 75 and the
     90 days before the lapse, and then the lapses". Then, 6 November: "More motion more graphic that impacts and more scaling
     that will pop and need to have motion in the slide with very powerful insights. It's import for the agents to know the
     emails going out."
     Thirteen scenes inside this one stop, about nine seconds each, that turn by themselves:
       1-6   one per band of how long the policy has been in force: behind on a premium, what should have collected itself,
             whose book, how far behind and which email that means, how they pay, the agents carrying most
       7     the emails your clients get: 45-59, 60-74, 75-89, 90+ and the lapse notice on one line, each with its subject,
             who is copied, how many go today and the client's one-tap choices
       8-11  each email as the client gets it: the subject, "our conversation so far" (the emails before it and what was tapped),
             the buttons, and beside it what clients tapped, today's line, the week, what came back and what happened after
       12    the lapse notice (lapsed under two years): why they let it go, how well we followed up
       13    the lapses this year: by month, by band, by agent, and whether an email went first
     Every scene leads with one sentence worked out from the figures. Motion only inside prefers-reduced-motion:
     no-preference, transform and opacity only, only on the scene that is up, and parked by Pause.
     From intel.wall's `journey` block (iWallJourney_ in PremiumDueDesk.gs). Counts, premium totals, staff first names and
     our own agents' names; never a client. The "our conversation so far" block is an example dated back from today.
     Dominic, Javid, Aleema and Terek are still with the company: active, always. -->

<style>

  :root{
    --bg:#0E1116; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --ink:#F4F1EA; --dim:#B4B0A8; --faint:#8C877F;
    --gold:#E3B85A; --amber:#EF9A4B; --teal:#4FC1B0; --green:#78D198; --coral:#EF8A6B; --red:#E8625A; --grey:#6E6A64; --violet:#AB94E8;
    --s45:#4FC1B0; --s60:#E3B85A; --s75:#EF9A4B; --s90:#EF8A6B; --slapse:#E8625A;
    --fd:'Plus Jakarta Sans','Plus Jakarta Sans Fallback','Plus Jakarta Sans Fallback R',system-ui,-apple-system,Segoe UI,sans-serif;
    --fb:Inter,'Inter Fallback','Inter Fallback R',system-ui,-apple-system,Segoe UI,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1); --c:var(--gold);
  }
  html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--fb);display:flex;flex-direction:column;position:relative;-webkit-font-smoothing:antialiased}
  .glow{position:fixed;border-radius:50%;filter:blur(7rem);pointer-events:none;z-index:0;transition:background 1.2s}
  .g1{width:44rem;height:44rem;left:-14rem;top:-20rem;background:var(--c);opacity:.22}
  .g2{width:40rem;height:40rem;right:-12rem;bottom:-22rem;background:#4FC1B0;opacity:.12}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:1.1rem;padding:1.1rem 2.2rem .2rem}
  .mark{width:3.2rem;height:3.2rem;flex:none;display:grid;place-items:center}
  .mark img{width:100%;height:100%;display:block}
  header h1{font:800 2rem/1.05 var(--fd);letter-spacing:-.02em}
  header .sub{font-size:1rem;color:var(--dim);margin-top:.2rem}
  header .sub b{color:var(--ink)}
  .right{margin-left:auto;display:flex;align-items:center;gap:1rem}
  .btn{font:800 1rem var(--fd);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;cursor:pointer}
  .btn.on{background:var(--gold);color:#16171B}
  .btn:disabled{opacity:.45;cursor:default}
  .live{display:flex;align-items:center;gap:.5rem;font:700 .95rem var(--fd);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .live i{width:.75rem;height:.75rem;border-radius:50%;background:var(--faint);position:relative}
  .live.on i{background:var(--green)}
  .clock{font:800 1.9rem var(--fd);font-variant-numeric:tabular-nums}
  .mode{font:800 .9rem var(--fd);letter-spacing:.04em;padding:.4rem .75rem;border-radius:.6rem;white-space:nowrap}
  .mode.test{background:rgba(239,154,75,.16);color:var(--amber);border:1px solid rgba(239,154,75,.4)}
  .mode.live{background:rgba(120,209,152,.14);color:var(--green);border:1px solid rgba(120,209,152,.4)}
  .mode.held{background:rgba(232,98,90,.14);color:var(--coral);border:1px solid rgba(232,98,90,.4)}

  /* the stage: one scene at a time */
  #stage{position:relative;z-index:1;flex:1;min-height:0;margin:.3rem 2.2rem .3rem}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;gap:.8rem;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
  .scene.on{opacity:1;visibility:visible;transition:opacity .6s}
  .shead{display:flex;align-items:center;gap:1.8rem;min-height:7.4rem}
  .shead .tag{flex:none;font:800 1rem var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--c);max-width:40rem}
  .shead .tag b{display:block;font:800 4.4rem/1 var(--fd);letter-spacing:-.035em;text-transform:none;color:var(--c);margin-top:.25rem}
  .shead .say{font:800 2.15rem/1.22 var(--fd);letter-spacing:-.01em;color:var(--ink);max-width:76rem;padding-left:1.8rem;border-left:.3rem solid var(--c)}
  .shead .say em{font-style:normal;color:var(--c)}
  .shead .say small{display:block;font:600 1.05rem/1.4 var(--fb);color:var(--dim);margin-top:.45rem;letter-spacing:0}
  .shead .say small b{color:var(--ink)}
  .grid{flex:1;min-height:0;display:grid;gap:.9rem}
  .g-band{grid-template-columns:34rem minmax(0,1fr) minmax(0,1fr)}
  .g-letter{grid-template-columns:40rem minmax(0,1fr) minmax(0,1fr)}
  .g-lapse{grid-template-columns:31rem minmax(0,1.2fr) minmax(0,1fr)}
  .col{display:flex;flex-direction:column;gap:.9rem;min-height:0;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.4rem;padding:1rem 1.25rem;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .col > .card{flex:1 0 auto}
  .col > .card.grow{flex:20 1 0;min-height:0}
  .card .rows{flex:1;justify-content:space-evenly}
  .card.grow{flex:1}
  .kick{font:800 .9rem var(--fd);letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
  .kick span{color:var(--faint);letter-spacing:.04em;text-transform:none;font-weight:700}
  .note{font:600 .95rem/1.4 var(--fb);color:var(--faint)}
  .note b{color:var(--dim)}
  .big{font:800 8.2rem/.95 var(--fd);letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--c)}
  .bigk{font:700 1.15rem/1.35 var(--fb);color:var(--dim);margin-top:.35rem}
  .bigk b{color:var(--ink)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
  .tiles.three{grid-template-columns:repeat(3,1fr)}
  .tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:1rem;padding:.6rem .8rem;min-width:0}
  .tile b{display:block;font:800 2.4rem/1 var(--fd);font-variant-numeric:tabular-nums}
  .tile small{display:block;font:600 .9rem/1.25 var(--fb);color:var(--dim);margin-top:.3rem}
  .tile.z b{color:rgba(255,255,255,.28)}
  .ringw{display:flex;align-items:center;gap:1.1rem;margin-top:.9rem}
  .ring{width:9.5rem;height:9.5rem;flex:none;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:11}
  .ring .bgc{stroke:rgba(255,255,255,.08)}
  .ring .fg{stroke:var(--c);stroke-linecap:round}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 2.3rem var(--fd)}
  .ring .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 80%,rgba(255,255,255,.22) 96%,transparent 100%);-webkit-mask:radial-gradient(circle,transparent 58%,#fff 59%,#fff 70%,transparent 71%);mask:radial-gradient(circle,transparent 58%,#fff 59%,#fff 70%,transparent 71%);opacity:0}
  .ringw p{font:600 1.05rem/1.4 var(--fb);color:var(--dim)} .ringw p b{color:var(--ink)}
  .split{display:flex;height:1.1rem;border-radius:1rem;overflow:hidden;margin-top:.6rem;background:rgba(255,255,255,.07);position:relative}
  .split i{display:block;height:100%;width:0}
  .lg{display:flex;gap:1.2rem;margin-top:.45rem;font:600 .95rem var(--fb);color:var(--dim);flex-wrap:wrap}
  .lg span{white-space:nowrap} .lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;margin-right:.35rem;vertical-align:.02rem}
  .lg b{color:var(--ink)}
  /* a light that travels along a bar while the scene is up */
  .shine{position:relative;overflow:hidden}
  .shine::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);transform:translateX(-120%);opacity:0;pointer-events:none}
  /* horizontal bars */
  .rows{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
  .r{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 4rem;gap:.8rem;align-items:center}
  .r .l{font:600 1.1rem var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .t{height:1rem;border-radius:1rem;background:rgba(255,255,255,.07);overflow:hidden}
  .r .t i{display:block;height:100%;width:0;border-radius:1rem;background:var(--grey)}
  .r .t i.a{background:var(--teal)} .r .t i.o{background:var(--coral)} .r .t i.g{background:var(--gold)} .r .t i.c{background:var(--c)}
  .r .v{font:800 1.3rem var(--fd);text-align:right;font-variant-numeric:tabular-nums}
  .r.orph .l{color:var(--coral)}
  .r.me .l{color:var(--c);font-weight:800}
  .rows.wide .r{grid-template-columns:minmax(0,19rem) minmax(0,1fr) 3.6rem}
  .rows.wide .r .l{white-space:normal;line-height:1.2;font-size:1.02rem}
  /* the days-behind ladder */
  .ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;align-items:end;flex:1;min-height:9rem;margin-top:.8rem}
  .ladder div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .ladder i{display:block;width:100%;height:0;max-height:calc(100% - 4.4rem);border-radius:.6rem .6rem 0 0;background:var(--k,var(--grey));flex:none;position:relative}
  .ladder em{font:800 1.6rem var(--fd);font-style:normal;margin-bottom:.3rem;font-variant-numeric:tabular-nums}
  .ladder span{font:700 .9rem var(--fb);color:var(--dim);margin-top:.35rem;text-align:center;line-height:1.2}
  .ladder i b,.wk i b{position:absolute;left:0;right:0;top:-.15rem;height:.3rem;border-radius:1rem;background:rgba(255,255,255,.85);opacity:0}
  /* the email, as the client gets it */
  .env{flex:none;background:#F7F4EC;color:#1E2228;border-radius:1.2rem;padding:1.1rem 1.4rem 1.2rem;position:relative;box-shadow:0 1rem 2.6rem rgba(4,6,10,.45);overflow:hidden}
  .env::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.5rem;background:var(--c)}
  .env .from{display:flex;align-items:center;gap:.6rem;font:700 .95rem var(--fb);color:#5A5F66}
  .env .from img{width:1.7rem;height:1.7rem}
  .env .from span{margin-left:auto;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#8A5A12;background:#F1E3C3;border-radius:.4rem;padding:.2rem .5rem}
  .env .to{font:600 .9rem/1.35 var(--fb);color:#5F646C;margin-top:.35rem;padding-bottom:.5rem;border-bottom:1px solid #E2DDD0}
  .env .to b{color:#1E2228}
  .env .subj{font:800 1.65rem/1.22 var(--fd);margin-top:.6rem;color:#12161B}
  .env .gist{font:500 1.02rem/1.45 var(--fb);color:#3D434B;margin-top:.5rem}
  .trail{margin-top:.7rem;background:#EFEADD;border-radius:.8rem;padding:.55rem .8rem;border-left:.25rem solid #C9BFA6}
  .trail .th{font:800 .78rem var(--fd);letter-spacing:.13em;text-transform:uppercase;color:#6B6455}
  .trail .tr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .7rem;align-items:baseline;font:600 .9rem/1.35 var(--fb);color:#3D434B;margin-top:.3rem}
  .trail .tr i{font-style:normal;font:800 .82rem var(--fd);color:#1E2228;white-space:nowrap}
  .trail .tr u{text-decoration:none;color:#14615A;font-weight:700}
  .opts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}
  .opt{position:relative;font:700 .92rem/1.2 var(--fb);background:#1E2228;color:#F7F4EC;border-radius:.6rem;padding:.48rem .75rem;max-width:100%}
  .opt.alt{background:transparent;color:#3D434B;border:1px solid #C9C2B2}
  .opt::after{content:"";position:absolute;inset:-.25rem;border-radius:.8rem;border:.18rem solid var(--c);opacity:0;pointer-events:none}
  .rate{display:flex;gap:.4rem;margin-top:.5rem}
  .rate span{width:2.4rem;height:2.4rem;border-radius:.55rem;display:grid;place-items:center;font:800 1.1rem var(--fd);background:#1E2228;color:#F7F4EC}
  .env .lbl{font:800 .8rem var(--fd);letter-spacing:.12em;text-transform:uppercase;color:#6B6455;margin-top:.75rem}
  .copied{display:inline-flex;align-items:center;gap:.4rem;font:700 .88rem/1.3 var(--fb);color:#14615A;background:#DDEFE9;border-radius:.5rem;padding:.3rem .6rem;margin-top:.7rem}
  .copied::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:#14615A;flex:none}
  /* the journey */
  .flow{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:.9rem}
  .ftrack{position:absolute;left:3%;right:3%;top:2.15rem;height:.35rem;border-radius:1rem;background:linear-gradient(90deg,var(--s45),var(--s60),var(--s75),var(--s90),var(--slapse));opacity:.55;overflow:hidden}
  .frun{position:absolute;inset:0;transform:translateX(-5%)}
  .frun b{position:absolute;left:0;top:50%;width:3.2rem;height:1.2rem;margin-top:-.6rem;border-radius:1rem;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0))}
  .fnodes{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem;flex:1;min-height:0}
  .fn{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  .fn .dot{width:4.6rem;height:4.6rem;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--bg);border:.35rem solid var(--k);font:800 1.5rem var(--fd);color:var(--k);position:relative;z-index:1}
  .fn .dot::after{content:"";position:absolute;inset:-.6rem;border-radius:50%;border:.2rem solid var(--k);opacity:0}
  .fn .box{flex:1;min-height:0;margin-top:.7rem;background:var(--panel);border:1px solid var(--line);border-top:.35rem solid var(--k);border-radius:1.2rem;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.55rem;overflow:hidden}
  .fn .rng{font:800 1.9rem/1 var(--fd);color:var(--k);letter-spacing:-.02em}
  .fn .rng small{display:block;font:800 .82rem var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.35rem}
  .fn .mail{background:#F7F4EC;color:#12161B;border-radius:.8rem;padding:.6rem .75rem;font:800 1.05rem/1.28 var(--fd)}
  .fn .mail small{display:block;font:700 .72rem var(--fd);letter-spacing:.12em;text-transform:uppercase;color:#6B6455;margin-bottom:.25rem}
  .fn .tag2{font:700 .88rem/1.3 var(--fb);color:var(--ink);background:rgba(255,255,255,.07);border-radius:.5rem;padding:.3rem .55rem}
  .fn .tag2.ag{color:#9EE3D4;background:rgba(79,193,176,.12)}
  .fn .today{display:flex;align-items:baseline;gap:.6rem;margin-top:auto}
  .fn .today b{font:800 3.6rem/1 var(--fd);color:var(--k);font-variant-numeric:tabular-nums}
  .fn .today span{font:700 .95rem/1.25 var(--fb);color:var(--dim)}
  .fn .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip{font:700 .82rem/1.2 var(--fb);color:var(--ink);border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:.5rem;padding:.28rem .5rem;max-width:100%}
  .chip em{font-style:normal;color:var(--k,var(--c));font-weight:800;margin-left:.3rem}
  .chip.more{color:var(--faint)}
  .fstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;flex:none}
  .fstrip .tile b{font-size:2.6rem}
  /* charts */
  .wk{display:flex;align-items:flex-end;gap:.6rem;flex:1;min-height:6rem;margin-top:.7rem}
  .wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .wk i{display:block;width:100%;height:0;max-height:calc(100% - 3rem);border-radius:.5rem .5rem 0 0;background:var(--c);flex:none;min-height:.2rem;position:relative}
  .wk i.t{background:repeating-linear-gradient(135deg,var(--c) 0 .4rem,transparent .4rem .75rem);border:1px solid var(--c);border-bottom:0}
  .wk em{font:800 1.3rem var(--fd);font-style:normal;margin-bottom:.25rem}
  .wk span{font:700 .9rem var(--fb);color:var(--faint);margin-top:.3rem}
  .wk div.now span{color:var(--ink)}
  .stack{display:flex;height:1.1rem;border-radius:1rem;overflow:hidden;margin-top:.5rem;background:rgba(255,255,255,.07)}
  .stack i{display:block;height:100%;width:0}
  .cols{display:flex;align-items:flex-end;gap:.45rem;flex:1;min-height:9rem;margin-top:.8rem}
  .cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .cols i{display:block;width:100%;height:0;max-height:calc(100% - 2.6rem);border-radius:.4rem .4rem 0 0;background:var(--coral);flex:none;position:relative}
  .cols i.now{background:var(--red)}
  .cols em{font:800 .95rem var(--fd);font-style:normal;margin-bottom:.2rem}
  .cols span{font:700 .8rem var(--fb);color:var(--faint);margin-top:.25rem}
  .notice{background:rgba(239,154,75,.1);border:1px solid rgba(239,154,75,.35);border-radius:1rem;padding:.7rem 1rem;font:600 1rem/1.45 var(--fb);color:var(--dim)}
  .notice b{color:var(--amber)}

  /* the foot: which scene, and the controls */
  .player{position:relative;z-index:2;display:flex;align-items:center;gap:1rem;padding:.5rem 2.2rem .75rem}
  .ctl{display:flex;gap:.4rem;flex:none}

    return '<section class="scene'+(i===at?' on':'')+'" style="--c:'+x.c+'" aria-hidden="'+(i===at?'false':'true')+'" aria-label="'+esc(x.tag+': '+x.title)+'">'
      + '<div class="shead"><div class="tag">'+esc(x.tag)+'<b>'+esc(x.title)+'</b></div><div class="say">'+x.say+'</div></div>'
      + notice + x.body + '</section>';
  }).join("");
  $("#dots").innerHTML = SCENES.map(function(s, i){ return '<button role="tab" style="--dc:'+s.dc+'" aria-label="Scene '+(i+1)+': '+esc(s.dot)+'" data-i="'+i+'"><i><u></u></i><span>'+esc(s.dot)+'</span></button>'; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#dots button"), function(b){ b.addEventListener("click", function(){ go(+b.getAttribute("data-i"), true); }); });
  var m = J && J.mode, mEl = $("#mode");
  mEl.className = "mode " + (m || "held");
  mEl.textContent = !(J && J.scope) ? "letters state not known" : m === "live" ? "Live: emails go to clients at " + hour() + ":00"
    : m === "test" ? "Test mode: copies go to the test inbox" : "Client mail is held";
  var when = J && J.generatedAt ? J.generatedAt.slice(11) : "";
  $("#sub").innerHTML = "Every policy behind on a premium, the emails your clients get, and the lapses"
    + (SRC === "snapshot" ? " &middot; <b style=\"color:var(--amber)\">snapshot: illustrative numbers</b>" : (when ? " &middot; read at <b>" + esc(when) + "</b>" : ""));
  show(at, true);
}
function animate(el){
  if (!el) return;
  var go2 = function(){
    Array.prototype.forEach.call(el.querySelectorAll("[data-w]"), function(i){ i.style.width=i.getAttribute("data-w")+"%"; });
    Array.prototype.forEach.call(el.querySelectorAll("[data-h]"), function(i){ i.style.height=i.getAttribute("data-h")+"%"; });
    Array.prototype.forEach.call(el.querySelectorAll("[data-off]"), function(i){ i.style.strokeDashoffset=i.getAttribute("data-off"); });
    Array.prototype.forEach.call(el.querySelectorAll("[data-c]"), function(c){ count(c, c.getAttribute("data-c")); });
  };
  if (MOTION) setTimeout(go2, 250); else go2();
}
function reset(el){
  if (!el || !MOTION) return;
  Array.prototype.forEach.call(el.querySelectorAll("[data-w]"), function(i){ i.style.width="0"; });
  Array.prototype.forEach.call(el.querySelectorAll("[data-h]"), function(i){ i.style.height="0"; });
  Array.prototype.forEach.call(el.querySelectorAll("[data-off]"), function(i){ i.style.strokeDashoffset=i.getAttribute("stroke-dasharray"); });
  Array.prototype.forEach.call(el.querySelectorAll("[data-c]"), function(c){ c.textContent = "0"; });
}
/* Counters count UP TO the figure; with motion off the figure is already there. */
function count(el, to){ to=Math.max(0,Math.round(Number(to)||0));
  if(!MOTION){ el.textContent = to.toLocaleString("en-US"); return; }
  var t1=performance.now(), dur=1500;
  (function step(t){ var k=Math.min(1,(t-t1)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e).toLocaleString("en-US"); if(k<1) requestAnimationFrame(step); })(t1); }
function show(i, first){
  var ss = document.querySelectorAll(".scene");
  if (!ss.length) return;
  at = (i + ss.length) % ss.length;
  Array.prototype.forEach.call(ss, function(s, k){ var on = k === at; s.classList.toggle("on", on); s.setAttribute("aria-hidden", on ? "false" : "true"); if (!on) reset(s); });
  document.documentElement.style.setProperty("--c", ss[at].style.getPropertyValue("--c"));
  Array.prototype.forEach.call(document.querySelectorAll("#dots button"), function(b, k){ b.classList.toggle("on", k===at); b.classList.toggle("done", k<at); b.setAttribute("aria-selected", k===at ? "true" : "false"); var u=b.querySelector("u"); u.style.width = k<at ? "100%" : "0"; });
  animate(ss[at]);
  t0 = Date.now(); held = 0;
  if (PHONE() && !first) window.scrollTo(0, 0);
}
function go(i, byHand){ show(i); if (byHand) t0 = Date.now(); }
function setPaused(v){
  paused = !!v;
  if (paused) held = Date.now() - t0; else t0 = Date.now() - held;
  document.body.classList.toggle("paused", paused);
  $("#pp").innerHTML = paused ? "▶ Play" : "❚❚ Pause";
  $("#pp").setAttribute("aria-label", paused ? "Play" : "Pause");
}
function tick(){
  var b = document.querySelectorAll("#dots button")[at];
  var gone = paused ? held : Date.now() - t0;
  if (b) b.querySelector("u").style.width = Math.min(100, 100*gone/DWELL) + "%";
  if (!paused && gone >= DWELL) show(at + 1);
}
setInterval(tick, 200);
$("#pp").addEventListener("click", function(){ setPaused(!paused); });
$("#prev").addEventListener("click", function(){ go(at - 1, true); });
$("#next").addEventListener("click", function(){ go(at + 1, true); });
document.addEventListener("keydown", function(e){
  if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "ArrowRight") go(at + 1, true);
  else if (e.key === "ArrowLeft") go(at - 1, true);
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
/* The wall (all.html) says when it turns to this stop: start again from the first scene. */
window.addEventListener("message", function(e){ var d = e.data || {}; if (d.rrb === "shown") { setPaused(false); show(0); } });
var reflow = null;
addEventListener("resize", function(){ clearTimeout(reflow); reflow = setTimeout(function(){ show(at, true); }, 250); });

/* Three tries, four seconds apart, before anything is called broken. */
function feed(url, body, tries){
  tries = tries === undefined ? 3 : tries;
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(err){ if(tries<=1) throw err; return new Promise(function(go){ setTimeout(go,4000); }).then(function(){ return feed(url,body,tries-1); }); });
}
function load(){
  if (!WALL45_URL) return;
  feed(WALL45_URL, { action: "intel.wall" })
    .then(function(j){
      if (!j || !j.ok || !j.data) throw new Error("bad feed");
      LEGACY = j.data; SRC = "feed";
      var jy = j.data.journey;
      J = jy && jy.scope && jy.lapses ? jy : { letters: SNAPSHOT.letters, bands: SNAPSHOT.bands, journeyError: jy && (jy.error || (jy.scope && !jy.lapses ? "an older PremiumDueDesk.gs" : "")) };
      draw(); $("#live").classList.add("on"); $("#liveTxt").textContent = "live";
    })
    .catch(function(){ $("#live").classList.remove("on"); $("#liveTxt").textContent = "snapshot"; });
}
draw(); load(); setInterval(load, 10*60*1000);
</script>
<script>
/* ── narration ───────────────────────────────────────────────────────────────
   The lines for this stop were rewritten with the 5 November rebuild and are
   in audio/lines.py ('index'); they are not voiced yet. Run audio/build-voice.py
   index, then audio/embed-audio.py index, and the button comes on. Until then
   it is off and says so. The player (all.html) is told when a screen speaks. */
var NARRATION = [];
var audio=null, aIdx=0, playing=false;
function tellWall(on){ try{ if(parent!==window) parent.postMessage({rrb:"narration", on:!!on}, "*"); }catch(e){} }
function toggleSound(){
  if(!NARRATION.length) return;
  if(playing) return endNarration();
  playing=true; aIdx=0;
  $("#sound").classList.add("on"); $("#sound").textContent="■ Stop";
  tellWall(true); next();
}
function endNarration(){
  playing=false; clearGuard();
  if(audio){ try{ audio.pause(); }catch(e){} audio.onended=audio.onerror=null; }
  $("#sound").classList.remove("on"); $("#sound").textContent="▶ Narrate";
  tellWall(false);
}
var guard=null;
function clearGuard(){ if(guard){ clearTimeout(guard); guard=null; } }
function next(){
  if(!playing||aIdx>=NARRATION.length) return endNarration();
  clearGuard();
  var line=NARRATION[aIdx], mine=audio=new Audio(line.a), moved=false;
  function on(){ if(moved||audio!==mine) return; moved=true; clearGuard(); aIdx++; setTimeout(next,700); }
  function off(){ if(moved||audio!==mine) return; moved=true; endNarration(); }
  audio.onended=on; audio.onerror=off;
  guard=setTimeout(on,((line.s||3.4)+8)*1000);
  audio.play().catch(off);
}
window.addEventListener("message", function(e){
  var d=e.data||{};
  if(d.rrb==="narrate") toggleSound();
  else if(d.rrb==="hush" && playing) endNarration();
});
(function(){ var b=$("#sound"); if(!b) return; b.disabled=!NARRATION.length; b.title=NARRATION.length?"":"Narration not voiced yet: audio/build-voice.py index, then audio/embed-audio.py index"; })();
</script>
