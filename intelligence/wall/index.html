<!DOCTYPE html>
<!-- PREMIUM DUES · THE LETTERS (rebuilt 5 November 2026; stop 13 of the Intelligence wall, tab "Premium dues · the letters").
     Ricky, 4 November: "can they run within the slides and change, so you have the policies under 1 year, then 2 year, then
     3 year, then 4 year, then 5 years, then over 5 years, and the ability to pause as each [is] given powerful insights with
     motion and graphics etc, and then the 45 days, the 60, 75 and the 90 days before the lapse, and then the lapses".
     Eleven scenes inside this one stop, about nine seconds each, that turn by themselves:
       1-6   one per band of how long the policy has been in force: behind on a premium, the premium, how they pay and what
             should have collected itself, whose book (active agents', and orphans' to reassign), where they sit across the
             45, 60, 75 and 90-day lines, and what lapsed
       7-10  the four letters the Premium Due Desk sends (45, 60, 75, and 90 before the lapse): the letter as the client gets
             it, what is on that line today, who checked it, what went at ten (a test copy is never called a letter), the
             week, what came back and what happened after
       11    the lapses this year: by month, by band, by agent, and which letters each had first
     Pause, step back and forward: the buttons at the foot, the space bar and the arrow keys; the dots jump to a scene.
     From intel.wall's `journey` block (iWallJourney_ in PremiumDueDesk.gs). Counts, premium totals, staff first names and
     our own agents' names; never a client. Dominic, Javid, Aleema and Terek are still with the company: active, always. -->

<style>

  :root{
    --bg:#0E1116; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --ink:#F4F1EA; --dim:#B4B0A8; --faint:#8C877F;

    --ease:cubic-bezier(.16,1,.3,1); --c:var(--gold);
  }
  html{font-size:min(calc(100vw / 120), calc(100vh / 67.5))}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:var(--fb);display:flex;flex-direction:column;position:relative;-webkit-font-smoothing:antialiased}
  .glow{position:fixed;border-radius:50%;filter:blur(7rem);pointer-events:none;z-index:0;transition:background 1.2s}
  .g1{width:44rem;height:44rem;left:-14rem;top:-20rem;background:var(--c);opacity:.20}
  .g2{width:40rem;height:40rem;right:-12rem;bottom:-22rem;background:#4FC1B0;opacity:.12}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:1.1rem;padding:1.2rem 2.2rem .3rem}
  .mark{width:3.2rem;height:3.2rem;flex:none;display:grid;place-items:center}
  .mark img{width:100%;height:100%;display:block}
  header h1{font:800 2rem/1.05 var(--fd);letter-spacing:-.02em}
  header .sub{font-size:1rem;color:var(--dim);margin-top:.2rem}
  header .sub b{color:var(--ink)}
  .right{margin-left:auto;display:flex;align-items:center;gap:1rem}
  .btn{font:800 1rem var(--fd);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:.8rem;padding:.6rem 1rem;cursor:pointer}
  .btn.on{background:var(--gold);color:#16171B}
  .btn:disabled{opacity:.45;cursor:default}
  .live{display:flex;align-items:center;gap:.5rem;font:700 .95rem var(--fd);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .live i{width:.75rem;height:.75rem;border-radius:50%;background:var(--faint)}
  .live.on i{background:var(--green)}
  .clock{font:800 1.9rem var(--fd);font-variant-numeric:tabular-nums}
  .mode{font:800 .9rem var(--fd);letter-spacing:.04em;padding:.4rem .75rem;border-radius:.6rem;white-space:nowrap}
  .mode.test{background:rgba(239,154,75,.16);color:var(--amber);border:1px solid rgba(239,154,75,.4)}
  .mode.live{background:rgba(120,209,152,.14);color:var(--green);border:1px solid rgba(120,209,152,.4)}
  .mode.held{background:rgba(232,98,90,.14);color:var(--coral);border:1px solid rgba(232,98,90,.4)}

  /* the stage: one scene at a time */
  #stage{position:relative;z-index:1;flex:1;min-height:0;margin:.4rem 2.2rem .4rem}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;gap:.8rem;opacity:0;visibility:hidden;transition:opacity .6s,visibility 0s .6s}
  .scene.on{opacity:1;visibility:visible;transition:opacity .6s}
  .shead{display:flex;align-items:flex-end;gap:1.4rem}
  .shead .tag{flex:none;font:800 1rem var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
  .shead .tag b{display:block;font:800 3.6rem/1 var(--fd);letter-spacing:-.03em;text-transform:none;color:var(--c);margin-top:.25rem}
  .shead .say{font:700 1.5rem/1.35 var(--fd);color:var(--ink);max-width:70rem;padding-bottom:.35rem}
  .shead .say em{font-style:normal;color:var(--c)}
  .grid{flex:1;min-height:0;display:grid;gap:.9rem}
  .g-band{grid-template-columns:31rem minmax(0,1fr) minmax(0,1fr)}
  .g-letter{grid-template-columns:36rem minmax(0,1fr) minmax(0,1fr)}
  .g-lapse{grid-template-columns:31rem minmax(0,1.2fr) minmax(0,1fr)}
  .col{display:flex;flex-direction:column;gap:.9rem;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:1.4rem;padding:1rem 1.25rem;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .col > .card{flex:1 1 auto}
  .card .rows{flex:1;justify-content:space-evenly}
  .card.grow{flex:1}
  .kick{font:800 .9rem var(--fd);letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
  .kick span{color:var(--faint);letter-spacing:.04em;text-transform:none;font-weight:700}
  .note{font:600 .95rem/1.4 var(--fb);color:var(--faint)}
  .note b{color:var(--dim)}
  .big{font:800 6.4rem/1 var(--fd);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--c)}
  .bigk{font:700 1.1rem/1.35 var(--fb);color:var(--dim);margin-top:.35rem}
  .bigk b{color:var(--ink)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
  .tiles.three{grid-template-columns:repeat(3,1fr)}
  .tile{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:1rem;padding:.6rem .8rem;min-width:0}
  .tile b{display:block;font:800 2rem/1 var(--fd);font-variant-numeric:tabular-nums}
  .tile small{display:block;font:600 .88rem/1.25 var(--fb);color:var(--dim);margin-top:.3rem}
  .tile.z b{color:rgba(255,255,255,.28)}
  .ringw{display:flex;align-items:center;gap:1.1rem;margin-top:.9rem}
  .ring{width:9rem;height:9rem;flex:none;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:11}
  .ring .bgc{stroke:rgba(255,255,255,.08)}
  .ring .fg{stroke:var(--c);stroke-linecap:round}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 2.1rem var(--fd)}
  .ringw p{font:600 1rem/1.4 var(--fb);color:var(--dim)} .ringw p b{color:var(--ink)}
  .split{display:flex;height:1rem;border-radius:1rem;overflow:hidden;margin-top:.6rem;background:rgba(255,255,255,.07)}
  .split i{display:block;height:100%;width:0}
  .lg{display:flex;gap:1.2rem;margin-top:.45rem;font:600 .95rem var(--fb);color:var(--dim);flex-wrap:wrap}
  .lg span{white-space:nowrap} .lg i{display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;margin-right:.35rem;vertical-align:.02rem}
  .lg b{color:var(--ink)}
  /* horizontal bars */
  .rows{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
  .r{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 4rem;gap:.8rem;align-items:center}
  .r .l{font:600 1.1rem var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .t{height:.95rem;border-radius:1rem;background:rgba(255,255,255,.07);overflow:hidden}
  .r .t i{display:block;height:100%;width:0;border-radius:1rem;background:var(--grey)}
  .r .t i.a{background:var(--teal)} .r .t i.o{background:var(--coral)} .r .t i.g{background:var(--gold)} .r .t i.c{background:var(--c)}
  .r .v{font:800 1.3rem var(--fd);text-align:right;font-variant-numeric:tabular-nums}
  .r.orph .l{color:var(--coral)}
  /* the days-behind ladder */
  .ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;align-items:end;flex:1;min-height:9rem;margin-top:.8rem}
  .ladder div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .ladder i{display:block;width:100%;height:0;max-height:calc(100% - 4.4rem);border-radius:.6rem .6rem 0 0;background:var(--k,var(--grey));flex:none}
  .ladder em{font:800 1.4rem var(--fd);font-style:normal;margin-bottom:.3rem;font-variant-numeric:tabular-nums}
  .ladder span{font:700 .9rem var(--fb);color:var(--dim);margin-top:.35rem;text-align:center;line-height:1.2}
  /* the letter */
  .env{flex:none;background:#F7F4EC;color:#1E2228;border-radius:1.2rem;padding:1.2rem 1.4rem 1.3rem;position:relative;box-shadow:0 1rem 2.6rem rgba(4,6,10,.45)}
  .env::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.5rem;border-radius:1.2rem 0 0 1.2rem;background:var(--c)}
  .env .from{display:flex;align-items:center;gap:.6rem;font:700 .95rem var(--fb);color:#5A5F66}
  .env .from img{width:1.7rem;height:1.7rem}
  .env .from span{margin-left:auto;font-weight:600}
  .env .to{font:600 .9rem var(--fb);color:#6B7078;margin-top:.35rem;padding-bottom:.55rem;border-bottom:1px solid #E2DDD0}
  .env .subj{font:800 1.5rem/1.25 var(--fd);margin-top:.7rem;color:#12161B}
  .env .gist{font:500 1.08rem/1.5 var(--fb);color:#3D434B;margin-top:.6rem}
  .env .ask{display:inline-block;margin-top:.9rem;font:800 1rem var(--fd);background:#1E2228;color:#F7F4EC;border-radius:.6rem;padding:.5rem .9rem}
  .env .alts{font:600 .9rem/1.4 var(--fb);color:#6B7078;margin-top:.8rem;padding-top:.6rem;border-top:1px dashed #D6D0C2}
  .env .alts b{color:#3D434B}
  .wk{display:flex;align-items:flex-end;gap:.6rem;flex:1;min-height:6rem;margin-top:.7rem}
  .wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .wk i{display:block;width:100%;height:0;max-height:calc(100% - 3rem);border-radius:.5rem .5rem 0 0;background:var(--c);flex:none;min-height:.2rem}
  .wk i.t{background:repeating-linear-gradient(135deg,var(--c) 0 .4rem,transparent .4rem .75rem);border:1px solid var(--c);border-bottom:0}
  .wk em{font:800 1.2rem var(--fd);font-style:normal;margin-bottom:.25rem}
  .wk span{font:700 .9rem var(--fb);color:var(--faint);margin-top:.3rem}
  .stack{display:flex;height:1rem;border-radius:1rem;overflow:hidden;margin-top:.5rem;background:rgba(255,255,255,.07)}
  .stack i{display:block;height:100%;width:0}
  .cols{display:flex;align-items:flex-end;gap:.45rem;flex:1;min-height:9rem;margin-top:.8rem}
  .cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .cols i{display:block;width:100%;height:0;max-height:calc(100% - 2.6rem);border-radius:.4rem .4rem 0 0;background:var(--coral);flex:none}
  .cols i.now{background:var(--red)}
  .cols em{font:800 .95rem var(--fd);font-style:normal;margin-bottom:.2rem}
  .cols span{font:700 .8rem var(--fb);color:var(--faint);margin-top:.25rem}
  .notice{background:rgba(239,154,75,.1);border:1px solid rgba(239,154,75,.35);border-radius:1rem;padding:.7rem 1rem;font:600 1rem/1.45 var(--fb);color:var(--dim)}
  .notice b{color:var(--amber)}

  /* the foot: which scene, and the controls */
  .player{position:relative;z-index:2;display:flex;align-items:center;gap:1rem;padding:.55rem 2.2rem .8rem}
  .ctl{display:flex;gap:.4rem;flex:none}
  .ctl button{font:800 1.05rem var(--fd);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:.7rem;width:2.9rem;height:2.6rem;cursor:pointer}
  .ctl button.pp{width:auto;padding:0 .9rem;min-width:6.4rem}
  .dots{flex:1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:.4rem;min-width:0}
  .dots button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;min-width:0}
  .dots button i{display:block;height:.35rem;border-radius:1rem;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
  .dots button i u{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--dc,var(--gold))}
  .dots button.done i{background:rgba(255,255,255,.32)}
  .dots button span{font:700 .78rem var(--fb);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dots button.on span{color:var(--ink)}
  .dots button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:.3rem}
  .ctl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  @media (prefers-reduced-motion:no-preference){
    .glow{animation:drift 26s ease-in-out infinite alternate}
    .g2{animation-duration:32s;animation-direction:alternate-reverse}
    @keyframes drift{to{transform:translate(8rem,4rem) scale(1.1)}}
    .live.on i{animation:ping 1.8s infinite}
    @keyframes ping{0%{box-shadow:0 0 0 0 rgba(120,209,152,.7)}70%{box-shadow:0 0 0 .8rem rgba(120,209,152,0)}100%{box-shadow:0 0 0 0 rgba(120,209,152,0)}}
    .scene.on .card{animation:rise .8s var(--ease) backwards}
    .scene.on .col:nth-child(2) .card{animation-delay:.12s} .scene.on .col:nth-child(3) .card{animation-delay:.24s}
    @keyframes rise{from{opacity:0;transform:translateY(1.4rem)}}
    .scene.on .shead .tag b{animation:pop .9s var(--ease) backwards}
    @keyframes pop{from{opacity:0;transform:scale(.85)}}
    .scene.on .shead .say{animation:rise .9s var(--ease) .15s backwards}
    .scene.on .env{animation:post 1.1s var(--ease) .2s backwards}
    @keyframes post{from{opacity:0;transform:translateY(-2.2rem) rotate(-2.5deg) scale(.95)}}
    .r .t i,.split i,.stack i{transition:width 1.3s var(--ease)}
    .ladder i,.wk i,.cols i{transition:height 1.2s var(--ease)}
    .ring .fg{transition:stroke-dashoffset 1.5s var(--ease)}
  }
  @media (max-width:900px){
    html{font-size:12.5px} html,body{height:auto;overflow:auto}
    header{flex-wrap:wrap;padding:1.2rem 1.4rem .6rem} .right{margin-left:0;width:100%;justify-content:space-between;flex-wrap:wrap}
    .glow{display:none}
    #stage{margin:.4rem 1.4rem}
    .scene{position:static;display:none}
    .scene.on{display:flex}
    .shead{flex-direction:column;align-items:flex-start;gap:.4rem}
    .shead .tag b{font-size:3rem} .shead .say{font-size:1.3rem}
    .grid,.g-band,.g-letter,.g-lapse{grid-template-columns:1fr}
    .big{font-size:4.4rem}
    .player{position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap;padding:.7rem 1.4rem;border-top:1px solid var(--line)}
    .dots{grid-template-columns:repeat(11,1fr);order:-1;flex-basis:100%}
    .dots button span{display:none}
    .r{grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.4rem}
    .col > .card{flex:none} .card .rows{flex:none}
    .ladder{flex:none;height:13rem} .wk{flex:none;height:9rem} .cols{flex:none;height:11rem}
  }
</style>
</head>

<script>
/* ── DATA ────────────────────────────────────────────────────────────────────
   AGGREGATES ONLY. Counts, premium totals, staff first names and our own
   agents' names; no client, no policy number. The feed is intel.wall, which
   takes no token; this stop's picture is its `journey` block. Until the feed
   answers, the snapshot below is shown, and it says so: every number in it is

      + '<div class="t"><i class="'+(o?'o':(typeof cls==="function"?cls(x):cls))+'" data-w="'+(100*x.n/max).toFixed(1)+'"></i></div>'
      + '<div class="v">'+fmt(x.n)+'</div></div>';

}

function animate(el){
  if (!el) return;
  var go2 = function(){
    Array.prototype.forEach.call(el.querySelectorAll("[data-w]"), function(i){ i.style.width=i.getAttribute("data-w")+"%"; });
    Array.prototype.forEach.call(el.querySelectorAll("[data-h]"), function(i){ i.style.height=i.getAttribute("data-h")+"%"; });
    Array.prototype.forEach.call(el.querySelectorAll("[data-off]"), function(i){ i.style.strokeDashoffset=i.getAttribute("data-off"); });
    Array.prototype.forEach.call(el.querySelectorAll("[data-c]"), function(c){ count(c, c.getAttribute("data-c")); });
  };
  if (MOTION) setTimeout(go2, 250); else go2();
}
function reset(el){
  if (!el || !MOTION) return;
  Array.prototype.forEach.call(el.querySelectorAll("[data-w]"), function(i){ i.style.width="0"; });
  Array.prototype.forEach.call(el.querySelectorAll("[data-h]"), function(i){ i.style.height="0"; });
  Array.prototype.forEach.call(el.querySelectorAll("[data-off]"), function(i){ i.style.strokeDashoffset=i.getAttribute("stroke-dasharray"); });
  Array.prototype.forEach.call(el.querySelectorAll("[data-c]"), function(c){ c.setAttribute("data-v", 0); c.textContent = "0"; });
}
function count(el, to){ to=Math.max(0,Math.round(Number(to)||0));
  if(!MOTION){ el.textContent = to.toLocaleString("en-US"); return; }
  var t1=performance.now(), dur=1300;
  (function step(t){ var k=Math.min(1,(t-t1)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e).toLocaleString("en-US"); if(k<1) requestAnimationFrame(step); })(t1); }
function show(i, first){
  var ss = document.querySelectorAll(".scene");
  if (!ss.length) return;
  at = (i + ss.length) % ss.length;
  Array.prototype.forEach.call(ss, function(s, k){ var on = k === at; s.classList.toggle("on", on); s.setAttribute("aria-hidden", on ? "false" : "true"); if (!on) reset(s); });
  document.documentElement.style.setProperty("--c", ss[at].style.getPropertyValue("--c"));
  Array.prototype.forEach.call(document.querySelectorAll("#dots button"), function(b, k){ b.classList.toggle("on", k===at); b.classList.toggle("done", k<at); b.setAttribute("aria-selected", k===at ? "true" : "false"); var u=b.querySelector("u"); u.style.width = k<at ? "100%" : "0"; });
  animate(ss[at]);
  t0 = Date.now(); held = 0;
  if (PHONE() && !first) window.scrollTo(0, 0);
}
function go(i, byHand){ show(i); if (byHand) t0 = Date.now(); }
function setPaused(v){
  paused = !!v;
  if (paused) held = Date.now() - t0; else t0 = Date.now() - held;
  $("#pp").innerHTML = paused ? "▶ Play" : "❚❚ Pause";
  $("#pp").setAttribute("aria-label", paused ? "Play" : "Pause");
}
function tick(){
  var b = document.querySelectorAll("#dots button")[at];
  var gone = paused ? held : Date.now() - t0;
  if (b) b.querySelector("u").style.width = Math.min(100, 100*gone/DWELL) + "%";
  if (!paused && gone >= DWELL) show(at + 1);
}
setInterval(tick, 200);
$("#pp").addEventListener("click", function(){ setPaused(!paused); });
$("#prev").addEventListener("click", function(){ go(at - 1, true); });
$("#next").addEventListener("click", function(){ go(at + 1, true); });
document.addEventListener("keydown", function(e){
  if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "ArrowRight") go(at + 1, true);
  else if (e.key === "ArrowLeft") go(at - 1, true);
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
/* The wall (all.html) says when it turns to this stop: start again from the first scene. */

/* Three tries, four seconds apart, before anything is called broken. */
function feed(url, body, tries){
  tries = tries === undefined ? 3 : tries;
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(err){ if(tries<=1) throw err; return new Promise(function(go){ setTimeout(go,4000); }).then(function(){ return feed(url,body,tries-1); }); });
}
function load(){
  if (!WALL45_URL) return;
  feed(WALL45_URL, { action: "intel.wall" })
    .then(function(j){
      if (!j || !j.ok || !j.data) throw new Error("bad feed");
      LEGACY = j.data; SRC = "feed";
      var jy = j.data.journey;
      J = jy && jy.scope && jy.lapses ? jy : { letters: SNAPSHOT.letters, bands: SNAPSHOT.bands, journeyError: jy && (jy.error || (jy.scope && !jy.lapses ? "an older PremiumDueDesk.gs" : "")) };
      draw(); $("#live").classList.add("on"); $("#liveTxt").textContent = "live";
    })
    .catch(function(){ $("#live").classList.remove("on"); $("#liveTxt").textContent = "snapshot"; });
}
draw(); load(); setInterval(load, 10*60*1000);

<script>
/* ── narration ───────────────────────────────────────────────────────────────
   The lines for this stop were rewritten with the 5 November rebuild and are
   in audio/lines.py ('index'); they are not voiced yet. Run audio/build-voice.py
   index, then audio/embed-audio.py index, and the button comes on. Until then
   it is off and says so. The player (all.html) is told when a screen speaks. */
var NARRATION = [];
var audio=null, aIdx=0, playing=false;
function tellWall(on){ try{ if(parent!==window) parent.postMessage({rrb:"narration", on:!!on}, "*"); }catch(e){} }
function toggleSound(){
  if(!NARRATION.length) return;
  if(playing) return endNarration();
  playing=true; aIdx=0;
  $("#sound").classList.add("on"); $("#sound").textContent="■ Stop";
  tellWall(true); next();
}
function endNarration(){
  playing=false; clearGuard();
  if(audio){ try{ audio.pause(); }catch(e){} audio.onended=audio.onerror=null; }
  $("#sound").classList.remove("on"); $("#sound").textContent="▶ Narrate";
  tellWall(false);
}
var guard=null;
function clearGuard(){ if(guard){ clearTimeout(guard); guard=null; } }
function next(){
  if(!playing||aIdx>=NARRATION.length) return endNarration();
  clearGuard();
  var line=NARRATION[aIdx], mine=audio=new Audio(line.a), moved=false;
  function on(){ if(moved||audio!==mine) return; moved=true; clearGuard(); aIdx++; setTimeout(next,700); }
  function off(){ if(moved||audio!==mine) return; moved=true; endNarration(); }
  audio.onended=on; audio.onerror=off;
  guard=setTimeout(on,((line.s||3.4)+8)*1000);
  audio.play().catch(off);
}
window.addEventListener("message", function(e){
  var d=e.data||{};
  if(d.rrb==="narrate") toggleSound();
  else if(d.rrb==="hush" && playing) endNarration();
});
(function(){ var b=$("#sound"); if(!b) return; b.disabled=!NARRATION.length; b.title=NARRATION.length?"":"Narration not voiced yet: audio/build-voice.py index, then audio/embed-audio.py index"; })();
</script>
