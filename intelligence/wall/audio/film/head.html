<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Branch Intelligence Wall</title>
<meta name="description" content="Ninety seconds on the Branch Intelligence Wall — premium dues at 45, 60 and 90 days, the contracts we hold, and the licence year. Everything that used to be a Friday report, live.">
<meta name="theme-color" content="#061c31">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- THE FONT MUST NOT BLOCK THE PICTURE. A plain stylesheet link in the head is
     render-blocking: until it answers, the screen is blank. Measured at 12.5s on
     a link that was merely slow, and a wall screen on branch wifi is exactly
     where that happens. Loading it as print media and promoting it on load makes
     it non-blocking — the system fallback in every font stack shows instantly
     and the webfont swaps in when it arrives. noscript keeps it working with
     scripting off. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<style>
  /* The wall's own palette, because this film is about the wall. The pictures
     are the subject — every scene that has one gives it the room and puts the
     words underneath, rather than competing with it. */
  :root{
    --ink:#eaf4ff; --dim:#9dbdd8; --faint:#6d8ba6;
    --blue:#37b1ec; --blue2:#0b7fd4; --gold:#f5b93b;
    --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.05);
    --ease:cubic-bezier(.16,1,.3,1);
    --d:'Newsreader',Georgia,serif; --b:Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  /* THE PAGE BEHIND THE FILM, not a void — a 16:9 stage on a phone in portrait
     is a band with 60% of the screen around it, and flat black there reads as
     something failing to load. */
  body{color:var(--ink);font-family:var(--b);overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 600px at 20% 0%,rgba(55,177,236,.10),transparent 60%),
      radial-gradient(700px 500px at 85% 8%,rgba(245,185,59,.07),transparent 62%),
      linear-gradient(165deg,#050f22 0%,#04091a 60%,#03060f 100%)}

  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center;overflow:hidden;
    background:
      radial-gradient(1200px 760px at 12% -6%,rgba(55,177,236,.20),transparent 60%),
      radial-gradient(1000px 640px at 90% 4%,rgba(11,127,212,.17),transparent 62%),
      radial-gradient(900px 700px at 58% 108%,rgba(245,185,59,.09),transparent 60%),
      linear-gradient(165deg,#061c31 0%,#08243f 55%,#050f22 100%)}

  .scene{position:absolute;inset:0;padding:86px 96px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    opacity:0;visibility:hidden;transform:translateY(20px);
    transition:opacity .8s var(--ease),transform .8s var(--ease),visibility .8s}
  .scene.on{opacity:1;visibility:visible;transform:none}
  .scene.left{align-items:flex-start;text-align:left}

  .kick{font:700 16px var(--b);letter-spacing:.26em;text-transform:uppercase;
    color:var(--blue);margin-bottom:20px}
  /* A scene built around a wall shot needs its margins back — the default
     86px top and bottom is 172px the picture cannot use. */
  .scene.shotscene{padding:40px 56px}
  .shotscene .kick{margin-bottom:14px}
  .shotscene .cap{margin-top:20px;font-size:23px}
  .kick.gold{color:var(--gold)}
  h1{font:600 92px/1.05 var(--d);margin:0 0 20px;letter-spacing:-1.6px}
  h2{font:600 60px/1.12 var(--d);margin:0 0 16px;letter-spacing:-1px}
  .lede{font:400 29px/1.5 var(--b);color:var(--dim);max-width:1180px;margin:0}
  .lede b{color:var(--ink);font-weight:600}

  /* pictures */
  .shot{border-radius:14px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 30px 90px -30px rgba(0,0,0,.85);background:#0b1626}
  .shot img{display:block;width:100%;height:auto}
  /* THE SHOT MOVES. A wall capture held still for six seconds is a photograph
     of a screen; a slow push in keeps the frame alive without turning the
     evidence into an effect. The scene is the viewport, so the image scales
     inside its own rounded box and nothing spills. */
  .shot{overflow:hidden}
  .scene.on .shot img{animation:push 7.6s var(--ease) forwards}
  @keyframes push{from{transform:scale(1.045)} to{transform:scale(1)}}
  /* The caption arrives after the picture rather than with it, so the eye lands
     on the wall first and reads the line second. */
  .scene .cap{opacity:0;transform:translateY(12px)}
  .scene.on .cap{opacity:1;transform:none;
    transition:opacity .5s var(--ease) .35s,transform .6s var(--ease) .35s}
  .scene.on h1,.scene.on h2{animation:settle 3.4s var(--ease) forwards}
  @keyframes settle{from{transform:scale(1.012)} to{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .scene.on .shot img,.scene.on h1,.scene.on h2{animation:none}
    .scene .cap{opacity:1;transform:none} .scene.on .cap{transition:none}
  }
  /* THE WALL SHOT IS THE POINT OF THIS FILM, so it gets the frame. At 1290px a
     1920-wide wall renders at two thirds and the panel labels stop being
     readable across a room, which makes the shot decoration rather than
     evidence. 1500px is the widest that still leaves room for a kicker above
     and a caption below inside 1080. */
  .wide{width:1500px}
  .paper{width:600px;background:#fff}
  .cap{font:500 24px/1.45 var(--b);color:var(--dim);margin:26px 0 0;max-width:1200px}
  .cap b{color:var(--ink);font-weight:600}
  /* A wall shot is wide and short; a letter is narrow and very tall. Left to
     themselves in a row they leave half the frame empty and the eye goes to the
     gap. The letter is capped and shows its top — which is the part being
     talked about — so both sides finish at the same line. */
  .pair{display:flex;gap:40px;align-items:center;justify-content:center}
  .pair .shot.wide{width:900px}
  .pair .shot.paper{width:430px;max-height:660px}
  .pair .shot.paper img{object-fit:cover;object-position:top;max-height:660px}

  /* the three-band strip */
  .bands{display:flex;gap:26px;justify-content:center;margin-top:8px}
  .bandcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 34px;min-width:250px}
  .bandcard .n{font:800 66px var(--b);letter-spacing:-2.4px;line-height:1;color:var(--blue)}
  .bandcard.g .n{color:var(--gold)}
  .bandcard .k{font:500 20px var(--b);color:var(--dim);margin-top:10px}

  /* the reveal used on the "why" scene */
  .why{display:flex;flex-direction:column;gap:18px;margin-top:10px}
  .why div{font:400 38px/1.35 var(--b);color:var(--dim);opacity:0;
    transform:translateY(10px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .scene.on .why div{opacity:1;transform:none}
  .scene.on .why div:nth-child(1){transition-delay:.2s}
  .scene.on .why div:nth-child(2){transition-delay:1.3s}
  .scene.on .why div:nth-child(3){transition-delay:2.4s}
  .why b{color:var(--ink);font-weight:600}

  .mark{display:flex;align-items:center;gap:18px;margin-bottom:40px}
  .mark i{width:60px;height:60px;border-radius:17px;font-style:normal;overflow:hidden;
    background:#07131f;display:grid;place-items:center}
  .mark i img{width:60px;height:60px;display:block}
  .mark span{font:600 22px var(--d);color:var(--dim)}

  /* ══════════════════════════════════════════════════════════════════════
     THE ZOOM
     ══════════════════════════════════════════════════════════════════════
     A wall shown whole for four seconds is a picture of a wall. Nobody reads a
     panel at a fifth of its size, so the film said "look at this" about things
     that could not be looked at — which is why the first cut felt like slides
     flicking past. A zoom scene shows the whole wall for a beat, then travels
     into ONE panel and holds there while the line about it is spoken.

     The origins are measured, not guessed. Each panel's rect was read off the
     rendered wall and the transform-origin computed so that the panel lands in
     the middle of the frame: for a card centred at C, scaling by S about
     P = (S·C − F)/(S − 1) puts C exactly on the frame centre F.

     AND THEN CLAMPED TO THE PICTURE. That formula puts the origin outside the
     image for a card near an edge, and scaling about a point outside the image
     slides it off its own frame: the hero panel came out centred with 440px of
     bare navy beside it. An origin inside 0-100% always covers the frame, so
     edge panels are taken as close to centre as coverage allows and no further.

     Which is also why the stills are captured at device scale 2 and stored at
     2600px rather than 1600: a 2.4x zoom displays a 1500px frame at 3600, and
     from a 1600px source that is mush. */
  .shot.zoom{overflow:hidden}
  .shot.zoom img{transform-origin:var(--zx) var(--zy);transform:scale(1)}
  .scene.on .shot.zoom img{animation:zoomin 6.6s var(--ease) forwards}
  @keyframes zoomin{
    0%   {transform:scale(1)}
    18%  {transform:scale(1)}
    100% {transform:scale(var(--zs))}
  }
  /* A zoom that never comes back is disorienting on the next scene, so the two
     panels of the same wall pull out slightly before the cut. */
  .shot.zoom.out img{transform:scale(var(--zs))}
  .scene.on .shot.zoom.out img{animation:zoomout 6.6s var(--ease) forwards}
  @keyframes zoomout{
    0%   {transform:scale(var(--zs))}
    72%  {transform:scale(var(--zs))}
    100% {transform:scale(calc((var(--zs) + 1) / 2))}
  }
  @media (prefers-reduced-motion:reduce){
    .scene.on .shot.zoom img,.scene.on .shot.zoom.out img{
      animation:none;transform:scale(var(--zs))}
  }
  /* The chip that says which of the five walls is on screen. The notes back
     were that the walls ran together; naming each one every time it appears is
     most of the cure. */
  .wallid{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .wallid .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(120deg,var(--gold),var(--gold2));color:#3a2404;
    font:800 20px var(--b)}
  .wallid .t{font:800 17px var(--b);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .wallid .t em{font-style:normal;color:var(--dim);letter-spacing:.12em}
  .wallid.blue .n{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#04202e}
  .wallid.blue .t{color:var(--blue)}
  /* "Look closer" — the visual cue that a zoom is happening, so the movement
     reads as deliberate rather than as the picture drifting. */
  .closer{display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;
    padding:7px 16px 7px 12px;border-radius:999px;border:1px solid rgba(245,185,59,.4);
    background:rgba(245,185,59,.09);color:var(--gold);
    font:700 14px var(--b);letter-spacing:.18em;text-transform:uppercase}
  .closer svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

  /* WHAT THE NUMBERS ARE. Every figure on these walls is the branch's own, read
     out of Salesforce on the day of capture. Saying so on the film is the only
     honest answer to "is this real or is it a mock-up" — and it is also the
     reason the film is not shown to anyone outside the branch. */
  /* Clear of the hint, which sits bottom left. Full width and centred, the two
     ran straight through each other. */
  #prov{position:absolute;left:300px;right:300px;bottom:24px;text-align:center;z-index:4;
    font:500 14px var(--b);color:var(--faint);letter-spacing:.03em;
    opacity:0;transition:opacity .6s var(--ease)}
  #prov.on{opacity:1}
  #prov b{color:var(--dim);font-weight:600}

  /* THE ACT SCENE. A statute on a wall has to be readable as a statute: set in
     the serif, hung off a rule, and attributed. The line under it is the point
     being made and is deliberately in the sans, so nobody reads our argument as
     part of the quotation. */
  .quote{max-width:1500px;text-align:left}
  .quote .cite{font:700 15px var(--b);letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold);margin-bottom:22px}
  .quote blockquote{margin:0;padding-left:38px;border-left:3px solid rgba(245,185,59,.55);
    font:400 46px/1.42 var(--d);color:var(--ink)}
  .quote .after{font:400 30px/1.5 var(--b);color:var(--dim);margin:34px 0 0;padding-left:41px}
  .quote .after b{color:var(--ink);font-weight:600}

  /* THE SOUND GATE. See the note in player.js — the film must not start its
     clock until the browser has actually let it make a sound. */
  #gate{position:absolute;inset:0;display:none;place-items:center;z-index:7;
    background:rgba(4,9,26,.72);cursor:pointer;backdrop-filter:blur(2px)}
  #gate.on{display:grid}
  #gate .inner{display:flex;flex-direction:column;align-items:center;gap:22px}
  #gate .pb{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(120deg,var(--gold),var(--gold2));color:#3a2404;
    box-shadow:0 18px 50px rgba(0,0,0,.6);transition:transform .3s var(--ease)}
  #gate:hover .pb{transform:scale(1.06)}
  #gate .lbl{font:700 22px var(--b);color:var(--ink)}
  #gate .sub{font:500 15px var(--b);color:var(--faint);margin-top:-12px}
  #prog{position:absolute;left:0;bottom:0;height:4px;width:0;
    background:linear-gradient(90deg,var(--blue),var(--gold))}
  /* TWO CONTROLS, NO CAPTION. The reader's name sat up here and it is not
     information anybody watching needs; what they do need is a way to stop the
     film, which there was no button for at all. */
  #chrome{position:absolute;right:36px;top:30px;display:flex;align-items:center;gap:12px;z-index:5}
  #chrome button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer;padding:0;
    display:grid;place-items:center;transition:background .2s var(--ease)}
  #chrome button:hover{background:rgba(255,255,255,.15)}
  #chrome svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;fill-rule:evenodd}
  #chrome svg path{fill:currentColor;stroke:none}
  #mute svg .i-on,#mute svg .i-off{fill:none;stroke:currentColor}
  #pp .i-play{display:none}
  #pp.paused .i-pause{display:none}
  #pp.paused .i-play{display:block}
  #mute .i-off{display:none}
  #mute.off .i-on{display:none}
  #mute.off .i-off{display:block}
  #replay{position:absolute;inset:0;display:none;place-items:center;z-index:6;
    background:rgba(4,9,26,.76)}
  #replay button{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#04223b;
    border:0;border-radius:14px;padding:20px 46px;font:700 25px var(--b);cursor:pointer}
  #hint{position:absolute;left:36px;bottom:24px;font:500 14px var(--b);color:var(--faint);z-index:5}

  /* ══════════════════════════════════════════════════════════════════════
     PORTRAIT: A DIFFERENT SHAPE, NOT A SMALLER ONE
     ══════════════════════════════════════════════════════════════════════
     A 16:9 stage on a 19.5:9 phone held upright is a band using 26% of the
     screen — measured, on a 390x844 viewport, against 82% in landscape. No
     amount of scaling fixes that, because the shape is wrong: the film is
     landscape and the phone is not. A tablet held upright is the same problem
     and was worse: an iPad at 834x1194 used 39%, so the query reaches to 1080.

     So on a narrow portrait screen the stage BECOMES portrait and the scenes
     re-lay into it. Same film, same timings, same audio; the composition just
     stops being letterboxed into a quarter of the display. The 1620 below is the
     scripting-off fallback — fit() replaces the height with the device's own
     ratio so the frame fills the screen edge to edge, and it reads the stage's
     box back rather than assuming 1920x1080, so there is one place the numbers
     live.

     The wall shots keep their frame and are shown whole. They are small at this
     size, and that is the right trade: a wall cropped to fill a portrait frame
     shows less than half its width and cuts every panel mid-word, which reads as
     a fault rather than as detail. The caption under each shot is what carries
     the finding on a phone, so it is sized to be read at arm's length. */
  @media (orientation:portrait) and (max-width:1080px){
    #stage{width:1080px;height:1620px}
    .scene{padding:110px 70px}
    /* Sized for a frame that is now the whole phone: 1080 units across a 390px
       handset divides by 2.77, so 132 reads as a 48px headline. */
    h1{font-size:132px;line-height:1.02}
    h2{font-size:84px;line-height:1.1}
    .lede{font-size:40px;max-width:960px}
    .kick{font-size:26px;letter-spacing:.26em;margin-bottom:28px}
    .mark i,.mark i img{width:96px;height:96px}
    .mark span{font-size:32px}
    /* A wall shot at 960 is 540 tall, so a portrait frame has room to spare
       around it — the picture gets its margins back and the caption gets to be
       a size somebody reads rather than squints at. */
    .scene.shotscene{padding:70px 36px}
    .wallid{margin-bottom:22px;gap:18px}
    .wallid .n{width:56px;height:56px;border-radius:16px;font-size:28px}
    .wallid .t{font-size:24px}
    .closer{font-size:20px;padding:10px 22px 10px 18px;margin-bottom:20px}
    .closer svg{width:22px;height:22px}
    .quote blockquote{font-size:52px;padding-left:34px}
    .quote .after{font-size:34px;padding-left:37px}
    .quote .cite{font-size:22px}
    /* stacked, not overlapping — there is no room to sit side by side */
    #prov{left:40px;right:40px;bottom:96px;font-size:20px;line-height:1.4}
    /* A PHONE NEEDS A CLOSER ZOOM THAN A WALL SCREEN DOES. At the desktop
       scale a panel is legible across a room and merely small on a handset, so
       portrait goes 1.4x further in: at 3.4x the frame holds one card and its
       heading and nothing else, which is what somebody reading a phone wants. */
    .scene.on .shot.zoom img{animation:zoominP 6.6s var(--ease) forwards}
    .scene.on .shot.zoom.out img{animation:zoomoutP 6.6s var(--ease) forwards}
    @keyframes zoominP{
      0%{transform:scale(1.1)} 18%{transform:scale(1.1)}
      100%{transform:scale(calc(var(--zs) * 1.4))}}
    @keyframes zoomoutP{
      0%{transform:scale(calc(var(--zs) * 1.4))} 72%{transform:scale(calc(var(--zs) * 1.4))}
      100%{transform:scale(calc(var(--zs) * 1.05))}}
    @media (prefers-reduced-motion:reduce){
      .scene.on .shot.zoom img,.scene.on .shot.zoom.out img{
        animation:none;transform:scale(calc(var(--zs) * 1.4))}
    }
    .shot.wide,.pair .shot.wide{width:1008px}
    .shotscene .cap{margin-top:34px;font-size:36px}
    .pair{flex-direction:column;gap:30px}
    .pair .shot.paper{width:560px;max-height:700px}
    .cap{font-size:36px;max-width:1008px}
    .why div{font-size:46px}
    .quote blockquote{font-size:48px}
    .quote .after{font-size:32px}
    #gate .pb{width:150px;height:150px}
    #gate .pb svg{width:60px;height:60px}
    #gate .lbl{font-size:34px}
    #gate .sub{font-size:23px;margin-top:-8px;padding:0 60px;text-align:center}
    #chrome{right:44px;top:40px;gap:20px}
    #chrome button{width:76px;height:76px}
    #chrome svg{width:34px;height:34px}
    #hint{left:44px;bottom:34px;font-size:21px}
    #replay button{padding:30px 66px;font-size:36px}
    #prog{height:8px}
  }
</style>
</head>
<body>
