<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneak Peek — The Branch Intelligence Wall</title>
<meta name="description" content="Forty seconds. The Branch Intelligence Wall goes live Monday.">
<meta name="theme-color" content="#061c31">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- THE FONT MUST NOT BLOCK THE PICTURE. A plain stylesheet link in the head is
     render-blocking: until it answers, the screen is blank. Measured at 12.5s on
     a link that was merely slow, and a wall screen on branch wifi is exactly
     where that happens. Loading it as print media and promoting it on load makes
     it non-blocking — the system fallback in every font stack shows instantly
     and the webfont swaps in when it arrives. noscript keeps it working with
     scripting off. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
<style>
  /* Sister to the explainer — same palette, same voice, same chord length. What
     differs is PACE. Lines land 0.36s apart instead of 0.55, scenes cut rather
     than dissolve, and the wall shots go full bleed with the words on top of
     them instead of underneath. That is where a trailer's energy comes from;
     the voice is the same Andrew at the same rate, because a branch that
     suddenly sounds like somebody else for one film sounds like two branches. */
  :root{
    --ink:#eaf4ff; --dim:#9dbdd8; --faint:#6d8ba6;
    --blue:#37b1ec; --blue2:#0b7fd4; --gold:#f5b93b; --gold2:#c9942c;
    --line:rgba(255,255,255,.12);
    --ease:cubic-bezier(.16,1,.3,1);
    --d:'Newsreader',Georgia,serif; --b:Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  /* THE PAGE BEHIND THE FILM, not a void. A 16:9 stage on a phone in portrait
     is a band across the middle with 60% of the screen around it; flat black
     there reads as something failing to load. The same gradient the stage uses
     makes the letterbox look intended. */
  body{color:var(--ink);font-family:var(--b);overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 600px at 20% 0%,rgba(55,177,236,.10),transparent 60%),
      radial-gradient(700px 500px at 85% 8%,rgba(245,185,59,.07),transparent 62%),
      linear-gradient(165deg,#050f22 0%,#04091a 60%,#03060f 100%)}

  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center;overflow:hidden;
    background:
      radial-gradient(1200px 760px at 12% -6%,rgba(55,177,236,.20),transparent 60%),
      radial-gradient(1000px 640px at 90% 4%,rgba(11,127,212,.17),transparent 62%),
      radial-gradient(900px 700px at 58% 108%,rgba(245,185,59,.10),transparent 60%),
      linear-gradient(165deg,#061c31 0%,#08243f 55%,#050f22 100%)}

  /* A CUT, NOT A DISSOLVE. .28s against the explainer's .8s — at trailer pace a
     long crossfade means two scenes are on screen at once for a third of the
     time either is up. */
  .scene{position:absolute;inset:0;padding:70px 90px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    opacity:0;visibility:hidden;transform:scale(1.012);
    transition:opacity .28s var(--ease),transform .5s var(--ease),visibility .28s}
  .scene.on{opacity:1;visibility:visible;transform:none}

  .kick{font:800 17px var(--b);letter-spacing:.3em;text-transform:uppercase;
    color:var(--blue);margin-bottom:22px}
  .kick.gold{color:var(--gold)}
  h1{font:600 108px/1.02 var(--d);margin:0 0 18px;letter-spacing:-2.2px}
  h1.huge{font-size:186px;letter-spacing:-6px;
    background:linear-gradient(120deg,var(--gold),var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  /* A title card that does not move at all looks like a stall on a screen
     across a room. A 1.5% settle over three seconds is enough to read as alive
     and too little to read as an effect. */
  .scene.on h1,.scene.on h2{animation:settle 3.2s var(--ease) forwards}
  @keyframes settle{from{transform:scale(1.015)} to{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .scene.on h1,.scene.on h2{animation:none}
  }
  h2{font:800 62px/1.14 var(--b);margin:0;letter-spacing:-1.6px}
  .lede{font:400 32px/1.45 var(--b);color:var(--dim);max-width:1250px;margin:16px 0 0}
  .lede b{color:var(--ink);font-weight:600}

  /* FULL BLEED. The wall fills the frame and the caption sits on it, so four
     screens go past in twelve seconds without the eye having to re-find the
     picture each time. */
  .bleed{position:absolute;inset:0;padding:0;display:block}
  /* THE SHOT SCROLLS. A wall capture is 1920x1080 of dense panels, and holding
     it still for four seconds is a photograph of a screen. Panning slowly down
     it reads the way somebody actually reads a wall — top row, then the detail
     underneath — and gives a static JPEG the motion the piece needs without
     shipping video. Paired with a slow push in, so the frame is never still. */
  .bleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 30%;transform:scale(1.045);transform-origin:center center}
  .scene.bleed.on img{animation:wallpan 6.4s var(--ease) forwards}
  /* 4.5% of scale, not 10%. The shot is 16:9 inside a 16:9 frame, so panning at
     all requires overscanning — and every percent of overscan is a slice off
     the wall's own edges. At 10% the left-hand hero column was cut in half,
     which turns evidence into wallpaper. 4.5% is enough travel to read as
     movement and little enough that nothing on the wall is lost. */
  @keyframes wallpan{
    from{object-position:center 14%; transform:scale(1.045)}
    to  {object-position:center 74%; transform:scale(1.000)}
  }
  /* Anybody who has asked their device to stop moving things gets a still. */
  @media (prefers-reduced-motion:reduce){
    .scene.bleed.on img{animation:none;object-position:center 20%;transform:none}
  }
  @keyframes shotrise{from{transform:translateY(22px);opacity:0} to{transform:none;opacity:1}}
  /* The caption sits on a wall that is itself dense text, so the bottom third
     has to go genuinely dark or the two compete and neither reads. Almost
     opaque under the words, clearing fast enough that the top half of the wall
     is still the picture. */
  .bleed::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(4,9,26,.985) 0%,rgba(4,9,26,.94) 14%,
      rgba(4,9,26,.62) 30%,rgba(4,9,26,.08) 55%,rgba(4,9,26,.36) 100%)}
  .bleed .say{position:absolute;left:90px;right:90px;bottom:88px;z-index:2;text-align:left;
    opacity:0;transform:translateY(18px)}
  .scene.bleed.on .say{opacity:1;transform:none;
    transition:opacity .42s var(--ease) .12s,transform .52s var(--ease) .12s}
  @media (prefers-reduced-motion:reduce){
    .scene.bleed.on .say{transition:none}
  }
  .bleed .say .k{font:800 16px var(--b);letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);margin-bottom:14px}
  .bleed .say h2{font-size:68px}
  .bleed .say h2 em{font-style:normal;color:var(--gold)}

  /* the three-line reveal on the accountability scene */
  .names{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .names div{font:800 66px/1.2 var(--b);letter-spacing:-1.6px;opacity:0;
    transform:translateY(14px);transition:opacity .34s var(--ease),transform .34s var(--ease)}
  .scene.on .names div{opacity:1;transform:none}
  .scene.on .names div:nth-child(1){transition-delay:.10s}
  .scene.on .names div:nth-child(2){transition-delay:1.05s}
  .scene.on .names div:nth-child(3){transition-delay:1.95s}
  .names em{font-style:normal;color:var(--gold)}

  .mark{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:34px}
  .mark i{width:74px;height:74px;border-radius:20px;font-style:normal;overflow:hidden;
    background:#07131f;display:grid;place-items:center}
  .mark i img{width:74px;height:74px;display:block}
  .mark span{font:600 26px var(--d);color:var(--dim)}

  /* THE SOUND GATE. See the note in player.js — the film must not start its
     clock until the browser has actually let it make a sound. */
  #gate{position:absolute;inset:0;display:none;place-items:center;z-index:7;
    background:rgba(4,9,26,.72);cursor:pointer;backdrop-filter:blur(2px)}
  #gate.on{display:grid}
  #gate .inner{display:flex;flex-direction:column;align-items:center;gap:22px}
  #gate .pb{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(120deg,var(--gold),var(--gold2));color:#3a2404;
    box-shadow:0 18px 50px rgba(0,0,0,.6);transition:transform .3s var(--ease)}
  #gate:hover .pb{transform:scale(1.06)}
  #gate .lbl{font:700 22px var(--b);color:var(--ink)}
  #gate .sub{font:500 15px var(--b);color:var(--faint);margin-top:-12px}
  #prog{position:absolute;left:0;bottom:0;height:4px;width:0;
    background:linear-gradient(90deg,var(--blue),var(--gold))}
  #chrome{position:absolute;right:36px;top:30px;display:flex;align-items:center;gap:14px;z-index:5}
  #mute{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:var(--ink);font-size:20px;cursor:pointer}
  #voice{font:500 14px var(--b);color:var(--faint)}
  #replay{position:absolute;inset:0;display:none;place-items:center;z-index:6;
    background:rgba(4,9,26,.78)}
  #replay button{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#3a2404;
    border:0;border-radius:14px;padding:20px 46px;font:800 25px var(--b);cursor:pointer}
  #hint{position:absolute;left:36px;bottom:24px;font:500 14px var(--b);color:var(--faint);z-index:5}

  /* ══════════════════════════════════════════════════════════════════════
     PORTRAIT: A DIFFERENT SHAPE, NOT A SMALLER ONE
     ══════════════════════════════════════════════════════════════════════
     A 16:9 stage on a 19.5:9 phone held upright is a band using 26% of the
     screen — measured, on a 390x844 viewport, against 82% in landscape. No
     amount of scaling fixes that, because the shape is wrong: the film is
     landscape and the phone is not. A tablet held upright is the same problem
     and was worse: an iPad at 834x1194 used 39%, so the query reaches to 1080.

     So on a narrow portrait screen the stage BECOMES portrait and the scenes
     re-lay into it. Same film, same timings, same audio; the composition just
     stops being letterboxed into a quarter of the display. The 1620 below is the
     scripting-off fallback — fit() replaces the height with the device's own
     ratio so the frame fills the screen edge to edge, and it reads the stage's
     box back rather than assuming 1920x1080, so there is one place the numbers
     live.

     THE WALL SHOTS ARE SHOWN WHOLE, and that reverses the first attempt. Cover
     was chosen on the theory that a 1920px dashboard is unreadable at phone size
     either way, so it may as well crop and stay big. On the device it read as a
     fault: a 16:9 wall cover-cropped into a 2:3 frame shows 44% of its width, so
     every panel was cut mid-word down both edges and the caption sat on top of
     the wreckage. Nobody sees "dense figures" there, they see a broken picture.
     Contained inside its own framed 960x540 box the wall is small but whole, and
     small-but-whole reads as a dashboard. The caption then gets clean navy under
     it instead of fighting body text for contrast. */
  @media (orientation:portrait) and (max-width:1080px){
    #stage{width:1080px;height:1620px}
    .scene{padding:110px 70px}
    /* Sized for a frame that is now the whole phone. At 1080 units wide on a
       390px handset everything here divides by 2.77, so 210 is a 76px title and
       80 is a 29px line — a trailer read at arm's length, not a caption. */
    h1{font-size:126px;line-height:1.03}
    h1.huge{font-size:210px;letter-spacing:-6px}
    h2{font-size:80px;line-height:1.12}
    .lede{font-size:40px;max-width:960px}
    .kick{font-size:26px;letter-spacing:.26em;margin-bottom:28px}
    .names div{font-size:88px}
    .mark i,.mark i img{width:96px;height:96px}
    .mark span{font-size:32px}
    /* Shot and caption become one stacked group and the group is centred, so a
       two-line caption and a three-line one both sit balanced in the frame
       instead of leaving 370px of dead navy under the shorter one. Static flow
       rather than absolute insets is what makes that automatic. */
    .bleed{display:flex;flex-direction:column;justify-content:center;
      align-items:stretch;gap:88px;padding:0 36px}
    .bleed img{position:static;inset:auto;width:100%;height:auto;object-fit:contain;
      transform:none;border-radius:18px;border:1px solid rgba(255,255,255,.16);
      box-shadow:0 34px 90px -28px rgba(0,0,0,.9)}
    /* The pan is a landscape idea — it slides a picture that overflows its box.
       Nothing overflows here, so the shot arrives instead of travelling. */
    .scene.bleed.on img{animation:shotrise .72s var(--ease) both}
    @media (prefers-reduced-motion:reduce){
      .scene.bleed.on img{animation:none}
    }
    /* The scrim exists to rescue white words laid over a bright wall. In
       portrait the words are not over the wall, so it would only be dimming the
       evidence. */
    .bleed::after{background:none}
    .bleed .say{position:static;left:auto;right:auto;bottom:auto;padding:0 12px}
    /* The frame is a whole phone screen now and the shot can only ever be as
       wide as it is, so the height that is left goes into the words. */
    .bleed .say h2{font-size:84px;line-height:1.1}
    .bleed .say .k{font-size:28px;margin-bottom:22px}
    #gate .pb{width:150px;height:150px}
    #gate .pb svg{width:60px;height:60px}
    #gate .lbl{font-size:34px}
    #gate .sub{font-size:23px;margin-top:-8px;padding:0 60px;text-align:center}
    #chrome{right:44px;top:40px;gap:20px}
    #mute{width:76px;height:76px;font-size:30px}
    #voice{font-size:22px}
    #hint{left:44px;bottom:34px;font-size:21px}
    #replay button{padding:30px 66px;font-size:36px}
    #prog{height:8px}
  }
</style>
</head>
<body>
