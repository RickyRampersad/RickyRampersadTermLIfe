<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneak Peek — The Branch Intelligence Wall</title>
<meta name="description" content="Forty seconds. The Branch Intelligence Wall goes live Monday.">
<meta name="theme-color" content="#061c31">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  /* Sister to the explainer — same palette, same voice, same chord length. What
     differs is PACE. Lines land 0.36s apart instead of 0.55, scenes cut rather
     than dissolve, and the wall shots go full bleed with the words on top of
     them instead of underneath. That is where a trailer's energy comes from;
     the voice is the same Andrew at the same rate, because a branch that
     suddenly sounds like somebody else for one film sounds like two branches. */
  :root{
    --ink:#eaf4ff; --dim:#9dbdd8; --faint:#6d8ba6;
    --blue:#37b1ec; --blue2:#0b7fd4; --gold:#f5b93b; --gold2:#c9942c;
    --line:rgba(255,255,255,.12);
    --ease:cubic-bezier(.16,1,.3,1);
    --d:'Newsreader',Georgia,serif; --b:Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#04091a;color:var(--ink);font-family:var(--b);overflow:hidden;
    -webkit-font-smoothing:antialiased}

  #stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
    transform-origin:center;overflow:hidden;
    background:
      radial-gradient(1200px 760px at 12% -6%,rgba(55,177,236,.20),transparent 60%),
      radial-gradient(1000px 640px at 90% 4%,rgba(11,127,212,.17),transparent 62%),
      radial-gradient(900px 700px at 58% 108%,rgba(245,185,59,.10),transparent 60%),
      linear-gradient(165deg,#061c31 0%,#08243f 55%,#050f22 100%)}

  /* A CUT, NOT A DISSOLVE. .28s against the explainer's .8s — at trailer pace a
     long crossfade means two scenes are on screen at once for a third of the
     time either is up. */
  .scene{position:absolute;inset:0;padding:70px 90px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    opacity:0;visibility:hidden;transform:scale(1.012);
    transition:opacity .28s var(--ease),transform .5s var(--ease),visibility .28s}
  .scene.on{opacity:1;visibility:visible;transform:none}

  .kick{font:800 17px var(--b);letter-spacing:.3em;text-transform:uppercase;
    color:var(--blue);margin-bottom:22px}
  .kick.gold{color:var(--gold)}
  h1{font:600 108px/1.02 var(--d);margin:0 0 18px;letter-spacing:-2.2px}
  h1.huge{font-size:186px;letter-spacing:-6px;
    background:linear-gradient(120deg,var(--gold),var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font:800 62px/1.14 var(--b);margin:0;letter-spacing:-1.6px}
  .lede{font:400 32px/1.45 var(--b);color:var(--dim);max-width:1250px;margin:16px 0 0}
  .lede b{color:var(--ink);font-weight:600}

  /* FULL BLEED. The wall fills the frame and the caption sits on it, so four
     screens go past in twelve seconds without the eye having to re-find the
     picture each time. */
  .bleed{position:absolute;inset:0;padding:0;display:block}
  .bleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center top}
  /* The caption sits on a wall that is itself dense text, so the bottom third
     has to go genuinely dark or the two compete and neither reads. Almost
     opaque under the words, clearing fast enough that the top half of the wall
     is still the picture. */
  .bleed::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(4,9,26,.985) 0%,rgba(4,9,26,.94) 14%,
      rgba(4,9,26,.62) 30%,rgba(4,9,26,.08) 55%,rgba(4,9,26,.36) 100%)}
  .bleed .say{position:absolute;left:90px;right:90px;bottom:88px;z-index:2;text-align:left}
  .bleed .say .k{font:800 16px var(--b);letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);margin-bottom:14px}
  .bleed .say h2{font-size:68px}
  .bleed .say h2 em{font-style:normal;color:var(--gold)}

  /* the three-line reveal on the accountability scene */
  .names{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .names div{font:800 66px/1.2 var(--b);letter-spacing:-1.6px;opacity:0;
    transform:translateY(14px);transition:opacity .34s var(--ease),transform .34s var(--ease)}
  .scene.on .names div{opacity:1;transform:none}
  .scene.on .names div:nth-child(1){transition-delay:.10s}
  .scene.on .names div:nth-child(2){transition-delay:1.05s}
  .scene.on .names div:nth-child(3){transition-delay:1.95s}
  .names em{font-style:normal;color:var(--gold)}

  .mark{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:34px}
  .mark i{width:74px;height:74px;border-radius:20px;font-style:normal;overflow:hidden;
    background:#07131f;display:grid;place-items:center}
  .mark i img{width:74px;height:74px;display:block}
  .mark span{font:600 26px var(--d);color:var(--dim)}

  #prog{position:absolute;left:0;bottom:0;height:4px;width:0;
    background:linear-gradient(90deg,var(--blue),var(--gold))}
  #chrome{position:absolute;right:36px;top:30px;display:flex;align-items:center;gap:14px;z-index:5}
  #mute{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.07);color:var(--ink);font-size:20px;cursor:pointer}
  #voice{font:500 14px var(--b);color:var(--faint)}
  #replay{position:absolute;inset:0;display:none;place-items:center;z-index:6;
    background:rgba(4,9,26,.78)}
  #replay button{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#3a2404;
    border:0;border-radius:14px;padding:20px 46px;font:800 25px var(--b);cursor:pointer}
  #hint{position:absolute;left:36px;bottom:24px;font:500 14px var(--b);color:var(--faint);z-index:5}
</style>
</head>
<body>
