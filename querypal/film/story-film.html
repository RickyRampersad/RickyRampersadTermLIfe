<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Query Pal — why it exists</title>
<meta name="description" content="Every request a client makes is a promise. This is how the Ricky Rampersad Branch keeps every one.">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Query Pal — the story film. One file: narration inline, score played in
   Web Audio, every frame drawn live. Nothing is fetched, so it runs in an
   iframe on the wall and under a policy that will not load siblings.
   House style: D major, 108 BPM, D–A–Bm–G. Pads, pluck, brushed hat.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* straight off qp-shield.png: coral on deep navy. The accent is warm,
     not blue — the film follows the mark, not the other way round. */
  --navy:#1B2A4A; --navy-deep:#0E1830; --navy-ink:#080F20;
  --coral:#E4644B; --coral-lit:#F0906F; --coral-deep:#C74A34;
  --ink:#F6F1EE; --ink-2:#B6A9A4; --ink-3:#7E7370;
  --gold:#F5B935; --green:#3FBF8F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:-webkit-fill-available;overflow:hidden;background:var(--navy-ink)}
@supports (height:100dvh){html,body{height:100dvh}}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); -webkit-font-smoothing:antialiased;
}
#film{position:fixed;inset:0;overflow:hidden;background:var(--navy-ink)}

/* the ground: a slow, breathing gradient that changes temperature by act */
#ground{position:absolute;inset:-10%;transition:background 3s ease, filter 3s ease;
  background:
    radial-gradient(62% 56% at 74% 16%, rgba(38,56,92,.8), transparent 62%),
    radial-gradient(70% 60% at 16% 90%, rgba(14,22,44,.95), transparent 60%),
    var(--navy-ink);
  filter:saturate(.55) brightness(.85);}
#film.warm #ground{
  background:
    radial-gradient(58% 54% at 72% 14%, rgba(228,100,75,.32), transparent 60%),
    radial-gradient(74% 62% at 14% 92%, rgba(27,42,74,.95), transparent 62%),
    #131E38;
  filter:saturate(1.05) brightness(1);}
#film.open #ground{
  background:
    radial-gradient(66% 58% at 50% 26%, rgba(240,144,111,.34), transparent 62%),
    radial-gradient(72% 64% at 18% 94%, rgba(31,49,86,.95), transparent 62%),
    #1A2846;
  filter:saturate(1.2) brightness(1.06);}

#bokeh{position:absolute;inset:0;opacity:.55}
/* grain: one tiled SVG, animated by nudging its position — cheap and filmic */
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation:grain 700ms steps(4) infinite}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
  50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(0,0)}}
/* the mark — the real shield, not a lettered box */
.mark{display:block;width:var(--mk,92px);height:var(--mk,92px);
  filter:drop-shadow(0 18px 40px rgba(199,74,52,.42))}

/* a light sweep for the reveals: one pass, then gone */
#sweep{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 38%,rgba(255,214,190,.19) 50%,transparent 62%);
  transform:translateX(-40%)}
#sweep.go{animation:sweep 1.5s cubic-bezier(.35,0,.2,1)}
@keyframes sweep{0%{opacity:0;transform:translateX(-45%)}
  22%{opacity:1}100%{opacity:0;transform:translateX(45%)}}

/* the journey — six stations, lit as the film travels through them */
#rail{position:absolute;left:0;right:0;bottom:calc(5.5vh + 46px);z-index:35;
  display:flex;justify-content:center;gap:0;opacity:0;transition:opacity .9s ease;
  pointer-events:none;padding:0 6vw}
#rail.on{opacity:1}
.stn{display:flex;align-items:center;gap:0;flex:1;max-width:150px}
.stn .pip{width:9px;height:9px;border-radius:50%;flex:none;background:rgba(255,236,228,.17);
  position:relative;transition:background .6s ease,box-shadow .6s ease}
.stn .pip::after{content:attr(data-l);position:absolute;top:15px;left:50%;transform:translateX(-50%);
  font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;white-space:nowrap;
  color:rgba(255,236,228,.28);transition:color .6s ease}
.stn .bar{height:2px;flex:1;background:rgba(255,236,228,.13);position:relative;overflow:hidden}
.stn .bar i{position:absolute;inset:0;background:linear-gradient(90deg,var(--coral),var(--coral-lit));
  transform:scaleX(0);transform-origin:left;transition:transform 1.5s cubic-bezier(.4,0,.2,1)}
.stn:last-child .bar{display:none}
.stn.lit .pip{background:var(--coral-lit);box-shadow:0 0 0 4px rgba(228,100,75,.22),0 0 16px rgba(240,144,111,.6)}
.stn.lit .pip::after{color:rgba(255,236,228,.72)}
.stn.done .bar i{transform:scaleX(1)}

#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 68% at 50% 46%, transparent 40%, rgba(2,6,12,.72) 100%)}

/* ── the stage ─────────────────────────────────────────────────────────── */
/* the camera — the whole stage is what moves, so a push-in is one transform
   rather than an animation per element */
#stage{position:absolute;inset:0;display:grid;place-items:center;padding:0 7vw;
  transform-origin:50% 50%;transition:transform 4.5s cubic-bezier(.33,0,.25,1);will-change:transform}
.scene{position:absolute;inset:0;display:grid;place-items:center;padding:0 7vw;
  opacity:0;pointer-events:none;transition:opacity .85s ease}
.scene.on{opacity:1}
.scene.out{opacity:0;transition:opacity .5s ease}

/* kinetic type — words land one at a time, in time with the voice */
.line{max-width:17em;text-align:center;font-weight:600;letter-spacing:-.025em;
  line-height:1.16;text-wrap:balance;font-size:clamp(28px,5.1vw,62px)}
.line.sm{font-size:clamp(22px,3.4vw,40px);max-width:21em;font-weight:500;line-height:1.3}
.line w{display:inline-block;opacity:0;filter:blur(9px);transform:translateY(.42em);
  will-change:opacity,filter,transform}
.line w.in{animation:word .82s cubic-bezier(.16,1,.3,1) forwards}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
.line em{font-style:normal;color:var(--coral-lit)}
.line b{font-weight:600;color:var(--gold)}
.sub{margin-top:1.1em;font-size:clamp(13px,1.5vw,18px);color:var(--ink-2);font-weight:400;
  letter-spacing:.01em;opacity:0;transition:opacity 1s ease .5s}
.scene.on .sub{opacity:1}

/* ── act 1: the inbox that forgets ─────────────────────────────────────── */
.stack{position:relative;width:min(560px,80vw);height:min(400px,52vh)}
.mail{position:absolute;left:0;right:0;height:62px;border-radius:11px;
  background:linear-gradient(150deg,rgba(24,48,76,.96),rgba(14,32,54,.9));
  border:1px solid rgba(96,140,184,.24);display:flex;align-items:center;gap:13px;
  padding:0 17px;box-shadow:0 14px 34px rgba(0,0,0,.45);
  transform:translateY(var(--y)) scale(var(--s));opacity:0}
.mail .dot{width:8px;height:8px;border-radius:50%;background:#6A7FA8;flex:none;opacity:.8}
.mail .t{font-size:13.5px;color:#B9D3EA;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mail .d{margin-left:auto;font-size:11px;color:#54748F;font-variant-numeric:tabular-nums;flex:none}
.mail.drop{animation:drop 1.5s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes drop{
  0%{opacity:1}
  100%{opacity:0;transform:translateY(calc(var(--y) + 320px)) scale(.86) rotate(2deg);filter:blur(7px)}}
.mail.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--y) + 26px)) scale(var(--s))}
                to{opacity:1;transform:translateY(var(--y)) scale(var(--s))}}

/* ── the chaos: sixteen departments, and no idea which one ─────────────── */
.chaos{position:relative;width:min(1000px,92vw);height:min(560px,74vh)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  display:grid;place-items:center;gap:11px}
.hub .env{width:104px;height:104px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(150deg,#1B4C8C,#0B2E5C);border:1px solid rgba(140,190,240,.34);
  box-shadow:0 22px 54px rgba(0,0,0,.55)}
.hub .env svg{width:56px;height:56px}
.hub .q{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:#9FB6D6}
.hub .marks{position:absolute;inset:-38px;pointer-events:none}
.hub .marks b{position:absolute;font-size:30px;font-weight:800;color:var(--coral-lit);opacity:0;
  text-shadow:0 0 22px rgba(240,144,111,.7)}
.hub .marks b.on{animation:qm 2.4s ease-in-out infinite}
@keyframes qm{0%,100%{opacity:0;transform:translateY(6px) scale(.8)}
  35%{opacity:.95;transform:translateY(-8px) scale(1.1)}70%{opacity:0;transform:translateY(-20px) scale(.9)}}

.dept{position:absolute;padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;
  white-space:nowrap;background:rgba(22,34,60,.9);border:1px solid rgba(120,160,210,.22);
  color:#A9C0DC;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;transform:scale(.9);
  transition:opacity .7s ease,transform .7s ease,border-color .5s,color .5s,background .5s}
.dept.in{opacity:1;transform:none}
.dept.hit{background:rgba(228,100,75,.2);border-color:var(--coral);color:#FFE6DC;
  box-shadow:0 0 0 4px rgba(228,100,75,.16),0 12px 30px rgba(0,0,0,.5)}
.dept.right{background:rgba(63,191,143,.18);border-color:var(--green);color:#DBFBEE;
  box-shadow:0 0 0 5px rgba(63,191,143,.18),0 0 30px rgba(63,191,143,.4)}

/* an envelope in flight */
.fly{position:absolute;width:30px;height:22px;border-radius:4px;z-index:2;
  background:linear-gradient(150deg,#E9F2FB,#B9CEE4);box-shadow:0 6px 16px rgba(0,0,0,.5);
  opacity:0;transform-origin:50% 50%}
.fly::after{content:'';position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(150deg,transparent 48%,rgba(120,150,185,.85) 50%,transparent 52%)}
.fly.go{animation:fly var(--d,2.1s) cubic-bezier(.3,.1,.5,1) forwards}
@keyframes fly{
  0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}
  12%{opacity:1}
  70%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.8) rotate(var(--rot,20deg))}}
.fly.back{animation:flyback 2.4s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes flyback{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  10%{opacity:1}
  45%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(.8)}
  60%{opacity:1;transform:translate(calc(var(--tx)*.94),calc(var(--ty)*.94)) scale(.78) rotate(-14deg)}
  100%{opacity:0;transform:translate(0,0) scale(.5) rotate(-30deg)}}
/* the one clean arc, after the turn */
.fly.true{animation:flytrue 2.2s cubic-bezier(.2,.7,.3,1) forwards;
  background:linear-gradient(150deg,#FFD9CC,#F0906F);box-shadow:0 0 20px rgba(240,144,111,.7)}
@keyframes flytrue{
  0%{opacity:0;transform:translate(0,0) scale(.5)}
  15%{opacity:1}
  100%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(.95)}}

/* the agent, stuck in the middle of it */
.who{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);text-align:center;z-index:4}
.who .av{width:52px;height:52px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;
  background:linear-gradient(150deg,#2B4C7E,#16294A);border:1px solid rgba(150,190,235,.3);font-size:22px}
.who .nm{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:#8FA8C6}

/* the manual chase — the same message, sent over and over */
.again{display:flex;flex-direction:column;gap:9px;width:min(520px,84vw)}
.again .a{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:10px;
  background:rgba(24,34,56,.92);border:1px solid rgba(120,160,210,.16);font-size:13px;color:#A9C0DC;
  opacity:0;transform:translateY(10px)}
.again .a.on{animation:noteIn .55s ease forwards}
.again .a .t{margin-left:auto;font-size:11px;color:#6C86A6;font-variant-numeric:tabular-nums}
.again .a em{font-style:normal;color:var(--coral-lit);font-weight:700}

/* ── screens: the agent's book and the client's portal ─────────────────── */
.screen{width:min(880px,92vw);border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,#16233F,#0D1729);border:1px solid rgba(140,175,220,.22);
  box-shadow:0 34px 90px rgba(0,0,0,.65);opacity:0;transform:translateY(26px) scale(.97);
  transition:opacity 1s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
.scene.on .screen{opacity:1;transform:none}
.screen .bar{display:flex;align-items:center;gap:9px;padding:11px 15px;
  background:rgba(255,255,255,.045);border-bottom:1px solid rgba(140,175,220,.14)}
.screen .bar i{width:10px;height:10px;border-radius:50%;background:#3B4E6A}
.screen .bar .u{margin-left:12px;font-size:11.5px;color:#7C97B8;font-family:ui-monospace,monospace}
.screen .bar .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#B7CCE4}
.screen .bar .me span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--coral),var(--coral-deep));font-size:10px;font-weight:800;color:#fff}
.screen .in{padding:16px 18px 18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:rgba(255,255,255,.04);border:1px solid rgba(140,175,220,.14);border-radius:10px;
  padding:11px 13px}
.tile .k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#6F8AAC;font-weight:800}
.tile .v{font-size:26px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.c .v{color:var(--coral-lit)} .tile.g .v{color:var(--gold)} .tile.n .v{color:var(--green)}
.rows{display:flex;flex-direction:column;gap:7px}
.r{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 13px;
  border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(140,175,220,.1);
  font-size:12.5px;opacity:0;transform:translateX(-14px)}
.r.on{animation:noteIn .5s ease forwards}
.r .nm{color:#D6E5F4;font-weight:600}
.r .nm small{display:block;color:#7791B0;font-weight:400;font-size:11px;margin-top:1px}
.r .st{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:3px 9px;
  border-radius:20px}
.r .st.o{background:rgba(240,144,111,.16);color:#F5B79C}
.r .st.d{background:rgba(63,191,143,.16);color:#8FE3C4}
.r .dd{font-size:11px;color:#7791B0;font-variant-numeric:tabular-nums;white-space:nowrap}
/* the progress bar that actually moves */
.prog{height:7px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;width:0;border-radius:5px;
  background:linear-gradient(90deg,var(--coral),var(--coral-lit));
  transition:width 2.6s cubic-bezier(.3,0,.2,1)}
.plab{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#6F8AAC;font-weight:700;margin-top:6px}

/* ══ THE CAST ══════════════════════════════════════════════════════════
   Drawn, not photographed: stick people in the branch colours, and the
   departments as buildings. Everything is SVG so it stays sharp on a phone
   and can be animated limb by limb.                                       */
.cast{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,44px);
  width:100%;flex-wrap:wrap}
.guy{display:flex;flex-direction:column;align-items:center;gap:9px;
  opacity:0;transform:translateY(20px)}
.guy.on{animation:noteIn .8s cubic-bezier(.16,1,.3,1) forwards}
.guy svg{width:var(--w,clamp(74px,13vw,124px));height:auto;overflow:visible}
.guy .nm2{font-size:clamp(9px,1.3vw,11.5px);letter-spacing:.16em;text-transform:uppercase;
  font-weight:800;color:#93A9C6;white-space:nowrap}
.guy.big{--w:clamp(96px,17vw,168px)}
/* a limb that fidgets — frustration, drawn */
@keyframes flail{0%,100%{transform:rotate(0)}30%{transform:rotate(-13deg)}65%{transform:rotate(11deg)}}
.guy.stressed .arms{transform-origin:50px 58px;animation:flail 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.guy.happy{animation:bob 1.9s ease-in-out infinite}
.guy.happy.on{animation:noteIn .8s cubic-bezier(.16,1,.3,1) forwards, bob 1.9s ease-in-out 1s infinite}

/* a thought bubble — three dots rising into a cloud, for the people waiting */
.think{position:relative;background:#EAF2FB;color:#16273F;border-radius:18px;
  padding:9px 15px;font-size:clamp(11px,1.5vw,13.5px);font-weight:600;max-width:14em;
  text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:0;transform:scale(.86)}
.think.on{animation:pop .7s cubic-bezier(.2,1.5,.4,1) forwards}
.think::after,.think::before{content:'';position:absolute;left:24%;border-radius:50%;
  background:#EAF2FB}
.think::after{width:11px;height:11px;bottom:-14px}
.think::before{width:6px;height:6px;bottom:-24px;left:20%}
/* the wait, drawn as dots that never finish */
.dots{display:inline-flex;gap:5px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:#8FA6C4;animation:dot 1.3s infinite}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* a worker standing at their building */
.bld .worker{position:absolute;right:-16%;bottom:0;width:38%}
.bldwrap{position:relative}

/* speech and thought */
.bub{position:relative;background:#fff;color:#14243D;border-radius:14px;padding:10px 14px;
  font-size:clamp(11.5px,1.6vw,14.5px);font-weight:600;max-width:16em;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.45);opacity:0;transform:scale(.9) translateY(8px)}
.bub.on{animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.q{background:var(--coral);color:#fff}
.bub.q::after{border-top-color:var(--coral)}
.bub.g2{background:#3FBF8F;color:#04241A}
.bub.g2::after{border-top-color:#3FBF8F}

/* the town: departments as buildings */
.town{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.4vw,16px);
  width:100%;flex-wrap:wrap}
.bld{display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;transform:translateY(18px)}
.bld.on{animation:noteIn .7s cubic-bezier(.16,1,.3,1) forwards}
.bld svg{width:var(--bw,clamp(52px,8vw,86px));height:auto}
.bld .lb4{font-size:clamp(7.5px,1vw,9.5px);letter-spacing:.09em;text-transform:uppercase;
  font-weight:800;color:#7E93B4;text-align:center;max-width:8em;line-height:1.25}
.bld .win{fill:#2C4162;transition:fill .5s ease}
.bld.lit .win{fill:var(--gold)}
.bld.lit .lb4{color:#F3D79B}
.bld.lit svg{filter:drop-shadow(0 0 22px rgba(245,185,53,.55))}
.bld.wrong svg{filter:drop-shadow(0 0 18px rgba(251,113,133,.5))}
.bld.wrong .win{fill:#7E3040}

/* a paper envelope, drawn, that can be thrown between things */
.pap{position:absolute;width:clamp(22px,3.4vw,34px);aspect-ratio:4/3;border-radius:3px;
  background:linear-gradient(150deg,#FFF6F2,#E7D6CE);box-shadow:0 5px 14px rgba(0,0,0,.5);z-index:6}
.pap::after{content:'';position:absolute;inset:0;
  background:linear-gradient(150deg,transparent 45%,#C9AFA4 47%,transparent 55%)}
.stagewrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,3vh,30px)}

/* ── the routing constellation ─────────────────────────────────────────
   The one picture that explains the whole system: sixty kinds of request on
   one side, sixteen departments on the other, and every line already drawn.
   Chaos version: the lines cross each other. Order version: they resolve.  */
.conste{width:min(1000px,96vw);position:relative}
.conste svg{width:100%;height:auto;display:block;overflow:visible}
.cpath{fill:none;stroke-width:1.1;opacity:0;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.cpath.draw{opacity:.5;animation:drawline 1.5s cubic-bezier(.3,0,.2,1) forwards}
@keyframes drawline{to{stroke-dashoffset:0}}
.cnode{opacity:0;transform-box:fill-box;transform-origin:center}
.cnode.on{animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
.clab{font-size:8.5px;font-weight:700;letter-spacing:.06em;fill:#8FA6C4;opacity:0;
  transition:opacity .6s ease,fill .6s ease}
.clab.on{opacity:1}
.clab.hot{fill:#FFE2D8}
.cside{font-size:10px;font-weight:800;letter-spacing:.2em;fill:#5E7690;text-transform:uppercase}
.spark{fill:var(--coral-lit);opacity:0}

/* a big number that counts, for a single held frame */
.bignum{text-align:center}
.bignum .n2{font-size:clamp(66px,15vw,168px);font-weight:800;line-height:.94;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFF,#F0906F);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.bignum .k2{font-size:clamp(11px,1.6vw,14px);letter-spacing:.28em;text-transform:uppercase;
  font-weight:800;color:#7E93B4;margin-top:14px}

/* ── data, drawn ──────────────────────────────────────────────────────── */
.chartbox{width:min(880px,94vw)}
.chart2{display:flex;align-items:flex-end;gap:clamp(4px,1vw,12px);height:min(320px,38vh);
  padding:0 2px;border-bottom:1px solid rgba(140,175,220,.18)}
.col2{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.col2 i{display:block;width:100%;border-radius:5px 5px 0 0;height:0;
  background:linear-gradient(180deg,var(--coral-lit),rgba(228,100,75,.25));
  transition:height 1.1s cubic-bezier(.2,.8,.3,1)}
.col2 u{font-size:9px;color:#6F88A6;font-style:normal;font-variant-numeric:tabular-nums}
.chead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.chead b{font-size:clamp(15px,2.2vw,21px);font-weight:650}
.chead span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6F88A6;font-weight:800}

.rings{display:flex;gap:clamp(14px,4vw,52px);justify-content:center;flex-wrap:wrap}
.ring2{text-align:center;opacity:0;transform:scale(.86)}
.ring2.on{animation:pop .8s cubic-bezier(.2,1.4,.4,1) forwards}
.ring2 svg{width:clamp(104px,17vw,168px);height:auto;transform:rotate(-90deg)}
.ring2 .track{stroke:rgba(255,255,255,.09)}
.ring2 .fill{stroke-linecap:round;transition:stroke-dashoffset 1.7s cubic-bezier(.2,.8,.3,1)}
.ring2 .val{font-size:clamp(21px,3.2vw,34px);font-weight:750;margin-top:-58%;position:relative;
  font-variant-numeric:tabular-nums}
.ring2 .cap3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7E93B4;
  font-weight:800;margin-top:calc(58% - 6px)}

/* ── the inbox: what the problem actually looks like ──────────────────── */
.inbox{width:min(880px,92vw);border-radius:14px;overflow:hidden;
  background:#0E1726;border:1px solid rgba(140,175,220,.16);
  box-shadow:0 40px 100px rgba(0,0,0,.7);opacity:0;transform:translateY(24px) scale(.985);
  transition:opacity 1s ease,transform 1.3s cubic-bezier(.16,1,.3,1)}
.scene.on .inbox{opacity:1;transform:none}
.inbox .ih{display:flex;align-items:center;gap:10px;padding:13px 18px;
  background:rgba(255,255,255,.03);border-bottom:1px solid rgba(140,175,220,.12)}
.inbox .ih .t{font-size:13px;font-weight:600;color:#C7D9EC;letter-spacing:.01em}
.inbox .ih .n{margin-left:auto;font-size:11px;color:#5E7690;font-variant-numeric:tabular-nums}
.msg{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:14px 18px;border-bottom:1px solid rgba(140,175,220,.07);
  opacity:0;transform:translateY(8px)}
.msg:last-child{border-bottom:0}
.msg.on{animation:noteIn .55s ease forwards}
.msg .dot2{width:7px;height:7px;border-radius:50%;background:#3A5A82}
.msg.unread .dot2{background:var(--coral)}
.msg .sub2{min-width:0}
.msg .sub2 b{display:block;font-size:13.5px;font-weight:600;color:#DCE9F6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .sub2 span{display:block;font-size:11.5px;color:#6F88A6;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .when{font-size:11px;color:#5E7690;font-variant-numeric:tabular-nums;white-space:nowrap}
.msg .flag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;
  padding:3px 8px;border-radius:11px;background:rgba(251,113,133,.14);color:#F09098;white-space:nowrap}
.msg.aged{opacity:.55}

/* the sixteen, as an index rather than an illustration */
.index{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  width:min(900px,94vw);background:rgba(140,175,220,.1);border:1px solid rgba(140,175,220,.14);
  border-radius:12px;overflow:hidden}
.ix{background:#0D1626;padding:13px 14px;font-size:12px;color:#8FA6C4;font-weight:500;
  opacity:0;transition:opacity .5s ease,background .5s ease,color .5s ease;min-height:46px;
  display:flex;align-items:center}
.ix.on{opacity:1}
.ix.miss{background:rgba(251,113,133,.1);color:#F2A0A8}
.ix.hit{background:linear-gradient(120deg,rgba(228,100,75,.24),rgba(228,100,75,.08));
  color:#FFE2D8;font-weight:700;box-shadow:inset 0 0 0 1px rgba(228,100,75,.5)}
.idxq{font-size:clamp(13px,1.9vw,17px);color:#8FA6C4;font-weight:500;letter-spacing:.01em;
  text-align:center;margin-bottom:4px}
.idxq b{color:var(--coral-lit);font-weight:700}

/* ── typing into Query Pal: the form fills itself on camera ────────────── */
.form{width:min(660px,88vw)}
.fld{margin-bottom:13px}
.fld .lb{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7E93B4;font-weight:800;
  margin-bottom:6px}
.fld .bx{background:rgba(255,255,255,.05);border:1.5px solid rgba(140,175,220,.2);border-radius:10px;
  padding:13px 15px;font-size:15px;color:#EAF2FB;min-height:48px;display:flex;align-items:center;
  transition:border-color .4s,background .4s}
.fld.act .bx{border-color:var(--coral);background:rgba(228,100,75,.08);
  box-shadow:0 0 0 4px rgba(228,100,75,.12)}
.fld .bx.ta{min-height:74px;align-items:flex-start;line-height:1.5}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--coral-lit);margin-left:1px;
  vertical-align:-.15em;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick b{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(140,175,220,.18);color:#A9C0DC;
  transition:all .45s}
.pick b.sel{background:linear-gradient(135deg,var(--coral),var(--coral-deep));border-color:transparent;
  color:#fff;transform:scale(1.05);box-shadow:0 10px 26px rgba(199,74,52,.45)}
.auto{margin-top:14px;border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:13px;
  background:rgba(63,191,143,.1);border:1px solid rgba(63,191,143,.3);opacity:0;transform:translateY(10px)}
.auto.on{animation:noteIn .7s cubic-bezier(.16,1,.3,1) forwards}
.auto .ic{font-size:19px}
.auto .tx{font-size:13.5px;color:#CFF3E5}
.auto .tx b{color:#fff;font-weight:700}

/* ── mobile: the same thing, in a hand ─────────────────────────────────── */
.phones{display:flex;gap:clamp(20px,4vw,54px);align-items:center;justify-content:center}
.phone{width:min(260px,30vw);border-radius:30px;padding:11px;background:linear-gradient(160deg,#24344F,#141F33);border:1px solid rgba(150,190,235,.22);
  box-shadow:0 34px 80px rgba(0,0,0,.66);opacity:0;transform:translateY(28px) scale(.95)}
.phone.on{animation:noteIn .95s cubic-bezier(.16,1,.3,1) forwards}
.phone .scr{background:#0B1526;border-radius:21px;overflow:hidden;min-height:min(430px,52vh);
  display:flex;flex-direction:column}
.phone .nub{width:44%;height:5px;border-radius:5px;background:rgba(160,195,235,.25);margin:0 auto 9px}
.phone .top{padding:12px 14px;display:flex;align-items:center;gap:9px;
  background:linear-gradient(120deg,var(--coral-deep),var(--coral))}
.phone .top img{width:22px;height:22px;border-radius:6px}
.phone .top b{font-size:11.5px;font-weight:700}
.phone .bd{padding:13px 14px;flex:1}
.phone .who2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7791B0;font-weight:800;
  margin-bottom:9px}
.mrow{background:rgba(255,255,255,.045);border:1px solid rgba(140,175,220,.13);border-radius:9px;
  padding:10px 11px;margin-bottom:8px}
.mrow .t{font-size:12px;font-weight:600;color:#DCE9F6}
.mrow .s{font-size:10.5px;color:#7791B0;margin-top:2px}
.mrow .st2{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  padding:2px 7px;border-radius:12px;margin-top:6px}
.mrow .st2.o{background:rgba(240,144,111,.18);color:#F5B79C}
.mrow .st2.d{background:rgba(63,191,143,.18);color:#8FE3C4}
.phone .cap2{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:800;color:#6F8AAC;margin-top:9px}

/* ── the templates, as real little emails ─────────────────────────────── */
.tpls{display:flex;gap:14px;width:min(1000px,94vw);justify-content:center}
.tpl{flex:1;max-width:310px;border-radius:13px;overflow:hidden;background:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;transform:translateY(26px) rotate(var(--rot,0deg))}
.tpl.on{animation:tplIn .85s cubic-bezier(.16,1,.3,1) forwards}
@keyframes tplIn{to{opacity:1;transform:translateY(0) rotate(var(--rot,0deg))}}
.tpl .h{padding:10px 13px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(120deg,#0A2F4F,#0B6AB4)}
.tpl .h img{width:19px;height:19px;border-radius:5px}
.tpl .h b{font-size:10px;color:#fff;font-weight:700}
.tpl .h .tag{margin-left:auto;font-size:8px;letter-spacing:.12em;font-weight:800;padding:3px 7px;
  border-radius:11px;background:#dd7a02;color:#fff;white-space:nowrap}
.tpl.t3 .h .tag{background:#C42B21}
.tpl .al{padding:8px 13px;background:#FDECEB;border-left:3px solid #dd7a02}
.tpl.t3 .al{border-left-color:#C42B21}
.tpl .al .k{font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:#A03A33;font-weight:800}
.tpl .al .v{font-size:12px;color:#7C2A24;font-weight:800;margin-top:1px}
.tpl .b{padding:11px 13px;font-size:10.5px;color:#0A2138;line-height:1.55}
.tpl .b .rf{background:#0A2F4F;border-radius:6px;padding:6px 9px;margin-top:8px;
  font-family:ui-monospace,monospace;font-size:8.5px;color:#fff;word-break:break-all}

/* ── before / after: the same person, twice ───────────────────────────── */
.split{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,3vw,42px);align-items:center;
  width:min(1000px,94vw)}
.half{border-radius:16px;padding:26px 24px;text-align:center;opacity:0;transform:translateY(22px)}
.half.on{animation:noteIn .9s cubic-bezier(.16,1,.3,1) forwards}
.half.bad{background:linear-gradient(160deg,rgba(60,32,40,.75),rgba(28,18,26,.6));
  border:1px solid rgba(190,90,80,.26)}
.half.good{background:linear-gradient(160deg,rgba(28,58,48,.7),rgba(16,34,32,.55));
  border:1px solid rgba(63,191,143,.32)}
.half .face{font-size:clamp(42px,6vw,68px);line-height:1;margin-bottom:12px;display:block}
.half .lb2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.half.bad .lb2{color:#E39288} .half.good .lb2{color:#7FDCBB}
.half .ln{font-size:clamp(14px,1.8vw,19px);color:#DCE7F2;font-weight:500;line-height:1.45}
.half .ln small{display:block;font-size:.72em;color:#8FA6BE;margin-top:7px;font-weight:400}
.arrow{font-size:clamp(24px,3vw,38px);color:var(--coral-lit);opacity:0}
.arrow.on{animation:noteIn .8s ease forwards}

/* ── the flow, drawn ───────────────────────────────────────────────────── */
.flow{display:flex;align-items:center;justify-content:center;gap:0;width:min(1060px,94vw);flex-wrap:nowrap}
.fnode{text-align:center;flex:none;opacity:0;transform:scale(.8)}
.fnode.on{animation:pop .6s cubic-bezier(.2,1.5,.4,1) forwards}
.fnode .ic{width:clamp(46px,6vw,66px);height:clamp(46px,6vw,66px);border-radius:16px;margin:0 auto 9px;
  display:grid;place-items:center;font-size:clamp(20px,2.6vw,28px);
  background:linear-gradient(150deg,rgba(228,100,75,.2),rgba(199,74,52,.08));
  border:1px solid rgba(228,100,75,.35);box-shadow:0 0 26px rgba(228,100,75,.2)}
.fnode .lb3{font-size:clamp(9px,1.1vw,11px);letter-spacing:.13em;text-transform:uppercase;
  font-weight:800;color:#A9BDD6;white-space:nowrap}
.fline{flex:1;height:2px;background:rgba(228,100,75,.2);position:relative;min-width:14px;max-width:70px}
.fline i{position:absolute;inset:0;background:linear-gradient(90deg,var(--coral),var(--coral-lit));
  transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.fline.on i{transform:scaleX(1)}

/* ── the request card: logged, stamped, routed ─────────────────────────── */
.req{width:min(500px,82vw);border-radius:15px;overflow:hidden;
  background:linear-gradient(158deg,#12283F,#0A1B2C);
  border:1px solid rgba(96,150,200,.3);box-shadow:0 30px 70px rgba(0,0,0,.6);
  transform:translateY(30px) scale(.96);opacity:0;transition:all 1.1s cubic-bezier(.16,1,.3,1)}
.scene.on .req{transform:none;opacity:1}
.req .hd{background:linear-gradient(120deg,var(--coral-deep),var(--coral));padding:13px 19px;
  display:flex;align-items:center;gap:11px}
.req .hd .qp{width:30px;height:30px;flex:none;border-radius:8px}
.req .hd b{font-size:14px;font-weight:650}
.req .bd{padding:17px 19px}
.rw{display:flex;justify-content:space-between;gap:16px;padding:8px 0;
  border-bottom:1px dashed rgba(120,160,200,.18);font-size:13.5px}
.rw:last-child{border-bottom:0}
.rw span{color:var(--ink-3);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:700;padding-top:2px}
.rw b{font-weight:600;text-align:right}
.stamp{margin-top:15px;border-radius:10px;padding:11px 15px;display:flex;align-items:center;gap:11px;
  background:rgba(52,211,153,.11);border:1px solid rgba(52,211,153,.32);
  opacity:0;transform:scale(.88) rotate(-3deg)}
.stamp.on{animation:stamp .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{opacity:1;transform:none}}
.stamp .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);
  font-weight:800}
.stamp .v{margin-left:auto;font-size:15px;font-weight:700;color:#CFF7E8}

/* ── the chase: three notices stacking ────────────────────────────────── */
.chase{display:flex;flex-direction:column;gap:11px;width:min(560px,84vw)}
.note{border-radius:12px;padding:13px 17px;display:flex;align-items:center;gap:14px;
  background:linear-gradient(150deg,rgba(30,42,62,.95),rgba(16,26,42,.9));
  border-left:4px solid var(--warm);box-shadow:0 16px 36px rgba(0,0,0,.45);
  opacity:0;transform:translateX(-26px)}
.note.on{animation:noteIn .8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes noteIn{to{opacity:1;transform:none}}
.note.esc{border-left-color:var(--red)}
.note .n{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;
  color:var(--warm);flex:none;width:5.6em}
.note.esc .n{color:var(--red)}
.note .x{font-size:14px;color:#CBDEEE;font-weight:500}
.note .w{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}

/* ── the scoreboard ───────────────────────────────────────────────────── */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:min(880px,90vw)}
.sc{background:linear-gradient(155deg,rgba(18,40,64,.92),rgba(10,24,40,.86));
  border:1px solid rgba(96,150,200,.24);border-radius:15px;padding:22px 20px;text-align:center;
  opacity:0;transform:translateY(22px)}
.sc.on{animation:noteIn .9s cubic-bezier(.16,1,.3,1) forwards}
.sc .k{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.sc .v{font-size:clamp(34px,5.4vw,58px);font-weight:750;line-height:1.05;margin-top:.12em;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.sc .s{font-size:12.5px;color:var(--ink-2);margin-top:.3em}
.sc.g .v{color:var(--gold)} .sc.b .v{color:var(--coral-lit)} .sc.n .v{color:var(--green)}
.sc{border-color:rgba(228,100,75,.2)}
.sc .v{text-shadow:0 0 34px currentColor}

/* ── the lockup ───────────────────────────────────────────────────────── */
.lock{text-align:center}
.lock .mk{width:96px;height:96px;margin:0 auto 26px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(140deg,#4FC5F9,#0B6AB4);color:#062B45;font-size:29px;font-weight:800;
  box-shadow:0 0 90px rgba(56,189,248,.5),0 22px 50px rgba(0,0,0,.5);
  opacity:0;transform:scale(.82)}
.scene.on .lock .mk{animation:pop 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.lock h1{font-size:clamp(40px,7vw,78px);font-weight:750;letter-spacing:-.035em;line-height:1}
.lock .u{margin-top:18px;font-size:clamp(12px,1.5vw,16px);color:var(--ink-2);letter-spacing:.02em}

/* ── subtitles + chrome ───────────────────────────────────────────────── */
#cap{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:26px 6vw 14px;text-align:center;
  font-size:clamp(12px,1.45vw,15.5px);font-weight:400;color:#DDEBF7;letter-spacing:.15px;
  text-shadow:0 1px 7px rgba(0,0,0,.85);opacity:0;transition:opacity .45s;
  background:linear-gradient(180deg,rgba(3,10,18,0),rgba(3,10,18,.72) 52%,rgba(3,10,18,.86));
  pointer-events:none}
#cap.on{opacity:1}
#bars{position:absolute;inset:0;z-index:45;pointer-events:none}
#bars::before,#bars::after{content:'';position:absolute;left:0;right:0;height:5.5vh;background:#03080F;
  transition:height .9s ease}
#bars::before{top:0} #bars::after{bottom:0}
#film.wide #bars::before,#film.wide #bars::after{height:0}

#gate{position:absolute;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(70% 60% at 50% 42%, #0C2A44, #04101D);transition:opacity .8s}
#gate.off{opacity:0;pointer-events:none}
.g{text-align:center;padding:0 8vw}
.g .mk{width:74px;height:74px;margin:0 auto 24px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(140deg,#4FC5F9,#0B6AB4);color:#062B45;font-size:22px;font-weight:800;
  box-shadow:0 0 70px rgba(56,189,248,.45)}
.g h2{font-size:clamp(24px,4vw,40px);font-weight:700;letter-spacing:-.028em;line-height:1.15;
  text-wrap:balance;margin-bottom:12px}
.g p{color:var(--ink-2);font-size:15px;margin-bottom:28px}
.g button{font:inherit;font-size:15px;font-weight:650;cursor:pointer;border:0;border-radius:11px;
  padding:14px 34px;color:#052840;background:linear-gradient(135deg,#4FC5F9,#0B6AB4);
  box-shadow:0 12px 34px rgba(11,106,180,.45);transition:transform .18s,filter .18s}
.g button:hover{transform:translateY(-1px);filter:brightness(1.08)}
.g button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.g .note{background:none;border:0;box-shadow:none;opacity:1;transform:none;display:block;
  margin-top:18px;font-size:12px;color:var(--ink-3);padding:0}

#skip{position:absolute;right:18px;top:calc(5.5vh + 14px);z-index:50;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#7FA4C4;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(160,200,230,.2);border-radius:20px;
  padding:7px 15px;opacity:0;transition:opacity .4s}
#skip.on{opacity:.8} #skip:hover{opacity:1;color:#fff}
/* On a phone the frame is a third of the width and twice as tall. Reflow the
   wide compositions rather than scaling them down into unreadability. */
@media (max-width:820px){
  .cast{gap:6px}
  .guy{--w:clamp(62px,20vw,96px)}
  .guy.big{--w:clamp(84px,30vw,130px)}
  .bld{--bw:clamp(46px,17vw,72px)}
  .town{gap:5px}
  .town .bld:nth-child(n+5){display:none}
  .cast .guy:nth-child(n+5){display:none}
  .bub{font-size:12px;padding:8px 12px;max-width:88vw}
  .stagewrap{gap:14px}
  .half .guy{--w:clamp(56px,18vw,84px)}
  #bars::before,#bars::after{height:0}
  #cap{padding:20px 5vw 12px;white-space:normal;font-size:13px;line-height:1.35}
  #rail{bottom:64px;padding:0 4vw}
  .stn{max-width:none}
  .stn .pip::after{font-size:7.5px;letter-spacing:.06em}
  /* the chaos: fewer chips, ringed tighter around the hub */
  .chaos{height:min(460px,58vh)}
  .dept{font-size:9.5px;padding:5px 9px}
  .dept:nth-child(n+11){display:none}
  .hub .env{width:74px;height:74px;border-radius:17px}
  .hub .env svg{width:38px;height:38px}
  /* templates stack to one, full width */
  .tpls{flex-direction:column;align-items:center;gap:10px}
  .tpl{max-width:min(420px,88vw);width:100%;--rot:0deg!important}
  .tpl:nth-child(3){display:none}
  /* one phone at a time, larger */
  .phones{gap:14px}
  .phone{width:min(300px,74vw)}
  .phone:nth-child(2){display:none}
  .phones.showClient .phone:nth-child(1){display:none}
  .phones.showClient .phone:nth-child(2){display:block}
  /* the split becomes a stack */
  .split{grid-template-columns:1fr;gap:12px}
  .arrow{transform:rotate(90deg);justify-self:center}
  .half{padding:18px 16px}
  /* the flow wraps */
  .flow{flex-wrap:wrap;gap:10px 0;justify-content:center}
  .fline{max-width:26px;min-width:10px}
  /* screens and scoreboard */
  /* keep the diagram inside the frame: above the journey rail, below Skip */
  .conste{width:99vw;display:flex;justify-content:center}
  .conste svg{max-height:66vh;width:auto;max-width:99vw}
  .index{grid-template-columns:1fr 1fr;width:94vw}
  .ix{padding:9px 10px;font-size:10.5px;min-height:36px}
  .idxq{font-size:12.5px}
  .inbox{width:94vw}
  .msg{grid-template-columns:auto 1fr;gap:9px;padding:10px 12px}
  .msg .when,.msg .flag{display:none}
  .msg .sub2 b{font-size:12px} .msg .sub2 span{font-size:10.5px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .score{grid-template-columns:1fr;gap:9px}
  .sc{padding:14px 16px}
  .sc .v{font-size:34px}
  .r{grid-template-columns:1fr;gap:6px}
  .r .st,.r .dd{justify-self:start}
}
@media (prefers-reduced-motion:reduce){
  .line w{animation-duration:.01ms!important} #grain{animation:none}
}
</style>

/* The journey: six stations. Each line names the station it belongs to, so
   the rail always shows where in the story we are. */
const STATIONS = ['Asked', 'Logged', 'Routed', 'Chased', 'Answered', 'Rated'];
const $ = s => document.querySelector(s);

function buildRail() {
  $('#rail').innerHTML = STATIONS.map(l =>
    `<div class="stn"><div class="pip" data-l="${l}"></div><div class="bar"><i></i></div></div>`).join('');
}
let railAt = -1;
function railTo(i) {
  if (i === railAt) return;
  railAt = i;
  const st = [...document.querySelectorAll('.stn')];
  st.forEach((s, k) => {
    s.classList.toggle('lit', k <= i);
    s.classList.toggle('done', k < i);
  });
}
/* A push-in: scale the stage slowly across the seconds a scene is held, so
   screens are travelled into rather than cut to. */
function camera(scale, yPct, seconds) {
  const st = document.getElementById('stage');
  st.style.transitionDuration = (seconds || 4) + 's';
  st.style.transform = `scale(${scale}) translateY(${yPct || 0}px)`;
}
function sweep() {
  const el = $('#sweep');
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
/* numbers should arrive, not appear */
function countUp(el, to, suffix, ms) {
  const from = 0, t0 = performance.now(), dec = String(to).includes('.') ? 1 : 0;
  (function step(t) {
    const k = Math.min(1, (t - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = (from + (to - from) * e).toFixed(dec) + (suffix || '');
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
const stage = $('#stage'), film = $('#film'), cap = $('#cap');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ── words land one at a time, paced to the length of the line ─────────── */
function typeset(html) {
  return html.replace(/(<[^>]+>)|([^\s<]+)/g, (m, tag, word) => tag ? tag : '<w>' + word + '</w>');
}
function runWords(el, seconds) {
  const ws = el.querySelectorAll('w');
  if (!ws.length) return;
  // finish the reveal in the first 55% of the line, so the type is never
  // still arriving while the voice has moved on
  const step = Math.min(150, (seconds * 550) / ws.length);
  ws.forEach((w, i) => setTimeout(() => w.classList.add('in'), i * step));
}
function newScene(html, cls) {
  const s = document.createElement('div');
  s.className = 'scene' + (cls ? ' ' + cls : '');
  s.innerHTML = html;
  stage.appendChild(s);
  requestAnimationFrame(() => s.classList.add('on'));
  return s;
}
/* Scenes cut, they do not dissolve into each other: the outgoing scene is
   faded during the pause AFTER its line, so the next one always arrives on a
   clean stage. Overlapping two lit scenes read as a fault, not a transition. */
function clearStage(keep) {
  [...stage.children].forEach(c => {
    if (c === keep) return;
    c.classList.add('out');
    setTimeout(() => c.remove(), 520);
  });
}

/* The inbox is one continuous scene across three lines — it fills up, then
   sinks. Rebuilding it each line cross-faded two near-identical stacks over
   each other, which read as a rendering fault rather than a cut. */
let stackScene = null;
function mailStack(reveal) {
  if (!stackScene || !stackScene.isConnected) {
    const rows = MAILS.map((m, i) =>
      `<div class="mail" style="--y:${i * 66}px;--s:${1 - i * 0.012}">
         <div class="dot"></div><div class="t">${m[0]}</div><div class="d">${m[1]}</div></div>`).join('');
    stackScene = newScene(`<div class="stack">${rows}</div>`);
  }
  const els = [...stackScene.querySelectorAll('.mail')];
  els.slice(0, reveal).forEach((e, i) => {
    if (e.dataset.up) return;
    e.dataset.up = '1';
    setTimeout(() => e.classList.add('rise'), i * 170);
  });
  return stackScene;
}
function mailSink() {
  const s = mailStack(MAILS.length);
  [...s.querySelectorAll('.mail')].forEach((e, i) =>
    setTimeout(() => e.classList.add('drop'), i * 150));
  return s;
}

/* an envelope thrown from the hub at a chip; `back` means it bounces */
function throwMail(scene, chipIx, delay, back) {
  const stageEl = scene.querySelector('.chaos');
  const chip = stageEl.querySelectorAll('.dept')[chipIx];
  if (!chip) return;
  const f = document.createElement('div');
  f.className = 'fly';
  const r = stageEl.getBoundingClientRect(), c = chip.getBoundingClientRect();
  f.style.left = '50%'; f.style.top = '50%';
  f.style.setProperty('--tx', (c.left + c.width / 2 - (r.left + r.width / 2)) + 'px');
  f.style.setProperty('--ty', (c.top + c.height / 2 - (r.top + r.height / 2)) + 'px');
  f.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
  f.style.setProperty('--d', (1.7 + Math.random() * 0.8) + 's');
  stageEl.appendChild(f);
  setTimeout(() => {
    f.classList.add(back ? 'back' : 'go');
    setTimeout(() => chip.classList.add('hit'), back ? 1050 : 1250);
    if (back) setTimeout(() => chip.classList.remove('hit'), 2300);
  }, delay);
}

/* throw a drawn envelope from one element to another, inside a wrapper */
function paperFlight(wrap, fromEl, toEl, delay, opts) {
  const o = Object.assign({ bounce:false, ms:1500, glow:false }, opts || {});
  const W = wrap.getBoundingClientRect(), A = fromEl.getBoundingClientRect(), B = toEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'pap';
  if (o.glow) el.style.boxShadow = '0 0 22px rgba(240,144,111,.9),0 5px 14px rgba(0,0,0,.5)';
  el.style.left = (A.left + A.width / 2 - W.left) + 'px';
  el.style.top  = (A.top + A.height / 2 - W.top) + 'px';
  el.style.opacity = '0';
  wrap.appendChild(el);
  const dx = (B.left + B.width / 2) - (A.left + A.width / 2);
  const dy = (B.top + B.height / 2) - (A.top + A.height / 2);
  const arc = -Math.max(40, Math.abs(dx) * 0.34);
  setTimeout(() => {
    const frames = o.bounce
      ? [{ transform:'translate(0,0) rotate(0)', opacity:0 },
         { transform:`translate(${dx * .5}px,${dy * .5 + arc}px) rotate(140deg)`, opacity:1, offset:.32 },
         { transform:`translate(${dx}px,${dy}px) rotate(300deg)`, opacity:1, offset:.55 },
         { transform:`translate(${dx * .55}px,${dy * .55 + arc * .7}px) rotate(400deg)`, opacity:1, offset:.78 },
         { transform:'translate(0,10px) rotate(520deg)', opacity:0 }]
      : [{ transform:'translate(0,0) rotate(0)', opacity:0 },
         { transform:`translate(${dx * .5}px,${dy * .5 + arc}px) rotate(9deg)`, opacity:1, offset:.45 },
         { transform:`translate(${dx}px,${dy}px) rotate(0)`, opacity:1 }];
    el.animate(frames, { duration: o.ms, easing:'cubic-bezier(.3,.05,.4,1)', fill:'forwards' });
    if (!o.bounce) setTimeout(() => el.remove(), o.ms + 900);
    else setTimeout(() => el.remove(), o.ms + 100);
  }, delay);
  return el;
}

/* type text into an element, character by character, with a live caret */
function typeInto(el, text, cps) {
  return new Promise(res => {
    let i = 0;
    const caret = document.createElement('span'); caret.className = 'caret';
    el.textContent = ''; el.appendChild(caret);
    const tick = () => {
      if (i >= text.length) { setTimeout(() => caret.remove(), 700); return res(); }
      caret.insertAdjacentText('beforebegin', text[i++]);
      setTimeout(tick, 1000 / (cps || 26));
    };
    setTimeout(tick, 260);
  });
}

    <div class="in">${inner}</div></div>`;
}

const DEPT4 = ['Customer Service', 'Health Claims', 'Group Admin', 'Underwriting'];



function bigLine(html, sub, small) {

/* ══ the score — played, not loaded ══════════════════════════════════════
   The branch theme: D major, 108 BPM, D–A–Bm–G. Four voices per chord —
   two detuned saws through a soft low-pass for warmth, a triangle an octave
   up for air, a sine underneath for weight. Long attacks and releases, so
   chords bloom into each other instead of stepping.                        */
const BPM = 108, BAR = (60 / BPM) * 4, CHORD_LEN = BAR * 2;   // ~4.4s per chord
const PROG = [                       // D – A – Bm – G, twice round with a lift
  [146.83, 220.00, 293.66],          // D
  [110.00, 164.81, 220.00],          // A
  [123.47, 185.00, 246.94],          // Bm
  [98.00,  146.83, 196.00],          // G
];
let AC = null, bus = null, music = null, musicTimer = null, chordIx = 0, lift = 0;
let hatTimer = null, _tuneHold = null;                 // every timer the score starts is held, so
                                     // every one of them can be stopped again
let vox = null, VOBUF = {};          // narration bus + decoded narration

function b64ToBuf(b64) {
  const bin = atob(b64), n = bin.length, a = new Uint8Array(n);
  for (let i = 0; i < n; i++) a[i] = bin.charCodeAt(i);
  return a.buffer;
}
/* Decode every line up front. Safari wants the callback form, so support both. */
function decodeVO() {
  const ids = Object.keys(VO);
  return Promise.all(ids.map(id => new Promise(res => {
    let done = false;
    const ok = buf => { if (!done) { done = true; VOBUF[id] = buf; res(); } };
    const bad = () => { if (!done) { done = true; res(); } };
    try {
      const r = AC.decodeAudioData(b64ToBuf(VO[id]), ok, bad);
      if (r && r.then) r.then(ok, bad);
    } catch (e) { bad(); }
    setTimeout(bad, 8000);
  })));
}
function speakLine(id) {
  const buf = VOBUF[id];
  if (!buf || !AC) return 0;
  const src = AC.createBufferSource();
  src.buffer = buf; src.connect(vox); src.start();
  return buf.duration;
}

function startScore() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  bus = AC.createGain(); bus.gain.value = 0.0001;
  music = AC.createGain(); music.gain.value = 1;        // ducked under the voice
  vox = AC.createGain(); vox.gain.value = 1.0;          // the narration rides on top
  vox.connect(AC.destination);
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.4;
  const air = AC.createGain(); air.gain.value = 0.55;
  bus.connect(lp); lp.connect(music);
  bus.connect(air); air.connect(music);
  music.connect(AC.destination);
  // the bed used to sit around -21 dBFS against a full-scale voice, which is
  // to say inaudible. It now plays at a level you can actually hear, and
  // steps back under narration instead of hiding under it permanently.
  bus.gain.linearRampToValueAtTime(STAGE[0], AC.currentTime + 3.2);   // soft to open
  chord(); musicTimer = setInterval(chord, CHORD_LEN * 1000);
  hat();
}
function voice(type, freq, t, len, gain, detune) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  if (detune) o.detune.value = detune;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + len * 0.42);      // long bloom
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + len + 0.05);
}
function chord() {
  if (!AC) return;
  const t = AC.currentTime, notes = PROG[chordIx % PROG.length], L = CHORD_LEN * 1.9;
  notes.forEach((f, i) => {
    const warm = lift ? 1.25 : 0.82;                              // opens out after the turn
    voice('sawtooth', f, t, L, 0.115 * warm / (i + 1), -7);       // two detuned saws
    voice('sawtooth', f, t, L, 0.115 * warm / (i + 1), +7);
    voice('triangle', f * 2, t, L, 0.055 * warm / (i + 1));       // air, an octave up
  });
  voice('sine', notes[0] / 2, t, L, 0.20);                        // weight underneath
  // pluck: the top of the chord, once a bar, brighter after the reveal
  const pf = notes[2] * (lift ? 2 : 1);
  const p = AC.createOscillator(), pg = AC.createGain();
  p.type = 'triangle'; p.frequency.value = pf;
  pg.gain.setValueAtTime(0.0001, t + 0.02);
  pg.gain.exponentialRampToValueAtTime(lift ? 0.16 : 0.09, t + 0.06);
  pg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
  p.connect(pg); pg.connect(bus); p.start(t + 0.02); p.stop(t + 1.7);
  chordIx++;
}
function hat() {                                                  // brushed, offbeat
  if (!AC) return;
  const beat = 60 / BPM;
  const tick = () => {
    if (!AC || !lift) return;
    const t = AC.currentTime, n = AC.createBufferSource();
    const b = AC.createBuffer(1, AC.sampleRate * 0.04, AC.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    n.buffer = b;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
    const g = AC.createGain(); g.gain.value = 0.075;
    n.connect(hp); hp.connect(g); g.connect(music);
    n.start(t);
  };
  hatTimer = setInterval(tick, beat * 1000);
}
/* The upbeat: an eighth-note arpeggio over the chord, running only while the
   film is lifted. Before the turn the bed is pads alone, and quiet. */
let arpTimer = null, arpStep = 0;
function startArp() {
  if (arpTimer || !AC) return;
  const eighth = (60 / BPM) / 2;
  arpTimer = setInterval(() => {
    if (!AC || !lift) return;
    const notes = PROG[(chordIx - 1 + PROG.length) % PROG.length];
    const seq = [0, 1, 2, 1, 0, 2, 1, 2];
    const f = notes[seq[arpStep % seq.length]] * 4;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(arpStep % 4 === 0 ? 0.075 : 0.045, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.45);
    arpStep++;
  }, eighth * 1000);
}
/* a soft heartbeat kick on the downbeat, and a shaker on the offbeat — the
   difference between a bed and something you can move to */
let pulseTimer = null, pulseStep = 0;
function startPulse() {
  if (pulseTimer || !AC) return;
  const eighth = (60 / BPM) / 2;
  pulseTimer = setInterval(() => {
    if (!AC || !lift) return;
    const t = AC.currentTime;
    if (pulseStep % 4 === 0) {                       // kick
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(112, t);
      o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
      g.gain.setValueAtTime(0.42, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(music); o.start(t); o.stop(t + 0.24);
    }
    if (pulseStep % 2 === 1) {                       // shaker
      const n = AC.createBufferSource();
      const b = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.4);
      n.buffer = b;
      const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
      const g = AC.createGain(); g.gain.value = pulseStep % 4 === 3 ? 0.10 : 0.055;
      n.connect(hp); hp.connect(g); g.connect(music); n.start(t);
    }
    pulseStep++;
  }, eighth * 1000);
}
/* ══ the melody ═══════════════════════════════════════════════════════
   The bed had harmony and rhythm but nothing to hum. This is a plain
   eight-note phrase in D, played on a soft bell an octave and a half up,
   restated each time the chords come round. It is the tune the film is
   remembered by, so it enters at the turn and stays.                     */
const TUNE = [                       // scale degrees against each chord, in beats
  [[0, 0, 2], [2, 1.5, 2], [4, 3, 1]],           // D  — rising, open
  [[2, 0, 2], [1, 2, 2]],                        // A  — answers it
  [[4, 0, 1.5], [2, 1.5, 1.5], [0, 3, 1]],       // Bm — falls away
  [[2, 0, 2], [4, 2, 2]],                        // G  — lifts, unresolved
];
let tuneTimer = null, tuneBar = 0;
function bell(f, t, len, gain) {
  const o = AC.createOscillator(), g = AC.createGain(), o2 = AC.createOscillator();
  o.type = 'sine'; o.frequency.value = f;
  o2.type = 'sine'; o2.frequency.value = f * 2.01;      // a touch of shimmer
  const g2 = AC.createGain(); g2.gain.value = 0.22;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.035);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus);
  o.start(t); o.stop(t + len + 0.05); o2.start(t); o2.stop(t + len + 0.05);
}
function playPhrase() {
  if (!AC || !lift) return;
  const notes = TUNE[tuneBar % TUNE.length];
  const chord = PROG[tuneBar % PROG.length];
  const beat = 60 / BPM, t0 = AC.currentTime;
  notes.forEach(([deg, at, len]) => {
    const f = chord[deg % chord.length] * (deg >= 3 ? 4 : 2);   // up an octave or two
    bell(f, t0 + at * beat, len * beat * 0.95, 0.085);
  });
  tuneBar++;
}
function startTune() {
  if (tuneTimer || !AC) return;
  playPhrase();
  tuneTimer = setInterval(playPhrase, CHORD_LEN * 1000);
}

/* The film should feel like it is going somewhere. The bed climbs in five
   steps rather than flicking between two, so each act sits a little higher
   than the last and the close is the loudest thing in it. */
const STAGE = [0.80, 1.05, 1.35, 1.60, 1.95];
let stageNow = -1;
function scoreStage(n) {
  if (!AC || n <= stageNow) return;
  stageNow = n;
  const t = AC.currentTime;
  bus.gain.cancelScheduledValues(t);
  bus.gain.setValueAtTime(bus.gain.value, t);
  bus.gain.linearRampToValueAtTime(STAGE[Math.min(n, STAGE.length - 1)], t + 2.4);
}
function scoreLift(on) {
  lift = on ? 1 : 0;
  if (on) { startPulse(); startTune(); }
  if (!AC) return;
  const t = AC.currentTime;
  bus.gain.cancelScheduledValues(t);
  bus.gain.setValueAtTime(bus.gain.value, t);
  bus.gain.linearRampToValueAtTime(on ? 1.55 : 0.95, t + 2.2);   // the lift you hear
  if (on) startArp();
}
function duck(down) {
  if (!music) return;
  const t = AC.currentTime;
  music.gain.cancelScheduledValues(t);
  music.gain.setValueAtTime(music.gain.value, t);
  music.gain.linearRampToValueAtTime(down ? 0.42 : 1, t + (down ? 0.35 : 0.9));
}
/* The end of the film is the end of the music. Everything rhythmic stops on
   the spot, one last D major chord is left to ring, and the context is closed
   so nothing can carry on playing behind the last frame. */
function scoreOut() {
  if (!AC) return;
  lift = 0;
  [musicTimer, arpTimer, pulseTimer, hatTimer, tuneTimer].forEach(t => clearInterval(t));
  musicTimer = arpTimer = pulseTimer = hatTimer = tuneTimer = null;

  const t = AC.currentTime;
  if (music) { music.gain.cancelScheduledValues(t); music.gain.setValueAtTime(1, t); }
  bus.gain.cancelScheduledValues(t);
  bus.gain.setValueAtTime(bus.gain.value, t);
  bus.gain.linearRampToValueAtTime(1.15, t + 0.4);      // one last swell…
  bus.gain.exponentialRampToValueAtTime(0.0001, t + 6.2); // …then away to nothing

  PROG[0].forEach((f, i) => voice('triangle', f * 2, t, 6.0, 0.05 / (i + 1)));
  voice('sine', PROG[0][0] / 2, t, 6.0, 0.16);          // the tonic, left to ring
  bell(PROG[0][0] * 4, t + 0.15, 5.0, 0.10);            // and the tune's last note
  setTimeout(() => { try { AC.close(); } catch (e) {} AC = null; }, 7200);
}

/* ── bokeh: slow lights, drifting ───────────────────────────────────────── */
(function bokeh() {
  const c = $('#bokeh'), x = c.getContext('2d');
  let w, h, pts;
  const size = () => {
    w = c.width = innerWidth; h = c.height = innerHeight;
    pts = Array.from({ length: 16 }, (_, i) => ({
      x: Math.random() * w, y: Math.random() * h,
      r: 40 + Math.random() * 150, s: 0.06 + Math.random() * 0.16,
      a: 0.03 + Math.random() * 0.07, hue: i % 3 ? 202 : 36,
    }));
  };
  size(); addEventListener('resize', size);
  (function draw() {
    x.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.y -= p.s; if (p.y + p.r < 0) { p.y = h + p.r; p.x = Math.random() * w; }
      const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `hsla(${p.hue},85%,62%,${p.a})`);
      g.addColorStop(1, 'hsla(202,85%,62%,0)');
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
    }
    requestAnimationFrame(draw);
  })();
})();

/* ── the projector ──────────────────────────────────────────────────────── */
const REC = new URLSearchParams(location.search).has('rec');
let running = false, held = null, recStep = 0;
const REC_COLS = ['#ff0000', '#00ff00', '#0000ff'];
function recMark() {
  if (!REC) return;
  let d = document.getElementById('recDot');
  if (!d) { d = document.createElement('div'); d.id = 'recDot';
    d.style.cssText = 'position:fixed;left:0;top:0;width:14px;height:14px;z-index:2147483647;pointer-events:none';
    document.body.appendChild(d); }
  d.style.background = REC_COLS[recStep++ % 3];
}
/* scenes whose stage the NEXT line keeps using */
const HOLD_AFTER = new Set(['phones', 'forget']);
async function play() {
  if (running) return; running = true;
  /* Everything that needs a user gesture happens right here, synchronously:
     iOS will not start audio later on, no matter how it is asked. */
  $('#play').textContent = 'Loading…';
  startScore();
  try { await AC.resume(); } catch (e) {}
  await decodeVO();                       // ~600 KB of narration, decoded once

  $('#gate').classList.add('off');
  if (!REC) { $('#skip').hidden = false;
    setTimeout(() => $('#skip').classList.add('on'), 1200); }
  buildRail();
  await sleep(1400);
  $('#rail').classList.add('on');
  await sleep(700);                       // let the score establish before a word

  for (const line of SCRIPT) {
    if (!running) return;
    const buf = VOBUF[line.id];
    const dur = (buf && buf.duration) ? buf.duration : 3.2;

    if (line.scene === 'built') scoreLift(true);
    const STEP = { openMail:0, mckinsey:1, built:2, typing:2, templates:3,
                   phones:3, demand:4, rings:4, thisIs:4 };
    if (STEP[line.scene] != null) scoreStage(STEP[line.scene]);
    if (line.scene === 'lockup') { scoreOut(); $('#rail').classList.remove('on'); camera(1, 0, 3); }

    const made = SCENES[line.scene] ? SCENES[line.scene](line.text) : bigLine(line.text);
    const built = made || held;               // null = hold the scene already on stage
    held = built;
    if (made) clearStage(built);
    const words = built && built.querySelector('.line');
    if (words) runWords(words, dur);

    recMark();
    railTo(line.stn == null ? 0 : line.stn);
    cap.textContent = line.text.replace(/<[^>]+>/g, '');
    cap.classList.add('on');
    duck(true);
    speakLine(line.id);

    await sleep(dur * 1000);                 // the line finishes speaking
    duck(false);                             // the bed comes back up between lines
    if (line.after > 1.1) cap.classList.remove('on');
    if (!HOLD_AFTER.has(line.scene)) clearStage(null);   // fade out during the pause
    await sleep(line.after * 1000);
  }
  cap.classList.remove('on');
  $('#skip').classList.remove('on');
  running = false;                       // the film is over — recorders watch this
}
function stop() {
  running = false;
  [musicTimer, arpTimer, pulseTimer, hatTimer, tuneTimer].forEach(t => clearInterval(t));
  musicTimer = arpTimer = pulseTimer = hatTimer = tuneTimer = null;
  lift = 0;
  try { if (AC) AC.close(); } catch (e) {}
  cap.classList.remove('on');
  location.reload();
}
/* iOS silences Web Audio when the hardware ring switch is set to silent, so
   say so before the film starts rather than leaving someone with a mute film. */
if (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
  $('#gnote').innerHTML = 'Turn the side switch <b>off silent</b> and the volume up —'
    + ' iPhone mutes web audio otherwise.<br>Ricky Rampersad Branch 26000 · Chaguanas';
}
$('#play').onclick = play;
$('#skip').onclick = stop;
addEventListener('keydown', e => { if (e.key === 'Escape') stop(); });
</script>
