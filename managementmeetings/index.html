<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Branch Meeting Builder</title>
<!-- The meeting app moved to /meetings on 9 October 2026, because that is the
     address the branch is told at the launch and the one people type on a
     phone. This stub keeps every link and bookmark anybody already has
     working. A redirect stub carries no view beacon — the house rule — since
     the page it lands on reports for itself. -->
<meta http-equiv="refresh" content="0; url=/meetings/">
<link rel="canonical" href="https://rickyrampersadbranch.com/meetings/">
<meta name="robots" content="noindex">
<script>
/* Carry the query string and the hash across, so a link straight to one
   meeting still lands on that meeting rather than on the home list. */
location.replace('/meetings/' + location.search + location.hash);
</script>
</head><body><p>The meeting app has moved to <a href="/meetings/">rickyrampersadbranch.com/meetings</a>…</p></body></html>
