# Netlify configuration — travelmedicalcover.com
#
# Static site, no build step. Setup instructions live outside this folder
# so they are never served to the public.

[build]
  publish = "."
  command = ""

# ── Security headers ─────────────────────────────────────────────────────
# The page is self-contained apart from Google Fonts, so the policy can be
# tight. If a payment provider or analytics is added later, widen the
# relevant directive rather than removing the header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Content-Security-Policy = """
      default-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      script-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      connect-src 'self'; \
      form-action 'none'; \
      frame-ancestors 'self'; \
      base-uri 'self'"""

# The page itself stays fresh so edits appear immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
