<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fear, in Blood Brothers · English B</title>
<meta name="description" content="Ricky Rampersad Branch. A guided workshop for writing your own five-paragraph CSEC English B essay on the theme of fear in John Wickham's short story Blood Brothers.">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg">
<meta name="theme-color" content="#07131f">
<style>
/* Layout: a navy gate, then a notebook: six stages down the side, the stage in the
   middle, the coach on the right. The casuarinas on the gate are the story's own trees, under
   the moon of the night walk on Garnet Road. */
:root{
  /* The branch palette — the values in IBRAND. */
  --navy:#07131f; --gold:#efc24b; --gold2:#c9942c; --teal:#00CFEA;
  --ink:#16202b; --muted:#5c6b7a; --rule:#e2e8ee;
  --paper:#F5F7FA; --surface:#FFFFFF; --surface2:#EDF1F6; --field:#FFFFFF;
  --tealInk:#0A7C8C; --goldInk:#8A6410; --goldSoft:#FBF3DC;
  --go:#1C7A52; --goBg:#E6F4EC; --stop:#A8362A; --stopBg:#FBEAE7; --warn:#8A6410; --warnBg:#FBF3DC;
  --sans:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --display:Optima,"Palatino Linotype",Georgia,serif;
  --read:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(7,19,31,.05),0 6px 18px rgba(7,19,31,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#DDE6ED; --paper:#07131f; --surface:#0F2131; --surface2:#17303F; --field:#0B1B29;
  --muted:#8FA3B3; --rule:#22394A;
  --tealInk:#4FD8EE; --goldInk:#efc24b; --goldSoft:#2A2410;
  --go:#4FB489; --goBg:#0F2E24; --stop:#DE8477; --stopBg:#321915; --warn:#D9AC57; --warnBg:#2A2410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#DDE6ED; --paper:#07131f; --surface:#0F2131; --surface2:#17303F; --field:#0B1B29;
  --muted:#8FA3B3; --rule:#22394A;
  --tealInk:#4FD8EE; --goldInk:#efc24b; --goldSoft:#2A2410;
  --go:#4FB489; --goBg:#0F2E24; --stop:#DE8477; --stopBg:#321915; --warn:#D9AC57; --warnBg:#2A2410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--tealInk)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* The branch mark — logo-mark.png, never a substitute. */
.mark{border-radius:13px;overflow:hidden;background:#07131f;display:grid;place-items:center}
.mark img{width:100%;height:100%;display:block}

/* ================= gate ================= */
.gate{min-height:100vh;position:relative;overflow:hidden;color:#EAF1F6;
  background:radial-gradient(1100px 620px at 50% -10%,#12293d 0%,#07131f 62%);
  display:grid;place-items:start center;padding:3rem 16px 190px}
#trees{position:absolute;left:0;right:0;bottom:0;width:100%;height:180px;display:block;pointer-events:none}
.gatebox{position:relative;width:min(760px,100%);text-align:center}
.gatebox .mark{width:74px;height:74px;margin:0 auto 1.1rem;box-shadow:0 10px 34px rgba(0,0,0,.42)}
.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:.55rem}
.gatebox h1{font-size:clamp(1.9rem,5vw,2.6rem);color:#fff;letter-spacing:.01em}
.gatebox h1 i{color:var(--gold);font-style:italic}
.gatebox .sub{color:#A9BCCB;margin:.7rem auto 2rem;max-width:50ch;font-size:15px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media (max-width:620px){.doors{grid-template-columns:1fr}}
.door{background:rgba(255,255,255,.055);border:1px solid rgba(239,194,75,.24);border-radius:14px;
  padding:1.15rem 1rem 1.2rem;display:flex;flex-direction:column;align-items:center;gap:.55rem}
.door b{font-family:var(--display);font-size:1.15rem;color:#fff}
.door small{color:#8FA5B8;font-size:12.5px;margin-top:-.35rem}
.door input{width:100%;max-width:280px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);
  border-radius:9px;padding:.7rem .9rem;color:#fff;text-align:center;letter-spacing:.14em;
  font-family:var(--mono);font-size:15px;text-transform:uppercase}
.door input:focus{border-color:var(--gold);background:rgba(255,255,255,.11);outline:none}
.door input::placeholder{color:#6E8497}
.gatego{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#07131f;border:0;border-radius:9px;
  padding:.68rem 1.4rem;font-weight:800;font-size:14px;letter-spacing:.03em}
.gatego:hover{filter:brightness(1.07)}
.gatego[disabled]{opacity:.6;cursor:progress}
#gateErr{color:#F0A79B;font-size:14px;min-height:1.4em;margin-top:.9rem}
.path{list-style:none;margin:1.8rem auto 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:left;max-width:700px}
@media (max-width:620px){.path{grid-template-columns:1fr 1fr}}
.path li{display:flex;gap:.55rem;align-items:baseline;font-size:13px;color:#A9BCCB;
  background:rgba(255,255,255,.035);border-radius:10px;padding:.55rem .7rem}
.path li b{font-family:var(--mono);color:var(--gold);font-size:12px}
.path li span{color:#E2EAF0}
details.notice{max-width:min(620px,100%);margin:1.4rem auto 0;text-align:left;
  border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(7,19,31,.55)}
details.notice > summary{cursor:pointer;list-style:none;padding:.7rem .95rem;font-size:13px;font-weight:700;color:#A9BCCB;display:flex;gap:.5rem}
details.notice > summary::-webkit-details-marker{display:none}
details.notice > summary::before{content:"▸";color:var(--gold);transition:transform .15s}
details.notice[open] > summary::before{transform:rotate(90deg)}
details.notice .in{padding:0 .95rem 1rem;font-size:13px;color:#9FB3C4;line-height:1.65}
details.notice .in b{color:#DCE6EE}
details.notice .in ul{margin:.4rem 0;padding-left:1.1rem}

/* ================= header ================= */
header.top{background:var(--navy);position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(255,255,255,.07)}
.hin{max-width:1400px;margin:0 auto;padding:.55rem 16px;display:flex;align-items:center;gap:.9rem}
.brand{display:flex;align-items:center;gap:.65rem;margin-right:auto;min-width:0}
.brand .mark{width:36px;height:36px;flex:none;box-shadow:0 0 0 1px rgba(239,194,75,.3)}
.brand b{display:block;font-family:var(--display);font-size:15.5px;color:#fff;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.who{display:flex;align-items:center;gap:.7rem;color:#C9D6E0;font-size:13.5px;flex:none}
.who .me{font-weight:700;color:#fff;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#E2EAF0;border-radius:8px;padding:.35rem .7rem;font-size:13px}
.hbtn:hover{border-color:var(--gold);color:#fff}
.sync{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8FA5B8;min-width:5.5em;text-align:right}
.sync.bad{color:#F5A79B}
@media (max-width:560px){.who .me{display:none}.brand small{display:none}}

/* ================= the notebook ================= */
.shell{max-width:1400px;margin:0 auto;padding:1.4rem 16px 6rem;display:grid;grid-template-columns:228px minmax(0,1fr);gap:1.6rem;align-items:start;min-height:calc(100vh - 56px)}
@media (min-width:1200px){.shell{grid-template-columns:228px minmax(0,1fr) 350px}}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:1rem;padding-top:1rem}}

.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:.35rem}
.rail .q{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.7rem .8rem;margin-bottom:.5rem}
.rail .q b{display:block;color:var(--ink);font-family:var(--display);font-size:13.5px;margin-bottom:.2rem}
.st{display:grid;grid-template-columns:28px minmax(0,1fr);gap:.1rem .6rem;align-items:center;text-align:left;
  background:none;border:1px solid transparent;border-radius:10px;padding:.55rem .6rem;color:var(--ink)}
.st:hover{background:var(--surface)}
.st.on{background:var(--surface);border-color:var(--rule);box-shadow:var(--shadow)}
.st .n{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12.5px;font-weight:700;background:var(--surface2);color:var(--muted)}
.st.on .n{background:var(--navy);color:var(--gold)}
.st.done .n{background:var(--goBg);color:var(--go)}
.st .t{font-weight:600;font-size:14px;line-height:1.25}
.st .bar{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.st .bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.st .tn{grid-column:2;font-size:11px;font-weight:700}
.tn.ok{color:var(--go)} .tn.more{color:var(--warn)}
@media (max-width:860px){
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:.4rem;padding-bottom:.25rem;scrollbar-width:thin}
  .rail .q{display:none}
  .st{flex:none;width:168px}
}

.page{min-width:0;display:flex;flex-direction:column;gap:1.1rem}
.sh .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--goldInk)}
.sh h1{font-size:clamp(1.6rem,3.6vw,2.15rem);margin:.2rem 0 .45rem}
.sh .lead{color:var(--muted);max-width:68ch;font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:1.1rem 1.15rem;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.2rem}
.h3{font-size:1.05rem!important}
.card > * + *{margin-top:.75rem}
.card.stack > * + *,.card.row > * + *,.card.ro > * + *{margin-top:0}
.steps{margin:.5rem 0 0;padding-left:1.25rem;display:grid;gap:.3rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:1.1rem;align-items:start}
@media (max-width:1040px){.split{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:1rem;position:sticky;top:76px}
@media (max-width:1040px){.side{position:static}}
.stack{display:flex;flex-direction:column;gap:.9rem;min-width:0}

.f{display:flex;flex-direction:column;gap:.3rem;font-size:13.5px;font-weight:600;color:var(--ink);min-width:0}
.f .hint{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--field);border:1px solid var(--rule);border-radius:9px;
  padding:.6rem .7rem;font-size:15px;font-weight:400;line-height:1.5;color:var(--ink)}
textarea{resize:vertical;min-height:3.2em}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tealInk);box-shadow:0 0 0 3px rgba(0,207,234,.18)}
textarea.quote{font-family:var(--read);font-style:italic;background:var(--goldSoft)}
textarea.draft{font-family:var(--read);font-size:16.5px;line-height:1.75;min-height:12em}
textarea[disabled],input[disabled],select[disabled]{opacity:.75;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:9px;border:1px solid var(--rule);background:var(--surface);
  padding:.55rem .95rem;font-weight:700;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--tealInk)}
.btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:transparent;color:#07131f}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.quiet{background:none}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--tealInk);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:2px}
.link.danger{color:var(--stop)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.nav{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}

.cl{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.cl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:.4rem;font-size:14px;line-height:1.4}
.cl .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.cl li.ok .mk{background:var(--goBg);color:var(--go)}
.cl li.no .mk{background:var(--surface2);color:var(--muted)}
.cl li.ok span{color:var(--ink)} .cl li.no span{color:var(--muted)}

.moment{border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:12px;padding:.9rem 1rem;background:var(--surface);display:grid;gap:.7rem}
.moment > header{display:flex;justify-content:space-between;align-items:center}
.empty{border:1.5px dashed var(--rule);border-radius:12px;padding:1.2rem;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.05rem;margin-bottom:.2rem}
.hint-p{font-size:14px;background:var(--goldSoft);border-radius:9px;padding:.6rem .7rem}
.hint-p b{color:var(--goldInk)}

.q-block{display:grid;gap:.45rem}
.q-block .ql{display:grid;grid-template-columns:30px minmax(0,1fr);gap:.4rem;font-weight:600;font-size:15px;line-height:1.45}
.q-block .qn{font-family:var(--mono);color:var(--goldInk);font-size:13px;padding-top:.1rem}
.q-block .opt{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:.3rem}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:12.5px;color:var(--muted)}
.nudge{font-size:14px;background:var(--surface2);border-radius:9px;padding:.6rem .75rem;border-left:3px solid var(--teal)}

.tnote{border-radius:12px;padding:.85rem 1rem;background:var(--goBg);border:1px solid color-mix(in srgb,var(--go) 30%,transparent)}
.tnote.more{background:var(--warnBg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tnote .label{color:inherit}
.tnote p{margin-top:.25rem;white-space:pre-wrap}
.banner{border-radius:12px;padding:.85rem 1rem;background:var(--surface2);border:1px solid var(--rule)}
.banner.lock{background:var(--goldSoft);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.banner.back{background:var(--warnBg)}
.banner b{display:block}

.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
@media (max-width:700px){.kinds{grid-template-columns:1fr}}
.kind{border-radius:12px;background:var(--surface2);padding:.75rem;display:grid;gap:.4rem}
.kind .label{color:var(--goldInk)}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:.7rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--rule)}
.sortrow:first-child{border-top:0}
@media (max-width:640px){.sortrow{grid-template-columns:1fr}}
.sortrow .w{font-family:var(--read);font-style:italic}
.sortrow .t{font-size:13px;color:var(--muted)}
details.model{border:1px solid var(--rule);border-radius:10px;padding:.2rem .85rem;background:var(--surface2)}
details.model summary{cursor:pointer;font-weight:700;font-size:14px;padding:.5rem 0}
details.model .m{font-family:var(--read);font-size:15.5px;padding:.4rem 0 .6rem}
details.model ul{margin:.2rem 0 .8rem;padding-left:1.1rem;font-size:14px}

.techhelp{font-size:13.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:.55rem .7rem}
.techhelp b{color:var(--ink)}

.para .ph{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.wc{font-family:var(--mono);font-size:12.5px;padding:.15rem .5rem;border-radius:99px;background:var(--surface2);color:var(--muted)}
.wc.ok{background:var(--goBg);color:var(--go)} .wc.over{background:var(--warnBg);color:var(--warn)}
.pgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:1100px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.peek{background:var(--surface2);border-radius:10px;padding:.75rem .8rem;font-size:13.5px}
.peek dl{margin:.35rem 0 0;display:grid;gap:.35rem}
.peek dt{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.peek dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ticks{display:grid;gap:.35rem;margin-top:.7rem}
.tick{display:flex;gap:.55rem;align-items:flex-start;font-size:14px;font-weight:400}
.tick input{width:18px;height:18px;margin-top:.15rem;accent-color:var(--go);flex:none}
.cc{margin-top:.8rem;border-radius:12px;border:1px solid var(--rule);padding:.8rem .9rem;background:var(--surface2);font-size:14px}
.cc h4{margin:0 0 .3rem;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tealInk)}
.cc ul{margin:.2rem 0 .5rem;padding-left:1.1rem}
.cc .found{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem}
.chip{font-size:12px;border-radius:99px;padding:.15rem .55rem;background:var(--surface);border:1px solid var(--rule)}
.chip.ok{background:var(--goBg);color:var(--go);border-color:transparent}
.essay{font-family:var(--read);font-size:16.5px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.essay p + p{margin-top:.9rem}

/* ================= the coach ================= */
.coach{position:sticky;top:76px;height:calc(100vh - 96px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.coach .ch{display:flex;justify-content:space-between;gap:.5rem;padding:.85rem 1rem;background:var(--navy);color:#fff}
.coach .ch h2{font-size:1.05rem;color:#fff}
.coach .ch p{font-size:12.5px;color:#A9BCCB;line-height:1.4;margin-top:.15rem}
.coach .x{display:none;background:none;border:0;color:#fff;font-size:1.6rem;line-height:1}
.clog{flex:1;overflow-y:auto;padding:.9rem;display:flex;flex-direction:column;gap:.6rem}
.bub{max-width:92%;padding:.6rem .8rem;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.c{background:var(--surface2);align-self:flex-start;border-top-left-radius:4px}
.bub.s{background:var(--navy);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.bub.think{color:var(--muted);font-style:italic}
.divider{align-self:center;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;padding:0 .9rem .6rem}
.chips button{font-size:12.5px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:.3rem .65rem;color:var(--ink);text-align:left}
.chips button:hover{border-color:var(--tealInk)}
.cform{display:flex;gap:.5rem;padding:.7rem .9rem;border-top:1px solid var(--rule);align-items:flex-end}
.cform textarea{min-height:2.6em;max-height:9em;font-size:14.5px}
.cnote{font-size:12.5px;color:var(--stop);padding:0 .9rem .6rem;min-height:0}
.coach-off{padding:1rem;color:var(--muted);font-size:14px}
.fab{display:none}
@media (max-width:1199px){
  .coach{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(78vh,640px);border-radius:16px 16px 0 0;z-index:60;
    transform:translateY(105%);transition:transform .25s ease;margin:0 auto;max-width:720px;padding-bottom:env(safe-area-inset-bottom,0px)}
  .coach.open{transform:none}

/* The casuarinas on Garnet Road, under the moon. Drawn, not a picture; the same every time. */
function drawTrees(){
  const c = $("#trees"); if (!c) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext("2d"); x.scale(dpr, dpr); x.clearRect(0, 0, w, h);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const moon = x.createRadialGradient(w * .8, h * .3, 2, w * .8, h * .3, 46);
  moon.addColorStop(0, "rgba(239,194,75,.95)"); moon.addColorStop(.42, "rgba(239,194,75,.85)"); moon.addColorStop(.46, "rgba(239,194,75,.18)"); moon.addColorStop(1, "rgba(239,194,75,0)");
  x.fillStyle = moon; x.beginPath(); x.arc(w * .8, h * .3, 46, 0, Math.PI * 2); x.fill();
  x.fillStyle = "rgba(4,11,19,.9)"; x.fillRect(0, h - 10, w, 10);
  const n = Math.max(5, Math.round(w / 95));
  for (let i = 0; i < n; i++) {
    const tx = (i + .5) * (w / n) + (rnd() - .5) * 40, top = h * (.05 + rnd() * .3), lean = (rnd() - .5) * 10;
    const tone = i % 2 ? "rgba(26,52,74,.95)" : "rgba(14,32,48,.98)";
    x.strokeStyle = tone; x.lineWidth = 2.2;
    x.beginPath(); x.moveTo(tx, h); x.lineTo(tx + lean, top); x.stroke();
    x.lineWidth = .8;
    for (let k = 0; k < 90; k++) {
      const t = rnd(), y = top + (h - top) * t * .78, px = tx + lean * (1 - t * .78), dir = rnd() < .5 ? -1 : 1;
      const len = 8 + rnd() * 30 * (1 - t * .5);
      x.beginPath(); x.moveTo(px, y);
      x.quadraticCurveTo(px + dir * len * .55, y - 3, px + dir * len, y + len * .6); x.stroke();
    }
  }
}

async function signIn(role, code, btn){
  const err = $("#gateErr");
  code = String(code || "").trim();
  if (!code) { err.textContent = role === "teacher" ? "Type your teacher code." : "Type the code your teacher gave you."; return; }
  btn.disabled = true; err.textContent = "";
  const was = btn.textContent; btn.textContent = "Opening…";
  try {
    const j = await api("essay.signin", {code, role});
    S.token = j.token; lsSet(TKEY, j.token);
    takeSession(j);
  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = was;
  }
}

function takeSession(j){
  S.me = j.me; S.cls = j.cls || {}; S.coachOn = !!j.coachOn;
  if (S.me.role === "student") {
    S.work = normWork(j.work); S.review = obj(j.review); S.locked = !!j.locked; S.coach = Array.isArray(j.coach) ? j.coach : [];
    S.stage = lsGet("rrb.englishb.stage." + S.me.id) || firstOpenStage();
    if (!SI.hasOwnProperty(S.stage)) S.stage = "find";
    S.seq = 0; S.savedSeq = 0; S.save = "saved";
  } else {
    S.students = Array.isArray(j.students) ? j.students : [];
  }
  render();
}

async function resume(){
  if (!S.token || !API) { showGate(API ? "" : "The workshop is not connected yet. It opens once its script is deployed."); return; }
  document.getElementById("app").innerHTML = `<div class="gate"><div class="gatebox"><div class="mark"><img src="../logo-mark.png" alt="Ricky Rampersad Branch"></div><p class="sub">Opening…</p></div></div>`;
  try { takeSession(await api("essay.load", {token: S.token})); }
  catch (e) { if (e.signin) { lsDel(TKEY); S.token = ""; } showGate(e.message); }
}

async function signOut(){
  if (S.me && S.me.role === "student") await flushSave();
  lsDel(TKEY); Object.assign(S, {token: "", me: null, work: null, review: null, students: [], coach: []});
  S.t = {open: null, tab: "find", flash: null, renaming: null, logs: {}, guides: {}, busy: {}, gerr: {}, ferr: {}, guideView: null};
  showGate("");
}

/* ============================ the student's notebook ============================ */
function blankWork(){
  return {v:1, moments:[], why:{}, groups:[{name:""},{name:""},{name:""}], momentGroup:{}, message:"", thesis:"", thesisTicks:{},
    plan:{intro:{hook:"", context:""}, b:[0,1,2].map(() => ({point:"", evidence:"", technique:"", effect:"", link:""})), concl:{restate:"", sowhat:""}},
    draft:{intro:"", b1:"", b2:"", b3:"", concl:""}, ticks:{}, checks:{}, rubric:{}, reflect:{strong:"", change:""},
    hints:0, nudges:{}, pastes:[], startedAt:new Date().toISOString(), submittedAt:null, handins:[]};
}
function normWork(d){
  d = (d && typeof d === "object") ? d : {};
  const w = blankWork(), p = obj(d.plan);
  w.moments = Array.isArray(d.moments) ? d.moments.filter(m => m && typeof m === "object").map(m => ({
    id: String(m.id || uid()), who: String(m.who || ""), trigger: String(m.trigger || ""), words: String(m.words || ""), where: String(m.where || "")})) : [];
  w.why = obj(d.why);
  w.groups = [0, 1, 2].map(i => ({name: String((Array.isArray(d.groups) && d.groups[i] && d.groups[i].name) || "")}));
  w.momentGroup = obj(d.momentGroup);
  w.message = String(d.message || ""); w.thesis = String(d.thesis || ""); w.thesisTicks = obj(d.thesisTicks);
  w.plan = {intro: Object.assign({hook:"", context:""}, obj(p.intro)),
            b: [0, 1, 2].map(i => Object.assign({point:"", evidence:"", technique:"", effect:"", link:""}, obj((p.b || [])[i]))),
            concl: Object.assign({restate:"", sowhat:""}, obj(p.concl))};
  w.draft = Object.assign({intro:"", b1:"", b2:"", b3:"", concl:""}, obj(d.draft));
  w.ticks = obj(d.ticks); w.checks = obj(d.checks); w.rubric = obj(d.rubric);
  w.reflect = Object.assign({strong:"", change:""}, obj(d.reflect));
  w.hints = Number(d.hints) || 0; w.nudges = obj(d.nudges);
  w.pastes = Array.isArray(d.pastes) ? d.pastes.slice(-50) : [];
  if (d.startedAt) w.startedAt = d.startedAt;
  w.submittedAt = d.submittedAt || null; w.handins = Array.isArray(d.handins) ? d.handins : [];
  return w;
}

/* Saved a second and a half after the last change, one save at a time; a change made while
   a save is on its way goes in the next one. */
function touch(){
  if (S.locked) return;
  S.seq++; S.save = "unsaved"; paintSave();
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(runSave, 1500);
}
async function runSave(){
  if (S.saving || S.seq === S.savedSeq || !S.work) return;
  S.saving = true; const seq = S.seq; S.save = "saving"; paintSave();
  try {
    await api("essay.save", {token: S.token, work: S.work});
    S.savedSeq = seq; S.save = S.seq === seq ? "saved" : "unsaved";
  } catch (e) {
    S.save = "error";
    if (e.locked) { S.locked = true; S.savedSeq = S.seq; render(); toast(e.message); }
    else if (e.signin) { toast(e.message); setTimeout(signOut, 1500); }
    else toast("Not saved yet: " + e.message + " It will try again.");
  }
  S.saving = false; paintSave();
  if (S.seq !== S.savedSeq && S.save !== "error") { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(runSave, 600); }
  else if (S.save === "error") { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(runSave, 8000); }
}
async function flushSave(){
  clearTimeout(S.saveTimer);
  for (let i = 0; i < 40 && S.saving; i++) await new Promise(r => setTimeout(r, 150));
  if (S.seq !== S.savedSeq) await runSave();
}
function paintSave(){
  const el = $(".sync"); if (!el) return;
  const t = {unsaved:"Not saved yet", saving:"Saving…", saved:"Saved", error:"Not saved"}[S.save] || "";
  el.textContent = S.locked ? "Handed in" : t;
  el.classList.toggle("bad", S.save === "error" && !S.locked);
}

/* ---- what each stage asks for: [done?, words, share done] ---- */
function thesisChecks(t){
  const n = wc(t);
  return [[/blood\s*brothers/i.test(t), "It names the story"],
          [/wickham/i.test(t), "It names the writer"],
          [/fear|afraid|frighten|terror|scared|dread/i.test(t), "It is about fear"],
          [/\b(shows?|suggests?|reveals?|presents?|explores?|demonstrates?|uses?|portrays?|illustrates?|highlights?|argues?)\b/i.test(t),
           "It argues something (shows, suggests, reveals…), not just a fact"],
          [n >= 20 && n <= 60, `It is one or two sentences, 20 to 60 words (${n} now)`]];
}
const STAGE_CHECKS = {
  find(w){
    const m = w.moments, n = m.length;
    return [[n >= 6, `Six or more moments logged (${n} so far)`, Math.min(1, n / 6)],
            [m.some(x => x.who && x.who !== "Paul"), "At least one moment for someone other than Paul"],
            [n > 0 && m.every(x => wc(x.words) >= 2), "Every moment has Wickham’s exact words"],
            [n > 0 && m.every(x => wc(x.trigger) >= 2), "Every moment says what sets the fear off"]];
  },
  why(w){
    const core = WHY.filter(q => !q.optional), n = core.filter(q => wc(w.why[q.k]) >= 12).length;
    return [[n === core.length, `Every main question answered in a sentence or two (${n} of ${core.length})`, n / core.length],
            [WHY.some(q => hasQuote(w.why[q.k])), "At least one answer points to Wickham’s own words"]];
  },
  idea(w){
    const named = w.groups.filter(g => wc(g.name) >= 1).length;
    const used = [0, 1, 2].filter(i => w.moments.some(m => w.momentGroup[m.id] === String(i + 1))).length;
    return [[named === 3, `Three kinds of fear named (${named} of 3)`, named / 3],
            [used === 3, "Every kind has at least one moment in it", used / 3],
            [wc(w.message) >= 8, "You have said what Wickham is saying about fear"],
            [thesisChecks(w.thesis).every(c => c[0]) && !!w.thesisTicks.three, "Your thesis passes every check"]];
  },
  plan(w){
    const f = [w.plan.intro.hook, w.plan.intro.context, ...w.plan.b.flatMap(b => [b.point, b.evidence, b.technique, b.effect, b.link]),
               w.plan.concl.restate, w.plan.concl.sowhat];
    const n = f.filter(x => String(x || "").trim().length > 1).length;
    return [[n === f.length, `Every part of the plan has notes (${n} of ${f.length})`, n / f.length],
            [w.plan.b.every(b => b.technique), "A technique chosen for each body paragraph"],
            [w.plan.b.every(b => hasQuote(b.evidence)), "Each piece of evidence is in quotation marks"]];
  },
  write(w){
    const done = PARAS.filter(p => wc(w.draft[p.k]) >= p.min).length;
    const share = PARAS.reduce((a, p) => a + Math.min(1, wc(w.draft[p.k]) / p.min), 0) / PARAS.length;
    return [[done === PARAS.length, `All five paragraphs reach their length (${done} of 5)`, share],
            [PARAS.filter(p => p.kind === "body").every(p => hasQuote(w.draft[p.k])), "Every body paragraph quotes Wickham"]];
  },
  hand(w, locked){
    const n = RUBRIC.filter(r => w.rubric[r[0]]).length;
    return [[n === RUBRIC.length, `Checked against the whole list (${n} of ${RUBRIC.length})`, n / RUBRIC.length],
            [!!w.submittedAt && !!locked, "Handed in"]];
  }
};
function progress(k, w, locked){
  if (k === "hand" && w.submittedAt && locked) return 1;
  const cs = STAGE_CHECKS[k](w, locked);
  return cs.reduce((a, c) => a + (c[0] ? 1 : (c[2] !== undefined ? c[2] : 0)), 0) / cs.length;
}
function firstOpenStage(){ for (const s of STAGES) if (progress(s.k, S.work, S.locked) < 1) return s.k; return "hand"; }
function checklist(cs){
  return `<ul class="cl">${cs.map(c => `<li class="${c[0] ? "ok" : "no"}"><span class="mk" aria-hidden="true">${c[0] ? "✓" : "○"}</span><span>${esc(c[1])}<span class="sr">${c[0] ? " (done)" : " (not yet)"}</span></span></li>`).join("")}</ul>`;
}

function stageIdea(){

function kindLabel(n){ const g = S.work.groups[n - 1]; return "Kind " + n + (g && g.name.trim() ? ": " + g.name.trim() : ""); }

function stagePlan(){

  const body = w.plan.b.map((b, i) => {

      <div data-live="tech:${i}"></div>
      <label class="f">Effect <span class="hint">What do the words make the reader feel or understand about fear?</span><textarea rows="2" data-bind="plan.b.${i}.effect"${dis()}>${val(`plan.b.${i}.effect`)}</textarea></label>
      <label class="f">Link <span class="hint">How does this connect back to your thesis?</span><textarea rows="2" data-bind="plan.b.${i}.link"${dis()}>${val(`plan.b.${i}.link`)}</textarea></label>
    </section>`;
  }).join("");
  return `<section class="card">
      <h2 class="h3">Introduction</h2>
      <label class="f">Hook <span class="hint">An opening thought about fear that makes a reader want to go on</span><textarea rows="2" data-bind="plan.intro.hook"${dis()}>${val("plan.intro.hook")}</textarea></label>

      <div><span class="label">Your thesis, from Stage 3</span>${thesis}</div>
    </section>${body}
    <section class="card">
      <h2 class="h3">Conclusion</h2>

function techHelp(i){

  return t ? `<div class="techhelp"><b>${esc(t.k)}:</b> ${esc(t.def)} For example, ${esc(t.eg)} <br><b>Ask yourself:</b> ${esc(t.ask)}</div>` : "";

function stageWrite(){
  const w = S.work;
  const peek = p => {
    let rows;
    if (p.kind === "intro") rows = [["Hook", w.plan.intro.hook], ["Context", w.plan.intro.context], ["Thesis", w.thesis]];

    else { const b = w.plan.b[p.i]; rows = [["Point", b.point], ["Evidence", b.evidence], ["Technique", b.technique], ["Effect", b.effect], ["Link", b.link]]; }
    return `<aside class="peek"><span class="label">Your plan</span><dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${r[1] && String(r[1]).trim() ? esc(r[1]) : '<span class="muted">Not planned yet</span>'}</dd>`).join("")}</dl></aside>`;
  };
  return `<p class="banner small">Write in your own words. Your teacher can see when large blocks of text are pasted in.</p>
    ${PARAS.map(p => `<section class="card para" id="p-${p.k}">

        <div data-live="check:${p.k}"></div>
      </div></div></section>`).join("")}
    <section class="card"><h2 class="h3">Checklist</h2><div data-live="checks:write"></div></section>`;
}
function checkHTML(k){
  const p = PARAS.find(x => x.k === k), c = S.work.checks[k], now = wc(S.work.draft[k]);
  let h = "";
  if (S.checking[k]) h = `<div class="cc"><h4>Your coach</h4><p class="muted">Reading your paragraph…</p></div>`;
  else if (c) {
    const found = CHECKS[p.kind].map(x => `<span class="chip${c.checks && c.checks[x[0]] ? " ok" : ""}">${c.checks && c.checks[x[0]] ? "✓ " : "○ "}${esc(x[1])}</span>`).join("");
    h = `<div class="cc"><h4>Your coach read it at ${c.words} words${now !== c.words ? ` (you have ${now} now)` : ""}</h4>
      ${c.strengths && c.strengths.length ? `<b>What works</b><ul>${c.strengths.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
      ${c.questions && c.questions.length ? `<b>Questions to think about</b><ul>${c.questions.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
      <b>What the coach found in it</b><div class="found">${found}</div></div>`;
  }
  if (S.checkErr[k]) h += `<p class="cnote" style="padding:.4rem 0 0">${esc(S.checkErr[k])}</p>`;
  if (S.coachOn && !S.locked && !S.checking[k]) {
    h += `<p style="margin-top:.6rem"><button class="btn" data-act="check" data-p="${k}"${now < 25 ? " disabled" : ""}>${c ? "Ask the coach again" : "Ask the coach about this paragraph"}</button>
      ${now < 25 ? `<span class="small muted"> Write at least 25 words first.</span>` : ""}</p>`;
  }
  return h;
}

function stageHand(){
  const w = S.work;
  return `<section class="card"><h2 class="h3">Read it all once more</h2><div data-live="essay"></div></section>
    <section class="card"><h2 class="h3">Check it against the list</h2>
      <div class="ticks">${RUBRIC.map(r => `<label class="tick"><input type="checkbox" data-bind="rubric.${r[0]}"${w.rubric[r[0]] ? " checked" : ""}${dis()}> ${esc(r[1])}</label>`).join("")}</div></section>
    <section class="card"><h2 class="h3">Two last questions</h2>
      <label class="f">What is the strongest sentence in your essay, and why?<textarea rows="3" data-bind="reflect.strong"${dis()}>${val("reflect.strong")}</textarea></label>
      <label class="f">If you had one more hour, what would you change?<textarea rows="3" data-bind="reflect.change"${dis()}>${val("reflect.change")}</textarea></label></section>

}
function essayHTML(){
  const w = S.work, total = PARAS.reduce((a, p) => a + wc(w.draft[p.k]), 0);
  const paras = PARAS.map(p => w.draft[p.k].trim() ? `<p>${esc(w.draft[p.k].trim())}</p>` : `<p class="muted" style="font-family:var(--sans);font-size:14px">(${esc(p.title)} not written yet)</p>`).join("");

function handinHTML(){

  const missing = PARAS.filter(p => wc(w.draft[p.k]) < 25).map(p => p.title);

}

/* ---- the parts of the page that change as she types ---- */
const LIVE = {
  rail(k){ return null; },
  checks(k){ return checklist(STAGE_CHECKS[k](S.work, S.locked)); },
  words(p){ const n = wc(getPath(S.work, p)); return n ? n + " words" : ""; },
  wc(k){
    const p = PARAS.find(x => x.k === k), n = wc(S.work.draft[k]);
    const cls = n > p.max ? "over" : (n >= p.min ? "ok" : "");
    return `<span class="wc ${cls}">${n} words · aim for ${p.min}–${p.max}</span>`;
  },
  thesis(){ return checklist(thesisChecks(S.work.thesis)); },
  tech(i){ return techHelp(Number(i)); },
  check(k){ return checkHTML(k); },
  essay(){ return essayHTML(); },
  handin(){ return handinHTML(); },
  tnote(k){
    const r = S.review || {}, note = (r.notes || {})[k], st = (r.status || {})[k];
    if (!note && !st) return "";
    return `<div class="tnote${st === "more" ? " more" : ""}"><span class="label">${st === "ok" ? "✓ Your teacher: ready to move on" : (st === "more" ? "↺ Your teacher: think about this again" : "A note from your teacher")}</span>
      ${note ? `<p>${esc(note)}</p>` : ""}</div>`;
  }
};
function refreshLive(){
  if (!S.work) return;
  document.querySelectorAll("[data-live]").forEach(el => {
    const [kind, arg] = el.dataset.live.split(":");
    if (kind === "rail") {
      const pr = progress(arg, S.work, S.locked), bar = el.querySelector(".bar i");
      if (bar) bar.style.width = Math.round(pr * 100) + "%";
      el.classList.toggle("done", pr >= 1);
      return;
    }
    const fn = LIVE[kind]; if (!fn) return;
    const html = fn(arg);
    if (el.__h !== html) { el.innerHTML = html; el.__h = html; }
  });
  document.querySelectorAll("select[data-kinds] option[data-kind]").forEach(o => { const t = kindLabel(Number(o.dataset.kind)); if (o.textContent !== t) o.textContent = t; });
}

function go(k){
  if (!SI.hasOwnProperty(k)) return;
  S.stage = k; lsSet("rrb.englishb.stage." + S.me.id, k);
  $("#page").innerHTML = stageHTML();
  $(".rail").innerHTML = railHTML();

function coachHTML(){

    : `<p class="coach-off">The coach is switched off for now. Every stage still has its own questions, hints and checklist.</p>`}

function renderCoachLog(){
  const log = $("#clog"); if (!log) return;
  let last = "", html = "";
  if (!S.coach.length) html = `<div class="bub c">I’m here to ask you questions, not to give you answers. Tell me what you’re working on, or tap one of the questions below.</div>`;
  S.coach.slice(-60).forEach(t => {
    if (t.stage && t.stage !== last && SI.hasOwnProperty(t.stage)) { html += `<div class="divider">${esc(STAGES[SI[t.stage]].title)}</div>`; last = t.stage; }
    html += `<div class="bub ${t.who === "coach" ? "c" : "s"}">${esc(t.text)}</div>`;
  });
  if (S.coachBusy) html += `<div class="bub c think">Thinking about that…</div>`;
  log.innerHTML = html; log.scrollTop = log.scrollHeight;
  renderChips();
}
function renderChips(){
  const c = $("#chips"); if (!c) return;
  c.innerHTML = (STARTERS[S.stage] || []).map(s => `<button type="button" data-chip="${esc(s)}">${esc(s)}</button>`).join("");
}
async function askCoach(text){
  text = String(text || "").trim();
  if (!text || S.coachBusy) return;
  const note = $("#cnote"), input = $("#cin"), send = $("#csend");
  if (note) note.textContent = "";
  S.coachBusy = true; if (send) send.disabled = true;
  S.coach.push({who: "student", text, stage: S.stage, at: new Date().toISOString()});
  if (input) input.value = "";
  renderCoachLog();
  try {
    await flushSave();
    const j = await api("essay.coach", {token: S.token, stage: S.stage, message: text});
    S.coach.push({who: "coach", text: j.reply, stage: S.stage, at: j.at});
  } catch (e) {
    S.coach.pop();
    if (input && !input.value) input.value = text;
    if (note) note.textContent = e.message;
  }
  S.coachBusy = false; if (send) send.disabled = false;
  renderCoachLog();
}
async function checkPara(k){
  S.checking[k] = true; S.checkErr[k] = ""; refreshLive();
  try {
    await flushSave();
    const j = await api("essay.check", {token: S.token, para: k});
    S.work.checks[k] = j.check;
  } catch (e) { S.checkErr[k] = e.message; if (e.locked) { S.locked = true; } }
  S.checking[k] = false; refreshLive();
}
async function handIn(){
  if (!S.handArmed || Date.now() - S.handArmed > 6000) { S.handArmed = Date.now(); refreshLive(); return; }
  S.handArmed = 0;
  clearTimeout(S.saveTimer);
  try {
    const j = await api("essay.handin", {token: S.token, work: S.work});
    S.work.submittedAt = j.submittedAt; S.work.handins = (S.work.handins || []).concat([j.submittedAt]);
    S.locked = true; S.savedSeq = S.seq; S.save = "saved";
    render(); toast("Handed in. Your teacher can read it now.");
  } catch (e) { toast(e.message); if (e.locked) { S.locked = true; render(); } else refreshLive(); }
}

function statusOf(s){

  const locked = !!w.submittedAt && !(r.returnedAt && r.returnedAt > w.submittedAt);
  if (locked) return ["in", "Handed in " + when(w.submittedAt)];
  if (w.submittedAt) return ["back", "Returned to work on"];
  const nw = normWork(w);
  for (const st of STAGES) if (progress(st.k, nw, false) < 1) return ["work", "Working on: " + st.title];
  return ["work", "Ready to hand in"];
}

function guideInner(k){
  const g = S.t.guides[k], busy = S.t.busy["g:" + k], err = S.t.gerr[k], isEssay = k === "essay";
  let h = `<p class="forme">For you only · students never see this</p><h2 class="h3">${isEssay ? "A model essay" : `Answers for “${esc(STAGES[SI[k]].title)}”`}</h2>`;
  if (busy) return h + `<p class="muted">${isEssay ? "Writing the whole essay." : "Writing the answers for this stage."} The first time takes up to a minute.</p>`;
  if (err) h += `<p class="cnote" style="padding:0">${esc(err)}</p>`;

function roCoach(s){

    case "t-return": {
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Press again to return it"; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ""; t.textContent = "Return it to work on"; } }, 5000); return; }
      return api("essay.return", {token: S.token, id, note: ($("#retNote") || {}).value || ""}).then(() => { toast("Returned. They can work on it again."); return reloadTeacher(); }).catch(err => toast(err.message));
    }
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S.work && S.seq !== S.savedSeq) runSave(); });
window.addEventListener("resize", () => { if ($("#trees")) drawTrees(); });
/* The teacher's class refreshes itself every three minutes while nobody is typing in it. */
setInterval(() => {
  if (!S.me || S.me.role !== "teacher" || document.visibilityState !== "visible") return;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (!S.t.open && !S.t.renaming) reloadTeacher();
}, 180000);

resume();
</script>
