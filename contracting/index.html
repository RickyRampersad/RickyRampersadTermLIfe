<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Contracting | Ricky Rampersad Private</title>
<meta name="description" content="Complete your agent contracting in one place — the application, beneficiary designation and W-8BEN, filled onto the official forms and ready to sign and send." />
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2040%2040%27%3E%3Crect%20width%3D%2740%27%20height%3D%2740%27%20rx%3D%2711%27%20fill%3D%27%2314395F%27%2F%3E%3Cpath%20d%3D%27M11.5%208.5h8.9l6.1%206.1V28a2%202%200%200%201-2%202H11.5a2%202%200%200%201-2-2V10.5a2%202%200%200%201%202-2z%27%20fill%3D%27%23ffffff%27%2F%3E%3Cpath%20d%3D%27M12.8%2025.7c2-2.7%203.2%201%204.9-1%201.5-1.8%202.2%202.2%205.5-1.8%27%20stroke%3D%27%23F2B33D%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20fill%3D%27none%27%2F%3E%3Ccircle%20cx%3D%2727.8%27%20cy%3D%2727.8%27%20r%3D%275.6%27%20fill%3D%27%23F2B33D%27%2F%3E%3C%2Fsvg%3E" />
<style>
  :root{
    --navy-900:#0E2A47; --navy-800:#14395F; --navy-700:#1C4E80;
    --teal-600:#0E8C8C; --teal-500:#12A5A0; --teal-50:#E9F7F6;
    --gold:#F2B33D; --gold-ink:#5C3D00;
    --ink:#152435; --muted:#5B7186; --bg:#F4F8FB; --white:#fff;
    --line:#D7E3EE;
    --red:#D64545; --red-50:#FCEDED;
    --green:#2F9E62; --green-50:#EAF7F0;
    --radius-lg:22px; --radius-md:14px; --radius-sm:10px;
    --shadow:0 16px 40px rgba(14,42,71,.12);
    --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--teal-600)}
  .wrap{width:min(940px,94%);margin-inline:auto}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:60;background:rgba(244,248,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(20,57,95,.09)}
  .nav{display:flex;align-items:center;gap:14px;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.98rem;color:var(--navy-900);text-decoration:none;margin-right:auto}
  .logo-badge{width:36px;height:36px;border-radius:11px;flex:none;overflow:hidden}
  .logo small{display:block;font-size:.7rem;font-weight:600;color:var(--muted)}
  .langtoggle{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
  .langtoggle button{border:none;background:none;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
  .langtoggle button[aria-pressed="true"]{background:var(--navy-800);color:#fff}
  .savechip{font-size:.75rem;font-weight:700;color:var(--teal-600);background:var(--teal-50);border:1px solid #CBEAE8;padding:5px 11px;border-radius:999px;opacity:0;transition:opacity .3s}
  .savechip.show{opacity:1}
  @media(max-width:620px){.savechip{display:none}}

  .progressbar{height:5px;background:#E3EBF3}
  .progressbar span{display:block;height:100%;width:0;transition:width .5s cubic-bezier(.2,.7,.3,1);
    background:linear-gradient(90deg,var(--teal-500),var(--gold),var(--teal-500));background-size:200% 100%;
    animation:sheen 3.5s linear infinite}

  /* ---------- layout ---------- */
  main{padding:26px 0 120px}
  .stepnav{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin-bottom:18px;scrollbar-width:thin}
  .stepnav button{flex:none;transition:transform .15s,border-color .15s;border:1px solid var(--line);background:#fff;color:var(--muted);font:inherit;font-size:.78rem;font-weight:700;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .stepnav button:hover{transform:translateY(-1px);border-color:#B9CEE2}
  .stepnav button[aria-current="true"]{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
  .stepnav button .tick{color:var(--green);font-size:.9rem;line-height:1}
  .stepnav button[aria-current="true"] .tick{color:#8BE6B4}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:26px;
        animation:riseIn .45s cubic-bezier(.2,.7,.3,1) both}
  @media(max-width:620px){.card{padding:20px 16px;border-radius:var(--radius-md)}}
  .card h1{font-size:clamp(1.35rem,3.4vw,1.75rem);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .card .lead{color:var(--muted);margin-top:8px;font-size:.95rem}
  .stepcount{font-size:.75rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-600);margin-bottom:8px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  .f{grid-column:span 2;display:flex;flex-direction:column;gap:6px;min-width:0}
  .f.w1{grid-column:span 1}
  .f.w4{grid-column:span 4}
  @media(max-width:760px){.f,.f.w4{grid-column:span 2}.f.w1{grid-column:span 1}}
  .f > .lbl{font-size:.8rem;font-weight:700;color:var(--navy-900);display:flex;gap:5px;align-items:baseline}
  .f > .lbl em{color:var(--red);font-style:normal}
  .f .hint{font-size:.75rem;color:var(--muted)}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{
    width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(18,165,160,.15)}
  textarea{resize:vertical;min-height:88px}
  input.missing,select.missing,textarea.missing{border-color:#F0C9C9;background:#FFFCFC}

  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg label{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s}
  .seg label:hover{border-color:#B9CEE2}
  .seg input{position:absolute;opacity:0;width:0;height:0}
  .seg label:has(input:checked){background:var(--navy-800);border-color:var(--navy-800);color:#fff}
  .seg.yn label:has(input[value="yes"]:checked){background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

  .checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:700px){.checks{grid-template-columns:1fr}}
  .checks label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:11px 13px;font-size:.87rem;cursor:pointer;line-height:1.4}
  .checks label:has(input:checked){border-color:var(--teal-500);background:var(--teal-50)}
  .checks input{margin-top:2px;width:17px;height:17px;accent-color:var(--teal-600);flex:none}

  .subhead{grid-column:1/-1;font-size:.74rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-600);
           border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
  .subhead:first-child{border-top:none;padding-top:0;margin-top:0}
  .note{grid-column:1/-1;background:var(--teal-50);border:1px solid #CBEAE8;border-radius:var(--radius-sm);padding:12px 14px;font-size:.85rem;color:#0B5F5F}
  .warn{grid-column:1/-1;background:#FFF8E8;border:1px solid #F3DDA6;border-radius:var(--radius-sm);padding:12px 14px;font-size:.85rem;color:#6B4E12}
  .warn.bad{background:var(--red-50);border-color:#F0C9C9;color:#8F2F2F}

  .helper{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
  .helper button{border:1px dashed var(--line);background:#fff;color:var(--navy-700);font:inherit;font-size:.78rem;font-weight:700;
                 padding:7px 13px;border-radius:999px;cursor:pointer}
  .helper button:hover{border-color:var(--teal-500);color:var(--teal-600)}

  /* ---------- signature ---------- */
  .sigwrap{grid-column:1/-1}
  .sigpad{border:2px dashed var(--line);border-radius:var(--radius-md);background:#fff;position:relative;touch-action:none;overflow:hidden}
  .sigpad canvas{display:block;width:100%;height:190px;cursor:crosshair}
  .sigpad .baseline{position:absolute;left:24px;right:24px;bottom:44px;border-bottom:1.5px solid #E1E9F1;pointer-events:none}
  .sigpad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9FB2C4;font-size:.9rem;font-weight:600;pointer-events:none}
  .sigpad.has .ph{display:none}
  .sigactions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

  /* ---------- uploads ---------- */
  .drop{grid-column:1/-1;border:2px dashed var(--line);border-radius:var(--radius-md);padding:20px;text-align:center;background:#fff}
  .drop input{display:none}
  .filelist{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
  .fileitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;font-size:.86rem;background:#fff}
  .fileitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fileitem .sz{color:var(--muted);font-size:.78rem;flex:none}
  .fileitem button{border:none;background:none;color:var(--red);font:inherit;font-weight:700;cursor:pointer;font-size:.8rem;flex:none}

  /* ---------- review ---------- */
  .doclist{display:grid;gap:12px;margin-top:20px}
  .doc{border:1px solid var(--line);border-radius:var(--radius-md);padding:15px 16px;background:#fff;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .doc .ic{width:38px;height:38px;border-radius:10px;background:var(--teal-50);color:var(--teal-600);display:grid;place-items:center;font-weight:800;font-size:.72rem;flex:none}
  .doc .meta{flex:1;min-width:150px}
  .doc .meta b{display:block;font-size:.93rem}
  .doc .meta span{font-size:.78rem;color:var(--muted)}
  .missinglist{margin-top:16px;display:grid;gap:7px}
  .missinglist button{text-align:left;border:1px solid #F0C9C9;background:var(--red-50);color:#8F2F2F;border-radius:var(--radius-sm);
                      padding:10px 13px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .previewbox{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:#fff;display:none}
  .previewbox.show{display:block}
  .previewbox iframe{width:100%;height:min(72vh,760px);border:none;display:block;background:#eef3f8}
  .previewtabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .previewtabs button{border:1px solid var(--line);background:#fff;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);
                      padding:6px 12px;border-radius:999px;cursor:pointer}
  .previewtabs button[aria-pressed="true"]{background:var(--navy-800);border-color:var(--navy-800);color:#fff}

  /* ---------- buttons / footer ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-weight:700;border-radius:999px;
       padding:13px 24px;border:none;cursor:pointer;font-size:.95rem;text-decoration:none;transition:transform .15s,box-shadow .15s}
  .btn:hover:not(:disabled){transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--navy-800);color:#fff;box-shadow:0 10px 22px rgba(20,57,95,.28)}
  .btn-teal{background:var(--teal-500);color:#fff;box-shadow:0 10px 22px rgba(18,165,160,.3)}
  .btn-gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 10px 22px rgba(242,179,61,.32)}
  .btn-ghost{background:#fff;color:var(--navy-900);border:1.5px solid var(--line);box-shadow:none}
  .btn-sm{padding:9px 16px;font-size:.83rem}

  .footbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
           border-top:1px solid var(--line);padding:12px 0;box-shadow:0 -8px 26px rgba(14,42,71,.07)}
  .footbar .inner{display:flex;align-items:center;gap:12px}
  .footbar .pct{margin-right:auto;font-size:.82rem;font-weight:700;color:var(--muted)}
  .footbar .pct b{color:var(--navy-900)}
  @media(max-width:560px){.footbar .pct{font-size:.75rem}.btn{padding:12px 18px;font-size:.9rem}}

  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);z-index:90;background:var(--navy-900);color:#fff;
         padding:12px 20px;border-radius:999px;font-size:.87rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.bad{background:var(--red)}

  /* ---------- sign in & carrier choice ---------- */
  #gate{min-height:calc(100vh - 67px);display:grid;place-items:center;padding:34px 0 60px}
  #gate .wrap{width:min(560px,94%)}
  .gatecard{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:38px 34px}
  @media(max-width:560px){.gatecard{padding:28px 20px}}
  .gatecard .crest{width:60px;height:60px;border-radius:18px;margin:0 auto 18px;
                   
                   display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem}
  .gatecard h1{font-size:clamp(1.45rem,4vw,1.95rem);font-weight:800;letter-spacing:-.02em;line-height:1.18;text-align:center}
  .gatecard .sub{color:var(--muted);font-size:.96rem;text-align:center;margin-top:10px}
  .signform{margin-top:26px;display:grid;gap:14px}
  .signform label{display:block;font-size:.78rem;font-weight:700;margin-bottom:6px}
  .signform input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font:inherit;
                  font-size:1.1rem;font-weight:700;letter-spacing:.12em;text-align:center;text-transform:uppercase}
  .signform input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(18,165,160,.15)}
  .signerr{color:var(--red);font-size:.85rem;font-weight:600;min-height:20px;text-align:center}
  .gatefoot{text-align:center;font-size:.85rem;color:var(--muted);margin-top:20px;line-height:1.6}
  .gatefoot a{color:var(--teal-600)}
  .tagline{text-align:center;margin-top:8px;font-size:.9rem;font-weight:800;letter-spacing:.02em;
           background:linear-gradient(90deg,var(--teal-600),var(--gold));-webkit-background-clip:text;
           background-clip:text;color:transparent}
  .orline{display:flex;align-items:center;gap:12px;margin:20px 0 14px;color:var(--muted);font-size:.78rem;
          font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
  .signform input.plain{font-size:.98rem;font-weight:500;letter-spacing:normal;text-align:left;text-transform:none}
  .linkbtn{border:none;background:none;font:inherit;font-size:.85rem;font-weight:700;color:var(--teal-600);cursor:pointer;padding:0}
  .tick{width:56px;height:56px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
        background:var(--teal-50);color:var(--teal-600);font-size:1.6rem;font-weight:800;
        box-shadow:0 0 0 6px rgba(18,165,160,.12)}
  .creds{background:var(--teal-50);border:1px solid #CBEAE8;border-radius:16px;padding:20px;margin:22px 0 18px}
  .creds .pair{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
  .creds .pair + .pair{border-top:1px solid rgba(14,140,140,.14)}
  .creds .k{font-size:.78rem;font-weight:700;color:var(--muted)}
  .creds .v{font-size:1.35rem;font-weight:800;letter-spacing:.14em;color:var(--navy-900)}

  .whoami{display:flex;align-items:center;gap:11px;background:var(--teal-50);border:1px solid #CBEAE8;
          border-radius:14px;padding:13px 16px;margin-bottom:22px}
  .whoami .av{width:38px;height:38px;border-radius:50%;background:var(--navy-800);color:#fff;
              display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:none}
  .whoami b{display:block;font-size:.93rem}
  .whoami span{font-size:.78rem;color:var(--muted)}
  .whoami button{margin-left:auto;border:none;background:none;font:inherit;font-size:.8rem;font-weight:700;
                 color:var(--teal-600);cursor:pointer}

  .picker{display:grid;gap:12px;margin-top:20px}
  .pickgroup{font-size:.7rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
             margin-top:8px;display:flex;align-items:center;gap:10px}
  .pickgroup:first-child{margin-top:0}
  .pickgroup::after{content:"";flex:1;height:1px;background:var(--line)}
  .pick{display:flex;align-items:center;gap:15px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
        border-radius:16px;padding:18px;font:inherit;cursor:pointer;transition:.16s;text-decoration:none;color:inherit}
  .pick:hover{border-color:var(--teal-500);transform:translateY(-2px);box-shadow:0 10px 24px rgba(14,42,71,.09)}
  .pick .mark{width:48px;height:48px;border-radius:13px;flex:none;display:grid;place-items:center;
              background:var(--teal-50);color:var(--teal-600);font-weight:800;font-size:.82rem;letter-spacing:.04em}
  .pick .txt{flex:1;min-width:0}
  .pick .txt b{display:block;font-size:1.02rem;font-weight:700}
  .pick .txt span{font-size:.84rem;color:var(--muted)}
  .pick .arrow{color:var(--teal-600);font-weight:800;flex:none}
  .pick:disabled,.pick.soon{cursor:default;opacity:.62;background:#FAFCFE}
  .pick:disabled:hover,.pick.soon:hover{transform:none;border-color:var(--line);box-shadow:none}
  .pick .pctchip{font-size:.74rem;font-weight:800;background:var(--teal-50);color:var(--teal-600);
                  padding:5px 10px;border-radius:999px;flex:none}
  .pick .soonchip{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
                  background:#EEF3F8;color:var(--muted);padding:5px 10px;border-radius:999px;flex:none}

  .full{width:100%}
  .center{text-align:center}
  .hero-start{text-align:center;padding:8px 0 4px}
  .hero-start .badge{display:inline-flex;align-items:center;gap:8px;background:var(--teal-50);border:1px solid #CBEAE8;color:var(--teal-600);
                     font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:999px;margin-bottom:14px}
  .packlist{display:grid;gap:10px;margin:20px 0;text-align:left}
  .packlist div{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:#fff;font-size:.89rem}
  .packlist b{display:block}
  .packlist span{color:var(--muted);font-size:.82rem}
  .num{width:26px;height:26px;border-radius:50%;background:var(--navy-800);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:800;flex:none}
  .noscript{padding:60px 20px;text-align:center;color:var(--muted)}

  .logo-badge .mark-svg,.crest .mark-svg{width:100%;height:100%;display:block}

  /* ---------- motion ---------- */
  /* A slow drift behind the sign-in so the page is never quite still. */
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .aurora::before{width:60vw;height:60vw;left:-18vw;top:-22vw;background:radial-gradient(circle,#12A5A0 0%,transparent 70%);
                  animation:drift1 26s ease-in-out infinite}
  .aurora::after{width:52vw;height:52vw;right:-16vw;bottom:-24vw;background:radial-gradient(circle,#F2B33D 0%,transparent 70%);
                 opacity:.32;animation:drift2 32s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vw,6vw) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vw,-5vw) scale(1.1)}}

  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .rise{animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both}
  .rise-1{animation-delay:.05s}.rise-2{animation-delay:.12s}.rise-3{animation-delay:.19s}
  .rise-4{animation-delay:.26s}.rise-5{animation-delay:.33s}

  /* The progress bar keeps a slow sheen moving over it while work is open. */
  @keyframes sheen{from{background-position:0 0}to{background-position:200% 0}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
                         transition-duration:.001ms!important}
    .aurora{display:none}
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header>
  <div class="wrap nav">
    <a class="logo" href="../index.html">
      <span class="logo-badge"><svg class="mark-svg" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="mka" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E2A47"/><stop offset="55%" stop-color="#14395F"/><stop offset="100%" stop-color="#0E8C8C"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#mka)"/><path d="M11.5 8.5h8.9l6.1 6.1V28a2 2 0 0 1-2 2H11.5a2 2 0 0 1-2-2V10.5a2 2 0 0 1 2-2z" fill="#fff"/><path d="M20.4 8.5 26.5 14.6h-6.1z" fill="#AFCEDE"/><rect x="12.8" y="17" width="8" height="1.4" rx=".7" fill="#A3BACC"/><rect x="12.8" y="20" width="10.6" height="1.4" rx=".7" fill="#A3BACC"/><path d="M12.8 25.7c2-2.7 3.2 1 4.9-1 1.5-1.8 2.2 2.2 5.5-1.8" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"/><circle cx="27.8" cy="27.8" r="5.6" fill="#F2B33D"/><path d="m25.4 27.9 1.8 1.8 3.3-3.6" stroke="#5C3D00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Rampersad Private<small data-t="brandSub">Every contract, seen through.</small></span>
    </a>
    <span class="savechip" id="savechip" data-t="saved">Saved</span>
    <div class="langtoggle" role="group" aria-label="Language">
      <button type="button" id="lang-es" aria-pressed="false">ES</button>
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
    </div>
  </div>
  <div class="progressbar"><span id="progressfill"></span></div>
</header>

<!-- SIGN IN — the first thing anyone sees -->
<div id="gate">
  <div class="wrap">

    <div class="gatecard rise" id="signincard">
      <div class="crest"><svg class="mark-svg" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="mka" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E2A47"/><stop offset="55%" stop-color="#14395F"/><stop offset="100%" stop-color="#0E8C8C"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#mka)"/><path d="M11.5 8.5h8.9l6.1 6.1V28a2 2 0 0 1-2 2H11.5a2 2 0 0 1-2-2V10.5a2 2 0 0 1 2-2z" fill="#fff"/><path d="M20.4 8.5 26.5 14.6h-6.1z" fill="#AFCEDE"/><rect x="12.8" y="17" width="8" height="1.4" rx=".7" fill="#A3BACC"/><rect x="12.8" y="20" width="10.6" height="1.4" rx=".7" fill="#A3BACC"/><path d="M12.8 25.7c2-2.7 3.2 1 4.9-1 1.5-1.8 2.2 2.2 5.5-1.8" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"/><circle cx="27.8" cy="27.8" r="5.6" fill="#F2B33D"/><path d="m25.4 27.9 1.8 1.8 3.3-3.6" stroke="#5C3D00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 data-t="welcomeTitle">Welcome to Contracting</h1>
      <p class="tagline" data-t="tagline">Sign once. Start selling.</p>
      <p class="sub" data-t="welcomeSub">Sign in with the agent number and passcode you were given.</p>
      <form class="signform" id="signform" autocomplete="off">
        <div>
          <label for="agentno" data-t="agentNo">Agent number</label>
          <input id="agentno" placeholder="RRB-000" autocapitalize="characters" spellcheck="false" />
        </div>
        <div>
          <label for="passcode" data-t="passcode">Passcode</label>
          <input id="passcode" type="password" placeholder="••••••" autocomplete="current-password" />
        </div>
        <div class="signerr" id="signerr"></div>
        <button class="btn btn-primary full" id="signbtn" type="submit" data-t="signIn">Sign in</button>
      </form>
      <div class="orline"><span data-t="orNew">or</span></div>
      <button class="btn btn-ghost full" id="newhere" type="button" data-t="newHere">I'm new here — get my agent number</button>
      <p class="gatefoot" id="signfoot"></p>
    </div>

    <!-- new agent signing themselves up -->
    <div class="gatecard rise" id="joincard" style="display:none">
      <div class="crest"><svg class="mark-svg" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="mka" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E2A47"/><stop offset="55%" stop-color="#14395F"/><stop offset="100%" stop-color="#0E8C8C"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#mka)"/><path d="M11.5 8.5h8.9l6.1 6.1V28a2 2 0 0 1-2 2H11.5a2 2 0 0 1-2-2V10.5a2 2 0 0 1 2-2z" fill="#fff"/><path d="M20.4 8.5 26.5 14.6h-6.1z" fill="#AFCEDE"/><rect x="12.8" y="17" width="8" height="1.4" rx=".7" fill="#A3BACC"/><rect x="12.8" y="20" width="10.6" height="1.4" rx=".7" fill="#A3BACC"/><path d="M12.8 25.7c2-2.7 3.2 1 4.9-1 1.5-1.8 2.2 2.2 5.5-1.8" stroke="#F2B33D" stroke-width="2" stroke-linecap="round"/><circle cx="27.8" cy="27.8" r="5.6" fill="#F2B33D"/><path d="m25.4 27.9 1.8 1.8 3.3-3.6" stroke="#5C3D00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1 data-t="joinTitle">Let's get you a number</h1>
      <p class="sub" data-t="joinSub">Three details and your agent number is yours in seconds.</p>
      <form class="signform" id="joinform" autocomplete="on">
        <div>
          <label for="joinname" data-t="fullName">Full name</label>
          <input id="joinname" class="plain" autocomplete="name" placeholder="Akash Maharaj" />
        </div>
        <div>
          <label for="joinemail" data-t="email">Email</label>
          <input id="joinemail" class="plain" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div>
          <label for="joinmobile" data-t="mobile">Mobile</label>
          <input id="joinmobile" class="plain" type="tel" autocomplete="tel" placeholder="+1 868 000 0000" />
        </div>
        <div class="signerr" id="joinerr"></div>
        <button class="btn btn-primary full" id="joinbtn" type="submit" data-t="getNumber">Get my agent number</button>
      </form>
      <p class="gatefoot"><button class="linkbtn" id="backtosignin" type="button" data-t="haveNumber">I already have a number</button></p>
    </div>

    <!-- the number and passcode we just issued -->
    <div class="gatecard rise" id="issuedcard" style="display:none">
      <div class="tick">✓</div>
      <h1 id="issuedtitle"></h1>
      <p class="sub" id="issuedsub"></p>
      <div class="creds" id="creds"></div>
      <button class="btn btn-primary full" id="issuedgo" type="button"></button>
      <p class="gatefoot" id="issuedfoot"></p>
    </div>

    <div class="gatecard" id="choosecard" style="display:none">
      <div class="whoami" id="whoami"></div>
      <h1 id="choosetitle"></h1>
      <p class="sub" id="choosesub"></p>
      <div class="picker" id="picker"></div>
      <p class="gatefoot" id="choosefoot"></p>
    </div>

  </div>
</div>

<main id="wizard" style="display:none">
  <div class="wrap">
    <nav class="stepnav" id="stepnav" aria-label="Steps"></nav>
    <div class="card" id="card"><div class="noscript">Loading…</div></div>
  </div>
</main>

<div class="footbar" id="footbar" style="display:none">
  <div class="wrap inner">
    <span class="pct" id="pctlabel"></span>
    <button class="btn btn-ghost" id="backbtn" type="button">←</button>
    <button class="btn btn-primary" id="nextbtn" type="button">Continue</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/pdf-lib.min.js"></script>
<script src="packet.js"></script>
<script src="app.js"></script>
</body>
</html>
