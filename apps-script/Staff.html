/* Colours of the pipeline, each always beside its word. */
const PC = { instructed:'#138A82', overdue:'#B5352A', due14:'#C98A00', due30:'#3A7BD5', up:'#8FB3E0', nodate:'#AAB6C8', done:'#0F7A55' };

function toast(m, tone){ RR.toast(m, tone||'ok'); }
function fail(e){ toast((e&&e.message)?e.message:String(e), 'bad'); }

function statusOf(r){
  if(/RENEWED/i.test(r.renewalStatus)||r.renewedDate) return {k:'done',label:'Renewed',cls:'ok',c:PC.done,ord:5};
  if(/—/.test(r.renewalStatus)) return {k:'instructed',label:'Client instructed',cls:'teal',c:PC.instructed,ord:0};
  if(r.days===null||r.days===undefined||r.days==='') return {k:'nodate',label:'No date',cls:'grey',c:PC.nodate,ord:6};
  if(r.days<0) return {k:'overdue',label:'Overdue '+Math.abs(r.days)+'d',cls:'bad',c:PC.overdue,ord:1};
  if(r.days<=7) return {k:'due7',label:'Due in '+r.days+'d',cls:'warn',c:PC.due14,ord:2};
  if(r.days<=14) return {k:'due14',label:'Due in '+r.days+'d',cls:'warn',c:PC.due14,ord:3};
  if(r.days<=30) return {k:'due30',label:'Due in '+r.days+'d',cls:'',c:PC.due30,ord:4};
  return {k:'up',label:'Upcoming',cls:'grey',c:PC.up,ord:6};
}
/* Days to renewal, in words, with a meter that fills as the date comes closer. */
function daysCell(r, st){
  const d=r.days;
  let txt, w, hot=false;
  if(st.k==='done'){ txt='Renewed'+(r.renewedDate?' '+r.renewedDate:''); w=100; }
  else if(d===null||d===undefined||d===''){ txt='No date'; w=0; }
  else if(d<0){ txt=Math.abs(d)+' day'+(d===-1?'':'s')+' overdue'; w=100; hot=true; }
  else if(d===0){ txt='Due today'; w=100; hot=true; }
  else { txt='in '+d+' day'+(d===1?'':'s'); w=Math.max(6,Math.round((30-Math.min(d,30))/30*100)); }
  return `<div class="dd"><b>${esc(r.nextDue||'No date')}</b><span class="${hot?'hot':''}">${esc(txt)}</span></div>
    <div class="dm" aria-hidden="true"><i style="--w:${w}%;--c:${st.c}"></i></div>`;
}
function stars(n){ n=Math.max(0,Math.min(5,Math.round(Number(n)||0))); let s=''; for(let i=1;i<=5;i++) s+=`<span class="${i<=n?'on':''}">${I('star')}</span>`; return `<span class="stars" role="img" aria-label="${n} of 5">${s}</span>`; }
function sec(icon, title, sub, c, end){ return `<div class="rr-sec"${c?` style="--c:${c[0]};--c2:${c[1]}"`:''}><span class="ic">${I(icon)}</span><div><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div>${end?`<span class="end">${end}</span>`:''}</div>`; }

function filtered(){
  let rows = D.renewals.map(r=>({...r, st:statusOf(r)}));
  if(FILTER==='action') rows = rows.filter(r=>['instructed','overdue','due7','due14'].includes(r.st.k));
  else if(FILTER==='instructed') rows = rows.filter(r=>r.st.k==='instructed');
  else if(FILTER==='overdue') rows = rows.filter(r=>r.st.k==='overdue');
  else if(FILTER==='due14') rows = rows.filter(r=>['due7','due14'].includes(r.st.k));
  else if(FILTER==='due30') rows = rows.filter(r=>r.st.k==='due30');
  else if(FILTER==='up') rows = rows.filter(r=>r.st.k==='up');
  else if(FILTER==='nodate') rows = rows.filter(r=>r.st.k==='nodate');
  else if(FILTER==='renewed') rows = rows.filter(r=>r.st.k==='done');
  if(PIPE.month) rows = rows.filter(r=>monthOf(r.nextDue)===PIPE.month);
  if(PIPE.cov) rows = rows.filter(r=>r.coverage===PIPE.cov);
  if(PIPE.who==='unassigned') rows = rows.filter(r=>!(r.assignedTo||'').trim());
  else if(PIPE.who) rows = rows.filter(r=>(r.assignedTo||'').toLowerCase()===PIPE.who);
  if(Q) rows = rows.filter(r=>(r.client+' '+r.policy+' '+r.coverage+' '+r.assignedTo).toLowerCase().includes(Q));
  rows.sort((a,b)=>a.st.ord-b.st.ord || (a.days??999)-(b.days??999));
  return rows;
}
function filteredProps(){
  let ps = D.properties||[];
  if(PIPE.month) ps = ps.filter(p=>monthOf(p.renewalDate)===PIPE.month);
  if(PIPE.who==='unassigned') ps = ps.filter(p=>!(p.assignedTo||'').trim());
  else if(PIPE.who) ps = ps.filter(p=>(p.assignedTo||'').toLowerCase()===PIPE.who);
  if(PIPE.cov && PIPE.cov!=='__prop') return [];   // a motor coverage is selected: the property list empties
  if(Q) ps = ps.filter(p=>(p.client+' '+p.policy+' '+(p.assignedTo||'')).toLowerCase().includes(Q));
  return ps;
}
const FLABEL = { action:'Needs action', all:'All renewals', instructed:'Client instructed', overdue:'Overdue', due14:'Due in 14 days', due30:'Due in 15 to 30 days', up:'Upcoming', nodate:'No date', renewed:'Renewed' };

/* ---------- charts ---------- */
function monthData(){
  const rows=D.renewals.map(r=>({...r,st:statusOf(r)})), props=D.properties||[];
  const mon={}; MONTHS.forEach(m=>mon[m]={total:0,done:0});
  rows.forEach(r=>{const m=monthOf(r.nextDue); if(m){mon[m].total++; if(r.st.k==='done')mon[m].done++;}});
  props.forEach(p=>{const m=monthOf(p.renewalDate); if(m){mon[m].total++; if(p.stage==='issued')mon[m].done++;}});
  return mon;
}
function monthChart(H){
  const mon=monthData(), mmax=Math.max(...MONTHS.map(m=>mon[m].total),1), now=MONTHS[new Date().getMonth()];
  return `<div class="mch" style="--H:${H}px" role="list" aria-label="Renewals by month, motor and property">${MONTHS.map((m,k)=>{const d=mon[m], open=d.total-d.done;
    const ho=open?Math.max(3,Math.round(open/mmax*H)):0, hd=d.done?Math.max(3,Math.round(d.done/mmax*H)):0;
    return `<button type="button" role="listitem" class="mc${m===now?' now':''}${m===PIPE.month?' sel':''}" data-m="${m}" aria-pressed="${m===PIPE.month}" aria-label="${m}: ${d.total} renewal${d.total===1?'':'s'}, ${d.done} renewed, ${open} open" title="${m}: ${d.total} renewal${d.total===1?'':'s'}, ${d.done} renewed, ${open} open">
      <b>${d.total||''}</b><span class="st">${open?`<i class="o" style="--h:${ho}px;animation-delay:${k*.04}s"></i>`:''}${d.done?`<i class="d" style="--h:${hd}px;animation-delay:${k*.04+.1}s"></i>`:''}</span><small>${m}</small></button>`;}).join('')}</div>
    <ul class="mkey"><li style="--c:${PC.done}">Renewed</li><li style="--c:${PC.due30}">Open</li></ul>`;
}
function pipeStack(rows){
  const n=k=>rows.filter(r=>r.st.k===k).length;
  const parts=[
    {f:'instructed',l:'Client instructed',v:n('instructed'),c:PC.instructed},
    {f:'overdue',l:'Overdue',v:n('overdue'),c:PC.overdue},
    {f:'due14',l:'Due in 14 days',v:n('due7')+n('due14'),c:PC.due14},
    {f:'due30',l:'Due in 15 to 30 days',v:n('due30'),c:PC.due30},
    {f:'up',l:'Upcoming',v:n('up'),c:PC.up},
    {f:'nodate',l:'No date',v:n('nodate'),c:PC.nodate},
    {f:'renewed',l:'Renewed',v:n('done'),c:PC.done},
  ];
  const total=parts.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="rr-stack st-stack" aria-hidden="true">${parts.filter(p=>p.v).map((p,k)=>`<i style="--w:${(p.v/total*100).toFixed(2)}%;--c:${p.c};animation-delay:${k*.1}s"></i>`).join('')}</div>
    <ul class="pk-row">${parts.map(p=>`<li><button type="button" class="pk${FILTER===p.f?' on':''}" data-f="${p.f}" style="--c:${p.c}" aria-pressed="${FILTER===p.f}">${esc(p.l)} <b>${p.v}</b></button></li>`).join('')}</ul>`;
}

/* ---------- this month and next ----------
   Every motor and property renewal whose date falls in this calendar month or the next, read from its days to go
   (so the year is right), each tappable to open the file. */
function mmMonths(){
  const now=new Date(), a=new Date(now.getFullYear(),now.getMonth(),1), b=new Date(now.getFullYear(),now.getMonth()+1,1);
  return [{y:a.getFullYear(),m:a.getMonth(),key:'this',label:'This month'},{y:b.getFullYear(),m:b.getMonth(),key:'next',label:'Next month'}];
}
function mmDateOf(days){
  if(days===null||days===undefined||days===''||isNaN(Number(days))) return null;
  const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+Number(days)); return d;
}
function mmItems(){
  const out=[];
  D.renewals.forEach(r=>{ const d=mmDateOf(r.days); if(d) out.push({kind:'motor',d,client:r.client,sub:(r.policy||'no policy #')+' · '+String(r.coverage||'Motor').replace(' (assumed)',''),st:statusOf(r),row:r.rowIndex,who:r.assignedTo}); });
  (D.properties||[]).forEach(pp=>{ const d=mmDateOf(pp.days); if(!d) return; const st=propStatus(pp);
    out.push({kind:'prop',d,client:pp.client,sub:'Property · '+(pp.policy||'no policy #'),st:{k:pp.stage==='issued'?'done':(pp.days<0?'overdue':'open'),label:st.label,cls:st.cls,c:st.c},tok:pp.token,who:pp.assignedTo}); });
  return out;
}
function mmView(){
  const all=mmItems(), mons=mmMonths();
  const cols=mons.map((M,k)=>{
    const its=all.filter(x=>x.d.getFullYear()===M.y&&x.d.getMonth()===M.m).sort((a,b)=>(a.st.k==='done')-(b.st.k==='done')||a.d-b.d);
    const done=its.filter(x=>x.st.k==='done').length, over=its.filter(x=>x.st.k==='overdue').length, open=its.length-done-over;
    const mName=MONTHS[M.m], full=new Date(M.y,M.m,1).toLocaleString('en-GB',{month:'long',year:'numeric'});
    const nm=its.filter(x=>x.kind==='motor').length, np=its.length-nm;
    const SHOW=12, shown=its.slice(0,SHOW);
    return `<div class="mm-col${k===0?' now':''}" aria-label="${esc(M.label)}, ${esc(full)}">
      <div class="mm-h"><b>${esc(full)}</b><small>${esc(M.label)}</small></div>
      <div class="mm-n">${RR.cu(its.length)}</div>
      <p class="mm-sub">renewal${its.length===1?'':'s'}${its.length?` · ${nm} motor${np?`, ${np} property`:''} · <b>${done}</b> renewed${over?`, <b style="color:var(--bad)">${over}</b> overdue`:''}, ${open} open`:''}</p>
      ${its.length?RR.stack([{l:'Renewed',v:done,c:PC.done},{l:'Overdue',v:over,c:PC.overdue},{l:'Open',v:open,c:PC.due30}].filter(p=>p.v)):''}
      ${its.length?`<ul class="mm-list">${shown.map(x=>`<li><button type="button" class="mm-r" style="--c:${x.st.c}" ${x.kind==='motor'?`data-mmrow="${x.row}"`:`data-mmprop="${esc(x.tok)}"`} aria-label="${esc(x.client)}, renews ${x.d.getDate()} ${mName}, ${esc(x.st.label)}">
          <span class="mm-d" aria-hidden="true">${x.d.getDate()}<small>${mName}</small></span>
          <span class="mm-w"><b>${esc(x.client)}</b><small>${esc(x.sub)}${x.who?' · '+esc(who(x.who)):' · unassigned'}</small></span>
          <span class="rr-pill ${x.st.cls}">${esc(x.st.label)}</span></button></li>`).join('')}</ul>
        ${its.length>SHOW?`<button type="button" class="rr-btn ghost sm mm-more" data-mmall="${mName}">Show all ${its.length} in ${esc(full.split(' ')[0])} ${I('arrow')}</button>`:''}`

function downloadProduction(){
  toast('Preparing the download…');
  google.script.run
    .withSuccessHandler(r=>{
      /* A real workbook, not a CSV of one: the report is recognised by the
         green banner, the shaded unit lines and the standout figures, so it has
         to arrive looking like the report it is. */
      const blob=new Blob([r.xml],{type:'application/vnd.ms-excel'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=r.filename;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
      toast('Downloaded: logged under your name');
    })
    .withFailureHandler(fail)
    .productionWorkbook(BOOT.key, ME, PIN);
}

function money0(v){ const n=Number(v); return isNaN(n)?'—':'TT$'+n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function reportView(){
  const rows=D.renewals.map(r=>({...r,st:statusOf(r)}));
  const props=D.properties||[];
  // money
  const bookPrem=rows.reduce((s,r)=>s+(Number(r.premium)||0),0)+props.reduce((s,p)=>s+(Number(p.premium)||0),0);
  const renewedPrem=rows.filter(r=>r.st.k==='done').reduce((s,r)=>s+(Number(r.premium)||0),0);
  const riskPrem=rows.filter(r=>r.st.k==='overdue').reduce((s,r)=>s+(Number(r.premium)||0),0);
  // the funnel
  const invited=rows.filter(r=>(r.remindersSent||'').trim()).length;
  const instructed=rows.filter(r=>r.st.k==='instructed').length;
  const renewed=rows.filter(r=>r.st.k==='done').length;
  const fmax=Math.max(invited,instructed+renewed,renewed,1);

  const conv=invited?Math.round(renewed/invited*100):null;
  // team workload
  const team=[...D.staff.map(s=>({email:s.email,name:s.name})),{email:'',name:'Unassigned'}];
  const wl=team.map(t=>{
    const mine=r=>String(r.assignedTo||'').toLowerCase()===t.email;
    const mineP=p=>String(p.assignedTo||'').toLowerCase()===t.email;
    return { name:t.name, email:t.email,
      files:rows.filter(r=>mine(r)&&r.st.k!=='done').length,
      instructed:rows.filter(r=>mine(r)&&r.st.k==='instructed').length,
      overdue:rows.filter(r=>mine(r)&&r.st.k==='overdue').length,
      prop:props.filter(p=>mineP(p)&&p.stage!=='issued').length,
      tasks:D.tasks.filter(x=>x.status==='Open'&&String(x.assignee||'').toLowerCase()===t.email).length,
      queries:(D.queries||[]).filter(q=>q.status==='Open'&&q.of===t.email).length,
      renewed:rows.filter(r=>mine(r)&&r.st.k==='done').length };
  }).filter(t=>t.files||t.instructed||t.overdue||t.prop||t.tasks||t.queries||t.renewed||t.email==='');
  // the follow-up radar
  const today=new Date();
  const days=s=>{const d=new Date(s); return isNaN(d.getTime())?null:Math.round((today-d)/86400000);};
  const fu=[];
  rows.forEach(r=>{

    else if(['due7','due14'].includes(r.st.k)){const lt=D.lastTouch[r.token];const dd=lt?days(lt.when):null;
      if(dd===null||dd>7) fu.push({r,why:'Due '+r.days+'d: '+(dd===null?'never touched':'no touch in '+dd+'d'),ord:2,age:dd??99});}
  });
  fu.sort((a,b)=>a.ord-b.ord||b.age-a.age);
  const pill=(v,cls)=>v?`<span class="rr-pill ${cls}">${v}</span>`:'0';
  const sv=D.surveys;
  return `<section class="rr-card flat">${sec('money','The book','Premium across motor and property')}
      <div class="rr-tiles">
        ${RR.tile('Book premium',money0(bookPrem),{icon:'money',sub:'Motor and property'})}
        ${RR.tile('Renewed premium',money0(renewedPrem),{icon:'checkc',tone:'ok',sub:'Files marked renewed'})}

function auditView(){
  const feed=D.feed||[];
  const people=[...new Set(feed.map(a=>a.by))].sort();
  const types=[...new Set(feed.map(a=>a.type.replace(/^TEST:/,'')))].sort();
  const rows=feed.filter(a=>{
    if(AUDIT.by && a.by!==AUDIT.by) return false;
    if(AUDIT.type && a.type.replace(/^TEST:/,'')!==AUDIT.type) return false;
    if(AUDIT.q && !(a.client+' '+a.details+' '+a.by+' '+a.type).toLowerCase().includes(AUDIT.q)) return false;
    return true;
  });
  const qOpen=(D.queries||[]).filter(q=>q.status==='Open');
  const qDone=(D.queries||[]).filter(q=>q.status!=='Open');
  const byType={}; rows.forEach(a=>{ const t=a.type.replace(/^TEST:/,''); byType[t]=(byType[t]||0)+1; });
  const top=Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).slice(0,6);
  const tcls=t=>/query/.test(t)?'warn':/login/.test(t)?'grey':/instruction|renewed|survey/.test(t)?'ok':'';
  return `<section class="rr-card flat">${sec('search','Audit trail','Showing '+rows.length+' of '+feed.length+' actions',['#1B2A44','#3A4A66'])}
    <div class="st-tools"><div class="r2">
      <label class="srch" style="grid-column:1/-1"><span class="vh">Filter</span>${I('search')}<input class="rr-in" type="search" id="audQ" placeholder="Filter by client, policy, detail…" value="${esc(AUDIT.q)}"></label>
      <label><span class="vh">Who</span><select class="rr-in" id="audBy"><option value="">Everyone</option>${people.map(p=>`<option ${p===AUDIT.by?'selected':''} value="${esc(p)}">${esc(who(p))}</option>`).join('')}</select></label>
      <label><span class="vh">Action</span><select class="rr-in" id="audType"><option value="">All actions</option>${types.map(t=>`<option ${t===AUDIT.type?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
    </div></div>
    ${top.length?`<p class="gl-h">${I('chart')} What was done, in these ${rows.length} actions</p>${RR.bars(top.map(t=>({l:t,v:byType[t]})))}`:''}
    <div class="scroll-y"><table class="rr-table"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Client</th><th>Details</th></tr></thead>
    <tbody>${rows.slice(0,200).map(a=>{ const t=a.type.replace(/^TEST:/,''); return `<tr><td data-l="When" class="muted" style="white-space:nowrap">${esc(a.when)}</td><td data-l="Who"><b>${esc(who(a.by))}</b></td><td data-l="Action"><span class="rr-pill ${tcls(a.type)}">${esc(t)}</span></td><td data-l="Client">${esc(a.client)}</td><td data-l="Details" class="muted">${esc(a.details.slice(0,140))}</td></tr>`;}).join('')
      ||`<tr><td colspan="5" class="muted">No action matches these filters.</td></tr>`}</tbody></table></div>
  </section>
  <section class="rr-card flat">${sec('chat','Queries','Open '+qOpen.length+' · answered '+qDone.length,['#C98A00','#E0A82E'])}
    ${[...qOpen,...qDone].slice(0,30).map(q=>`<div class="tk ${q.status==='Open'?'over':''}" style="${q.status==='Open'?'--c:#C98A00':'--c:var(--ok)'}"><span class="ti">${I(q.status==='Open'?'chat':'checkc')}</span><div class="tx">
      <b>${esc(q.client||'General')}</b>: ${esc(q.question)} <span class="rr-pill ${q.status==='Open'?'warn':'ok'}">${esc(q.status)}</span>
      <small>${esc(who(q.by))} asked ${esc(who(q.of))} · ${esc(q.created)}${q.answer?` · “${esc(q.answer.slice(0,140))}” (${esc(who(q.answeredBy))}, ${esc(q.answered)})`:''}</small>
    </div></div>`).join('')||`<p class="muted">No queries yet.</p>`}
  </section>`;
}

const PSC=['#9470CF','#7A4FB8','#4F44C2','#3A7BD5','#138A82','#0F7A55'];
function propStatus(pp){
  const stages=D.propStages||[];
  const i=stages.findIndex(x=>x.key===pp.stage);
  if(pp.stage==='issued') return {label:'Issued',cls:'ok',c:PC.done};
  if(i>=0) return {label:stages[i].label,cls:'violet',c:'#7A4FB8'};
  if(pp.days!==null&&pp.days!==undefined&&pp.days<0) return {label:'Overdue '+Math.abs(pp.days)+'d',cls:'bad',c:PC.overdue};
  if(pp.days!==null&&pp.days!==undefined&&pp.days<=14) return {label:'Due in '+pp.days+'d',cls:'warn',c:PC.due14};
  return {label:pp.status?pp.status.slice(0,18):'Not invited',cls:'grey',c:PC.nodate};
}

/* ---------- the drawer ---------- */
function openDr(){ $('#ov').classList.add('open'); $('#dr').classList.add('open'); $('#dr').scrollTop=0; const x=$('#dX'); if(x){ x.onclick=closeDr; setTimeout(()=>x.focus(),60); } }
function ringDays(days, done){
  if(done) return RR.ring(100,'Done','',{c:'var(--ok)',label:'Renewed'});
  if(days===null||days===undefined||days==='') return RR.ring(0,'—','no date',{label:'No renewal date'});
  if(days<0) return RR.ring(100,Math.abs(days),'late',{c:'var(--bad)',label:Math.abs(days)+' days overdue'});
  return RR.ring(Math.max(4,Math.round((30-Math.min(days,30))/30*100)),days,'to go',{c:days<=14?'#C98A00':'var(--blue)',label:days+' days to renewal'});
}

  const lk=$('#dLink'); if(lk) lk.onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast('Portal link copied'); }catch(e){ prompt('Copy the link:', link); } };
  $('#dAssign').onchange=e=>act('assign',{rowIndex:r.rowIndex,token:r.token,client:r.client,assignee:e.target.value},'Assigned');
  $('#dTaskAdd').onclick=()=>{ const t=$('#dTaskT').value.trim(); if(!t) return; closeDr(); act('addTask',{title:t,assignee:$('#dTaskA').value,due:$('#dTaskD').value,client:r.client,token:r.token},'Task created'); };
  $('#dComAdd').onclick=()=>{ const t=$('#dCom').value.trim(); if(!t) return; closeDr(); act('comment',{token:r.token,client:r.client,text:t},'Comment logged'); };
  $('#dAskGo').onclick=()=>{ const t=$('#dAskT').value.trim(); if(!t){ toast('Type the question first','bad'); return; } closeDr(); act('ask',{token:r.token,client:r.client,assignee:$('#dAskWho').value,text:t},'Query sent: it must be answered'); };
  document.querySelectorAll('[data-ddone]').forEach(b=>b.onclick=()=>{ closeDr(); act('completeTask',{id:b.dataset.ddone},'Task completed'); });
}
function closeDr(){ $('#ov').classList.remove('open'); $('#dr').classList.remove('open'); }
$('#ov').onclick=closeDr;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDr(); $('#modal').classList.remove('open'); } });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); });

function addRenewalModal(){
  $('#mw').innerHTML = `<div class="rr-band"><p class="eyebrow">New file</p><h2>Add a renewal</h2><p>A personal portal link is made for the client.</p></div>
    <label class="rr-f"><b>Client / account name *</b><input class="rr-in" type="text" id="aClient"></label>
    <label class="rr-f"><b>Contact person</b><input class="rr-in" type="text" id="aContact"></label>
    <div class="rr-row">
      <label class="rr-f"><b>Coverage *</b><select class="rr-in" id="aCov"><option>Third Party</option><option>Comprehensive</option><option>Third Party Fire & Theft</option></select></label>
      <label class="rr-f"><b>Renewal date *</b><input class="rr-in" type="date" id="aDue"></label>
    </div>
    <div class="rr-row">
      <label class="rr-f"><b>Premium (TT$)</b><input class="rr-in" type="text" id="aPrem" inputmode="numeric"></label>
      <label class="rr-f"><b>Sum insured (TT$)</b><input class="rr-in" type="text" id="aSum" inputmode="numeric"><small>Comprehensive only</small></label>
    </div>
    <label class="rr-f"><b>Policy #</b><input class="rr-in" type="text" id="aPol"></label>
    <div class="rr-row">
      <label class="rr-f"><b>Email</b><input class="rr-in" type="email" id="aEmail"></label>
      <label class="rr-f"><b>Mobile</b><input class="rr-in" type="text" id="aMob" inputmode="tel"></label>
    </div>
    <label class="rr-f"><b>Assign to</b><select class="rr-in" id="aAssign">${staffOpts(ME)}</select></label>
    <div class="row-b">
      <button class="rr-btn" id="aGo">${I('plus')} Add renewal</button>
      <button class="rr-btn ghost" id="aX">Cancel</button>
    </div>
    <p class="muted" style="margin-top:10px">A personal portal token and link are made automatically. The reminder automation picks the row up from the next daily run.</p>`;
  $('#modal').classList.add('open');
  RR.init($('#mw'));
  setTimeout(()=>{ const c=$('#aClient'); if(c) c.focus(); },50);
  $('#aX').onclick=()=>$('#modal').classList.remove('open');
  $('#aGo').onclick=()=>{
    const client=$('#aClient').value.trim(), due=$('#aDue').value;
    if(!client||!due){ toast('Client and renewal date are required','bad'); return; }
    $('#modal').classList.remove('open');
    act('addRenewal',{client:client,contact:$('#aContact').value,coverage:$('#aCov').value,nextDue:due,
      premium:$('#aPrem').value,sumInsured:$('#aSum').value,policy:$('#aPol').value,
      email:$('#aEmail').value,mobile:$('#aMob').value,assignee:$('#aAssign').value},'Renewal added for '+client);
  };
}
boot();
</script>
