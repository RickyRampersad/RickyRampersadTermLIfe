<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The room — Ricky Rampersad Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*  THE ROOM SCREEN — for the touchscreen on the branch wall.
 *
 *  Read from three metres, driven with a finger, never with a mouse.
 *  Three rules follow from that and nothing here breaks them:
 *
 *   1. NOTHING IS ON HOVER. A touchscreen has no hover state, so every
 *      figure a bar carries is printed on the bar. There is no tooltip
 *      anywhere in this file.
 *   2. NOTHING IS SMALLER THAN 20px, and nothing tappable is under
 *      64px. The tab rail is 96.
 *   3. NO STATUS IS COLOUR ALONE. Every one carries a glyph and a
 *      word, which is the house rule and also the only thing that
 *      works for the two men in the branch who cannot separate the
 *      green from the red.
 */
:root{
  --navy:#07131f; --panel:#0d2137; --panel2:#122b45; --line:rgba(255,255,255,.10);
  --ink:#edf4fb; --muted:#a9bbcf; --dim:#7a90a8;
  --gold:#efc24b; --gold2:#c9942c; --teal:#00CFEA;
  /*  Status, from the validated status palette. Contrast on this navy:
   *  good 5.19, late 9.49, serious 6.60, critical 3.62 — all clear of
   *  3:1, and every one of them is used at display sizes. */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  /*  The ordered ramp, for things that run low to high. One hue,
   *  light to dark, never a rainbow. */
  --r1:#62bfd2; --r2:#1d8fa6; --r3:#07606f;
  --display:'Montserrat',sans-serif; --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ink);font-family:var(--body);
  font-size:20px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 78% -10%,rgba(0,207,234,.09),transparent 60%),
             radial-gradient(900px 600px at 5% 110%,rgba(239,194,75,.07),transparent 60%)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}

/* ---------------- the band across the top ---------------- */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:22px;
  padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(7,19,31,.75)}
.mark{width:58px;height:58px;border-radius:14px;overflow:hidden;background:var(--navy);
  display:grid;place-items:center;flex:0 0 auto}
.mark img{width:100%;height:100%;display:block}
.ttl{flex:1 1 auto;min-width:0}
.ttl h1{font-size:30px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{color:var(--muted);font-size:17px;margin-top:2px}
.clock{font-family:var(--display);font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--gold);letter-spacing:.01em}
.stamp{color:var(--dim);font-size:14px;text-align:right;margin-top:2px}

/* ---------------- the tab rail ---------------- */
.rail{position:relative;z-index:2;display:flex;gap:10px;padding:12px 24px 0;
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);
  font-family:var(--display);font-size:21px;font-weight:700;cursor:pointer;
  min-height:96px;padding:0 26px;border-radius:16px 16px 0 0;position:relative;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;
  transition:background .18s ease,color .18s ease;white-space:nowrap}
.tab .n{font-size:15px;font-weight:500;font-family:var(--body);color:var(--dim)}
.tab:hover{background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel)}
.tab[aria-selected="true"] .n{color:var(--gold)}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:14px;right:14px;bottom:0;
  height:4px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.tab .dot{position:absolute;top:18px;right:14px;min-width:30px;height:30px;border-radius:15px;
  background:var(--crit);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;
  padding:0 8px;font-family:var(--body)}

/* ---------------- the stage ---------------- */
.stage{position:relative;z-index:1;height:calc(100vh - 170px);overflow:auto;padding:26px 28px 40px}
.panel{display:none}
.panel.on{display:block;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------------- the pieces ---------------- */
.hero{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;margin-bottom:24px}
.big{font-family:var(--display);font-weight:900;font-size:108px;line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big.gold{color:var(--gold)} .big.teal{color:var(--teal)}
.big .u{font-size:34px;font-weight:700;color:var(--muted);margin-left:8px}
.cap{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:700;margin-bottom:8px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:26px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.tile .v{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;margin:6px 0 4px}
.tile .l{color:var(--muted);font-size:17px}
.tile.alarm{border-color:rgba(208,59,59,.55);background:linear-gradient(180deg,rgba(208,59,59,.14),var(--panel))}
.tile.alarm .v{color:var(--crit)}

/*  A status is a tinted label with a glyph and a word. Never a colour
 *  on its own, and never a colour carrying a number by itself. */
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  padding:6px 16px;font-size:17px;font-weight:700;font-family:var(--body);
  border:1px solid currentColor}
.pill .g{font-size:18px;line-height:1}
.p-good{color:#6fe36f;background:rgba(12,163,12,.18)}
.p-late{color:#ffd166;background:rgba(250,178,25,.16)}
.p-exc {color:#bcd0e4;background:rgba(122,144,168,.18)}
.p-out {color:#ff8e80;background:rgba(208,59,59,.18)}

/* the register grid */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left-width:6px;
  border-radius:14px;padding:14px 18px;animation:pop .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card .nm{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2}
.card .mt{color:var(--dim);font-size:16px;margin-top:3px}
.card .tm{color:var(--muted);font-size:16px;margin-top:8px;font-variant-numeric:tabular-nums}
.c-good{border-left-color:var(--good)} .c-late{border-left-color:var(--warn)}
.c-exc{border-left-color:var(--dim)}   .c-out{border-left-color:var(--crit)}

/* bars — the value is printed on every one, because nothing hovers here */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:190px 1fr 124px;align-items:center;gap:16px}
.bar .k{font-size:19px;color:var(--muted);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:34px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;position:relative}
.bar .f{height:100%;border-radius:4px;background:var(--r2);
  width:0;transition:width .9s cubic-bezier(.2,.7,.3,1)}
.bar .v{font-family:var(--display);font-size:24px;font-weight:800;
  font-variant-numeric:tabular-nums}

/* the running order */
.ord{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 20px}
.item.live{border-color:var(--gold);background:linear-gradient(90deg,rgba(239,194,75,.14),var(--panel))}
.item .at{font-family:var(--display);font-size:24px;font-weight:800;color:var(--gold);
  font-variant-numeric:tabular-nums}
.item .ti{font-family:var(--display);font-size:23px;font-weight:700}
.item .by{color:var(--muted);font-size:17px;margin-top:2px}
.item .mi{font-family:var(--display);font-size:22px;font-weight:800;color:var(--muted)}

/* the floor */
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 20px;margin-bottom:12px}
.note .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.note .kd{font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--navy);background:var(--teal);border-radius:6px;padding:3px 10px}
.note .wh{font-family:var(--display);font-size:20px;font-weight:700}
.note .tm{color:var(--dim);font-size:16px;font-variant-numeric:tabular-nums}
.note .bd{font-size:21px;line-height:1.5}

/* the rating */
.stars{display:flex;gap:10px;align-items:center;margin:4px 0 2px}
.star{font-size:46px;line-height:1;color:var(--dim)}
.star.on{color:var(--gold)}
.spread{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media (max-width:1200px){.two{grid-template-columns:1fr}}
/*  A LINE, NOT BARS. The scores sit between 3.4 and 4.0 on a scale of
 *  five: drawn as bars from zero every column is the same height and
 *  the trend is invisible, and cutting the baseline to make it visible
 *  is a lie. A line may carry a focused range honestly, so it does,
 *  and the range is written on the chart. The container includes the
 *  date band, so the labels are never clipped out of a fixed height. */
.trend{width:100%}
.trend svg{width:100%;height:auto;display:block;overflow:visible}
.tnote{color:var(--dim);font-size:15px;margin-top:6px}
.col .bx{width:100%;background:var(--r2);border-radius:4px 4px 0 0;
  height:0;transition:height .9s cubic-bezier(.2,.7,.3,1);position:relative}
.col .bx.now{background:linear-gradient(180deg,var(--teal),var(--r2))}
.col .vv{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.col .dd{font-size:15px;color:var(--dim);white-space:nowrap}

.sec{font-family:var(--display);font-size:26px;font-weight:800;margin:30px 0 14px}
.sec:first-child{margin-top:0}
.lead{color:var(--muted);font-size:19px;max-width:1000px;margin:-6px 0 18px}
.empty{color:var(--dim);font-size:20px;padding:30px 0}

.gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--navy)}
.gate .bx{width:min(560px,92vw);text-align:center}
.gate h2{font-size:38px;font-weight:800;margin-bottom:8px}
.gate p{color:var(--muted);margin:0 0 26px}
.gate input{width:100%;font-size:34px;text-align:center;padding:20px;border-radius:16px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:var(--display);font-weight:700;letter-spacing:.1em}
.gate button{margin-top:16px;width:100%;min-height:76px;border:0;border-radius:16px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));color:var(--navy);
  font-family:var(--display);font-size:24px;font-weight:800;cursor:pointer}
.gate .err{color:#ff8e80;margin-top:14px;min-height:28px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .bar .f,.col .bx{transition:none!important}
}
</style>
</head>
<body data-palette="#0ca30c,#fab219,#ec835a,#d03b3b">

<div class="top">
  <div class="mark"><img src="../logo-mark.png" alt=""></div>
  <div class="ttl">
    <h1 id="mTitle">The room</h1>
    <div class="sub" id="mSub">Ricky Rampersad Branch</div>
  </div>
  <div>
    <div class="clock" id="clock">—</div>
    <div class="stamp" id="stamp"></div>
  </div>
</div>

<div class="rail" role="tablist" id="rail"></div>
<div class="stage" id="stage"></div>

<div class="gate" id="gate">
  <div class="bx">
    <div class="mark" style="margin:0 auto 22px"><img src="../logo-mark.png" alt=""></div>
    <h2>The room</h2>
    <p>This screen opens on the branch code.</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" placeholder="Branch code">
    <button id="go">Open the room</button>
    <div class="err" id="gerr"></div>
  </div>
</div>

<script>
/*  WHERE THE ANSWER COMES FROM.
 *
 *  One request for the whole screen. Six tabs that each fetched their
 *  own would mean six waits on a sheet that already takes seconds, and
 *  a tab that waits is a tab nobody taps twice.
 */
var API = 'RRB_MEETINGS_EXEC_URL';
var D = null, CODE = '', TAB = 'room', TIMER = null;

var TABS = [
  { k:'room',    t:'The room',  n:'who is here' },
  { k:'now',     t:'Now',       n:'what is running' },
  { k:'board',   t:'The board', n:'this week' },
  { k:'actions', t:'Actions',   n:'who owes what' },
  { k:'floor',   t:'The floor', n:'what was said' },
  { k:'rating',  t:'Rating',    n:'how it went' }
];

function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

/* ---------------- the clock in the band ---------------- */
function tick(){
  var d = new Date();
  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  el('clock').textContent = h + ':' + String(d.getMinutes()).padStart(2,'0') + ' ' + ap;
}
setInterval(tick, 1000); tick();

/* ---------------- counting a number up ----------------
 *  Motion that means something: the figure arrives, it does not
 *  simply appear. Off entirely when the room asks for less motion. */
function countUp(node, to, dp){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){
    node.textContent = dp ? to.toFixed(dp) : to; return;
  }
  var t0 = null, from = 0, ms = 750;
  function step(t){
    if (!t0) t0 = t;
    var p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    var v = from + (to - from) * e;
    node.textContent = dp ? v.toFixed(dp) : Math.round(v);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function animate(root){
  (root || document).querySelectorAll('[data-count]').forEach(function(n){
    countUp(n, parseFloat(n.getAttribute('data-count')), +n.getAttribute('data-dp') || 0);
  });
  requestAnimationFrame(function(){
    (root || document).querySelectorAll('[data-w]').forEach(function(n){
      n.style.width = n.getAttribute('data-w') + '%';
    });
    (root || document).querySelectorAll('[data-h]').forEach(function(n){
      n.style.height = n.getAttribute('data-h') + '%';
    });
  });
}

/* ---------------- the status pill ----------------
 *  Glyph, word, tint. Three signals, so no one of them is load-bearing. */
function pill(kind){
  var P = { present:['p-good','✓','Here'], late:['p-late','↑','Late'],
            excused:['p-exc','—','Apology'], absent:['p-out','✕','Not here'] };
  var x = P[kind] || P.absent;
  return '<span class="pill ' + x[0] + '"><span class="g">' + x[1] + '</span>' + x[2] + '</span>';
}

/* ---------------- the tabs ---------------- */
function drawRail(){
  var late = D && D.actions ? D.actions.overdue : 0;
  el('rail').innerHTML = TABS.map(function(t){
    var badge = (t.k === 'actions' && late) ? '<span class="dot">' + late + '</span>' : '';
    return '<button class="tab" role="tab" data-k="' + t.k + '" aria-selected="' +
      (t.k === TAB) + '"><span>' + t.t + '</span><span class="n">' + t.n + '</span>' +
      badge + '</button>';
  }).join('');
  el('rail').querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ go(b.getAttribute('data-k')); });
  });
}
function go(k){
  TAB = k; drawRail();
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
  var p = el('p-' + k); if (p){ p.classList.add('on'); animate(p); }
}

/* ---------------- each tab ---------------- */
function roomTab(){
  var r = D.register, c = r.counts, g = r.groups;
  var order = [['present','c-good'],['late','c-late'],['excused','c-exc'],['absent','c-out']];
  var cards = '';
  var i = 0;
  order.forEach(function(pair){
    (g[pair[0]] || []).forEach(function(p){
      cards += '<div class="card ' + pair[1] + '" style="animation-delay:' +
        Math.min(i * 22, 700) + 'ms">' +
        '<div class="nm">' + esc(p.name) + '</div>' +
        '<div class="mt">' + esc(p.unit || p.role || '') + '</div>' +
        '<div class="tm">' + pill(pair[0]) +
          (p.time ? ' <span style="margin-left:8px">' + esc(p.time) + '</span>' : '') +
          (p.late ? ' <span style="margin-left:6px">' + p.late + ' min</span>' : '') +
          (pair[0] === 'excused' && p.reason ? ' <span style="margin-left:8px">' +
            esc(p.reason) + '</span>' : '') +
        '</div></div>';
      i++;
    });
  });

  return '<div class="hero">' +
      '<div><div class="cap">In the room</div>' +
        '<div class="big gold"><span data-count="' + c.here + '">0</span>' +
        '<span class="u">of ' + c.roll + '</span></div></div>' +
      '<div><div class="cap">Attendance</div>' +
        '<div class="big"><span data-count="' + c.rate + '">0</span><span class="u">%</span></div></div>' +
      '<div><div class="cap">Accounted for</div>' +
        '<div class="big teal"><span data-count="' + c.accountedFor + '">0</span><span class="u">%</span></div></div>' +
    '</div>' +
    '<div class="tiles">' +
      tile('Here', g.present.length, '') +
      tile('Late', g.late.length, g.late.length ? 'warn' : '') +
      tile('Apologies', g.excused.length, '') +
      tile('Not here', g.absent.length, g.absent.length ? 'alarm' : '') +
    '</div>' +
    '<div class="sec">Everybody on the list</div>' +
    '<p class="lead">Opening the meeting is the register. There is nothing else to sign, and nobody is marked absent by hand — a person with no row when the meeting closes is absent, which the branch decided and said to the room.</p>' +
    '<div class="who">' + cards + '</div>';
}
function tile(label, v, cls){
  return '<div class="tile ' + (cls === 'alarm' ? 'alarm' : '') + '">' +
    '<div class="l">' + esc(label) + '</div>' +
    '<div class="v"' + (cls === 'warn' ? ' style="color:var(--warn)"' : '') +
      ' data-count="' + v + '">0</div></div>';
}

function nowTab(){
  var s = D.session, a = D.agenda || [];
  var head = '';
  if (s && s.running && s.currentTitle){
    var over = s.currentAllotted ? s.itemElapsed - s.currentAllotted : 0;
    head = '<div class="hero">' +
      '<div><div class="cap">On now</div>' +
        '<h2 style="font-size:54px;font-weight:900">' + esc(s.currentTitle) + '</h2>' +
        '<div class="lead" style="margin-top:6px">' + esc(s.currentPresenter || '') + '</div></div>' +
      '<div><div class="cap">Running</div>' +
        '<div class="big ' + (over > 0 ? '' : 'teal') + '"' +
        (over > 0 ? ' style="color:var(--warn)"' : '') + '>' +
        '<span data-count="' + s.itemElapsed + '">0</span><span class="u">of ' +
        s.currentAllotted + ' min</span></div></div>' +
      (s.nextTitle ? '<div><div class="cap">Next</div>' +
        '<div style="font-family:var(--display);font-size:28px;font-weight:700">' +
        esc(s.nextTitle) + '</div><div class="lead" style="margin:4px 0 0">' +
        esc(s.nextPresenter || '') + ' &middot; ' + s.nextAllotted + ' min</div></div>' : '') +
      '</div>';
  } else {
    head = '<div class="hero"><div><div class="cap">The meeting</div>' +
      '<h2 style="font-size:48px;font-weight:900">Not started yet</h2>' +
      '<div class="lead" style="margin-top:6px">The running order is below. The chair starts it.</div>' +
      '</div></div>';
  }

  var cur = s && s.currentAgendaId;
  var rows = a.map(function(x){
    return '<div class="item' + (x.id === cur ? ' live' : '') + '">' +
      '<div class="at">' + (x.order ? (x.order / 10) : '') + '</div>' +
      '<div><div class="ti">' + esc(x.title) + '</div>' +
        '<div class="by">' + esc(x.presenter || 'nobody named') +
        (x.required ? (x.ready ? ' &middot; material in' : ' &middot; <span style="color:var(--warn)">material not in</span>') : '') +
        '</div></div>' +
      '<div class="mi">' + x.minutes + ' min</div></div>';
  }).join('');

  return head + '<div class="sec">The running order</div>' +
    (a.length ? '<div class="ord">' + rows + '</div>'
              : '<div class="empty">No agenda has been written for this meeting yet.</div>');
}

function boardTab(){
  var ch = D.chase;
  if (!ch) return '<div class="empty">No list was built for this week.</div>';
  var pc = function(n, d){ return d ? Math.round((n / d) * 100) : 0; };
  var people = (ch.people || []).slice(0, 14);

  /*  ONE MARK, ONE MEASURE. The bar is the share they answered, which
   *  is what this tab is about, so a short bar always means a poor
   *  week. It used to be the size of their list, which made a long bar
   *  look like good news when it only meant a lot was sent to them.
   *  How many were sent rides beside the figure, in words, where it
   *  cannot be mistaken for the bar.                                 */
  var rows = people.map(function(p){
    var share = pc(p.answered, p.sent);
    return '<div class="bar">' +
      '<div class="k">' + esc(p.name || p.email) + '</div>' +
      '<div class="t"><div class="f" data-w="' + share + '"' +
        ' style="background:' + (share >= 80 ? 'var(--r2)' : share >= 50 ? 'var(--r1)' : 'var(--serious)') +
        '"></div></div>' +
      '<div class="v">' + share + '<span style="color:var(--dim);font-size:17px">%</span>' +
        '<div style="font-size:15px;font-weight:500;font-family:var(--body);color:var(--dim)">' +
        p.answered + ' of ' + p.sent + '</div></div>' +
    '</div>';
  }).join('');

  return '<div class="hero">' +
      '<div><div class="cap">Answered</div><div class="big gold">' +
        '<span data-count="' + pc(ch.answered, ch.sent) + '">0</span><span class="u">%</span></div></div>' +
      '<div><div class="cap">Contact made</div><div class="big teal">' +
        '<span data-count="' + pc(ch.contacted, ch.sent) + '">0</span><span class="u">%</span></div></div>' +
    '</div>' +
    '<div class="tiles">' +
      tile('Cases sent', ch.sent, '') +
      tile('Answered', ch.answered, '') +
      tile('Contact made', ch.contacted, '') +
      tile('Answered nothing', (ch.silent || []).length, (ch.silent || []).length ? 'alarm' : '') +
    '</div>' +
    '<div class="sec">Answered against sent, by agent</div>' +
    '<p class="lead">The bar is how many cases went to them; the figure is how many they answered. &ldquo;Could not reach them&rdquo; is a complete answer &mdash; never replying is not.</p>' +
    '<div class="bars">' + rows + '</div>' +
    ((ch.silent || []).length
      ? '<div class="sec">Answered nothing this week</div><div>' +
        ch.silent.map(function(n){ return '<span class="pill p-out" style="margin:0 10px 10px 0">' +
          '<span class="g">✕</span>' + esc(n) + '</span>'; }).join('') + '</div>'
      : '');
}

function actionsTab(){
  var A = D.actions;
  var owners = (A.owners || []).map(function(o){
    return '<div class="bar">' +
      '<div class="k">' + esc(o.owner) + '</div>' +
      '<div class="t"><div class="f" data-w="' + Math.min(100, o.open * 12) + '"' +
        ' style="background:' + (o.overdue ? 'var(--crit)' : 'var(--r2)') + '"></div></div>' +
      '<div class="v">' + o.open +
        (o.overdue ? '<span style="color:var(--crit);font-size:18px"> &middot; ' + o.overdue + ' late</span>' : '') +
      '</div></div>';
  }).join('');

  var list = (A.list || []).map(function(x){
    return '<div class="item' + (x.overdue ? ' live' : '') + '" style="grid-template-columns:1fr auto">' +
      '<div><div class="ti">' + esc(x.item) + '</div>' +
        '<div class="by">' + esc(x.owner || 'nobody named') + ' &middot; due ' + esc(x.due || 'no date') + '</div></div>' +
      '<div>' + (x.overdue
        ? '<span class="pill p-out"><span class="g">✕</span>' + x.overdue + ' days late</span>'
        : '<span class="pill p-exc"><span class="g">—</span>Open</span>') + '</div></div>';
  }).join('');

  return '<div class="hero">' +
      '<div><div class="cap">Still open</div><div class="big gold">' +
        '<span data-count="' + A.open + '">0</span></div></div>' +
      '<div><div class="cap">Past the date</div><div class="big"' +
        (A.overdue ? ' style="color:var(--crit)"' : '') + '>' +
        '<span data-count="' + A.overdue + '">0</span></div></div>' +
    '</div>' +
    '<div class="sec">Who owes what</div>' +
    '<div class="bars">' + (owners || '<div class="empty">Nothing is open.</div>') + '</div>' +
    '<div class="sec">Oldest first</div>' +
    '<div class="ord">' + (list || '<div class="empty">Nothing is open.</div>') + '</div>';
}

function floorTab(){
  var f = D.floor || [];
  if (!f.length) return '<div class="empty">Nothing has been put on the record yet. ' +
    'Anybody signed in can add a point, a question, a decision or a commitment from their phone.</div>';
  return '<div class="sec" style="margin-top:0">What was said</div>' +
    '<p class="lead">Every one carries who said it, the item it was said under, and how many minutes into the meeting. The minutes write themselves from this.</p>' +
    f.map(function(c){
      return '<div class="note"><div class="hd">' +
        '<span class="kd">' + esc(c.kind) + '</span>' +
        '<span class="wh">' + esc(c.who) + '</span>' +
        '<span class="tm">' + esc(c.when) + ' &middot; ' + c.at + ' min in' +
        (c.item ? ' &middot; ' + esc(c.item) : '') + '</span>' +
        '</div><div class="bd">' + esc(c.body) + '</div></div>';
    }).join('');
}

function ratingTab(){
  var r = D.rating, t = D.trend || [];
  var full = Math.round(r.avg);
  var stars = '';
  for (var i = 1; i <= 5; i++) stars += '<span class="star' + (i <= full ? ' on' : '') + '">★</span>';

  var maxN = Math.max.apply(null, r.spread.map(function(x){ return x.n; }).concat([1]));
  var spread = r.spread.slice().reverse().map(function(x){
    return '<div class="bar"><div class="k">' + x.score + ' of 5</div>' +
      '<div class="t"><div class="f" data-w="' + Math.round((x.n / maxN) * 100) + '"' +
      ' style="background:' + (x.score >= 4 ? 'var(--r2)' : x.score === 3 ? 'var(--r1)' : 'var(--serious)') +
      '"></div></div><div class="v">' + x.n + '</div></div>';
  }).join('');

  var lo = Math.min(3, Math.floor(Math.min.apply(null, t.map(function(p){ return p.avg; }))));
  var hi = 5;
  var W = 640, H = 200, PL = 34, PR = 34, PT = 34, PB = 44;
  var x = function(i){ return t.length < 2 ? W / 2
    : PL + (i / (t.length - 1)) * (W - PL - PR); };
  var y = function(v){ return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); };

  var pts = t.map(function(p, i){ return x(i) + ',' + y(p.avg); }).join(' ');
  var area = t.length > 1
    ? '<polygon points="' + x(0) + ',' + y(lo) + ' ' + pts + ' ' + x(t.length - 1) + ',' + y(lo) +
      '" fill="rgba(0,207,234,.14)"></polygon>' : '';
  var grid = [lo, (lo + hi) / 2, hi].map(function(v){
    return '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(v) + '" y2="' + y(v) +
      '" stroke="rgba(255,255,255,.08)" stroke-width="1"></line>' +
      '<text x="' + (PL - 10) + '" y="' + (y(v) + 5) + '" text-anchor="end" ' +
      'fill="#7a90a8" font-size="13">' + v.toFixed(1) + '</text>';
  }).join('');

  /*  Every value is printed. There is no hover on a touchscreen, so a
   *  figure that only a pointer can reveal is a figure nobody reads. */
  var dots = t.map(function(p, i){
    var last = i === t.length - 1;
    return '<circle cx="' + x(i) + '" cy="' + y(p.avg) + '" r="' + (last ? 8 : 6) + '" ' +
      'fill="' + (last ? '#00CFEA' : '#1d8fa6') + '" stroke="#07131f" stroke-width="2"></circle>' +
      '<text x="' + x(i) + '" y="' + (y(p.avg) - 16) + '" text-anchor="middle" ' +
      'fill="#edf4fb" font-size="19" font-weight="800">' + p.avg.toFixed(1) + '</text>' +
      '<text x="' + x(i) + '" y="' + (H - 14) + '" text-anchor="middle" ' +
      'fill="#7a90a8" font-size="14">' + esc(p.short) + '</text>';
  }).join('');

  var cols = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
    'aria-label="The branch meeting rated out of five, the last ' + t.length + ' meetings">' +
    grid + area +
    '<polyline points="' + pts + '" fill="none" stroke="#00CFEA" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round"></polyline>' + dots + '</svg>' +
    '<div class="tnote">Shown from ' + lo.toFixed(1) + ' to 5.0, so the movement is visible. ' +
    'Every meeting&rsquo;s score is printed on it.</div>';

  return '<div class="hero">' +
      '<div><div class="cap">This meeting</div>' +
        '<div class="big gold"><span data-count="' + r.avg + '" data-dp="1">0.0</span>' +
        '<span class="u">of 5</span></div>' +
        '<div class="stars">' + stars + '</div></div>' +
      '<div><div class="cap">Rated by</div><div class="big">' +
        '<span data-count="' + r.n + '">0</span><span class="u">of ' + r.roll + ' in the room</span></div></div>' +
    '</div>' +
    '<div class="two">' +
      '<div>' + (r.n
        ? '<div class="sec">How the room scored it</div>' +
          '<div class="spread bars">' + spread + '</div>'
        : '<div class="empty">Nobody has rated this meeting yet. Everyone who was in the room can, from their phone.</div>') +
      '</div>' +
      '<div>' + (t.length
        ? '<div class="sec">The last ' + t.length + ' meetings</div>' +
          '<div class="trend">' + cols + '</div>' +
          '<p class="lead" style="margin:14px 0 0;font-size:17px">The same one-to-five the renewal portal, Claims TT and the group letters use, so the branch has one number for how it is doing rather than four that cannot be added up.</p>'
        : '') + '</div>' +
    '</div>' +
    (r.rated.length ? '<div class="sec">Who rated it</div>' +
      '<p class="lead">Who rated is shown; what they scored is not. A score with a name against it on a screen the room is standing in front of is a score that drifts upward, and then the number is worth nothing.</p>' +
      '<div>' + r.rated.map(function(n){
        return '<span class="pill p-good" style="margin:0 10px 10px 0"><span class="g">★</span>' +
          esc(n) + '</span>'; }).join('') + '</div>' : '');
}

/* ---------------- draw ---------------- */
function draw(){
  var m = D.meeting;
  el('mTitle').textContent = m ? m.title : 'No meeting';
  el('mSub').textContent = m
    ? (m.date + '  ·  ' + m.start + ' to ' + m.end + '  ·  week of ' + m.weekOf)
    : D.branch;
  el('stamp').textContent = 'read ' + (D.now || '');

  var build = { room: roomTab, now: nowTab, board: boardTab,
                actions: actionsTab, floor: floorTab, rating: ratingTab };
  el('stage').innerHTML = TABS.map(function(t){
    var html = '';
    try { html = m ? build[t.k]() : '<div class="empty">No meeting to show.</div>'; }
    catch (err) { html = '<div class="empty">That tab could not be drawn: ' + esc(err.message) + '</div>'; }
    return '<section class="panel" id="p-' + t.k + '" role="tabpanel">' + html + '</section>';
  }).join('');
  drawRail(); go(TAB);
}

/* ---------------- fetch ---------------- */
function load(){
  return fetch(API + '?action=room&code=' + encodeURIComponent(CODE))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok) throw new Error(j.error || 'That did not work.');
      D = j; el('gate').style.display = 'none'; draw();
      try { localStorage.setItem('rrb-room-code', CODE); } catch (e) {}
    });
}
el('go').addEventListener('click', function(){
  CODE = el('code').value.trim();
  if (!CODE) return;
  el('gerr').textContent = 'Opening…';
  load().catch(function(e){ el('gerr').textContent = e.message; });
});
el('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') el('go').click(); });

/*  The screen reads again every two minutes. A room watching a figure
 *  that never moves stops watching it. */
TIMER = setInterval(function(){ if (D) load().catch(function(){}); }, 120000);

try {
  var saved = localStorage.getItem('rrb-room-code');
  if (saved){ CODE = saved; load().catch(function(){ CODE = ''; }); }
} catch (e) {}
</script>
