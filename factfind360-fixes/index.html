function openAgent(code){
  var rows=ALL.filter(function(r){return r.agentCode===code;});
  if(!rows.length) return;
  var name=rows[0].advisorName, unit=rows[0].unit;
  var rosterA=ROSTER.filter(function(a){return a.code===code;})[0]||{};
  var byA={}; ALL.forEach(function(r){byA[r.agentCode]=(byA[r.agentCode]||0)+1;});
  var order=Object.keys(byA).sort(function(a,b){return byA[b]-byA[a];});
  var rank=order.indexOf(code)+1, totalA=order.length;
  var decided=rows.filter(function(r){return r.decision==='Proceed'||r.decision==='Decline';}).length;
  var proceed=rows.filter(function(r){return r.decision==='Proceed';}).length;
  var pr=decided?Math.round(proceed/decided*100):0;
  var qn=rows.filter(function(r){return r.quality>0;}); var avgQ=qn.length?Math.round(qn.reduce(function(s,r){return s+r.quality;},0)/qn.length):0;
  var pipeline=rows.filter(function(r){return statusGroup(r.status)!=='draft';}).reduce(function(s,r){return s+r.premium;},0);
  var sla=rows.filter(function(r){return r.approvedAt;}).map(function(r){return (new Date(r.approvedAt)-new Date(r.submittedAt))/86400000;});
  var avgSla=sla.length?(sla.reduce(function(s,x){return s+x;},0)/sla.length).toFixed(1):'—';
  var last=Math.max.apply(null,rows.map(function(r){return new Date(r.submittedAt).getTime();}));
  var daysSince=Math.round((NOW-last)/86400000);
  // branch averages
  var bAll=ALL, bAgents=order.length||1, bVolAvg=Math.round(bAll.length/bAgents);
  var bqn=bAll.filter(function(r){return r.quality>0;}); var bQ=bqn.length?Math.round(bqn.reduce(function(s,r){return s+r.quality;},0)/bqn.length):0;
  var bdec=bAll.filter(function(r){return r.decision==='Proceed'||r.decision==='Decline';}).length; var bpr=bdec?Math.round(bAll.filter(function(r){return r.decision==='Proceed';}).length/bdec*100):0;
  // 12-week activity
  var wk=[]; for(var w=11;w>=0;w--){var dd=new Date(NOW);dd.setDate(dd.getDate()-w*7);wk.push(isoWeekKey(dd));}
  var wc={}; rows.forEach(function(r){var k=isoWeekKey(new Date(r.submittedAt)); wc[k]=(wc[k]||0)+1;});
  var series=wk.map(function(k){return wc[k]||0;});
  var needMap=countBy(rows,function(r){return r.needs;});
  var stMap={}; rows.forEach(function(r){var g=statusGroup(r.status);var lbl={approved:'Approved',pending:'Pending BM',review:'In review',draft:'Draft',declined:'Declined'}[g];stMap[lbl]=(stMap[lbl]||0)+1;});
  var recent=rows.slice().sort(function(a,b){return new Date(b.submittedAt)-new Date(a.submittedAt);}).slice(0,6);
  function cmpRow(lab,valTxt,agentV,branchV,max,suffix){
    var aw=Math.min(100,agentV/max*100), bw=Math.min(100,branchV/max*100);
    var col= agentV>=branchV?'var(--ok)':'var(--warn)';
    return '<div class="row"><div class="lab">'+lab+'</div><div class="track"><div class="fill" style="width:'+aw+'%;background:'+col+'"></div><div class="avg" style="left:'+bw+'%"></div></div><div class="val">'+valTxt+' <span style="color:var(--muted);font-weight:500">/ '+branchV+suffix+' avg</span></div></div>';
  }
  var initials=name.split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();
  var medal= rank<=3?['🥇','🥈','🥉'][rank-1]:'';
  document.getElementById('agentBody').innerHTML=
    '<div class="am-head"><div class="am-avatar">'+initials+'</div>'+
      '<div><div id="amName" style="font-family:Fraunces,serif;font-size:22px;font-weight:700;color:var(--slate)">'+name+' '+medal+'</div>'+
      '<div style="color:var(--muted);font-size:12.5px">'+code+' · '+unit+' · '+(rosterA.role||'Agent')+'</div></div>'+
      '<div class="am-rank"><div class="r">#'+rank+'</div><div class="l">of '+totalA+'</div></div></div>'+
    '<div class="am-kpis">'+
      amk('Fact finds',rows.length,'')+
      amk('Avg quality',avgQ+'/100', avgQ>=bQ?'up':'down',(avgQ>=bQ?'▲ ':'▼ ')+'vs '+bQ+' branch')+
      amk('Proceed rate',pr+'%', pr>=bpr?'up':'down',(pr>=bpr?'▲ ':'▼ ')+'vs '+bpr+'%')+
      amk('Pipeline',money(pipeline),'')+
      amk('Avg time to review',avgSla+'d','')+
      amk('Last active',daysSince+'d ago', daysSince>21?'down':'', daysSince>21?'gone quiet':'')+
    '</div>'+
    '<div class="am-sec-title">How they compare to the branch average <span style="text-transform:none;font-weight:500">(marker = branch avg)</span></div>'+
    '<div class="am-cmp">'+
      cmpRow('Volume',rows.length,rows.length,bVolAvg,Math.max(rows.length,bVolAvg)*1.15,'')+
      cmpRow('Avg quality',avgQ,avgQ,bQ,100,'')+
      cmpRow('Proceed rate',pr+'%',pr,bpr,100,'%')+
    '</div>'+
    '<div class="am-sec-title">Activity — last 12 weeks</div><div style="background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:8px 10px">'+sparkline(series,{w:640,h:56})+'</div>'+
    '<div class="am-cols">'+
      '<div><div class="am-sec-title">Product &amp; needs</div>'+(Object.keys(needMap).length?hbars(toArr(needMap).slice(0,6)):'<div style="color:var(--muted);font-size:12px">No needs recorded.</div>')+'</div>'+
      '<div><div class="am-sec-title">Case status</div>'+donut(toArr(stMap))+'</div>'+
    '</div>'+
    '<div class="am-sec-title">Recent fact finds</div>'+
    '<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Client</th><th>Status</th><th>Decision</th><th class="num">Qual</th><th class="num">Premium</th></tr></thead><tbody>'+
      recent.map(function(r){var g=statusGroup(r.status);var b={approved:'b-approved',pending:'b-pending',review:'b-review',draft:'b-draft',declined:'b-decline'}[g];var bl={approved:'Approved',pending:'Pending BM',review:'In review',draft:'Draft',declined:'Declined'}[g];return '<tr><td>'+new Date(r.submittedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+'</td><td>'+r.clientName+'</td><td><span class="badge '+b+'">'+bl+'</span></td><td>'+(r.decision||'—')+'</td><td class="num">'+(r.quality||'—')+'</td><td class="num">'+(r.premium?money(r.premium):'—')+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="setF(\'agent\',\''+code+'\');closeAgent()">Filter dashboard to '+name.split(' ')[0]+'</button><button class="btn sm ghost" onclick="closeAgent()">Close</button></div>';
  document.getElementById('agentModal').classList.remove('hide');
}

/* ---- CSV export of the current view ---- */
function exportCsv(){
  var rows=filtered();
  var cols=['submittedAt','status','appType','advisorName','agentCode','unit','decision','quality','premium','replacement','clientName'];
  var head=['Submitted','Status','App type','Agent','Agent code','Unit','Decision','Quality','Premium','Replacement','Client'];
  var esc=function(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  var lines=[head.join(',')];
  rows.forEach(function(r){ lines.push(cols.map(function(c){ var v=r[c]; if(c==='submittedAt')v=new Date(r.submittedAt).toISOString().slice(0,10); if(c==='replacement')v=r.replacement?'YES':''; return esc(v); }).join(',')); });
  var blob=new Blob([lines.join('\n')],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='rr-factfind-'+(SESSION?SESSION.scope.kind:'view')+'-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ============================================================
//  DAILY REPORT
//  Computed from ALL (already role-scoped). buildDailyReport() returns a plain
//  data object; renderDaily() only formats it. The Apps Script daily email
//  builds the SAME shape from the same sheet, so the emailed figures and this
//  page can be reconciled against each other instead of quietly disagreeing.
// ============================================================
const STUCK_DAYS = 3;      // matches the escalation threshold in the Apps Script
const QUIET_DAYS = 7;

function dayKey(d){ const t = new Date(d); return t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate(); }
function daysBetween(a, b){ return (a - b) / 86400000; }

function buildDailyReport(){
  const today = dayKey(NOW);
  const yest  = dayKey(new Date(NOW.getTime() - 86400000));

  const rows = ALL.slice();
  const on = k => rows.filter(r => dayKey(new Date(r.submittedAt)) === k);

  // Awaiting a decision, oldest first — this is the list someone must act on.
  const awaiting = rows
    .filter(r => { const g = statusGroup(r.status); return g === 'pending' || g === 'review'; })
    .map(r => Object.assign({ageDays: Math.floor(daysBetween(NOW, new Date(r.submittedAt)))}, r))
    .sort((a,b) => b.ageDays - a.ageDays);

  const approvedToday = rows.filter(r =>
    r.approvedAt && dayKey(new Date(r.approvedAt)) === today);

  const last30 = rows.filter(r => daysBetween(NOW, new Date(r.submittedAt)) <= 30);

  return {
    asOf:            NOW.toISOString(),
    scope:           SESSION.scope.kind,
    scopeLabel:      SESSION.scope.kind === 'branch' ? 'Branch-wide'
                     : (SESSION.scope.kind === 'unit' ? (SESSION.unit || 'Your unit') : 'Your cases'),
    submittedToday:  on(today).length,
    submittedYesterday: on(yest).length,
    approvedToday:   approvedToday.length,
    awaiting:        awaiting,
    stuck:           awaiting.filter(r => r.ageDays > STUCK_DAYS),
    pipelinePremium: last30.reduce((s,r) => s + (r.premium||0), 0),
    replacementFlags: last30.filter(r => r.replacement).length,
    quiet:           (SESSION.scope.kind === 'agent') ? [] : quietAgents(QUIET_DAYS),
    rosterComplete:  ROSTER_SOURCE === 'server' || ROSTER_SOURCE === 'demo'
  };
}

function renderDaily(){
  const d = buildDailyReport();
  const dt = NOW.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const tile = (label, value, sub, accent) =>
    `<div class="card col-3" style="border-left:4px solid ${accent||'#0D9488'}">
       <div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700">${escapeHtml(label)}</div>
       <div style="font-size:30px;font-weight:800;line-height:1.1;margin:6px 0 2px">${escapeHtml(String(value))}</div>
       <div style="font-size:12px;color:var(--muted)">${escapeHtml(sub||'')}</div>
     </div>`;

  const caseList = (list, emptyMsg, showAge) => list.length
    ? `<table style="width:100%;border-collapse:collapse;font-size:13px">
         <thead><tr style="text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em">
           <th style="padding:6px 8px">Client</th><th style="padding:6px 8px">Agent</th>
           <th style="padding:6px 8px">Status</th><th style="padding:6px 8px;text-align:right">${showAge?'Waiting':'Premium'}</th>
         </tr></thead><tbody>${list.map(r => {
           const late = showAge && r.ageDays > STUCK_DAYS;
           return `<tr style="border-top:1px solid var(--line);${late?'background:color-mix(in srgb,#DC2626 7%,transparent)':''}">
             <td style="padding:6px 8px">${escapeHtml(r.clientName||'—')}</td>
             <td style="padding:6px 8px">${escapeHtml(r.advisorName||'—')}</td>
             <td style="padding:6px 8px">${escapeHtml(r.status||'—')}</td>
             <td style="padding:6px 8px;text-align:right;${late?'color:#DC2626;font-weight:800':''}">${
               showAge ? (r.ageDays + (r.ageDays===1?' day':' days')) : money(r.premium||0)}</td></tr>`;
         }).join('')}</tbody></table>`
    : `<div style="color:var(--muted);font-size:13px;padding:6px 2px">${escapeHtml(emptyMsg)}</div>`;

  let h = `<div class="exec" style="margin-bottom:14px">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-weight:700">Daily report · ${escapeHtml(d.scopeLabel)}</div>
      <h2 style="margin:6px 0 2px">${escapeHtml(dt)}</h2>
      <div style="opacity:.8;font-size:13.5px">Prepared for ${escapeHtml(SESSION.name)} · ${escapeHtml(SESSION.role)}</div>
    </div>`;

  h += '<div class="grid">';
  h += tile('Submitted today', d.submittedToday, 'fact finds');
  h += tile('Submitted yesterday', d.submittedYesterday, 'fact finds');
  h += tile('Approved today', d.approvedToday, 'signed off');
  h += tile('Awaiting review', d.awaiting.length,
            d.stuck.length ? d.stuck.length + ' over ' + STUCK_DAYS + ' days' : 'all inside ' + STUCK_DAYS + ' days',
            d.stuck.length ? '#DC2626' : '#0D9488');
  h += '</div>';

  if (d.stuck.length){
    h += `<div class="card col-12" style="border-left:4px solid #DC2626;margin-top:12px">
            <h3 style="color:#DC2626">Needs action — waiting more than ${STUCK_DAYS} days</h3>
            <div class="csub">These are the cases the ${''}3pm reminder chases, and the ones that escalate to the Branch Manager.</div>
            ${caseList(d.stuck, '', true)}</div>`;
  }

  h += `<div class="card col-12" style="margin-top:12px"><h3>Full review queue</h3>
        <div class="csub">Everything awaiting a decision, oldest first</div>
        ${caseList(d.awaiting, 'Nothing waiting — the queue is clear.', true)}</div>`;

  h += '<div class="grid" style="margin-top:12px">';
  h += `<div class="card col-6"><h3>Pipeline</h3><div class="csub">Recommended monthly premium, last 30 days</div>
          <div style="font-size:30px;font-weight:800">${escapeHtml(money(d.pipelinePremium))}</div>
          <div style="font-size:12px;color:var(--muted)">${d.replacementFlags} replacement flag${d.replacementFlags===1?'':'s'} in period</div></div>`;

  if (d.scope !== 'agent'){
    h += `<div class="card col-6"><h3>Quiet agents</h3>
            <div class="csub">No submission in ${QUIET_DAYS} days</div>` +
         (d.quiet.length
            ? '<ul style="margin:6px 0 0;padding-left:18px;font-size:13px">' +
              d.quiet.map(a => `<li>${escapeHtml(a.name)} — ${a.days > 900 ? 'none on record' : a.days + ' days'}</li>`).join('') +
              '</ul>'
            : '<div style="color:var(--muted);font-size:13px">Everyone has submitted recently.</div>') +
         (d.rosterComplete ? '' :
            '<div style="margin-top:8px;font-size:12px;color:#B45309">Roster derived from submissions — agents with no fact finds at all cannot be listed here. Add an <code>?action=roster</code> handler to close this gap.</div>') +
         '</div>';
  }
  h += '</div>';

  h += `<div class="src-note" style="margin-top:14px">Generated ${escapeHtml(NOW.toLocaleString('en-GB'))} from ${ALL.length} records in your scope${SRC==='live'?'':' · DEMO DATA'}.</div>`;

  document.getElementById('dailyBody').innerHTML = h;
}

function toggleDaily(){
  if (!SESSION) return;
  const daily = document.getElementById('dailyView');
  const main  = document.querySelector('#appView > .wrap');
  const btn   = document.getElementById('dailyBtn');
  const showing = daily.classList.contains('hide');
  if (showing){ renderDaily(); daily.classList.remove('hide'); main.classList.add('hide'); btn.textContent = '← Back to dashboard'; }
  else        { daily.classList.add('hide');    main.classList.remove('hide'); btn.textContent = '📋 Daily report'; }
  window.scrollTo(0,0);
}

// ---- boot ----
// Demo mode (?demo=1) skips sign-in entirely and shows synthetic data, clearly
// badged. It is the only path that bypasses the server, it can never reach real
// records, and it is opt-in from the URL — unlike the old implicit fallback,
// which let real staff in against real client data whenever a fetch failed.
if(DEMO_MODE){
  // ?as=agent|unit|branch picks the demo persona, so each altitude of the
  // dashboard can be shown (and captured) with real scoping — the same
  // filtering the server enforces for real sessions. ?scrolly=N scrolls after
  // load, for deep-view captures.
  var DEMO_AS=(function(){ try{ return new URLSearchParams(location.search).get('as')||'branch'; }catch(e){ return 'branch'; } })();
  var DEMO_PERSONAS={
    agent:  {email:'nia.osei@example.invalid', name:'Nia Osei',   role:'Agent',
             unitKey:'ricky', unit:UNIT['ricky'], code:'D0005', scope:{kind:'agent', code:'D0005'}},
    unit:   {email:'sara.lynch@example.invalid', name:'Sara Lynch', role:'Unit Manager',
             unitKey:'akaash', unit:UNIT['akaash'], code:'D0003', scope:{kind:'unit', unitKey:'akaash'}},
    branch: {email:'demo@example.invalid', name:'Demo Viewer', role:'Branch Manager',
             unitKey:'', unit:'', code:'', scope:{kind:'branch'}}
  };
  SESSION=DEMO_PERSONAS[DEMO_AS]||DEMO_PERSONAS.branch;
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('whoName').textContent=SESSION.name;
  document.getElementById('whoRole').textContent=SESSION.role+' · DEMO MODE — synthetic data';
  refreshData().then(function(){
    try{
      var sy=parseInt(new URLSearchParams(location.search).get('scrolly')||'0',10);
      if(sy) window.scrollTo(0,sy);
    }catch(e){}
  });
} else {
  // The dropdown has to be filled before anyone can sign in, so this is the one
  // call the dashboard makes without a session. It returns names only.
  loadAccessNames().then(function(){
    var f=document.getElementById('liName');
    if(f) f.focus();
  });
}
