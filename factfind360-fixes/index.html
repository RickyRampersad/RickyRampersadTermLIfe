<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1E293B">
<title>RR Branch — Fact Find Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#1E293B; --slate-2:#334155; --teal:#0D9488; --teal-soft:#14B8A6; --teal-tint:#ECFDF8; --teal-deep:#0F766E;
    --ink:#0F172A; --ink-soft:#334155; --muted:#556070; --line:#E2E8F0; --line-2:#CBD5E1;
    --bg:#F1F5F9; --surface:#FFFFFF; --ok:#0D9488; --warn:#B45309; --danger:#DC2626; --amber:#F59E0B; --violet:#7C3AED; --blue:#2563EB;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow:0 4px 14px rgba(15,23,42,.08); --shadow-lg:0 12px 32px rgba(15,23,42,.14);
    --radius:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--teal-deep)}
  .hide{display:none !important}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 20% -10%,rgba(20,184,166,.18),transparent),linear-gradient(160deg,#0f172a,#1e293b 60%,#0f766e)}
  .login-card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:30px 28px}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .login-logo svg{width:40px;height:46px}
  .login-card h1{font-size:22px;color:var(--slate)}
  .login-card .sub{color:var(--muted);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 20px;font-weight:600}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field select{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;font-size:15px;background:#fff;transition:border .15s,box-shadow .15s;font-family:inherit;color:inherit}
  .field select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:34px;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1l5 5 5-5' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 13px center;background-size:12px 8px}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .btn{border:none;background:var(--teal);color:#fff;padding:12px 18px;font-size:14.5px;font-weight:700;border-radius:10px;transition:filter .15s,transform .05s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn.block{width:100%}
  .btn.ghost{background:#fff;color:var(--slate);border:1px solid var(--line-2)}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .login-note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
  .login-err{color:var(--danger);font-size:13px;margin-top:10px;font-weight:600;min-height:18px}

  /* ---------- APP SHELL ---------- */
  .topbar{background:linear-gradient(180deg,var(--slate),var(--slate-2));color:#fff;padding:12px 20px;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
  .topbar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .logo{width:30px;height:35px;flex-shrink:0}
  .topbar .title{font-family:Fraunces;font-weight:600;font-size:18px;line-height:1}
  .topbar .title small{display:block;font-family:Inter;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:3px}
  .topbar .spacer{flex:1}
  .who{text-align:right;font-size:12.5px;line-height:1.3}
  .who b{font-weight:700}
  .who .role{color:#7dd3c8;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .icon-btn:hover{background:rgba(255,255,255,.2)}
  .icon-btn.primary{background:var(--teal);border-color:var(--teal);font-weight:800}
  .icon-btn.primary:hover{background:var(--teal-soft)}
  .src-badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:4px 9px;border-radius:100px;cursor:pointer;white-space:nowrap;text-transform:uppercase}
  .src-badge.live{background:#0d9488;color:#fff}
  .src-badge.sample{background:#F59E0B;color:#1E293B}
  .src-badge.live::before{content:"● "}
  .src-badge.sample::before{content:"⚠ "}

  .wrap{max-width:1240px;margin:0 auto;padding:20px}

  /* filter bar */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .filters .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .filters .seg button{background:none;border:none;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .filters .seg button.on{background:var(--slate);color:#fff}
  .filters select{padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;background:#fff;font-weight:600;color:var(--ink-soft);box-shadow:var(--shadow-sm)}
  .filters .chip{background:var(--teal-tint);color:var(--teal-deep);border:1px solid #99f6e4;border-radius:100px;padding:6px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .filters .chip button{background:none;border:none;color:var(--teal-deep);font-weight:800;font-size:14px;line-height:1;padding:0}

  /* KPI cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .kpi .val{font-size:28px;font-weight:800;color:var(--slate);margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
  .kpi.warn .accent{background:var(--amber)} .kpi.blue .accent{background:var(--blue)} .kpi.violet .accent{background:var(--violet)} .kpi.danger .accent{background:var(--danger)}

  /* chart cards */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 12px;box-shadow:var(--shadow-sm)}
  .card h3{font-size:15px;color:var(--slate);margin-bottom:2px}
  .card .csub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .col-3{grid-column:span 3} .col-4{grid-column:span 4} .col-5{grid-column:span 5} .col-6{grid-column:span 6} .col-7{grid-column:span 7} .col-8{grid-column:span 8} .col-12{grid-column:span 12}

  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);font-weight:600}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}

  svg .seg,svg .bar,svg .dot{cursor:pointer;transition:opacity .12s}
  svg .seg:hover,svg .bar:hover{opacity:.82}

  /* leaderboard + table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;cursor:pointer;user-select:none}
  tbody tr:hover{background:#F8FAFC}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
  .b-approved{background:#dcfce7;color:#166534} .b-pending{background:#fef9c3;color:#854d0e} .b-review{background:#e0f2fe;color:#075985} .b-draft{background:#f1f5f9;color:#475569} .b-decline{background:#fee2e2;color:#991b1b}
  .minibar{height:7px;border-radius:4px;background:var(--teal);display:inline-block;vertical-align:middle}
  .search{padding:8px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;width:220px;max-width:100%}

  .tooltip{position:fixed;pointer-events:none;background:var(--slate);color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:var(--shadow-lg);z-index:9999;opacity:0;transition:opacity .1s;max-width:240px}
  .tooltip b{color:#7dd3c8}

  .src-note{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
  .src-live{color:var(--teal-deep);font-weight:700}
  .src-sample{color:var(--amber);font-weight:700}

  /* executive summary band */
  .exec{background:linear-gradient(135deg,#0f172a,#134e4a);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .exec::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(20,184,166,.25),transparent 70%)}
  .exec .eh{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7dd3c8;font-weight:700}
  .exec .eh .dot{width:7px;height:7px;border-radius:50%;background:#14B8A6;box-shadow:0 0 0 4px rgba(20,184,166,.25)}
  .exec h2{font-size:21px;margin:6px 0 2px;color:#fff;position:relative;z-index:1}
  .exec .esub{font-size:12.5px;color:rgba(255,255,255,.7)}
  .exec .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px;position:relative;z-index:1}
  .exec .ins .i{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:flex;gap:9px;align-items:flex-start}
  .exec .ins .i .ic{font-size:15px;line-height:1.2}
  .exec .ins .i b{color:#fff}
  .exec .ins .i.pos{border-left:3px solid #34d399} .exec .ins .i.neg{border-left:3px solid #f87171} .exec .ins .i.warn2{border-left:3px solid #fbbf24} .exec .ins .i.info{border-left:3px solid #38bdf8}

  /* KPI delta */
  .kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
  .kpi .delta.up{color:#0d9488} .kpi .delta.down{color:#dc2626} .kpi .delta.flat{color:var(--muted)}

  /* funnel */
  .funnel .step{display:flex;align-items:center;gap:10px;margin:7px 0}
  .funnel .flabel{width:96px;font-size:12px;font-weight:600;color:var(--ink-soft)}
  .funnel .fbar{flex:1;height:26px;border-radius:6px;background:#EEF2F6;overflow:hidden;position:relative}
  .funnel .ffill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:9px;color:#fff;font-size:12px;font-weight:700}
  .funnel .fconv{width:52px;text-align:right;font-size:11.5px;color:var(--muted);font-weight:700}

  /* attention list */
  .attn{display:flex;flex-direction:column;gap:8px}
  .attn .a{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--muted);font-size:12.5px;line-height:1.4;cursor:pointer;transition:background .12s}
  .attn .a:hover{background:#F8FAFC}
  .attn .a.red{border-left-color:var(--danger)} .attn .a.amber{border-left-color:var(--amber)} .attn .a.teal{border-left-color:var(--teal)}
  .attn .a .ac{font-size:16px;line-height:1.2}
  .attn .a b{color:var(--slate)}
  .attn .none{color:var(--muted);font-size:12.5px;padding:8px}

  /* heat strip */
  .heat td{padding:3px 4px}
  .heat .cell{width:15px;height:15px;border-radius:3px;display:inline-block}
  .heat .name{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;padding-right:8px}
  .heat .q{font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px}

  /* gauge */
  .gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .gauge-num{font-size:30px;font-weight:800;color:var(--slate);font-variant-numeric:tabular-nums}
  .gauge-sub{font-size:12px;color:var(--muted)}

  /* agent profile modal */
  .modal-overlay{position:fixed;inset:0;z-index:9998;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
  .modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:780px;padding:22px 24px 26px;position:relative;animation:modalIn .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-x{position:absolute;top:12px;right:14px;background:#F1F5F9;border:none;width:30px;height:30px;border-radius:8px;font-size:19px;color:var(--muted);line-height:1}
  .modal-x:hover{background:#E2E8F0;color:var(--slate)}
  .am-head{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .am-avatar{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:20px;flex-shrink:0}
  .am-rank{margin-left:auto;text-align:center;background:var(--teal-tint);border:1px solid #99f6e4;border-radius:12px;padding:6px 14px}
  .am-rank .r{font-size:22px;font-weight:800;color:var(--teal-deep);line-height:1}
  .am-rank .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-deep);font-weight:700}
  .am-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
  .am-kpis .k{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .am-kpis .k .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .am-kpis .k .v{font-size:19px;font-weight:800;color:var(--slate);margin-top:2px;font-variant-numeric:tabular-nums}
  .am-kpis .k .d{font-size:10.5px;margin-top:1px}
  .am-cmp{margin:6px 0 4px}
  .am-cmp .row{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:12px}
  .am-cmp .lab{width:104px;color:var(--ink-soft);font-weight:600}
  .am-cmp .track{flex:1;height:16px;background:#EEF2F6;border-radius:5px;position:relative;overflow:hidden}
  .am-cmp .fill{height:100%;border-radius:5px}
  .am-cmp .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--slate)}
  .am-cmp .val{width:96px;text-align:right;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums}
  .am-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  .am-sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:14px 0 6px}
  @media(max-width:600px){ .am-kpis{grid-template-columns:repeat(2,1fr)} .am-cols{grid-template-columns:1fr} }

  /* recognition podium */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:210px;padding-top:8px}
  .podium .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:120px;cursor:pointer}
  .podium .medal{font-size:26px;margin-bottom:4px}
  .podium .pname{font-size:12px;font-weight:700;color:var(--slate);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  .podium .pval{font-size:12.5px;font-weight:800;color:var(--teal-deep)}
  .podium .bar{width:100%;border-radius:10px 10px 0 0;margin-top:6px;height:0;transition:height .7s cubic-bezier(.2,.85,.25,1);display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:800;font-size:15px;padding-top:8px;box-shadow:var(--shadow-sm)}
  .podium .col:hover .bar{filter:brightness(1.07)}
  .metric-toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .metric-toggle button{background:none;border:none;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--muted)}
  .metric-toggle button.on{background:var(--teal);color:#fff}

  /* progress ring */
  .ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ring circle.fg{transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1)}

  /* award badges */
  .awards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .award{display:flex;gap:11px;align-items:center;background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .award:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .award .ico{font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
  .award .at{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .award .an{font-size:14px;font-weight:800;color:var(--slate);line-height:1.15}
  .award .av{font-size:11.5px;color:var(--teal-deep);font-weight:700}

  /* simulator */
  .sim-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:12px}
  .sim-ctl label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;display:flex;justify-content:space-between}
  .sim-ctl label b{color:var(--teal-deep);font-variant-numeric:tabular-nums}
  .sim-ctl input[type=range]{width:100%;accent-color:var(--teal);cursor:pointer}
  .sim-total{display:flex;align-items:baseline;gap:8px;background:var(--teal-tint);border:1px solid #99f6e4;border-radius:10px;padding:9px 14px;margin-bottom:10px}
  .sim-total .n{font-size:24px;font-weight:800;color:var(--teal-deep);font-variant-numeric:tabular-nums}
  .rwd{display:flex;align-items:center;gap:10px;margin:5px 0;cursor:pointer}
  .rwd .rn{width:150px;font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rwd .rt{flex:1;background:#EEF2F6;height:20px;border-radius:5px;overflow:hidden}
  .rwd .rf{height:100%;border-radius:5px;transition:width .35s ease;background:linear-gradient(90deg,#0d9488,#14b8a6)}
  .rwd .rv{width:84px;text-align:right;font-size:12.5px;font-weight:800;color:var(--slate);font-variant-numeric:tabular-nums}

  /* entrance animation (respects reduced-motion) */
  @media (prefers-reduced-motion:no-preference){
    .kpi,.card,.exec{animation:cardIn .4s ease both}
    #kpiGrid .kpi:nth-child(2){animation-delay:.03s} #kpiGrid .kpi:nth-child(3){animation-delay:.06s} #kpiGrid .kpi:nth-child(4){animation-delay:.09s}
    #kpiGrid .kpi:nth-child(5){animation-delay:.12s} #kpiGrid .kpi:nth-child(6){animation-delay:.15s} #kpiGrid .kpi:nth-child(7){animation-delay:.18s} #kpiGrid .kpi:nth-child(8){animation-delay:.21s}
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .modal-overlay{display:none !important}
    .topbar{position:static;box-shadow:none}
    .card,.kpi,.exec{break-inside:avoid;box-shadow:none}
    .grid{display:block}
    .card{margin-bottom:12px}

<script>
/* ============================================================
   RR Branch — Fact Find Insights Dashboard
   Self-contained: charts are hand-rolled SVG (no CDN needed).
   Data: live from Apps Script (?action=login / ?action=data)
   with a realistic sample-data fallback so it always presents.
   ============================================================ */

// ---- endpoint (shared with the fact-find form if present) ----
// Default = the branch fact-find Apps Script /exec. Add DashboardApi.gs to THAT
// project and re-deploy (Manage deployments ▸ Edit, keep the same URL) to go live.
var DEFAULT_ENDPOINT='https://script.google.com/macros/s/AKfycbyUnSnQtumx9emW_LsWQf6QKZFBGGnaTn3-PfAZDfjtZuBUSha-OuIXPT30qkMrXMoczA/exec';

// The endpoint receives complete fact finds — income, assets, debts, dependants,
// health answers, and the generated PDF. It is therefore LOCKED by default: a
// stored override cannot redirect that data to a third party. Previously any
// script running on this origin (or anyone who clicked "Set data endpoint")
// could permanently repoint every future submission.
//
// To point the dashboard at a different deployment, edit DEFAULT_ENDPOINT above
// and re-upload. Set ENDPOINT_LOCKED=false only on a throwaway staging copy.
var ENDPOINT_LOCKED = true;

// Even unlocked, an override must be a Google Apps Script web-app URL. Anything
// else — a different host, http://, a data:/javascript: URI — is refused.
function isAllowedEndpoint(u){
  try{
    var p = new URL(String(u).trim());
    return p.protocol === 'https:'
        && p.hostname === 'script.google.com'
        && p.pathname.indexOf('/macros/s/') === 0;
  }catch(e){ return false; }
}
function getEndpoint(){
  if(ENDPOINT_LOCKED) return DEFAULT_ENDPOINT || '';
  var stored = localStorage.getItem('rrb_dash_endpoint') || localStorage.getItem('rrbEndpoint') || '';
  if(stored && isAllowedEndpoint(stored)) return stored;
  if(stored){ try{ localStorage.removeItem('rrb_dash_endpoint'); localStorage.removeItem('rrbEndpoint'); }catch(e){} }
  return DEFAULT_ENDPOINT || '';
}
function setEndpoint(u){
  if(ENDPOINT_LOCKED) return false;
  u = String(u||'').trim();
  if(!u){ try{ localStorage.removeItem('rrb_dash_endpoint'); localStorage.removeItem('rrbEndpoint'); }catch(e){} return true; }
  if(!isAllowedEndpoint(u)) return false;
  localStorage.setItem('rrb_dash_endpoint', u);
  return true;
}
function promptEndpoint(){
  if(ENDPOINT_LOCKED){
    alert('The data endpoint is fixed for this deployment.\n\nIt is locked so that submitted fact finds cannot be redirected. To change it, edit DEFAULT_ENDPOINT in the page source and re-upload.');
    return;
  }
  var cur=getEndpoint();
  var v=prompt('Apps Script Web App URL (must be https://script.google.com/macros/s/…/exec):', cur);
  if(v===null) return;
  if(!setEndpoint(v)){ alert('Rejected — only a Google Apps Script web-app URL is accepted.'); return; }
  alert(v.trim()?'Endpoint saved. Refreshing…':'Cleared.');
  if(SESSION) refreshData();
}
// Escape before interpolating anything server- or user-supplied into innerHTML.
// The dashboard builds most of its DOM as HTML strings, and advisor names,
// client names and server error text all reach it from outside this file.
function escapeHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// fetch JSON with a timeout so a slow/missing endpoint never hangs the UI
async function fetchJson(url,ms){
  // 20s, not 7. An Apps Script web app answers on script.google.com with a 302
  // to googleusercontent.com, and a cold container has to spin up before it
  // replies at all. Seven seconds was comfortably inside that on a first call,
  // so a perfectly healthy server was reported as unreachable.
  ms=ms||20000; var ctrl=new AbortController(); var t=setTimeout(function(){ctrl.abort();},ms);
  try{ var res=await fetch(url,{method:'GET',signal:ctrl.signal,redirect:'follow'}); return await res.json(); }
  finally{ clearTimeout(t); }
}

// ---- branch roster ----
// The 33-person staff directory (names, work emails, agent codes, reporting
// lines) and the imported REAL_DATA rows (real client names, advisors and
// premiums) used to be hard-coded here. Both were served to anyone who opened
// the page — View Source read them without signing in, and the role scoping in
// refreshData() was applied only AFTER the whole branch was already in the
// document, so a unit manager's "scope" was cosmetic.
//
// Both now come from the server, after authentication, already scoped:
//   ?action=roster  -> { ok:true, roster:[ {email,code,name,role,unitKey} ] }
//   ?action=data    -> { ok:true, rows:[ … ] }
// See ENDPOINT-NOTES.md for the Apps Script side. If ?action=roster is not
// implemented yet the dashboard still works — it derives the agent list from
// the returned rows and tells you which panels are degraded.
var UNIT={ricky:'Ricky Rampersad',kerwyn:'Kerwyn Ramroach',akaash:'Akaash Kalladeen',gary:'Gary Sookdeo'};
var ROSTER=[];
var ROSTER_BY_EMAIL={};
var ROSTER_SOURCE='none';   // 'server' | 'derived' | 'demo' | 'none'

function setRoster(list, source){
  ROSTER=(list||[]).map(function(r){
    return {email:String(r.email||'').toLowerCase(), code:r.code||'', name:r.name||r.email||'',
            role:r.role||'Agent', unitKey:r.unitKey||'', unit:r.unit||UNIT[r.unitKey]||''};
  });
  ROSTER_BY_EMAIL={};
  ROSTER.forEach(function(a){ ROSTER_BY_EMAIL[a.email]=a; });
  ROSTER_SOURCE=source||'server';
}

// Pull the roster after sign-in. Never called before authentication — that is
// the whole point. Degrades to deriving the list from the (already scoped) data
// rows when the server has no ?action=roster handler.
async function loadRoster(rows){
  var ep=getEndpoint();
  if(ep && !DEMO_MODE){
    try{
      var url=ep+(ep.indexOf('?')>-1?'&':'?')+'action=roster&token='+encodeURIComponent(SESSION.token||'')+
              '&email='+encodeURIComponent(SESSION.email||'')+
              '&code='+encodeURIComponent(SESSION.code||'');
      var j=await fetchJson(url);
      if(j && j.ok && Array.isArray(j.roster) && j.roster.length){ setRoster(j.roster,'server'); return; }
    }catch(e){ /* fall through to derived */ }
  }
  // Derived fallback: everyone who appears in the data we were given. Agents
  // with zero submissions cannot appear this way — quietAgents() says so.
  var seen={}, list=[];
  (rows||[]).forEach(function(r){
    var em=(r.agentEmail||'').toLowerCase();
    if(!em || seen[em]) return;
    seen[em]=1;
    list.push({email:em, code:r.agentCode, name:r.advisorName, role:'Agent', unitKey:r.unitKey, unit:r.unit});
  });
  setRoster(list, list.length?'derived':'none');
}

// ---- demo mode ----
// Opt-in via ?demo=1. Synthetic people, synthetic clients, no password, no
// server. This replaces the old implicit fallback that logged real staff in
// against real client data whenever the endpoint happened to be unreachable.
var DEMO_MODE=(function(){
  try{ return new URLSearchParams(location.search).get('demo')==='1'; }catch(e){ return false; }
})();
var DEMO_ROSTER=[
 ['dana.holder@example.invalid','D0001','Dana Holder','Branch Manager','ricky'],
 ['omar.pierre@example.invalid','D0002','Omar Pierre','Assistant Branch Manager','kerwyn'],
 ['sara.lynch@example.invalid','D0003','Sara Lynch','Unit Manager','akaash'],
 ['theo.grant@example.invalid','D0004','Theo Grant','Unit Manager','gary'],
 ['nia.osei@example.invalid','D0005','Nia Osei','Agent','ricky'],
 ['raj.patel@example.invalid','D0006','Raj Patel','Agent','ricky'],
 ['mia.bright@example.invalid','D0007','Mia Bright','Agent','kerwyn'],
 ['kofi.mensah@example.invalid','D0008','Kofi Mensah','Agent','kerwyn'],
 ['lena.vaz@example.invalid','D0009','Lena Vaz','Agent','akaash'],
 ['sam.reyes@example.invalid','D0010','Sam Reyes','Agent','akaash'],
 ['ivy.chan@example.invalid','D0011','Ivy Chan','Agent','gary'],
 ['noah.reid@example.invalid','D0012','Noah Reid','Agent','gary']
].map(function(r){return {email:r[0],code:r[1],name:r[2],role:r[3],unitKey:r[4],unit:UNIT[r[4]]};});

// ---- seeded RNG for stable sample data ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// "Today" for every date window on this page — the 7/30/90-day filters, the
// "stuck more than 3 days" count, quiet-agent detection and the week buckets.
// This was pinned to 21 Jul 2026, which froze all of them: the ranges drifted
// one day further out of date per day. It is now the real clock.
//
// Demo mode keeps a fixed date so the seeded sample data always tells the same
// story regardless of when someone opens it.
var DEMO_TODAY=new Date(2026,6,21);
var NOW=DEMO_MODE ? DEMO_TODAY : new Date();
var PRODUCTS=[
  {need:'Income Replacement',plan:'Flexi Term to age 65'},
  {need:'Critical Illness',plan:'CI Rider (living benefit)'},
  {need:'Retirement / Pension',plan:'Life Secure (Annuity)'},
  {need:'Education Funding',plan:'Life Evolution + Investor'},
  {need:'Last Expenses',plan:'Xpress Life'},
  {need:'Income Protection',plan:'Praesidia — Disability Income'},
  {need:'Estate / Whole Life',plan:'Econolife (Whole Life)'},
  {need:'Keyperson / Business',plan:'Keyperson Life + CI'}
];
var STATUSES=['approved','pending_branch_manager_review','pending_review','draft','declined'];

// Invented names and manager notes, used only when ?demo=1 builds synthetic
// rows. No real client, adviser or comment appears here.
var DEMO_CLIENTS = ['A. Maharaj','S. Persad','K. Mohammed','D. Ramlogan','J. Boodoo','N. Khan',
                    'R. Seepersad','T. Baksh','M. Ali','C. Joseph','P. Gopaul','L. Rampersad'];
var DEMO_MGR_NOTES = [
  'Sound for a sole earner with this debt load. Term sized correctly against the mortgage.',
  'Raise income protection before the client meeting \u2014 the runway here is zero.',
  'Size the term against the full mortgage, not the balance net of savings.',
  'Good needs analysis. Confirm the spouse cover at delivery.',
  'Premium is at the top of what this surplus carries. Note why the client is comfortable.',
  'Replacement flagged \u2014 make sure the declaration is attached before submission.'
];

function genSample(){
  var rnd=mulberry32(20260721);
  var pick=function(arr){return arr[Math.floor(rnd()*arr.length)];};
  var agents=ROSTER.filter(function(a){return true;});
  // activity weight per agent (some busier)
  var rows=[]; var id=1;
  agents.forEach(function(a){
    var base= a.role==='Agent'?2:1;
    var n= base + Math.floor(rnd()*7); // 1..8ish
    if(rnd()<0.12) n=0; // a few quiet agents
    for(var i=0;i<n;i++){
      var st; var r=rnd();
      if(r<0.54) st='approved'; else if(r<0.63) st='pending_branch_manager_review'; else if(r<0.71) st='pending_review'; else if(r<0.90) st='draft'; else st='declined';
      // Pending cases are FRESH (a healthy pipeline turns over fast); resolved/draft
      // cases are spread across the period, skewed toward recent for a lively 30-day view.
      var pendingSt = (st==='pending_branch_manager_review'||st==='pending_review');
      var daysAgo = pendingSt ? Math.floor(rnd()*6) : Math.floor(rnd()*rnd()*70);
      var d=new Date(NOW); d.setDate(d.getDate()-daysAgo);
      var appType= rnd()<0.8?'full':'advice';
      var decision= st==='declined'?'Decline':(st==='draft'?'':(rnd()<0.82?'Proceed':'Decline'));
      var quality= Math.max(35,Math.min(99, Math.round(70+ (rnd()-0.35)*55)));
      var replacement= rnd()<0.12;
      var redFlags= (rnd()<0.18?1:0)+(rnd()<0.10?1:0);
      var np= 1+Math.floor(rnd()*3);
      var used={}; var needs=[]; var prem=0;
      for(var k=0;k<np;k++){ var p=pick(PRODUCTS); if(used[p.need])continue; used[p.need]=1; needs.push(p); prem+= 120+Math.floor(rnd()*rnd()*1100); }
      var approvedAt='';
      if(st==='approved'||st==='declined'){ var rev=new Date(d); rev.setDate(rev.getDate()+1+Math.floor(rnd()*6)); if(rev>NOW)rev=NOW; approvedAt=rev.toISOString(); }
      rows.push({
        id:'S'+(id++), submittedAt:d.toISOString(), approvedAt:approvedAt, status:st, appType:appType,
        clientName: DEMO_CLIENTS[Math.floor(Math.random()*DEMO_CLIENTS.length)],
        mgrName: a.unit, mgrAgree: (st==='approved' ? (Math.random()<0.82?'agree':'disagree') : ''),
        mgrComments: (st==='approved' && Math.random()<0.55)
          ? DEMO_MGR_NOTES[Math.floor(Math.random()*DEMO_MGR_NOTES.length)] : '',
        advisorName:a.name, agentCode:a.code, agentEmail:a.email, unit:a.unit, unitKey:a.unitKey,
        decision:decision, quality:quality, replacement:replacement, redFlags:redFlags,
        premium: (st==='draft'?0:prem), needs:needs.map(function(x){return x.need;}), plans:needs.map(function(x){return x.plan;}),
        clientName: pick(['M. Singh','A. Ramkissoon','G. Robert','R. Merritt','K. Ali','J. Boodhoo','S. Moses','V. Persad','D. Charles','N. Baksh'])
      });
    }
  });
  return rows;
}

// ---- session/state ----
var SESSION=null;      // {email,name,role,unitKey,unit,code,scope}
var ALL=[];            // all rows visible to this user (already role-scoped)
var SRC='sample';      // 'live' | 'sample'
var LOAD_ERROR='';     // non-empty when the last refresh failed — surfaced, never papered over
var FILTERS={range:'30',unit:'all',agent:'all',status:'all',search:''};
var VIEW=[];                                   // current filtered rows (for simulators/podium)
var PODIUM_METRIC='count';                     // count | prem | avgQ | pr
var SIM={perFF:25,perAppr:75,perProc:150,pct:1}; // incentive scheme
var PACE_ADD=0;                                // +N fact finds per active agent (pace sim)
var SORT={key:'count',dir:-1};

// ---- auth ----
// Derives the visible scope from the role the SERVER returned. Kept as a
// fallback only: if the server sends an explicit `scope` object, that wins —
// see doLogin(). Anything unrecognised falls to the narrowest scope.
// Who reports to whom. Mirrors RRB_UNIT_PARENT on the server — if you change
// it there, change it here. An Assistant Branch Manager sees their own unit and
// the units beneath them, NOT the whole branch.
var UNIT_PARENT={ricky:null,kerwyn:'ricky',gary:'kerwyn',akaash:'ricky'};
function unitsUnder(key){
  var out=[key],grew=true;
  while(grew){ grew=false;
    for(var k in UNIT_PARENT){ if(out.indexOf(k)<0 && out.indexOf(UNIT_PARENT[k])>-1){ out.push(k); grew=true; } }
  }
  return out;
}
function scopeFor(a){
  var role=String(a && a.role || '');
  if(/branch manager/i.test(role) && !/assistant/i.test(role)) return {kind:'branch'};
  if(/manager/i.test(role)){
    var key=a.unitKey||'';
    if(!key || !(key in UNIT_PARENT)) return {kind:'unit',unitKey:key};
    if(UNIT_PARENT[key]===null) return {kind:'branch'};
    return {kind:'units',unitKeys:unitsUnder(key)};
  }
  return {kind:'agent',code:a.code||''};
}
// Does a scope cover this unit? Understands every scope shape the server sends.
function scHasUnit(sc,u){
  if(!sc) return false;
  if(sc.kind==='branch') return true;
  if(sc.kind==='units')  return (sc.unitKeys||[]).indexOf(u)>-1;
  if(sc.kind==='unit')   return u===sc.unitKey;
  return false;
}
// True when the scope spans more than one unit — drives the unit picker and
// the head-to-head card, which are meaningless for a single unit.
function scMultiUnit(sc){
  if(!sc) return false;
  if(sc.kind==='branch') return true;
  return sc.kind==='units' && (sc.unitKeys||[]).length>1;
}
// Sign-in is decided by the server, full stop.
//
// This used to fall back to "any directory email + any non-empty password" when
// the server call did not return ok — which included the case where the server
// had just REJECTED the password. Since the directory ships in this page, that
// was 33 known-valid usernames with no password at all. The fallback is gone:
// an unreachable server now reports that plainly instead of letting people in.
// Fills the sign-in dropdown from the branch Access tab.
//
// This runs before anyone has signed in, so it is the one unauthenticated call
// the dashboard makes. The server returns names and agent codes only — never
// email addresses. The branch's staff addresses were stripped out of this page
// once already and must not come back in through the sign-in box.
//
// If the list cannot be fetched the field falls back to a typed agent code, so
// a server hiccup locks nobody out.
async function loadAccessNames(){
  // Nothing to load any more. Sign-in is a typed agent number, so the branch
  // roster is no longer published to anyone who opens the page. Kept as a
  // function because the boot sequence calls it; it now only restores the
  // number this device used last.
  var sel=document.getElementById('liName');
  if(!sel) return;
  try{
    var e0=document.getElementById('liErr');
    if(e0) e0.textContent='';
    // Bring back whoever signed in last on this device — it is the common case,
    // and it is not a secret: the whole list is on the page anyway.
    try{
      var last=localStorage.getItem('rrbLastCode');
      if(last) sel.value=last;
    }catch(e){}
  }catch(e){}
}

// Degrade to a typed agent code rather than an unusable form.
function signInFallback(why){
  var sel=document.getElementById('liName');
  if(!sel) return;
  var inp=document.createElement('input');
  inp.id='liName'; inp.type='text'; inp.placeholder='Your agent number, e.g. A10024';
  inp.required=true; inp.autocomplete='username';
  inp.className=sel.className;
  sel.parentNode.replaceChild(inp,sel);
  var note=document.getElementById('liErr');
  if(note) note.textContent=why+' Enter your agent number instead.';
}

async function doLogin(ev){
  ev.preventDefault();
  var sel=document.getElementById('liName');
  var code=(sel ? sel.value : '').trim().toUpperCase();
  if(sel) sel.value=code;
  var name='';   // the server returns the real name; nothing is known before that
  var pass=document.getElementById('liPass').value;
  var err=document.getElementById('liErr'); err.textContent='';
  var btn=document.getElementById('liBtn'); btn.disabled=true; btn.textContent='Signing in…';

  var ep=getEndpoint(); var who=null;
  try{
    if(!ep) throw new Error('no-endpoint');
    var url=ep+(ep.indexOf('?')>-1?'&':'?')+'action=login&code='+encodeURIComponent(code)+'&pw='+encodeURIComponent(pass);
    var j=await fetchJson(url);
    if(j && j.ok){
      // Identity, role and scope come from the server response — not from the
      // client-side roster — so a tampered page cannot widen its own access.
      who={email:j.email||'',name:j.name||name,role:j.role||'Agent',
           unitKey:j.unitKey||'',unit:j.unit||'',code:j.code||code,
           // Proof this browser passed the password check. An agent code says
           // who you claim to be and proves nothing — it is published by
           // ?action=access_names. Later calls present this instead.
           token:j.token||''};
      // An explicit server-supplied scope wins over inferring one from the role.
      if(j.scope && j.scope.kind) who.scope=j.scope;
      try{ localStorage.setItem('rrbLastCode', who.code||code); }catch(e){}
      // Hand the signed-in identity to the fact find form on this device, so
      // "Advisor Email (auto)" actually fills. The email comes from the Access
      // sheet via the server's login response — the agent never types it.
      // The form's Sign out button clears this key.
      try{ localStorage.setItem('rrbSession', JSON.stringify({
        code: who.code||code, name: who.name||'', email: who.email||'',
        role: who.role||'', unit: who.unit||'', at: Date.now()
      })); }catch(e){}
    } else if (j && j.success === false && /unknown action/i.test(String(j.message||''))) {
      // The server answered, but it has never heard of "login". That is a
      // deployment that has not been updated, not a wrong password - and
      // telling someone to check their password sends them looking in
      // entirely the wrong place, which is exactly what happened here.
      err.innerHTML = 'Sign-in is not switched on yet. The branch server does not have the ' +
        '<code>login</code> action, which means the Apps Script deployment has not been updated. ' +
        '<strong>No password will work until it is.</strong><br>' +
        '<span style="font-weight:400">Nothing is wrong with your details. ' +
        'The fact find itself works &mdash; open <code>/ffproject</code> directly.</span>';
    } else {
      err.textContent=(j && j.error) ? j.error : 'Sign-in failed. Check your name and password.';
    }
  }catch(e){
    err.textContent = (e && e.message==='no-endpoint')
      ? 'No data endpoint is configured, so sign-in is unavailable.'
      : (e && e.name==='AbortError')
        ? 'The branch server did not answer in time. It sleeps when unused and can take a few seconds to wake — press Sign in again.'
        : 'Cannot reach the branch server. Check your connection and try again.';
  }

  btn.disabled=false; btn.textContent='Sign in';
  if(!who) return false;
  SESSION=Object.assign({},who,{scope:who.scope||scopeFor(who)});
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('appView').classList.remove('hide');
  document.getElementById('whoName').textContent=SESSION.name;
  document.getElementById('whoRole').textContent=SESSION.role+(SESSION.scope.kind==='unit'?' · '+UNIT[SESSION.scope.unitKey]:'');
  await refreshData();
  return false;
}
// Where the fact-find form lives. Relative path assumes it's hosted alongside
// this dashboard (e.g. both deployed to the same Netlify site). Change to an
// absolute URL if the form is hosted elsewhere.
var FACTFIND_FORM_URL = 'FFPROJECT.html';
// "+ New Fact Find" — lets ANY signed-in user (manager or agent) jump straight
// into a blank fact find as themselves, from the branch dashboard. The form
// safely clears any stale draft on this device first (with confirmation) —
// see maybeAbortInitForFreshStart() in FFPROJECT.html.
function openNewFactFind(){

function logout(){
  SESSION=null;

  document.getElementById('loginView').classList.remove('hide');

  document.getElementById('srcNote').textContent='';

// ---- data ----
// Live rows, or explicit demo data, or an honest error. There is deliberately
// no third path: the old code silently substituted real imported client rows
// whenever the endpoint was slow or unreachable, so the dashboard looked live
// while showing stale data with no indication anything had gone wrong.
async function refreshData(){
  var rows=null, ep=getEndpoint();
  LOAD_ERROR='';
  if(!DEMO_MODE) NOW=new Date();   // re-read the clock so a long-open tab stays current

  if(DEMO_MODE){
    setRoster(DEMO_ROSTER,'demo');
    rows=genSample(); SRC='sample';
  } else if(!ep){
    LOAD_ERROR='No data endpoint is configured.';
  } else {
    try{
      // Sends the token AND the old parameters during the changeover, so this
      // page works against either version of the server. Once the server patch
      // is live only the token is read; email/code are ignored.
      var url=ep+(ep.indexOf('?')>-1?'&':'?')+'action=data&token='+encodeURIComponent(SESSION.token||'')+
              '&email='+encodeURIComponent(SESSION.email||'')+
              '&code='+encodeURIComponent(SESSION.code||'');
      var j=await fetchJson(url);
      if(j && j.ok && Array.isArray(j.rows)){ rows=j.rows.map(normalizeRow); SRC='live'; }
      else if(j && j.expired){ logout(); return; }
      else LOAD_ERROR=(j && j.error) ? j.error : 'The server returned no data.';
    }catch(e){
      LOAD_ERROR='Cannot reach the branch server. Showing nothing rather than stale figures.';
    }
    if(rows) await loadRoster(rows);
  }

  if(!rows){ ALL=[]; buildFilterBar(); render(); return; }

  // Role scoping. The server is expected to scope ?action=data already; this is
  // a second line of defence, not the only one — the data no longer ships in
  // the page, so there is nothing here to peel back by editing the client.
  var sc=SESSION.scope;
  ALL=rows.filter(function(r){
    if(sc.kind==='agent')  return r.agentCode===sc.code;
    return scHasUnit(sc, r.unitKey);
    return false;
  });
  buildFilterBar();
  render();
}
function normalizeRow(r){ // tolerant mapping from a live payload row
  var email=(r.agentEmail||r['Agent Email']||'').toLowerCase();
  var a=ROSTER_BY_EMAIL[email];
  var code=r.agentCode||r['Agent Code']||(a&&a.code)||'';
  var unitKey=(a&&a.unitKey)|| r.unitKey ||'';
  var needs=[]; var plans=[];
  for(var i=1;i<=6;i++){ if(r['rec'+i+'Need']) needs.push(r['rec'+i+'Need']); if(r['rec'+i+'Rec']) plans.push(r['rec'+i+'Rec']); }
  var prem=0; for(var j=1;j<=6;j++){ prem+= parseFloat(String(r['rec'+j+'Prem']||'').replace(/[^0-9.]/g,''))||0; }
  return {
    // Stable synthetic id for rows the sheet has not stamped yet. Math.random()
    // gave a different id on every normalize, so nothing could be keyed on it
    // and duplicates were indistinguishable from distinct rows.
    id:r.submissionId||r['Submission ID']||('tmp:'+email+':'+(r.submittedAt||r['Submitted At']||'')),
    submittedAt:r.submittedAt||r['Submitted At']||r.submitted||NOW.toISOString(),
    approvedAt:r.approvedAt||r['Approved At']||'',
    status:(r.status||r['Status']||'pending_review'),
    appType:(r.appType||r['App Type']||'full'),
    advisorName:r.advisorName||r['Advisor Name']||(a&&a.name)||'—',
    agentCode:code, agentEmail:email, unit:(a&&a.unit)||UNIT[unitKey]||'—', unitKey:unitKey,
    decision:r.finalDecide||r.decision||'',
    quality: parseInt(r.naqScore||r['FF Quality']||r.quality||0,10)||0,
    replacement: (String(r.repDetected||r.replacement||'').toUpperCase()==='YES'||r.replacement===true),
    redFlags: parseInt(r.redFlags||0,10)||0,
    premium: prem||parseFloat(String(r.premium||'').replace(/[^0-9.]/g,''))||0,
    needs:needs, plans:plans, clientName:r.clientName||r['Client Name']||'—'
  };
}

// ---- filtering ----
function inRange(iso){
  if(FILTERS.range==='all') return true;
  var d=new Date(iso); var days=(NOW-d)/86400000;
  return days <= ({ '7':7,'30':30,'90':90 }[FILTERS.range]||1e9);
}
function statusGroup(s){
  if(/approved|complete/i.test(s)) return 'approved';
  if(/branch_manager/i.test(s)) return 'pending';
  if(/review/i.test(s)) return 'review';
  if(/declin/i.test(s)) return 'declined';
  return 'draft';
}
function filtered(){
  return ALL.filter(function(r){
    if(!inRange(r.submittedAt)) return false;
    if(FILTERS.unit!=='all' && r.unitKey!==FILTERS.unit) return false;
    if(FILTERS.agent!=='all' && r.agentCode!==FILTERS.agent) return false;
    if(FILTERS.status!=='all' && statusGroup(r.status)!==FILTERS.status) return false;
    if(FILTERS.search){ var q=FILTERS.search.toLowerCase(); if((r.advisorName+' '+r.clientName+' '+r.agentCode).toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
}

// ---- filter bar ----
function buildFilterBar(){
  var sc=SESSION.scope; var bar=document.getElementById('filterBar');
  var h='';
  h+='<div class="seg" id="segRange">'+['all|All time','90|90d','30|30d','7|7d'].map(function(o){var p=o.split('|');return '<button data-r="'+p[0]+'" class="'+(FILTERS.range===p[0]?'on':'')+'" onclick="setF(\'range\',\''+p[0]+'\')">'+p[1]+'</button>';}).join('')+'</div>';
  if(scMultiUnit(sc)){
    var pickable=Object.keys(UNIT).filter(function(k){ return scHasUnit(sc,k); });
    h+='<select onchange="setF(\'unit\',this.value)"><option value="all">All units</option>'+pickable.map(function(k){return '<option value="'+k+'" '+(FILTERS.unit===k?'selected':'')+'>'+UNIT[k]+'</option>';}).join('')+'</select>';
  }
  if(sc.kind!=='agent'){
    var ags=uniqueAgents();
    h+='<select onchange="setF(\'agent\',this.value)"><option value="all">All agents</option>'+ags.map(function(a){return '<option value="'+a.code+'" '+(FILTERS.agent===a.code?'selected':'')+'>'+a.name+'</option>';}).join('')+'</select>';
  }
  h+='<select onchange="setF(\'status\',this.value)">'+['all|All statuses','approved|Approved','pending|Pending BM','review|In review','draft|Draft','declined|Declined'].map(function(o){var p=o.split('|');return '<option value="'+p[0]+'" '+(FILTERS.status===p[0]?'selected':'')+'>'+p[1]+'</option>';}).join('')+'</select>';
  h+='<div class="spacer" style="flex:1"></div>';
  h+='<input class="search" placeholder="Search agent / client…" value="'+FILTERS.search.replace(/"/g,'&quot;')+'" oninput="setF(\'search\',this.value)">';
  // active click-filter chips
  ['unit','agent'].forEach(function(k){ if(FILTERS[k]!=='all'){ var lbl=k==='unit'?UNIT[FILTERS.unit]:(agentName(FILTERS.agent)); h+='<span class="chip">'+lbl+'<button onclick="setF(\''+k+'\',\'all\')">×</button></span>'; }});
  bar.innerHTML=h;
}
function uniqueAgents(){ var seen={},out=[]; ALL.forEach(function(r){ if(!seen[r.agentCode]){seen[r.agentCode]=1;out.push({code:r.agentCode,name:r.advisorName});}}); out.sort(function(a,b){return a.name<b.name?-1:1;}); return out; }
function agentName(code){ var a=ALL.filter(function(r){return r.agentCode===code;})[0]; return a?a.advisorName:code; }
function setF(k,v){ FILTERS[k]=v; buildFilterBar(); render(); }

// ---- aggregation + render ----
function money(n){ n=Math.round(n); return 'TT$'+n.toLocaleString('en-US'); }
// rows matching the non-date filters (unit/agent/status/search) — the comparison base
function baseRows(){
  return ALL.filter(function(r){
    if(FILTERS.unit!=='all' && r.unitKey!==FILTERS.unit) return false;
    if(FILTERS.agent!=='all' && r.agentCode!==FILTERS.agent) return false;
    if(FILTERS.status!=='all' && statusGroup(r.status)!==FILTERS.status) return false;
    if(FILTERS.search){ var q=FILTERS.search.toLowerCase(); if((r.advisorName+' '+r.clientName+' '+r.agentCode).toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
}
function periodDays(){ return {'7':7,'30':30,'90':90}[FILTERS.range]||30; }
function windowRows(base,startAgo,endAgo){ return base.filter(function(r){ var d=(NOW-new Date(r.submittedAt))/86400000; return d>=endAgo && d<startAgo; }); }
function metricSet(rows){
  var decided=rows.filter(function(r){return r.decision==='Proceed'||r.decision==='Decline';});
  var proceed=decided.filter(function(r){return r.decision==='Proceed';}).length;
  var q=rows.filter(function(r){return r.quality>0;});
  return {
    count:rows.length,
    approved:rows.filter(function(r){return statusGroup(r.status)==='approved';}).length,
    pending:rows.filter(function(r){var g=statusGroup(r.status);return g==='pending'||g==='review';}).length,
    pipeline:rows.filter(function(r){return statusGroup(r.status)!=='draft';}).reduce(function(s,r){return s+r.premium;},0),
    avgQ: q.length? Math.round(q.reduce(function(s,r){return s+r.quality;},0)/q.length):0,
    proceedRate: decided.length? Math.round(proceed/decided.length*100):0, proceed:proceed, decided:decided.length,
    repl:rows.filter(function(r){return r.replacement;}).length,
    redflags:rows.reduce(function(s,r){return s+(r.redFlags||0);},0)
  };
}
function deltaHtml(cur,prev,opt){
  opt=opt||{}; if(prev===0 && cur===0) return '<span class="delta flat">—</span>';
  var d = prev===0? 100 : Math.round((cur-prev)/Math.abs(prev)*100);
  var goodUp = opt.inverse? d<0 : d>0;
  var cls = d===0?'flat':(goodUp?'up':'down');
  var arrow = d>0?'▲':(d<0?'▼':'▬');
  return '<span class="delta '+cls+'">'+arrow+' '+Math.abs(d)+'% <span style="color:var(--muted);font-weight:500">vs prev '+periodDays()+'d</span></span>';
}

function render(){
  // Failed load: say so and render nothing. Blank panels beat confident-looking
  // panels built from data that is not this user's, or not from today.
  if(LOAD_ERROR){
    document.getElementById('execSummary').innerHTML=
      '<div class="card" style="border-left:4px solid #DC2626">'+
      '<h3 style="color:#DC2626">Could not load branch data</h3>'+
      '<div class="csub">'+escapeHtml(LOAD_ERROR)+'</div>'+
      '<div style="margin-top:10px"><button class="icon-btn" onclick="refreshData()">↻ Try again</button></div>'+
      '</div>';
    document.getElementById('kpiGrid').innerHTML='';
    document.getElementById('chartGrid').innerHTML='';
    document.getElementById('caseFlow').innerHTML='';
    var b=document.getElementById('srcBadge');
    if(b){ b.className='src-badge sample'; b.textContent='No data'; }
    document.getElementById('srcNote').textContent='';
    return;
  }
  var rows=filtered();
  var base=baseRows(), D=periodDays();
  var cur=metricSet(windowRows(base,D,0)), prev=metricSet(windowRows(base,2*D,D));
  renderExec(rows,cur,prev);
  renderKPIs(rows,cur,prev);
  renderCharts(rows);
  renderCaseFlow(rows);
  var badge=document.getElementById('srcBadge');
  if(badge){ badge.className='src-badge '+(SRC==='live'?'live':'sample'); badge.textContent= SRC==='live'?'Live data':'DEMO — not real'; }
  var srcEl=document.getElementById('srcNote');
  var rosterNote = (ROSTER_SOURCE==='derived')
    ? ' · <span class="src-sample">Roster derived from submissions</span> — agents with no fact finds this period cannot be listed; add an <code>?action=roster</code> handler to show them.'
    : '';
  srcEl.innerHTML= SRC==='live'
    ? 'Data source: <span class="src-live">live from the branch sheet</span> · '+ALL.length+' records loaded · '+rows.length+' in view · '+escapeHtml(new Date().toLocaleString('en-GB'))+rosterNote
    : 'Data source: <span class="src-sample">DEMO — synthetic people and clients</span>, <strong>not real branch data</strong>. Remove <code>?demo=1</code> from the URL and sign in for live figures · '+rows.length+' in view';
}

// Monthly branch target (fact finds). Tune here or wire to a sheet cell later.
var BRANCH_MONTHLY_TARGET=45;

function renderExec(rows,cur,prev){
  var el=document.getElementById('execSummary');
  var scopeLabel = SESSION.scope.kind==='branch'?'Branch-wide':(SESSION.scope.kind==='unit'?(SESSION.unit||'Your unit'):'Your');
  var ins=[];
  // momentum
  var dCount= prev.count===0?(cur.count>0?100:0):Math.round((cur.count-prev.count)/Math.abs(prev.count)*100);
  ins.push({t:(dCount>=0?'pos':'neg'), ic:(dCount>=0?'📈':'📉'), h:'Submissions '+(dCount>=0?'up':'down')+' '+Math.abs(dCount)+'%', b:cur.count+' this '+periodDays()+'d vs '+prev.count+' prior.'});
  // quality
  ins.push({t: cur.avgQ>=80?'pos':'warn2', ic:'🎯', h:'Avg quality '+cur.avgQ+'/100', b: cur.avgQ>=80?'Audit-ready across the period.':'Below the 80 target — coaching opportunity.'});
  // conversion
  ins.push({t: cur.proceedRate>=65?'pos':'warn2', ic:'✅', h:'Proceed rate '+cur.proceedRate+'%', b: cur.proceed+' of '+cur.decided+' decided cases moved forward.'});
  // quiet agents (branch/unit only)
  if(SESSION.scope.kind!=='agent'){
    var quiet=quietAgents(21);
    if(quiet.length) ins.push({t:'neg', ic:'😴', h:quiet.length+' agent'+(quiet.length>1?'s':'')+' gone quiet', b:'No submission in 21 days: '+quiet.slice(0,3).map(function(a){return a.name.split(' ')[0];}).join(', ')+(quiet.length>3?'…':'')+'.'});
    else ins.push({t:'pos', ic:'🔥', h:'Full team active', b:'Every agent has submitted in the last 21 days.'});
  }
  // stuck cases
  var stuck=rows.filter(function(r){var g=statusGroup(r.status);return (g==='pending'||g==='review') && (NOW-new Date(r.submittedAt))/86400000>3;}).length;
  if(stuck) ins.push({t:'warn2', ic:'⏳', h:stuck+' case'+(stuck>1?'s':'')+' waiting >3 days', b:'Sitting in review — clear these to keep agents moving.'});
  // replacement compliance
  if(cur.repl) ins.push({t:'info', ic:'🛡️', h:cur.repl+' replacement flag'+(cur.repl>1?'s':''), b:'GLOC replacement cases in-period — confirm declarations are attached.'});
  // pipeline
  ins.push({t:'info', ic:'💰', h:money(cur.pipeline)+' pipeline', b:'Monthly recommended premium generated this period.'});

  var headline = SESSION.scope.kind==='branch'
    ? 'RR Branch is running at '+cur.count+' fact finds / '+periodDays()+' days'
    : (SESSION.name.split(' ')[0]+'’s '+(SESSION.scope.kind==='unit'?'unit':'')+' — '+cur.count+' fact finds / '+periodDays()+' days');
  el.innerHTML='<div class="exec"><div class="eh"><span class="dot"></span> '+scopeLabel+' insights · auto-generated</div>'+
    '<h2>'+headline+'</h2><div class="esub">Snapshot for '+(FILTERS.range==='all'?'all time':'the last '+periodDays()+' days')+' · compared with the previous '+periodDays()+' days</div>'+
    '<div class="ins">'+ins.map(function(i){return '<div class="i '+i.t+'"><span class="ic">'+i.ic+'</span><div><b>'+i.h+'</b><br><span style="color:rgba(255,255,255,.72)">'+i.b+'</span></div></div>';}).join('')+'</div></div>';
}

function renderKPIs(rows,cur,prev){
  var m=metricSet(rows);
  var total=m.count;
  var wk=rows.filter(function(r){return (NOW-new Date(r.submittedAt))/86400000<=7;}).length;
  // monthly-target progress (based on last 30 days regardless of filter range)
  var last30=windowRows(baseRows(),30,0).length; var tgtPct=Math.min(999,Math.round(last30/BRANCH_MONTHLY_TARGET*100));
  var cards=[
    {label:'Fact finds',val:total,sub:'in current view',cls:'',delta:deltaHtml(cur.count,prev.count)},
    {label:'This week',val:wk,sub:'last 7 days',cls:'blue',delta:''},
    {label:'Pending review',val:m.pending,sub:'awaiting manager sign-off',cls:'warn',delta:deltaHtml(cur.pending,prev.pending,{inverse:true})},
    {label:'Approved',val:m.approved,sub:total?Math.round(m.approved/total*100)+'% of view':'—',cls:'',delta:deltaHtml(cur.approved,prev.approved)},
    {label:'Avg FF quality',val:m.avgQ+'/100',sub:m.avgQ>=80?'audit-ready':'coaching opportunity',cls: m.avgQ>=80?'':'warn',delta:deltaHtml(cur.avgQ,prev.avgQ)},
    {label:'Proceed rate',val:m.proceedRate+'%',sub:m.proceed+' of '+m.decided+' decided',cls:'violet',delta:deltaHtml(cur.proceedRate,prev.proceedRate)},
    {label:'Pipeline premium',val:money(m.pipeline),sub:'monthly, recommended',cls:'',delta:deltaHtml(cur.pipeline,prev.pipeline)},
    {label:'Monthly target',val:tgtPct+'%',sub:last30+' / '+BRANCH_MONTHLY_TARGET+' (last 30d)',cls: tgtPct>=100?'':'warn',delta:''}
  ];
  document.getElementById('kpiGrid').innerHTML=cards.map(function(c){
    return '<div class="kpi '+c.cls+'"><div class="accent"></div><div class="label">'+c.label+'</div><div class="val">'+c.val+'</div><div class="sub">'+c.sub+'</div>'+(c.delta||'')+'</div>';
  }).join('');
}

// agents (in current scope) with no submission in N days
function quietAgents(days){
  var last={}; ALL.forEach(function(r){ var t=new Date(r.submittedAt).getTime(); if(!last[r.agentCode]||t>last[r.agentCode].t) last[r.agentCode]={t:t,name:r.advisorName}; });
  // roster in scope
  var scopeAgents=ROSTER.filter(function(a){ var sc=SESSION.scope; if(sc.kind==='agent')return a.code===sc.code; return scHasUnit(sc,a.unitKey); });
  var out=[];
  scopeAgents.forEach(function(a){ if(!/agent/i.test(a.role))return; var l=last[a.code]; var d=l?(NOW-l.t)/86400000:999; if(d>days) out.push({name:a.name,code:a.code,days:Math.round(d)}); });
  return out.sort(function(x,y){return y.days-x.days;});
}

/* ---------- SVG chart helpers ---------- */
var PAL=['#0D9488','#14B8A6','#2563EB','#7C3AED','#F59E0B','#DC2626','#0EA5E9','#64748B'];
function tt(html,ev){ var t=document.getElementById('tt'); t.innerHTML=html; t.style.opacity=1; t.style.left=Math.min(ev.clientX+14,window.innerWidth-250)+'px'; t.style.top=(ev.clientY+14)+'px'; }
function ttHide(){ document.getElementById('tt').style.opacity=0; }

function areaChart(rows){ // fact finds per week
  var buckets={}; var weeks=10;
  for(var w=weeks-1;w>=0;w--){ var d=new Date(NOW); d.setDate(d.getDate()-w*7); var key=isoWeekKey(d); buckets[key]={label:fmtWk(d),count:0}; }
  rows.forEach(function(r){ var k=isoWeekKey(new Date(r.submittedAt)); if(buckets[k]) buckets[k].count++; });
  var arr=Object.keys(buckets).map(function(k){return buckets[k];});
  var W=100,H=42,max=Math.max(1,Math.max.apply(null,arr.map(function(b){return b.count;})));
  var pts=arr.map(function(b,i){ var x=(i/(arr.length-1))*W; var y=H-(b.count/max)*H; return [x,y]; });
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+W+' '+H+' L0 '+H+' Z';
  var dots=pts.map(function(p,i){return '<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="1.6" fill="#0D9488" onmousemove="tt(\'<b>'+arr[i].label+'</b><br>'+arr[i].count+' fact finds\',event)" onmouseleave="ttHide()"/>';}).join('');
  var svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:150px">'+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D9488" stop-opacity=".28"/><stop offset="100%" stop-color="#0D9488" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#ag)"/><path d="'+line+'" fill="none" stroke="#0D9488" stroke-width="1.4" vector-effect="non-scaling-stroke"/>'+dots+'</svg>';

  return svg+labels;
}
function isoWeekKey(d){ var t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate(); }
function fmtWk(d){ var t=new Date(d); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

function donut(data,filterKey){ // data:[{label,value,key}]
  var total=data.reduce(function(s,d){return s+d.value;},0)||1;
  var R=42,C=2*Math.PI*R,off=0,cx=50,cy=50;
  var segs=data.map(function(d,i){ var frac=d.value/total; var len=frac*C; var dash=len+' '+(C-len);
    var s='<circle class="seg" r="'+R+'" cx="'+cx+'" cy="'+cy+'" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="16" stroke-dasharray="'+dash+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')" '+
      (filterKey?'onclick="setF(\''+filterKey+'\',\''+d.key+'\')" ':'')+' onmousemove="tt(\'<b>'+d.label+'</b><br>'+d.value+' ('+Math.round(frac*100)+'%)\',event)" onmouseleave="ttHide()"/>';
    off+=len; return s; }).join('');
  var svg='<svg viewBox="0 0 100 100" style="width:130px;height:130px">'+segs+'<text x="50" y="47" text-anchor="middle" font-size="17" font-weight="800" fill="#1E293B" font-family="Inter">'+total+'</text><text x="50" y="60" text-anchor="middle" font-size="7" fill="#556070" font-family="Inter">TOTAL</text></svg>';
  var leg='<div class="legend">'+data.map(function(d,i){return '<div class="li"><span class="sw" style="background:'+PAL[i%PAL.length]+'"></span>'+d.label+' <b style="margin-left:2px;color:var(--muted)">'+d.value+'</b></div>';}).join('')+'</div>';
  return '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+svg+'<div style="flex:1;min-width:120px">'+leg+'</div></div>';
}

function hbars(data,opt){ // data:[{label,value,sub,key}]

// tiny inline sparkline (area+line) with an emphasized endpoint
function sparkline(vals,opt){ opt=opt||{}; var w=opt.w||74,h=opt.h||22,pad=2; var max=Math.max(1,Math.max.apply(null,vals));
  var n=vals.length; var pts=vals.map(function(v,i){var x=pad+(i/(n-1))*(w-2*pad);var y=h-pad-(v/max)*(h-2*pad);return [x,y];});
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+(w-pad)+' '+(h-pad)+' L'+pad+' '+(h-pad)+' Z';
  var last=pts[pts.length-1]; var col=opt.color||'#0D9488';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block"><path d="'+area+'" fill="'+col+'" fill-opacity=".13"/><path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.4"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2" fill="'+col+'"/></svg>';

function agentAgg(rows){
  var m={}; rows.forEach(function(r){ var a=m[r.agentCode]||(m[r.agentCode]={name:r.advisorName,code:r.agentCode,count:0,q:0,qn:0,proceed:0,decided:0,appr:0,prem:0,weeks:{}}); a.count++; if(r.quality>0){a.q+=r.quality;a.qn++;} if(r.decision==='Proceed'){a.proceed++;a.decided++;} else if(r.decision==='Decline')a.decided++; if(statusGroup(r.status)==='approved')a.appr++; if(statusGroup(r.status)!=='draft')a.prem+=r.premium; a.weeks[isoWeekKey(new Date(r.submittedAt))]=1; });
  return Object.keys(m).map(function(k){var a=m[k];a.avgQ=a.qn?Math.round(a.q/a.qn):0;a.pr=a.decided?Math.round(a.proceed/a.decided*100):0;a.activeWeeks=Object.keys(a.weeks).length;return a;});
}
function metricVal(a,metric){ return metric==='prem'?a.prem:(metric==='avgQ'?a.avgQ:(metric==='pr'?a.pr:a.count)); }
function metricFmt(v,metric){ return metric==='prem'?money(v):(metric==='avgQ'?v+'/100':(metric==='pr'?v+'%':v)); }
function setPodiumMetric(m){ PODIUM_METRIC=m; document.querySelectorAll('#podiumToggle button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);}); renderPodium(); }
// ── WHERE EVERY CASE IS, AND WHAT THE MANAGER SAID ──────────────────────────
//
// The dashboard counted cases but never showed one. A branch manager asking
// "what is stuck, and what did we tell them?" had to open the sheet.
//
// Three things live here that exist nowhere else:
//   · which stage each case is sitting in, and how long it has sat there
//   · the manager's verdict and the comment they actually wrote
//   · turnaround against the branch's stated one working day
//
// Comments are shown in full. A summarised comment is a changed comment, and
// this is the record an agent is expected to act on.

var FLOW_STAGES = ['Submitted', 'With manager', 'Reviewed', 'With agent', 'Signed'];

function flowStageOf(r) {
  var st = String(r.status || '').toLowerCase();
  if (st.indexOf('draft') > -1) return 0;
  if (st.indexOf('approv') > -1 || st.indexOf('declin') > -1) return 3;   // back with the agent
  if (st.indexOf('signed') > -1 || st.indexOf('complete') > -1) return 4;
  return 1;                                                              // waiting on the manager
}

function daysSince(v) {
  if (!v) return null;
  var t = new Date(v).getTime();
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

// Working days between two dates — the branch promises one, and counting
// calendar days would make every Friday submission look late.
function workingDaysBetween(a, b) {
  var s = new Date(a), e = new Date(b);
  if (isNaN(s.getTime()) || isNaN(e.getTime())) return null;
  var n = 0;
  s.setHours(0,0,0,0); e.setHours(0,0,0,0);
  while (s < e) { s.setDate(s.getDate()+1); var d = s.getDay(); if (d !== 0 && d !== 6) n++; }
  return n;
}

function renderCaseFlow(rows) {
  var host = document.getElementById('caseFlow');
  if (!host) return;

  var waiting = [], back = [], done = [];
  rows.forEach(function (r) {
    var st = flowStageOf(r);
    if (st === 1) waiting.push(r);
    else if (st === 3) back.push(r);
    else if (st === 4) done.push(r);
  });

  // Turnaround, measured only on cases that actually came back.
  var turns = [];
  rows.forEach(function (r) {
    if (!r.approvedAt || !r.submittedAt) return;
    var w = workingDaysBetween(r.submittedAt, r.approvedAt);
    if (w !== null) turns.push(w);
  });
  var avg = turns.length ? (turns.reduce(function(a,b){return a+b;},0) / turns.length) : null;
  var late = waiting.filter(function (r) {
    var w = workingDaysBetween(r.submittedAt, new Date());
    return w !== null && w > 1;
  });

  var h = '';
  h += '<div class="card"><h3>Case progress &amp; manager feedback</h3>';
  h += '<div class="csub">Where each case is sitting, how long it has been there, and what the manager wrote.</div>';

  // headline strip
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px">';
  h += flowStat('With the manager', waiting.length, late.length ? late.length + ' over 1 working day' : 'all inside target', late.length ? 'bad' : 'good');
  h += flowStat('Back with the agent', back.length, 'reviewed, awaiting the client', 'mid');
  h += flowStat('Average turnaround',
                avg === null ? '—' : (avg < 1 ? 'same day' : avg.toFixed(1) + ' day' + (avg >= 2 ? 's' : '')),
                turns.length ? 'across ' + turns.length + ' reviewed' : 'nothing reviewed yet',
                avg === null ? 'mid' : (avg <= 1 ? 'good' : 'bad'));
  h += '</div>';

  var list = waiting.concat(back).sort(function (a, b) {
    return new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0);
  }).slice(0, 12);

  if (!list.length) {
    h += '<div class="csub" style="margin-top:14px">Nothing in flight in this view.</div></div>';
    host.innerHTML = h;
    return;
  }

  h += '<div style="margin-top:14px">';
  list.forEach(function (r) { h += flowCard(r); });
  h += '</div>';

  var extra = waiting.length + back.length - list.length;
  if (extra > 0) h += '<div class="csub" style="margin-top:10px">' + extra + ' more not shown &mdash; narrow the filters to see them.</div>';
  h += '</div>';
  host.innerHTML = h;
}

function flowStat(label, value, sub, band) {
  var c = band === 'bad' ? '#DC2626' : band === 'good' ? '#0D9488' : '#B45309';
  return '<div style="flex:1 1 170px;min-width:150px;border:1px solid var(--line);border-left:3px solid ' + c +
    ';border-radius:10px;padding:9px 12px;background:#fff">' +
    '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#94A3B8;font-weight:700">' + label + '</div>' +
    '<div style="font-size:20px;font-weight:800;color:' + c + ';line-height:1.15">' + value + '</div>' +
    '<div style="font-size:11px;color:#64748b">' + sub + '</div></div>';
}

function flowCard(r) {
  var stage = flowStageOf(r);
  var waited = workingDaysBetween(r.submittedAt, r.approvedAt || new Date());
  var overdue = stage === 1 && waited !== null && waited > 1;
  var agreed = /^agree/i.test(String(r.mgrAgree || ''));
  var declined = /^disagree/i.test(String(r.mgrAgree || ''));
  var note = String(r.mgrComments || r.dmGuidance || '').trim();

  var h = '<div style="border:1px solid ' + (overdue ? '#FCA5A5' : 'var(--line)') + ';background:' +
          (overdue ? '#FEF2F2' : '#fff') + ';border-radius:11px;padding:12px 14px;margin-bottom:9px">';

  // who
  h += '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">' +
       '<div style="font-weight:700;font-size:14px">' + escapeHtml(r.clientName || 'Client') +
         '<span style="font-weight:500;color:#64748b;font-size:12.5px"> &middot; ' + escapeHtml(r.advisorName || '') + '</span></div>' +
       '<div style="font-size:12px;color:' + (overdue ? '#991B1B' : '#64748b') + ';font-weight:' + (overdue ? '700' : '500') + '">' +

         '<div style="height:5px;border-radius:3px;background:' + (on ? '#0D9488' : '#E2E8F0') + '"></div>' +

           ';font-weight:' + (i === stage ? '700' : '500') + '">' + s + '</div></td>';
  });
  h += '</tr></table>';

  // verdict + the comment, in full
  if (agreed || declined) {
    h += '<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:' + (agreed ? '#0F766E' : '#B45309') + '">' +

  } else if (stage === 3) {
    h += '<div style="margin-top:6px;font-size:12px;color:#94A3B8;font-style:italic">No written comment recorded.</div>';
  }
  h += '</div>';
  return h;
}

function ring(pct,label,sub){

function heatStrip(rows){
