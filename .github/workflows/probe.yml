name: probe
on:
  push:
    branches: [tts-run]
    paths: ['probe/go']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts faster-whisper
      - name: transcribe and re-voice
        run: |
          python3 - <<'PY'
          import asyncio, edge_tts, json, traceback
          log = open('probe/log.txt','w')
          text = open('probe/line.txt').read().strip()
          try:
              raise SystemExit
              from faster_whisper import WhisperModel
              m = WhisperModel('base.en', compute_type='int8')
              import subprocess, numpy as np
              import wave
              wv = wave.open('probe/sample16.wav'); raw = wv.readframes(wv.getnframes())
              segs, _ = m.transcribe(np.frombuffer(raw, np.int16).astype(np.float32) / 32768)
              text = ' '.join(s.text.strip() for s in segs)
          except Exception: log.write(traceback.format_exc())

          voices = ['en-US-AndrewNeural','en-US-AndrewMultilingualNeural']
          async def go():
              for v in voices:
                  for r in ['-12%','-4%']:
                      try: await edge_tts.Communicate(text, v, rate=r).save(f'probe/{v}{r}.mp3')
                      except Exception: log.write(v + ' ' + traceback.format_exc())
          asyncio.run(go()); log.close()
          from faster_whisper import WhisperModel
          import glob
          m = WhisperModel('base', compute_type='int8')
          out = {}
          for f in sorted(glob.glob('probe/en-US-*.mp3')):
              try:
                  segs, info = m.transcribe(f)
                  out[f] = [info.language, ' '.join(x.text.strip() for x in segs)]
              except Exception as e: out[f] = ['err', str(e)]
          json.dump(out, open('probe/check.json','w'), indent=1)
          PY
      - if: always()
        run: |
          git config user.name tts-bot; git config user.email tts-bot@users.noreply.github.com
          git add probe && git commit -m "probe output" && git push
