name: Group Client Management build

# Rebuilds /groupclientmanagement from Salesforce and commits it to main, which
# GitHub Pages publishes as rickyrampersadbranch.com. No Netlify: that host
# serves factfind360.com from another repository, and the two never touch.
on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 6:00 AM Trinidad time (10:00 UTC); GitHub may start it a little late
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: gcm-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==46.0.6
      - name: Build pages from Salesforce
        env:
          SF_DOMAIN: ${{ secrets.SF_DOMAIN }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          GCM_CODES: ${{ secrets.GCM_CODES }}
          GCM_CLIENTS: ${{ secrets.GCM_CLIENTS }}
          GCM_BASE_URL: ${{ vars.GCM_BASE_URL }}
        run: python scripts/gcm/build.py
      - name: Commit refreshed pages (GitHub Pages publishes main)
        run: |
          git config user.name "gcm-build"
          git config user.email "gcm-build@users.noreply.github.com"
          git add groupclientmanagement
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Group client pages refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
