name: tts
on:
  push:
    branches: [tts-run]
    paths: ['tts/job.json']
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts; pip show edge-tts | head -2
      - name: voice
        run: |
          python3 - <<'PY'
          import json, asyncio, edge_tts, os, pathlib
          job = json.load(open('tts/job.json'))
          out = pathlib.Path('tts/out'); out.mkdir(exist_ok=True)
          async def one(key, i, text):
              c = edge_tts.Communicate(text, job.get('voices',{}).get(key, job.get('voice','en-US-AndrewNeural')), rate=job.get('rates',{}).get(key, job.get('rate','-12%')), pitch=job.get('pitches',{}).get(key, '+0Hz'), boundary='WordBoundary')
              audio = bytearray(); words = []
              async for ch in c.stream():
                  if ch['type'] == 'audio': audio += ch['data']
                  elif ch['type'] == 'WordBoundary': words.append([ch['offset']/1e4, ch['duration']/1e4, ch['text']])
              d = out / key; d.mkdir(exist_ok=True)
              (d / f'{i:02d}.mp3').write_bytes(bytes(audio))
              json.dump(words, open(d / f'{i:02d}.words.json', 'w'))
          async def main():
              for key, lines in job['films'].items():
                  for i, t in enumerate(lines, 1):
                      for attempt in range(4):
                          try:
                              await one(key, i, t); break
                          except Exception as e:
                              import traceback; open('tts/out/error.txt', 'a').write(f'{key} {i} attempt {attempt}: ' + traceback.format_exc() + '\n')
                              await asyncio.sleep(5 * (attempt + 1))
          asyncio.run(main())
          PY
      - name: check the language of every clip
        run: |
          python3 - <<'PY'
          import json, glob, os
          job = json.load(open('tts/job.json'))
          if not job.get('check'): raise SystemExit(0)
          os.system('pip install -q faster-whisper')
          from faster_whisper import WhisperModel
          m = WhisperModel('base', compute_type='int8')
          out = {}
          for key in job['films']:
              for f in sorted(glob.glob(f'tts/out/{key}/*.mp3')):
                  try:
                      segs, info = m.transcribe(f)
                      out[f] = [info.language, round(info.language_probability, 3), ' '.join(x.text.strip() for x in segs)]
                  except Exception as e: out[f] = ['err', 0, str(e)]
          json.dump(out, open('tts/out/check.json', 'w'), indent=1)
          PY
      - if: always()
        run: |
          git config user.name tts-bot; git config user.email tts-bot@users.noreply.github.com
          git add tts/out && git commit -m "tts output" && git push
