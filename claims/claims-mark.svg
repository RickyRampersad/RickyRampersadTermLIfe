<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" role="img" aria-label="Claims TT · Ricky Rampersad Branch">
  <!-- favicon.svg's own shield and check, in the claims page's copper. Nothing
       here is redrawn: it is the same path as logo-mark.svg, the way
       site-mark.svg is that shield in the homepage's teal and board-mark.png
       is it in the board blue.

       The ramp is deliberately narrow. This one file sits on two grounds —
       the client page's paper #F6F4F1 and the staff page's graphite #1C1D20 —
       so every stop has to clear 3:1 against both, which leaves a window of
       0.137 to 0.285 relative luminance. The brand copper #D08A4E is 2.57:1
       on paper and the deep #6B3C12 is too dark on graphite; these three sit
       inside the window, so the mark reads as a shape on either page. -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#C07A3C"/><stop offset="58%" stop-color="#B2702F"/><stop offset="100%" stop-color="#A25F26"/>
  </linearGradient></defs>
  <path d="M44 9L73 21.5V41C73 60.5 60.5 72 44 78.5C27.5 72 15 60.5 15 41V21.5Z" fill="url(#g)"/>
  <path d="M30 44L39.5 53.5L58 32.5" stroke="#1C1D20" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 44L39.5 53.5L58 32.5" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
