<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Claims TT">
  <title>Claims TT</title>
  <defs>
    <linearGradient id="ctt-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#5B4FE9"/>
      <stop offset="55%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#2E2596"/>
    </linearGradient>
  </defs>

  <!-- the document: a rounded tile with its top-right corner turned back -->
  <path fill="url(#ctt-tile)"
        d="M13 4h27.4a6 6 0 0 1 4.24 1.76l13.6 13.6A6 6 0 0 1 60 23.6V51a9 9 0 0 1-9 9H13a9 9 0 0 1-9-9V13a9 9 0 0 1 9-9z"/>
  <!-- the turned corner, so it reads as paper rather than a plain square -->
  <path fill="#ffffff" fill-opacity=".28"
        d="M40.4 4 60 23.6H46.4a6 6 0 0 1-6-6V4z"/>

  <!-- the claim, settled: a check whose tail keeps rising -->
  <path fill="none" stroke="#ffffff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"
        d="M17 34.5 26.5 44 49 21.5"/>
</svg>
