# This folder, served by Netlify — IF the whole site ever moves there.
#
# DO NOT USE THIS TO PUT claimstt.com ON A SECOND HOST. Decided 13 November
# 2026, and it is a correctness rule rather than a preference: both pages here
# keep the sign-in on the device with localStorage.setItem(TOKEN_KEY, ...),
# and localStorage is PER ORIGIN. Two addresses for this page means two
# separate sign-in states for the same person — a client who signed in on one
# arrives at the other signed out, with no explanation and no way to tell why,
# and the half-finished claim under DRAFT_KEY is invisible from the other side.
# The staff desk has the same split. claimstt.com FORWARDS to
# rickyrampersadbranch.com/claims (GoDaddy 301, forward only); the arrow points
# in, never out. See "Pointing claimstt.com at it" in CLAIMS-SETUP.md.
#
# WHAT THIS FILE IS STILL FOR: the day the whole branch site moves off GitHub
# Pages to Netlify — which the setup notes already float as the better end
# state, because it would let the repository go private without taking the site
# down. Then this folder's rewrites and headers are the ones it needs. Pages
# takes ONE custom domain per repository and the root CNAME holds
# rickyrampersadbranch.com, which is the constraint behind all of this.
#
# THIS FILE IS INERT ON GITHUB PAGES. Pages ignores it, exactly as the root
# netlify.toml is ignored (see the hosting note in CLAUDE.md), so nothing here
# can change what rickyrampersadbranch.com/claims serves. The same files are
# served by both hosts from one folder, so the two can never drift.
#
# IF THAT DAY COMES: Netlify → Add new site → Import from Git → this
# repository, base directory "claims", publish directory ".".
#
# NEVER deploy this by dragging the folder onto Netlify Drop. A manual deploy
# replaces every file, and on 23 August 2026 that silently deleted four pages
# and a 22 MB video from another branch site. Link it to the repository.

[build]
  publish = "."

# The branch shield and the tab icon live at the repository root, which is
# above this publish directory. Proxied from the branch site rather than
# copied, so there is one mark file and it cannot drift from the homepage's.
[[redirects]]
  from = "/site-mark.svg"
  to = "https://rickyrampersadbranch.com/site-mark.svg"
  status = 200

[[redirects]]
  from = "/site-icon.svg"
  to = "https://rickyrampersadbranch.com/site-icon.svg"
  status = 200

# A safety net, not a requirement: anything still written /claims/<file> — an
# old bookmark, a link in a letter already sent, or a path that creeps back
# into the page — resolves to the file itself rather than 404ing. 200 is a
# rewrite, so the address the client sees does not change.
[[redirects]]
  from = "/claims/*"
  to = "/:splat"
  status = 200

# The short addresses the branch already hands out for the main site.
[[redirects]]
  from = "/claim"
  to = "/"
  status = 301

[[redirects]]
  from = "/file-a-claim"
  to = "/"
  status = 301

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 301

# Matches the headers agentmgt.com serves. SAMEORIGIN matters here beyond the
# usual: the claims page signs a client in and keeps their token in
# localStorage, so it must never run inside somebody else's frame — which is
# also why GoDaddy's "forward with masking" is the one option to refuse.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
