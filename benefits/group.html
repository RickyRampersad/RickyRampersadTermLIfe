<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Group Account — Ricky Rampersad Branch</title>
<style>
:root{
  --navy:#08333D; --blue:#0E8FA3; --gold:#F08A24; --lightblue:#E4F4F6;
  --ink:#0E1F2E; --paper:#F7F9FB; --surface:#FFF; --surface2:#EDF2F7;
  --slate:#5C7080; --line:#D3DEE7;
  --go:#1F7A55; --warn:#A9701F; --stop:#A93B2B;
  --sans:"Gill Sans MT","Avenir Next","Segoe UI",system-ui,sans-serif;
  --display:Optima,"Palatino Linotype",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#DCE7EF; --paper:#081520; --surface:#0E2231; --surface2:#142E40;
  --navy:#7FB2D9; --blue:#5FA8DC; --lightblue:#12293A; --slate:#8FA6B8; --line:#1E3B50;
  --go:#4FAE83; --warn:#D4A055; --stop:#D4685A;
}}
:root[data-theme="dark"]{
  --ink:#DCE7EF; --paper:#081520; --surface:#0E2231; --surface2:#142E40;
  --navy:#7FB2D9; --blue:#5FA8DC; --lightblue:#12293A; --slate:#8FA6B8; --line:#1E3B50;
  --go:#4FAE83; --warn:#D4A055; --stop:#D4685A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.2}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.label{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.trow{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.tstages{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.tstage{flex:1;min-width:132px;border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;
  display:flex;flex-direction:column;gap:.1rem;background:var(--paper)}
.tstage .tdot{width:15px;height:15px;border-radius:50%;background:var(--surface2);color:var(--slate);
  font-size:9px;line-height:15px;text-align:center;font-weight:700}
.tstage .tlabel{font-size:12.5px;font-weight:600;line-height:1.3}
.tstage .tsub{font-size:11px;color:var(--slate)}
.tstage.done .tdot{background:var(--go);color:#fff}
.tstage.now{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.tstage.now .tdot{background:var(--gold);color:#fff}
.tstage.todo{opacity:.5}
a{color:var(--blue)}

.demobar{background:var(--navy);color:#fff;padding:.5rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-size:12.5px}
.demobar b{font-weight:700;letter-spacing:.05em}
.demobar .who{margin-left:auto;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.demobar button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:3px;
  padding:.25rem .7rem;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.demobar button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1a1a}

header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hin{max-width:1180px;margin:0 auto;padding:.85rem 1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.65rem;margin-right:auto;text-decoration:none;color:inherit}
.logo svg{width:34px;height:34px}
.logo b{display:block;font-family:var(--display);font-size:15.5px;font-weight:600;color:var(--navy);line-height:1.1}
.logo span span{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);font-weight:600}
nav{display:flex;gap:1.25rem;font-size:14px}
nav a{color:inherit;text-decoration:none;cursor:pointer;padding-bottom:2px;border-bottom:2px solid transparent}
nav a:hover{color:var(--blue)}
nav a.on{border-bottom-color:var(--gold);color:var(--navy);font-weight:600}
.me{text-align:right;line-height:1.25}
.me b{display:block;font-size:13.5px}

main{max-width:1180px;margin:0 auto;padding:2.2rem 1.5rem 4rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.5rem}
.stack{display:flex;flex-direction:column;gap:1.4rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
h1.page{font-size:1.9rem;color:var(--navy);margin-top:.2rem}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:4px;padding:.5rem 1rem;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn.ghost{background:none;color:var(--blue);border-color:var(--line)}
.btn.ghost:hover{background:var(--lightblue);border-color:var(--blue)}

table{width:100%;border-collapse:collapse;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
th,td{padding:.6rem .9rem;text-align:left;border-bottom:1px solid var(--line)}
thead th{background:var(--surface2);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tfoot td{border-top:2px solid var(--line);font-weight:700;background:var(--surface2)}

.pill{display:inline-block;border-radius:3px;padding:.15rem .45rem;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.p-ok{background:#D8F0E3;color:var(--go)} .p-warn{background:#FDF0D8;color:var(--warn)}
.p-bad{background:#F8DEDA;color:var(--stop)} .p-info{background:var(--lightblue);color:var(--blue)}
.p-mute{background:var(--surface2);color:var(--slate)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:1rem}
.stats .card{padding:1.1rem}
.stats .v{font-family:var(--mono);font-size:1.55rem;font-variant-numeric:tabular-nums;color:var(--navy);margin-top:.2rem;line-height:1.15}
.stats .v.bad{color:var(--stop,#A93B2B)}
.sub{font-size:11.5px;color:var(--slate);margin-top:.2rem;line-height:1.4}
.owe{color:var(--stop,#A93B2B);font-weight:700}
tbody tr.owing{background:#FDF6E7}
:root[data-theme="dark"] tbody tr.owing{background:#2A2113}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tbody tr.owing{background:#2A2113}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.85rem 1.4rem;margin:.9rem 0 0}
dl.kv dt{margin-bottom:.15rem} dl.kv dd{margin:0;font-size:14px}
.note{font-size:12.5px;color:var(--slate)}
.alert{border-radius:6px;padding:1rem 1.15rem;font-size:13.5px;line-height:1.6}
.a-warn{border:1px solid #E8C98A;background:#FDF6E7} .a-bad{border:1px solid #E3B0A8;background:#FCEEEB}
.a-ok{border:1px solid #A9D8BF;background:#EDF8F2} .a-info{border:1px solid #A8CEDA;background:#EEF7FA}
:root[data-theme="dark"] .a-warn,:root[data-theme="dark"] .a-bad,:root[data-theme="dark"] .a-ok,:root[data-theme="dark"] .a-info{background:var(--surface2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .a-warn,:root:not([data-theme="light"]) .a-bad,
  :root:not([data-theme="light"]) .a-ok,:root:not([data-theme="light"]) .a-info{background:var(--surface2)}}
.alert b{color:var(--ink)}

.gate{max-width:430px;margin:4rem auto;text-align:center}
.gate input{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:5px;background:var(--paper);
  text-align:center;letter-spacing:.22em;font-family:var(--mono);font-size:16px;text-transform:uppercase}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:.7rem}
.month{border:1px solid var(--line);border-radius:6px;padding:.8rem .9rem;background:var(--surface);cursor:pointer;text-align:left}
.month:hover{border-color:var(--blue)}
.month.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.month b{display:block;font-size:14px;color:var(--navy)}
.month span{font-size:12px;color:var(--slate);font-family:var(--mono)}
.bars{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.bar{display:flex;align-items:center;gap:.7rem;font-size:13px}
.bar .bn{width:118px;flex:none;color:var(--slate);font-size:12px}
.bar .bt{flex:1;background:var(--surface2);border-radius:3px;height:15px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--blue)}
.bar .bv{width:112px;text-align:right;flex:none;font-family:var(--mono);font-size:12.5px}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tabs button{background:none;border:1px solid var(--line);border-radius:5px;padding:.45rem .85rem;font-size:12.5px;cursor:pointer;color:var(--slate)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .tabs button.on{color:var(--paper)}
.scroll{max-height:420px;overflow:auto}
@media print{.demobar,header,.tabs,.btn,.noprint{display:none!important} body{background:#fff} .card,.tw{break-inside:avoid}}
</style>
</head>
<body>

<div class="demobar">
  <b id="barTag">SAMPLE</b><span id="barText">Invented names and certificate numbers — real rate structure. Nothing here is client data.</span>
  <div class="who">
    <button data-as="employer" aria-pressed="true">Employer</button>
    <button data-as="employee" aria-pressed="false">Employee</button>
    <button id="theme">Theme</button>
  </div>
</div>

<header>
  <div class="hin">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="vN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D5361"/><stop offset="1" stop-color="#04252C"/></linearGradient>
        <linearGradient id="vB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16A5BB"/><stop offset="1" stop-color="#086274"/></linearGradient></defs>
        <path d="M32 4 L56 12.5 V30 C56 45.5 46 56.5 32 61 C18 56.5 8 45.5 8 30 V12.5 Z" fill="url(#vN)"/>
        <path d="M32 9.5 L50.7 16.2 V30 C50.7 42.4 42.5 51.6 32 55.5 C21.5 51.6 13.3 42.4 13.3 30 V16.2 Z" fill="url(#vB)" stroke="#F08A24" stroke-width="1.1"/>
        <g fill="#BDEBEA"><circle cx="22.3" cy="26.8" r="3.3"/><path d="M17.1 42.6 v-1.9 a5.2 5.2 0 0 1 10.4 0 v1.9 Z"/><circle cx="41.7" cy="26.8" r="3.3"/><path d="M36.5 42.6 v-1.9 a5.2 5.2 0 0 1 10.4 0 v1.9 Z"/></g>
        <g fill="#F08A24"><circle cx="32" cy="25" r="4.8"/><path d="M24.2 46 v-2.7 a7.8 7.8 0 0 1 15.6 0 v2.7 Z"/></g>
      </svg>
      <span><b>Ricky Rampersad Branch</b><span>Group Account · Guardian Life</span></span>
    </a>
    <nav id="nav"></nav>
    <div class="me" id="me"></div>
  </div>
</header>

<main id="main"></main>

<script>
/* ══════════════════════════════════════════════════════════════════════
   SAMPLE DATA — invented people, real structure.

   Rates, tier names, policy layout and the billing arithmetic mirror a
   live Guardian group exactly, so the page can be demonstrated to a
   prospect without a single real member on it. To run a real group,
   replace GROUP.people and the header fields; nothing else changes.
   ══════════════════════════════════════════════════════════════════════ */
const RATE = {
  lifePer1000: 0.32,        // basic life, per $1,000 of sum assured, monthly
  lifePer1000Old: 0.31,     // rate before the January increase — credits use it
  adndPer1000: 0.08,
  sumAssured: 100000,       // flat, every member
  health: { 'Employee Only':266, 'Employee + Child':558, 'Employee + Spouse':558, 'Employee + Family':806 },
  reportDays: 31            // Guardian's window for reporting a change
};

const SURNAMES=['Alleyne','Baptiste','Boodoo','Charles','Dookeran','Edwards','Francois','Gopaul','Harripersad','Isaac',
  'James','Kanhai','Lalla','Mohan','Noel','Ojoe','Persaud','Quashie','Rambharat','Samaroo','Toussaint','Umraw',
  'Villaroel','Weekes','Yearwood','Achong','Bissoon','Cudjoe','Deosaran','Emmanuel','Ferreira','Ganpat','Hosein',
  'Inniss','Joefield','Khelawan','Lezama','Maraj','Nanan','Ottley'];
const FIRSTS=['Anisa','Brandon','Chandra','Dexter','Elena','Farouk','Gita','Hakeem','Ingrid','Jerome','Kavita','Leon',
  'Marsha','Nikhil','Onika','Pooran','Quincy','Rhonda','Sunil','Tricia','Uma','Vishal','Wendy','Xavier','Yolanda',
  'Zane','Amrita','Curtis','Devika','Ellis','Fiona','Gerard','Hema','Isaiah','Jamila','Kevon','Lystra','Micah'];
const ROLES=['Cashier','Shelf Packer','Store Supervisor','Butcher','Baker','Deli Attendant','Cleaner','Security Officer',
  'Stock Clerk','Produce Attendant','Assistant Manager','Store Manager','Accounts Clerk','Driver','Warehouse Attendant'];

/* Tier mix and headcounts are set to reproduce a real August exactly:
   60 single / 30 +child / 14 +spouse / 54 family = 158 on health,
   156 on life (two people on medical with no life cover yet). */
const TIER_PLAN = [['Employee Only',60],['Employee + Child',30],['Employee + Spouse',14],['Employee + Family',54]];

function buildPeople(){
  const out=[]; let i=0;
  TIER_PLAN.forEach(([tier,n])=>{
    for(let k=0;k<n;k++,i++){
      const sn=SURNAMES[(i*7+3)%SURNAMES.length], fn=FIRSTS[(i*11+5)%FIRSTS.length];
      const yr=2004+((i*5)%21), mo=((i*7)%12)+1;
      out.push({
        cert:String(101+i).padStart(3,'0'),
        empId:'TPG0185-'+String(200+i).padStart(5,'0')+'-00',
        last:sn, first:fn, name:sn+', '+fn,
        role:ROLES[(i*3)%ROLES.length],
        started:yr+'-'+String(mo).padStart(2,'0')+'-01',
        tier, health:true, life:true
      });
    }
  });
  // two people carry medical but no life yet — the reconciliation has to find them
  out[7].life=false; out[122].life=false;
  return out;
}

const GROUP = {
  company:'Meridian Supermarkets Limited',
  groupId:'01_MERSUP001',
  lifePolicy:'TGM 1000',
  healthContract:'MERSUP001_01_MDV_14_1',
  agent:'Ricky Rampersad',
  month:'August 2026',
  issued:'2026-07-25',
  dueBy:'2026-08-01',
  people:buildPeople(),
  /* Someone who left on 30 June. Reported late, so the credits land on the
     August documents — the lag this page is built to make visible. */
  leaver:{ cert:'156', name:'Sooknanan, Petra', tier:'Employee + Family',
           lastDay:'2026-06-30', reportedOn:'2026-07-22' },
  history:[['August 2026',1],['July 2026',0],['June 2026',0],['May 2026',0],['April 2026',0],['March 2026',0]]
};

/* ── billing engine ── */
function bill(){
  const p=GROUP.people;
  const lifeLives=p.filter(x=>x.life).length;
  const healthLives=p.filter(x=>x.health).length;
  const lifeSum=lifeLives*RATE.sumAssured;
  const lifeBasic=lifeSum/1000*RATE.lifePer1000;
  const lifeAdnd=lifeSum/1000*RATE.adndPer1000;

  const tiers=Object.keys(RATE.health).map(t=>{
    const n=p.filter(x=>x.health&&x.tier===t).length;
    return {tier:t, n, rate:RATE.health[t], total:n*RATE.health[t]};
  });
  const healthGross=tiers.reduce((s,t)=>s+t.total,0);

  // the leaver's credits: life at the rate in force when she was covered
  const lifeCredit=-(RATE.sumAssured/1000*(RATE.lifePer1000Old+RATE.adndPer1000));
  const healthCredit=-RATE.health[GROUP.leaver.tier];

  return {
    lifeLives, healthLives, lifeSum,
    lifeBasic, lifeAdnd, lifeGross:lifeBasic+lifeAdnd,
    lifeCredit, lifeNet:lifeBasic+lifeAdnd+lifeCredit,
    tiers, healthGross, healthCredit, healthNet:healthGross+healthCredit,
    get combined(){ return this.lifeNet+this.healthNet; },
    get annual(){ return (this.lifeGross+this.healthGross)*12; }
  };
}

/* ── helpers ── */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

let as='employer', tab='overview', authed=false, ME=null;
/* A real employer signs in with the portal code the branch gave them — the
   branch script validates it and returns THEIR months from the Billing tab.
   LIVE holds that account; while it is set, nothing sampled is shown. */
const API = "https://script.google.com/macros/s/AKfycbzxAl-EP_stXYGHZkkxWnei6idJ04bM5ZIUKfGxDTr-cHPH7Tt9trmAYVNPzeq9k4U56w/exec";
let LIVE = null;

/* ══════════════ EMPLOYER ══════════════ */
function overview(){
  const b=bill(), L=GROUP.leaver;
  const late=days(L.lastDay,L.reportedOn);
  const carried=Math.abs(b.lifeCredit)+Math.abs(b.healthCredit);
  const noLife=GROUP.people.filter(x=>x.health&&!x.life);

  return `<div class="stack">
    <div class="head">
      <div><span class="label">Your group account</span><h1 class="page">${esc(GROUP.company)}</h1>
        <p class="note">Group ID ${esc(GROUP.groupId)} · Life ${esc(GROUP.lifePolicy)} · Servicing agent ${esc(GROUP.agent)}</p></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <a class="btn ghost" href="enroll.html">➕ Enrol an employee</a>
        <button class="btn ghost" data-go="billing">View billing</button>
      </div>
    </div>

    <div class="stats">
      <div class="card"><span class="label">Payable this month</span><div class="v">${money(b.combined)}</div>
        <p class="note">${esc(GROUP.month)} · due ${dmy(GROUP.dueBy)}</p></div>
      <div class="card"><span class="label">Employees covered</span><div class="v">${b.healthLives}</div>
        <p class="note">${b.lifeLives} on group life</p></div>
      <div class="card"><span class="label">Sum assured in force</span><div class="v">${money(b.lifeSum).replace('.00','')}</div>
        <p class="note">${money(RATE.sumAssured).replace('.00','')} each, flat</p></div>
      <div class="card"><span class="label">Annualised</span><div class="v">${money(b.annual).replace('.00','')}</div>
        <p class="note">at current membership</p></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 style="font-size:1.05rem;color:var(--navy)">🛡 Group Life &amp; AD&amp;D</h2>
        <p class="note" style="margin-top:.25rem">Policy ${esc(GROUP.lifePolicy)}</p>
        <dl class="kv">
          <div><dt class="label">Cover per employee</dt><dd class="mono">${money(RATE.sumAssured).replace('.00','')}</dd></div>
          <div><dt class="label">AD&amp;D</dt><dd class="mono">${money(RATE.sumAssured).replace('.00','')}</dd></div>
          <div><dt class="label">Rate</dt><dd class="mono">${RATE.lifePer1000.toFixed(2)} + ${RATE.adndPer1000.toFixed(2)} / $1,000</dd></div>
          <div><dt class="label">Lives</dt><dd class="mono">${b.lifeLives}</dd></div>
          <div><dt class="label">Monthly</dt><dd class="mono"><b>${money(b.lifeGross)}</b></dd></div>
          <div><dt class="label">Per employee</dt><dd class="mono">${money(b.lifeGross/b.lifeLives)}</dd></div>
        </dl>
      </div>
      <div class="card">
        <h2 style="font-size:1.05rem;color:var(--navy)">🩺 Group Health</h2>
        <p class="note" style="margin-top:.25rem">Medical, dental &amp; vision · ${esc(GROUP.healthContract)}</p>
        <div class="bars">
          ${b.tiers.map(t=>`<div class="bar"><span class="bn">${esc(t.tier.replace('Employee','Emp'))}</span>
            <span class="bt"><i style="width:${Math.round(t.total/b.healthGross*100)}%"></i></span>
            <span class="bv">${t.n} · ${money(t.total).replace('.00','')}</span></div>`).join('')}
        </div>
        <p class="note" style="margin-top:.8rem">Monthly <b class="mono">${money(b.healthGross)}</b>
          — ${Math.round(b.healthGross/(b.healthGross+b.lifeGross)*100)}% of everything you spend on benefits.</p>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1.05rem;color:var(--navy)">What needs your attention</h2>

      <div class="alert a-warn" style="margin-top:.9rem">
        <b>You paid ${money(carried)} for someone who had already left.</b>
        ${esc(L.name)} left on <b>${dmy(L.lastDay)}</b> but was reported on <b>${dmy(L.reportedOn)}</b> —
        ${late} days later. Cover ran on until it was reported, so her ${esc(L.tier.toLowerCase())} health premium
        and her life premium were both billed and are being credited back on this month's documents.
        <p style="margin-top:.5rem">Report a leaver on their last day and that money never leaves the account.
          <a href="${QUERYPAL}" target="_blank" rel="noopener">Report leavers →</a></p>
      </div>

/* ══════════ PDF READING — no library, no upload ══════════ */
/* Dependency-free PDF text extraction — the exact code that runs in the
   browser. No library, no upload: DecompressionStream for FlateDecode,
   a content-stream tokenizer for text, and /ToUnicode CMaps so subset
   fonts (Crystal Reports, most report writers) come out as real text. */
const dec = new TextDecoder('latin1');

async function inflate(bytes){
  for(const f of ['deflate','deflate-raw']){
    try{
      const ds = new DecompressionStream(f);
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(buf);
    }catch(e){}
  }
  return null;
}

/* Every object in the file, streams already decompressed. */
async function pdfObjects(bytes){
  const s = dec.decode(bytes), objs = [], out = new Map();
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while((m = re.exec(s))) objs.push({ num:+m[1], start:m.index, hdrEnd:re.lastIndex });
  for(let i=0;i<objs.length;i++){
    const from = objs[i].hdrEnd, to = (i+1<objs.length ? objs[i+1].start : s.length);
    const body = s.slice(from, to);
    const sm = body.match(/\bstream\r?\n/);
    const rec = { num:objs[i].num, dict:sm ? body.slice(0, body.indexOf(sm[0])) : body, data:null };
    if(sm){
      const dataStart = from + body.indexOf(sm[0]) + sm[0].length;
      let dataEnd = s.indexOf('endstream', dataStart);
      if(dataEnd >= 0){
        const lenM = /\/Length\s+(\d+)/.exec(rec.dict);
        if(lenM){ const L = +lenM[1]; if(dataStart + L <= dataEnd + 2) dataEnd = dataStart + L; }
        let data = bytes.subarray(dataStart, dataEnd);
        // both /Filter /FlateDecode and the array form /Filter [ /FlateDecode ]
        if(/\/Filter\s*(?:\[\s*)?\/FlateDecode/.test(rec.dict)){
          const inf = await inflate(data);
          data = inf;                      // null when it will not inflate — skipped later
        }
        rec.data = data;
      }
    }
    out.set(rec.num, rec);
  }
  return out;
}

/* /ToUnicode CMap → {code: character}. Handles bfchar and bfrange, 1- or
   2-byte codes, and the surrogate pairs report writers emit for ligatures. */
function parseCMap(text){
  const map = {}; let bytes = 1;
  const cs = /begincodespacerange([\s\S]*?)endcodespacerange/.exec(text);
  if(cs){ const f = cs[1].match(/<([0-9A-Fa-f]+)>/); if(f) bytes = Math.max(1, Math.round(f[1].length/2)); }
  const uni = h => {
    let o = '';
    for(let i=0;i<h.length;i+=4){
      const c = parseInt(h.substr(i,4), 16);
      if(!isNaN(c) && c) o += String.fromCharCode(c);
    }
    return o;
  };
  let m;
  const bc = /beginbfchar([\s\S]*?)endbfchar/g;
  while((m = bc.exec(text))){
    const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g; let r;
    while((r = rr.exec(m[1]))) map[parseInt(r[1],16)] = uni(r[2]);
  }
  const br = /beginbfrange([\s\S]*?)endbfrange/g;
  while((m = br.exec(text))){
    const rr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g; let r;
    while((r = rr.exec(m[1]))){
      const lo = parseInt(r[1],16), hi = parseInt(r[2],16);
      if(r[3]){
        const base = parseInt(r[3].slice(-4), 16);
        for(let c=lo;c<=hi && c-lo<65536;c++) map[c] = String.fromCharCode(base + (c-lo));
      }else if(r[4]){
        const list = r[4].match(/<([0-9A-Fa-f]+)>/g) || [];
        list.forEach((h,i) => { map[lo+i] = uni(h.slice(1,-1)); });
      }
    }
  }
  return { map, bytes };
}

/* resource name (/d, /F1 …) → CMap, gathered across the whole document. */
function buildFonts(objects){
  const fonts = {};
  const cmapFor = num => {
    const f = objects.get(num); if(!f) return null;
    const tu = /\/ToUnicode\s+(\d+)\s+\d+\s+R/.exec(f.dict);
    if(!tu) return null;
    const o = objects.get(+tu[1]);
    if(!o || !o.data) return null;
    return parseCMap(dec.decode(o.data));
  };
  objects.forEach(o => {
    const fd = /\/Font\s*<<([\s\S]*?)>>/.exec(o.dict);
    if(!fd) return;
    const rr = /\/([^\s\/]+)\s+(\d+)\s+\d+\s+R/g; let r;
    while((r = rr.exec(fd[1]))){
      if(fonts[r[1]]) continue;
      const cm = cmapFor(+r[2]);
      if(cm) fonts[r[1]] = cm;
    }
  });
  return fonts;
}

/* Content-stream text extraction with position tracking, so table rows can be
   rebuilt from the y coordinate. */
function textFromContent(u8, fonts){
  const s = dec.decode(u8);
  const items = [];
  let tm = [1,0,0,1,0,0], tlm = tm.slice(), leading = 12, font = null;
  const num = t => parseFloat(t);
  const raw = str => str.slice(1,-1).replace(/\\([nrtbf()\\]|[0-7]{1,3})/g, (_,c) => {
    const map = { n:'\n', r:'\r', t:'\t', b:'\b', f:'\f', '(':'(', ')':')', '\\':'\\' };
    return c in map ? map[c] : String.fromCharCode(parseInt(c,8));
  });
  const rawHex = str => {
    const h = str.slice(1,-1).replace(/\s/g,''); let o='';
    for(let i=0;i<h.length;i+=2) o += String.fromCharCode(parseInt(h.substr(i,2).padEnd(2,'0'),16));
    return o;
  };
  /* apply the active font's CMap; without one the bytes are already text */
  const decode = str => {
    if(!font || !font.map) return str;
    let o = '';
    if(font.bytes === 2){
      for(let i=0;i+1<str.length;i+=2){
        const c = (str.charCodeAt(i)<<8) | str.charCodeAt(i+1);
        o += (c in font.map) ? font.map[c] : '';
      }
    }else{
      for(let i=0;i<str.length;i++){
        const c = str.charCodeAt(i);
        o += (c in font.map) ? font.map[c] : str[i];
      }
    }
    return o;
  };
  const push = txt => { if(txt) items.push({ x:tm[4], y:tm[5], t:txt }); };
  const arrText = a => {
    let o=''; const rr = /\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>|[-+]?[\d.]+/g; let mm;
    while((mm = rr.exec(a))){
      const v = mm[0];
      if(v[0]==='(') o += decode(raw(v));
      else if(v[0]==='<') o += decode(rawHex(v));
      else if(parseFloat(v) < -120) o += ' ';
    }
    return o;
  };
  const nl = () => { tlm = [tlm[0],tlm[1],tlm[2],tlm[3],tlm[4],tlm[5]-leading]; tm = tlm.slice(); };

  const re = /\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>|\[(?:[^\][\\]|\\.)*\]|\/[^\s\/\[\]<>()]+|[-+]?[\d.]+|[A-Za-z'"*]+/g;
  const stack = []; let t;
  while((t = re.exec(s))){
    const v = t[0];
    if(v === 'BT'){ tm = [1,0,0,1,0,0]; tlm = tm.slice(); stack.length = 0; continue; }
    if(v === 'Tf'){
      const nm = stack[stack.length-2];
      if(nm && nm[0]==='/') font = (fonts && fonts[nm.slice(1)]) || null;
      stack.length = 0; continue;
    }
    if(v === 'TL'){ leading = num(stack[stack.length-1]) || 12; stack.length = 0; continue; }
    if(v === 'Td' || v === 'TD'){
      const y = num(stack.pop()), x = num(stack.pop());
      if(v === 'TD') leading = -y;
      tlm = [tlm[0],tlm[1],tlm[2],tlm[3], tlm[4]+x, tlm[5]+y];
      tm = tlm.slice(); stack.length = 0; continue;
    }
    if(v === 'Tm'){ const f = stack.slice(-6).map(num); if(f.length===6 && f.every(n=>isFinite(n))){ tlm=f; tm=f.slice(); } stack.length=0; continue; }
    if(v === 'T*'){ nl(); stack.length = 0; continue; }
    if(v === 'Tj' || v === "'" || v === '"'){
      const a = stack.pop() || '';
      if(v !== 'Tj') nl();
      push(a[0]==='(' ? decode(raw(a)) : (a[0]==='<' ? decode(rawHex(a)) : ''));
      stack.length = 0; continue;
    }
    if(v === 'TJ'){ const a = stack.pop() || ''; push(a[0]==='[' ? arrText(a) : ''); stack.length = 0; continue; }
    stack.push(v);
    if(stack.length > 40) stack.splice(0, 20);
  }
  return items;
}

/* Group text items into visual rows by y, then order by x.

   Producers use wildly different coordinate scales — the Guardian life
   billing draws a page 570 units tall, the Crystal health invoice 14,720 —
   so a fixed tolerance cannot suit both. Normalising each page to a letter
   height puts them on the same footing: in both, one table row is ~20 units
   apart, while a figure sitting fractionally off its row baseline is under 1.
   Keep the tolerance tight so real rows never merge; a figure that lands on
   its own line is paired back to its row by the caller, which is safer than
   loosening this and swallowing the row above. */
function itemsToLines(items, tol){
  if(tol == null) tol = 0.8;
  const live = items.filter(i => i.t.trim());
  const maxY = live.reduce((m,i) => Math.max(m, Math.abs(i.y)), 0);
  const scale = maxY > 0 ? maxY / 792 : 1;
  const rows = [];
  live.forEach(raw => {
    const i = { x: raw.x/scale, y: raw.y/scale, t: raw.t };
    let r = rows.find(r => Math.abs(r.y - i.y) <= tol);
    if(!r){ r = { y:i.y, cells:[] }; rows.push(r); }
    r.cells.push(i);
  });
  rows.sort((a,b) => b.y - a.y);
  return rows.map(r => {
    r.cells.sort((a,b) => a.x - b.x);
    let out = '', lastEnd = null;
    r.cells.forEach(c => {
      if(lastEnd !== null && c.x - lastEnd > 3) out += '  ';
      out += c.t;
      lastEnd = c.x + c.t.length * 4.6;
    });
    return out.replace(/\s+$/,'');
  });
}

async function pdfText(bytes, tol){
  const objects = await pdfObjects(bytes);
  const fonts = buildFonts(objects);
  let lines = [];
  objects.forEach(o => {
    if(!o.data) return;
    if(/\/Subtype\s*\/Image|\/Type\s*\/Font|\/Type\s*\/XRef|\/Type\s*\/Metadata|\/Type\s*\/FontDescriptor|FontFile/.test(o.dict)) return;
    if(/\/ToUnicode|begincmap/.test(o.dict)) return;
    const items = textFromContent(o.data, fonts);
    // Each content stream is a page: group rows per page, never across pages,
    // or every page's columns land on the same y and overlay each other.
    if(items.length) lines = lines.concat(itemsToLines(items, tol));
  });
  return lines;
}

/* Per-page positioned items, normalised to a letter-height page so one set of
   thresholds works whatever scale the producer used. Used where a row must be
   rebuilt around a known anchor (an employee id) rather than by baseline
   alone — two-column layouts and page furniture defeat line grouping. */
async function pdfPages(bytes){
  const objects = await pdfObjects(bytes);
  const fonts = buildFonts(objects);
  const pages = [];
  objects.forEach(o => {
    if(!o.data) return;
    if(/\/Subtype\s*\/Image|\/Type\s*\/Font|\/Type\s*\/XRef|\/Type\s*\/Metadata|\/Type\s*\/FontDescriptor|FontFile/.test(o.dict)) return;
    if(/\/ToUnicode|begincmap/.test(o.dict)) return;
    const items = textFromContent(o.data, fonts).filter(i => i.t.trim());
    if(!items.length) return;
    const maxY = items.reduce((m,i) => Math.max(m, Math.abs(i.y)), 0);
    const scale = maxY > 0 ? maxY / 792 : 1;
    pages.push({ items: items.map(i => ({ x:i.x/scale, y:i.y/scale, t:i.t })) });
  });
  return pages;
}


/* ══════════ GUARDIAN DOCUMENT PARSERS ══════════ */
/* Guardian group document parsers + reconciliation.

   Every parser returns what it read AND what the document says about itself,
   so the caller can check one against the other. If the arithmetic does not
   agree, the reconciliation is refused rather than shown — a wrong number
   here is worse than no number. */

const gmoney = s => { const n = parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? n : null; };
/* Guardian writes negatives three ways depending on the report writer:
   (806.00)  ($806.00)  and  $(806.00). Any bracket means a credit. */
const neg   = s => String(s).includes('(');
const amt   = s => { const v = gmoney(s); return v === null ? null : (neg(s) ? -v : v); };
const AMT   = String.raw`[$(]{0,2}[\d,]+\.\d{2}\)?`;

/* Guardian writes names two ways: "SURNAME ; GIVEN" on the life billing and
   "SURNAME, GIVEN" on the health invoice, with middle names on one and not
   the other, and maiden/married forms that differ between systems. */
function nameKey(s){
  const parts = String(s).split(/[;,]/);
  const sur = (parts[0]||'').toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w.length>1);
  const giv = (parts[1]||'').toUpperCase().replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w.length>1);
  return { sur:new Set(sur), giv, display:String(s).replace(/\s+/g,' ').trim() };
}
function samePerson(a, b){
  const surOverlap = [...a.sur].some(w => b.sur.has(w));
  if(!a.giv.length || !b.giv.length){
    /* One side has no given name because Guardian's report clipped it at the
       column edge ("MARIMOO" for MARIMOOTOO). Fall back to a prefix match on
       the surname — long enough to be meaningful, and the caller only accepts
       it when exactly one candidate matches. */
    const short = !a.giv.length ? a : b, long = !a.giv.length ? b : a;
    return [...short.sur].some(s => s.length >= 4 &&
      [...long.sur, ...long.giv].some(l => l.startsWith(s) || s.startsWith(l)));
  }
  if(surOverlap && a.giv[0] === b.giv[0]) return true;
  // maiden/married: one side carries the other's surname as a given name, or vice versa
  const aAll = new Set([...a.sur, ...a.giv]), bAll = new Set([...b.sur, ...b.giv]);
  return [...aAll].filter(w => bAll.has(w)).length >= 2;
}
/* A name Guardian's own report writer cut off at the column edge. */
/* A name Guardian's own report writer cut off at the column edge. Three
   shapes of it: no separator at all, too short to be a name, or a separator
   with nothing after it — "JOSEPH," is a surname whose given name did not
   fit, and reporting it as a rename told a client their employee had
   changed name when the truth was a short page. */
const isClipped = n => { const s = String(n||'').trim();
  return !/[,;]/.test(s) || s.length < 4 || /[,;]\s*$/.test(s); };

/* ── Group life monthly billing ── */
function parseLifeBilling(lines){
  const out = { kind:'life', policy:null, month:null, members:[], stated:{}, problems:[] };
  for(const l of lines){
    const p = /POLICY\s*NO:?\s*([A-Z]{2,4}\s?\d+)/i.exec(l);   if(p && !out.policy) out.policy = p[1].trim();
    const m = /Monthly Billing:\s*([A-Za-z]+\s*,?\s*\d{4})/i.exec(l); if(m && !out.month) out.month = m[1].replace(/\s*,\s*/,' ').trim();
    const g = /GRAND TOTAL:\s*([\d,]+\.\d{2})\s*([\d,]+\.\d{2})?\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/i.exec(l);
    if(g) out.stated = { sumAssured:gmoney(g[1]), adndSum:gmoney(g[2]||g[1]), basic:gmoney(g[3]),
                         basicExtra:gmoney(g[4]), adnd:gmoney(g[5]), adndExtra:gmoney(g[6]), total:gmoney(g[7]) };
    const lv = /No of Lives:\s*(\d+)/i.exec(l); if(lv) out.stated.lives = +lv[1];
    // 187  ABDULLAH MUHAMMED ; NADIRA  100,000.00  100,000.00  32.00  0.00  8.00  0.00  40.00
    const r = /^\s*(\d{3})\s+(.+?)\s{2,}([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s*$/.exec(l);
    if(r) out.members.push({ cert:r[1], name:r[2].replace(/\s+/g,' ').trim(),
      sumAssured:gmoney(r[3]), adndSum:gmoney(r[4]), basic:gmoney(r[5]),
      adnd:gmoney(r[7]), premium:gmoney(r[9]) });
  }
  // de-duplicate: totals pages repeat the schedule
  const seen = new Set();
  out.members = out.members.filter(m => { const k = m.cert+'|'+m.name; if(seen.has(k)) return false; seen.add(k); return true; });
  out.computed = {
    lives: out.members.length,
    sumAssured: out.members.reduce((s,m)=>s+(m.sumAssured||0),0),
    basic: out.members.reduce((s,m)=>s+(m.basic||0),0),
    adnd: out.members.reduce((s,m)=>s+(m.adnd||0),0),
    total: out.members.reduce((s,m)=>s+(m.premium||0),0)
  };
  return out;
}

/* ── Group health invoice ──
   Anchored on the member id, which is unique per row and sits in its own
   column. Baseline grouping alone loses to this document: a long name is
   drawn as two items, page footers land inside the row band, and some pages
   run two columns. Anchoring sidesteps all three. */
const TIERS = ['Employee Only','Employee+Child','Employee+Spouse','Employee+Family'];
/* A whole member id looks like TPG0185-00210-00. Guardian's report writer
   sometimes clips this column the way it clips long names, leaving TPG0185-003
   — and a row anchored on nothing at all is a member dropped in silence, which
   is worse than a member with a short id. Accept the clipped form and mark it,
   so the row is counted and the flaw is visible. */
const MEMBER_ID = /^[A-Za-z]{0,4}\d{2,6}-\d{2,6}(?:-\d{1,2})?$/;
const MEMBER_ID_FULL = /^[A-Za-z]{0,4}\d{2,6}-\d{4,6}-\d{2}$/;
const FURNITURE = /myguardiangroup|^https?:|^[tf]:|\(myGG\)|^Page\b|Printed On|Calculation Date|Standard Report|Invoice (Detail|Summary)|^\d{1,2}:\d{2}|^\d{3} \d{3} \d{4}$|Guardian Drive|Westmoorings/i;
const DATEISH = /^\d{2}-[A-Za-z]{3}-\d{4}$/;

function parseHealthPages(pages){
  const out = { kind:'health', groupId:null, month:null, members:[], credits:[], tiers:{}, stated:{}, problems:[] };
  const text = [];
  // a section runs across pages; only the first page carries its heading
  let tier = null;

  pages.forEach(pg => {
    const anchors = pg.items.filter(i => MEMBER_ID.test(i.t.trim()));
    pg.items.forEach(i => text.push(i.t));
    if(!anchors.length) return;

    // the name column: the x shared by most items sitting left of an anchor
    const lefts = {};
    anchors.forEach(a => pg.items
      .filter(i => Math.abs(i.y - a.y) < 1.2 && i.x < a.x - 40 && !FURNITURE.test(i.t) && !DATEISH.test(i.t.trim()))
      .forEach(i => { const k = Math.round(i.x); lefts[k] = (lefts[k]||0) + 1; }));
    const nameX = +Object.keys(lefts).sort((a,b) => lefts[b]-lefts[a])[0];

    // walk the page top-down so each member picks up the tier heading above it
    const ordered = pg.items.slice().sort((a,b) => b.y - a.y || a.x - b.x);
    ordered.forEach(it => {
      const flat = it.t.replace(/\s+/g,'');
      const th = TIERS.find(t => flat.startsWith(t.replace(/\s+/g,'')) && flat.length <= t.replace(/\s+/g,'').length + 4);
      if(th && !MEMBER_ID.test(it.t.trim())){ tier = th; return; }
      if(!MEMBER_ID.test(it.t.trim())) return;

      const band = pg.items.filter(i => Math.abs(i.y - it.y) < 1.4).sort((a,b) => a.x - b.x);
      const dates = band.filter(i => DATEISH.test(i.t.trim())).map(i => i.t.trim());
      /* The name sits in its own column, and a long one is drawn as two items
         continuing rightwards — so read the column from its left edge up to
         where the first date column begins. Match the id's baseline exactly
         first: where two members' names land at the same x on nearly the same
         line, the tighter test keeps them apart, and only if that finds nothing
         do we fall back to the whole band. */
      const dateX = band.filter(i => DATEISH.test(i.t.trim())).reduce((m,i) => Math.min(m, i.x), it.x);
      const inCol = i => nameX != null && i.x >= nameX - 4 && i.x < dateX - 10 && !FURNITURE.test(i.t);
      const pick = tol => band.filter(i => inCol(i) && Math.abs(i.y - it.y) <= tol)
                              .map(i => i.t).join('').replace(/\s+/g,' ').trim();
      const name = pick(0.35) || pick(1.4);
      /* Take the figure on this row's own baseline, not merely the rightmost
         one in the band. Where two members are drawn a hair apart, the loose
         band holds both their premiums, and the rightmost is as likely to be
         the neighbour's — which silently prices a family member as a single. */
      const amts = band.filter(i => i.x > it.x && new RegExp('^'+AMT+'\\s*$').test(i.t.trim()));
      const amtItem = amts.filter(i => Math.abs(i.y - it.y) <= 0.4).sort((a,b) => b.x - a.x)[0]
                   || amts.sort((a,b) => Math.abs(a.y - it.y) - Math.abs(b.y - it.y) || b.x - a.x)[0];
      const mon = band.filter(i => /^[A-Za-z]+\s+\d{4}$/.test(i.t.trim())).map(i => i.t.trim())[0] || null;
      const premium = amtItem ? amt(amtItem.t) : null;
      const rec = { name, empId:it.t.trim(), started:dates[0]||null, effective:dates[1]||null,
                    month:mon, tier, premium,
                    idClipped: !MEMBER_ID_FULL.test(it.t.trim()) };
      if(!name) out.problems.push('A row could not be read: '+rec.empId);
      if(rec.idClipped) out.problems.push('Member id cut off in the document for '+(name||rec.empId));
      if(premium !== null && premium < 0) out.credits.push(rec); else out.members.push(rec);
    });
  });

  for(const l of text){
    const gid = /Employer Group ID:\s*(\S+)/i.exec(l);           if(gid && !out.groupId) out.groupId = gid[1];
    const cov = /Coverage for:\s*([A-Za-z]+\s+\d{4})/i.exec(l);  if(cov && !out.month) out.month = cov[1];
  }
  // page-level figures come from joined lines, handled by the caller passing them in
  const seen = new Set();
  out.members = out.members.filter(m => { if(seen.has(m.empId)) return false; seen.add(m.empId); return true; });
  out.credits = out.credits.filter(m => { const k='c'+m.empId; if(seen.has(k)) return false; seen.add(k); return true; });
  TIERS.forEach(t => { out.tiers[t] = Object.assign({}, out.tiers[t], { counted: out.members.filter(m=>m.tier===t).length }); });
  out.computed = {
    lives: out.members.length,
    gross: out.members.reduce((s,m)=>s+(m.premium||0),0),
    credits: out.credits.reduce((s,m)=>s+(m.premium||0),0)
  };
  out.computed.payable = out.computed.gross + out.computed.credits;
  return out;
}
function parseHealthInvoice(lines){
  const out = { kind:'health', groupId:null, month:null, members:[], credits:[], tiers:{}, stated:{}, problems:[] };
  let tier = null;
  const isAmountOnly = s => new RegExp('^'+AMT+'$').test(s.trim());
  const ROW = new RegExp(
    String.raw`^\s*([A-Z][A-Za-z\-'\. ]*,\s*[A-Za-z\-'\. ]*?)\s{2,}(\d{2}-[A-Za-z]{3}-\d{4})\s+(\S+)\s+(\d{2}-[A-Za-z]{3}-\d{4})\s+([A-Za-z]+\s+\d{4})(?:\s+(`+AMT+`))?`);

  for(let i=0;i<lines.length;i++){
    let l = lines[i];
    const gid = /Employer Group ID:\s*(\S+)/i.exec(l);        if(gid && !out.groupId) out.groupId = gid[1];
    const cov = /Coverage for:\s*([A-Za-z]+\s+\d{4})/i.exec(l); if(cov && !out.month) out.month = cov[1];
    const cr  = /Credits\/Adjustments\s*\(\$([\d,]+\.\d{2})\)/i.exec(l); if(cr) out.stated.credits = -gmoney(cr[1]);
    /* The summary page draws a label and its figure as separate lines, and not
       always in that order, so a single-line regex finds neither. Look at the
       neighbours. Getting this wrong is not cosmetic: without stated totals
       there is nothing to check the parse against, and a short read passes as
       clean — which is exactly what it did before this. */
    const near = () => [lines[i-1], l, lines[i+1]].filter(Boolean).join('  ');
    const tot = /Total for current month\s+(\d+)\s+\$([\d,]+\.\d{2})/i.exec(l)
             || /Total for current month/i.test(l) && /(\d+)\s+\$([\d,]+\.\d{2})/.exec(near());
    if(tot){ out.stated.lives = +tot[1]; out.stated.gross = gmoney(tot[2]); }
    if(/TOTAL PAYABLE BALANCE/i.test(l) && out.stated.payable == null){
      const m = /\$([\d,]+\.\d{2})/.exec(near());
      if(m) out.stated.payable = gmoney(m[1]);
    }

    // tier headings, with or without their count appended
    const th = TIERS.find(t => l.trim().replace(/\s+/g,'') .startsWith(t.replace(/\s+/g,'')));
    if(th && !/\d{2}-[A-Za-z]{3}-\d{4}/.test(l)){
      tier = th;
      const c = /(\d+)\s*$/.exec(l.trim()); if(c) out.tiers[th] = { stated:+c[1] };
      continue;
    }
    // NAME  01-May-2018  TPG0185-00210-00  01-Jun-2024  August 2026  $266.00
    const r = ROW.exec(l);
    if(!r) continue;
    let premium = r[6] ? amt(r[6]) : null;
    // the figure sometimes lands on its own line just below its row
    if(premium === null && i+1 < lines.length && isAmountOnly(lines[i+1])) premium = amt(lines[i+1]);
    let nm = r[1].replace(/\s+/g,' ').trim();
    const stuck = TIERS.find(t => nm.replace(/\s+/g,'').endsWith(t.replace(/\s+/g,'')));
    if(stuck) nm = nm.replace(new RegExp(stuck.replace(/([+])/g,'\\$1').replace(/\s+/g,'\\s*')+'$','i'),'').trim();
    const rec = { name:nm, started:r[2], empId:r[3], effective:r[4], month:r[5], tier, premium };
    if(premium !== null && premium < 0) out.credits.push(rec); else out.members.push(rec);
  }
  const seen = new Set();
  out.members = out.members.filter(m => { const k = m.empId+'|'+m.name; if(seen.has(k)) return false; seen.add(k); return true; });
  TIERS.forEach(t => { out.tiers[t] = Object.assign({}, out.tiers[t], { counted: out.members.filter(m=>m.tier===t).length }); });
  /* The invoice prints its tier counts on the summary page, and those parse
     cleanly. Their sum is the membership it is claiming — a firmer figure than
     the one-line total, which the layout keeps splitting. */
  const tierSum = TIERS.reduce((s,t) => s + ((out.tiers[t] && out.tiers[t].stated) || 0), 0);
  if(tierSum && out.stated.lives == null) out.stated.lives = tierSum;
  out.computed = {
    lives: out.members.length,
    gross: out.members.reduce((s,m)=>s+(m.premium||0),0),
    credits: out.credits.reduce((s,m)=>s+(m.premium||0),0)
  };
  out.computed.payable = out.computed.gross + out.computed.credits;
  return out;
}

/* Tier from the premium, calibrated against the invoice's own summary.
   Count the members at each rate; where that count matches exactly one tier
   the invoice declares, the rate belongs to that tier and every member paying
   it is placed with certainty. Rates shared by two tiers keep whatever the
   section heading gave, and are marked so the display can say so. */
function calibrateTiers(doc){
  const byRate = {};
  doc.members.forEach(m => { if(m.premium != null) (byRate[m.premium] = byRate[m.premium] || []).push(m); });
  const stated = {};
  TIERS.forEach(t => { if(doc.tiers[t] && doc.tiers[t].stated != null) stated[t] = doc.tiers[t].stated; });
  const claimed = new Set();
  Object.keys(byRate).forEach(rate => {
    const n = byRate[rate].length;
    const hits = Object.keys(stated).filter(t => stated[t] === n && !claimed.has(t));
    if(hits.length === 1){
      claimed.add(hits[0]);
      byRate[rate].forEach(m => { m.tier = hits[0]; m.tierCertain = true; });
    }else{
      byRate[rate].forEach(m => { m.tierCertain = false; });
    }
  });
  /* A rate that has been claimed belongs to that tier and no other. Any member
     at a different rate still carrying that tier got it from a section heading
     a page break interrupted — leave it unknown rather than let it inflate a
     count the invoice already told us. */
  Object.keys(byRate).forEach(rate => {
    const certain = byRate[rate].some(m => m.tierCertain);
    if(certain) return;
    byRate[rate].forEach(m => { if(m.tier && claimed.has(m.tier)) m.tier = null; });
  });
  TIERS.forEach(t => { doc.tiers[t] = Object.assign({}, doc.tiers[t], { counted: doc.members.filter(m=>m.tier===t).length }); });
  doc.tierAmbiguous = doc.members.some(m => m.tierCertain === false);
  return doc;
}

/* ── Statement of adjustments ── */
function parseAdjustments(lines){
  const out = { kind:'adjustments', items:[], stated:{}, problems:[] };
  let context = '';
  for(const l of lines){
    const b = /PREMIUM DUE BEFORE ADJUSTMENTS:\s*([\d,]+\.\d{2}).*?([\d,]+\.\d{2})\s*$/i.exec(l);
    if(b) out.stated.before = gmoney(l.match(/([\d,]+\.\d{2})\s*$/)[1]);
    const a = /PREMIUM DUE AFTER ADJUSTMENT:.*?([\d,]+\.\d{2})\s*$/i.exec(l); if(a) out.stated.after = gmoney(a[1]);
    const n = /NET ADJUSTMENTS:.*?(\(?[\d,]+\.\d{2}\)?)\s*$/i.exec(l); if(n) out.stated.net = amt(n[1]);
    const c = /\b(TERMINATION|ADDITION|INCREASE|DECREASE)\b.*?AS AT/i.exec(l); if(c) context = c[1].toUpperCase();
    const d = /AS AT\s*$|^(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+\d{1,2}(ST|ND|RD|TH)?\s+\d{4}/i.exec(l.trim());
    if(d && d[1]) out.effective = l.trim();
    // 156  AMEERA KHAN  1  (100,000.00)  (100,000.00)  (31.00)  0.00  (8.00)  0.00  (39.00)
    const r = /^\s*(\d{2,4})\s+([A-Z][A-Za-z\-'\. ]+?)\s{2,}(\d+)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s+(\(?[\d,]+\.\d{2}\)?)\s*$/.exec(l);
    if(r) out.items.push({ cert:r[1], name:r[2].replace(/\s+/g,' ').trim(), periods:+r[3],
      coverage:amt(r[4]), basic:amt(r[6]), adnd:amt(r[8]), total:amt(r[10]),
      type: context || 'ADJUSTMENT', effective: out.effective || null });
  }
  out.computed = { net: out.items.reduce((s,i)=>s+(i.total||0),0) };
  return out;
}

/* ── verification: does what we read agree with what the document claims? ── */
const near = (a,b,tol=0.02) => a!=null && b!=null && Math.abs(a-b) <= tol;
function verify(doc){
  const checks = [];
  if(doc.kind === 'life'){
    checks.push(['Lives',              doc.computed.lives,      doc.stated.lives]);
    checks.push(['Total sum assured',  doc.computed.sumAssured, doc.stated.sumAssured]);
    checks.push(['Basic premium',      doc.computed.basic,      doc.stated.basic]);
    checks.push(['AD&D premium',       doc.computed.adnd,       doc.stated.adnd]);
    checks.push(['Monthly total',      doc.computed.total,      doc.stated.total]);
  }
  if(doc.kind === 'health'){
    checks.push(['Lives',   doc.computed.lives,   doc.stated.lives]);
    checks.push(['Gross',   doc.computed.gross,   doc.stated.gross]);
    checks.push(['Credits', doc.computed.credits, doc.stated.credits]);
    checks.push(['Payable', doc.computed.payable, doc.stated.payable]);
    /* Tier counts are deliberately not a pass/fail check. Two tiers share a
       rate here (+child and +spouse are both $558), so the split between them
       can only come from section headings, which page breaks interrupt. The
       gmoney is what has to reconcile; the split is shown as read. */
  }
  if(doc.kind === 'adjustments'){
    checks.push(['Net adjustment', doc.computed.net, doc.stated.net]);
    if(doc.stated.before != null && doc.stated.after != null)
      checks.push(['Before + net = after', doc.stated.before + (doc.stated.net||0), doc.stated.after]);
  }
  const results = checks.filter(c => c[2] != null)
    .map(([label,got,want]) => ({ label, got, want, ok: near(got,want) }));
  return { results, ok: results.length > 0 && results.every(r => r.ok) };
}

/* ── reading a file ──
   Report writers place a row's figures at slightly different baselines from
   its text, and by different amounts. Rather than tune one tolerance and hope,
   read the file at several and keep the parse that agrees with the totals the
   document prints on itself. If none agrees, say so — a confident wrong
   number is worse than an honest failure. */
const TOLERANCES = [0.8, 1.2, 1.6, 2.2, 3, 4, 6, 8];

const PARSERS = { life:parseLifeBilling, health:parseHealthInvoice, adjustments:parseAdjustments };

function detectKind(lines){
  const s = lines.slice(0, 80).join('\n');
  if(/STATEMENT OF ADJUSTMENT/i.test(s)) return 'adjustments';
  if(/Group Health Invoice|Employer Group ID/i.test(s)) return 'health';
  if(/Monthly Billing|POLICY\s*NO/i.test(s)) return 'life';
  return null;
}

async function readDoc(pdfText, bytes, kind){
  let best = null;
  for(const tol of TOLERANCES){
    const lines = await pdfText(bytes, tol);
    const k = kind || detectKind(lines);
    if(!k) continue;
    const doc = PARSERS[k](lines);
    const v = verify(doc);
    const score = v.results.filter(r => r.ok).length - (v.results.length - v.results.filter(r => r.ok).length);
    if(!best || score > best.score) best = { doc, verification:v, tol, kind:k, score, lines };
    if(v.ok) return { doc, verification:v, tol, kind:k, ok:true, lines };
  }
  return best ? { ...best, ok:false } : { ok:false, doc:null, verification:{ results:[], ok:false } };
}

/* ── the reconciliation itself ── */
function lev(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(!m || !n) return Math.max(m, n);
  let prev = Array.from({length:n+1}, (_,i) => i);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++)
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const flatName = k => ([...k.sur].sort().join('') + k.giv.join('')).replace(/[^A-Z]/g,'');

function reconcile(life, health){
  const L = life.members.map(m => ({ ...m, key:nameKey(m.name) }));
  const H = health.members.map(m => ({ ...m, key:nameKey(m.name) }));
  const usedH = new Set(), pairs = [];

  L.forEach(l => {
    const i = H.findIndex((h,idx) => !usedH.has(idx) && samePerson(l.key, h.key));
    if(i >= 0){ usedH.add(i); pairs.push({ life:l, health:H[i], how:'exact' }); }
  });

  /* Guardian's life and health systems are separate, and the same person is
     often spelled differently in each — SUKBIR against SOOKBIR, MC PHERSON
     against MCPHERSON, JANKIE against JANKEE. Those are the same employee, and
     saying so is more useful than reporting them as missing from both plans.
     Only accept a near-match when it is unambiguously the closest one. */
  const spelling = [];
  L.filter(l => !pairs.some(p => p.life === l)).forEach(l => {
    const a = flatName(l.key);
    if(a.length < 6) return;
    const scored = H.map((h,idx) => ({ h, idx, d:lev(a, flatName(h.key)) }))
                    .filter(x => !usedH.has(x.idx))
                    .sort((x,y) => x.d - y.d);
    const best = scored[0];
    if(!best) return;
    const limit = Math.max(2, Math.floor(a.length * 0.15));
    const clear = !scored[1] || scored[1].d > best.d + 1;
    if(best.d <= limit && clear){
      usedH.add(best.idx);
      pairs.push({ life:l, health:best.h, how:'spelling', distance:best.d });
      spelling.push({ life:l, health:best.h });
    }
  });

  const lifeOnly   = L.filter(l => !pairs.some(p => p.life === l));
  const healthOnly = H.filter((h,i) => !usedH.has(i));
  return { pairs, spelling, lifeOnly, healthOnly,
           bothCount:pairs.length, lifeCount:L.length, healthCount:H.length };
}

/* ── what the lag cost ── */
function leakage(adjustments, health){
  const out = [];
  (adjustments.items||[]).forEach(a => {
    if(a.total >= 0) return;
    out.push({ name:a.name, cert:a.cert, type:a.type, effective:a.effective,
               life:Math.abs(a.total), health:0 });
  });
  (health.credits||[]).forEach(c => {
    const k = nameKey(c.name);
    const hit = out.find(o => samePerson(nameKey(o.name), k));
    if(hit) hit.health = Math.abs(c.premium);
    else out.push({ name:c.name, cert:null, type:'CREDIT', effective:c.month,
                    life:0, health:Math.abs(c.premium) });
  });
  out.forEach(o => o.total = o.life + o.health);
  return { items:out, total:out.reduce((s,o)=>s+o.total,0) };
}

/* ══════════════ CHECK MY MONTH ══════════════
   Drop in the documents Guardian sends and the page reads them here, in the
   browser. Nothing is uploaded: no member's name, salary or certificate
   number leaves the machine, which is the only way this is safe to run on a
   real group from a public site. */
let CHECK = { files:[], docs:{}, busy:false, error:null };

async function checkFiles(fileList){
  CHECK = { files:[], docs:{}, busy:true, error:null }; render();
  try{
    for(const f of fileList){
      const bytes = new Uint8Array(await f.arrayBuffer());
      const pages = await pdfPages(bytes);
      const flat  = await pdfText(bytes, 0.8);
      const kind  = detectKind(flat);
      let doc = null, ver = null;
      if(kind === 'health'){
        doc = parseHealthPages(pages);
        const summary = parseHealthInvoice(flat);
        doc.stated = summary.stated; doc.groupId = doc.groupId || summary.groupId; doc.month = doc.month || summary.month;
        Object.keys(summary.tiers).forEach(t => { if(summary.tiers[t] && summary.tiers[t].stated != null){
          doc.tiers[t] = doc.tiers[t] || {}; doc.tiers[t].stated = summary.tiers[t].stated; } });
        calibrateTiers(doc); ver = verify(doc);
      }else if(kind){
        const r = await readDoc(pdfText, bytes, kind);
        doc = r.doc; ver = r.verification;
      }
      CHECK.files.push({ name:f.name, size:f.size, kind, ok: ver ? ver.ok : false });
      if(kind && doc) CHECK.docs[kind] = { doc, ver };
    }
  }catch(e){ CHECK.error = String(e && e.message || e); }
  CHECK.busy = false; render();
}

    ${(rec && L.ver.ok && H.ver.ok)?`<div class="card">

      <div class="grid2" style="margin-top:.9rem">
        <div>
          <span class="label">On life, not on health (${rec.lifeOnly.length})</span>

            ${rec.lifeOnly.map(m=>`<tr><td class="mono">${esc(m.cert||'')}</td><td>${esc(m.name)}</td></tr>`).join('')}
          </tbody></table></div>`:'<p class="note" style="margin-top:.4rem">Nobody.</p>'}
        </div>
        <div>
          <span class="label">On health, not on life (${rec.healthOnly.length})</span>
          ${rec.healthOnly.length?`<div class="tw" style="margin-top:.4rem"><table><tbody>

function render(){

/* ══════════════ PENDING APPLICATIONS, AND LEAVERS ══════════════
   Both read from the branch's own Salesforce records — the same records the
   month-end billing is checked against, so an employer and the branch are
   never looking at two different answers.

   The honest part is the clock. A pending application's only interesting
   fact is how long it has been pending, and an employer who cannot see that
   has been given a list, not a status. So the age leads, and anything past
   ninety days is called what it is instead of being coloured "in progress".

   Nothing here is editable. Reporting a leaver goes through the form, which
   reaches the department; a page that let a client change a policy status
   would be a page that could lose somebody their cover. */
let GV = null, GV_STATE = 'idle';   // idle | loading | ready | off | error
let GV_WHY = '';

async function loadGroupView(code, pw){
  if(!API){ GV_STATE = 'off'; GV_WHY = 'Not connected to the branch.'; return; }
  GV_STATE = 'loading'; if(tab==='pending'||tab==='leavers') render();
  try{
    const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'groupview', code, password: pw || '' }) });
    const d = await r.json();
    if(d && d.ok && d.shown){ GV = d; GV_STATE = 'ready'; }
    else { GV_STATE = 'off'; GV_WHY = (d && (d.why || d.error)) || 'Not available yet.'; }
  }catch(e){ GV_STATE = 'error'; GV_WHY = 'Could not reach the branch just now.'; }
  if(tab==='pending'||tab==='leavers') render();
}

const gvAge = d => d == null ? '' : d < 1 ? 'today' : d === 1 ? '1 day'
  : d < 60 ? d + ' days' : d < 730 ? Math.round(d/30) + ' months' : (d/365).toFixed(1) + ' years';

function gvShell(title, blurb, body){
  return `<p class="label">${esc(LIVE ? LIVE.name : GROUP.company)}</p>
    <h1 class="page">${esc(title)}</h1>
    <p class="note" style="margin:.3rem 0 1.2rem;max-width:62ch">${blurb}</p>${body}`;
}
/* The card on its own, so a view that has something else to show — the
   Report a leaver door, which works whether or not the record loaded — can
   place it without the page furniture around it. */
function gvCard(){
  if(GV_STATE === 'loading') return `<div class="card"><p class="note">Reading the branch record…</p></div>`;
  return `<div class="card">
    <p>${GV_STATE === 'error'
      ? 'The branch record could not be reached just now. Your billing is unaffected — try this tab again in a moment.'
      : 'This is not switched on for your account yet. Your branch turns it on once they have been through the records; ask them and they will.'}</p>
    ${GV_WHY ? `<p class="note" style="margin-top:.5rem">${esc(GV_WHY)}</p>` : ''}</div>`;
}
function gvWaiting(title, blurb){ return gvShell(title, blurb, gvCard()); }

function pending(){
  const title = 'Pending applications';
  const blurb = 'Members whose application is in and who are not yet on cover. Read from the branch’s '
    + 'own records, so what you see here is what we see.';
  if(GV_STATE !== 'ready') return gvWaiting(title, blurb);
  const rows = GV.pending || [];
  if(!rows.length) return gvShell(title, blurb, `<div class="card">
    <p><b>Nothing is pending.</b> Every member on your account is either on cover or has been closed off.</p>
    <p class="note" style="margin-top:.5rem">New applications appear here as soon as they reach us.</p></div>`);
  const stale = rows.filter(r => r.stale);
  return gvShell(title, blurb, `
    <div class="stats" style="margin-bottom:1rem">
      <div class="card"><span class="label">Waiting</span><div class="v">${rows.length}</div>
        <div class="note">${rows.filter(r=>r.line==='life').length} life · ${rows.filter(r=>r.line==='health').length} health</div></div>
      <div class="card"><span class="label">Longest waiting</span><div class="v">${esc(gvAge(rows[0].days))}</div>
        <div class="note">${esc(rows[0].name)}</div></div>
      <div class="card"><span class="label">Over 90 days</span><div class="v">${stale.length}</div>
        <div class="note">${stale.length ? 'we are chasing these' : 'none'}</div></div>
    </div>
    ${stale.length ? `<div class="card" style="border-color:var(--gold);margin-bottom:1rem">
      <b>${stale.length === 1 ? 'One application has' : stale.length + ' applications have'} been waiting more than
      ninety days.</b> That is longer than it should take. We are going through these with Guardian, and your
      account executive will come back to you on each one.</div>` : ''}
    <div class="card" style="overflow-x:auto"><table><thead><tr>
      <th>Member</th><th>Cover</th><th>Since</th><th class="r">Waiting</th><th>Where it is</th></tr></thead><tbody>
      ${rows.map(r => `<tr>
        <td><b>${esc(r.name)}</b>${r.policy ? `<br><span class="note mono">${esc(r.policy)}</span>` : ''}</td>
        <td>${r.line === 'health' ? '🩺 Group Health' : '🛡 Group Life'}</td>
        <td>${esc(r.since || '—')}</td>
        <td class="r mono"${r.stale ? ' style="color:var(--gold);font-weight:700"' : ''}>${esc(gvAge(r.days))}</td>
        <td>${esc(r.status || 'With Guardian')}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note" style="margin-top:.7rem">Read ${esc(String(GV.read||'').slice(0,10))}. A member stays on this
      list until cover starts — at which point they appear on your next billing.</p>`);
}

/* The four stages a termination moves through. Two are things a person
   does; two are observed, because a stage somebody can claim is a stage
   that gets claimed. SETTLED is the only one that means the employer has
   stopped paying for somebody who left — so it is the one drawn boldest. */
const TERM_STAGES = [
  ['REPORTED', 'You told us',            'we have it'],
  ['SENT',     'With Guardian',          'passed to the department'],
  ['ACTIONED', 'Cover ended',            'our record shows it'],
  ['SETTLED',  'Off your billing',       'credit applied']
];
function termBar(state){
  const at = TERM_STAGES.findIndex(x => x[0] === String(state||'').toUpperCase());
  return `<div class="tstages">${TERM_STAGES.map(([k,label,sub],i) => `
    <div class="tstage ${i < at ? 'done' : i === at ? 'now' : 'todo'}">
      <span class="tdot">${i < at ? '✓' : i === at ? '●' : ''}</span>
      <span class="tlabel">${esc(label)}</span>
      <span class="tsub">${esc(sub)}</span>
    </div>`).join('')}</div>`;
}

function leavers(){
  const title = 'Terminations';
  const blurb = 'Members whose cover has ended, and where each one has reached. Report a leaver on their last '
    + 'day and the premium stops there — leave it a month and you pay for cover nobody was using.';
  const report = `<div class="card" style="margin-bottom:1rem">
      <b>Somebody left?</b> Tell us on their last day.
      <p style="margin-top:.4rem"><a class="btn" href="${QUERYPAL}" target="_blank" rel="noopener">Report a leaver →</a></p>
      <p class="note" style="margin-top:.5rem">It reaches the department the same day, the member gets their
        conversion offer, and the credit shows on your next billing.</p></div>`;
  if(GV_STATE !== 'ready') return gvShell(title, blurb, report + gvCard());

  const tracked = (GV.tracked || []);
  const open = tracked.filter(t => t.state !== 'SETTLED');
  const done = tracked.filter(t => t.state === 'SETTLED');
  const ended = GV.ended || [];

  const inflight = open.length ? `<h2 style="font-size:1.05rem;color:var(--navy);margin:1.4rem 0 .3rem">In progress</h2>
    <p class="note" style="margin-bottom:.8rem">${open.length === 1 ? 'One termination is' : open.length + ' terminations are'}
      on the way. Until the last stage, the premium is still being charged.</p>
    ${open.map(t => `<div class="card" style="margin-bottom:.8rem">
      <div class="trow"><div>
        <b>${esc(t.member)}</b>
        <div class="note">${t.line === 'health' ? '🩺 Group Health' : '🛡 Group Life'}
          · last day ${esc(t.lastDay || '—')}${t.reason ? ' · ' + esc(t.reason) : ''}</div>
      </div><div class="note" style="text-align:right">reported ${esc(t.at || '')}<br>by ${esc(t.by || '')}</div></div>
      ${termBar(t.state)}
    </div>`).join('')}` : '';

  const settled = done.length ? `<h2 style="font-size:1.05rem;color:var(--navy);margin:1.4rem 0 .3rem">Completed</h2>
    <div class="card" style="overflow-x:auto"><table><thead><tr>
      <th>Member</th><th>Cover</th><th>Last day</th><th>Reported</th><th>Off your billing</th></tr></thead><tbody>
      ${done.map(t => `<tr><td><b>${esc(t.member)}</b></td>
        <td>${t.line === 'health' ? '🩺 Group Health' : '🛡 Group Life'}</td>
        <td>${esc(t.lastDay || '—')}</td><td>${esc(t.at || '—')}</td>
        <td>${esc(t.settledAt || '—')}</td></tr>`).join('')}
    </tbody></table></div>` : '';

  const history = ended.length ? `<h2 style="font-size:1.05rem;color:var(--navy);margin:1.4rem 0 .3rem">Earlier</h2>
    <p class="note" style="margin-bottom:.8rem">Cover that ended before we began tracking each one through.</p>
    <div class="card" style="overflow-x:auto"><table><thead><tr>
      <th>Member</th><th>Cover</th><th>Ended as</th><th>Recorded</th></tr></thead><tbody>
      ${ended.map(r => `<tr>
        <td><b>${esc(r.name)}</b>${r.policy ? `<br><span class="note mono">${esc(r.policy)}</span>` : ''}</td>
        <td>${r.line === 'health' ? '🩺 Group Health' : '🛡 Group Life'}</td>
        <td>${esc(r.status)}</td>
        <td>${esc(r.statusAt || r.modified || '—')}</td></tr>`).join('')}
    </tbody></table></div>` : '';

  if(!inflight && !settled && !history) return gvShell(title, blurb, report + `<div class="card">
    <p><b>Nothing has ended on your account.</b> Every member we hold is on cover.</p></div>`);

  return gvShell(title, blurb, report + inflight + settled + history + `
    <p class="note" style="margin-top:.9rem">A termination is finished when three things are true: you have told
      us, our record shows the cover ended, and the member is off your billing with the credit applied. The last
      two are not ticked by hand — we read them off the record and off the billing itself.</p>`);
}

/* ══════════════ PENSION ══════════════
   The branch runs company-owned Section 134 pensions on its own site —
   pensionplanstt.netlify.app — which enrols a member, chases both sides
   through five steps, and hands the case to Head Office. That works; it is
   not rebuilt here.

   What this tab does is the half that site cannot do: read the branch's own
   record of what a company already HAS. One door for the employer either
   way, so they are not keeping two sets of codes and two ideas of who is
   covered. */
const PENSIONSITE = 'https://pensionplanstt.netlify.app';

function pension(){
  const title = 'Pension';
  const blurb = 'Your company-owned pension — what is in force on our record, and the door to enrol '
    + 'somebody new.';
  const enrol = `<div class="card" style="margin-bottom:1rem">
      <b>Enrolling somebody?</b> The pension plan has its own two-sided process — you complete the
      company’s part, it goes straight to the employee for theirs, and you both watch the same five steps.
      <p style="margin-top:.5rem">
        <a class="btn" href="${PENSIONSITE}" target="_blank" rel="noopener">Open the pension plan →</a></p>
      <p class="note" style="margin-top:.5rem">Sign in there with the company code the branch gave you.
        Your employees use their own code on the employee door.</p></div>`;
  if(GV_STATE !== 'ready') return gvShell(title, blurb, enrol + gvCard());

  const P = GV.pension || { monthly:0, priced:0, total:0 };
  if(!P.total) return gvShell(title, blurb, enrol + `<div class="card">
    <p><b>Nothing on our pension record for you yet.</b> If a plan is being set up, it appears here
    once the first member is on cover.</p></div>`);

  /* Guardian fills the monthly contribution on some pension records and not
     others. Reporting a total that covers a third of the members as though
     it were the whole schedule would be worse than reporting none, so the
     coverage is stated beside the figure. */
  const partial = P.priced < P.total;
  return gvShell(title, blurb, enrol + `
    <div class="stats" style="margin-bottom:1rem">
      <div class="card"><span class="label">Members on cover</span><div class="v">${P.total}</div>
        <div class="note">company-owned policies</div></div>
      <div class="card"><span class="label">Monthly contribution</span>
        <div class="v">${P.monthly ? money(P.monthly) : '—'}</div>
        <div class="note">${partial
          ? P.priced + ' of ' + P.total + ' records carry a figure'
          : 'all ' + P.total + ' records'}</div></div>
      <div class="card"><span class="label">Enrolling now</span>
        <div class="v">${(GV.pending||[]).filter(r=>r.line==='pension').length}</div>
        <div class="note">not yet on cover</div></div>
    </div>
    ${partial ? `<div class="card" style="border-color:var(--gold);margin-bottom:1rem">
      <b>That contribution figure is not the whole schedule.</b> Guardian has filled the monthly
      contribution on ${P.priced} of your ${P.total} records, so what you see above covers those only.
      We are having the rest filled in — until then, your deduction schedule is the one to work from,
      not this.</div>` : ''}
    <p class="note">A company-owned pension is one policy per employee, owned by the company under
      Section 134. Members joining or leaving go through the pension plan, not the health and life
      forms.</p>`);
}

function gate(){
  return `<div class="card gate">
    <h1 style="font-size:1.4rem;color:var(--navy)">Group account</h1>
    <p class="note" style="margin:.5rem 0 1.1rem">Company administrators: sign in with the login and password the
      branch gave you — you will see your own company's billing and nothing else.</p>
    <input id="code" placeholder="LOGIN" autocomplete="off">
    <input id="pw" type="password" placeholder="PASSWORD" autocomplete="off" style="margin-top:.6rem">
    <button class="btn" style="width:100%;margin-top:.8rem" data-signin>Sign in</button>
    <p class="note" id="gerr" style="margin-top:.8rem;min-height:1.2em"></p>
    <p class="note" style="margin-top:.4rem">Sample codes — <b>GROUP26</b> for the employer, <b>STAFF26</b> for an employee.</p>
  </div>`;
}

function signIn(code, pw){
  code=(code||'').trim().toUpperCase();
  if(code==='GROUP26'){ LIVE=null; as='employer'; tab='overview'; authed=true; }
  else if(code==='STAFF26'){ LIVE=null; as='employee'; tab='mycover'; ME=GROUP.people[3]; authed=true; }
  else if(API && code){
    /* A real company administrator: the branch script checks the login and
       password against the Access tab and answers with THEIR months only. */
    $('gerr').textContent='Checking…';
    fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'signin', code:code, password:pw||'' }) })
      .then(r => r.json())
      .then(d => {
        if(d && d.ok && d.role === 'client'){
          LIVE = { gid:d.company, name:d.company || 'Your company',
                   admin:d.name, rows:(d.rows||[]).map(liveRow).filter(Boolean) };
          as='employer_live'; tab='history'; authed=true; syncBar(); render();
          /* The roster is a second, slower call on purpose: Salesforce being
             slow or down must never stand between a client and their door. */
          loadGroupView(code, pw);
        } else if(d && d.ok){
          $('gerr').textContent='That is a branch login — staff sign in on the portal, not here.';
        } else {
          $('gerr').textContent=(d && d.error) || 'Not recognised — check the login and password, or ask the branch.';
        }
      })
      .catch(() => { $('gerr').textContent='Could not reach the branch just now — try again in a moment.'; });
    return;
  }
  else { $('gerr').textContent='Not recognised — check the login and password, or ask the branch.'; return; }
  syncBar(); render();
}

/* The sheet stores the month as its label; the renderer keys on an ISO first
   of month. A row whose month cannot be read is dropped rather than shown
   under a wrong date. */
function liveRow(r){
  const d = new Date(String(r.month||'') + ' 1');
  if(isNaN(+d)) return null;
  const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01';
  return { month: iso, line: r.line || '', invoice: r.invoice || '',
           billed: +r.billed || 0, paid: +r.paid || 0,
           paidOn: r.paidOn || null, method: r.method || null,
           receipt: r.receipt || null, note: r.note || '' };
}
function syncBar(){ document.querySelectorAll('[data-as]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.as===as))); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-as],[data-signin],#theme'); if(!t) return;
  if(t.id==='theme'){ const r=document.documentElement;
    r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark'; return; }
  if(t.dataset.as){ as=t.dataset.as; authed=true; ME=GROUP.people[3]; tab=TABS[as][0][0]; syncBar(); render(); return; }
  if(t.hasAttribute('data-signin')){ signIn($('code').value, $('pw') ? $('pw').value : ''); return; }
  if(t.dataset.go){ tab=t.dataset.go; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='code') signIn(e.target.value); });

render();
</script>
</body>
</html>
