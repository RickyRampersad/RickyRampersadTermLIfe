<!doctype html>
<!-- The production wall moved to /board/production.html when /wall/ became
     the KPI wall's address. A TV pointed at the old link keeps working
     through this stub — GitHub Pages ignores netlify.toml, so the redirect
     has to be a real file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0; url=/board/production.html">
<title>RRB · Production Wall</title>
<script>location.replace("/board/production.html");</script>
</head>
<body style="background:#061c31;color:#eaf4ff;font-family:system-ui;display:flex;
             align-items:center;justify-content:center;height:100vh;margin:0">
<p>Opening the production wall… <a href="/board/production.html" style="color:#37b1ec">continue</a></p>
<!-- rrb-views -->
<script>
(function(){var u='RRB_VIEWS_URL';if(u.indexOf('http')!==0)return;try{
(new Image()).src=u+'?p='+encodeURIComponent(location.pathname)+'&r='+encodeURIComponent((document.referrer||'').slice(0,200))+'&z='+Date.now();
}catch(e){}})();
</script>
</body>
</html>
