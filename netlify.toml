# Netlify configuration for the Ricky Rampersad Branch site.

# Static site: the repository root is published as-is. The only server-side
# code is in netlify/functions (see PENSION-SETUP.md).
[build]
  publish = "."
  functions = "netlify/functions"

# Short personal links: /r/<token> → renewal portal with the token attached.
# These are the links stored in the Google Sheet's "Portal Link" column.
[[redirects]]
  from = "/r/*"
  to = "/renewal/?t=:splat"
  status = 302

# Convenience: /renew also opens the portal.
[[redirects]]
  from = "/renew"
  to = "/renewal/"
  status = 302

# Convenience: /pension opens the pension application wizard.
[[redirects]]
  from = "/pension"
  to = "/pension/"
  status = 301

# ── pensionplantt.com ────────────────────────────────────────────────────────
# The pension wizard has its own domain. Add pensionplantt.com and
# www.pensionplantt.com to this Netlify site (Domain management → Add domain),
# and these rules serve the wizard at the root of that domain while the rest of
# the site stays on its own domain. See PENSION-SETUP.md for the DNS records.
#
# RIA's endpoint has to be matched FIRST — the catch-all below would otherwise
# rewrite /api/pension-ai into /pension/api/pension-ai and the assistant would
# 404 on this domain only.
[[redirects]]
  from = "https://pensionplantt.com/api/pension-ai"
  to = "/.netlify/functions/pension-ai"
  status = 200
  force = true

[[redirects]]
  from = "https://www.pensionplantt.com/api/pension-ai"
  to = "/.netlify/functions/pension-ai"
  status = 200
  force = true

# Everything else on the domain is the wizard. status 200 rewrites rather than
# redirects, so the address bar keeps showing pensionplantt.com.
[[redirects]]
  from = "https://pensionplantt.com/*"
  to = "/pension/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.pensionplantt.com/*"
  to = "/pension/:splat"
  status = 200
  force = true

[[headers]]
  for = "/renewal/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The wizard holds client data in the browser only — keep it out of frames and
# out of referrer headers.
[[headers]]
  for = "/pension/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The blank Guardian forms and the PDF engine are ~2.9 MB and never change
# without a filename change, so let the browser keep them for a year.
[[headers]]
  for = "/pension/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
